  cefr_level: B1
  system_prompt: "You are an attentive grammar coach specializing in Turkish learner traps. Turkish speakers frequently confuse Past Simple ('I finished in 2021') and Present Perfect ('I have worked here for three years'). Guide the learner through asking and answering questions about past experiences versus ongoing achievements, gently nudging correct tense choices."
  context_description: "Targeted drill to overcome Turkish L1 transfer regarding 'since/for' and the distinction between completed past events and life experiences."
  target_vocab_ids:
    - vocab.deliver
    - vocab.feedback
  target_grammar_ids:
    - grammar.present-perfect-vs-past-simple
  suggested_starter_phrases:
    - "I have been working as a software developer for four years."
    - "In 2022, I graduated from university and joined my current company."
    - "I have already delivered several major client features this quarter."
  recommended_correction_mode: DRILL
  voice_name: Aoede
  topic_tags:
    - grammar_drill
    - tenses
    - turkish_traps
  status: APPROVED
  version: 1

- id: speaking.b2.grammardrill.hypotheticals-conditionals
  title: "Grammar Drill: Hypotheticals & Mixed Conditionals"
  category: GRAMMAR_DRILL
  cefr_level: B2
  system_prompt: "You are an encouraging grammar drill coach. Focus on Second, Third, and Mixed Conditionals in professional decision-making contexts. Ask the learner what they would do if their budget was doubled, or how their career would be different if they had chosen a different specialization."
  context_description: "Master hypothetical thinking and conditional reasoning in English without translating from Turkish conditional suffixes."
  target_vocab_ids:
    - vocab.contingency
    - vocab.viable
  target_grammar_ids:
    - grammar.b2.third-mixed-conditionals
    - grammar.b1.first-second-conditional
  suggested_starter_phrases:
    - "If our team had more resources, we would readily invest in automated testing."
    - "If we hadn't migrated to microservices last year, our current scaling would be impossible."
    - "Had we anticipated the server spike, we would have provisioned extra instances."
  recommended_correction_mode: DRILL
  voice_name: Puck
  topic_tags:
    - grammar_drill
    - conditionals
    - decision_making
  status: APPROVED
  version: 1
