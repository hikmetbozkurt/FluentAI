- id: chunk.a2.bridge.because-of
  chunk_en: because of...
  pattern_template: '[Main Clause] + because of + [Noun Phrase]'
  cefr_level: A2
  category: CONVERSATION_BRIDGE
  intent_tr: Bir isim grubuyla neden belirtmek ('... yüzünden / nedeniyle')
  meaning_en: Links a result to a noun phrase cause rather than a full clause.
  turkish_trap:
    incorrect_en: The flight was delayed because heavy snow.
    correct_en: The flight was delayed because of heavy snow.
    explanation_tr: '''Because'' arkasından tam cümle alır; tek başına isim grubu geliyorsa mutlaka ''because of'' kullanılır.'
    trap_type: preposition_vs_conjunction
