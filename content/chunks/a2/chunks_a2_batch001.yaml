- id: chunk.a2.starter.i-would-like-to
  chunk_en: I would like to...
  pattern_template: I would like to + [Base Verb] + [Object]
  cefr_level: A2
  category: SENTENCE_STARTER
  intent_tr: Kibar bir şekilde bir şey istemek veya hedef belirtmek
  meaning_en: Polite, professional way to state a request, preference, or plan.
  turkish_trap:
    incorrect_en: I would like booking a meeting room.
    correct_en: I would like to book a meeting room.
    explanation_tr: '''Would like'' yapısından sonra fiil ''-ing'' ile değil mutlaka ''to + yalın fiil'' ile gelir.'
    trap_type: infinitive_vs_gerund
  blueprint_slots:
  - role: SUBJECT
    label: Who
    text_en: I
    text_tr: Ben
  - role: VERB_BRIDGE
    label: Polite desire
    text_en: would like to schedule
    text_tr: planlamak istiyorum
  - role: OBJECT
    label: What
    text_en: a short call tomorrow
    text_tr: yarın kısa bir görüşme
  slot_variations:
  - slot_en: a short call tomorrow
    full_sentence_en: I would like to schedule a short call tomorrow.
    full_sentence_tr: Yarın kısa bir görüşme planlamak istiyorum.
  - slot_en: the project timeline
    full_sentence_en: I would like to confirm the project timeline today.
    full_sentence_tr: Proje takvimini bugün teyit etmek istiyorum.
  - slot_en: a window seat
    full_sentence_en: I would like to request a window seat, please.
    full_sentence_tr: Cam kenarı bir koltuk rica etmek istiyorum.
  topic_tags:
