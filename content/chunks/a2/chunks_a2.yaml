    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "'m trying to finish", text_tr: "bitirmeye çalışıyorum" }
    - { role: OBJECT, label: "What", text_en: "this report", text_tr: "bu raporu" }
    - { role: TIME_PLACE, label: "When", text_en: "before lunch", text_tr: "öğleden önce" }
  slot_variations:
    - { slot_en: "finish this report", full_sentence_en: "I'm trying to finish this report before lunch.", full_sentence_tr: "Öğleden önce bu raporu bitirmeye çalışıyorum." }
    - { slot_en: "improve my speaking", full_sentence_en: "I'm trying to improve my speaking every morning.", full_sentence_tr: "Her sabah konuşmamı geliştirmeye çalışıyorum." }
    - { slot_en: "find a quiet room", full_sentence_en: "I'm trying to find a quiet room for the call.", full_sentence_tr: "Görüşme için sessiz bir oda bulmaya çalışıyorum." }
