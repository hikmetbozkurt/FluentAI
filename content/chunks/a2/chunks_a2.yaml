  pattern_template: "[Subject] + am/is/are trying to + [Base Verb]"
  cefr_level: A2
  category: SENTENCE_STARTER
  intent_tr: "Bir şey yapmaya çalıştığını söylemek"
  meaning_en: "Used to say you are making an effort to do something right now or around this time."
  turkish_trap:
    incorrect_en: "I try to finish this report now."
    correct_en: "I'm trying to finish this report now."
    explanation_tr: "Türkçede şimdiki zaman için doğrudan 'çalışıyorum' deriz; İngilizcede şu an süren çaba için 'am/is/are trying to + fiil' kalıbı kullanılır."
