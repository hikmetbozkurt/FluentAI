- id: chunk.b2.collocation.strike-a-balance
  chunk_en: "strike a balance between..."
  pattern_template: "[Subject] + need to + strike a balance between + [A] + and + [B]"
  cefr_level: B2
  category: ACTION_COLLOCATION
  intent_tr: "İki şey arasında sağlıklı bir denge kurmak"
  meaning_en: "To find a sensible compromise between two competing priorities."
  turkish_trap:
    incorrect_en: "We must do a balance between cost and quality."
    correct_en: "We must strike a balance between cost and quality."
    explanation_tr: "Türkçede 'denge kurmak' ifadesi İngilizcede 'do a balance' değil 'strike a balance' veya 'find a balance' şeklinde kullanılır."
    trap_type: collocation_transfer
  blueprint_slots:
    - { role: SUBJECT, label: "Who", text_en: "Managers", text_tr: "Yöneticiler" }
    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "need to strike a balance", text_tr: "denge kurmalıdır" }
    - { role: OBJECT, label: "Between", text_en: "between autonomy and oversight", text_tr: "özerklik ile denetim arasında" }
  slot_variations:
    - { slot_en: "autonomy and oversight", full_sentence_en: "Managers need to strike a balance between autonomy and oversight.", full_sentence_tr: "Yöneticiler özerklik ile denetim arasında bir denge kurmalıdır." }
    - { slot_en: "speed and quality", full_sentence_en: "Engineering teams must strike a balance between speed and quality.", full_sentence_tr: "Mühendislik ekipleri hız ile kalite arasında denge kurmalıdır." }
    - { slot_en: "work and personal rest", full_sentence_en: "It takes discipline to strike a balance between work and personal rest.", full_sentence_tr: "İş ile kişisel dinlenme arasında denge kurmak disiplin gerektirir." }
  topic_tags: [workplace, ielts]
  status: PUBLISHED
  version: 1

- id: chunk.b2.frame.had-better-vs-should
