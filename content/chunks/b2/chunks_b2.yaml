- id: chunk.b2.ielts.by-contrast
  chunk_en: "By contrast,..."
  pattern_template: "By contrast, + [Subject] + [Verb]"
  cefr_level: B2
  category: IELTS_ACADEMIC_FRAME
  intent_tr: "Buna karşılık / aksine..."
  meaning_en: "Highlights a clear difference between two groups, trends, or approaches."
