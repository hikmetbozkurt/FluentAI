    - { slot_en: "choosing a cloud provider", full_sentence_en: "When it comes to choosing a cloud provider, reliability is key.", full_sentence_tr: "Bulut sağlayıcı seçerken güvenilirlik belirleyicidir." }
    - { slot_en: "learning vocabulary", full_sentence_en: "When it comes to learning vocabulary, context beats rote lists.", full_sentence_tr: "Kelime öğrenirken bağlam, ezber listelerinden daha etkilidir." }
