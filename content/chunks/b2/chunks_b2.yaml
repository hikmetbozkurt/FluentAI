  chunk_en: "address the issue"
  pattern_template: "[Subject] + need to / will + address + the issue + [of Topic]"
  cefr_level: B2
  category: ACTION_COLLOCATION
  intent_tr: "Bir sorunu ele almak / çözüme kavuşturmak"
