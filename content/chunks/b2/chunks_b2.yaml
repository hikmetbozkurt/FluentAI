  version: 1

- id: chunk.b2.bridge.that-being-said
  chunk_en: "That being said,..."
  pattern_template: "That being said, + [Contrasting Point]"
  cefr_level: B2
  category: CONVERSATION_BRIDGE
  intent_tr: "Bununla birlikte / yine de..."
  meaning_en: "Smoothly introduces a caveat or balanced counterpoint after acknowledging a fact."
  turkish_trap:
    incorrect_en: "With that saying, we should stay cautious."
    correct_en: "That being said, we should stay cautious."
    explanation_tr: "Bu kalıp edilgen yapıyla kurulur ('That being said,'); 'saying' ile aktif kullanılmaz."
    trap_type: participle_form
  blueprint_slots:
    - { role: TIME_PLACE, label: "Bridge", text_en: "That being said,", text_tr: "Bununla birlikte," }
    - { role: SUBJECT, label: "Who", text_en: "we", text_tr: "biz" }
    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "still need", text_tr: "hâlâ ihtiyacımız var" }
    - { role: OBJECT, label: "What", text_en: "a backup plan", text_tr: "bir yedek plana" }
  slot_variations:
    - { slot_en: "a backup plan", full_sentence_en: "That being said, we still need a backup plan for launch day.", full_sentence_tr: "Bununla birlikte, lansman günü için hâlâ bir yedek plana ihtiyacımız var." }
    - { slot_en: "not every role fits remote work", full_sentence_en: "That being said, not every role fits fully remote work.", full_sentence_tr: "Bununla birlikte, her rol tamamen uzaktan çalışmaya uygun değildir." }
    - { slot_en: "the prototype looks promising", full_sentence_en: "That being said, the prototype looks genuinely promising.", full_sentence_tr: "Bununla birlikte, prototip gerçekten umut verici görünüyor." }
