    incorrect_en: "On the contrast, rural areas saw steady growth."
    correct_en: "By contrast, rural areas saw steady growth."
    explanation_tr: "'On the other hand' ile karışarak 'On the contrast' yazılması sık görülür; doğru kalıp 'By contrast,' veya 'In contrast,' şeklindedir."
    trap_type: preposition_transfer
  blueprint_slots:
    - { role: TIME_PLACE, label: "Contrast", text_en: "By contrast,", text_tr: "Buna karşılık," }
    - { role: SUBJECT, label: "Who", text_en: "smaller studios", text_tr: "daha küçük stüdyolar" }
    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "adopted", text_tr: "benimsedi" }
    - { role: OBJECT, label: "What", text_en: "flexible schedules much faster", text_tr: "esnek programları çok daha hızlı" }
  slot_variations:
    - { slot_en: "smaller studios adopted flexible schedules", full_sentence_en: "By contrast, smaller studios adopted flexible schedules much faster.", full_sentence_tr: "Buna karşılık, daha küçük stüdyolar esnek programları çok daha hızlı benimsedi." }
    - { slot_en: "the second option costs less", full_sentence_en: "By contrast, the second option costs half as much to maintain.", full_sentence_tr: "Buna karşılık, ikinci seçeneğin bakım maliyeti yarı yarıya daha düşüktür." }
    - { slot_en: "active recall builds retention", full_sentence_en: "Passive rereading fades quickly; by contrast, active recall builds lasting retention.", full_sentence_tr: "Pasif tekrar çabuk silinir; buna karşılık aktif hatırlama kalıcı öğrenme sağlar." }
  topic_tags: [ielts, writing]
  status: PUBLISHED
  version: 1
