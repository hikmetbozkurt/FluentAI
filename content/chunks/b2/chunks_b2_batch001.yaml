- id: chunk.b2.bridge.having-said-that
  chunk_en: Having said that,...
  pattern_template: Having said that, + [Nuanced Qualification]
  cefr_level: B2
  category: CONVERSATION_BRIDGE
  intent_tr: Önceki ifadeyi kabul edip önemli bir şerh veya denge eklemek
  meaning_en: Polished spoken and written bridge for introducing a balanced caveat.
  turkish_trap:
    incorrect_en: Saying that, we still need a backup plan.
    correct_en: Having said that, we still need a backup plan.
    explanation_tr: Kalıp 'Having said that,' (perfect participle) şeklindedir; 'Saying that,' doğal değildir.
    trap_type: participle_form
  blueprint_slots:
  - role: TIME_PLACE
    label: Pivot
    text_en: Having said that,
    text_tr: Bununla birlikte,
  - role: SUBJECT
    label: Who
    text_en: we
    text_tr: biz
  - role: VERB_BRIDGE
    label: Action
    text_en: cannot overlook
    text_tr: göz ardı edemeyiz
  - role: OBJECT
    label: Risk
    text_en: data privacy compliance.
    text_tr: veri gizliliği uyumunu.
  slot_variations:
  - slot_en: data privacy compliance
    full_sentence_en: Having said that, we cannot overlook data privacy compliance.
    full_sentence_tr: Bununla birlikte veri gizliliği uyumunu göz ardı edemeyiz.
  - slot_en: the upfront cost
    full_sentence_en: Having said that, the upfront cost is still quite high.
    full_sentence_tr: Bununla birlikte başlangıç maliyeti hâlâ oldukça yüksek.
  - slot_en: team morale
    full_sentence_en: Having said that, we should check how this affects team morale.
    full_sentence_tr: Bununla birlikte bunun ekip moralini nasıl etkilediğini kontrol etmeliyiz.
  topic_tags:
  - meetings
  - ielts
  - negotiation
  related_vocab_ids: []
  related_grammar_ids: []
  status: PUBLISHED
  version: 1
