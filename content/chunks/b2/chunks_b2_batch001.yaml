- id: chunk.b2.bridge.as-far-as-x-is-concerned
  chunk_en: As far as [X] is concerned,...
  pattern_template: As far as + [Noun] + is/are concerned, + [Clause]
  cefr_level: B2
  category: CONVERSATION_BRIDGE
  intent_tr: Belirli bir konu veya taraf söz konusu olduğunda net konum belirtmek
  meaning_en: Frames a statement strictly around one stakeholder or topic.
  turkish_trap:
    incorrect_en: As far as budget concerned, we are safe.
    correct_en: As far as the budget is concerned, we are on track.
    explanation_tr: '''Is/are'' yardımcı fiili unutulmamalıdır: ''As far as X is concerned,''.'
    trap_type: missing_copula
  blueprint_slots:
  - role: TIME_PLACE
    label: Scope
    text_en: As far as security is concerned,
    text_tr: Güvenlik söz konusu olduğunda,
  - role: SUBJECT
    label: Who
    text_en: we
    text_tr: biz
  - role: VERB_BRIDGE
    label: Stance
    text_en: cannot compromise
    text_tr: ödün veremeyiz
  - role: OBJECT
    label: What
    text_en: on encryption standards.
    text_tr: şifreleme standartlarından.
  slot_variations:
  - slot_en: security
    full_sentence_en: As far as security is concerned, we cannot compromise on encryption standards.
    full_sentence_tr: Güvenlik söz konusu olduğunda şifreleme standartlarından ödün veremeyiz.
  - slot_en: I'm concerned
