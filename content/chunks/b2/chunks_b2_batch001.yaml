    correct_en: I see your point, but I think we should consider the long-term risk.
    explanation_tr: Profesyonel İngilizcede doğrudan 'I disagree completely' sert kaçar; 'I see your point, but...' ile yumuşatmak
      daha etkilidir.
    trap_type: register_mismatch
