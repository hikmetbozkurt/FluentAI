- id: chunk.b2.bridge.rather-than
  chunk_en: rather than...
  pattern_template: '[Action/Choice A] + rather than + [Verb-ing / Base Verb / Noun B]'
  cefr_level: B2
  category: CONVERSATION_BRIDGE
  intent_tr: Biri yerine diğerini bilinçli olarak tercih ettiğini netleştirmek
  meaning_en: Clean comparative choice structure used heavily in B2–C2 writing and speech.
  turkish_trap:
