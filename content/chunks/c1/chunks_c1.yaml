- id: chunk.c1.bridge.put-another-way
  chunk_en: Put another way,...
  pattern_template: Put another way, + [Reframed Equivalent Claim]
  cefr_level: C1
  category: CONVERSATION_BRIDGE
  intent_tr: Karmaşık bir fikri farklı bir çerçeveden yeniden formüle etmek (reformulation)
  meaning_en: Crisp executive reformulation marker for shifting perspective cleanly.
  turkish_trap:
    incorrect_en: Putting another way, our burn rate is unsustainable.
    correct_en: Put another way, our current cost structure is unsustainable.
    explanation_tr: 'Kalıp pasif ortaçla kurulur: ''Put another way,'' (''Putting another way'' kullanılmaz).'
    trap_type: participle_voice
  blueprint_slots:
  - role: TIME_PLACE
    label: Reformulate
    text_en: Put another way,
    text_tr: Başka bir deyişle,
  - role: SUBJECT
    label: Topic
    text_en: speed without quality
    text_tr: kalitesiz hız
  - role: VERB_BRIDGE
    label: Consequence
    text_en: merely shifts
    text_tr: yalnızca öteler
  - role: OBJECT
    label: Cost
    text_en: the cost onto support teams.
    text_tr: maliyeti destek ekiplerine.
  slot_variations:
  - slot_en: support teams
    full_sentence_en: Put another way, speed without quality merely shifts the cost onto support teams.
    full_sentence_tr: Başka bir deyişle kalitesiz hız yalnızca maliyeti destek ekiplerine kaydırır.
  - slot_en: customer acquisition
    full_sentence_en: Put another way, retention is the cheapest acquisition channel we have.
    full_sentence_tr: Başka bir ifadeyle elde tutma elimizdeki en ucuz müşteri kazanım kanalıdır.
  - slot_en: technical debt
    full_sentence_en: Put another way, unaddressed technical debt is a compounding tax on delivery.
    full_sentence_tr: Başka bir deyişle ele alınmayan teknik borç teslimata binen bileşik bir vergidir.
  topic_tags:
  - reformulation
  - leadership
  - ielts
  related_vocab_ids: []
  related_grammar_ids: []
  status: PUBLISHED
  version: 1
- id: chunk.c1.bridge.strictly-speaking
  chunk_en: Strictly speaking,...
  pattern_template: Strictly speaking, + [Precise Technical/Legal Distinction]
  cefr_level: C1
  category: CONVERSATION_BRIDGE
  intent_tr: Teknik veya hukuki kesinlik adına ince bir ayrımı düzeltmek ('Kesin konuşmak gerekirse...')
  meaning_en: Nuance marker signaling precision over loose everyday usage.
  turkish_trap:
    incorrect_en: Speaking strictly, that isn't a bug.
    correct_en: Strictly speaking, that behavior isn't a defect; it's a policy limit.
    explanation_tr: 'Zarf öne gelir: ''Strictly speaking,'' (''Speaking strictly'' doğal değildir).'
    trap_type: word_order_adverb
  blueprint_slots:
  - role: TIME_PLACE
    label: Precision
    text_en: Strictly speaking,
    text_tr: Teknik olarak / Kesin konuşmak gerekirse,
  - role: SUBJECT
    label: Distinction
    text_en: that clause
    text_tr: o madde
  - role: VERB_BRIDGE
    label: State
    text_en: is a guideline,
    text_tr: bir kılavuzdur,
  - role: OBJECT
    label: Contrast
    text_en: not a binding SLA.
    text_tr: bağlayıcı bir SLA değil.
  slot_variations:
  - slot_en: not a binding SLA
    full_sentence_en: Strictly speaking, that clause is a guideline rather than a binding SLA.
    full_sentence_tr: Kesin konuşmak gerekirse o madde bağlayıcı bir SLA'dan ziyade bir kılavuzdur.
  - slot_en: correlation vs causation
    full_sentence_en: Strictly speaking, this chart shows correlation, not causation.
    full_sentence_tr: Bilimsel kesinlikle konuşursak bu grafik nedensellik değil korelasyon gösteriyor.
  - slot_en: latency vs throughput
    full_sentence_en: Strictly speaking, we improved latency, while throughput stayed flat.
    full_sentence_tr: Teknik olarak gecikmeyi iyileştirdik; toplam kapasite ise sabit kaldı.
  topic_tags:
  - precision
  - law
  - technology
  related_vocab_ids: []
  related_grammar_ids: []
  status: PUBLISHED
  version: 1
- id: chunk.c1.bridge.more-specifically
  chunk_en: More specifically,...
  pattern_template: More specifically, + [Granular Detail]
  cefr_level: C1
  category: CONVERSATION_BRIDGE
  intent_tr: Genel bir cümlenin ardından konuyu somut ve keskin detaya daraltmak
  meaning_en: Bridges high-level claims to verifiable evidence in presentations and essays.
  turkish_trap:
    incorrect_en: More specific, latency fell by 40ms.
    correct_en: More specifically, median latency fell by 40 milliseconds.
    explanation_tr: Söylem belirteci olarak sıfat ('specific') değil zarf ('specifically') kullanılır.
    trap_type: adverb_vs_adjective
  blueprint_slots:
