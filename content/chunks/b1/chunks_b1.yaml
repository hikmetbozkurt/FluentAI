  slot_variations:
    - { slot_en: "I prefer the simpler layout", full_sentence_en: "To be honest, I prefer the simpler layout.", full_sentence_tr: "Dürüst olmak gerekirse daha sade tasarımı tercih ederim." }
    - { slot_en: "the schedule feels tight", full_sentence_en: "To be honest, the schedule feels a bit tight.", full_sentence_tr: "Dürüst olmak gerekirse takvim biraz sıkışık görünüyor." }
    - { slot_en: "I haven't checked it yet", full_sentence_en: "To be honest, I haven't had time to check it yet.", full_sentence_tr: "Dürüst olmak gerekirse henüz bakmaya vaktim olmadı." }
