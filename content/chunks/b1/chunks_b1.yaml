  status: PUBLISHED
  version: 1

- id: chunk.b1.collocation.keep-in-mind
  chunk_en: "keep in mind that..."
  pattern_template: "[Subject] + should / need to + keep in mind that + [Clause]"
  cefr_level: B1
  category: ACTION_COLLOCATION
  intent_tr: "Bir noktayı akılda tutmak / göz önünde bulundurmak"
  meaning_en: "To remember an important fact when planning or deciding."
