  slot_variations:
    - { slot_en: "Friday is a holiday", full_sentence_en: "We need to keep in mind that Friday is a holiday.", full_sentence_tr: "Cumanın tatil olduğunu akılda tutmalıyız." }
    - { slot_en: "shipping takes three days", full_sentence_en: "Keep in mind that international shipping takes three days.", full_sentence_tr: "Uluslararası kargonun üç gün sürdüğünü unutmayın." }
