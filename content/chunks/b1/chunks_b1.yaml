  blueprint_slots:
    - { role: TIME_PLACE, label: "Bridge", text_en: "To be honest,", text_tr: "Dürüst olmak gerekirse," }
    - { role: SUBJECT, label: "Who", text_en: "I", text_tr: "ben" }
    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "prefer", text_tr: "tercih ederim" }
