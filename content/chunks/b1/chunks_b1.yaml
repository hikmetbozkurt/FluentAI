    explanation_tr: "'Reason' zaten sebep anlamı taşıdığı için ardından 'because' tekrar edilmez; 'The main reason is that...' kullanılır."
    trap_type: redundant_connector
  blueprint_slots:
    - { role: SUBJECT, label: "Topic frame", text_en: "The main reason", text_tr: "Temel sebep" }
    - { role: VERB_BRIDGE, label: "Link", text_en: "is that", text_tr: "şu ki" }
