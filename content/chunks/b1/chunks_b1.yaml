- id: chunk.b1.frame.main-reason-is
  chunk_en: "The main reason is that..."
  pattern_template: "The main reason + (for X) + is that + [Clause]"
  cefr_level: B1
  category: IELTS_ACADEMIC_FRAME
  intent_tr: "Ana sebebi açıklamak"
  meaning_en: "Structures a clear cause-and-effect explanation in meetings or IELTS speaking."
  turkish_trap:
    incorrect_en: "The main reason is because the server crashed."
