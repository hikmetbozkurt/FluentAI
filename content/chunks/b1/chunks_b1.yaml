    incorrect_en: "We should hold in mind the budget limit."
    correct_en: "We should keep in mind that the budget is limited."
    explanation_tr: "Türkçede 'akılda tutmak' ifadesi 'hold in mind' değil 'keep in mind' olarak kullanılır."
    trap_type: collocation_transfer
  blueprint_slots:
    - { role: SUBJECT, label: "Who", text_en: "We", text_tr: "Biz" }
    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "need to keep in mind", text_tr: "akılda tutmalıyız" }
