- id: chunk.b1.bridge.what-i-mean-is
  chunk_en: "What I mean is..."
  pattern_template: "What I mean is + (that) + [Clause]"
  cefr_level: B1
  category: CONVERSATION_BRIDGE
  intent_tr: "Söylediğini netleştirmek ('Demek istediğim şu ki...')"
  meaning_en: "Used to clarify or rephrase your point when someone might misunderstand."
  turkish_trap:
    incorrect_en: "My meaning is we need more time."
    correct_en: "What I mean is that we need more time."
    explanation_tr: "Türkçedeki 'demek istediğim' ifadesi İngilizcede 'my meaning is' değil 'What I mean is...' kalıbıyla kurulur."
    trap_type: literal_translation
  blueprint_slots:
    - { role: SUBJECT, label: "Bridge frame", text_en: "What I mean is", text_tr: "Demek istediğim şu ki" }
    - { role: VERB_BRIDGE, label: "Core clause", text_en: "we need", text_tr: "ihtiyacımız var" }
    - { role: OBJECT, label: "What", text_en: "two more days for testing", text_tr: "test için iki gün daha" }
  slot_variations:
    - { slot_en: "we need two more days", full_sentence_en: "What I mean is that we need two more days for testing.", full_sentence_tr: "Demek istediğim, test için iki güne daha ihtiyacımız var." }
    - { slot_en: "the price seems fair", full_sentence_en: "What I mean is the price seems fair for this quality.", full_sentence_tr: "Demek istediğim, bu kalite için fiyat makul görünüyor." }
    - { slot_en: "we should start small", full_sentence_en: "What I mean is we should start small and measure results.", full_sentence_tr: "Demek istediğim, küçük başlayıp sonuçları ölçmeliyiz." }
  topic_tags: [meetings, conversation]
  status: PUBLISHED
  version: 1

- id: chunk.b1.bridge.as-far-as-i-know
  chunk_en: "As far as I know,..."
  pattern_template: "As far as I know, + [Subject] + [Verb]"
  cefr_level: B1
  category: CONVERSATION_BRIDGE
  intent_tr: "Bildiğim kadarıyla..."
  meaning_en: "Used to share information while signaling you are not 100% certain."
  turkish_trap:
    incorrect_en: "How much I know, the report is ready."
    correct_en: "As far as I know, the report is ready."
    explanation_tr: "'Bildiğim kadarıyla' ifadesi İngilizcede kelimesi kelimesine çevrilmez; sabit kalıp 'As far as I know,' şeklindedir."
    trap_type: literal_translation
  blueprint_slots:
    - { role: TIME_PLACE, label: "Hedge frame", text_en: "As far as I know,", text_tr: "Bildiğim kadarıyla," }
    - { role: SUBJECT, label: "Who/What", text_en: "the contract", text_tr: "sözleşme" }
    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "is already signed", text_tr: "çoktan imzalandı" }
  slot_variations:
    - { slot_en: "the contract is already signed", full_sentence_en: "As far as I know, the contract is already signed.", full_sentence_tr: "Bildiğim kadarıyla sözleşme çoktan imzalandı." }
    - { slot_en: "they moved the deadline", full_sentence_en: "As far as I know, they moved the deadline to Monday.", full_sentence_tr: "Bildiğim kadarıyla son tarihi pazartesiye aldılar." }
    - { slot_en: "the office is open", full_sentence_en: "As far as I know, the office is open until seven.", full_sentence_tr: "Bildiğim kadarıyla ofis yediye kadar açık." }
  topic_tags: [workplace, conversation]
  status: PUBLISHED
  version: 1

- id: chunk.b1.frame.for-duration-perfect
  chunk_en: "have been [verb]-ing for..."
  pattern_template: "[Subject] + have/has been + [Verb-ing] + for + [Duration]"
  cefr_level: B1
  category: SENTENCE_STARTER
  intent_tr: "Geçmişte başlayıp hâlâ süren bir eylemin süresini söylemek"
  meaning_en: "Connects a past start point to the present using 'for' + a length of time."
  turkish_trap:
    incorrect_en: "I am working here since two years."
    correct_en: "I have been working here for two years."
    explanation_tr: "Süre uzunluğu (iki yıl) verirken 'since' değil 'for' kullanılır ve şimdiki zaman yerine 'have been + -ing' gerekir."
    trap_type: tense_duration
  blueprint_slots:
    - { role: SUBJECT, label: "Who", text_en: "I", text_tr: "Ben" }
    - { role: VERB_BRIDGE, label: "Verb bridge", text_en: "have been working", text_tr: "çalışıyorum" }
    - { role: TIME_PLACE, label: "Where", text_en: "at this company", text_tr: "bu şirkette" }
    - { role: TIME_PLACE, label: "Duration", text_en: "for two years", text_tr: "iki yıldır" }
  slot_variations:
    - { slot_en: "working here for two years", full_sentence_en: "I have been working at this company for two years.", full_sentence_tr: "İki yıldır bu şirkette çalışıyorum." }
    - { slot_en: "learning English for six months", full_sentence_en: "She has been practicing daily for six months.", full_sentence_tr: "Altı aydır her gün pratik yapıyor." }
    - { slot_en: "waiting for twenty minutes", full_sentence_en: "We have been waiting for the update for twenty minutes.", full_sentence_tr: "Yirmi dakikadır güncellemeyi bekliyoruz." }
  topic_tags: [workplace, interviews]
  status: PUBLISHED
  version: 1

- id: chunk.b1.bridge.to-be-honest
  chunk_en: "To be honest,..."
  pattern_template: "To be honest, + [Subject] + [Verb]"
  cefr_level: B1
  category: CONVERSATION_BRIDGE
  intent_tr: "Dürüst olmak gerekirse..."
