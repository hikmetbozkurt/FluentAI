- id: chunk.b1.collocation.take-into-account
  chunk_en: take [something] into account
  pattern_template: '[Subject] + take + [Factor] + into account'
  cefr_level: B1
  category: ACTION_COLLOCATION
  intent_tr: Bir faktörü karar verirken hesaba katmak / dikkate almak
  meaning_en: Professional collocation for considering relevant variables.
  turkish_trap:
    incorrect_en: We must take to account the currency risk.
    correct_en: We must take the currency risk into account.
    explanation_tr: 'Doğru edat ''to'' değil ''into''dur: ''take [something] into account'' veya ''take into account [long
      phrase]''.'
    trap_type: preposition_trap
  blueprint_slots:
  - role: SUBJECT
    label: Who
    text_en: We
    text_tr: Biz
  - role: VERB_BRIDGE
    label: Action
    text_en: must take into account
    text_tr: dikkate almalıyız
  - role: OBJECT
    label: Factor
    text_en: seasonal demand.
    text_tr: mevsimsel talebi.
  slot_variations:
  - slot_en: seasonal demand
    full_sentence_en: We must take seasonal demand into account when forecasting.
    full_sentence_tr: Tahmin yaparken mevsimsel talebi dikkate almalıyız.
  - slot_en: time zone differences
    full_sentence_en: Please take time zone differences into account when booking.
    full_sentence_tr: Planlama yaparken saat dilimi farklarını lütfen dikkate alın.
  - slot_en: long-term maintenance
    full_sentence_en: The budget did not take long-term maintenance into account.
    full_sentence_tr: Bütçe uzun vadeli bakımı hesaba katmadı.
  topic_tags:
