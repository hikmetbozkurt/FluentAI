    text_en: we
    text_tr: biz
  - role: VERB_BRIDGE
    label: Action
    text_en: agreed on
    text_tr: üzerinde anlaştık
  - role: OBJECT
    label: Outcome
    text_en: three clear priorities.
    text_tr: üç net öncelik.
