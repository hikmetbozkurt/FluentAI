- id: chunk.b1.starter.to-sum-up
  chunk_en: To sum up,...
  pattern_template: To sum up, + [Concise Recap]
  cefr_level: B1
  category: SENTENCE_STARTER
  intent_tr: Konuşmayı veya toplantıyı kısa bir özetle kapatmak
  meaning_en: Clear closing marker for meetings, presentations, and IELTS Part 2.
  turkish_trap:
    incorrect_en: For summing up, we have three main action items.
    correct_en: To sum up, we have three main action items.
    explanation_tr: Özetleme kalıbı 'For summing up' değil 'To sum up,' veya 'In summary,' şeklindedir.
    trap_type: preposition_trap
  blueprint_slots:
