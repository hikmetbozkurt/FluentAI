- id: chunk.b1.starter.what-do-you-think-about
  chunk_en: What's your take on...?
  pattern_template: What's your take on + [Topic / Proposal]?
  cefr_level: B1
  category: SENTENCE_STARTER
  intent_tr: Birinin konuyla ilgili kişisel yorumunu doğal biçimde sormak
  meaning_en: Engaging, natural workplace alternative to 'What do you think about...?'.
  turkish_trap:
    incorrect_en: What is your take about the new pricing?
