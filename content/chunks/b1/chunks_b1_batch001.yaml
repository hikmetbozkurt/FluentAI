    full_sentence_tr: İlk bakışta teklif beklenenden daha pahalı görünüyor.
  - slot_en: simple to implement
    full_sentence_en: At first glance, the change seems simple, but edge cases exist.
    full_sentence_tr: İlk bakışta değişiklik basit görünüyor ama uç durumlar var.
  - slot_en: a minor delay
