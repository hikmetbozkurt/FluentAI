- id: chunk.b1.bridge.at-first-glance
  chunk_en: At first glance,...
  pattern_template: At first glance, + [Initial Impression]
  cefr_level: B1
  category: CONVERSATION_BRIDGE
  intent_tr: İlk bakışta görünen izlenimi aktarmak (genellikle ardından derin gerçek gelir)
  meaning_en: Sets up a contrast between surface appearance and deeper analysis.
  turkish_trap:
    incorrect_en: In the first look, the proposal seems expensive.
    correct_en: At first glance, the proposal seems expensive.
    explanation_tr: Türkçedeki 'ilk bakışta' ifadesi 'in the first look' değil 'At first glance,' olarak çevrilir.
    trap_type: literal_translation
  blueprint_slots:
