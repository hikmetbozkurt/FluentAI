- id: chunk.b1.bridge.as-long-as
  chunk_en: as long as...
  pattern_template: '[Main Clause] + as long as + [Condition in Present Simple]'
  cefr_level: B1
  category: CONVERSATION_BRIDGE
  intent_tr: Bir koşul sağlandığı sürece onay veya esneklik belirtmek ('... sürece')
  meaning_en: Sets a clear, reasonable condition in negotiations and teamwork.
  turkish_trap:
    incorrect_en: You can work from home as long as you will attend standups.
    correct_en: You can work from home as long as you attend standups.
    explanation_tr: '''As long as'' koşul cümleciği içinde gelecek anlamı için ''will'' yerine Present Simple kullanılır.'
    trap_type: conditional_will_trap
  blueprint_slots:
  - role: SUBJECT
    label: Agreement
    text_en: I'm fine with that
    text_tr: Benim için uygun
  - role: VERB_BRIDGE
    label: Condition
    text_en: as long as we keep
    text_tr: koruduğumuz sürece
  - role: OBJECT
    label: Requirement
    text_en: the same launch date.
    text_tr: aynı lansman tarihini.
  slot_variations:
  - slot_en: the same launch date
    full_sentence_en: I'm fine with that as long as we keep the same launch date.
    full_sentence_tr: Aynı lansman tarihini koruduğumuz sürece benim için uygun.
  - slot_en: stay within budget
    full_sentence_en: We can add that feature as long as we stay within budget.
    full_sentence_tr: Bütçe içinde kaldığımız sürece o özelliği ekleyebiliriz.
  - slot_en: notify the team
    full_sentence_en: Flexible hours work well as long as you notify the team.
    full_sentence_tr: Ekibe haber verdiğin sürece esnek saatler iyi işler.
  topic_tags:
  - negotiation
  - workplace
  - daily_life
  related_vocab_ids: []
  related_grammar_ids: []
  status: PUBLISHED
  version: 1
- id: chunk.b1.collocation.put-off
