- id: chunk.c2.starter.what-is-more-telling
  chunk_en: More tellingly still,...
  pattern_template: More tellingly (still), + [Revealing Escalating Fact]
  cefr_level: C2
  category: SENTENCE_STARTER
  intent_tr: Önceki kanıttan bile daha çarpıcı ve açığa çıkarıcı ikinci bulguyu sunmak
