  turkish_trap:
    incorrect_en: Much as I admire the idea, but we lack capacity.
    correct_en: Much as I admire the ambition, we cannot fund two parallel tracks.
    explanation_tr: Önde 'Much as' varken ikinci cümle başında 'but' kullanılmaz.
    trap_type: double_conjunction
