  intent_tr: Yaygın bir teşhisi düzeltip asıl gerçeği incelikle yeniden tanımlamak ('X'ten ziyade Y')
  meaning_en: Rhetorical precision structure for reframing causes and motives.
  turkish_trap:
    incorrect_en: The obstacle isn't so much budget than alignment.
    correct_en: The obstacle is not so much technical complexity as unclear ownership.
    explanation_tr: '''Not so much X'' kalıbının ikinci ayağı ''than'' değil her zaman ''as''tir.'
