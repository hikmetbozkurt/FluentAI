    text_en: we
    text_tr: biz
  - role: VERB_BRIDGE
    label: Decision
    text_en: must keep
    text_tr: tutmalıyız
  - role: OBJECT
    label: Scope
    text_en: the UI visually quiet.
    text_tr: arayüzü görsel olarak sakin.
  slot_variations:
  - slot_en: visually quiet UI
    full_sentence_en: Much as I admire expressive visuals, reading screens must stay visually quiet.
