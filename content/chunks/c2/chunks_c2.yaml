- id: chunk.c2.bridge.lest-we-forget
  chunk_en: lest [subject + (should) + base verb]
  pattern_template: '[Precaution] + lest + [Subject] + [Base Verb]'
  cefr_level: C2
  category: CONVERSATION_BRIDGE
  intent_tr: İstenmeyen bir sonucun doğmaması için uyarı veya önlem bildirmek ('... olmasın diye')
  meaning_en: Formal negative-purpose conjunction taking mandative subjunctive.
  turkish_trap:
    incorrect_en: Document every decision lest we don't repeat past errors.
    correct_en: Document every rationale lest future teams repeat the same migration mistake.
    explanation_tr: '''Lest'' zaten olumsuzluk içerdiği için içine ayrıca ''not/don''t'' konmaz ve fiil yalın kalır.'
    trap_type: double_negation
  blueprint_slots:
