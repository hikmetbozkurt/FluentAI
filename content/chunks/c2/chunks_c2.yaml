- id: chunk.c2.starter.suffice-it-to-say
  chunk_en: Suffice it to say (that)...
  pattern_template: Suffice it to say (that) + [Concise Bottom Line]
  cefr_level: C2
  category: SENTENCE_STARTER
  intent_tr: Uzun detaylara girmeden tek cümlede özü vermenin yeterli olduğunu söylemek
