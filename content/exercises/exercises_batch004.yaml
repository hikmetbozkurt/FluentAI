- id: exercise.grammar.a2.null-subject-dummy-it-there.01
  target_content_id: grammar.a2.null-subject-dummy-it-there
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the grammatically complete opening for a technical status check:'
  prompt_tr_hint: Teknik durum kontrolü için özne yeri eksiksiz doldurulmuş doğru
    seçeneği bulunuz.
  stem: ___ critical to confirm audio playback before tomorrow's workshop.
  options:
  - It is
  - That has
  - There is
  - Is
  correct_answer: It is
  explanation_en: Anticipatory 'It is + adjective + to-infinitive' fills the mandatory
    grammatical subject slot.
  explanation_tr: İngilizcede özne boş bırakılamaz; değerlendirme cümlelerinde yer
    tutucu özne olarak 'It is' kullanılır.
  distractor_explanations:
    Is: İngilizcede öznesiz cümle kurulamaz; gizli özne için 'It' eklenmelidir.
    There is: '''There is'' varlık bildirir; sıfat + to-infinitive değerlendirmesinde
      ''It is'' kullanılır.'
    That has: Sıfat yapısıyla anlam ve yardımcı fiil uyumu sağlamaz.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.null-subject-dummy-it-there.02
  target_content_id: grammar.a2.null-subject-dummy-it-there
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Correct the Turkish null-subject transfer error in this office update:'
  prompt_tr_hint: Türkçedeki gizli özne aktarımından kaynaklanan hatayı düzelten seçeneği
    seçiniz.
  stem: 'Identify the accurate revision of: ''Seems likely that our courier arrives
    before noon.'''
  options:
  - It seems likely that our courier will arrive before noon.
  - We seems likely our courier will arrive before noon.
  - Is seems likely that our courier arrives before noon.
  - There seems likely our courier arriving before noon.
  correct_answer: It seems likely that our courier will arrive before noon.
  explanation_en: Extrapositional clauses ('seems likely that...') require placeholder
    'It' before the verb.
  explanation_tr: '''Muhtemel görünüyor ki...'' yargısında gizli özne yerine ''It''
    zamiri konmalıdır.'
  distractor_explanations:
    There seems likely our courier arriving before noon.: '''that'' yan cümlesini
      başlatmak için ''There'' değil ''It'' kullanılır.'
    Is seems likely that our courier arrives before noon.: Özne eksik ve 'is' + çekimli
      'seems' birlikte kullanılamaz.
    We seems likely our courier will arrive before noon.: Hem özne-fiil uyumu ('we
      seems') hem de yan cümle bağlacı hatalıdır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.null-subject-dummy-it-there.03
  target_content_id: grammar.a2.null-subject-dummy-it-there
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Contrast anticipatory ''it'' with existential ''there'' cleanly:'
  prompt_tr_hint: Yer tutucu 'It' ile varlık bildiren 'There' arasındaki farka göre
    boşluğu doldurunuz.
  stem: 'Good news: ___ an updated invoice template ready inside the shared folder.'
  options:
  - there are
  - is
  - there is
  - it is
  correct_answer: there is
  explanation_en: Use 'there is' to introduce the existence of a singular noun phrase
    in a location.
  explanation_tr: Bir yerde tekil bir dosya/şablon bulunduğunu tanıtırken 'there is'
    kullanılır.
  distractor_explanations:
    it is: Belirli bir nesnenin varlığını tanıtırken 'it' değil 'there' kullanılır.
    is: Ana fiilin önünde açık özne bulunmalıdır.
    there are: '''an updated invoice template'' tekil olduğu için ''there is'' gerektirir.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.definite-zero-article-basics.01
  target_content_id: grammar.a2.definite-zero-article-basics
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the natural phrase for arriving at your workplace routine:'
  prompt_tr_hint: Günlük iş yeri rutini için doğru artikel kullanımını seçiniz.
  stem: Whenever commuter rail runs smoothly, I arrive ___ twenty minutes early.
  options:
  - to work
  - at the work
  - at work
  - in the work
  correct_answer: at work
  explanation_en: Routine workplace nouns ('at work', 'go to work', 'at home') omit
    the definite article.
  explanation_tr: '''İşte / işe'' gibi kalıplaşmış rutin ifadelerde ''work'' önünde
    ''the'' kullanılmaz.'
  distractor_explanations:
    at the work: Kurumsal/rutin anlamda 'work' önüne 'the' getirilmez.
    in the work: Hem edat ('at' yerine 'in') hem gereksiz 'the' kullanımı hatalıdır.
    to work: '''arrive'' fiili ulaşım yönelimi olarak ''to'' değil ''at/in'' alır.'
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.definite-zero-article-basics.02
  target_content_id: grammar.a2.definite-zero-article-basics
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Fix the overused ''the'' on general abstract concepts:'
  prompt_tr_hint: Genel soyut kavramlarda gereksiz 'the' eklenmesiyle oluşan hatayı
    düzeltiniz.
  stem: Which sentence states a general workplace principle cleanly?
  options:
  - The honest feedbacks build lasting trust across distributed teams.
  - An honest feedback builds a lasting trust across distributed teams.
  - The honest feedback builds the lasting trust across distributed teams.
  - Honest feedback builds lasting trust across distributed teams.
  correct_answer: Honest feedback builds lasting trust across distributed teams.
  explanation_en: Uncountable abstract nouns ('feedback', 'trust') carry zero article
    in general truths.
  explanation_tr: Genel geçer kavramlarda sayılamayan isimler ('feedback', 'trust')
    'the' veya 'a/an' almadan kullanılır.
  distractor_explanations:
    The honest feedback builds the lasting trust across distributed teams.: Genel
      yargıda soyut ve sayılamayan 'feedback' ve 'trust' başına 'the' konmaz.
    An honest feedback builds a lasting trust across distributed teams.: '''feedback''
      sayılamayan isim olduğu için ''an'' almaz.'
    The honest feedbacks build lasting trust across distributed teams.: '''feedback''
      çoğul ''-s'' eki almaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.definite-zero-article-basics.03
  target_content_id: grammar.a2.definite-zero-article-basics
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Contrast general scope with a specific shared referent:'
  prompt_tr_hint: Belirli bir bağlama işaret eden cümle için doğru artikel seçiniz.
  stem: Thank you for sending ___ we discussed during Tuesday's standup.
  options:
  - timeline summary
  - the timelines summary
  - a timeline summaries
  - the timeline summary
  correct_answer: the timeline summary
  explanation_en: Once identified by a modifying clause ('we discussed'), a specific
    countable noun requires 'the'.
  explanation_tr: '''Salı günkü toplantıda konuştuğumuz'' biçiminde daraltıldığı için
    burada ''the'' kullanımı zorunludur.'
  distractor_explanations:
    timeline summary: '''we discussed'' ile sınırlandırıldığı için belirli tanımlık
      (''the'') şarttır.'
    a timeline summaries: Tekil belgisiz tanımlık 'a' çoğul 'summaries' ile uyuşmaz.
    the timelines summary: Ad tamlamalarında niteleyen ilk isim genellikle tekil kalır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.prepositions-movement-direction.01
  target_content_id: grammar.a2.prepositions-movement-direction
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Complete the digital file-transfer instruction:'
  prompt_tr_hint: Dosyanın bir klasör içine aktarılmasını anlatan doğru edatı seçiniz.
  stem: Once exported, drop the verified CSV backups ___ the archive folder.
  options:
  - into
  - onto
  - to
  - at
  correct_answer: into
  explanation_en: Use 'into' when transferring objects across a boundary into a folder,
    room, or container.
  explanation_tr: Bir dosyanın klasörün içine taşınmasında 'into' sınır geçişini net
    biçimde anlatır.
  distractor_explanations:
    at: '''at'' hareketten çok sabit nokta bildirir.'
    onto: İçine koymayı değil bir yüzeyin üzerine koymayı ifade eder.
    to: Genel yön bildirir; kapalı klasör/konteyner içine geçişte 'into' daha keskindir.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.prepositions-movement-direction.02
  target_content_id: grammar.a2.prepositions-movement-direction
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot the Turkish ''-e/-a'' case transfer trap with ''home'' and ''arrive'':'
  prompt_tr_hint: '''Arrive'' ve ''home'' sözcüklerinde yaygın Türkçe ''-e'' yönelme
    eki tuzağından kaçının.'
  stem: 'Choose the natural sentence describing last night''s flight arrival:'
  options:
  - After arriving at Izmir airport at eight, I went straight home.
  - After arriving in Izmir airport at eight, I went to home straight.
  - After arriving at Izmir airport at eight, I entered to home.
  - After arriving to Izmir airport at eight, I went straight to home.
  correct_answer: After arriving at Izmir airport at eight, I went straight home.
  explanation_en: '''Arrive'' pairs with ''at/in'' (never ''to''), and directional
    verbs take bare ''home'' without ''to''.'
  explanation_tr: '''Arrive to'' veya ''go to home'' kurulmaz; ''arrive at + yer''
    ve doğrudan ''go home'' kullanılır.'
  distractor_explanations:
    After arriving to Izmir airport at eight, I went straight to home.: Hem 'arrive
      to' hem de 'go to home' yanlış edat aktarımlarıdır.
    After arriving in Izmir airport at eight, I went to home straight.: Havalimanı
      gibi belirli binalarda 'at' seçilir ve 'go home' arasına 'to' girmez.
    After arriving at Izmir airport at eight, I entered to home.: '''enter'' doğrudan
      nesne alır (''enter the office''); ayrıca ''enter home'' doğal değildir.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.prepositions-movement-direction.03
  target_content_id: grammar.a2.prepositions-movement-direction
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distinguish movement inside a space from entering it:'
  prompt_tr_hint: İçeride bulunma ile dışarıdan içeri girme arasındaki farkı seçiniz.
  stem: Our visitor stood waiting outside until the receptionist invited him ___ the
    lobby.
  options:
  - from
  - into
  - in
  - at
  correct_answer: into
  explanation_en: Motion from outside to inside pairs with dynamic 'into' after verbs
    like 'invite' or 'step'.
  explanation_tr: Dışarıda beklerken lobiye davet etme hareketi sınır geçişi olduğu
    için 'into' ister.
  distractor_explanations:
    in: Zaten içeride olma durumunu gösterir; dışarıdan girişi değil.
    at: Sabit konum bildirir, içeri davet eylemini karşılamaz.
    from: Ayrılma yönü verir, davetin yönüyle terstir.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.word-order-svo-place-time.01
  target_content_id: grammar.a2.word-order-svo-place-time
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Place manner, place, and time modifiers in standard English order:'
  prompt_tr_hint: Durum, yer ve zaman zarflarını İngilizce cümle dizimine göre doğru
    sıralayınız.
  stem: Our compliance lead reviewed the supplier agreement ___.
  options:
  - carefully yesterday at headquarters
  - yesterday at headquarters carefully
  - at headquarters carefully yesterday
  - carefully at headquarters yesterday
  correct_answer: carefully at headquarters yesterday
  explanation_en: Adverbials at clause end follow Manner -> Place -> Time (SVO-MPT).
  explanation_tr: İngilizce cümle sonunda zarflar Durum -> Yer -> Zaman sırasını izler.
  distractor_explanations:
    yesterday at headquarters carefully: Zaman ve yer zarfları standart dizimde durum
      zarfından önce gelmez.
    at headquarters carefully yesterday: Sıkı sıralama 'Durum (carefully) + Yer (at
      headquarters) + Zaman (yesterday)' şeklindedir.
    carefully yesterday at headquarters: Yer zarfı zaman zarfından önce yer almalıdır.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.word-order-svo-place-time.02
  target_content_id: grammar.a2.word-order-svo-place-time
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Fix the Turkish SOV word-order interference splitting verb and object:'
  prompt_tr_hint: Türkçe söz dizimi etkisinden dolayı fiil ile nesneyi ayıran hatalı
    sırayı düzeltiniz.
  stem: Which sentence keeps Verb + Direct Object intact?
  options:
  - He sends weekly expense reports before Friday afternoon.
  - He weekly expense reports sends before Friday afternoon.
  - He sends before Friday afternoon weekly expense reports.
  - He sends in the office every week the expense reports.
  correct_answer: He sends weekly expense reports before Friday afternoon.
  explanation_en: English prohibits inserting time or location phrases between a transitive
    verb and its direct object.
  explanation_tr: İngilizcede fiil ile doğrudan nesne arasına yer veya zaman ifadesi
    yerleştirilmez.
  distractor_explanations:
    He sends before Friday afternoon weekly expense reports.: Zaman zarfı fiil ('sends')
      ile nesne arasına giremez.
    He weekly expense reports sends before Friday afternoon.: Türkçe SOV (Özne-Nesne-Yüklem)
      sırası İngilizcede geçersizdir.
    He sends in the office every week the expense reports.: Yer ve zaman ifadeleri
      nesneyi fiilden ayırmıştır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.word-order-svo-place-time.03
  target_content_id: grammar.a2.word-order-svo-place-time
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the clean alternative when highlighting the day first:'
  prompt_tr_hint: Zaman vurgusunu başa almak istediğinizde doğal ve kurallı cümleyi
    seçiniz.
  stem: 'Select the well-structured schedule announcement:'
  options:
  - Tomorrow morning, engineers will run full integration checks in the test lab.
  - Engineers in the test lab tomorrow morning will run full integration checks.
  - Engineers will run tomorrow morning in the test lab full integration checks.
  - Full integration checks engineers tomorrow morning will run in the test lab.
  correct_answer: Tomorrow morning, engineers will run full integration checks in
    the test lab.
  explanation_en: Fronting time ('Tomorrow morning, ...') is fully acceptable as long
    as Verb + Object stay together afterward.
  explanation_tr: Vurgu için zamanı en başa alabilirsiniz; ancak içeride 'run full
    integration checks' bitişik kalmalıdır.
  distractor_explanations:
    Engineers will run tomorrow morning in the test lab full integration checks.: Zaman
      ve yer fiil ile nesneyi bölmüştür.
    Full integration checks engineers tomorrow morning will run in the test lab.: Nesne
      ve özne devrilmesi günlük duyuru için bozuk ve yapaydır.
    Engineers in the test lab tomorrow morning will run full integration checks.: Özne
      ile yardımcı fiil arasına uzun yer/zaman öbekleri sıkıştırılmıştır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.indefinite-pronouns-some-any-no.01
  target_content_id: grammar.a2.indefinite-pronouns-some-any-no
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Complete the check cleanly without creating a double negative:'
  prompt_tr_hint: Çift olumsuzluk hatasına düşmeden boşluğu tamamlayınız.
  stem: We inspected all five sync logs, yet we didn't spot ___.
  options:
  - nowhere suspicious
  - nothing suspicious
  - anything suspicious
  - none suspicious
  correct_answer: anything suspicious
  explanation_en: Pair a negative verb ('didn't spot') with 'anything', reserving
    'nothing' for positive verbs.
  explanation_tr: Olumsuz fiilden sonra ('didn't') ikinci bir olumsuz kelime ('nothing')
    gelmez; 'anything' seçilir.
  distractor_explanations:
    nothing suspicious: Fiil zaten olumsuz ('didn't') olduğu için 'nothing' çift olumsuzluk
      oluşturur.
    nowhere suspicious: '''spot'' fiili yer değil nesne zamiri ister.'
    none suspicious: Sıfat niteleyen bileşik zamir biçimi eksiktir.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.indefinite-pronouns-some-any-no.02
  target_content_id: grammar.a2.indefinite-pronouns-some-any-no
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Eliminate the Turkish double-negative pattern (''Hiç kimse ...madı''):'
  prompt_tr_hint: Türkçedeki çift olumsuzluğu İngilizceye taşıyan hatalı cümleyi eleyiniz.
  stem: Which sentence reports zero objections accurately?
  options:
  - Nobody didn't raise any concern during the security walkthrough.
  - Anybody didn't raise no concern during the security walkthrough.
  - Nobody raised any concern during the security walkthrough.
  - Nobody raised no concern during the security walkthrough.
  correct_answer: Nobody raised any concern during the security walkthrough.
  explanation_en: Negative subject 'Nobody' takes an affirmative verb ('raised') plus
    'any' rather than another negative word.
  explanation_tr: Tek olumsuzluk ilkesi gereği 'Nobody' öznesi mutlaka olumlu çekimli
    fiille ('raised') kullanılır.
  distractor_explanations:
    Nobody didn't raise any concern during the security walkthrough.: '''Nobody''
      ile ''didn''t'' birleşince standart dışı çift olumsuzluk doğar.'
    Anybody didn't raise no concern during the security walkthrough.: '''Anybody''
      olumlu/olumsuz cümle öznesi olarak bu şekilde başlamaz ve ''no'' ikinci olumsuzudur.'
    Nobody raised no concern during the security walkthrough.: '''Nobody'' + ''no''
      çift olumsuzluk kuralına aykırıdır.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.indefinite-pronouns-some-any-no.03
  target_content_id: grammar.a2.indefinite-pronouns-some-any-no
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Check singular verb agreement with indefinite pronouns:'
  prompt_tr_hint: Belgisiz zamirlerin tekil-çoğul fiil uyumunu doğru belirleyiniz.
  stem: Everything inside our offline curriculum bundle ___ validated prior to release.
  options:
  - were being
  - are
  - has been
  - have been
  correct_answer: has been
  explanation_en: Indefinite pronouns ending in '-thing', '-body', or '-one' ('everything',
    'everyone') always govern singular verbs.
  explanation_tr: Anlamı kapsayıcı olsa da 'everything / everyone / nobody' daima
    tekil fiille ('has / is / does') çekilir.
  distractor_explanations:
    have been: '''Everything'' biçimce ve kural gereği daima tekil fiil alır.'
    are: Hem çoğuldur hem edilgen zaman bağlamını bozar.
    were being: Çoğul fiil 'everything' ile uyuşmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.say-tell-speak-talk.01
  target_content_id: grammar.a2.say-tell-speak-talk
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the verb pattern that matches direct listener placement:'
  prompt_tr_hint: Doğrudan dinleyici zamirinin ('us') aldığı yapıya göre doğru fiili
    seçiniz.
  stem: Finance ___ us earlier that supplier reimbursements clear every Thursday.
  options:
  - talked
  - spoke
  - said
  - told
  correct_answer: told
  explanation_en: '''Tell'' directly precedes the listener object (''told us that...'')
    without adding ''to''.'
  explanation_tr: Arada 'to' olmadan hemen ardından dinleyici nesnesi ('us / me')
    alabilen fiil yalnızca 'tell'dir.
  distractor_explanations:
    said: '''said'' doğrudan kişi zamiri (''said us'') almaz; kişi önüne ''to'' ister
      (''said to us'').'
    spoke: '''spoke us'' geçersizdir; kişi için ''spoke to/with us'' gerekir.'
    talked: '''talked'' doğrudan kişi nesnesi almaz (''talked to/with us'' ister).'
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.say-tell-speak-talk.02
  target_content_id: grammar.a2.say-tell-speak-talk
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Fix the common ''say me / tell to me'' transfer trap:'
  prompt_tr_hint: '''Bana söyledi'' yapısındaki yaygın edat ve fiil eşleşme hatasını
    düzeltiniz.'
  stem: 'Choose the error-free workplace message:'
  options:
  - Please tell me if shipping arrives late, or say a quick word to reception.
  - Please say me if shipping arrives late, or tell to reception quickly.
  - Please tell to me if shipping arrives late, or say reception quickly.
  - Please speak me if shipping arrives late, or talk reception quickly.
  correct_answer: Please tell me if shipping arrives late, or say a quick word to
    reception.
  explanation_en: Keep listener directly after 'tell' ('tell me') and place 'to' before
    a listener after 'say' ('say X to Y').
  explanation_tr: '''tell + kişi'' ve ''say + söz (+ to + kişi)'' ayrımı konuşma fiillerinde
    temel kurallardandır.'
  distractor_explanations:
    Please say me if shipping arrives late, or tell to reception quickly.: '''say
      me'' ve ''tell to'' her ikisi de geçersiz dizimlerdir.'
    Please tell to me if shipping arrives late, or say reception quickly.: '''tell''
      ardından ''to'' gelmez; ''say'' doğrudan alıcı alamaz.'
    Please speak me if shipping arrives late, or talk reception quickly.: '''speak''
      ve ''talk'' alıcı önüne ''to/with'' gerektirir.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.a2.say-tell-speak-talk.03
  target_content_id: grammar.a2.say-tell-speak-talk
  cefr_level: A2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Pick the natural verb pairing with named languages:'
  prompt_tr_hint: Yabancı dil bilgisinden bahsederken doğal eşleşen fiili seçiniz.
  stem: All three account managers ___ Turkish, English, and basic German.
  options:
  - speak
  - tell
  - say
  - talk
  correct_answer: speak
  explanation_en: Always pair 'speak' (not 'talk' or 'say') with language names when
    stating proficiency.
  explanation_tr: Bir dili bilmek ve konuşabilmek anlamında yalnızca 'speak + Dil'
    kullanılır.
  distractor_explanations:
    talk: Yabancı dil bilme yetisi olarak 'talk Turkish' kullanılmaz.
    tell: '''tell Turkish'' kalıbı ''Türkçe konuşmak'' anlamına gelmez.'
    say: Yabancı dilleri genel yetkinlik olarak ifade etmede 'say' kullanılmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.since-for-during-ago.01
  target_content_id: grammar.b1.since-for-during-ago
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Match the duration marker to an unfinished Present Perfect timeframe:'
  prompt_tr_hint: Devam eden sürenin uzunluğunu belirtmek için doğru zaman bağlacını
    seçiniz.
  stem: Our support team has tracked latency metrics closely ___ three years.
  options:
  - since
  - ago
  - for
  - during
  correct_answer: for
  explanation_en: Use 'for + duration length' to measure how long an ongoing Present
    Perfect action has lasted.
  explanation_tr: Eylemin ne kadar sürdüğünü ('üç yıldır') ifade etmek için 'since'
    değil 'for' seçilir.
  distractor_explanations:
    since: '''since'' süre uzunluğu (''three years'') değil başlangıç tarihi (''2023
      / Monday'') ister.'
    during: İsimleşmiş belirli bir dönem ('the audit') içinde gerçekleşen olaylarla
      kullanılır.
    ago: '''ago'' asla Present Perfect (''has tracked'') ile kullanılmaz.'
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.since-for-during-ago.02
  target_content_id: grammar.b1.since-for-during-ago
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot and correct the ''since ... ago'' time-boundary blend:'
  prompt_tr_hint: '''Since'' ile ''ago''yu veya uzunluk ifadelerini karıştıran Türkçe
    aktarım hatasını düzeltiniz.'
  stem: Which update uses tense and time anchors accurately?
  options:
  - I joined the analytics desk two years ago and have led audits since January.
  - I have joined the analytics desk since two years ago and lead audits for January.
  - I joined the analytics desk since two years and have led audits for January.
  - I have joined the analytics desk two years ago during January.
  correct_answer: I joined the analytics desk two years ago and have led audits since
    January.
  explanation_en: '''Ago'' locks into Past Simple (''joined two years ago''); ''since''
    anchors a specific start point into Present Perfect.'
  explanation_tr: '''Two years ago'' bitmiş geçmiş (Past Simple) gerektirir; ''since
    January'' ise bugüne uzanan süreçte (Present Perfect) yer alır.'
  distractor_explanations:
    I have joined the analytics desk since two years ago and lead audits for January.: '''since
      ... ago'' birleşemez; ayrıca ''ago'' ile Present Perfect kullanılmaz.'
    I joined the analytics desk since two years and have led audits for January.: Tamamlanmış
      başlangıç için 'since' değil 'ago', belirli başlangıç ayı için 'since' gerekir.
    I have joined the analytics desk two years ago during January.: '''two years ago''
      daima Past Simple (''joined'') ister.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.since-for-during-ago.03
  target_content_id: grammar.b1.since-for-during-ago
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distinguish a noun-event container (''during'') from elapsed measurement
    (''for''):'
  prompt_tr_hint: Belirli bir etkinlik/süreç içinde gerçekleşme ('during') ile saat
    uzunluğu ('for') farkını seçiniz.
  stem: Nobody triggered emergency overrides ___ the entire three-hour maintenance
    window.
  options:
  - ago
  - during
  - since
  - while
  correct_answer: during
  explanation_en: Use 'during + noun phrase' ('during the maintenance window') when
    locating an event inside a named span.
  explanation_tr: '''Bakım penceresi sırasında'' gibi bir isim öbeğinin içinde olan
    olayları ''while'' yerine ''during'' bağlar.'
  distractor_explanations:
    while: '''while'' ardından özne+yüklem içeren tam yan cümle ister, tek başına
      isim öbeği almaz.'
    ago: Öbeğin sonuna gelir ve süreç kapsayıcılığı bildirmez.
    since: Tamamlanmış geçmiş tekil olayda başlangıç eki vermez.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.embedded-indirect-questions.01
  target_content_id: grammar.b1.embedded-indirect-questions
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Complete the polite client inquiry using proper embedded statement word
    order:'
  prompt_tr_hint: Kibar soru kalıbının içinde devrik olmayan doğru dizimi seçiniz.
  stem: Could you let me know when ___?
  options:
  - will arrive the finalized supplier invoice
  - does the finalized supplier invoice arrive
  - arrives the finalized supplier invoice
  - the finalized supplier invoice arrives
  correct_answer: the finalized supplier invoice arrives
  explanation_en: Embedded questions revert strictly to affirmative Subject + Verb
    order after the polite opener.
  explanation_tr: '''Could you let me know'' yapısından sonra gelen yan soru cümlesi
    mutlaka Özne + Yüklem düz sırasıyla kurulur.'
  distractor_explanations:
    does the finalized supplier invoice arrive: Soru 'Could you' ile zaten devrildiğinden
      iç cümlede tekrar 'does' kullanılmaz.
    arrives the finalized supplier invoice: İngilizce gömülü soruda özne ile yüklem
      yer değiştirmez.
    will arrive the finalized supplier invoice: Yardımcı fiil öznenin önüne geçemez.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.embedded-indirect-questions.02
  target_content_id: grammar.b1.embedded-indirect-questions
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Identify the sentence free of double question inversion:'
  prompt_tr_hint: İç içe iki kez devirme (double inversion) hatası olmayan seçeneği
    bulunuz.
  stem: Which indirect question sounds clear and grammatically accurate?
  options:
  - I was wondering why did the export script skip three headers yesterday.
  - Can you tell me why did the export script skipped three headers?
  - I was wondering why skipped the export script three headers yesterday.
  - I was wondering why the export script skipped three headers yesterday.
  correct_answer: I was wondering why the export script skipped three headers yesterday.
  explanation_en: Drop auxiliary 'do/does/did' in indirect wh-clauses and conjugate
    the main verb normally.
  explanation_tr: Dolaylı aktarım ve soru içinde 'did' çıkarılır; fiil doğrudan geçmiş
    zamanına ('skipped') çekilir.
  distractor_explanations:
    I was wondering why did the export script skip three headers yesterday.: Dolaylı
      cümlede 'did' yardımcı fiili soru devirmesi olarak eklenemez.
    I was wondering why skipped the export script three headers yesterday.: Yüklem
      özneden önce gelemez.
    Can you tell me why did the export script skipped three headers?: Hem çifte 'did'
      devirmesi hem de 'did + V2' hatası içerir.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.embedded-indirect-questions.03
  target_content_id: grammar.b1.embedded-indirect-questions
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Form a polite indirect yes/no request:'
  prompt_tr_hint: Evet/hayır sorusunu kibar bir dolaylı ricaya dönüştürünüz.
  stem: Would you mind checking ___ offline encryption runs on older tablets too?
  options:
  - what
  - which
  - that
  - whether
  correct_answer: whether
  explanation_en: Bridge indirect yes/no clauses with 'if' or 'whether', keeping Subject
    + Verb order intact.
  explanation_tr: '''...yapıp yapmadığını kontrol etmek'' gibi belirsiz sorularda
    ''whether/if'' bağlacı seçilir.'
  distractor_explanations:
    that: Kesin bir olgu bildirirken 'that' kullanılır; belirsizlik kontrolünde değil.
    what: Evet/hayır sorusunu bağlamak için 'what' kullanılmaz.
    which: İki somut seçenekten birini sormadıkça evet/hayır bağlacı olmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.zero-article-generics-abstract.01
  target_content_id: grammar.b1.zero-article-generics-abstract
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the accurate generic opening for a software whitepaper:'
  prompt_tr_hint: Genel bir ilkeyi ifade ederken doğru artikel kullanımını seçiniz.
  stem: ___ rely on deterministic indexing to find entries instantaneously offline.
  options:
  - The well-structured dictionary in general
  - The well-structured dictionaries
  - Well-structured dictionaries
  - A well-structured dictionaries
  correct_answer: Well-structured dictionaries
  explanation_en: Plural nouns express broad general categories using zero article
    ('Well-structured dictionaries').
  explanation_tr: Çoğul genel ifadelerde kategori genellemesi sıfır artikelle yapılır;
    başına 'the' konmaz.
  distractor_explanations:
    The well-structured dictionaries: Tüm sözlükleri kapsayan genellemede 'the' konursa
      sanki belli birkaç dosyadan söz ediliyor gibi daralır.
    A well-structured dictionaries: Tekil 'a' çoğul 'dictionaries' ile kullanılamaz.
    The well-structured dictionary in general: Genelleme yaparken gereksiz 'the' yapay
      durur.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.zero-article-generics-abstract.02
  target_content_id: grammar.b1.zero-article-generics-abstract
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Avoid unnecessary ''the'' with abstract uncountable nouns:'
  prompt_tr_hint: Soyut ve sayılamayan isimlerdeki fazla 'the' hatasını eleyiniz.
  stem: 'Select the grammatically clean statement about adult learning:'
  options:
  - The patience and the structured repetition matter more than the passive highlighting.
  - Patience and a structured repetition matters more than passive highlighting.
  - The patience and structured repetition matters more than passive highlighting.
  - Patience and structured repetition matter more than passive highlighting.
  correct_answer: Patience and structured repetition matter more than passive highlighting.
  explanation_en: Paired abstract uncountable nouns take zero article in general truths
    and plural verb agreement when joined by 'and'.
  explanation_tr: Genel yargıda soyut isimler 'the' almaz; 'and' ile bağlanan iki
    özne çoğul fiil ('matter') ister.
  distractor_explanations:
    The patience and the structured repetition matter more than the passive highlighting.: Genel
      kavramlarda üç soyut isme de 'the' koymak Türkçe kaynaklı aşırı kullanımdır.
    Patience and a structured repetition matters more than passive highlighting.: İki
      özne 'and' ile bağlandığında çoğul fiil ('matter') alır ve soyut tekile 'a'
      genelde konmaz.
    The patience and structured repetition matters more than passive highlighting.: Hem
      fazla 'the' hem de tekil fiil uyumsuzluğu vardır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.zero-article-generics-abstract.03
  target_content_id: grammar.b1.zero-article-generics-abstract
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Recognize when narrowed context flips zero article to ''the'':'
  prompt_tr_hint: Bağlam daraltıldığında neden 'the' kullanılması gerektiğini seçiniz.
  stem: We audited ___ collected from Q2 pilot users before drafting the report.
  options:
  - the feedback
  - feedback in
  - feedbacks
  - a feedback
  correct_answer: the feedback
  explanation_en: '''The feedback collected from Q2 pilot users'' identifies a defined
    subset, requiring definite ''the''.'
  explanation_tr: '''2. çeyrek pilot kullanıcılarından toplanan'' diye daraltıldığı
    için burada ''the feedback'' zorunludur.'
  distractor_explanations:
    feedbacks: '''feedback'' İngilizcede sayılamayan isimdir, çoğul ''-s'' almaz.'
    a feedback: Sayılamayan 'feedback' önüne 'a' gelmez.
    feedback in: Yapı eksik ve belirli alt kümeyi ('Q2 pilot') işaretlemiyor.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.verb-preposition-direct-traps.01
  target_content_id: grammar.b1.verb-preposition-direct-traps
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the clean transitive construction without intrusive prepositions:'
  prompt_tr_hint: Doğrudan nesne alan fiilde gereksiz edat tuzağından kaçınarak doğru
    seçeneği bulunuz.
  stem: Before locking next month's budget, we need to ___.
  options:
  - explain accounting the licensing tiers
  - emphasize on Q4 licensing tiers
  - discuss Q4 licensing tiers carefully
  - discuss about Q4 licensing tiers carefully
  correct_answer: discuss Q4 licensing tiers carefully
  explanation_en: Keep direct transitive verbs like 'discuss' and 'emphasize' free
    of intrusive prepositions ('about', 'on').
  explanation_tr: '''Discuss'' ve ''emphasize'' doğrudan nesne alır; Türkçe etkisiyle
    ''about'' veya ''on'' eklenmez.'
  distractor_explanations:
    discuss about Q4 licensing tiers carefully: '''discuss'' doğrudan nesne alır;
      asla ''about'' almaz.'
    explain accounting the licensing tiers: '''explain'' alıcıdan önce ''to'' ister
      (''explain X to accounting'').'
    emphasize on Q4 licensing tiers: '''emphasize'' doğrudan nesne alan geçişli fiildir
      (''on'' almaz).'
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.verb-preposition-direct-traps.02
  target_content_id: grammar.b1.verb-preposition-direct-traps
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Fix the classic Turkish ''*explain me'' and ''*depend to'' traps:'
  prompt_tr_hint: Yaygın Türkçe kaynaklı '*explain me' ve '*depend to' edat hatalarını
    düzeltiniz.
  stem: Which sentence shows accurate verb-preposition government?
  options:
  - Could you explain to us the delay unless it depends from vendor customs?
  - Could you explain the delay to us before our timeline depends on vendor customs?
  - Could you explain us the delay before our timeline depends to vendor customs?
  - Could you discuss about the delay while it depends on customs?
  correct_answer: Could you explain the delay to us before our timeline depends on
    vendor customs?
  explanation_en: 'Remember both patterns mechanically: ''explain [something] to [someone]''
    and ''depend on [noun]''.'
  explanation_tr: '''explain X to me'' (''to'' zorunlu) ve ''depend on'' (''from/to''
    değil ''on'') kalıplarını mekanikleştirin.'
  distractor_explanations:
    Could you explain us the delay before our timeline depends to vendor customs?: '''explain
      someone something'' yanlıştır ve ''depend'' edat olarak ''on/upon'' ister.'
    Could you explain to us the delay unless it depends from vendor customs?: '''depend''
      fiili ''from'' değil ''on'' alır (''-e bağlı'' / ''-den'' aktarım tuzağı).'
    Could you discuss about the delay while it depends on customs?: '''discuss'' arkasına
      ''about'' almaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.verb-preposition-direct-traps.03
  target_content_id: grammar.b1.verb-preposition-direct-traps
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the correct verb that drops ''to'' even when movement feels implied:'
  prompt_tr_hint: İçeri girme veya katılım eyleminde fazladan edat almayan doğru kullanımı
    seçiniz.
  stem: Regional leads must ___ tomorrow morning's compliance briefing in person.
  options:
  - participate the
  - enter into to
  - attend to
  - attend
  correct_answer: attend
  explanation_en: Use bare 'attend' for joining a meeting or briefing; 'participate'
    takes 'in'.
  explanation_tr: Toplantıya katılmak için 'attend' doğrudan nesne alır; 'attend to'
    anlam değiştirir.
  distractor_explanations:
    attend to: '''attend to'' ''ilgilenmek/bakmak'' demektir; toplantıya katılmak
      için yalın ''attend'' kullanılır.'
    participate the: '''participate'' edatsız nesne almaz, ''participate in'' gerektirir.'
    enter into to: Çifte edat ('into to') hatalıdır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.phrasal-verb-particle-separability.01
  target_content_id: grammar.b1.phrasal-verb-particle-separability
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Position the object pronoun accurately in a separable phrasal verb:'
  prompt_tr_hint: Ayrılabilir öbek fiilde zamir nesneyi doğru konuma yerleştiriniz.
  stem: We spotted an outdated VAT field on the quote and ___ before emailing.
  options:
  - sorted out for it
  - sorted it out
  - it sorted out
  - sorted out it
  correct_answer: sorted it out
  explanation_en: Short pronouns ('it', 'them', 'me') must sit strictly between verb
    and particle for separable phrasal verbs.
  explanation_tr: Ayrılabilir öbek fiillerde ('sort out', 'turn off') nesne zamir
    ise daima ortaya ('sorted it out') gelir.
  distractor_explanations:
    sorted out it: Ayrılabilir öbek fiillerde kısa zamir ('it/them') edattan sonraya
      atılamaz.
    it sorted out: Nesne yüklemin önüne konamaz.
    sorted out for it: Gereksiz 'for' eklenemez.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.phrasal-verb-particle-separability.02
  target_content_id: grammar.b1.phrasal-verb-particle-separability
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distinguish separable from inseparable prepositional verbs:'
  prompt_tr_hint: Ayrılabilir ve ayrılamaz öbek fiillerin dizim farkını ayırt ediniz.
  stem: Which reply follows English phrasal-verb placement rules?
  options:
  - Thanks for flagging that sync error; our backend lead will look into it right
    away.
  - Thanks for handing the report back in—could you pass out it as well?
  - Please call off it before finance approves the invoice.
  - Thanks for flagging that sync error; our backend lead will look it into right
    away.
  correct_answer: Thanks for flagging that sync error; our backend lead will look
    into it right away.
  explanation_en: '''Look into'' is inseparable (''look into it''), whereas ''pass
    out'' and ''call off'' keep pronouns inside (''call it off'').'
  explanation_tr: '''Look into'' ayrılmazdır (''look into it''); ''call off'' ve ''pass
    out'' ayrılabilir olduğu için zamiri ortaya alır.'
  distractor_explanations:
    Thanks for flagging that sync error; our backend lead will look it into right away.: '''look
      into'' (incelemek) ayrılamaz öbek fiildir; zamir ''into''nun arkasına gelir.'
    Thanks for handing the report back in—could you pass out it as well?: '''pass
      out'' ayrılabilirdir; ''*pass out it'' yerine ''pass it out'' gerekir.'
    Please call off it before finance approves the invoice.: '''call off'' ayrılabilirdir;
      ''*call off it'' değil ''call it off'' doğrudur.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.phrasal-verb-particle-separability.03
  target_content_id: grammar.b1.phrasal-verb-particle-separability
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose natural placement for a long, complex noun object:'
  prompt_tr_hint: Uzun bir isim tamlaması nesne olduğunda en okunaklı öbek fiil sırasını
    seçiniz.
  stem: Before closing QA, be sure to ___.
  options:
  - back up it before closing
  - back up every local user progress file you modified today
  - up back every local user progress file
  - back every local user progress file you modified today up
  correct_answer: back up every local user progress file you modified today
  explanation_en: Heavy multi-word noun objects sit naturally after the particle ('back
    up + [long noun phrase]') for readability.
  explanation_tr: Uzun isim öbeklerinde fiille edatı ayırmayıp ağır nesneyi sona bırakmak
    akıcılığı korur.
  distractor_explanations:
    back every local user progress file you modified today up: Çok uzun isim öbeğini
      ortaya koymak okurun edatı yakalamasını zorlaştırır (end-weight ilkesi).
    back up it before closing: Zamir 'it' ortaya konmak zorundadır.
    up back every local user progress file: Edat fiilin önüne alınamaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.if-vs-whether-uncertainty.01
  target_content_id: grammar.b1.if-vs-whether-uncertainty
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Pick the only valid conjunction directly following a preposition:'
  prompt_tr_hint: Edat ('on') ardından gelebilen tek doğru bağlacı seçiniz.
  stem: Enterprise rollout depends on ___ offline encryption clears Friday audits.
  options:
  - if
  - whether
  - what
  - that
  correct_answer: whether
  explanation_en: Always choose 'whether'—never 'if'—immediately after prepositions
    such as 'on', 'about', or 'of'.
  explanation_tr: Edatlardan ('on / about / over') hemen sonra '-ip -mediği' anlamı
    için yalnızca 'whether' gelebilir.
  distractor_explanations:
    if: Standart İngilizcede edattan hemen sonra ('on if') 'if' kullanılamaz.
    that: '''on that'' belirleyici bir belirsizlik seçimi kurmaz.'
    what: Evet/hayır sonucunu bağlamaz.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.if-vs-whether-uncertainty.02
  target_content_id: grammar.b1.if-vs-whether-uncertainty
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the valid linker immediately preceding ''to + infinitive'' or
    ''or not'':'
  prompt_tr_hint: Mastar ('to') öncesinde veya doğrudan 'or not' ile kullanılan doğru
    yapıyı bulunuz.
  stem: 'Select the grammatically sound planning statement:'
  options:
  - Engineers are deciding whether to compress audio locally or stream it online.
  - Engineers discussed about if or not to compress audio locally.
  - If or not we compress audio locally remains undecided.
  - Engineers are deciding if to compress audio locally or stream it online.
  correct_answer: Engineers are deciding whether to compress audio locally or stream
    it online.
  explanation_en: Before 'to-infinitives' ('whether to compress') and directly before
    'or not' ('whether or not'), 'whether' is mandatory.
  explanation_tr: Mastar önünde ('whether to') ve cümle öznesinde daima 'whether'
    seçilir, 'if' kullanılmaz.
  distractor_explanations:
    Engineers are deciding if to compress audio locally or stream it online.: Doğrudan
      'to + V1' önüne 'if' getirilemez.
    Engineers discussed about if or not to compress audio locally.: Hem 'discuss about'
      hatası hem geçersiz '*if or not' içerir.
    If or not we compress audio locally remains undecided.: Cümle öznesi olarak 'Whether'
      gerekir; 'if or not' başta kullanılmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.if-vs-whether-uncertainty.03
  target_content_id: grammar.b1.if-vs-whether-uncertainty
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Express an outcome unaffected by either alternative:'
  prompt_tr_hint: Sonucun iki ihtimalden de bağımsız olduğunu bildiren kalıbı seçiniz.
  stem: The validation script verifies deterministic hashes ___ network access is
    enabled.
  options:
  - unless whether
  - if or not
  - whether or not
  - despite if
  correct_answer: whether or not
  explanation_en: Concessive 'whether or not' cleanly expresses 'regardless of if
    X is true'.
  explanation_tr: '''Olsa da olmasa da'' anlamında birleşik olarak ''whether or not''
    kullanılır.'
  distractor_explanations:
    if or not: '''if'' doğrudan ''or not'' ile yan yana gelemez.'
    despite if: '''despite'' ardından ''if'' yan cümlesi almaz.'
    unless whether: İki şart bağlacı üst üste binemez.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.stative-vs-dynamic-verbs.01
  target_content_id: grammar.b1.stative-vs-dynamic-verbs
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the natural stative verb form describing software structure right
    now:'
  prompt_tr_hint: Türkçe '-yor' etkisine kapılmadan durum fiilinin doğru şimdiki zaman
    biçimini seçiniz.
  stem: At this moment, the offline glossary ___ over two hundred idiomatic expressions.
  options:
  - contains
  - containing
  - is been containing
  - is containing
  correct_answer: contains
  explanation_en: Stative verbs of composition and possession ('contain', 'own', 'belong')
    take Simple Present even for current facts.
  explanation_tr: '''Şu an içeriyor'' derken ''contain / consist / belong'' durum
    fiilleri -ing almaz, Simple Present kalır.'
  distractor_explanations:
    is containing: '''contain'' (içermek) bir durum fiilidir; ''-yor'' karşılığı olarak
      Continuous almaz.'
    is been containing: Dilbilgisel olarak geçersiz yardımcı fiil dizimidir.
    containing: Çekimli ana yüklem eksiktir.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.stative-vs-dynamic-verbs.02
  target_content_id: grammar.b1.stative-vs-dynamic-verbs
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Contrast stative ''think'' (opinion) with dynamic ''think'' (mental
    processing):'
  prompt_tr_hint: Görüş bildiren durumsal 'think' ile aktif düşünme sürecini ayıran
    doğru cümleyi bulunuz.
  stem: Which dialogue pair distinguishes meaning shifts accurately?
  options:
  - I think our latency looks solid, though I am thinking about caching two extra
    tables.
  - I am thinking our latency looks solid, though I think about caching two extra
    tables.
  - She is preferring to wait until telemetry arrives.
  - I am knowing the invoice numbers, and I am owning two client laptops.
  correct_answer: I think our latency looks solid, though I am thinking about caching
    two extra tables.
  explanation_en: '''I think X'' expresses an opinion; ''I am thinking about Y'' describes
    active present deliberation.'
  explanation_tr: Fikir beyanında 'I think', aktif değerlendirme sürecinde ise 'I
    am thinking about' doğru ayrımdır.
  distractor_explanations:
    I am thinking our latency looks solid, though I think about caching two extra tables.: 'İki
      kullanım ters çevrilmiştir: sabit görüşte ''think'', aktif plan tartmada ''am
      thinking about'' kullanılır.'
    I am knowing the invoice numbers, and I am owning two client laptops.: '''know''
      ve ''own'' stative fiillerdir, -ing alamaz.'
    She is preferring to wait until telemetry arrives.: '''prefer'' zihinsel tercih
      durumudur, Continuous yapılmaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.stative-vs-dynamic-verbs.03
  target_content_id: grammar.b1.stative-vs-dynamic-verbs
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot the valid dynamic use of ''have'' in a workplace calendar update:'
  prompt_tr_hint: Etkinlik anlamında eyleme dönüşüp '-ing' alabilen 'have' kullanımını
    seçiniz.
  stem: Can I call back in twenty minutes? We ___ a quick architecture handoff call
    right now.
  options:
  - are having
  - have been believing
  - are owing
  - are belonging
  correct_answer: are having
  explanation_en: '''Have a meeting / lunch / call'' acts dynamically, allowing Present
    Continuous (''are having'') for in-progress events.'
  explanation_tr: Sahiplikten çıkıp etkinlik ('toplantı yapmak / görüşmek') bildirdiğinde
    'have' Continuous kip alabilir.
  distractor_explanations:
    are belonging: '''belong'' (ait olmak) durum fiilidir, -ing almaz.'
    are owing: '''owe'' (borçlu olmak) durum fiilidir, Continuous olmaz.'
    have been believing: '''believe'' inanç durumudur, sürekli kipte kullanılmaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.question-tags-and-echo-replies.01
  target_content_id: grammar.b1.question-tags-and-echo-replies
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the matching question tag instead of invariant ''isn''t it?'':'
  prompt_tr_hint: Sabit 'değil mi?' aktarımına düşmeden yardımcı fiile uyan soru kuyruğunu
    seçiniz.
  stem: Procurement sent the signed addendum yesterday, ___?
  options:
  - wasn't it
  - haven't they
  - isn't it
  - didn't they
  correct_answer: didn't they
  explanation_en: Past Simple positive statements ('sent') match negative past tag
    'didn't + pronoun'.
  explanation_tr: Geçmiş zamanlı olumlu ana cümlenin ('sent') soru kuyruğu mutlaka
    'didn't' ile kurulur.
  distractor_explanations:
    isn't it: Ana fiil 'be' değil Past Simple 'sent' olduğu için sabit 'isn't it'
      yanlıştır.
    wasn't it: Yüklem 'was' değil eylem fiilidir ('sent' -> 'didn't').
    haven't they: Ana cümle Present Perfect ('have sent') değildir.
  difficulty: foundation
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.question-tags-and-echo-replies.02
  target_content_id: grammar.b1.question-tags-and-echo-replies
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Complete the negative statement with the correct positive tag polarity:'
  prompt_tr_hint: Olumsuz ana cümleye göre doğru kutuplu soru kuyruğunu bulunuz.
  stem: Our offline database never drops existing study history during rebuilds, ___?
  options:
  - has it
  - doesn't it
  - is it
  - does it
  correct_answer: does it
  explanation_en: Adverbs like 'never', 'hardly', or 'seldom' count as negative polarity,
    triggering a positive tag ('does it').
  explanation_tr: '''Never / hardly'' cümleyi olumsuz kıldığı için soru kuyruğu pozitif
    (''does it'') seçilir.'
  distractor_explanations:
    doesn't it: '''never'' cümleyi zaten olumsuz yaptığı için soru kuyruğu olumlu
      (''does it'') olmalıdır.'
    is it: Ana fiil 'be' değil 'drops'tur.
    has it: Ana cümlede 'have/has' yardımcı fiili yoktur.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b1.question-tags-and-echo-replies.03
  target_content_id: grammar.b1.question-tags-and-echo-replies
  cefr_level: B1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the irregular polite question tag after ''I am'':'
  prompt_tr_hint: '''I am ...'' cümlelerinden sonra gelen standart kurallı soru kuyruğunu
    seçiniz.'
  stem: I am presenting the localization rollout summary first, ___?
  options:
  - amn't I
  - isn't it
  - aren't I
  - don't I
  correct_answer: aren't I
  explanation_en: Affirmative 'I am...' anomalously takes the contracted negative
    tag ', aren't I?'.
  explanation_tr: '''I am...'' ile başlayan olumlu cümlelerin kural dışı ama standart
    soru kuyruğu ''aren''t I?'' biçimindedir.'
  distractor_explanations:
    amn't I: Standart İngilizcede 'amn't' kısaltması kullanılmaz.
    isn't it: Özne 'I' olduğu için 'it' ile eşleşmez.
    don't I: Ana yardımcı fiil 'am' olduğu için 'do' seçilmez.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.have-get-something-done-service.01
  target_content_id: grammar.b2.have-get-something-done-service
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the accurate causative construction for delegating legal review:'
  prompt_tr_hint: İşi dış uzmana yaptırdığınızı anlatan doğru ettirgen yapıyı seçiniz.
  stem: Before entering the Turkish healthcare tier, we ___ by outside privacy counsel.
  options:
  - got the consent flow auditing
  - made the consent flow audit
  - had the consent flow audited
  - had audited the consent flow
  correct_answer: had the consent flow audited
  explanation_en: 'Service causative structure puts the noun object directly between
    ''have/get'' and V3: ''had the consent flow audited''.'
  explanation_tr: Hizmet ettirgeninde nesne 'had' ile V3 ('audited') arasında yer
    alır.
  distractor_explanations:
    had audited the consent flow: Bu dizim Past Perfect etken çatısıdır; işi başkasının
      yaptığını belirtmez.
    made the consent flow audit: '''make'' aktif ettirgendir ve ardından nesne+V1
      gerektirir; cansız akış kendi denetleyemez.'
    got the consent flow auditing: Hizmet ettirgeninde V-ing değil geçmiş ortaç (V3)
      kullanılır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.have-get-something-done-service.02
  target_content_id: grammar.b2.have-get-something-done-service
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot the Turkish causative word-order transfer mistake:'
  prompt_tr_hint: Türkçeden aktarımda nesne ile fiil sırasını bozan hatayı düzelten
    cümleyi seçiniz.
  stem: Which sentence accurately tells a team lead to commission third-party QA?
  options:
  - Let us get the offline database tested on older tablets tomorrow.
  - Let us have to test the offline database by external QA.
  - Let us get the offline database to test tomorrow.
  - Let us get tested the offline database on older tablets tomorrow.
  correct_answer: Let us get the offline database tested on older tablets tomorrow.
  explanation_en: '''Get + Object + V3'' assigns external execution clearly when the
    inanimate noun receives the action.'
  explanation_tr: Cansız nesne üzerinde uzman işi yaptırılırken 'get + Nesne + V3'
    yapısı zorunludur.
  distractor_explanations:
    Let us get tested the offline database on older tablets tomorrow.: Nesne ('the
      offline database') V3'ün ('tested') önünde yer almalıdır.
    Let us have to test the offline database by external QA.: '''have to test'' zorunluluk
      kipidir, ettirgen hizmet değildir.'
    Let us get the offline database to test tomorrow.: '''get X to V1'' etken özne
      ister; veritabanı kendi test yapamaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.have-get-something-done-service.03
  target_content_id: grammar.b2.have-get-something-done-service
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distinguish delegated service (''have X done'') from agent-focused ''have
    someone do'':'
  prompt_tr_hint: Eylemi kimin yaptığına göre doğru ettirgen kalıbı seçiniz.
  stem: 'Compare both drafts and pick the sentence matching an internal engineering
    delegation:'
  options:
  - We will have verified our database engineer the deterministic build checksum.
  - We will get our database engineer verified the deterministic build checksum.
  - We will make the checksum to be verify by our engineer.
  - We will have our database engineer verify the deterministic build checksum today.
  correct_answer: We will have our database engineer verify the deterministic build
    checksum today.
  explanation_en: '''Have + Agent (person) + Bare Infinitive (V1)'' delegates an explicit
    task to a named colleague.'
  explanation_tr: Eylemi yapacak kişi belirtildiğinde 'have + kişi + V1' (yalın fiil)
    kullanılır.
  distractor_explanations:
    We will have verified our database engineer the deterministic build checksum.: '''have
      verified'' gelecekteki etken/edilgen ettirgen görevlendirmesi kurmaz.'
    We will get our database engineer verified the deterministic build checksum.: '''get
      + kişi + to V1'' istenir; ''verified'' anlamı bozar.'
    We will make the checksum to be verify by our engineer.: '''make'' sonrasında
      ''to'' kullanılmaz ve ''verify'' V3 eksiktir.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.future-in-the-past-was-going-to.01
  target_content_id: grammar.b2.future-in-the-past-was-going-to
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Express an earlier launch plan that changed before release:'
  prompt_tr_hint: Geçmişte planlanmış ancak sonradan değiştirilmiş yayın takvimini
    anlatan yapıyı seçiniz.
  stem: We ___ the expanded vocabulary deck on Tuesday, yet audit checks caught duplicates.
  options:
  - are going to publish
  - have been publishing
  - were going to publish
  - will have published
  correct_answer: were going to publish
  explanation_en: '''Was/were going to + V1'' frames an unfulfilled past intention
    neatly prior to an unexpected pivot.'
  explanation_tr: Geçmişte '-ecektik ama...' diye aktarılan değişmiş planlar için
    'was/were going to + V1' seçilir.
  distractor_explanations:
    are going to publish: Şimdiki/gelecek niyeti anlatır; Salı günkü değişmiş geçmiş
      planı vermez.
    will have published: Gelecekteki bitmiş zaman yapısıdır, geçmişteki engelle uyuşmaz.
    have been publishing: Kesintisiz süren eylemdir, yarıda kalan eski niyeti ifade
      etmez.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.future-in-the-past-was-going-to.02
  target_content_id: grammar.b2.future-in-the-past-was-going-to
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Fix the tense backshift mistake after a past reporting verb:'
  prompt_tr_hint: Geçmiş zamanlı ana fiilden sonra gelecek tahminini doğru kipe çekiniz.
  stem: 'Select the sentence following sequence-of-tenses rules in finance reporting:'
  options:
  - Nobody expects regional hardware costs was going to rise last winter.
  - Nobody expected regional hardware costs will rising so sharply in Q3.
  - Nobody expected regional hardware costs will rose so sharply in Q3.
  - Nobody expected regional hardware costs would rise so sharply in Q3.
  correct_answer: Nobody expected regional hardware costs would rise so sharply in
    Q3.
  explanation_en: Backshift projected future 'will' to 'would' inside past reports
    ('expected costs would rise').
  explanation_tr: Ana fiil geçmişteyse ('expected') gelecek öngörüsü 'will' yerine
    'would' biçimine çekilir.
  distractor_explanations:
    Nobody expected regional hardware costs will rising so sharply in Q3.: Hem geçmiş
      uyumsuzluğu ('will') hem 'will + V-ing' hatası içerir.
    Nobody expected regional hardware costs will rose so sharply in Q3.: '''will''
      kipinden sonra V2 (''rose'') gelemez.'
    Nobody expects regional hardware costs was going to rise last winter.: '''costs''
      çoğul olduğu için ''was'' uyumsuzdur.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.future-in-the-past-was-going-to.03
  target_content_id: grammar.b2.future-in-the-past-was-going-to
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the construction highlighting a missed contractual schedule duty:'
  prompt_tr_hint: Beklenen bir teslimat sorumluluğunun aksadığını ima eden en doğal
    kalıbı seçiniz.
  stem: Logistics partners ___ clear customs before Monday noon, leaving teams scrambling.
  options:
  - are likely to
  - were supposed to
  - will have to
  - would have had
  correct_answer: were supposed to
  explanation_en: '''Was/were supposed to + V1'' signals a scheduled expectation or
    agreement that failed to occur on time.'
  explanation_tr: '''Was/were supposed to'' zamanında yapılması beklenip aksayan görevleri
    anlatmak için idealdir.'
  distractor_explanations:
    will have to: Gelecek zorunluluğunu anlatır; aksamış geçmiş teslimatı değil.
    are likely to: Şimdiki olasılığı belirtir.
    would have had: Koşul cümlesi sonucudur; beklenen takvim yükümlülüğünü aktarmaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.if-only-wish-vs-hope.01
  target_content_id: grammar.b2.if-only-wish-vs-hope
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the accurate structure for a realistic, achievable upcoming outcome:'
  prompt_tr_hint: Gerçekleşmesi mümkün bir gelecek beklentisi için doğru fiili seçiniz.
  stem: We genuinely ___ regional compliance clears the updated template before Monday.
  options:
  - if only
  - wished
  - wish
  - hope
  correct_answer: hope
  explanation_en: Use 'hope + Present / will' for attainable future hopes; reserve
    'wish' for counterfactual or unreal scenarios.
  explanation_tr: Olası ve gerçekçi gelecek umutları yalnızca 'hope' ile kurulur.
  distractor_explanations:
    wish: Geleceğe dair gerçekleşebilir makul beklentilerde '*wish ... clears/will'
      kullanılmaz.
    if only: '''If only'' cümleyi gerçeğe aykırı pişmanlık veya özlem yapısına taşır,
      özne olmadan fiil almaz.'
    wished: Geçmişe dönük gerçeğe aykırı kipi tetikler.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.if-only-wish-vs-hope.02
  target_content_id: grammar.b2.if-only-wish-vs-hope
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Correct the counterfactual past-regret mistake (''*I wish we tested
    earlier''):'
  prompt_tr_hint: Geçmişe dönük pişmanlıkta eksik zaman kaydırmasını düzelten seçeneği
    bulunuz.
  stem: Which reflection expresses counterfactual regret over a past mistake accurately?
  options:
  - We wish engineers ran deterministic checks back in Q1 instead of skipping.
  - We hope engineers had run deterministic checks back in Q1.
  - If only engineers run deterministic checks prior to packing release v4.
  - If only engineers had run deterministic checks prior to packing release v4.
  correct_answer: If only engineers had run deterministic checks prior to packing
    release v4.
  explanation_en: Counterfactual past regrets after 'wish' or 'if only' require Past
    Perfect ('had run', 'had verified').
  explanation_tr: Geçmişte yapılamamış bir işe hayıflanırken 'wish / if only' daima
    Past Perfect ('had + V3') ister.
  distractor_explanations:
    If only engineers run deterministic checks prior to packing release v4.: Geçmiş
      pişmanlıkta geniş zaman ('run') kullanılmaz; Past Perfect şarttır.
    We wish engineers ran deterministic checks back in Q1 instead of skipping.: Belirli
      geçmiş zaman ('back in Q1') pişmanlığında Past Simple değil 'had V3' gerekir.
    We hope engineers had run deterministic checks back in Q1.: Tamamlanmış bilinen
      geçmiş pişmanlıklarında 'hope' yerine 'wish / if only' kullanılır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.if-only-wish-vs-hope.03
  target_content_id: grammar.b2.if-only-wish-vs-hope
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Form a polite complaint wishing another party would change ongoing behavior:'
  prompt_tr_hint: Başka bir tarafın can sıkıcı bir alışkanlığı değiştirmesini dileyen
    yapıyı seçiniz.
  stem: Account reps wish procurement ___ splitting multi-tier renewals into separate
    chats.
  options:
  - had stopped now
  - stopped to
  - would stop
  - will stop
  correct_answer: would stop
  explanation_en: Use 'wish + Different Subject + would + V1' to express dissatisfaction
    about someone else's repeated behavior.
  explanation_tr: Başkasının şu anki tutumunu değiştirmesi beklendiğinde 'wish + başka
    özne + would + V1' seçilir.
  distractor_explanations:
    stopped to: '''stop to + V-ing'' hatalıdır ve mevcut yakınmayı karşılamaz.'
    will stop: '''wish'' asla ''will'' almaz.'
    had stopped now: '''had stopped'' geçmişe aittir, ''now'' ile davranış şikayeti
      kurmaz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.had-better-vs-should-would-rather.01
  target_content_id: grammar.b2.had-better-vs-should-would-rather
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Apply ''would rather'' correctly when preferring what another person
    or team does:'
  prompt_tr_hint: Başka bir öznenin şimdiki/gelecek tercihine işaret eden 'would rather'
    kipini seçiniz.
  stem: We would rather outside legal counsel ___ clause six before Friday's signing
    call.
  options:
  - reviews
  - reviewed
  - would review
  - to review
  correct_answer: reviewed
  explanation_en: Different-subject 'would rather' shifts verbs to Past Simple ('reviewed')
    for present/future preferences.
  explanation_tr: Başkasının yapmasını tercih ettiğiniz durumlarda 'would rather +
    Özne + V2 (geçmiş biçim)' kullanılır.
  distractor_explanations:
    reviews: Farklı özne geldiğinde 'would rather' geniş zaman değil Past Subjunctive
      ('reviewed') ister.
    to review: '''would rather'' ardından nesne + mastar (''*would rather them to
      review'') almaz.'
    would review: İkinci cümlecikte tekrar 'would' konmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.had-better-vs-should-would-rather.02
  target_content_id: grammar.b2.had-better-vs-should-would-rather
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Eliminate the invasive ''to'' after ''had better'' and pick urgent risk
    tone:'
  prompt_tr_hint: '''Had better'' kalıbında yalın fiil ve uyarı tonunu doğru koruyan
    seçeneği seçiniz.'
  stem: Which operational warning is both grammatically clean and pragmatically fitting?
  options:
  - We had rather not to wait until Friday checks finish.
  - We had better to test the rollback snapshot now before touching production keys.
  - We had better test the rollback snapshot now before touching production keys.
  - Would you like a coffee? You had better drink one right away!
  correct_answer: We had better test the rollback snapshot now before touching production
    keys.
  explanation_en: '''Had better + bare infinitive'' warns of concrete negative consequences
    if action is skipped.'
  explanation_tr: '''Had better'' mutlaka yalın fiil alır (''to''suz) ve yapılmazsa
    doğacak somut riski uyarır.'
  distractor_explanations:
    We had better to test the rollback snapshot now before touching production keys.: '''had
      better'' modal gibi davranır ve asla ''to'' almaz.'
    Would you like a coffee? You had better drink one right away!: '''had better''
      kibar ikram değil, yapılmazsa risk doğacak uyarı ifade eder.'
    We had rather not to wait until Friday checks finish.: Hem 'would rather' yerine
      'had rather' eğreti kalır hem de fazla 'to' içerir.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.had-better-vs-should-would-rather.03
  target_content_id: grammar.b2.had-better-vs-should-would-rather
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Form negative ''had better'' cleanly:'
  prompt_tr_hint: Olumsuz uyarı ('yapmasak iyi olur') için 'not' kelimesini doğru
    yere koyunuz.
  stem: Given pending schema checks, you ___ manual edits directly into content.db.
  options:
  - had better not push
  - had better don't push
  - had better not to push
  - hadn't better push
  correct_answer: had better not push
  explanation_en: 'Place ''not'' directly after ''better'' and keep the base verb
    bare: ''had better not push''.'
  explanation_tr: Olumsuz biçim daima 'had better not + V1' şeklindedir.
  distractor_explanations:
    hadn't better push: 'Doğal olumsuzlama ''had''e değil ''better''ın arkasına gelir:
      ''had better not''.'
    had better don't push: '''had better'' sonrası yardımcı ''don''t'' konamaz.'
    had better not to push: '''had better'' mastar ''to'' kabul etmez.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.participle-vs-relative-modifiers.01
  target_content_id: grammar.b2.participle-vs-relative-modifiers
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose active vs. passive post-nominal participle modifier correctly:'
  prompt_tr_hint: Nitelediği isme göre etken (-ing) veya edilgen (-ed/V3) ortacı seçiniz.
  stem: Every rule ___ inside AGENTS.md applies automatically across batch reviews.
  options:
  - which documenting
  - documenting
  - documented
  - that documented
  correct_answer: documented
  explanation_en: '''Every rule documented inside...'' reduces passive ''that is documented''
    cleanly to V3.'
  explanation_tr: '''AGENTS.md içinde belgelenen kural'' anlamında edilgen sıfat ortacı
    (''documented'') kullanılır.'
  distractor_explanations:
    documenting: Kural belgelemeyi kendisi yapmaz; belge içinde tanımlanmıştır (edilgen
      V3 gerekir).
    that documented: Eksik edilgen yardımcı fiil ('that IS documented') nedeniyle
      yanlıştır.
    which documenting: Eksik 'is' yüzünden kopuk yapıdır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.participle-vs-relative-modifiers.02
  target_content_id: grammar.b2.participle-vs-relative-modifiers
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot and fix the Turkish participle-voice confusion error:'
  prompt_tr_hint: Edilgen nesneye '-ing' ekleyen hatalı çeviriyi düzeltiniz.
  stem: 'Select the sentence expressing passive authorship accurately:'
  options:
  - All entries packaging in batch 007 carry verified Turkish trap explanations.
  - All rows generating by our validation script need reviewing.
  - All entries packaged in batch 007 carry verified Turkish trap explanations.
  - Only files signing by security clear distribution.
  correct_answer: All entries packaged in batch 007 carry verified Turkish trap explanations.
  explanation_en: Nouns receiving the action ('entries packaged', 'rows generated')
    require past participles (-ed/V3), never -ing.
  explanation_tr: Eylemden etkilenen isimleri niteleyen ortaçlar daima V3 ('packaged
    / generated') olmalıdır.
  distractor_explanations:
    All entries packaging in batch 007 carry verified Turkish trap explanations.: Kelime
      kayıtları kendi kendini paketlemez; 'packaged' gerekir.
    All rows generating by our validation script need reviewing.: '''by our script''
      açıkça edilgenlik belirtir; ''generated'' olmalıdır.'
    Only files signing by security clear distribution.: Dosyalar imzalamaz, imzalanır
      ('signed by security').
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.participle-vs-relative-modifiers.03
  target_content_id: grammar.b2.participle-vs-relative-modifiers
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the natural active participle describing a blocker ticket:'
  prompt_tr_hint: Aktif olarak bir engeli oluşturan özneyi niteleyen ortacı seçiniz.
  stem: QA engineers resolved the only regression ___ offline audio playback.
  options:
  - preventing
  - prevented
  - been preventing
  - to prevented
  correct_answer: preventing
  explanation_en: Because the regression actively blocks audio playback, active present
    participle 'preventing' is exact.
  explanation_tr: Gerileme hatası oynatmayı aktif biçimde engellediği için etken ortaç
    'preventing' doğru seçimdir.
  distractor_explanations:
    prevented: Hata engellenmedi; bizzat ses oynatmayı engelliyordu (etken -ing gerekir).
    to prevented: '''to'' + geçmiş zaman biçimi geçersizdir.'
    been preventing: Bağlaçsız veya yardımcı fiilsiz ortaç olarak kullanılamaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.gradable-vs-extreme-adjectives.01
  target_content_id: grammar.b2.gradable-vs-extreme-adjectives
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the idiomatic degree adverb pairing with an extreme/non-gradable
    adjective:'
  prompt_tr_hint: Derecelendirilemeyen mutlak sıfatla doğru zarf eşleşmesini seçiniz.
  stem: Keeping deterministic builds intact is ___ essential before shipping offline
    assets.
  options:
  - fairly
  - slightly
  - absolutely
  - very
  correct_answer: absolutely
  explanation_en: Non-gradable limit adjectives ('essential', 'identical', 'exhaustive')
    take absolutes like 'absolutely', 'utterly', or 'virtually'.
  explanation_tr: Mutlak sınır sıfatları ('essential / critical / impossible') 'very
    / slightly' değil 'absolutely / completely' zarfları ister.
  distractor_explanations:
    very: '''essential'' mutlak uç sıfat olduğu için dereceli ''very'' ile doğal eşleşmez.'
    fairly: Kısmi derece zarfı 'essential' ile anlamca çelişir.
    slightly: '''hafifçe vazgeçilmez'' mantıksal çelişki doğurur.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.gradable-vs-extreme-adjectives.02
  target_content_id: grammar.b2.gradable-vs-extreme-adjectives
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Identify the sentence free of gradable-vs-extreme collocation errors:'
  prompt_tr_hint: Derece zarfı ile sıfat uyumunu doğru kuran seçeneği belirleyiniz.
  stem: Which audit summary follows natural executive collocation standards?
  options:
  - Both YAML outputs remain somewhat identical down to the last byte.
  - Shipping plaintext secrets would be a very disastrous and slightly impossible
    risk.
  - The redesigned dashboard looks very clean, and offline startup proved virtually
    instantaneous.
  - The redesigned dashboard looks absolutely cleanish, and startup proved very instantaneous.
  correct_answer: The redesigned dashboard looks very clean, and offline startup proved
    virtually instantaneous.
  explanation_en: Pair scalar 'clean' with 'very', while modifying limit adjectives
    ('instantaneous') with 'virtually / utterly'.
  explanation_tr: Dereceli sıfatlarda 'very', mutlak uç sıfatlarda ise 'virtually
    / utterly / completely' kullanın.
  distractor_explanations:
    The redesigned dashboard looks absolutely cleanish, and startup proved very instantaneous.: '''instantaneous''
      (anlık) mutlak sıfattır, ''very'' almaz.'
    Shipping plaintext secrets would be a very disastrous and slightly impossible risk.: '''disastrous''
      ve ''impossible'' mutlak sıfatları ''very/slightly'' ile birleşmez.'
    Both YAML outputs remain somewhat identical down to the last byte.: '''identical''
      mutlak eşitlik bildirir; ''virtually identical'' uygunken ''somewhat'' zayıf
      düşer.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.gradable-vs-extreme-adjectives.03
  target_content_id: grammar.b2.gradable-vs-extreme-adjectives
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Calibrate ''quite'' properly between gradable vs. non-gradable nuance:'
  prompt_tr_hint: '''Quite'' zarfının mutlak sıfatla birleştiğindeki kesin anlamını
    belirleyiniz.'
  stem: Reviewers confirmed the vendor's excuse for missing backups was ___ unfounded.
  options:
  - fairly
  - a little
  - moderately
  - completely
  correct_answer: completely
  explanation_en: '''Completely / utterly unfounded'' gives natural formal precision
    for an absolute negative evaluation.'
  explanation_tr: '''Tamamen temelsiz'' yargısı mutlak zarf (''completely / utterly'')
    ile kurulur.'
  distractor_explanations:
    a little: '''unfounded'' (mesnetsiz) mutlak değerlendirmede ''biraz mesnetsiz''
      yerine kesin zarf alır.'
    moderately: '''orta düzeyde asılsız'' doğal eşdizim değildir.'
    fairly: '''fairly'' olumlu/nötr derecelendirmeye kayar, ''unfounded'' ile zayıf
      durur.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.preposition-stranding-vs-formal-fronting.01
  target_content_id: grammar.b2.preposition-stranding-vs-formal-fronting
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Apply formal preposition fronting cleanly without breaking relative
    pronoun rules:'
  prompt_tr_hint: Resmi yazıda edatı ilgi zamirinin önüne alırken doğru zamiri seçiniz.
  stem: The audit threshold ___ automated approval depends is documented in section
    four.
  options:
  - on which
  - what
  - on that
  - which on
  correct_answer: on which
  explanation_en: Fronted prepositions permit ONLY 'which' (things) or 'whom' (people)—never
    'that' or 'who'.
  explanation_tr: Edat öne çekildiğinde araya 'that' veya 'who' değil, yalnızca 'which'
    ya da 'whom' gelebilir.
  distractor_explanations:
    on that: Edat önden getirildiğinde ilgi zamiri asla 'that' olamaz ('which' zorunludur).
    which on: Edat önde gelecekse zamirden önce ('on which') yer almalıdır.
    what: Öncesinde isim ('threshold') bulunan ilgi tümceciğinde 'what' bağlacı kullanılmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.preposition-stranding-vs-formal-fronting.02
  target_content_id: grammar.b2.preposition-stranding-vs-formal-fronting
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot and repair duplicated prepositions in formal clauses:'
  prompt_tr_hint: İlgi cümleciğinde edatın hem başta hem sonda tekrarlandığı hatayı
    düzelten seçeneği bulunuz.
  stem: Which contract clause avoids preposition duplication cleanly?
  options:
  - Please list the regional counsel with whom your procurement lead coordinated.
  - Please list the regional counsel with that your procurement lead coordinated.
  - Please list the regional counsel with who your procurement lead coordinated.
  - Please list the regional counsel with whom your procurement lead coordinated with.
  correct_answer: Please list the regional counsel with whom your procurement lead
    coordinated.
  explanation_en: Keep the preposition either at the front before 'whom/which' OR
    stranded once at the end—never both.
  explanation_tr: Edat ya başta ('with whom') ya da sonda kalır; aynı cümlede iki
    kez tekrarlanmaz.
  distractor_explanations:
    Please list the regional counsel with whom your procurement lead coordinated with.: Çifte
      'with' ('with whom ... coordinated with') tekrarı hatalıdır.
    Please list the regional counsel with who your procurement lead coordinated.: Edatın
      hemen ardından 'who' değil 'whom' gelmelidir.
    Please list the regional counsel with that your procurement lead coordinated.: Edat
      önüne 'that' gelemez.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.preposition-stranding-vs-formal-fronting.03
  target_content_id: grammar.b2.preposition-stranding-vs-formal-fronting
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select natural conversational preposition stranding for spoken teamwork:'
  prompt_tr_hint: Sözlü ekip içi iletişimde en doğal düşen edat konumunu seçiniz.
  stem: Which regional lead was that escalation thread ___?
  options:
  - that assigned
  - whom assigned
  - assigned to
  - assigned to whom
  correct_answer: assigned to
  explanation_en: Spoken questions naturally strand 'to' cleanly at the clause end
    ('Which lead was it assigned to?').
  explanation_tr: Günlük iş konuşmasında soru öbeği baştayken edat doğal biçimde sonda
    kalır ('assigned to?').
  distractor_explanations:
    assigned to whom: '''Which regional lead'' zaten sorulduğu için sonda tekrar ''whom''
      yer alamaz.'
    whom assigned: Edilgen yapı ve özne dizimi kopuktur.
    that assigned: Sorunun edatı ('to') tamamen düşürülmüştür.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.passive-reporting-need-doing-suppose.01
  target_content_id: grammar.b2.passive-reporting-need-doing-suppose
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the natural active-looking passive repair structure for inanimate
    objects:'
  prompt_tr_hint: Cansız bir nesnenin bakım/düzeltme ihtiyacını anlatan doğru yapıyı
    seçiniz.
  stem: Several hardcoded row assertions in the test suite ___ after expanding vocabulary.
  options:
  - need to update
  - are needing update
  - need updating
  - need update
  correct_answer: need updating
  explanation_en: '''Inanimate Noun + need + V-ing'' expresses passive necessity identically
    to ''need to be + V3''.'
  explanation_tr: Cansız öznelerde 'güncellenmesi gerekiyor' demek için 'need updating'
    veya 'need to be updated' kullanılır.
  distractor_explanations:
    need to update: Cansız test dosyaları kendi kendine güncelleme yapamaz; 'need
      updating' veya 'need to be updated' şarttır.
    need update: '''need'' isim almadan fiili yalın bırakamaz.'
    are needing update: '''need'' durum fiilidir, Continuous almaz ve fiil eksiktir.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.passive-reporting-need-doing-suppose.02
  target_content_id: grammar.b2.passive-reporting-need-doing-suppose
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Fix the Turkish passive-deletion error with ''needs / requires'':'
  prompt_tr_hint: Türkçe edilgen aktarım hatası yüzünden etken bırakılan bakım cümlesini
    düzeltiniz.
  stem: Which maintenance note conveys passive repair accurately?
  options:
  - These schema tables require to verify twice by QA.
  - Three outdated Turkish trap notes still require to review before database packing.
  - Your tablet microphone needs to repair before live speaking drills.
  - Three outdated Turkish trap notes still require reviewing before database packing.
  correct_answer: Three outdated Turkish trap notes still require reviewing before
    database packing.
  explanation_en: '''Need / require + gerund (-ing)'' delivers crisp passive meaning
    without wordy ''to be + V3'' stacks.'
  explanation_tr: '''Require / need + -ing'' kalıbı cansız öznelerde kısa ve doğal
    edilgen gereklilik sağlar.'
  distractor_explanations:
    Three outdated Turkish trap notes still require to review before database packing.: Notlar
      kendi kendini inceleyemez; 'require reviewing' veya 'require to be reviewed'
      gereklidir.
    Your tablet microphone needs to repair before live speaking drills.: Mikrofon
      kendi kendine tamir edemez ('needs repairing / needs to be repaired').
    These schema tables require to verify twice by QA.: Tablolar için edilgen yapı
      şarttır ('require verifying / to be verified').
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.passive-reporting-need-doing-suppose.03
  target_content_id: grammar.b2.passive-reporting-need-doing-suppose
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distinguish expected norm (''is supposed to'') from official formal
    directive (''is to be''):'
  prompt_tr_hint: Uygulamada aksayabilen kural beklentisi ile kesin resmi talimatı
    ayırt ediniz.
  stem: 'Select the phrasing fitting a contractual requirement rather than casual
    office habit:'
  options:
  - Every release build is supposing to verify prior to publishing.
  - Every release build supposed to be verified prior to publishing.
  - Every release build needs verify offline prior to publishing.
  - Every release build is to be verified offline prior to publishing.
  correct_answer: Every release build is to be verified offline prior to publishing.
  explanation_en: Formal 'be to + passive infinitive' ('is to be verified') encodes
    authoritative official rules cleanly.
  explanation_tr: Resmi şartname ve politikalarda 'is to be + V3' kesin zorunluluk
    ifade eder.
  distractor_explanations:
    Every release build is supposing to verify prior to publishing.: '''suppose''
      bu yapıda daima edilgendir (''is supposed to''), aktif ''-ing'' almaz.'
    Every release build needs verify offline prior to publishing.: '''needs'' ardına
      yalın fiil almaz.'
    Every release build supposed to be verified prior to publishing.: '''was/is''
      yardımcı fiili atlanmıştır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.contrast-on-contrary-vs-other-hand.01
  target_content_id: grammar.b2.contrast-on-contrary-vs-other-hand
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the accurate contrastive linker to introduce a balancing downside:'
  prompt_tr_hint: İlk cümleyi çürütmeden karşı yönünü dengeleyen doğru bağlacı seçiniz.
  stem: Offline storage keeps study snappy anywhere; ___, bundle size needs steady
    pruning.
  options:
  - for this purpose
  - on the contrary
  - on the other hand
  - as a result
  correct_answer: on the other hand
  explanation_en: Use 'on the other hand' to weigh a valid counter-aspect without
    denying the opening point.
  explanation_tr: Önceki gerçeği reddetmeden diğer yüzünü dengelerken 'on the contrary'
    değil 'on the other hand' seçilir.
  distractor_explanations:
    on the contrary: İlk iddiayı reddedip tam zıddını savunur; 'çevrimdışı hız iyidir'
      ifadesini bozar.
    for this purpose: Amaç bağlacıdır, karşıt dengeyi kurmaz.
    as a result: Neden-sonuç bağlar, ödünleşim kurmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.contrast-on-contrary-vs-other-hand.02
  target_content_id: grammar.b2.contrast-on-contrary-vs-other-hand
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Identify when ''on the contrary'' is logically accurate vs. misused:'
  prompt_tr_hint: '''On the contrary'' bağlacının yanlış iddiayı çürütmek için doğru
    kullanıldığı seçeneği bulunuz.'
  stem: Which pair preserves clear logical coherence?
  options:
  - We lowered upfront storage; on the contrary, users appreciated fast startup.
  - B1 exercises build rhythm; on the contrary, C2 lessons require diplomatic precision.
  - Offline apps need careful curation; on the contrary, live chat needs low server
    latency.
  - Validation checks did not slow builds down; on the contrary, they prevented hours
    of debugging.
  correct_answer: Validation checks did not slow builds down; on the contrary, they
    prevented hours of debugging.
  explanation_en: Reserve 'on the contrary' for rejecting a false preceding premise
    and proving the opposite.
  explanation_tr: '''On the contrary'' ancak önceki olumsuz veya hatalı savı tamamen
    tersine çevirdiğinizde kullanılır.'
  distractor_explanations:
    Offline apps need careful curation; on the contrary, live chat needs low server latency.: İki
      ayrı alanın özelliğini karşılaştırırken 'in contrast / whereas' gerekir; 'on
      the contrary' ilkini yalanlar.
    B1 exercises build rhythm; on the contrary, C2 lessons require diplomatic precision.: İki
      düzey farklılığını kıyaslamada 'by contrast' gerekir.
    We lowered upfront storage; on the contrary, users appreciated fast startup.: Beklenen
      olumsuzluk reddedilmemiştir; pozitif sonuç bağlacı değildir.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.contrast-on-contrary-vs-other-hand.03
  target_content_id: grammar.b2.contrast-on-contrary-vs-other-hand
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Contrast two separate entities cleanly without contradiction:'
  prompt_tr_hint: İki ayrı modülün tasarım karakterini yan yana kıyaslayan doğru ifadeyi
    seçiniz.
  stem: Live speaking screens stay visually responsive; ___, reading views stay deliberately
    quiet.
  options:
  - in contrast
  - on the contrary
  - otherwise
  - thereby
  correct_answer: in contrast
  explanation_en: '''In contrast'' (or ''by contrast'') sets two subjects side by
    side cleanly to spotlight differing design goals.'
  explanation_tr: İki farklı ürün/ekran özelliğini yan yana koyarken en temiz bağlaç
    'in contrast'tır.
  distractor_explanations:
    on the contrary: İlk cümlenin doğru olmadığını iddia eder, iki ekran türünü kıyaslamaz.
    otherwise: Koşulsuz veya aksi durum sonucunu verir.
    thereby: Araç-sonuç ilişkisi kurar, kıyas yapmaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.negative-scope-hardly-none-not-all.01
  target_content_id: grammar.b2.negative-scope-hardly-none-not-all
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Avoid double negation with broad negative adverbials like ''hardly'':'
  prompt_tr_hint: '''Hardly / barely'' zarflarıyla çift olumsuzluk hatası yapmadan
    doğru cümleyi seçiniz.'
  stem: Because subway noise drowned the call, we ___ verify the caller's regional
    code.
  options:
  - couldn't hardly
  - could hardly
  - didn't barely
  - could hardly not
  correct_answer: could hardly
  explanation_en: '''Hardly'', ''barely'', and ''scarcely'' already carry negative
    meaning and must pair with positive auxiliaries (''could hardly'').'
  explanation_tr: '''Hardly / barely'' kendi içinde olumsuzluk taşır; önüne ayrıca
    ''couldn''t / didn''t'' getirilmez.'
  distractor_explanations:
    couldn't hardly: '''hardly'' zaten olumsuz anlam taşıdığı için ''couldn''t'' ile
      birleşince çift olumsuzluk olur.'
    could hardly not: '''hardly not'' anlamı tersine çevirir ve kuralsızdır.'
    didn't barely: '''barely'' olumsuz kutupludur; ''didn''t'' ile birlikte kullanılamaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.negative-scope-hardly-none-not-all.02
  target_content_id: grammar.b2.negative-scope-hardly-none-not-all
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Eliminate partial vs. total negation ambiguity in a policy memo:'
  prompt_tr_hint: '''Hepsi değil ama bazıları'' (kısmi) ile ''hiçbiri'' (tam) ayrımını
    net veren cümleyi seçiniz.'
  stem: 'You want to state clearly that a subset of users stays unaffected while some
    need migration. Write cleanly:'
  options:
  - Not all enterprise accounts require manual key rotation this Friday.
  - All accounts hardly ever don't require key rotation.
  - None of enterprise accounts require none of the key checks.
  - All enterprise accounts do not require manual key rotation this Friday.
  correct_answer: Not all enterprise accounts require manual key rotation this Friday.
  explanation_en: Front 'Not all...' for unmistakable partial negation, leaving 'None
    of the...' for absolute zero.
  explanation_tr: Kısmi istisna bildirmede 'All ... do not' yerine mutlaka cümle başında
    'Not all...' kullanın.
  distractor_explanations:
    All enterprise accounts do not require manual key rotation this Friday.: '''All
      ... not'' İngilizcede kısmi mi tam mı olduğu belirsiz muğlak ifade sayılır.'
    None of enterprise accounts require none of the key checks.: '''None'' ile ikinci
      ''none'' çift olumsuzluk yaratır; ayrıca ''the'' eksiktir.'
    All accounts hardly ever don't require key rotation.: Hem çok dolambaçlı hem 'hardly
      + don't' çift olumsuzluğu barındırır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.b2.negative-scope-hardly-none-not-all.03
  target_content_id: grammar.b2.negative-scope-hardly-none-not-all
  cefr_level: B2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Apply formal agreement with ''None of + Plural Noun'' in strict prose:'
  prompt_tr_hint: '''None of'' yapısı tekil-çoğul fiil esnekliğiyle kurulurken çift
    olumsuzluk içermeyen doğal seçimi bulunuz.'
  stem: After deterministic cleaning, ___ the candidate vocabulary IDs contained banned
    batch prefixes.
  options:
  - none of
  - neither of all
  - not none of
  - scarcely none of
  correct_answer: none of
  explanation_en: '''None of + the/determiner + plural noun'' denotes strictly zero
    across sets of three or more without negative modifiers.'
  explanation_tr: Üç ve üzeri grupta 'hiçbiri ...madı' demek için 'none of the...'
    olumlu fiille ('contained') kurulur.
  distractor_explanations:
    neither of all: '''neither'' yalnızca tam iki öğe için geçerlidir (''all'' ile
      birleşmez).'
    not none of: Resmi teknik yazımda çift olumsuzluk anlamı gereksiz yere bulandırır.
    scarcely none of: '''scarcely'' + ''none'' çift olumsuzluk hatasıdır; doğrusu
      ''scarcely any of'' olmalıdır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.dangling-participles-subject-alignment.01
  target_content_id: grammar.c1.dangling-participles-subject-alignment
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the main clause whose grammatical subject aligns cleanly with
    the opening modifier:'
  prompt_tr_hint: Baştaki ortaç öbeğinin faili ile uyumlu özneye sahip ana cümleyi
    seçiniz.
  stem: Having audited all five regional ledgers, ___.
  options:
  - the finance team released the clean Q4 consolidation
  - the clean Q4 consolidation was released on Friday
  - releasing Q4 consolidation happened smoothly on Friday
  - several rounding errors surfaced immediately in export
  correct_answer: the finance team released the clean Q4 consolidation
  explanation_en: The subject immediately following the comma ('the finance team')
    must match the agent who audited the ledgers.
  explanation_tr: Virgülden sonraki ilk özne baştaki denetimi bizzat yapan ekip ('the
    finance team') olmalıdır.
  distractor_explanations:
    the clean Q4 consolidation was released on Friday: Rapor kendi kendini denetleyemez;
      edilgen özne asılı ortaç hatası oluşturur.
    several rounding errors surfaced immediately in export: Hatalar defterleri denetlemiş
      olamaz; failler uyumsuz kalır.
    releasing Q4 consolidation happened smoothly on Friday: '''releasing'' adlı eylem
      öznesi denetimi yapan taraf değildir.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.dangling-participles-subject-alignment.02
  target_content_id: grammar.c1.dangling-participles-subject-alignment
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot and correct a classic dangling participle in an engineering update:'
  prompt_tr_hint: Teknik özetlerde yaygın görülen asılı ortaç (dangling modifier)
    hatasını düzelten cümleyi seçiniz.
  stem: Which revision preserves grammatical subject agreement?
  options:
  - Reviewing offline logs carefully, an intermittent retry loop appeared on screen.
  - While inspecting duplicate IDs, two scripts were immediately flagged as stale.
  - Before uploading builds to staging, checksum verification happened.
  - Reviewing offline logs carefully, engineers spotted an intermittent retry loop.
  correct_answer: Reviewing offline logs carefully, engineers spotted an intermittent
    retry loop.
  explanation_en: Keep the active agent ('engineers') right after 'Reviewing...' so
    modifier and subject agree.
  explanation_tr: Baştaki eylemi yapan kişi ('engineers') virgülden hemen sonra ana
    özne olarak yer almalıdır.
  distractor_explanations:
    Reviewing offline logs carefully, an intermittent retry loop appeared on screen.: Döngü
      kayıtları incelemiş olamaz; fail özne eksiktir.
    While inspecting duplicate IDs, two scripts were immediately flagged as stale.: Edilgen
      betikler incelemeyi yapan kişi değildir.
    Before uploading builds to staging, checksum verification happened.: Doğrulama
      eylemi yüklemeyi yapan ekip öznesini gizlemiştir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.dangling-participles-subject-alignment.03
  target_content_id: grammar.c1.dangling-participles-subject-alignment
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Match a passive past-participle opening with its logical receiver subject:'
  prompt_tr_hint: Edilgen ortaçla açılan cümleyi mantıksal nesnesiyle doğru eşleştiriniz.
  stem: Engineered specifically for tunnel commutes, ___.
  options:
  - the offline SQLite engine serves drills without mobile data
  - passengers can run drills without wasting roaming data
  - engineers packed assets deterministically in CI
  - tunnel commutes never block active speaking drills
  correct_answer: the offline SQLite engine serves drills without mobile data
  explanation_en: Past-participle opener 'Engineered for...' modifies the software
    engine itself, so 'the offline SQLite engine' must follow.
  explanation_tr: Edilgen açılış ('Engineered...') doğrudan tasarlanan sistemi yani
    'the offline SQLite engine' öznesini ister.
  distractor_explanations:
    passengers can run drills without wasting roaming data: Yolcular tünel yolculuğu
      için tasarlanmış 'mühendislik ürünü' değildir.
    tunnel commutes never block active speaking drills: İşe gidiş yolculukları yazılım
      olarak inşa edilmemiştir.
    engineers packed assets deterministically in CI: '''Engineered for...'' mühendisleri
      değil ürünü/motoru niteler.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.concessive-as-though-fronting.01
  target_content_id: grammar.c1.concessive-as-though-fronting
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Construct a graceful C1 concessive fronting structure before pivoting:'
  prompt_tr_hint: Bir görüşün gücünü teslim edip karşı argümana geçerken doğru devrik
    bağlaç dizimini seçiniz.
  stem: ___ that enterprise pitch sounded, unit economics still stayed unproven.
  options:
  - Although persuasive as
  - Persuasive as
  - Persuasive although
  - Even persuasive though
  correct_answer: Persuasive as
  explanation_en: Fronted predicate concession always places 'Adjective + as / though'
    right before the subject and verb.
  explanation_tr: Öne çekilmiş sıfatla ödünleşim cümlesi mutlaka 'Sıfat + as / though
    + Özne + Fiil' biçiminde kurulur.
  distractor_explanations:
    Persuasive although: Sıfat öne çekildiğinde bağlaç olarak 'although' kullanılmaz
      ('as' veya 'though' gerekir).
    Even persuasive though: '''Even'' sıfatın önüne bu şekilde gelemez (''Even though
      persuasive...'' da bozuktur).'
    Although persuasive as: İki zıtlık bağlacı üst üste binemez.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.concessive-as-though-fronting.02
  target_content_id: grammar.c1.concessive-as-though-fronting
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Eliminate unwanted articles when fronting singular countable nouns in
    concession:'
  prompt_tr_hint: Tekil sayılabilir isim öne alındığında artikel düşürme kuralını
    doğru uygulayan cümleyi seçiniz.
  stem: Which executive remark follows formal concessive fronting rules?
  options:
  - An innovator though she is, she insists on deterministic regression tests first.
  - Though an innovator she is, she insists on deterministic tests first.
  - Innovator though she is, she insists on deterministic regression tests first.
  - However innovator she is, deterministic tests come first.
  correct_answer: Innovator though she is, she insists on deterministic regression
    tests first.
  explanation_en: When fronting a singular countable role noun before 'though/as',
    drop the indefinite article ('Innovator though she is').
  explanation_tr: '''Tekil İsim + though/as + Özne + be'' yapısında baştaki ismin
    önünden ''a/an'' mutlaka atılır.'
  distractor_explanations:
    An innovator though she is, she insists on deterministic regression tests first.: Bu
      devrik kalıpta başa alınan tekil isim ('Innovator') önündeki 'an' artikelini
      düşürür.
    Though an innovator she is, she insists on deterministic tests first.: Söz dizimi
      kırılmıştır; isim öne geçecekse 'Innovator though she is' olmalıdır.
    However innovator she is, deterministic tests come first.: '''However'' sıfat/zarf
      alır, çıplak isim almaz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.concessive-as-though-fronting.03
  target_content_id: grammar.c1.concessive-as-though-fronting
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Use bare verb fronting to express persistent effort despite limits:'
  prompt_tr_hint: Çaba bildiren fiili öne çekerek zarif bir ödünleşim kurunuz.
  stem: ___ to condense the onboarding guide, legal disclosures still require two
    screens.
  options:
  - As try we may
  - Try although we could
  - Try as we might
  - Trying although we might
  correct_answer: Try as we might
  explanation_en: '''Try as we may / might'' pairs a bare fronted infinitive with
    ''as/though + subject + modal''.'
  explanation_tr: '''Ne kadar uğraşsak da...'' anlamında ''Try as we may / might''
    kalıbı fiili başa alır.'
  distractor_explanations:
    Trying although we might: Öne alınan fiil yalın (bare infinitive) kalır ve 'although'
      seçilmez.
    Try although we could: Bu devrik yapıda bağlaç daima 'as' veya 'though'dur, 'although'
      değil.
    As try we may: 'Kelime sırası terstir: yalın fiil bağlaçtan önce gelir.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.diplomatic-past-distancing.01
  target_content_id: grammar.c1.diplomatic-past-distancing
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the most diplomatically softened present request to a senior
    director:'
  prompt_tr_hint: Üst düzey yöneticiye şu an yöneltilen en kibar ve diplomatik soruyu
    seçiniz.
  stem: 'Choose the phrasing that leaves respectful space without sounding abrupt:'
  options:
  - Push vendor sign-off to Monday so QA finishes testing today.
  - We were hoped by QA to push vendor sign-off back then.
  - I hope we can will push vendor sign-off to Monday right now.
  - I was hoping we might push vendor sign-off to Monday so QA finishes testing.
  correct_answer: I was hoping we might push vendor sign-off to Monday so QA finishes
    testing.
  explanation_en: Attitudinal past progressive ('I was hoping we might...') reduces
    imposition in present workplace requests.
  explanation_tr: Müzakere ve ricada 'I was hoping / wondered whether we might' kalıbı
    yumuşak nezaket sağlar.
  distractor_explanations:
    Push vendor sign-off to Monday so QA finishes testing today.: Çıplak emir kipi
      üst düzey muhataba fazla buyurgan ve sert gelir.
    I hope we can will push vendor sign-off to Monday right now.: '''can will'' iki
      kip fiili yan yana gelemez.'
    We were hoped by QA to push vendor sign-off back then.: Yapay edilgen kullanım
      ve gerçek geçmişe kayma anlamı bozar.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.diplomatic-past-distancing.02
  target_content_id: grammar.c1.diplomatic-past-distancing
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Decode a native executive''s attitudinal past accurately:'
  prompt_tr_hint: Diplomatik geçmiş zamanla sorulan bir cümlenin gerçek zaman niyetini
    doğru belirleyiniz.
  stem: If a partner says right now at the table, 'Did you want to review clause four
    next?', what is the real timeframe?
  options:
  - A conditional hypothetical meaning clause four is invalid
  - Asking whether you read clause four during last week's call
  - A polite present offer asking your immediate preference right now
  - Criticism implying you forgot to review clause four yesterday
  correct_answer: A polite present offer asking your immediate preference right now
  explanation_en: '''Did you want...'' in live conversation uses past distance solely
    for courtesy—just like ''Were you looking for...''.'
  explanation_tr: '''Did you want to...'' sohbet anında geçmişi sormaz; şimdi ne istediğinizi
    kibar mesafeyle sorar.'
  distractor_explanations:
    Asking whether you read clause four during last week's call: Burada 'want + to
      review + next' gelecek adımı nazikçe yoklar, geçmişi sormaz.
    Criticism implying you forgot to review clause four yesterday: Eleştiri değil,
      söz hakkı veren diplomatik davet taşır.
    A conditional hypothetical meaning clause four is invalid: Madde geçersizliği
      değil toplantı akış sırası önermektedir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.diplomatic-past-distancing.03
  target_content_id: grammar.c1.diplomatic-past-distancing
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Reformulate a blunt present demand into executive diplomatic inquiry:'
  prompt_tr_hint: Keskin talebi şimdiki bağlamda nazik kurumsal üsluba uyarlayınız.
  stem: 'Replace blunt ''Can you extend our payment window?'' with executive tact:'
  options:
  - I wondered did finance granted a fifteen-day extension last year.
  - I wondered whether finance might grant a fifteen-day extension on billing.
  - Had you wanted me demanding a fifteen-day payment window?
  - Finance is extending our payment window right now, isn't it?
  correct_answer: I wondered whether finance might grant a fifteen-day extension on
    billing.
  explanation_en: Combining 'wondered + whether + modal (might/could)' frames high-stakes
    asks constructively.
  explanation_tr: '''Wondered whether + might/could'' birleşimi finans ve hukuk taleplerini
    profesyonel biçimde yumuşatır.'
  distractor_explanations:
    I wondered did finance granted a fifteen-day extension last year.: Hem gömülü
      soru devirmesi hem geçmiş zaman ('last year') yanlıştır.
    Had you wanted me demanding a fifteen-day payment window?: Dilbilgisel olarak
      bozuk ve saldırgan tondadır.
    Finance is extending our payment window right now, isn't it?: Tek taraflı dayatma
      izlenimi verir, nezaketli rica değildir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.counterfactual-but-for-otherwise.01
  target_content_id: grammar.c1.counterfactual-but-for-otherwise
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Compress a Type 3 negative ''if''-clause cleanly using a prepositional
    phrase:'
  prompt_tr_hint: Uzun bir 3. tip koşul cümlesini özlü biçimde sıkıştıran doğru bağlacı
    seçiniz.
  stem: ___ deterministic schema validation, duplicate items would have slipped into
    SQLite.
  options:
  - Unless
  - Except from
  - In case of
  - But for
  correct_answer: But for
  explanation_en: '''But for + Noun Phrase'' means ''If it had not been for...'',
    triggering a ''would have V3'' main clause.'
  explanation_tr: '''But for + İsim Öbeği'' kalıbı ''...olmasaydı'' anlamını en kısa
    biçimde karşılar.'
  distractor_explanations:
    Unless: '''Unless'' ardından tam fiilli yan cümle ister, çıplak isim öbeği (''deterministic
      schema validation'') almaz.'
    Except from: İstisna bildirir, karşı-olgusal '...olmasaydı' koşulu kurmaz.
    In case of: Gelecek ihtimal tedbiri anlatır; geçmişte gerçekleşmiş kurtuluşu değil.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.counterfactual-but-for-otherwise.02
  target_content_id: grammar.c1.counterfactual-but-for-otherwise
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the accurate counterfactual verb form following ''otherwise'':'
  prompt_tr_hint: '''Otherwise'' sonrasında geçmiş gerçekliğe aykırı sonucu anlatan
    kipi seçiniz.'
  stem: Counsel caught the hidden evergreen clause; otherwise, we ___ locked into
    three-year terms.
  options:
  - will have been
  - were being
  - would have been
  - must be
  correct_answer: would have been
  explanation_en: When the opening clause establishes a finished past event, 'otherwise'
    takes modal perfect ('would have + V3').
  explanation_tr: İlk cümlede yaşanıp atlatılmış geçmiş olay varsa 'otherwise' ardına
    'would have V3' gelir.
  distractor_explanations:
    will have been: Geçmişte engellenmiş durum için gelecek kipi 'will' kullanılamaz.
    were being: Sürekli geçmiş kipi karşı-olgusal sonucu karşılamaz.
    must be: Şimdiki zorunluluk/çıkarım bildirir, varsayımsal geçmiş sonucu değil.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.counterfactual-but-for-otherwise.03
  target_content_id: grammar.c1.counterfactual-but-for-otherwise
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the clean present counterfactual expression using ''Without +
    Gerund'':'
  prompt_tr_hint: Şu an devam eden bir korumanın yokluğunda doğacak sonucu anlatan
    seçeneği bulunuz.
  stem: Which summary expresses an ongoing architectural dependency cleanly?
  options:
  - Without we don't package locally, commuters lose access.
  - Without local prepackaging, commuters would lose access inside airport transfers.
  - But for we prepackaged locally, commuters would lose access.
  - Without local prepackaging, commuters lost access in every transfer.
  correct_answer: Without local prepackaging, commuters would lose access inside airport
    transfers.
  explanation_en: '''Without + Noun/Gerund'' pairs seamlessly with ''would + V1''
    for ongoing Type 2 hypothetical dependencies.'
  explanation_tr: '''Without + İsim / -ing'' mevcut bir önlem olmasaydı şu an ne olacağını
    ''would + V1'' ile net kurar.'
  distractor_explanations:
    Without local prepackaging, commuters lost access in every transfer.: Varsayımsal
      sonucu 'would lose' yerine gerçekleşmiş geçmiş 'lost' ile bozmuştur.
    But for we prepackaged locally, commuters would lose access.: '''But for'' özne+yüklem
      cümlesi almaz, yalnızca isim öbeği ister.'
    Without we don't package locally, commuters lose access.: '''Without'' arkasına
      tam cümle ve olumsuz ''don''t'' almaz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.reporting-attitude-modal-backshift.01
  target_content_id: grammar.c1.reporting-attitude-modal-backshift
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Preserve epistemic deduction vs. binding obligation inside reported
    speech:'
  prompt_tr_hint: Dolaylı aktarımda çıkarım ('must have') ile zorunluluk ('had to')
    kipini doğru ayırt ediniz.
  stem: The incident commander noted that the midnight latency spike ___ caused by
    DNS throttling.
  options:
  - ought to had been
  - must have been
  - had to be
  - had to have been
  correct_answer: must have been
  explanation_en: Logical deduction ('must be / must have been') stays unchanged even
    after past reporting verbs like 'noted'.
  explanation_tr: Mantıksal çıkarım bildiren 'must' dolaylı geçmiş aktarımında 'had
    to'ya çevrilmez, olduğu gibi korunur.
  distractor_explanations:
    had to have been: İngilizcede geçmiş çıkarım için '*had to have been' kullanılmaz
      ('must have been' değişmez).
    had to be: '''had to be'' zorunluluk anlamı taşır; kök neden tahmini/çıkarımı
      kurmaz.'
    ought to had been: Kip fiillerinden sonra yalın 'have' gerekir ('had' hatalıdır).
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.reporting-attitude-modal-backshift.02
  target_content_id: grammar.c1.reporting-attitude-modal-backshift
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Identify the sentence handling backshifted obligation cleanly:'
  prompt_tr_hint: Yasal zorunluluğun dolaylı geçmiş aktarımını doğru kuran cümleyi
    seçiniz.
  stem: 'Select the accurate summary of yesterday''s compliance mandate (''You must
    log timestamps''):'
  options:
  - Auditors reminded teams that every script must has recorded timestamps.
  - Auditors reminded teams that every build script had to record immutable timestamps.
  - Auditors said that teams may have to be record timestamps yesterday.
  - Auditors emphasized that teams can had recorded timestamps.
  correct_answer: Auditors reminded teams that every build script had to record immutable
    timestamps.
  explanation_en: Time-bound external obligations ('You must log') shift naturally
    to 'had to + V1' in indirect reports.
  explanation_tr: Zamanla bağlı dış zorunluluk bildiren 'must', geçmiş aktarımda 'had
    to'ya dönüştürülür.
  distractor_explanations:
    Auditors reminded teams that every script must has recorded timestamps.: Kip fiili
      'must' sonrası 'has' gelemez.
    Auditors said that teams may have to be record timestamps yesterday.: '''to be
      record'' çatı hatası ve ''yesterday'' ile uyumsuzluk içerir.'
    Auditors emphasized that teams can had recorded timestamps.: '''can'' + ''had''
      kip kurallarına aykırıdır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.reporting-attitude-modal-backshift.03
  target_content_id: grammar.c1.reporting-attitude-modal-backshift
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Backshift reported permission accurately:'
  prompt_tr_hint: Geçmişte verilen izin veya esnekliği aktaran doğru kip formunu seçiniz.
  stem: Legal confirmed yesterday that pilot accounts ___ defer audit encryption until
    Q2.
  options:
  - musted
  - can have defer
  - may will
  - might
  correct_answer: might
  explanation_en: Direct permission 'may' backshifts smoothly to 'might' (or 'could
    / were allowed to') after past 'confirmed'.
  explanation_tr: Doğrudan 'may' izni geçmiş aktarımda 'might' ya da 'could / were
    allowed to' biçimine çekilir.
  distractor_explanations:
    may will: İki modal yardımcı fiil yan yana gelemez.
    musted: '''must'' fiilinin ''-ed'' geçmiş çekimi yoktur.'
    can have defer: '''have'' sonrası V3 eksik ve geçmiş izin aktarımıyla uyumsuz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.infinitive-passive-perfect-nuance.01
  target_content_id: grammar.c1.infinitive-passive-perfect-nuance
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Mark an event that happened prior to present reporting inside an infinitive:'
  prompt_tr_hint: Şu anki gözlemden daha önce gerçekleşmiş olayı mastar içinde doğru
    kodlayınız.
  stem: Telemetry appears ___ overnight while backup snapshots rotated cleanly.
  options:
  - to be stalling last night
  - to stall
  - stalling
  - to have stalled
  correct_answer: to have stalled
  explanation_en: Use perfect infinitive ('to have + V3') after 'appear/seem/likely'
    when referencing a completed prior event.
  explanation_tr: Ana fiil geniş zamanda olup olay geçmişte kaldıysa 'to have + V3'
    kullanılır.
  distractor_explanations:
    to stall: Yalın mastar şu an veya genel alışkanlığı belirtir; 'overnight' geçmiş
      zamanıyla çelişir.
    to be stalling last night: Geçmiş zaman zarfıyla süren mastar değil bitmiş mastar
      ('to have V3') uyuşur.
    stalling: '''appear'' özne yükseltmesinde V-ing değil ''to''-infinitive alır.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.infinitive-passive-perfect-nuance.02
  target_content_id: grammar.c1.infinitive-passive-perfect-nuance
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Combine anterior time AND passive voice inside an infinitive clause:'
  prompt_tr_hint: Hem geçmiş zamana hem edilgen çatıya işaret eden mastar yapısını
    seçiniz.
  stem: Which diagnostic readout correctly states an earlier passive error?
  options:
  - Two malformed timestamps appear to dropped during import yesterday.
  - Two malformed timestamps seem to have been dropped during import yesterday.
  - Two malformed timestamps seem to be dropped during import yesterday.
  - Two malformed timestamps are thought to have dropping during import.
  correct_answer: Two malformed timestamps seem to have been dropped during import
    yesterday.
  explanation_en: Perfect passive infinitive ('to have been + V3') handles both 'earlier
    than now' and 'acted upon'.
  explanation_tr: Geçmişte yaşanmış edilgen eylem 'to have been + V3' kalıbıyla ifade
    edilir.
  distractor_explanations:
    Two malformed timestamps seem to be dropped during import yesterday.: '''yesterday''
      ile geçmiş edilgen için ''to have been dropped'' gereklidir.'
    Two malformed timestamps appear to dropped during import yesterday.: '''to'' ardından
      çekimli past tense (''dropped'') gelemez.'
    Two malformed timestamps are thought to have dropping during import.: '''to have''
      + ''-ing'' biçimi geçersizdir (''been V3'' gerekir).'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.infinitive-passive-perfect-nuance.03
  target_content_id: grammar.c1.infinitive-passive-perfect-nuance
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select accurate passive infinitive for an upcoming planned audit:'
  prompt_tr_hint: Yaklaşan planlı denetimi ifade eden edilgen mastar yapısını seçiniz.
  stem: All newly authored grammar batches are scheduled ___ tomorrow before packing.
  options:
  - to be audited
  - to auditing
  - to have audited tomorrow
  - being audited
  correct_answer: to be audited
  explanation_en: 'Upcoming passive targets take simple passive infinitive: ''is scheduled
    to be audited''.'
  explanation_tr: Gelecekteki edilgen planlama 'to be + V3' ('to be audited') ile
    kurulur.
  distractor_explanations:
    to auditing: '''scheduled'' fiili ardından ''to + V1'' veya ''to be + V3'' alır.'
    to have audited tomorrow: Perfect infinitive ('to have V3') geçmiş tamamlanmışlık
      bildirir, 'tomorrow' ile çelişir.
    being audited: '''scheduled'' ile mastar yapısı (''to be V3'') standarttır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.get-passives-and-adversative-haves.01
  target_content_id: grammar.c1.get-passives-and-adversative-haves
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Interpret experiential/adversative ''have + object + V3'' accurately
    in context:'
  prompt_tr_hint: Olumsuz bir durumun kişinin/kurumun başına gelmesini anlatan 'had
    + Nesne + V3' anlamını ayırt ediniz.
  stem: What does 'Several contractors had their staging tokens revoked overnight'
    mean?
  options:
  - External security revoked their tokens unexpectedly or as an imposed penalty
  - Contractors successfully delegated token creation to staging admins
  - Contractors intentionally asked security to revoke their own active tokens
  - Contractors actively deleted production tokens themselves overnight
  correct_answer: External security revoked their tokens unexpectedly or as an imposed
    penalty
  explanation_en: Unwelcome verbs in 'have + Object + V3' denote an adversative experience
    happening TO the subject.
  explanation_tr: '''Revoked / stolen / blocked'' gibi olumsuz V3 gelirse ''had X
    V3'' hizmet yaptırma değil mağduriyete uğrama bildirir.'
  distractor_explanations:
    Contractors intentionally asked security to revoke their own active tokens: Fiil
      istenmeyen yaptırım ('revoked') olduğu için bu deneyim/mağduriyet anlamı taşır.
    Contractors successfully delegated token creation to staging admins: Anlam tamamen
      terstir (token silinmesi söz konusudur).
    Contractors actively deleted production tokens themselves overnight: '''had X
      revoked'' işi kendilerinin değil dış mekanizmanın yaptığını anlatır.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.get-passives-and-adversative-haves.02
  target_content_id: grammar.c1.get-passives-and-adversative-haves
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Rewrite a clunky passive outage event using natural experiential ''had'':'
  prompt_tr_hint: İstenmeyen gümrük bekletme olayını akıcı deneyim yapısıyla ifade
    eden cümleyi seçiniz.
  stem: Which travel update uses adversative 'have' idiomatically?
  options:
  - Our exhibitor team had held by Frankfurt customs two equipment crates.
  - Our exhibitor team had two equipment crates held at Frankfurt customs.
  - Our exhibitor team was got held two crates at Frankfurt customs.
  - Two equipment crates had customs holding them themselves.
  correct_answer: Our exhibitor team had two equipment crates held at Frankfurt customs.
  explanation_en: 'Place the human/team sufferer as subject, then ''had + affected
    item + V3'': ''had two crates held''.'
  explanation_tr: Etkilenen kişi/ekip özne olur; ardından 'had + zarar gören nesne
    + V3' gelir.
  distractor_explanations:
    Our exhibitor team was got held two crates at Frankfurt customs.: '''was got held''
      çift yardımcı fiil hatasıdır.'
    Our exhibitor team had held by Frankfurt customs two equipment crates.: Nesne
      'have' ile V3 ('held') arasına yerleşmelidir.
    Two equipment crates had customs holding them themselves.: Cansız sandıkların
      deneyimi gibi garip özneler kurulamaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.get-passives-and-adversative-haves.03
  target_content_id: grammar.c1.get-passives-and-adversative-haves
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Contrast ongoing state vs. dynamic ''get''-passive occurrence:'
  prompt_tr_hint: Sabit kalan durum ile süreçte gerçekleşen edilgen olayı doğru fiille
    ayırınız.
  stem: Thanks to pre-commit checks, unformatted YAML edits ___ immediately before
    push.
  options:
  - get rejected
  - have been reject
  - got to reject
  - remain rejecting
  correct_answer: get rejected
  explanation_en: '''Get + V3'' highlights dynamic event occurrence cleanly in operational
    descriptions.'
  explanation_tr: '''Get + V3'' mekanizmanın eylemi anlık yakalayıp gerçekleştirdiğini
    dinamik biçimde vurgular.'
  distractor_explanations:
    remain rejecting: Düzenlemeler kendisi reddedemez; edilgen V3 gerektirir.
    got to reject: Fırsat bulmak ('get to do') anlamını taşır, edilgen değildir.
    have been reject: '''been'' ardından V3 (''rejected'') eksiktir.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.comparative-clause-ellipsis-inversion.01
  target_content_id: grammar.c1.comparative-clause-ellipsis-inversion
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Preserve auxiliary tense consistency after ''than'' without repeating
    full verbs:'
  prompt_tr_hint: Karşılaştırma cümleciğinin sonunda ana fiille uyumlu yardımcı fiili
    seçiniz.
  stem: Offline vocabulary queries resolved three times faster in v5 than legacy indices
    ___ in v4.
  options:
  - was
  - were
  - had
  - did
  correct_answer: did
  explanation_en: Because the main predicate is Past Simple action verb 'resolved',
    ellipsis requires matching 'did'.
  explanation_tr: Ana yüklem geçmiş eylem fiili ('resolved') olduğu için sonda eksiltme
    yardımcı fiili 'did' olmalıdır.
  distractor_explanations:
    were: Ana yüklem 'be' değil eylem fiili ('resolved') olduğu için 'were' ile karşılanamaz.
    had: Ana fiil Past Perfect ('had resolved') değildir.
    was: Hem fiil ailesi ('resolved' != 'be') hem çoğul 'indices' uyuşmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.comparative-clause-ellipsis-inversion.02
  target_content_id: grammar.c1.comparative-clause-ellipsis-inversion
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose balanced formal comparative inversion before a long nominal subject:'
  prompt_tr_hint: Uzun bir isim öbeğini karşılaştırırken resmi raporlarda kullanılan
    dengeli devrik sırayı bulunuz.
  stem: Which benchmark summary handles formal comparative ellipsis accurately?
  options:
  - Earlier manual reconciliation saved fewer hours as did deterministic builds.
  - Deterministic builds save far more QA hours than earlier manual reconciliation
    did saved.
  - Deterministic builds save far more QA hours than did earlier manual reconciliation.
  - Deterministic builds save far more QA hours than was earlier manual reconciliation.
  correct_answer: Deterministic builds save far more QA hours than did earlier manual
    reconciliation.
  explanation_en: Formal reports invert 'than did + [longer noun phrase]' cleanly
    while matching 'do/does/did' to action verbs.
  explanation_tr: Uzun öznelerde 'than did [uzun öbek]' devrikliği hem zarif ritim
    hem doğru yardımcı fiil uyumu sağlar.
  distractor_explanations:
    Deterministic builds save far more QA hours than was earlier manual reconciliation.: '''save''
      eylem fiili için ''was'' kullanılamaz (''did'' gerekir).'
    Deterministic builds save far more QA hours than earlier manual reconciliation did saved.: Vurgulu
      'did' sonrası ana fiil ('saved') tekrarlanmaz.
    Earlier manual reconciliation saved fewer hours as did deterministic builds.: '''fewer''
      kıyaslaması ''as'' ile değil ''than'' ile bağlanır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.comparative-clause-ellipsis-inversion.03
  target_content_id: grammar.c1.comparative-clause-ellipsis-inversion
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Avoid mismatched auxiliary pairs after ''as'':'
  prompt_tr_hint: '''As'' bağlacından sonra ana fiilin kipiyle örtüşen doğru kısaltmayı
    seçiniz.'
  stem: Audio assets are packaged locally on tablet, ___ reading passages.
  options:
  - as do
  - as are
  - which do
  - than are
  correct_answer: as are
  explanation_en: Match 'are packaged' with passive parallel inversion 'as are + plural
    subject'.
  explanation_tr: Edilgen 'are' yüklemine paralel onay vermek için 'as are [özne]'
    kalıbı seçilir.
  distractor_explanations:
    as do: Ana yüklem 'are packaged' (be + V3) olduğu için 'are' tekrarlanmalıdır,
      'do' değil.
    than are: Eşitlik/paralellik için 'than' değil 'as' bağlacı gerekir.
    which do: Hem 'which' bağımsız paralel olgu bağlamaz hem 'do' yüklemle uyuşmaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.genitive-with-gerunds-formal.01
  target_content_id: grammar.c1.genitive-with-gerunds-formal
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Use formal possessive modification before a gerund phrase functioning
    as object:'
  prompt_tr_hint: Resmi yazıda bir eylem (-ing) nesne olduğunda başına gereken doğru
    belirteci seçiniz.
  stem: We truly appreciate ___ all Turkish L1 traps ahead of Friday's merge deadline.
  options:
  - you to document
  - your documenting
  - yours documenting
  - for you documenting
  correct_answer: your documenting
  explanation_en: 'Formal register modifies gerund events using possessive determiners:
    ''appreciate your documenting...''.'
  explanation_tr: '''Sizin belgelemenizi takdir ediyoruz'' anlamında ''appreciate''
    sonrası ''your + V-ing'' kurulur.'
  distractor_explanations:
    you to document: '''appreciate'' ardından ''kişi + to V1'' almaz; gerund veya
      noun ister.'
    yours documenting: '''yours'' bağımsız iyelik zamiridir; ismin/ulacın önünde sıfat
      (''your'') gerekir.'
    for you documenting: '''appreciate'' doğrudan nesne alır, ''for'' eklenmez.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.genitive-with-gerunds-formal.02
  target_content_id: grammar.c1.genitive-with-gerunds-formal
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Fix an overly casual gerund subject opening in a governance report:'
  prompt_tr_hint: Resmi yönetişim metninin başında yer alan ulaçlı özne hatasını düzeltiniz.
  stem: 'Select the formal sentence focusing strictly on the delayed approval act:'
  options:
  - Us ignoring backups has led audit penalties last autumn.
  - Legal's flagging that liability clause saved us months of renegotiation.
  - Legal flagging to that liability clause saved us months of renegotiation.
  - Them flagging that liability clause saved months of renegotiation yesterday.
  correct_answer: Legal's flagging that liability clause saved us months of renegotiation.
  explanation_en: Opening a formal clause with an action noun prefers possessive 'Legal's
    flagging...' / 'Their ignoring...'.
  explanation_tr: Cümle başındaki ulaç öznesinde 'Us/Them' yerine mutlaka 'Our/Their/Legal's
    + V-ing' tercih edin.
  distractor_explanations:
    Them flagging that liability clause saved months of renegotiation yesterday.: Cümle
      başında nesne zamiri ('Them') yerine iyelik ('Their') resmi standarttır.
    Legal flagging to that liability clause saved us months of renegotiation.: '''flag''
      doğrudan nesne alır (''to'' almaz) ve resmi metinde iyelik (''Legal''s'') tercih
      edilir.'
    Us ignoring backups has led audit penalties last autumn.: Hem başında 'Us' yanlıştır
      hem de 'last autumn' ile 'has led' uyumsuzdur.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.genitive-with-gerunds-formal.03
  target_content_id: grammar.c1.genitive-with-gerunds-formal
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot when perception verbs do NOT want possessive modification:'
  prompt_tr_hint: Algı fiillerinde ('notice / hear / watch') neden iyelik değil nesne
    hali seçildiğini ayırınız.
  stem: During usability testing, observers noticed ___ over subtle register labels.
  options:
  - participants pausing
  - them paused
  - participant's paused
  - participants's to pause
  correct_answer: participants pausing
  explanation_en: With sensory verbs ('notice', 'observe'), use object + V-ing ('participants
    pausing') for an action caught live.
  explanation_tr: Duyu/gözlem fiillerinde ('notice') eylemin bizzat yaşandığını görmek
    için nesne + V-ing kullanılır.
  distractor_explanations:
    participants's to pause: '''notice'' sonrasında yanlış iyelik eklemesi ve uyumsuz
      mastar içerir.'
    participant's paused: Tekil belirsiz ve geçmiş zaman ortacı algı anını veremez.
    them paused: Katılımcılar duraksatılmadı, bizzat durakladılar (etken -ing).
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.discourse-reformulation-clarifiers.01
  target_content_id: grammar.c1.discourse-reformulation-clarifiers
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the precise marker that narrows and corrects a slightly loose
    statement:'
  prompt_tr_hint: Az önce söylenen ifadeyi daha isabetli düzeltmek için en uygun reformülasyon
    bağlacını seçiniz.
  stem: Quarterly renewals held flat—___, mid-market renewals rose while SMB seats
    shifted.
  options:
  - provided that
  - for fear that
  - as opposed
  - or rather
  correct_answer: or rather
  explanation_en: '''Or rather'' gracefully repairs or sharpens an immediately preceding
    formulation.'
  explanation_tr: İlk cümleyi 'daha doğrusu şöyle...' diyerek incelikle düzeltirken
    'or rather' seçilir.
  distractor_explanations:
    as opposed: '''as opposed to'' karşılaştırma öbeğidir, kendi başına cümle bağlamaz.'
    provided that: Ön koşul şerhi düşer, düzeltme yapmaz.
    for fear that: Kaçınılan endişe nedenini bildirir.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.discourse-reformulation-clarifiers.02
  target_content_id: grammar.c1.discourse-reformulation-clarifiers
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the clearest reformulation marker unpacking an abstract technical
    claim:'
  prompt_tr_hint: Soyut bir teknik kavramın somut pratik karşılığını açıklayan ifadeyi
    seçiniz.
  stem: Which executive update reformulates jargon transparently without sounding
    uncertain?
  options:
  - Schema builds stay deterministic, I mean, maybe identical files match usually.
  - Deterministic builds run cleanly, despite that, identical inputs produce hashes.
  - Schema builds stay deterministic—that is to say, identical YAML inputs guarantee
    identical SQLite bytes.
  - Schema builds stay deterministic—in addition, SQLite uses deterministic inputs
    instead.
  correct_answer: Schema builds stay deterministic—that is to say, identical YAML
    inputs guarantee identical SQLite bytes.
  explanation_en: '''That is to say'' translates concise terminology smoothly into
    unambiguous operational mechanics.'
  explanation_tr: Teknik bir kavramı 'yani pratikte şudur' diye netleştirmek için
    'that is to say' kullanılır.
  distractor_explanations:
    Schema builds stay deterministic, I mean, maybe identical files match usually.: '''I
      mean, maybe'' üst düzey raporda kararsız ve fazla gündelik durur.'
    Schema builds stay deterministic—in addition, SQLite uses deterministic inputs instead.: '''in
      addition'' tanımlama açmaz, yeni bilgi ekler.'
    Deterministic builds run cleanly, despite that, identical inputs produce hashes.: '''despite
      that'' zıtlık bildirir; açıklamayla çelişir.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.discourse-reformulation-clarifiers.03
  target_content_id: grammar.c1.discourse-reformulation-clarifiers
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Contrast two ways of framing the same insight clearly:'
  prompt_tr_hint: Aynı düşüncenin başka bir açıdan özetini sunan ifadeyi seçiniz.
  stem: Daily micro-reviews prevent weekend cramming; ___, consistency beats session
    length.
  options:
  - on the contrary
  - notwithstanding
  - to the detriment of
  - put another way
  correct_answer: put another way
  explanation_en: '''Put another way'' (or ''in other words'') distills an earlier
    point into a memorable punchline.'
  explanation_tr: Önceki tezi 'başka bir deyişle' özetleyip akılda kalıcı ilkeye dönüştürmek
    için 'put another way' uygundur.
  distractor_explanations:
    on the contrary: İlk fikri çürütüp aksini iddia eder; burada ise aynı fikir pekiştiriliyor.
    notwithstanding: '''rağmen'' anlamında zıtlık/istisna bağlar.'
    to the detriment of: '''...nın zararına olarak'' anlamı taşır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.quantifier-agreement-distributive-nouns.01
  target_content_id: grammar.c1.quantifier-agreement-distributive-nouns
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Match verb number cleanly to ''the number of'' vs. ''a number of'':'
  prompt_tr_hint: '''The number of'' (sayısal toplam) ile ''a number of'' (birçok)
    arasındaki fiil uyumunu seçiniz.'
  stem: Since automated gates launched, ___ duplicate content IDs has dropped to zero.
  options:
  - several of the
  - a number of
  - the number of
  - a majority of the
  correct_answer: the number of
  explanation_en: '''The number of + plural noun'' points to one scalar metric, taking
    singular ''has dropped''.'
  explanation_tr: '''The number of'' tekil bir sayı değerini belirttiği için ardından
    ''has dropped'' alır.'
  distractor_explanations:
    a number of: '''a number of + çoğul isim'' anlamca çoğuldur ve ''have dropped''
      gerektirir.'
    several of the: Çoğul yüklem ('have') ister.
    a majority of the: '''duplicate content IDs'' çoğul olduğu için ''have dropped''
      gerektirir.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.quantifier-agreement-distributive-nouns.02
  target_content_id: grammar.c1.quantifier-agreement-distributive-nouns
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Apply distributive agreement rules to ''each of'' and ''neither ...
    nor'':'
  prompt_tr_hint: '''Each of'' ve ''neither... nor'' öznelerinde doğru fiil çekimini
    seçiniz.'
  stem: Which compliance report sentence avoids subject-verb agreement mistakes?
  options:
  - Neither the director nor her legal deputies has approved unlimited terms.
  - Every single one of the 150 grammar lessons has passed schema checks.
  - Each of the five regional branches were consulted prior to billing cutoff.
  - Every single one of the 150 grammar lessons have passed schema checks.
  correct_answer: Every single one of the 150 grammar lessons has passed schema checks.
  explanation_en: '''Each of'' and ''Every one of'' enforce singular verbs, while
    ''neither X nor Y'' agrees with closer Y.'
  explanation_tr: '''Each / every one of'' daima tekil fiil alır; ''neither... nor''
    da fiil en yakın özneye göre çekilir.'
  distractor_explanations:
    Every single one of the 150 grammar lessons have passed schema checks.: '''Every
      single one'' daima tekildir (''has passed'' ister).'
    Each of the five regional branches were consulted prior to billing cutoff.: '''Each
      of...'' öznesi tekil ''was consulted'' alır.'
    Neither the director nor her legal deputies has approved unlimited terms.: '''neither...
      nor'' yapısında fiil kendisine yakın olan çoğul ''deputies'' ile (''have'')
      uyuşmalıdır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.quantifier-agreement-distributive-nouns.03
  target_content_id: grammar.c1.quantifier-agreement-distributive-nouns
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Apply fractional/percentage noun agreement properly:'
  prompt_tr_hint: Yüzde ve çoğunluk ifadelerinde 'of' sonrası isme göre fiil sayısını
    seçiniz.
  stem: Roughly seventy percent of our offline training corpus ___ focused on workplace
    idioms.
  options:
  - were being
  - is
  - have
  - are
  correct_answer: is
  explanation_en: Fractions and percentages ('percent of + noun') inherit singular
    vs. plural agreement directly from the object of 'of'.
  explanation_tr: Yüzdelik öznelerde fiilin tekil/çoğul oluşunu 'of'tan sonraki ismin
    ('corpus') sayısı belirler.
  distractor_explanations:
    are: '''corpus'' tekil bir bütün olarak kullanıldığı için ''is'' gerektirir.'
    were being: Süreklilik geçmişi hem zaman hem sayı uyumsuzudur.
    have: Tek başına 'focused' sıfatıyla veya tekil özneyle uyuşmaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.negative-infinitive-split-position.01
  target_content_id: grammar.c1.negative-infinitive-split-position
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Convey an explicit decision to refrain without ambiguous clause negation:'
  prompt_tr_hint: '''Yapmama kararı almak'' ile ''karar almamak'' farkını doğru ''not''
    konumuyla kurunuz.'
  stem: After weighing privacy rules, product leads decided ___ unencrypted voice
    logs.
  options:
  - to not retain
  - don't retain
  - not to retain
  - not retaining to
  correct_answer: not to retain
  explanation_en: Place 'not' immediately before 'to' ('decided not to retain') to
    state a conscious choice to abstain.
  explanation_tr: 'Resmi karar cümlelerinde olumsuzluk mastardan hemen önce gelir:
    ''decided not to V1''.'
  distractor_explanations:
    to not retain: C1 resmi stilde mastar olumsuzluğu 'not to retain' biçimindedir
      (bölünmüş mastardan kaçınılır).
    don't retain: '''decided'' ardından çekimli yardımcı fiil almaz.'
    not retaining to: '''decide'' bu bağlamda mastar ister ve ''to'' sonda kalamaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.negative-infinitive-split-position.02
  target_content_id: grammar.c1.negative-infinitive-split-position
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distinguish prohibition (''mustn''t'') from absence of obligation (''needn''t
    / don''t have to''):'
  prompt_tr_hint: Yasak ile zorunlu olmamayı karıştıran Türkçe aktarım hatasını düzeltiniz.
  stem: 'You want to reassure contractors that re-uploading unchanged audio files
    is optional (not banned). Write:'
  options:
  - Contractors didn't decide not to keep optional audio files.
  - Contractors mustn't re-upload unchanged audio tracks because it is optional.
  - Contractors needn't re-upload unchanged audio tracks unless hashes differ.
  - Contractors must not to upload duplicate hashes unless needed.
  correct_answer: Contractors needn't re-upload unchanged audio tracks unless hashes
    differ.
  explanation_en: '''Needn''t'' (or ''don''t have to'') frees someone from unnecessary
    work; ''must not'' forbids an action outright.'
  explanation_tr: '''Gerek yok / zorunlu değil'' demek için ''needn''t / don''t have
    to'' kullanılır; ''mustn''t'' yasaklar.'
  distractor_explanations:
    Contractors mustn't re-upload unchanged audio tracks because it is optional.: '''mustn''t''
      isteğe bağlılık değil kesin yasak belirtir; ''optional'' ile çelişir.'
    Contractors didn't decide not to keep optional audio files.: Çift olumsuzluk anlamı
      çarpıtır.
    Contractors must not to upload duplicate hashes unless needed.: '''must not''
      ardından ''to'' gelmez.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.negative-infinitive-split-position.03
  target_content_id: grammar.c1.negative-infinitive-split-position
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Place ''not'' accurately before a negative participle opener:'
  prompt_tr_hint: Olumsuz ortaç öbeğiyle sebep bildiren doğru açılışı seçiniz.
  stem: ___ which discount tier applied, the new analyst escalated to billing leads.
  options:
  - Without know
  - Not knowing
  - Didn't knowing
  - Knowing not
  correct_answer: Not knowing
  explanation_en: Negate participial clauses cleanly by placing 'Not' directly at
    the very start ('Not knowing...').
  explanation_tr: 'Ortaçlı sebep cümlelerini olumsuz yaparken ''Not'' kelimesini en
    başa alın: ''Not knowing...''.'
  distractor_explanations:
    Knowing not: Ortaçlarda 'not' mutlaka '-ing' biçiminin önüne konur.
    Didn't knowing: '''did'' yardımcı fiili ortaç ile birleşemez.'
    Without know: '''Without'' edatı sonrasında yalın fiil değil V-ing (''knowing'')
      ister.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.restrictive-which-what-whatever.01
  target_content_id: grammar.c1.restrictive-which-what-whatever
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Apply word-order rules cleanly when ''however'' means ''no matter how'':'
  prompt_tr_hint: '''Ne kadar ... olursa olsun'' anlamında ''however'' sonrasında
    doğru dizimi seçiniz.'
  stem: ___ minor a UI alignment slip may look, validate tablet accessibility before
    release.
  options:
  - Though
  - However
  - Whichever
  - Whatever
  correct_answer: However
  explanation_en: '''However + adjective/adverb + subject + verb'' pulls the degree
    adjective directly forward.'
  explanation_tr: Sıfat derecesiyle 'ne kadar olursa olsun' anlamı için daima 'However
    + Sıfat' kullanılır.
  distractor_explanations:
    Whatever: '''Whatever'' doğrudan sıfatı (''minor'') niteleyemez (''However + Adj''
      gerekir).'
    Whichever: '''Whichever'' kısıtlı seçenek içindeki isimleri seçer, sıfat derecesi
      vermez.'
    Though: Cümle başı zıtlık bağlacı olarak 'Though' bu şekilde sıfatı sıçratmaz.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.restrictive-which-what-whatever.02
  target_content_id: grammar.c1.restrictive-which-what-whatever
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Prevent the Turkish tendency to leave the adjective after the verb in
    ''however'' clauses:'
  prompt_tr_hint: '''However'' kalıbında sıfatın cümle sonunda bırakıldığı sıra hatasını
    düzeltiniz.'
  stem: Which procurement rule shows grammatical word order?
  options:
  - Whichever budget appears urgent of unlimited options, check signatures.
  - However a partner's request appears urgent, verify dual budget signatures first.
  - However urgent a partner's request appears, verify dual budget signatures first.
  - However urgency the partner brings, we require two signatures.
  correct_answer: However urgent a partner's request appears, verify dual budget signatures
    first.
  explanation_en: Pull the modified adjective right next to 'However' ('However urgent
    a request...') before naming the subject.
  explanation_tr: '''However'' ile nitelenen sıfat (''urgent'') özneden önce gelerek
    hemen bağlaca bitişmelidir.'
  distractor_explanations:
    However a partner's request appears urgent, verify dual budget signatures first.: Sıfat
      ('urgent') mutlaka 'However' kelimesinin hemen sağında olmalıdır.
    Whichever budget appears urgent of unlimited options, check signatures.: '''Whichever''
      sınırsız seçenekle (''unlimited'') mantıken çelişir.'
    However urgency the partner brings, we require two signatures.: '''However'' arkasına
      soyut isim (''urgency'') değil sıfat (''urgent'') ister.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.restrictive-which-what-whatever.03
  target_content_id: grammar.c1.restrictive-which-what-whatever
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select ''whichever'' for a bounded, defined two-option choice:'
  prompt_tr_hint: Sınırları belli iki seçenekten hangisi olursa olsun anlamında doğru
    zamiri seçiniz.
  stem: ___ of these two cloud regions handles backup rotation will pass compliance
    audits.
  options:
  - However
  - That
  - Wherever
  - Whichever
  correct_answer: Whichever
  explanation_en: Use 'whichever' when picking freely from a limited, explicitly enumerated
    set ('two cloud regions').
  explanation_tr: Sayısı belli dar bir kümeden ('iki bölgeden hangisi') seçim yaparken
    'whichever' doğru zamirdir.
  distractor_explanations:
    However: Zarf niteliğindedir, özne zamiri olup bölge seçemez.
    Wherever: Belirsiz yer zarfıdır, 'of these two' öznesini kuramaz.
    That: Bağlamsız cümle başı evrensel seçim zamiri olarak kullanılamaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.prepositional-complement-variation.01
  target_content_id: grammar.c1.prepositional-complement-variation
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the exact prepositional frame governing rule compliance:'
  prompt_tr_hint: Uyumluluk bildiren fiilin zorunlu edat eşleşmesini doğru tamamlayınız.
  stem: All external audio suppliers must ___ local data residency directives.
  options:
  - comply with
  - abide to
  - adhere with
  - comply to
  correct_answer: comply with
  explanation_en: 'Lock exact synonym pairs accurately: ''comply WITH'', ''adhere
    TO'', and ''abide BY''.'
  explanation_tr: 'Eş anlamlıların çapraz edatları karıştırılmamalıdır: ''comply WITH'',
    ''adhere TO'', ''abide BY''.'
  distractor_explanations:
    comply to: '''adhere to'' ile karıştırıldığı için hatalıdır; ''comply'' daima
      ''with'' alır.'
    abide to: '''abide'' sözleşme/kural için ''by'' alır (''abide by rules'').'
    adhere with: '''adhere'' mutlaka ''to'' edatıyla eşleşir (''adhere to rules'').'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.prepositional-complement-variation.02
  target_content_id: grammar.c1.prepositional-complement-variation
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot the prepositional cross-wiring error in a root-cause report:'
  prompt_tr_hint: Neden-sonuç raporunda fiillerin edatlarını birbirine karıştıran
    hatayı düzeltiniz.
  stem: Which root-cause statement pairs causal verbs and prepositions accurately?
  options:
  - Engineering attributed the outage from expired gateway certificates yesterday.
  - Our Q3 retention lift stems by clearer Turkish hints and attributes to vendor
    work.
  - Reliability hinges over deterministic schema gates prior to APK builds.
  - Our Q3 retention lift stems from clearer Turkish trap hints, whereas delays stem
    from vendor audits.
  correct_answer: Our Q3 retention lift stems from clearer Turkish trap hints, whereas
    delays stem from vendor audits.
  explanation_en: 'Keep causal patterns exact: ''stem FROM source'' and ''attribute
    effect TO cause''; ''hinge ON requirement''.'
  explanation_tr: '''Stem FROM'', ''attribute X TO Y'' ve ''hinge ON'' edat çiftleri
    sabittir.'
  distractor_explanations:
    Our Q3 retention lift stems by clearer Turkish hints and attributes to vendor work.: '''stem''
      daima ''from'' alır ve ''attribute'' geçişli nesne (''attributed X to Y'') ister.'
    Engineering attributed the outage from expired gateway certificates yesterday.: '''attribute''
      edat olarak ''from'' değil ''to'' alır (''attributed A to B'').'
    Reliability hinges over deterministic schema gates prior to APK builds.: '''hinge''
      fiili ''over'' değil ''on/upon'' alır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c1.prepositional-complement-variation.03
  target_content_id: grammar.c1.prepositional-complement-variation
  cefr_level: C1
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Pair statistical share description with the precise prepositional verb:'
  prompt_tr_hint: Bir oranın veya payın toplam içindeki yerini açıklarken doğru öbek
    fiili seçiniz.
  stem: Recurring enterprise subscriptions now ___ nearly two-thirds of annual revenue.
  options:
  - stem to
  - subscribe on
  - comply for
  - account for
  correct_answer: account for
  explanation_en: '''Account for + percentage/share'' cleanly reports how much a segment
    contributes to a total (or explains a reason).'
  explanation_tr: '''Toplamın şu kadarını oluşturmak / açıklamak'' anlamında ''account
    for'' kalıbı standarttır.'
  distractor_explanations:
    stem to: Kaynak anlatır ve yanlış edatlıdır; gelir payı oranını ifade etmez.
    comply for: Kurallara uyum fiili ('with') yanlış edatla bozulmuştur.
    subscribe on: '''subscribe'' (desteklemek/abone olmak) ''to'' ister ve oran bildirmez.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.negative-polarity-items-subtleties.01
  target_content_id: grammar.c2.negative-polarity-items-subtleties
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Apply negative polarity scaling cleanly with ''let alone'':'
  prompt_tr_hint: Olumsuz bir temelde küçük hedeften daha büyük imkânsızlığa geçerken
    doğru 'let alone' cümlesini seçiniz.
  stem: Our manual script can barely normalize hyphens across files, ___ audit nested
    Turkish morphology.
  options:
  - let alone
  - in lieu of
  - not even less
  - let apart
  correct_answer: let alone
  explanation_en: '''Let alone'' follows a negative/barely clause (''barely normalize
    X''), ruling out a far harder demand (''Y'').'
  explanation_tr: '''...kaldı ki / ...şöyle dursun'' anlamına gelen ''let alone'',
    kısıtlayıcı ilk cümleden daha zor hedefe geçer.'
  distractor_explanations:
    let apart: Deyim 'let alone' şeklindedir; 'let apart' kullanılmaz.
    not even less: '''much less'' veya ''let alone'' doğrudur; ''*not even less''
      geçersizdir.'
    in lieu of: '''...nın yerine'' anlamında ikame edatıdır, derecelendirme kurmaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.negative-polarity-items-subtleties.02
  target_content_id: grammar.c2.negative-polarity-items-subtleties
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Detect the logical-direction error in C2 negative polarity expressions:'
  prompt_tr_hint: '''Let alone'' yapısında ölçek sırası veya olumlu cümle hatasını
    önleyen seçeneği belirleyiniz.'
  stem: Which assessment respects both polarity licensing and logical scale direction?
  options:
  - Our team couldn't barely find anything remotely resembling a gap in tests.
  - Without local caching, the app struggles on weak 3G, let alone inside mountain
    tunnels.
  - With full caching, the app flies through mountain tunnels, let alone open Wi-Fi.
  - External reviewers already certified multi-year treaties, let alone read page
    one.
  correct_answer: Without local caching, the app struggles on weak 3G, let alone inside
    mountain tunnels.
  explanation_en: Ensure the first clause conveys inability/scarcity AND orders conditions
    from milder ('weak 3G') to harsher ('tunnels').
  explanation_tr: '''Let alone'' mutlaka olumsuz/kısıtlı öncülle başlamalı ve kolaydan
    daha imkansıza doğru sıralanmalıdır.'
  distractor_explanations:
    With full caching, the app flies through mountain tunnels, let alone open Wi-Fi.: Olumlu
      ana yüklem ('flies through') 'let alone' kalıbını lisanslamaz.
    External reviewers already certified multi-year treaties, let alone read page one.: Hem
      cümle olumludur hem de ölçek yönü büyükten küçüğe ters kurulmuştur.
    Our team couldn't barely find anything remotely resembling a gap in tests.: '''couldn''t
      barely'' çift olumsuzluk hatası taşır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.negative-polarity-items-subtleties.03
  target_content_id: grammar.c2.negative-polarity-items-subtleties
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'License ''anything remotely'' inside a negative evaluative clause accurately:'
  prompt_tr_hint: Yokluğu vurgulayan olumsuz bağlamda doğal C2 yoğunlaştırıcısını
    seçiniz.
  stem: Despite two weeks of redlines, the revised SLA contained ___ like fair termination
    reciprocity.
  options:
  - nothing remotely
  - something remotely
  - barely nothing
  - scarcely nothing
  correct_answer: nothing remotely
  explanation_en: '''Nothing remotely + like/resembling...'' idiomatically rejects
    even minimal similarity without double negation.'
  explanation_tr: '''Uzaktan yakından benzeyen hiçbir şey...'' anlamında ''nothing
    remotely'' çift olumsuzluk olmadan kullanılır.'
  distractor_explanations:
    something remotely: Yokluk bildiren olumsuz vurgu ('hiçbir şey') için 'nothing
      remotely' (veya olumsuzluk+anything remotely) gerekir.
    scarcely nothing: '''scarcely'' ile ''nothing'' çift olumsuzluk oluşturur.'
    barely nothing: '''barely'' + ''nothing'' standart dışı çift olumsuzluk yaratır.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.hedged-attribution-evidentials.01
  target_content_id: grammar.c2.hedged-attribution-evidentials
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Signal skeptical distance between a vendor''s surface stated purpose
    and probable reality:'
  prompt_tr_hint: Görünürde sunulan gerekçeye karşı mesafeli şüphe sinyali veren C2
    evidential belirtecini seçiniz.
  stem: The fee revision was ___ framed as maintenance support, yet pricing tiers
    jumped thirty percent.
  options:
  - irrefutably
  - wholeheartedly
  - unreservedly
  - ostensibly
  correct_answer: ostensibly
  explanation_en: '''Ostensibly'' contrasts an officially declared superficial reason
    with conflicting underlying evidence.'
  explanation_tr: '''Görünüşte / sözde şu amaçla'' anlamındaki ''ostensibly'' resmi
    bahaneyle gerçek sonuç arasındaki farkı vurgular.'
  distractor_explanations:
    unreservedly: Koşulsuz onay ifade eder; tutarsızlık eleştirisiyle çelişir.
    irrefutably: Çürütülemez kesinlik bildirir, şüphe tonuyla uyuşmaz.
    wholeheartedly: Gönülden desteği anlatır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.hedged-attribution-evidentials.02
  target_content_id: grammar.c2.hedged-attribution-evidentials
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Avoid accidentally throwing skeptical doubt onto praised allies via
    evidentials:'
  prompt_tr_hint: Yanlış seçildiğinde güvenilir ekibe şüphe gölgesi düşüren 'purportedly
    / ostensibly' kullanım hatasını ayıklayınız.
  stem: 'Select the executive memo conveying genuine, respectful consensus from field
    teams:'
  options:
  - By all accounts, Istanbul support coordinators resolved regional tax friction
    rapidly.
  - Ostensibly, Istanbul coordinators helped partners quickly, proving our pride.
  - Presumably our best QA testers failed to check what they supposedly passed.
  - Istanbul support coordinators purported to resolve regional tax friction rapidly.
  correct_answer: By all accounts, Istanbul support coordinators resolved regional
    tax friction rapidly.
  explanation_en: '''By all accounts'' aggregates consistent positive witness reports
    without introducing skeptical irony.'
  explanation_tr: '''By all accounts'' genel kabul gören olumlu gözlemi aktarır; ''ostensibly/purportedly''
    ise kuşkuculuk yükler.'
  distractor_explanations:
    Istanbul support coordinators purported to resolve regional tax friction rapidly.: '''purported
      to'' sözde öyle iddia edildiği, doğruluğunun kuşkulu olduğu imasını taşır.'
    Ostensibly, Istanbul coordinators helped partners quickly, proving our pride.: Ekibi
      övmek isterken 'ostensibly' demek 'sözde yardım etmiş göründüler' gibi kırıcı
      olur.
    Presumably our best QA testers failed to check what they supposedly passed.: Çelişkili
      ve güvensizlik yansıtan yapıdadır.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.hedged-attribution-evidentials.03
  target_content_id: grammar.c2.hedged-attribution-evidentials
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distance formal prose cleanly from an unproven external claim:'
  prompt_tr_hint: Doğrulanmamış bir dış iddiayı mesafeli aktaran en isabetli C2 fiil
    çerçevesini seçiniz.
  stem: Independent latency tests exposed gaps in a plugin that ___ score pronunciation
    natively.
  options:
  - purported to
  - by all accounts could
  - demonstrably achieved to
  - wielded to
  correct_answer: purported to
  explanation_en: '''Purport to + V1'' signals that an actor claims a capability without
    verified substantiation.'
  explanation_tr: Gerçekliği doğrulanmamış iddiayı mesafeyle aktarmak için 'purport
    to + V1' kullanılır.
  distractor_explanations:
    by all accounts could: Doğrulanmamış sahte iddiayı açığa çıkaran eleştirel bağlamla
      zıttır.
    demonstrably achieved to: '''achieve'' ardından ''to + V1'' almaz.'
    wielded to: '''wield'' araç/yetki kullanmaktır, ''to V1'' almaz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.focus-particles-even-only-placement.01
  target_content_id: grammar.c2.focus-particles-even-only-placement
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Attach the focus adverb immediately before the exact restricted time
    condition:'
  prompt_tr_hint: '''Solely / only'' zarfını anlam belirsizliği bırakmayacak biçimde
    daralttığı koşulun tam önüne koyunuz.'
  stem: 'Select the unambiguous SLA rule restricting telemetry to active voice drills:'
  options:
  - Audio buffers solely stream to Gemini during active Live Speaking sessions.
  - Audio buffers stream to Gemini during solely active sessions even.
  - Audio buffers stream to Gemini solely during active Live Speaking sessions.
  - Solely audio buffers stream to Gemini even during active sessions.
  correct_answer: Audio buffers stream to Gemini solely during active Live Speaking
    sessions.
  explanation_en: Place 'solely' right before 'during active Live Speaking sessions'
    so the timeframe scope stays airtight.
  explanation_tr: Sınırlandırma zaman koşuluna aitse 'solely / only' doğrudan 'during...'
    öbeğinin hemen önünde durmalıdır.
  distractor_explanations:
    Audio buffers solely stream to Gemini during active Live Speaking sessions.: Zarfı
      'stream' önüne koymak 'sadece akış yapar (kaydetmez)' anlamıyla zaman kısıtını
      karıştırabilir.
    Solely audio buffers stream to Gemini even during active sessions.: Yalnızca verinin
      türünü ('audio buffers') kısıtlar, ne zaman aktığını daraltmaz.
    Audio buffers stream to Gemini during solely active sessions even.: '''even''
      cümle sonuna sarktığı için editoryal dizim bozuktur.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.focus-particles-even-only-placement.02
  target_content_id: grammar.c2.focus-particles-even-only-placement
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot how shifting ''Only'' changes the truth condition of a contract
    clause:'
  prompt_tr_hint: '''Only'' konumundaki değişimin hukuki cümle anlamını nasıl kaydırdığını
    doğru analiz ediniz.'
  stem: How does 'Security audits logs only when alerts fire' differ from 'Only security
    audits logs when alerts fire'?
  options:
  - Second implies logs delete automatically when no alerts occur
  - Both carry identical legal scope regardless of 'only' placement
  - First bans security completely; second covers every department
  - First limits WHICH trigger time security audits logs; second limits WHO is allowed
    to audit logs
  correct_answer: First limits WHICH trigger time security audits logs; second limits
    WHO is allowed to audit logs
  explanation_en: '''...only when alerts fire'' narrows timing; ''Only security...''
    grants exclusive departmental authority.'
  explanation_tr: '''only when...'' zamanı sınırlar; ''Only security...'' ise denetimi
    yapacak tek yetkili birimi belirler.'
  distractor_explanations:
    Both carry identical legal scope regardless of 'only' placement: Resmi yazıda
      'only' odakladığı öbeğe göre anlam değiştirir.
    First bans security completely; second covers every department: İki cümle de güvenlik
      biriminin denetlediğini belirtir.
    Second implies logs delete automatically when no alerts occur: Kayıt silinmesiyle
      ilgisi yoktur.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.focus-particles-even-only-placement.03
  target_content_id: grammar.c2.focus-particles-even-only-placement
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Pair correlative escalation particles cleanly without symmetry defects:'
  prompt_tr_hint: '''Not merely ... but even'' dereceli vurgu kalıbını paralel biçimde
    tamamlayınız.'
  stem: Manual schema skips risk breaking not merely weekly imports, ___ packaged
    mobile releases.
  options:
  - as well than
  - let alone yet
  - but even
  - however also
  correct_answer: but even
  explanation_en: '''Not merely X, but even / also Y'' forms balanced correlative
    escalation in C2 prose.'
  explanation_tr: İki paralel ögeyi tırmandırarak bağlamak için 'not merely X, but
    even Y' dengesi kurulur.
  distractor_explanations:
    however also: '''not merely'' karşılığı olarak ''however'' paralel bağlaç değildir
      (''but'' zorunludur).'
    as well than: Karşılıklı korelatif eşleşme 'but (also / even)' gerektirir.
    let alone yet: '''not merely'' pozitif tırmanma kurduğu için ''let alone'' ile
      uyuşmaz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.resumptive-modifiers-appositive-dash.01
  target_content_id: grammar.c2.resumptive-modifiers-appositive-dash
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose a crisp resumptive appositive instead of leaving a vague trailing
    ''which'':'
  prompt_tr_hint: Uzun bir teknik başarıyı belirsiz 'which' yerine özetleyici bir
    isimle toparlayan yapıyı seçiniz.
  stem: The generator sorts entries identically across systems—___ that guarantees
    clean diffs.
  options:
  - which
  - a discipline
  - that makes
  - what step
  correct_answer: a discipline
  explanation_en: Introducing a summarizing category noun ('—a discipline that...')
    resolves complex antecedent ambiguity cleanly.
  explanation_tr: Cümlenin tamamını '—a discipline / a safeguard that...' gibi özet
    bir adla kavramak anlatımı zirveye taşır.
  distractor_explanations:
    which: Tire sonrası çıplak 'which that guarantees' çift bağlaç hatası verir.
    that makes: '''—that makes that guarantees'' çift fiil/bağlaç hatası oluşturur.'
    what step: '''what'' önceden anılan olguyu tanımlayan apozitif başlatmaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.resumptive-modifiers-appositive-dash.02
  target_content_id: grammar.c2.resumptive-modifiers-appositive-dash
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Improve vague broad-reference '', which'' in an executive board conclusion:'
  prompt_tr_hint: Yönetici özetindeki belirsiz 'which' kullanımını C2 düzeyinde özetleyici
    bir apozitifle iyileştiriniz.
  stem: Which revision removes pronoun ambiguity across a multi-clause accomplishment?
  options:
  - Engineering halved cold-start lag and dropped cloud calls, which that lifted retention.
  - Engineering dropped cloud calls, which, it lifted overall retention.
  - Halving cold-start lag and cloud calls, what lifted retention nicely.
  - Engineering halved cold-start lag and dropped cloud calls—a transformation that
    lifted retention.
  correct_answer: Engineering halved cold-start lag and dropped cloud calls—a transformation
    that lifted retention.
  explanation_en: Attaching '—a transformation that...' synthesizes multiple achievements
    into one clear logical agent.
  explanation_tr: Birden çok teknik kazanımı '—a transformation that...' ile adlandırıp
    bağlamak 'which' karmaşasını önler.
  distractor_explanations:
    Engineering halved cold-start lag and dropped cloud calls, which that lifted retention.: Hem
      'which' hem 'that' yan yana bağlaç hatası doğurur.
    Halving cold-start lag and cloud calls, what lifted retention nicely.: '''what''
      bu konumda ilgi tümceciği bağlamaz ve ana yüklem eksiktir.'
    Engineering dropped cloud calls, which, it lifted overall retention.: '''which''
      ile gereksiz yedek özne ''it'' yan yana gelemez.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.resumptive-modifiers-appositive-dash.03
  target_content_id: grammar.c2.resumptive-modifiers-appositive-dash
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Complete a prepositional resumptive phrase measuring indispensable impact:'
  prompt_tr_hint: Edat + ilgi zamiri öncesi özetleyici isim içeren resmi C2 yapısını
    tamamlayınız.
  stem: Partners agreed on capped liability tiers, ___ talks would have stalled indefinitely.
  options:
  - a concession without which
  - a concession without that
  - which without a concession
  - without what concession
  correct_answer: a concession without which
  explanation_en: 'Pattern: ''Summarizing Noun + Preposition + which'' (''a concession
    without which...'') conveys indispensable dependency.'
  explanation_tr: '''[Özet İsim] + without which'' kalıbı, olmasa sürecin duracağı
    kritik tavizi mükemmel özetler.'
  distractor_explanations:
    without what concession: Soru sözcüğü 'what' isim sonrası özetleyici apozitif
      kurmaz.
    a concession without that: Edat ('without') ardından 'that' gelemez ('which' zorunludur).
    which without a concession: Özetleyici apozitif isim ('a concession') ilgi zamirinden
      önce gelir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.archaic-legal-compound-adverbs.01
  target_content_id: grammar.c2.archaic-legal-compound-adverbs
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Distinguish instrument adverb ''thereby'' (+ -ing) from logical result
    adverb ''therefore'':'
  prompt_tr_hint: '''Bu yolla ... yaparak'' anlamında V-ing alan ''thereby'' ile ''therefore''
    bağlacını doğru ayırınız.'
  stem: Prepackaging content inside APK assets avoids mobile waits, ___ cutting offline
    abandonment.
  options:
  - thereby
  - hereto
  - whereof
  - therefore
  correct_answer: thereby
  explanation_en: ''', thereby + V-ing'' acts cleanly in modern technical and financial
    prose to specify how a step achieves its result.'
  explanation_tr: ''', thereby + -ing'' yapısı ''bu sayede / bu yolla şunu sağlayarak''
    anlamında modern C2 yazıda çok aktiftir.'
  distractor_explanations:
    therefore: Çekimli bağımsız cümle bağlar ('therefore, it cuts'); tek başına '-ing'
      ortacıyla bağlanması pürüzlüdür.
    hereto: '''bu belgeye ekli'' anlamında mekanik hukuk ekidir, araç bildirmez.'
    whereof: '''ki bunun...'' anlamında eski tarz ilgi zarfıdır, nedensel -ing almaz.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.archaic-legal-compound-adverbs.02
  target_content_id: grammar.c2.archaic-legal-compound-adverbs
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Recognize over-stiff archaic legalese vs. crisp executive register:'
  prompt_tr_hint: Gündelik iş e-postasında aşırı ağdalı düşen eski hukuk zarfları
    yerine doğal karşılığı seçiniz.
  stem: Which reply simplifies an intimidating supplier clause into clean modern business
    English without losing accuracy?
  options:
  - Please revise clauses wherein heretofore you attached limits thereat.
  - Please comply hereto the warranty clause thereof you sent.
  - Please check the warranty limits attached to this agreement.
  - Please look at warranty limits attached hereto and returns thereof post-haste.
  correct_answer: Please check the warranty limits attached to this agreement.
  explanation_en: Decode 'hereto/thereof' fluently when reading MSAs, yet favor plain
    'to this agreement' in everyday executive emails.
  explanation_tr: Sözleşmelerde 'hereto / thereof' okumayı bilmek şarttır ancak günlük
    yazışmada 'to this agreement' demek çok daha doğaldır.
  distractor_explanations:
    Please look at warranty limits attached hereto and returns thereof post-haste.: Normal
      e-postada 'hereto / thereof / post-haste' yığını yapay ve itici kalır.
    Please revise clauses wherein heretofore you attached limits thereat.: Gereksiz
      arkaik sözcük yığını modern netliği bozar.
    Please comply hereto the warranty clause thereof you sent.: '''comply'' fiili
      ''with'' alır, ''hereto'' nesne bağlacı değildir.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.archaic-legal-compound-adverbs.03
  target_content_id: grammar.c2.archaic-legal-compound-adverbs
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Verify accurate legal comprehension of ''thereof'':'
  prompt_tr_hint: Sözleşme metnindeki 'thereof' ifadesinin neye gönderme yaptığını
    doğru çözünüz.
  stem: In a clause reading 'unauthorized copying of software assets or any portion
    thereof', what does 'thereof' replace?
  options:
  - for unlimited commercial resale
  - in this present contract
  - of the software assets
  - by external third parties
  correct_answer: of the software assets
  explanation_en: '''There-'' points back to the previously named referent, and ''-of''
    means ''of'': ''portion thereof'' = ''portion of them''.'
  explanation_tr: '''Thereof'' = ''of that / of them'' (az önce adı geçen varlığın/varlıkların
    bir kısmı).'
  distractor_explanations:
    in this present contract: Bu kavram 'hereunder / herein' ('here-' kökü) ile ifade
      edilir.
    by external third parties: Özne/fail belirtmez; 'there-of' = 'of that/them' demektir.
    for unlimited commercial resale: Ticari kapsam bildirmez.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.pragmatic-concession-mind-you-then-again.01
  target_content_id: grammar.c2.pragmatic-concession-mind-you-then-again
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select a natural spoken C2 self-balancing marker introducing an alternate
    angle:'
  prompt_tr_hint: Sözlü toplantıda karşı olasılığı doğal ve dengeli biçimde masaya
    getiren C2 belirtecini seçiniz.
  stem: At first our offline audio bundle looked heavy—___, mobile data savings made
    the footprint worthwhile.
  options:
  - heretofore
  - save that
  - then again
  - on the grounds that
  correct_answer: then again
  explanation_en: '''Then again'' fluently signals live second thoughts weighing an
    unexpected positive counterweight.'
  explanation_tr: '''Ama diğer yandan düşünüldüğünde...'' tonuyla fikri tartarken
    ''then again'' son derece doğal tınlar.'
  distractor_explanations:
    on the grounds that: Resmi gerekçe sunma bağlacıdır, konuşmada açı değiştiren
      tartma ifadesi değildir.
    save that: Sözleşme istisna şerhidir.
    heretofore: '''şimdiye dek'' anlamında ağır arkaik hukuk zarfıdır.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.pragmatic-concession-mind-you-then-again.02
  target_content_id: grammar.c2.pragmatic-concession-mind-you-then-again
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Avoid misinterpreting conversational idiom ''mind you'' literally:'
  prompt_tr_hint: Konuşma İngilizcesinde yaygın 'mind you' belirtecinin gerçek pragmatik
    anlamını seçiniz.
  stem: When a director says, 'Q4 margins stayed healthy—mind you, travel freezes
    helped quite a bit,' what function does 'mind you' perform?
  options:
  - Accusing the finance team of forgetting travel receipts intentionally
  - Rejecting Q4 margin numbers completely as fabricated fiction
  - Warning subordinates politely to pay closer attention in class
  - Adding an important realistic caveat that qualifies an optimistic claim
  correct_answer: Adding an important realistic caveat that qualifies an optimistic
    claim
  explanation_en: '''Mind you'' inserts an understated, candid qualification (''though
    it''s worth noting'') in conversational dialogue.'
  explanation_tr: '''Mind you'' kelimesi kelimesine ''seni önemsemek'' değil, ''gerçi
    şunu da eklemek gerekir'' diyen şeffaf bir not düşer.'
  distractor_explanations:
    Warning subordinates politely to pay closer attention in class: '''mind'' fiilinin
      sözlü uyarısından bağımsız kalıplaşmış bir söylem işaretleyicisidir.'
    Accusing the finance team of forgetting travel receipts intentionally: Suçlama
      içermez, durumu şeffaf biçimde dengeler.
    Rejecting Q4 margin numbers completely as fabricated fiction: Rakamları reddetmez,
      sadece katkı sağlayan etkeni hatırlatır.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.pragmatic-concession-mind-you-then-again.03
  target_content_id: grammar.c2.pragmatic-concession-mind-you-then-again
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Structure an executive spoken response using the ''Granted..., still...''
    two-beat pivot:'
  prompt_tr_hint: İki vuruşlu diplomatik kabul-dengeleme ('Granted, ..., still, ...')
    yapısını seçiniz.
  stem: ___ early curation took substantial editorial review, our validated corpus
    stays clean long-term.
  options:
  - Granted,
  - Nevertheless,
  - Unless,
  - Put another way,
  correct_answer: Granted,
  explanation_en: Opening a reply with 'Granted, [valid objection]' disarms skeptics
    smoothly before landing your conclusion.
  explanation_tr: Eleştiriyi en başta 'Granted, ...' diye açıkça teslim etmek karşı
    tarafın direncini düşürür.
  distractor_explanations:
    Unless,: '''Unless'' şart olumsuzlamasıdır, tek kelimelik kabul zarfı olarak cümle
      açmaz.'
    Nevertheless,: '''Nevertheless'' baştan kabul değil sonradan zıtlık getirir; ilk
      cümledeki sınırlamayı itiraf etmez.'
    Put another way,: Önceki tezi yeniden ifade eder; yeni bir itiraz-teslim dengesi
      başlatmaz.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.future-past-unfulfilled-perfect.01
  target_content_id: grammar.c2.future-past-unfulfilled-perfect
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Signal explicitly from verb grammar that a scheduled event never materialized:'
  prompt_tr_hint: Geçmişte planlanmış ancak gerçekleşmeden iptal olmuş bir olayı tek
    başına kiple veren yapıyı seçiniz.
  stem: Joint integration tests ___ on Friday afternoon, yet sudden power maintenance
    forced deferral.
  options:
  - are to have been taken
  - would be to take place
  - were to have taken place
  - were taking place
  correct_answer: were to have taken place
  explanation_en: '''Was/were + to have + V3'' signals an officially scheduled intention
    that was later cancelled or aborted.'
  explanation_tr: '''Was/were to have V3'' planlanan tarihte yapılması öngörülüp iptal
    olan olaylar için net C2 işaretidir.'
  distractor_explanations:
    were taking place: Olayın fiilen gerçekleşmeye başladığı veya sürdüğü izlenimi
      verir.
    would be to take place: '''would'' + ''be to'' gereksiz ve doğal olmayan çift
      yapıdır.'
    are to have been taken: Hem şimdiki zaman ('are') hem yanlış edilgen ('taken'
      instead of 'taken place') hatası taşır.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.future-past-unfulfilled-perfect.02
  target_content_id: grammar.c2.future-past-unfulfilled-perfect
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Contrast realized historical trajectory (''was to become'') against
    thwarted plans (''was to have become''):'
  prompt_tr_hint: Fiilen gerçekleşmiş tarihi sonucu iptal edilmiş beklentiden ayıran
    doğru fiil seçimi bulunuz.
  stem: Which historical summary accurately narrates an idea that DID succeed long-term?
  options:
  - What began as a weekend SQLite prototype was to have become our core architecture
    and succeeded.
  - What began as a weekend SQLite prototype was to become the company's core architecture.
  - That early script had to have become our core platform back in 2023.
  - That early script was to having become reliable despite small team size.
  correct_answer: What began as a weekend SQLite prototype was to become the company's
    core architecture.
  explanation_en: '''Was to become'' narrates real subsequent historical fulfillment;
    ''was to have become'' forecloses fulfillment.'
  explanation_tr: '''Was to V1'' sonradan gerçekleşen tarihsel akışı, ''was to have
    V3'' ise boşa çıkan planı anlatır.'
  distractor_explanations:
    What began as a weekend SQLite prototype was to have become our core architecture and succeeded.: '''was
      to have become'' olmadı anlamı verir; ''...and succeeded'' ile çelişir.'
    That early script was to having become reliable despite small team size.: '''to
      having'' mastar çekimi burada geçersizdir.'
    That early script had to have become our core platform back in 2023.: Çıkarım
      kipi olan 'had to have' tarihsel 'ileride şöyle olacaktı' anlamı vermez.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.future-past-unfulfilled-perfect.03
  target_content_id: grammar.c2.future-past-unfulfilled-perfect
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select accurate hypothetical expectation looking backward:'
  prompt_tr_hint: Geçmişte belirli bir noktada bizden neyin beklenmiş olacağını anlatan
    kipi seçiniz.
  stem: Had customs forms cleared on time, courier drivers ___ the regional drop yesterday.
  options:
  - was to have completed
  - will have completed
  - would have completed
  - were completing
  correct_answer: would have completed
  explanation_en: Pair inverted counterfactual condition 'Had X V3' cleanly with 'would
    have + V3' result.
  explanation_tr: Devrik 3. tip koşulda ('Had forms cleared') sonuç cümlesi 'would
    have V3' olmalıdır.
  distractor_explanations:
    were completing: Karşı-olgusal 'Had forms cleared...' devrik 3. tip koşulu modal
      perfect ister.
    was to have completed: Çoğul 'drivers' ile 'was' özne uyumsuzudur ve 'would have'
      sonuç cümlesi gereklidir.
    will have completed: '''yesterday'' ve geçmiş koşul ile ''will'' kullanılamaz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.tough-movement-evaluative-adjectives.01
  target_content_id: grammar.c2.tough-movement-evaluative-adjectives
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Keep tough-movement adjectives clean by omitting redundant trailing
    object pronouns:'
  prompt_tr_hint: Özneye taşınan nesne nedeniyle cümle sonundan atılması gereken fazla
    zamir tuzağından kaçınınız.
  stem: Ambiguous SLA carve-outs look reasonable in theory yet prove surprisingly
    hard ___ in court.
  options:
  - to defend them
  - to defend
  - for defending them
  - to be defending it
  correct_answer: to defend
  explanation_en: In tough-movement ('SLA carve-outs are hard to defend'), leave the
    infinitive object gap empty.
  explanation_tr: Nesne zaten cümle başına özne olarak çekildiği için sonda 'it /
    them' tekrarlanmaz ('hard to defend').
  distractor_explanations:
    to defend them: Özne konumunda ('SLA carve-outs') nesne zaten yer aldığı için
      sona 'them' konamaz.
    for defending them: '''hard'' değerlendirmesinde mastar (''to defend'') tercih
      edilir ve ''them'' tekrar edilemez.'
    to be defending it: Hem gereksiz zamir ('it') hem de yanlış zaman görünüşü içerir.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.tough-movement-evaluative-adjectives.02
  target_content_id: grammar.c2.tough-movement-evaluative-adjectives
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Identify the sentence respecting evaluative adjective and ''possible/likely''
    subject rules:'
  prompt_tr_hint: '''Impossible / probable'' sıfatlarında geçersiz özne kullanımını
    ve fazla ''it'' hatasını ayıklayınız.'
  stem: Which editorial sentence obeys C2 syntax rules cleanly?
  options:
  - Deterministic checks are remarkably easy to audit once schemas stabilize.
  - Deterministic checks are remarkably easy for auditing them once schemas clear.
  - Legacy invoices are nearly impossible that we verify them offline.
  - This migration batch is probable to finish before five o'clock.
  correct_answer: Deterministic checks are remarkably easy to audit once schemas stabilize.
  explanation_en: Keep tough-movement cleanly 'Noun + be + Adj + to V1', and use 'likely'
    (not 'probable') before infinitives.
  explanation_tr: '''Easy/hard to audit'' sonda zamir bırakmaz; mastar alan olasılık
    sıfatı ise ''probable'' değil ''likely''dir.'
  distractor_explanations:
    Deterministic checks are remarkably easy for auditing them once schemas clear.: '''for
      auditing them'' hem yanlış ''for + V-ing'' hem fazla zamir ''them'' içerir.'
    Legacy invoices are nearly impossible that we verify them offline.: '''impossible''
      kişi veya nesne yükselmesini ''that'' ile bağlamaz; ''It is impossible to verify...''
      gerekir.'
    This migration batch is probable to finish before five o'clock.: '''probable''
      mastar yükseltmesi almaz (''likely to finish'' doğru olur).'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.tough-movement-evaluative-adjectives.03
  target_content_id: grammar.c2.tough-movement-evaluative-adjectives
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Retain required prepositions when promoting prepositional objects via
    tough-movement:'
  prompt_tr_hint: Edatlı bir fiilin nesnesi başa alındığında sondaki gerekli edatı
    düşürmeyen doğru seçeneği bulunuz.
  stem: Stubborn recurring clients can be frustrating to negotiate ___, even with
    clear pricing tables.
  options:
  - with whom
  - with
  - for
  - with them
  correct_answer: with
  explanation_en: Keep the stranded preposition ('negotiate with') while leaving out
    the object pronoun after it.
  explanation_tr: Fiil edatlıysa ('negotiate with') edat sonda kalır, ancak arkasındaki
    zamir ('them') düşer.
  distractor_explanations:
    with them: '''clients'' zaten özne olduğu için sonda ''them'' zamiri fazlalıktır.'
    for: Karşı tarafla müzakere etmek anlamında 'negotiate with' gerekir.
    with whom: Devrik olmayan bu mastar sonunda bağlaç zamiri ('whom') gereksizdir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.causal-precision-owing-due-for-fear.01
  target_content_id: grammar.c2.causal-precision-owing-due-for-fear
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Choose the conservative formal causal linker opening an adverbial sentence
    modifier:'
  prompt_tr_hint: Cümle başında zarf olarak kullanılan ve resmi stil kılavuzlarının
    onayladığı neden öbeğini seçiniz.
  stem: ___ dedicated index optimizations, full schema validation now finishes in
    under two seconds.
  options:
  - Because
  - Owing to
  - Due to that
  - For fear of
  correct_answer: Owing to
  explanation_en: '''Owing to + Noun Phrase'' cleanly modifies the action verb at
    clause start in formal technical prose.'
  explanation_tr: İsim öbeğinin başında eylemi niteleyen resmi neden bağlacı olarak
    'Owing to' seçilir.
  distractor_explanations:
    For fear of: Önlem alınan olumsuz korku nedenini anlatır; olumlu hız kazancıyla
      çelişir.
    Due to that: '''Due to'' doğrudan ''that'' cümlesi açmaz.'
    Because: '''Because'' tam fiilli cümle bağlar; isim öbeği almak için ''Because
      of'' veya ''Owing to'' gerektirir.'
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.causal-precision-owing-due-for-fear.02
  target_content_id: grammar.c2.causal-precision-owing-due-for-fear
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Avoid turning prepositional linkers (''owing to / due to'') into full-clause
    conjunctions:'
  prompt_tr_hint: '''Owing to / due to'' sonrası isim öbeği yerine tam cümle koyma
    hatasını düzelten seçeneği bulunuz.'
  stem: Which incident report sentence satisfies strict formal grammar rules?
  options:
  - Owing to the certificate expired at midnight, regional routing dropped briefly.
  - The rollback happened due to we skipped pre-release smoke tests.
  - Because of our cache hit rates stayed high, API fees vanished.
  - The rollback was due to an expired TLS certificate, so traffic shifted within
    minutes.
  correct_answer: The rollback was due to an expired TLS certificate, so traffic shifted
    within minutes.
  explanation_en: '''The rollback was due to [NP]'' passes formal predicate checks
    cleanly, avoiding ungrammatical clause attachments.'
  explanation_tr: '''Due to / Owing to / Because of'' mutlaka isim öbeği ister; tam
    özneli cümle bağlamaz.'
  distractor_explanations:
    Owing to the certificate expired at midnight, regional routing dropped briefly.: '''Owing
      to'' edat öbeğidir, arkasına çekimli tam cümle (''certificate expired'') almaz.'
    The rollback happened due to we skipped pre-release smoke tests.: '''due to''
      sonrasında doğrudan ''we skipped'' tam cümlesi gelemez.'
    Because of our cache hit rates stayed high, API fees vanished.: '''Because of''
      isim öbeği ister; tam cümle için yalnızca ''Because'' gerekir.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.causal-precision-owing-due-for-fear.03
  target_content_id: grammar.c2.causal-precision-owing-due-for-fear
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Express cautious motivation against a feared failure cleanly:'
  prompt_tr_hint: Olası bir sorundan kaçınma kaygısını anlatan resmi önlem bağlacını
    seçiniz.
  stem: Engineers locked Friday schema commits early ___ last-minute changes might
    fracture determinism.
  options:
  - on account of
  - owing that
  - due to the case
  - for fear that
  correct_answer: for fear that
  explanation_en: '''For fear that + clause'' (or ''lest'' in formal legal style)
    expresses precautionary restraint cleanly.'
  explanation_tr: '''...korkusuyla / ...ihtimaline karşı önlem olarak'' tam cümle
    bağlarken ''for fear that'' seçilir.'
  distractor_explanations:
    owing that: Geçersiz bir birleşimdir.
    on account of: İsim öbeği ister, tam cümle bağlamaz.
    due to the case: Doğal İngilizce bağlaç kalıbı değildir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.uncountable-shiftable-nouns-c2.01
  target_content_id: grammar.c2.uncountable-shiftable-nouns-c2
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Separate general harm (''damage'') from legal court compensation (''damages''):'
  prompt_tr_hint: Zarar/hasar ile mahkeme veya sözleşme tazminatını doğru tekil/çoğul
    biçimle ayırınız.
  stem: Skipping backup hashing could cause severe data corruption, yet suppliers
    rejected paying punitive ___.
  options:
  - a damage
  - damages
  - damage to court
  - damages of files
  correct_answer: damages
  explanation_en: Use uncountable 'damage' for physical/system harm and plural-only
    'damages' for monetary legal compensation.
  explanation_tr: Maddi zarar 'damage' (sayılamaz), mahkeme/sözleşme tazminatı ise
    daima çoğul 'damages' olur.
  distractor_explanations:
    damage to court: Parasal hukuki tazminat bedeli daima çoğul 'damages' olarak yazılır.
    a damage: Genel 'hasar' anlamındaki 'damage' sayılamaz ve 'a' almaz.
    damages of files: Fiziksel dosya hasarı tekil/sayılamayan 'damage' olur, tazminat
      değil.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.uncountable-shiftable-nouns-c2.02
  target_content_id: grammar.c2.uncountable-shiftable-nouns-c2
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Eliminate Turkish plural transfer on academic uncountable mass nouns:'
  prompt_tr_hint: '''Araştırmalar / bilgiler / ekipmanlar'' aktarımından kaynaklanan
    hatalı çoğulları eleyiniz.'
  stem: Which academic overview handles C2 mass-vs-count shifts without grammatical
    slips?
  options:
  - Recent cognitive researches back spaced retrieval, with positive learner feedbacks.
  - We purchased three expensive hardwares and audited multiple informations.
  - Recent cognitive research backs spaced retrieval, while collected learner feedback
    remains encouraging.
  - The new studio produced several helpful advices for regional trainees.
  correct_answer: Recent cognitive research backs spaced retrieval, while collected
    learner feedback remains encouraging.
  explanation_en: '''Research'', ''feedback'', ''advice'', and ''information'' stay
    invariant singular unless counting explicit units (''studies'', ''pieces'').'
  explanation_tr: '''Research / feedback / advice / information'' çoğul -s almaz;
    birim sayacaksanız ''studies / items / pieces'' ekleyin.'
  distractor_explanations:
    Recent cognitive researches back spaced retrieval, with positive learner feedbacks.: '''research''
      ve ''feedback'' standart İngilizcede çoğul ''-s'' almaz.'
    We purchased three expensive hardwares and audited multiple informations.: '''hardware''
      ve ''information'' sayılamayan isimlerdir.'
    The new studio produced several helpful advices for regional trainees.: '''advice''
      sayılamaz (''several pieces of advice'' gerekir).'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.uncountable-shiftable-nouns-c2.03
  target_content_id: grammar.c2.uncountable-shiftable-nouns-c2
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select accurate specialized plural semantics for collected intellectual
    works:'
  prompt_tr_hint: Özel teknik veya edebi külliyat anlamında çoğul kullanılabilen kelimeyi
    seçiniz.
  stem: Our curriculum reading track cites complete ___ of modern business essayists
    rather than summaries.
  options:
  - equipments
  - softwares
  - works
  - knowledges
  correct_answer: works
  explanation_en: Unlike uncountable daily labor ('work'), authored creations or engineering
    plants count cleanly as 'works'.
  explanation_tr: Genel emek anlamında sayılamayan 'work', yazar/sanat eseri veya
    tesis anlamında çoğul 'works' olabilir.
  distractor_explanations:
    equipments: '''equipment'' hiçbir zaman çoğul ''-s'' almaz.'
    softwares: '''software'' sayılamayan isimdir, ''-s'' almaz.'
    knowledges: '''knowledge'' sayılamayan isimdir, çoğul kullanılmaz.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.subjunctive-condition-assuming-provided-save.01
  target_content_id: grammar.c2.subjunctive-condition-assuming-provided-save
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Keep conditional provisos free of ''will'' while enforcing formal launch
    preconditions:'
  prompt_tr_hint: '''Provided that'' ön koşul cümleciğinde gelecek zaman yasağına
    uyan doğru fiili seçiniz.'
  stem: We will merge the offline vocabulary expansion cleanly, provided every automated
    check ___ zero duplicates.
  options:
  - confirms
  - would have confirmed
  - will confirm
  - confirming
  correct_answer: confirms
  explanation_en: Conditional conjunctions ('provided that', 'on condition that',
    'assuming') take Present Simple even with future outcomes.
  explanation_tr: '''Provided that / assuming'' sonrası şart cümlesi gelecek anlamı
    taşısa da Present Simple (''confirms'') kalır.'
  distractor_explanations:
    will confirm: '''Provided (that)'' şart yan cümlesi ''if'' gibi içine gelecek
      ''will'' almaz.'
    would have confirmed: Geçmiş karşı-olgusal değil gerçek gelecek koşuludur.
    confirming: Bağlaçlı tam yan cümle çekimli fiil ister.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.subjunctive-condition-assuming-provided-save.02
  target_content_id: grammar.c2.subjunctive-condition-assuming-provided-save
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Insert a concise formal legal exception phrase cleanly:'
  prompt_tr_hint: İki sürüm veya kural arasındaki tek istisnayla sınırlı hukuki şerh
    yapısını seçiniz.
  stem: Which release specification isolates one minor regional caveat gracefully?
  options:
  - Assuming arguments will hold tomorrow, deterministic hashes passed last week.
  - Barring that regional builds will sign tomorrow, builds were identical yesterday.
  - Both SQLite artifacts stay byte-identical, provided that regional builds broke
    hashes.
  - Both SQLite artifacts stay byte-identical, save that regional builds sign different
    keychains.
  correct_answer: Both SQLite artifacts stay byte-identical, save that regional builds
    sign different keychains.
  explanation_en: '''Save that + Clause'' (formal equivalent of ''except that'') cleanly
    carves out one narrow remaining difference.'
  explanation_tr: '''Save that...'' (yalnız şu husus hariç) karmaşık bir kuralda tek
    istisnayı belirtmek için idealdir.'
  distractor_explanations:
    Both SQLite artifacts stay byte-identical, provided that regional builds broke hashes.: '''provided
      that'' ön şart koyar, mevcut tek istisnayı belirtmez.'
    Barring that regional builds will sign tomorrow, builds were identical yesterday.: '''barring''
      tam ''that'' + ''will'' yan cümlesi değil isim öbeği alır (''Barring regional
      delays'').'
    Assuming arguments will hold tomorrow, deterministic hashes passed last week.: Hem
      'Assuming + will' hatası hem zaman uyuşmazlığı içerir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.subjunctive-condition-assuming-provided-save.03
  target_content_id: grammar.c2.subjunctive-condition-assuming-provided-save
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Open an operations schedule using negative prepositional contingency:'
  prompt_tr_hint: '''Beklenmedik aksaklık yaşanmadıkça'' anlamını isim öbeğiyle en
    özlü veren bağlacı seçiniz.'
  stem: ___ unforeseen carrier maintenance, quarterly fee reconciliation runs overnight
    without manual intervention.
  options:
  - Barring
  - Save
  - Assuming that
  - Provided
  correct_answer: Barring
  explanation_en: '''Barring + Noun Phrase'' cleanly conveys ''assuming no blocking
    obstacle X occurs''.'
  explanation_tr: '''Barring + [engelleyici durum adı]'', ''...olmadığı takdirde /
    yaşanmadıkça'' anlamında çok net C2 kısaltmasıdır.'
  distractor_explanations:
    Provided: Olumlu zorunlu ön şart ister ('bakım olması şartıyla' gibi ters anlam
      verir).
    Assuming that: İsim öbeği yerine tam fiilli cümle gerektirir.
    Save: Cümle başı tek kelimelik 'Save unforeseen...' olumsuz önlem olarak 'Barring'
      kadar yerleşik değildir.
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.double-comparative-qualification.01
  target_content_id: grammar.c2.double-comparative-qualification
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Select the fixed C2 degree idiom intensifying relevance given tough
    constraints:'
  prompt_tr_hint: Zorlu bir neden yüzünden değerin veya aciliyetin 'bir kat daha'
    arttığını anlatan kalıbı seçiniz.
  stem: Frequent airline commuters find fast offline storage ___ valuable when cabin
    Wi-Fi stalls.
  options:
  - every the much
  - far from more
  - all the more
  - none the wiser
  correct_answer: all the more
  explanation_en: '''All the more + adjective'' intensifies quality specifically because
    of a highlighted circumstance.'
  explanation_tr: '''All the more + sıfat'' belirtilen koşul yüzünden değerin ''bir
    kat daha fazla'' olduğunu vurgular.'
  distractor_explanations:
    none the wiser: '''hala durumdan habersiz / hiç aydınlanmamış'' demektir; değer
      artışı vermez.'
    far from more: Bozuk birleşimdir ('far from + -ing/adj').
    every the much: Standart İngilizcede geçerli bir derece kalıbı değildir.
  difficulty: standard
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.double-comparative-qualification.02
  target_content_id: grammar.c2.double-comparative-qualification
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Spot the verb-form defect after fronted ''Far from'':'
  prompt_tr_hint: '''Far from'' edat öbeğinden sonra gerund (-ing) gelmemesi durumunda
    oluşan hatayı düzeltiniz.'
  stem: Which executive rebuttal pairs fronted 'Far from' cleanly with subject and
    syntax?
  options:
  - Far from to slow QA down, deterministic packaging cut triage.
  - Far from slowing QA down, deterministic packaging eliminated weekend triage calls.
  - Far from slow QA down, deterministic packaging eliminated weekend triage calls.
  - Far from it slowed QA down, triage calls dropped rapidly.
  correct_answer: Far from slowing QA down, deterministic packaging eliminated weekend
    triage calls.
  explanation_en: '''Far from + Gerund (-ing) / Adjective'' refutes a suspected negative
    while preserving subject alignment.'
  explanation_tr: '''Far from'' ardından fiil gelecekse mutlaka ''-ing'' (''Far from
    slowing'') biçiminde kurulur.'
  distractor_explanations:
    Far from slow QA down, deterministic packaging eliminated weekend triage calls.: '''far
      from'' edat öbeği olduğu için yalın fiil (''slow'') değil ''-ing'' (''slowing'')
      ister.'
    Far from to slow QA down, deterministic packaging cut triage.: '''far from'' ardından
      ''to + V1'' alamaz.'
    Far from it slowed QA down, triage calls dropped rapidly.: '''far from'' çekimli
      tam cümle açmaz; gerund ister.'
  difficulty: stretch
  status: APPROVED
  version: 1
- id: exercise.grammar.c2.double-comparative-qualification.03
  target_content_id: grammar.c2.double-comparative-qualification
  cefr_level: C2
  skill_domain: grammar
  exercise_type: multiple_choice
  prompt_en: 'Identify the idiomatic C2 comparative phrase meaning ''no worse off
    / unharmed'':'
  prompt_tr_hint: Bir durum sonucunda 'hiç zarar görmemiş / eskisi kadar sağlıklı'
    anlamını veren sabit C2 deyimini seçiniz.
  stem: After two hours auditing cache rebuilds offline, the database stayed ___ for
    repeated stress tests.
  options:
  - none the worse
  - less the bad
  - much the wiser
  - all the bad
  correct_answer: none the worse
  explanation_en: '''None the worse (for X)'' is a fixed C2 comparative structure
    signaling resilience without damage.'
  explanation_tr: '''None the worse (for...)'' yoğun teste veya zorluğa rağmen hiçbir
    zarar görmemeyi ifade eder.'
  distractor_explanations:
    less the bad: Geçerli bir İngilizce deyim değildir.
    all the bad: C2 sabit karşılaştırma kalıbına uymaz.
    much the wiser: '''daha bilgili/aydınlanmış'' demektir (''none the wiser'' ise
      hala habersiz); veritabanı sağlamlığıyla ilgisizdir.'
  difficulty: stretch
  status: APPROVED
  version: 1
