      tr: Şirket yan haklarına ilişkin daha fazla bilgi için lütfen insan kaynakları ile iletişime geçiniz.
      context: HR Policies
    - en: Do not share confidential client information in public communication channels.
      tr: Herkese açık iletişim kanallarında gizli müşteri bilgilerini paylaşmayınız.
      context: Data Security
  turkish_traps:
    - trap_type: literal_translation
      trap_note_tr: >-
        Türkçe "bilgiler" çoğul yapılırken İngilizcede "information" kesinlikle sayılamaz bir isimdir.
        "Informations" formu kabul edilemez bir hatadır.
      incorrect_example: Send me the project informations by email.
      correct_example: Send me the project information by email.
  register: general
  topic_tags:
    - communication
    - workplace
  related_ids:
    - vocab.feedback
    - vocab.equipment
  status: APPROVED
  version: 1

- id: vocab.introduce
  headword: introduce
  cefr_level: A2
  part_of_speech: verb
  phonetic: /ˌɪn.trəˈdʒuːs/
  audio_ref: null
  definition_en: To tell someone another person's name when they meet for the first time, or to present a new feature.
  meaning_tr: tanıştırmak, tanıtmak, devreye sokmak
  collocations:
    - text: introduce yourself
      tr: kendini tanıtmak
    - text: introduce a new feature
      tr: yeni bir özelliği tanıtmak/sunmak
  examples:
    - en: Let me introduce myself; I am the technical lead for the payments squad.
      tr: Kendimi tanıtmama izin verin; ödeme ekibinin teknik lideriyim.
      context: Team Introduction
    - en: The product manager introduced the roadmap for the third quarter.
      tr: Ürün yöneticisi üçüncü çeyrek için yol haritasını tanıttı.
      context: All-Hands Meeting
  turkish_traps:
    - trap_type: preposition_confusion
      trap_note_tr: >-
        Birini başka birine tanıştırırken "introduce X to Y" kalıbı kullanılır. "Introduce with" kullanımı yanlıştır.
      incorrect_example: Let me introduce you with my colleague.
      correct_example: Let me introduce you to my colleague.
  register: general
  topic_tags:
    - meetings
    - networking
  related_ids:
    - vocab.colleague
    - vocab.department
  status: APPROVED
  version: 1

- id: vocab.invoice
  headword: invoice
  cefr_level: A2
  part_of_speech: noun
  phonetic: /ˈɪn.vɔɪs/
  audio_ref: null
  definition_en: A document that lists products or services provided, along with the total cost and payment terms.
  meaning_tr: fatura
  collocations:
    - text: send an invoice
      tr: fatura göndermek
    - text: pay an invoice
      tr: faturayı ödemek
    - text: overdue invoice
      tr: vadesi geçmiş fatura
  examples:
    - en: We received your invoice today and will process the payment within thirty days.
      tr: Faturanızı bugün aldık ve ödemeyi otuz gün içinde gerçekleştireceğiz.
      context: Accounting
    - en: Please include the purchase order number on the final invoice.
      tr: Lütfen nihai faturaya satın alma sipariş numarasını ekleyiniz.
      context: Invoicing
  turkish_traps:
    - trap_type: false_friend
      trap_note_tr: >-
        Kurumsal iş İngilizcesinde ticari fatura için "invoice", mağaza/restoran fişi için "receipt",
        elektrik/su gibi faturalar için "bill" kullanılır.
      incorrect_example: The contractor gave us a receipt for the monthly consulting service.
      correct_example: The contractor sent us an invoice for the monthly consulting service.
  register: business
  topic_tags:
    - finance
    - office
  related_ids:
    - vocab.confirm
    - vocab.department
