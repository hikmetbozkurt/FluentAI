  version: 1

- id: vocab.manage
  headword: manage
  cefr_level: A2
  part_of_speech: verb
  phonetic: /ˈmæn.ɪdʒ/
  audio_ref: null
  definition_en: To be responsible for controlling or organizing someone or something, or to succeed in doing something.
  meaning_tr: yönetmek, idare etmek, başarmak
  collocations:
    - text: manage a project
      tr: bir projeyi yönetmek
    - text: manage a team
      tr: bir ekibi yönetmek
    - text: manage to finish
      tr: bitirmeyi başarmak
  examples:
    - en: She manages an international engineering team of twelve developers.
      tr: On iki geliştiriciden oluşan uluslararası bir mühendislik ekibini yönetmektedir.
