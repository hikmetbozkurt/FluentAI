- id: vocab.mention
  headword: mention
  cefr_level: A2
  part_of_speech: verb
  phonetic: /ˈmen.ʃən/
  audio_ref: null
  definition_en: To speak about or refer to something briefly without going into detail.
  meaning_tr: bahsetmek, değinmek
  collocations:
    - text: briefly mention
      tr: kısaca değinmek
    - text: as mentioned earlier
