- id: vocab.schedule
  headword: schedule
  cefr_level: A2
  part_of_speech: noun
  phonetic: /ˈʃedʒ.uːl/
  audio_ref: null
  definition_en: A plan of events or tasks with the times or dates at which they are intended to happen.
  meaning_tr: program, çalışma takvimi, zaman çizelgesi
  collocations:
    - text: tight schedule
      tr: yoğun program
    - text: ahead of schedule
      tr: planlanandan erken
    - text: behind schedule
      tr: planlanandan geç
  examples:
    - en: The sprint is currently on schedule, and we expect to release the update on Friday.
      tr: Sprint şu anda takvime uygun ilerliyor ve güncellemeyi Cuma günü yayınlamayı bekliyoruz.
      context: Agile Project Management
    - en: I have a very tight schedule this afternoon due to back-to-back client calls.
      tr: Peş peşe gelen müşteri görüşmeleri nedeniyle bu öğleden sonra oldukça sıkışık bir takvimim var.
      context: Daily Office Routine
  turkish_traps:
    - trap_type: preposition_confusion
      trap_note_tr: >-
        "Takvime uygun" derken İngilizcede "on schedule", "planlanandan önce" derken "ahead of schedule",
        "planlanandan geç" derken "behind schedule" kalıpları kullanılır. "According to schedule" yerine
        günlük iş dilinde "on schedule" çok daha yaygındır.
      incorrect_example: The deployment is in schedule.
      correct_example: The deployment is on schedule.
  register: general
  topic_tags:
    - workplace
    - time-management
    - planning
  related_ids:
    - vocab.deadline
    - vocab.delay
  status: APPROVED
  version: 1

- id: vocab.appointment
  headword: appointment
  cefr_level: A2
  part_of_speech: noun
  phonetic: /əˈpɔɪnt.mənt/
  audio_ref: null
  definition_en: A formal arrangement to meet someone at a particular time and place.
  meaning_tr: randevu, resmi görüşme
  collocations:
    - text: schedule an appointment
      tr: randevu ayarlamak
    - text: cancel an appointment
      tr: randevuyu iptal etmek
    - text: confirm an appointment
      tr: randevuyu teyit etmek
  examples:
    - en: I would like to schedule an appointment with the HR director for Thursday morning.
      tr: Perşembe sabahı için İK direktörü ile bir randevu ayarlamak istiyorum.
      context: Office Coordination
    - en: Please confirm your appointment by replying to this calendar invite.
      tr: Lütfen bu takvim davetine yanıt vererek randevunuzu teyit ediniz.
      context: Client Relations
  turkish_traps:
    - trap_type: collocation_error
      trap_note_tr: >-
        Türkçede "randevu almak" denildiği için "take an appointment" çevirisi sık yapılır.
        Doğru İngilizce kalıp "make an appointment" veya "schedule an appointment" şeklindedir.
      incorrect_example: I want to take an appointment with the doctor.
      correct_example: I want to make an appointment with the doctor.
  register: general
  topic_tags:
    - meetings
    - workplace
  related_ids:
    - vocab.schedule
    - vocab.cancel
  status: APPROVED
  version: 1

- id: vocab.colleague
  headword: colleague
  cefr_level: A2
  part_of_speech: noun
  phonetic: /ˈkɒl.iːɡ/
  audio_ref: null
  definition_en: A person that you work with, especially in a professional or office environment.
  meaning_tr: iş arkadaşı, meslektaş
  collocations:
    - text: senior colleague
      tr: kıdemli iş arkadaşı
    - text: close colleague
      tr: yakın çalışma arkadaşı
  examples:
    - en: My colleague in Munich helped us resolve the deployment failure.
      tr: Münih'teki iş arkadaşım yayına alma hatasını çözmemize yardımcı oldu.
      context: Team Collaboration
    - en: I will introduce you to our new colleagues during the team lunch.
      tr: Ekip öğle yemeği sırasında sizi yeni iş arkadaşlarımızla tanıştıracağım.
      context: Workplace Welcome
  turkish_traps:
    - trap_type: false_friend
      trap_note_tr: >-
        "Colleague" yalnızca profesyonel iş arkadaşı için kullanılır. Genel okul arkadaşı veya dost
        için "friend" veya "classmate" tercih edilmelidir.
      incorrect_example: My university colleagues and I went to the cinema.
      correct_example: My university friends and I went to the cinema.
  register: general
  topic_tags:
    - workplace
    - team
  related_ids:
    - vocab.introduce
    - vocab.department
  status: APPROVED
  version: 1

- id: vocab.attend
  headword: attend
  cefr_level: A2
  part_of_speech: verb
  phonetic: /əˈtend/
  audio_ref: null
  definition_en: To go to or be present at an event, meeting, course, or function.
  meaning_tr: katılmak, iştirak etmek, hazır bulunmak
  collocations:
    - text: attend a meeting
      tr: toplantıya katılmak
    - text: attend a conference
      tr: konferansa katılmak
  examples:
    - en: All department leads must attend the quarterly planning meeting tomorrow.
      tr: Tüm departman liderleri yarınki üç aylık planlama toplantısına katılmalıdır.
      context: Corporate Meetings
    - en: I cannot attend the demo today because of a conflicting client call.
      tr: Çakışan bir müşteri görüşmesi nedeniyle bugünkü demoya katılamıyorum.
      context: Agile Rituals
  turkish_traps:
    - trap_type: preposition_confusion
      trap_note_tr: >-
        Türkçede "toplantıya katılmak" (-e eki) dendiği için Türk öğreniciler "attend to the meeting"
        demeye eğilimlidir. "Attend" fiili nesnesini doğrudan alır ("attend the meeting").
        "Attend to" ise "ilgilenmek, bakım yapmak" anlamına gelir.
      incorrect_example: I will attend to the conference tomorrow.
      correct_example: I will attend the conference tomorrow.
  register: business
  topic_tags:
    - meetings
    - workplace
  related_ids:
    - vocab.appointment
    - vocab.schedule
  status: APPROVED
  version: 1

- id: vocab.cancel
  headword: cancel
  cefr_level: A2
  part_of_speech: verb
  phonetic: /ˈkæn.səl/
  audio_ref: null
  definition_en: To decide that an organized event, meeting, or agreement will not happen.
  meaning_tr: iptal etmek
  collocations:
    - text: cancel a meeting
      tr: toplantıyı iptal etmek
    - text: cancel a subscription
      tr: aboneliği iptal etmek
  examples:
    - en: We had to cancel the retrospective because three key engineers were sick.
      tr: Üç kilit mühendis hasta olduğu için retrospektif toplantısını iptal etmek zorunda kaldık.
      context: Team Coordination
    - en: Please cancel my booking if the flight is delayed past midnight.
      tr: Uçuş gece yarısından sonraya gecikirse lütfen rezervasyonumu iptal edin.
      context: Business Travel
  turkish_traps:
    - trap_type: false_friend
      trap_note_tr: >-
        "Cancel" iptal etmek demektir. Ertelemek anlamında "postpone" veya "put off" kullanılmalıdır.
      incorrect_example: We canceled the meeting to next Friday.
      correct_example: We postponed the meeting until next Friday.
  register: general
  topic_tags:
    - workplace
    - coordination
  related_ids:
    - vocab.delay
    - vocab.appointment
  status: APPROVED
  version: 1

- id: vocab.confirm
  headword: confirm
  cefr_level: A2
  part_of_speech: verb
  phonetic: /kənˈfɜːm/
  audio_ref: null
  definition_en: To state or show that something is definitely true, correct, or agreed upon.
  meaning_tr: onaylamak, teyit etmek, doğrulamak
  collocations:
    - text: confirm receipt
      tr: alındığını teyit etmek
    - text: confirm a reservation
      tr: rezervasyonu onaylamak
  examples:
    - en: Please confirm your attendance by end of day so we can arrange lunch.
      tr: Öğle yemeğini organize edebilmemiz için lütfen gün sonuna kadar katılımınızı teyit edin.
      context: Office Coordination
    - en: The finance team confirmed that the payment was transferred successfully.
      tr: Finans ekibi ödemenin başarıyla transfer edildiğini onayladı.
      context: Accounting
  turkish_traps:
    - trap_type: register_mismatch
      trap_note_tr: >-
        İş e-postalarında "I got your mail" yerine resmi ve profesyonel olarak "I confirm receipt of your email"
        veya "Kindly confirm your availability" kalıpları tercih edilir.
      incorrect_example: Please ok my request.
      correct_example: Please confirm my request.
  register: business
  topic_tags:
    - communication
    - email
  related_ids:
    - vocab.appointment
    - vocab.request
  status: APPROVED
  version: 1

- id: vocab.delay
  headword: delay
  cefr_level: A2
  part_of_speech: verb
  phonetic: /dɪˈleɪ/
  audio_ref: null
  definition_en: To make something happen at a later time than originally planned.
  meaning_tr: geciktirmek, ertelemek; gecikme
  collocations:
    - text: flight delay
      tr: uçuş gecikmesi
    - text: unexpected delay
      tr: beklenmedik gecikme
  examples:
    - en: The software release was delayed due to an unexpected database migration bug.
      tr: Yazılım sürümü, beklenmedik bir veritabanı geçiş hatası nedeniyle gecikti.
      context: Software Engineering
    - en: We apologize for the delay in answering your support ticket.
      tr: Destek talebinizi yanıtlarken yaşanan gecikmeden dolayı özür dileriz.
      context: Customer Support
  turkish_traps:
    - trap_type: part_of_speech_confusion
      trap_note_tr: >-
        "Delay" hem fiil (gecikmek/ertelemek) hem de isim (gecikme) olarak kullanılır.
        Sıfat olarak ise "delayed" (gecikmiş) formu kullanılır ("The flight is delayed").
      incorrect_example: The train is delay today.
      correct_example: The train is delayed today.
  register: general
  topic_tags:
    - project
    - timeline
  related_ids:
    - vocab.schedule
    - vocab.cancel
  status: APPROVED
  version: 1

- id: vocab.department
  headword: department
  cefr_level: A2
  part_of_speech: noun
  phonetic: /dɪˈpɑːt.mənt/
  audio_ref: null
  definition_en: One of the official divisions of a large organization, company, or university.
  meaning_tr: departman, bölüm, birim
  collocations:
    - text: human resources department
      tr: insan kaynakları departmanı
    - text: finance department
      tr: finans departmanı
  examples:
    - en: Which department is responsible for approving software license purchases?
      tr: Yazılım lisansı satın alımlarını onaylamaktan hangi departman sorumludur?
      context: Corporate Procurement
    - en: Our engineering department expanded by twenty developers this quarter.
      tr: Mühendislik departmanımız bu çeyrekte yirmi geliştiriciyle büyüdü.
      context: Company Growth
  turkish_traps:
    - trap_type: preposition_confusion
      trap_note_tr: >-
        Bir departmanda çalışmak için İngilizcede "work in the ... department" kullanılır.
      incorrect_example: I work at marketing department.
      correct_example: I work in the marketing department.
  register: general
  topic_tags:
    - organization
    - workplace
  related_ids:
    - vocab.colleague
    - vocab.manage
  status: APPROVED
  version: 1

- id: vocab.equipment
  headword: equipment
  cefr_level: A2
  part_of_speech: noun
  phonetic: /ɪˈkwɪp.mənt/
  audio_ref: null
  definition_en: The set of tools, devices, or machines needed for a particular job or activity.
  meaning_tr: ekipman, donanım, araç gereç
  collocations:
    - text: office equipment
      tr: ofis ekipmanları
    - text: IT equipment
      tr: bilişim donanımı
  examples:
    - en: IT will deliver your new laptop and monitor equipment before Monday.
      tr: Bilgi işlem departmanı yeni dizüstü bilgisayar ve monitör donanımınızı Pazartesi'den önce teslim edecektir.
      context: Office Setup
    - en: All safety equipment must be inspected before entering the server room.
      tr: Sunucu odasına girmeden önce tüm güvenlik ekipmanları denetlenmelidir.
      context: Facilities & Safety
  turkish_traps:
    - trap_type: literal_translation
      trap_note_tr: >-
        Türkçede "ekipmanlar" çoğul olarak kullanılabilir, ancak İngilizcede "equipment"
        sayılamaz (uncountable) bir isimdir. Asla "equipments" denmez. Tekil bir parça için
        "a piece of equipment" denilmelidir.
      incorrect_example: We ordered new computer equipments for the team.
      correct_example: We ordered new computer equipment for the team.
  register: general
  topic_tags:
    - office
    - tech
  related_ids:
    - vocab.information
    - vocab.department
  status: APPROVED
  version: 1

- id: vocab.feedback
  headword: feedback
  cefr_level: A2
  part_of_speech: noun
  phonetic: /ˈfiːd.bæk/
  audio_ref: null
  definition_en: Information or opinions about a person's work or performance, used as a basis for improvement.
  meaning_tr: geri bildirim, dönüt
  collocations:
    - text: constructive feedback
      tr: yapıcı geri bildirim
    - text: give feedback
      tr: geri bildirim vermek
    - text: receive feedback
      tr: geri bildirim almak
  examples:
    - en: We value your feedback on the newly released mobile application interface.
      tr: Yeni yayınlanan mobil uygulama arayüzü hakkındaki geri bildirimlerinize değer veriyoruz.
      context: Product Feedback
    - en: The manager provided constructive feedback during my annual review.
      tr: Yöneticim yıllık değerlendirmem sırasında yapıcı geri bildirimlerde bulundu.
      context: Performance Review
  turkish_traps:
    - trap_type: literal_translation
      trap_note_tr: >-
        Tıpkı equipment gibi "feedback" de sayılamaz (uncountable) bir isimdir. "Feedbacks" kullanımı
        İngilizcede hatalıdır. "Geri bildirimler" demek için "some feedback" veya "pieces of feedback" denir.
      incorrect_example: Thank you for your positive feedbacks.
      correct_example: Thank you for your positive feedback.
  register: business
  topic_tags:
    - communication
    - performance
  related_ids:
    - vocab.information
    - vocab.colleague
  status: APPROVED
  version: 1

- id: vocab.information
  headword: information
  cefr_level: A2
  part_of_speech: noun
  phonetic: /ˌɪn.fəˈmeɪ.ʃən/
  audio_ref: null
  definition_en: Facts or details provided or learned about something or someone.
  meaning_tr: bilgi, malumat
  collocations:
    - text: detailed information
      tr: ayrıntılı bilgi
    - text: confidential information
      tr: gizli bilgi
  examples:
