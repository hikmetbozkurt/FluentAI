    - vocab.confirm
  status: APPROVED
  version: 1

- id: vocab.organize
  headword: organize
  cefr_level: A2
  part_of_speech: verb
  phonetic: /ˈɔː.ɡən.aɪz/
  audio_ref: null
  definition_en: To make arrangements for something to happen, or to arrange things in a systematic order.
  meaning_tr: düzenlemek, organize etmek, tertip etmek
  collocations:
    - text: organize a workshop
      tr: çalıştay düzenlemek
    - text: well organized
      tr: iyi organize edilmiş
  examples:
    - en: The scrum master will organize a retrospective workshop next Tuesday.
      tr: Scrum master, önümüzdeki Salı günü bir retrospektif çalıştayı düzenleyecek.
      context: Agile Coaching
    - en: Please organize the project documentation folder before the external audit.
      tr: Lütfen dış denetimden önce proje dokümantasyon klasörünü düzenleyiniz.
      context: Documentation
  turkish_traps:
    - trap_type: register_mismatch
      trap_note_tr: >-
        İngiliz İngilizcesinde "organise" (s ile), Amerikan İngilizcesinde "organize" (z ile) yazılır.
        Her iki yazım da geçerlidir ancak metin genelinde tutarlılık korunmalıdır.
      incorrect_example: We need to do an organization for the event.
      correct_example: We need to organize the event.
  register: general
  topic_tags:
    - planning
    - workplace
  related_ids:
    - vocab.schedule
    - vocab.appointment
  status: APPROVED
  version: 1

- id: vocab.prepare
  headword: prepare
  cefr_level: A2
  part_of_speech: verb
  phonetic: /prɪˈpeər/
  audio_ref: null
  definition_en: To make someone or something ready for what is going to happen.
  meaning_tr: hazırlamak, hazırlanmak
  collocations:
    - text: prepare a presentation
      tr: sunum hazırlamak
    - text: prepare for a meeting
      tr: toplantıya hazırlanmak
  examples:
    - en: I need two hours to prepare the slides for the executive steering committee.
      tr: İcra yönlendirme komitesi için slaytları hazırlamak üzere iki saate ihtiyacım var.
      context: Presentation Preparation
    - en: The operations team is preparing for the scheduled cloud migration this weekend.
      tr: Operasyon ekibi bu hafta sonu gerçekleşecek planlı bulut geçişine hazırlanıyor.
      context: Cloud Operations
  turkish_traps:
    - trap_type: preposition_confusion
      trap_note_tr: >-
        Bir şeyi hazırlamak doğrudan nesne alır ("prepare the report").
        Bir duruma/olaya hazırlanmak ise "prepare for" gerektirir ("prepare for the interview").
      incorrect_example: I am preparing to the interview.
      correct_example: I am preparing for the interview.
  register: general
  topic_tags:
    - workplace
    - tasks
  related_ids:
    - vocab.schedule
    - vocab.organize
  status: APPROVED
  version: 1

- id: vocab.remind
  headword: remind
  cefr_level: A2
  part_of_speech: verb
  phonetic: /rɪˈmaɪnd/
  audio_ref: null
  definition_en: To make someone remember something that they must do or something from the past.
  meaning_tr: hatırlatmak
  collocations:
    - text: remind someone to do something
      tr: birine bir şey yapmasını hatırlatmak
    - text: remind someone of something
      tr: birine bir şeyi hatırlatmak (anımsatmak)
  examples:
    - en: Please remind me to send the signed contract before 5 PM today.
      tr: Lütfen bugün saat 17:00'den önce imzalı sözleşmeyi göndermemi bana hatırlatın.
      context: Office Reminder
    - en: The calendar app sends automated notifications to remind participants of upcoming calls.
      tr: Takvim uygulaması, yaklaşan görüşmeleri katılımcılara hatırlatmak için otomatik bildirimler gönderir.
      context: Productivity Tools
  turkish_traps:
    - trap_type: false_friend
      trap_note_tr: >-
        "Remember" kişinin kendi kendine hatırlamasıdır ("I remembered the password").
        "Remind" ise başkasına hatırlatmaktır ("Please remind me"). Türk öğreniciler bu iki fiili sıkça karıştırır.
      incorrect_example: Please remember me to submit the timesheet.
      correct_example: Please remind me to submit the timesheet.
  register: general
  topic_tags:
    - communication
    - tasks
  related_ids:
    - vocab.confirm
    - vocab.request
  status: APPROVED
  version: 1

- id: vocab.request
  headword: request
  cefr_level: A2
  part_of_speech: verb
  phonetic: /rɪˈkwest/
  audio_ref: null
  definition_en: To politely or officially ask for something to be given, done, or provided.
  meaning_tr: talep etmek, rica etmek; talep, rica
  collocations:
    - text: submit a request
      tr: talep iletmek
    - text: request assistance
      tr: yardım talep etmek
  examples:
    - en: You can request access to the production repository by creating an internal ticket.
      tr: Dahili bir talep kaydı açarak canlı kod deposuna erişim talep edebilirsiniz.
      context: IT Access Management
    - en: The customer requested a full refund due to continuous service interruptions.
      tr: Müşteri, sürekli yaşanan servis kesintileri nedeniyle ücretin tamamının iadesini talep etti.
      context: Customer Care
  turkish_traps:
    - trap_type: preposition_confusion
      trap_note_tr: >-
        Fiil olarak "request" doğrudan nesne alır ("request permission"). "Request for" ancak isim
        kullanımında geçerlidir ("a request for permission").
      incorrect_example: We requested for a budget increase.
      correct_example: We requested a budget increase.
  register: general
  topic_tags:
    - email
    - workplace
  related_ids:
    - vocab.confirm
    - vocab.remind
  status: APPROVED
  version: 1

- id: vocab.urgent
  headword: urgent
  cefr_level: A2
  part_of_speech: adjective
  phonetic: /ˈɜː.dʒənt/
  audio_ref: null
  definition_en: Needing immediate attention, action, or decision.
  meaning_tr: acil, ivedi
  collocations:
    - text: urgent matter
      tr: acil mesele
    - text: urgent request
      tr: ivedi talep
  examples:
    - en: We have an urgent security patch that must be deployed to the production cluster tonight.
      tr: Bu gece canlı sunucu kümesine uygulanması gereken acil bir güvenlik yamamız var.
      context: Incident Management
    - en: Please mark this email as urgent so the on-call engineer notices it immediately.
      tr: Nöbetçi mühendisin derhal fark etmesi için lütfen bu e-postayı acil olarak işaretleyin.
      context: Escalation
  turkish_traps:
    - trap_type: part_of_speech_confusion
      trap_note_tr: >-
        "Urgent" sıfattır ("an urgent task"). Zarf hali "urgently" (acilen), isim hali "urgency"dir (aciliyet).
      incorrect_example: We need this information urgent.
      correct_example: We need this information urgently.
  register: general
  topic_tags:
    - priority
    - communication
  related_ids:
    - vocab.delay
    - vocab.request
  status: APPROVED
  version: 1
