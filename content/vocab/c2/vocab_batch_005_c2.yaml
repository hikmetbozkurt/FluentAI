- id: vocab.catch-22
  headword: catch-22
  part_of_speech: noun
  cefr_level: C2
  phonetic: /ˌkætʃ twenti ˈtuː/
  audio_ref: null
  definition_en: A paradoxical and frustrating situation from which an individual cannot escape because of contradictory rules
    or conditions.
  meaning_tr: içinden çıkılmaz çelişkili durum, kısır döngü
  examples:
  - en: Job seekers often face a catch-22 where employers require experience that can only be obtained by having a job.
    tr: İş arayanlar genellikle işverenlerin yalnızca bir işe sahip olarak kazanılabilecek deneyim talep ettiği bir kısır
      döngüyle karşılaşırlar.
    context: career
  - en: Without credit history you cannot get a loan, creating a financial catch-22.
    tr: Kredi geçmişi olmadan kredi alamazsınız, bu da finansal bir çıkmaz yaratır.
    context: finance
  collocations:
  - text: classic catch-22
    tr: klasik kısır döngü
  - text: face a catch-22
    tr: içinden çıkılmaz durumla yüzleşmek
  register: general
  topic_tags:
  - problem-solving
  - dilemma
  - logic
  related_ids: []
  status: APPROVED
  version: 1
  turkish_traps: []
