- id: vocab.bioaccumulation
  headword: bioaccumulation
  part_of_speech: noun
  cefr_level: C2
  phonetic: /ˌbaɪəʊəˌkjuːmjəˈleɪʃn/
  audio_ref: null
  definition_en: The gradual accumulation of substances, such as toxic chemicals or heavy metals, in an organism over time.
  meaning_tr: biyoakümülasyon, vücutta toksik madde birikimi
  examples:
  - en: Apex marine predators suffer the worst effects of mercury bioaccumulation along aquatic food webs.
    tr: Tepe deniz yırtıcıları sucul besin ağları boyunca cıva biyoakümülasyonunun en ağır etkilerine maruz kalır.
    context: toxicology
  - en: Scientists monitor pesticide bioaccumulation in raptor fatty tissues as a biomarker of ecosystem health.
    tr: Bilim insanları ekosistem sağlığının bir biyobelirteci olarak yırtıcı kuşların yağ dokularındaki pestisit birikimini izler.
    context: ecology
  collocations:
  - text: toxic bioaccumulation
    tr: toksik madde birikimi
  - text: prevent bioaccumulation
    tr: biyoakümülasyonu önlemek
  register: formal
  topic_tags:
  - environment
  - toxicology
  - pollution
  related_ids: []
  status: APPROVED
  version: 1
  turkish_traps: []
- id: vocab.eutrophication
  headword: eutrophication
  part_of_speech: noun
  cefr_level: C2
  phonetic: /ˌjuːtrɒfɪˈkeɪʃn/
  audio_ref: null
  definition_en: Excessive richness of nutrients in a lake or water body, causing dense plant growth and death of animal life from lack of oxygen.
  meaning_tr: ötrofikasyon, sularda aşırı besin maddesi birikimi ve oksijensizlik
  examples:
  - en: Agricultural fertilizer runoff into the shallow bay triggered severe eutrophication and extensive fish die-offs.
    tr: Sığ körfeze tarımsal gübre akıntısı şiddetli ötrofikasyonu ve yaygın balık ölümlerini tetikledi.
    context: marine
  - en: Preventing lake eutrophication requires strict regional limits on synthetic phosphate laundry detergents.
    tr: Göl ötrofikasyonunu önlemek sentetik fosfatlı çamaşır deterjanlarına yönelik katı bölgesel sınırlar gerektirir.
    context: limnology
  collocations:
  - text: cultural eutrophication
    tr: insan kaynaklı ötrofikasyon
  - text: accelerate eutrophication
    tr: ötrofikasyonu hızlandırmak
  register: formal
  topic_tags:
  - environment
  - water
  - pollution
  related_ids: []
  status: APPROVED
  version: 1
