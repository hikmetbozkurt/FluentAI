    tr: Endüstriyel mühendisler eski rafineri arazilerindeki ağır metallerin bitkisel arıtımı için söğüt korulukları konuşlandırdı.
    context: remediation
  - en: Sunflowers proven exceptionally effective in radionuclide phytoremediation around the decommissioned nuclear facility.
    tr: Ayçiçeklerinin hizmet dışı bırakılan nükleer tesis çevresinde radyonüklid fitoremediasyonunda olağanüstü etkili olduğu kanıtlandı.
