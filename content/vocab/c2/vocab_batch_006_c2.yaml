  part_of_speech: noun
  cefr_level: C2
  phonetic: /ˈzɪərɪskeɪpɪŋ/
  audio_ref: null
  definition_en: Landscape design that requires little or no irrigation or other maintenance, used especially in arid and drought-prone regions.
  meaning_tr: kurakçıl peyzaj, susuz bahçe düzenlemesi
  examples:
  - en: Municipal bylaws in desert cities mandate xeriscaping with native cacti to conserve dwindling reservoir reserves.
    tr: Çöl şehirlerindeki belediye yönetmelikleri azalan baraj rezervlerini korumak için yerli kaktüslerle kurakçıl peyzajı zorunlu kılar.
    context: conservation
  - en: Homeowners who replaced thirsty Kentucky bluegrass lawns with elegant xeriscaping cut water bills by seventy percent.
    tr: Aşırı su tüketen çim alanlarını zarif kurakçıl peyzajla değiştiren ev sahipleri su faturalarını yüzde yetmiş azalttı.
    context: sustainability
