  - en: Accelerating soil erosion across the pedosphere threatens microbial biodiversity and terrestrial carbon storage.
    tr: Toprak küre genelinde hızlanan toprak erozyonu mikrobiyal biyoçeşitliliği ve karasal karbon depolamasını tehdit eder.
