    tr: İnsanlığın küresel ekolojik ayak izi Dünya'nın yıllık yenileyici biyolojik kapasitesini çoktan aşmıştır.
    context: sustainability
  - en: National resource planning indices contrast per-capita consumption rates against remaining domestic biocapacity.
    tr: Ulusal kaynak planlama endeksleri kişi başına tüketim oranlarını kalan yerli biyokapasite ile karşılaştırır.
