- id: vocab.a-tall-order
  headword: a tall order
  part_of_speech: idiom
  cefr_level: C2
  phonetic: /ə tɔːl ˈɔː.dər/
  audio_ref: null
  definition_en: An unusually demanding task or target that will be very hard to pull
    off.
  meaning_tr: zorlu iş, üstesinden gelinmesi güç talep
  examples:
  - en: Migrating ten regional ERPs with zero downtime in six weeks is a tall order.
    tr: On bölgesel ERP'yi altı haftada sıfır kesintiyle taşımak gerçekten zorlu bir
      iş.
    context: project
  - en: Cutting cloud spend while doubling throughput sounds like a tall order, yet
      caching helps.
    tr: Çıktıyı iki katına çıkarırken bulut maliyetini düşürmek zor bir talep gibi
      duruyor ama önbellekleme yardımcı oluyor.
    context: engineering
  collocations:
  - text: be quite a tall order
    tr: oldukça zorlu bir iş olmak
  - text: deliver on a tall order
    tr: zorlu bir talebi karşılamak
  register: business
  topic_tags:
  - project
  - business
  - nuance
  related_ids: []
  status: APPROVED
  version: 1
  turkish_traps:
  - trap_type: literal_translation
    trap_note_tr: '''a tall order'' restoran siparişiyle ilgili değildir; ''yerine
      getirilmesi çok güç beklenti/görev'' anlamına gelir.'
    incorrect_example: Please bring me a tall order of coffee.
    correct_example: Closing the enterprise audit by Friday is a tall order.
