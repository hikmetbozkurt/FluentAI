- id: vocab.interoperability
  headword: interoperability
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌɪn.tərˌɒp.ər.əˈbɪl.ə.ti/
  audio_ref: null
  definition_en: The ability of computer systems, networks, or software applications to exchange and make use of information
