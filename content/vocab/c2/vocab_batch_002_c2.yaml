- id: vocab.falsification
  headword: falsification
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌfɔːl.sɪ.fɪˈkeɪ.ʃən/
  audio_ref: null
  definition_en: The action of falsifying or disproving a hypothesis or theory; or the act of fraudulently altering official
    records.
  meaning_tr: yanlışlama (bilim felsefesi); tahrifat, sahtecilik
  collocations:
  - text: principle of falsification
