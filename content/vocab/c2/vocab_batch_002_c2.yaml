  - text: current impasse
    tr: mevcut tıkanıklık
  examples:
  - en: The trade summit reached an unprecedented impasse when neither delegation compromised on agricultural import subsidies.
    tr: Hiçbir heyet tarımsal ithalat sübvansiyonlarında taviz vermeyince ticaret zirvesi benzeri görülmemiş bir çıkmaza girdi.
    context: Trade Negotiations
  - en: To resolve the architectural impasse between senior engineers, the vice president called for an objective proof-of-concept
      trial.
    tr: Kıdemli mühendisler arasındaki mimari tıkanıklığı çözmek için başkan yardımcısı nesnel bir kavram kanıtlama denemesi
      istedi.
    context: Engineering Management
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Fransızca kökenlidir (/ˈæm.pɑːs/); 'reach an impasse' en yaygın fiil kalıbıdır. 'Deadlock' ile eş anlamlıdır.
    incorrect_example: The negotiation arrived in a dead-end.
    correct_example: The bilateral negotiations reached an unfortunate impasse late last night.
  register: formal
  topic_tags:
  - problem-solving
  - negotiation
  - deadlock
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.dialectic
  headword: dialectic
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌdaɪ.əˈlek.tɪk/
  audio_ref: null
  definition_en: The art or practice of arriving at the truth by the exchange of logical arguments and contradictory propositions.
  meaning_tr: diyalektik, eytişim (tez-antitez-sentez süreci)
  collocations:
  - text: Hegelian dialectic
    tr: Hegel diyalektiği
  - text: dialectical process
    tr: diyalektik süreç
  - text: historical dialectic
    tr: tarihsel diyalektik
  examples:
  - en: In Hegelian dialectic, a thesis clashes with its antithesis, ultimately resolving into a higher conceptual synthesis.
    tr: Hegel diyalektiğinde bir tez antiteziyle çatışır ve nihayetinde daha üst kavramsal bir senteze evrilir.
    context: Philosophy
  - en: The tension between technical software innovation and regulatory compliance represents an ongoing industrial dialectic.
    tr: Teknik yazılım inovasyonu ile yasal uyumluluk arasındaki gerilim devam eden sektörel bir diyalektiği temsil eder.
    context: Industry Analysis
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Bölgesel ağız/lehçe olan 'dialect' ile felsefi akıl yürütme yöntemi olan 'dialectic' karıştırılmamalıdır.
    incorrect_example: He spoke in a very academic dialectic.
    correct_example: He engaged in a rigorous dialectic to expose contradictions in the ethical argument.
  register: academic
  topic_tags:
  - academic-analytical
  - philosophy
  - logic
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.hermeneutics
  headword: hermeneutics
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌhɜː.məˈnjuː.tɪks/
  audio_ref: null
  definition_en: The branch of knowledge that deals with interpretation, especially of the Bible, literary texts, or historical
    human action.
  meaning_tr: yorumbilim, hermeneutik
  collocations:
  - text: philosophical hermeneutics
    tr: felsefi yorumbilim
  - text: hermeneutic circle
    tr: hermeneutik döngü
  - text: principles of hermeneutics
    tr: yorumbilimin ilkeleri
  examples:
  - en: Hans-Georg Gadamer revolutionized philosophical hermeneutics by illustrating that historical context conditions all
      human textual interpretation.
    tr: Hans-Georg Gadamer tarihsel bağlamın tüm insani metin yorumlamasını şartlandırdığını göstererek felsefi yorumbilimi
      kökten dönüştürdü.
    context: Continental Philosophy
  - en: Constitutional jurisprudence often relies on legal hermeneutics to interpret ancient statutory language under contemporary
      circumstances.
    tr: Anayasa içtihadı eski kanun dilini çağdaş koşullar altında yorumlamak için sıklıkla hukuki yorumbilimden yararlanır.
    context: Jurisprudence
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: Sonundaki '-s' çoğul eki değildir; tekil bir bilim dalıdır ('hermeneutics is...'). Sıfat hali 'hermeneutic'
      veya 'hermeneutical'dır.
    incorrect_example: Hermeneutics are very difficult to study.
    correct_example: Hermeneutics is fundamental to textual interpretation in constitutional law.
  register: academic
  topic_tags:
  - academic-analytical
  - philosophy
  - interpretation
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.epistemic
  headword: epistemic
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /ˌep.ɪˈstiː.mɪk/
  audio_ref: null
  definition_en: Relating to knowledge or to the degree of its validation and cognitive credibility.
  meaning_tr: bilişsel, bilgiye ilişkin, epistemik
  collocations:
  - text: epistemic certainty
    tr: bilişsel / epistemik kesinlik
  - text: epistemic humility
    tr: epistemik alçakgönüllülük (bilmediğini bilme)
  - text: epistemic bubble
    tr: epistemik yankı odası / bilgi fanusu
  examples:
  - en: Scientists must maintain epistemic humility when interpreting preliminary observational data from unexplored cosmological
      phenomena.
    tr: Bilim insanları keşfedilmemiş kozmolojik fenomenlerden gelen ön gözlemsel verileri yorumlarken epistemik alçakgönüllülüğü
      korumalıdır.
    context: Philosophy of Science
  - en: Algorithmic social feeds trap users in epistemic bubbles that reinforce confirmation bias and exclude opposing perspectives.
    tr: Algoritmik sosyal akışlar kullanıcıları doğrulama yanlılığını pekiştiren ve karşıt bakış açılarını dışlayan bilgi
      fanuslarına hapseder.
    context: Digital Sociology
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Epistemic'' doğrudan bilginin doğruluk değeri ve kesinliğiyle ilgilidir; genel ''educational'' veya ''intellectual''
      ile eş anlamlı değildir.'
    incorrect_example: He has an epistemic school certificate.
    correct_example: The court examined the epistemic validity of the forensic algorithm.
  register: academic
  topic_tags:
  - academic-analytical
  - epistemology
  - philosophy
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.substantiation
  headword: substantiation
  cefr_level: C2
  part_of_speech: noun
  phonetic: /səbˌstæn.ʃiˈeɪ.ʃən/
  audio_ref: null
  definition_en: The provision of evidence or proof to support and establish the truth of a claim or assertion.
  meaning_tr: somut delillerle kanıtlama, somutlaştırma, doğrulama
  collocations:
  - text: require substantiation
    tr: somut kanıt gerektirmek
  - text: lack substantiation
    tr: somut dayanaktan yoksun olmak
  - text: empirical substantiation
    tr: ampirik delillerle doğrulama
  examples:
  - en: Regulatory authorities rejected the drug efficacy claim because the submitted clinical trials lacked rigorous statistical
      substantiation.
    tr: Düzenleyici otoriteler sunulan klinik deneyler sıkı istatistiksel somut kanıtlardan yoksun olduğu için ilaç etkinlik
      iddiasını reddetti.
    context: Pharmaceutical Regulation
  - en: Bold assertions in investigative journalism demand meticulous documentary substantiation prior to publication.
    tr: Araştırmacı gazetecilikteki cesur iddialar yayımlanmadan önce titiz belgesel somut kanıtlar gerektirir.
    context: Media Ethics
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: Fiil 'substantiate'dir (somut kanıtlarla doğrulamak); isim hali olan 'substantiation' iddiaların delillendirilmesini
      ifade eder.
    incorrect_example: Your claim has no substantiality.
    correct_example: Without documentary substantiation, the audit committee cannot approve the expenditure claim.
  register: academic
  topic_tags:
  - academic-analytical
  - evidence
  - proof
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.axiomatic
  headword: axiomatic
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /ˌæk.si.əˈmæt.ɪk/
  audio_ref: null
  definition_en: Self-evident or unquestionable; acting as an established, indisputable premise.
  meaning_tr: apaçık, tartışmasız, aksiyomatik (kendiliğinden doğru olan)
  collocations:
  - text: axiomatic truth
    tr: apaçık / tartışmasız gerçek
  - text: regarded as axiomatic
    tr: tartışmasız kabul edilen
  - text: axiomatic foundation
    tr: aksiyomatik temel
  examples:
  - en: In Euclidean geometry, it is considered axiomatic that the shortest distance between two points on a plane is a straight
      line.
    tr: Öklid geometrisinde bir düzlemde iki nokta arasındaki en kısa mesafenin doğru bir çizgi olduğu tartışmasız bir gerçek
      kabul edilir.
    context: Mathematics
  - en: Free market economists treated consumer rationality as an axiomatic truth until empirical behavioral findings debunked
      the assumption.
    tr: Serbest piyasa ekonomistleri ampirik davranışsal bulgular varsayımı çürütüp geçersiz kılana kadar tüketici rasyonalitesini
      apaçık bir gerçek olarak ele aldılar.
    context: Economic Methodology
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Matematikte kanıtlanmaya gerek duyulmayan temel önermeye 'axiom' (aksiyom) denir; 'axiomatic' ise 'şüphe
      götürmez derecede apaçık olan' anlamında sıfattır.
    incorrect_example: This is very obvious like an axiomly.
    correct_example: That healthy cash flow is essential for startup survival is an axiomatic principle.
  register: academic
  topic_tags:
  - academic-analytical
  - logic
  - mathematics
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.circumlocution
  headword: circumlocution
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌsɜː.kəm.ləˈkjuː.ʃən/
  audio_ref: null
  definition_en: The use of many words where fewer would do, especially in a deliberate attempt to be vague or evasive.
  meaning_tr: lafı dolandırma, dolambaçlı anlatım
  collocations:
  - text: avoid circumlocution
    tr: lafı dolandırmaktan kaçınmak
  - text: diplomatic circumlocution
    tr: diplomatik dolambaçlı dil
  - text: indulge in circumlocution
    tr: lafı gevelemek / uzatmak
  examples:
  - en: Rather than addressing the budget deficit directly, the spokesperson engaged in elaborate rhetorical circumlocution.
    tr: Sözcü bütçe açığını doğrudan ele almak yerine ayrıntılı retorik dolambaçlı laf oyunlarına başvurdu.
    context: Political Press Briefing
  - en: In executive technical documentation, engineers should eliminate unnecessary circumlocution to enhance conceptual
      clarity.
    tr: Yönetici teknik dokümantasyonunda mühendisler kavramsal netliği artırmak için gereksiz laf dolandırmalarını ortadan
      kaldırmalıdır.
    context: Technical Writing
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Latincedeki 'circum' (etrafında) ve 'loqui' (konuşmak) kelimelerinden gelir; doğrudan sadede gelmek yerine
      etrafında dolanarak konuşmayı tarif eder.
    incorrect_example: He spoke roundly to avoid truth.
    correct_example: The politician's excessive circumlocution frustrated journalists seeking clear answers.
  register: formal
  topic_tags:
  - communication
  - rhetoric
  - evasion
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.equivocation
  headword: equivocation
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ɪˌkwɪv.əˈkeɪ.ʃən/
  audio_ref: null
  definition_en: The use of ambiguous language to conceal the truth or avoid committing oneself; prevarication.
  meaning_tr: kaçamak konuşma, iki anlamlı sözlerle gerçeği gizleme
  collocations:
  - text: without equivocation
    tr: hiç kaçamak yapmadan / açıkça
  - text: resort to equivocation
    tr: kaçamak ifadelere başvurmak
  - text: deliberate equivocation
    tr: kasıtlı iki anlamlılık
  examples:
  - en: The corporate legal counsel answered the senate investigative committee's inquiries directly and without equivocation.
    tr: Şirket hukuk müşaviri senato soruşturma komitesinin sorularını doğrudan ve hiç kaçamak yapmadan yanıtladı.
    context: Congressional Hearing
  - en: Diplomats recognized that the ambassador's deliberate equivocation was intended to buy time during peace negotiations.
    tr: Diplomatlar büyükelçinin kasıtlı iki anlamlı kaçamak sözlerinin barış görüşmelerinde zaman kazanmayı amaçladığını
      fark etti.
    context: Diplomacy
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Equivalent'' (eşdeğer) ile kök bağı olsa da ''equivocation'' dürüst olmayan, bir kelimeyi iki farklı
      anlama gelecek şekilde kullanarak aldatma safsatasıdır.'
    incorrect_example: He spoke equivalently to hide the secret.
    correct_example: The minister stated unequivocally that taxes would not rise; there was no room for equivocation.
  register: formal
  topic_tags:
  - communication
  - rhetoric
  - evasion
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.articulacy
  headword: articulacy
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ɑːˈtɪk.jə.lə.si/
  audio_ref: null
  definition_en: The ability to express ideas fluently, clearly, and coherently in spoken or written language.
  meaning_tr: düşüncelerini açık ve akıcı ifade etme yeteneği, meramını kusursuz anlatma becerisi
  collocations:
  - text: verbal articulacy
    tr: sözel akıcılık ve ifade gücü
  - text: exceptional articulacy
    tr: olağanüstü ifade kabiliyeti
  - text: demonstrate articulacy
    tr: akıcı ifade yeteneği sergilemek
  examples:
  - en: The candidate's extraordinary articulacy during the televised debate swayed thousands of undecided swing voters.
    tr: Adayın televizyon münazarasındaki olağanüstü akıcı ifade yeteneği binlerce kararsız seçmeni etkiledi.
    context: Political Rhetoric
  - en: Senior software architects must possess both deep coding acumen and the articulacy to justify structural designs to
      executives.
    tr: Kıdemli yazılım mimarları hem derin kodlama uzmanlığına hem de yapısal tasarımları yöneticilere savunacak bir ifade
      gücüne sahip olmalıdır.
    context: Technical Leadership
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: Sıfat hali 'articulate' (/ɑːˈtɪk.jə.lət/); bu akıcılığı ve berraklığı belirten soyut isim formu ise 'articulacy'
      veya 'articulateness'tir.
    incorrect_example: He has a great articulate in English.
    correct_example: Her impressive articulacy enables her to explain complex distributed consensus mechanisms effortlessly.
  register: formal
  topic_tags:
  - communication
  - fluency
  - expression
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.rhetorically
  headword: rhetorically
  cefr_level: C2
  part_of_speech: adverb
  phonetic: /rɪˈtɒr.ɪ.kəl.i/
  audio_ref: null
  definition_en: In terms of rhetoric or speech intended to persuade, or posed without expecting an actual answer.
  meaning_tr: retorik olarak, söz sanatı açısından; cevabı beklenmeyen sözde soru şeklinde
  collocations:
  - text: ask rhetorically
    tr: retorik olarak (cevabını beklemeden) sormak
  - text: rhetorically powerful
    tr: hitabet açısından güçlü
  - text: frame rhetorically
    tr: retorik bir dille çerçevelemek
  examples:
  - en: The keynote speaker asked rhetorically whether humanity could afford to delay aggressive decarbonization any longer.
    tr: Ana konuşmacı insanlığın agresif karbonsuzlaşmayı daha fazla ertelemeyi göze alıp alamayacağını retorik bir soruyla
      sordu.
    context: Public Speaking
  - en: Although rhetorically persuasive, the executive's presentation lacked empirical financial substantiation.
    tr: Hitabet açısından ikna edici olmasına rağmen yöneticinin sunumu ampirik mali kanıtlardan yoksundu.
    context: Corporate Briefing
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Rhetorically'' çoğunlukla ''rhetorical question'' (cevabı içinde gizli olan sözde soru) kalıbında kullanılır;
      ayrıca konuşmanın ikna sanatını niteler.'
    incorrect_example: He asked a question with rhetoric.
    correct_example: She asked rhetorically to emphasize the absurdity of the proposed budget cuts.
  register: formal
  topic_tags:
  - communication
  - rhetoric
  - persuasion
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.nepotism
  headword: nepotism
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˈnep.ə.tɪ.zəm/
  audio_ref: null
  definition_en: The practice among those with power or influence of favoring relatives, friends, or associates, especially
    by giving them jobs.
  meaning_tr: akraba kayırma, adam kayırmacılık, nepotizm
  collocations:
  - text: rampant nepotism
    tr: yaygın akraba kayırmacılığı
  - text: accuse of nepotism
    tr: adam kayırmakla suçlamak
  - text: combat nepotism
    tr: kayırmacılıkla mücadele etmek
  examples:
  - en: The corporate governance committee instituted blind recruitment procedures to eradicate lingering nepotism in executive
      promotions.
    tr: Kurumsal yönetim komitesi üst düzey yönetici terfilerindeki köklü adam kayırmacılığı ortadan kaldırmak için kör işe
      alım prosedürleri getirdi.
    context: Corporate Governance
  - en: Public institutions lose civic credibility when lucrative state contracts are awarded through blatant familial nepotism.
    tr: Kazançlı devlet ihaleleri bariz ailevi kayırmacılık yoluyla verildiğinde kamu kurumları toplumsal inandırıcılığını
      kaybeder.
    context: Public Ethics
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Latincede yeğen ('nepos') kelimesinden türemiştir; iş hayatında ve devlette akrabaların haksız yere önemli
      makamlara getirilmesini tanımlar.
    incorrect_example: He gave the job to his relative with favoritism of nephew.
    correct_example: The investigation revealed egregious instances of nepotism within the municipal procurement board.
  register: formal
  topic_tags:
  - work-career
  - ethics
  - governance
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.bureaucratize
  headword: bureaucratize
  cefr_level: C2
  part_of_speech: verb
  phonetic: /bjʊəˈrɒk.rə.taɪz/
  audio_ref: null
  definition_en: To organize or administer an enterprise through complex, rigid, and excessively formal bureaucratic procedures.
  meaning_tr: bürokratikleştirmek, aşırı kuralcı ve hantal hale getirmek
  collocations:
  - text: increasingly bureaucratize
    tr: giderek daha hantal ve bürokratik hale getirmek
  - text: risk bureaucratizing
    tr: bürokratikleştirme riski taşımak
  - text: tendency to bureaucratize
    tr: bürokratikleşme eğilimi
  examples:
  - en: Rapid corporate expansion often threatens to bureaucratize nimble software startups, stifling grassroots technical
      innovation.
    tr: Hızlı kurumsal büyüme sıklıkla çevik yazılım girişimlerini bürokratikleştirme ve tabandan gelen teknik inovasyonu
      boğma tehdidi taşır.
    context: Organizational Scalability
  - en: Excessive compliance layers can inadvertently bureaucratize simple everyday employee reimbursement claims.
    tr: Aşırı uyumluluk katmanları çalışanların basit günlük masraf taleplerini istemeden hantal bir bürokrasiye boğabilir.
    context: Operations
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Bureaucracy'' isimdir (bürokrasi); fiil formu ''bureaucratize'' bir süreci veya kurumu hantal kurallara
      boğmaktır.'
    incorrect_example: They made bureaucracy the agile sprint process.
    correct_example: Overly rigid approval hierarchies bureaucratized the product development cycle.
  register: formal
  topic_tags:
  - work-career
  - organization
  - management
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.meritocratic
  headword: meritocratic
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /ˌmer.ɪ.təˈkræt.ɪk/
  audio_ref: null
  definition_en: Relating to or characteristic of a system in which individuals are rewarded, advanced, or selected based
    on demonstrated ability and merit.
  meaning_tr: liyakat temelli, liyakate dayalı
  collocations:
  - text: meritocratic system
    tr: liyakat temelli sistem
  - text: meritocratic culture
    tr: liyakat kültürü
  - text: strictly meritocratic
    tr: kesinlikle liyakate dayalı
  examples:
  - en: The technology giant prides itself on a strictly meritocratic engineering culture where technical promotions depend
      exclusively on code impact.
    tr: Teknoloji devi teknik terfilerin sadece kodun yarattığı etkiye bağlı olduğu kesinlikle liyakate dayalı bir mühendislik
      kültürüyle övünür.
    context: Corporate Culture
  - en: Sociological research questions whether completely meritocratic admissions exist when standardized testing favors
      affluent socioeconomic strata.
    tr: Sosyolojik araştırmalar standart testler varlıklı sosyoekonomik katmanları kayırdığında tamamen liyakate dayalı kabullerin
      var olup olmadığını sorgulamaktadır.
    context: Educational Sociology
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: İsim 'meritocracy' (liyakat düzeni); sıfat ise 'meritocratic'tir (liyakate dayalı). Nepotizm ve iltimasın
      zıddıdır.
    incorrect_example: We have a merit system company.
    correct_example: We established an open and rigorously meritocratic evaluation framework for partner promotions.
  register: formal
  topic_tags:
  - work-career
  - governance
  - merit
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.fiduciary
  headword: fiduciary
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /fɪˈdjuː.ʃi.ər.i/
  audio_ref: null
  definition_en: Involving trust, especially regarding the legal relationship between a trustee and beneficiary in managing
    financial assets.
  meaning_tr: yedieminlikle ilgili, güvene ve vekalete dayalı, emanetçi (mali/hukuki)
  collocations:
  - text: fiduciary duty
    tr: yedieminlik / sadakat görevi (hukuki yükümlülük)
  - text: fiduciary responsibility
    tr: vekalet sorumluluğu
  - text: breach of fiduciary duty
    tr: güveni / vekalet görevini kötüye kullanma
  examples:
  - en: Board members bear an uncompromising fiduciary duty to prioritize shareholder equity above personal commercial interests.
    tr: Yönetim kurulu üyeleri kişisel ticari çıkarlarının üzerinde hissedar haklarını önceleyen tavizsiz bir yedieminlik
      görevi taşırlar.
    context: Corporate Law
  - en: Pension fund asset managers face severe legal sanctions if they breach their fiduciary obligations to retired contributors.
    tr: Emeklilik fonu varlık yöneticileri emekli katılımcılara karşı vekalet ve sadakat yükümlülüklerini ihlal ederlerse
      ağır yasal yaptırımlarla karşılaşırlar.
    context: Investment Management
  turkish_traps:
  - trap_type: false_friend
