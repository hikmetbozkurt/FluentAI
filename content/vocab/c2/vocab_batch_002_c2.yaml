    tr: birlikte çalışabilirliği sağlamak
  - text: lack of interoperability
    tr: birlikte çalışabilirlik eksikliği
  examples:
  - en: Antitrust antitrust regulators enforced open data standards to guarantee seamless interoperability between rival messaging
      ecosystems.
    tr: Antitröst rekabet düzenleyicileri rakip mesajlaşma ekosistemleri arasında sorunsuz birlikte çalışabilirliği garanti
      etmek için açık veri standartlarını zorunlu kıldı.
    context: Software Policy
  - en: Building decentralized cryptographic ledgers requires robust protocol-level interoperability to transfer digital assets
      across disparate blockchains.
