  - text: scientific falsification
    tr: bilimsel yanlışlama
  - text: falsification of records
    tr: kayıtların tahrif edilmesi
  examples:
  - en: Karl Popper posited that empirical falsification, rather than inductive verification, constitutes the true demarcation
      of empirical science.
    tr: Karl Popper tümevarımsal doğrulama yerine ampirik yanlışlamanın ampirik bilimin gerçek sınır çizgisini oluşturduğunu
      ileri sürdü.
    context: Philosophy of Science
  - en: The corporate compliance investigation exposed intentional falsification of emissions testing telemetry data.
    tr: Kurumsal uyumluluk soruşturması emisyon testi telemetri verilerinde kasıtlı tahrifat yapıldığını ortaya çıkardı.
    context: Corporate Governance
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Bilim felsefesinde 'falsification' (yanlışlama) Popper'ın teorilerin sınanabilirliğini anlatan olumlu bir
