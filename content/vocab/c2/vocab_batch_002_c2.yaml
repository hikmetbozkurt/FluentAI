  cefr_level: C2
  part_of_speech: noun
  phonetic: /ɪˌpɪs.tɪˈmɒl.ə.dʒi/
  audio_ref: null
  definition_en: The branch of philosophy concerned with the theory of knowledge, its methods, validity, and scope.
