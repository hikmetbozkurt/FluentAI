- id: vocab.tautological
  headword: tautological
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /ˌtɔː.təˈlɒdʒ.ɪ.kəl/
  audio_ref: null
  definition_en: Involving or containing unnecessary repetition of meaning, using different words to say the same thing, or
