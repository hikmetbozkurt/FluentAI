  meaning_tr: pat (satrançta); çıkmaz, kilitlenme, kördüğüm
  collocations:
  - text: reach a stalemate
    tr: çıkmaza girmek / kilitlenmek
  - text: break the stalemate
    tr: kilitlenmeyi kırmak / açmak
  - text: political stalemate
    tr: siyasi kilitlenme
  examples:
  - en: After eighteen rounds of bitter labor wage negotiations, the union and executive management reached an absolute stalemate.
    tr: On sekiz tur süren çetin işçi ücreti müzakerelerinin ardından sendika ve şirket yönetimi mutlak bir kilitlenmeye ulaştı.
