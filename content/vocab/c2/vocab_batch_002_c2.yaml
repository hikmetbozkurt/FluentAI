- id: vocab.obsolescence
  headword: obsolescence
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌɒb.səˈles.əns/
  audio_ref: null
  definition_en: The state or process of becoming obsolete, outdated, or no longer used due to technological advances.
  meaning_tr: eskime, demode olma, kullanım dışı kalma
  collocations:
  - text: planned obsolescence
    tr: planlı eskitme
  - text: technological obsolescence
    tr: teknolojik eskime
  - text: fall into obsolescence
    tr: kullanım dışı kalmak / demode olmak
  examples:
  - en: Consumer rights organizations have fiercely criticized hardware manufacturers for implementing artificial planned
      obsolescence in consumer smartphones.
    tr: Tüketici hakları örgütleri akıllı telefonlarda yapay planlı eskitme uyguladıkları için donanım üreticilerini sert
      bir şekilde eleştirdi.
    context: Consumer Electronics
  - en: Rapid advancements in generative artificial intelligence threaten to accelerate the functional obsolescence of legacy
      data entry workflows.
