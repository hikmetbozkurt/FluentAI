- id: vocab.anthropogenic
  headword: anthropogenic
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /ˌæn.θrə.pəˈdʒen.ɪk/
  audio_ref: null
  definition_en: Originating in human activity, especially regarding environmental pollutants, emissions, or climate changes.
  meaning_tr: insan kaynaklı, beşerî kökenli (çevre/iklim)
  collocations:
  - text: anthropogenic climate change
    tr: insan kaynaklı iklim değişikliği
  - text: anthropogenic emissions
    tr: beşerî kökenli emisyonlar
  - text: anthropogenic impact
    tr: insan faaliyetlerinin etkisi
  examples:
  - en: The United Nations climate consensus confirmed that anthropogenic carbon emissions are the primary driver of polar
      ice-sheet melting.
    tr: Birleşmiş Milletler iklim uzlaşısı, kutup buz tabakası erimesinin birincil itici gücünün insan kaynaklı karbon emisyonları
      olduğunu teyit etti.
    context: Climate Science
  - en: Distinguishing natural volcanic atmospheric cooling from anthropogenic global warming requires sophisticated isotopic
      analysis.
    tr: Doğal volkanik atmosferik soğumayı beşerî kökenli küresel ısınmadan ayırt etmek gelişmiş izotopik analizler gerektirir.
    context: Atmospheric Physics
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Anthropology'' (insanbilim) ile akrabadır; ''anthropogenic'' ise özellikle insanın çevre üzerinde yarattığı
      etkileri ve kirliliği niteleyen bilimsel terimdir.'
    incorrect_example: The climate change is made by humanly factors.
    correct_example: The overwhelming empirical consensus confirms that contemporary global warming is largely anthropogenic.
  register: academic
  topic_tags:
  - environment
  - climatology
  - science
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.biodegradability
  headword: biodegradability
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌbaɪ.əʊ.dɪˌɡreɪ.dəˈbɪl.ə.ti/
  audio_ref: null
  definition_en: The capability of organic or synthetic materials to decompose naturally by bacteria or other biological means.
  meaning_tr: biyolojik olarak parçalanabilirlik, biyobozunurluk
  collocations:
  - text: rate of biodegradability
    tr: biyolojik parçalanma hızı
  - text: enhance biodegradability
    tr: biyobozunurluğu artırmak
  - text: marine biodegradability
    tr: deniz ortamında biyobozunurluk
  examples:
  - en: Polymer chemical engineers synthesize bioplastics from starch matrices to enhance biodegradability in marine aquatic
      environments.
    tr: Polimer kimya mühendisleri, denizel sucul ortamlarda biyobozunurluğu artırmak amacıyla nişasta matrislerinden biyoplastikler
      sentezler.
    context: Materials Science
  - en: Regulatory authorities test consumer packaging for verified soil biodegradability before granting green environmental
      labels.
    tr: Düzenleyici otoriteler yeşil çevre etiketi vermeden önce tüketici ambalajlarını kanıtlanmış toprak biyobozunurluğu
      açısından test eder.
    context: Environmental Standards
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Biodegradable'' sıfattır; parçalanabilirlik özelliğini belirten soyut isim formu ise ''biodegradability''dir.'
    incorrect_example: The material has high biodegradable.
    correct_example: Scientists investigated the enzymatic biodegradability of microbial polyesters.
  register: academic
  topic_tags:
  - environment
  - materials
  - biochemistry
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.desalination
  headword: desalination
  cefr_level: C2
  part_of_speech: noun
  phonetic: /diːˌsæl.ɪˈneɪ.ʃən/
  audio_ref: null
  definition_en: The process of removing dissolved mineral salts from seawater to produce fresh water suitable for human consumption
    or irrigation.
  meaning_tr: tuzdan arındırma, desalinasyon (deniz suyunu tatlı suya çevirme)
  collocations:
  - text: desalination plant
    tr: tuzdan arındırma tesisi
  - text: thermal desalination
    tr: termal tuzdan arındırma
  - text: reverse osmosis desalination
    tr: ters ozmoz ile desalinasyon
  examples:
  - en: Arid Gulf states rely overwhelmingly on reverse-osmosis seawater desalination to satisfy municipal potable water requirements.
    tr: Kurak Körfez ülkeleri belediye içme suyu ihtiyacını karşılamak için ezici bir biçimde ters ozmoz deniz suyu tuzdan
      arındırmasına güvenir.
    context: Civil Engineering
  - en: Engineers are integrating offshore solar thermal energy to reduce the carbon footprint of industrial desalination
      facilities.
    tr: Mühendisler endüstriyel desalinasyon tesislerinin karbon ayak izini azaltmak için açık deniz güneş termal enerjisini
      entegre ediyor.
    context: Clean Technology
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Latin kökenli 'de-' (uzaklaştırma) ve 'saline' (tuzlu) bileşimidir. Telaffuzuna (/diːˌsæl.ɪˈneɪ.ʃən/) dikkat
      edilmelidir.
    incorrect_example: The desaltation of the water took three hours.
    correct_example: Large-scale seawater desalination is essential for water security in arid regions.
  register: formal
  topic_tags:
  - environment
  - engineering
  - water-resources
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.remediation
  headword: remediation
  cefr_level: C2
  part_of_speech: noun
  phonetic: /rɪˌmiː.diˈeɪ.ʃən/
  audio_ref: null
  definition_en: The action of remedying, reversing, or stopping environmental damage, pollution, or chemical contamination.
  meaning_tr: ıslah etme, çevresel arındırma, zararı giderme
  collocations:
  - text: environmental remediation
    tr: çevresel ıslah / arındırma
  - text: soil remediation
    tr: toprak ıslahı
  - text: bioremediation technique
    tr: biyolojik ıslah tekniği
  examples:
  - en: Biotechnologists utilized specialized bacterial strains for the bioremediation of heavy-metal contamination in abandoned
      copper mines.
    tr: Biyoteknoloji uzmanları terk edilmiş bakır madenlerindeki ağır metal kirliliğinin biyolojik ıslahı için özel bakteri
      suşlarından yararlandı.
    context: Biotechnology
  - en: Municipal redevelopment authorities allocated significant capital toward the environmental remediation of historical
      industrial docklands.
    tr: Belediye kentsel dönüşüm otoriteleri tarihi sanayi tersanelerinin çevresel ıslahına önemli bir sermaye tahsis etti.
    context: Urban Planning
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Remedy'' (çare/ilaç) kökünden gelir. Çevre mühendisliğinde ve siber güvenlikte ''hasarı giderme ve eski
      sağlıklı haline döndürme'' sürecini tanımlar.'
    incorrect_example: The cleaning of the poison was finished.
    correct_example: The comprehensive chemical remediation of the industrial site required multi-stage filtration.
  register: academic
  topic_tags:
  - environment
  - remediation
  - ecology
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.bioclimatic
  headword: bioclimatic
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /ˌbaɪ.əʊ.klaɪˈmæt.ɪk/
  audio_ref: null
  definition_en: Relating to the interrelations of climate and living organisms, especially building design taking advantage
    of local weather patterns.
  meaning_tr: biyoiklimsel, yerel iklime duyarlı (mimari/ekoloji)
  collocations:
  - text: bioclimatic architecture
    tr: biyoiklimsel mimari
  - text: bioclimatic design
    tr: iklimle uyumlu tasarım
  - text: bioclimatic factors
    tr: biyoiklimsel etkenler
  examples:
  - en: Bioclimatic architecture harnesses natural solar radiation and cross-ventilation to minimize reliance on artificial
      heating and cooling.
    tr: Biyoiklimsel mimari yapay ısıtma ve soğutmaya olan bağımlılığı en aza indirmek için doğal güneş radyasyonundan ve
      çapraz havalandırmadan yararlanır.
    context: Sustainable Architecture
  - en: Urban bioclimatic assessments guide municipal planners in positioning green corridors to dissipate metropolitan heat
      islands.
    tr: Kentsel biyoiklimsel değerlendirmeler metropol ısı adalarını dağıtmak için yeşil koridorların konumlandırılmasında
      belediye planlamacılarına rehberlik eder.
    context: Urban Ecology
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Bioclimatic'' terimi mimaride ve ekolojide binanın yönünü, rüzgarı ve güneşi enerji verimliliği için
      kullanan tasarımları belirtir; genel ''climate''tan çok daha spesifiktir.'
    incorrect_example: The house is very weather-friendly designed.
    correct_example: The eco-resort was constructed according to strict bioclimatic principles.
  register: academic
  topic_tags:
  - environment
  - architecture
  - ecology
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.unprecedentedly
  headword: unprecedentedly
  cefr_level: C2
  part_of_speech: adverb
  phonetic: /ʌnˈpres.ɪ.den.tɪd.li/
  audio_ref: null
  definition_en: In a manner that has never happened, been done, or been known before.
  meaning_tr: daha önce eşi benzeri görülmemiş şekilde
  collocations:
  - text: unprecedentedly high
    tr: görülmemiş derecede yüksek
  - text: expand unprecedentedly
    tr: eşi benzeri görülmemiş biçimde genişlemek
  - text: rise unprecedentedly
    tr: benzeri görülmemiş biçimde yükselmek
  examples:
  - en: Oceanic surface temperatures across the North Atlantic surged unprecedentedly throughout the meteorological summer.
    tr: Kuzey Atlantik genelindeki okyanus yüzeyi sıcaklıkları meteorolojik yaz boyunca eşi benzeri görülmemiş şekilde fırladı.
    context: Climatology
  - en: Autonomous computing infrastructure has scaled unprecedentedly over the past decade across sovereign data borders.
    tr: Otonom bilişim altyapısı son on yılda egemen veri sınırları boyunca daha önce görülmemiş bir biçimde ölçeklendi.
    context: Tech Transformation
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Unprecedented'' sıfattır (''unprecedented crisis''); fiil veya sıfat derecelendirmesi için zarf formu
      olan ''unprecedentedly'' kullanılır.'
    incorrect_example: The temperatures rose unprecedented this year.
    correct_example: Glacial retreat accelerated unprecedentedly over the last two observational cycles.
  register: formal
  topic_tags:
  - environment
  - trends
  - scale
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.erudition
  headword: erudition
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌer.ʊˈdɪʃ.ən/
  audio_ref: null
  definition_en: The quality of having or showing great knowledge or learning; profound scholarship.
  meaning_tr: derin bilgi, engin ilim, allamelik
  collocations:
  - text: vast erudition
    tr: engin ilim / derin bilgi birikimi
  - text: scholarly erudition
    tr: akademik vukufiyet / derinlik
  - text: display erudition
    tr: derin bilgi birikimini sergilemek
  examples:
  - en: The keynote humanities lecture was delivered with profound intellectual depth and classical erudition.
    tr: Ana beşeri bilimler dersi derin bir entelektüel derinlik ve klasik ilim birikimiyle sunuldu.
    context: Academic Discourse
  - en: His extensive philosophical treatises reflect decades of tireless comparative theological erudition.
    tr: Kapsamlı felsefi incelemeleri onlarca yıllık yorulmak bilmez karşılaştırmalı teolojik ilim birikimini yansıtmaktadır.
    context: Literary Scholarship
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Sıfat hali 'erudite' (/ˈer.uː.daɪt/ - çok bilgili, allame) şeklindedir; 'education' (genel eğitim) ile değil,
      'bireyin edindiği derin entelektüel birikim' ile ilgilidir.
    incorrect_example: He has a great education in his head.
    correct_example: The senior historian is revered throughout the academy for his immense erudition.
  register: academic
  topic_tags:
  - education
  - scholarship
  - intellect
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.pedagogue
  headword: pedagogue
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˈped.ə.ɡɒɡ/
  audio_ref: null
  definition_en: A teacher, especially one who is strict, formal, or pedantic in instructional style.
  meaning_tr: eğitmen, muallim (özellikle şekilci/kuralcı öğretmen)
  collocations:
  - text: classical pedagogue
    tr: klasik muallim
  - text: pedantic pedagogue
    tr: şekilci eğitmen
  - text: role of the pedagogue
    tr: eğitmenin rolü
  examples:
  - en: Rather than acting as an authoritarian pedagogue, the modern professor functions as a facilitator of collaborative
      research.
    tr: Otoriter bir muallim gibi davranmak yerine modern profesör ortak araştırmanın bir kolaylaştırıcısı olarak işlev görür.
    context: Educational Philosophy
  - en: The Renaissance essayist mocked rigid university pedagogues who prioritized grammatical dogma over creative thought.
    tr: Rönesans denemecisi yaratıcı düşünce yerine dilbilgisel dogmayı önceleyen katı üniversite muallimleriyle alay etti.
    context: Literary Critique
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Türkçedeki 'pedagog' genellikle 'çocuk gelişim uzmanı/rehberlikçi' için kullanılır; İngilizcede ise genel
      anlamda 'öğretmen/eğitmen' veya hafif olumsuz nüansla 'kuralcı hoca' demektir.
    incorrect_example: We took our crying baby to a pedagogue.
    correct_example: The stern university pedagogue demanded flawless adherence to academic citation rules.
  register: academic
  topic_tags:
  - education
  - teaching
  - pedagogy
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.disquisition
  headword: disquisition
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌdɪs.kwɪˈzɪʃ.ən/
  audio_ref: null
  definition_en: A long or elaborate formal essay or discussion on a particular subject.
  meaning_tr: ayrıntılı akademik inceleme, bilimsel risale
  collocations:
  - text: scholarly disquisition
    tr: akademik ayrıntılı inceleme
  - text: lengthy disquisition
    tr: uzun ve derinlemesine inceleme
  - text: disquisition on ethics
    tr: etik üzerine derinlemesine risale
  examples:
  - en: The philosopher opened his magnum opus with a profound disquisition on the nature of human moral agency.
    tr: Filozof başyapıtını insanın ahlaki faili olmasının doğası üzerine derin bir bilimsel risale ile açtı.
    context: Moral Philosophy
  - en: Her doctoral dissertation offers an exhaustive disquisition on monetary policy divergence across emerging markets.
    tr: Doktora tezi gelişmekte olan piyasalardaki para politikası ayrışması üzerine kapsamlı bir inceleme sunmaktadır.
    context: Macroeconomic Analysis
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Disquisition'' basit bir makale (''article'') veya ödev (''essay'') değildir; bir konuyu felsefi ve teorik
      derinlikle enine boyuna inceleyen resmi risaledir.'
    incorrect_example: I wrote a small disquisition for my homework.
    correct_example: The professor published an authoritative disquisition on classical constitutionalism.
  register: academic
  topic_tags:
  - education
  - academic
  - philosophy
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.inculcate
  headword: inculcate
  cefr_level: C2
  part_of_speech: verb
  phonetic: /ˈɪn.kʌl.keɪt/
  audio_ref: null
  definition_en: To instill an attitude, idea, or habit by persistent instruction and repeated admonition.
  meaning_tr: aşılamak, zihnine yerleştirmek (sürekli telkinle)
  collocations:
  - text: inculcate values
    tr: değerleri aşılamak
  - text: inculcate discipline
    tr: disiplin aşılamak
  - text: inculcate principles
    tr: ilkeleri zihne yerleştirmek
  examples:
  - en: Elite military academies aim to inculcate uncompromising personal integrity and civic duty into officer cadets.
    tr: Seçkin askeri akademiler subay adaylarına tavizsiz kişisel dürüstlük ve vatandaşlık görevi aşılamayı amaçlar.
    context: Institutional Training
  - en: Engineering leaders must deliberately inculcate rigorous automated testing habits throughout development squads.
    tr: Mühendislik liderleri geliştirme ekipleri genelinde sıkı otomatik test alışkanlıklarını bilinçli olarak aşılamalıdır.
    context: Engineering Culture
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bir fikri birine aşılamak derken 'inculcate [values] in/into someone' kalıbı kullanılır; 'to' yerine 'in'
      veya 'into' tercih edilir.
    incorrect_example: Teachers should inculcate critical thinking to students.
    correct_example: Teachers should inculcate critical thinking in their students from an early age.
  register: formal
  topic_tags:
  - education
  - values
  - instruction
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.didactically
  headword: didactically
  cefr_level: C2
  part_of_speech: adverb
  phonetic: /daɪˈdæk.tɪ.kəl.i/
  audio_ref: null
  definition_en: In a manner intended for instruction or conveying moral information, often with an overly patronizing or
    preachy tone.
  meaning_tr: didaktik şekilde, öğretici/öğüt verici bir edayla
  collocations:
  - text: framed didactically
    tr: öğretici bir çerçeveye oturtulmuş
  - text: lecture didactically
    tr: öğüt verir gibi ders anlatmak
  - text: communicate didactically
    tr: didaktik bir üslupla iletişim kurmak
  examples:
  - en: Rather than preaching didactically, the documentary allows viewers to deduce moral conclusions from raw historical
      footage.
    tr: Didaktik bir şekilde vaaz vermek yerine belgesel izleyicilerin ham tarihi görüntülerden ahlaki sonuçlar çıkarmasına
      olanak tanır.
    context: Film Critique
  - en: Technical mentors should facilitate problem-solving inquiries rather than answering every junior developer question
      didactically.
    tr: Teknik mentorlar genç geliştiricilerin her sorusunu didaktik bir edayla yanıtlamak yerine problem çözme sorgulamalarını
      kolaylaştırmalıdır.
    context: Mentorship Strategy
  turkish_traps:
  - trap_type: register_mismatch
    trap_note_tr: Türkçede 'didaktik' sadece 'öğretici' anlamında nötr kullanılabilir; İngilizcede 'didactically' genellikle
      'fazla öğüt verici, tepeden bakan (preachy)' bir alt ton taşıyabilir.
    incorrect_example: He spoke goodly as a teacher.
    correct_example: The executive avoided speaking didactically to preserve peer collaboration.
  register: academic
  topic_tags:
  - education
  - pedagogy
  - tone
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.interdisciplinary
  headword: interdisciplinary
  cefr_level: C2
  part_of_speech: adjective
  phonetic: /ˌɪn.təˈdɪs.ə.plɪn.ər.i/
  audio_ref: null
  definition_en: Relating to or involving two or more academic disciplines or fields of specialized study.
  meaning_tr: disiplinler arası, çok disiplinli
  collocations:
  - text: interdisciplinary research
    tr: disiplinler arası araştırma
  - text: interdisciplinary collaboration
    tr: disiplinler arası iş birliği
  - text: interdisciplinary approach
    tr: çok disiplinli yaklaşım
  examples:
  - en: Addressing global climate catastrophe requires interdisciplinary synergy between atmospheric physicists, economists,
      and behavioral sociologists.
    tr: Küresel iklim felaketini ele almak atmosfer fizikçileri, ekonomistler ve davranışsal sosyologlar arasında disiplinler
      arası bir sinerji gerektirir.
    context: Academic Research
  - en: The university inaugurated an interdisciplinary institute merging computational linguistics with cognitive neural
      modeling.
    tr: Üniversite hesaplamalı dilbilimi bilişsel sinirsel modelleme ile birleştiren disiplinler arası bir enstitü açtı.
    context: Higher Education
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Discipline'' bu bağlamda ceza veya terbiye değil, ''bilim dalı/uzmanlık alanı'' anlamındadır. ''Cross-disciplinary''
      ile yakın anlamlıdır.'
    incorrect_example: Between punishments research is important.
    correct_example: Interdisciplinary collaboration accelerates scientific breakthroughs across traditional departmental
      silos.
  register: academic
  topic_tags:
  - education
  - research
  - integration
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.polymath
  headword: polymath
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˈpɒl.i.mæθ/
  audio_ref: null
  definition_en: A person of wide-ranging knowledge or learning across multiple distinct intellectual domains.
  meaning_tr: hezarfen, çok yönlü bilgin (polimat)
  collocations:
  - text: Renaissance polymath
    tr: Rönesans hezarfeni / polimatı
  - text: true polymath
    tr: gerçek bir hezarfen
  - text: modern polymath
    tr: modern çok yönlü bilgin
  examples:
  - en: Leonardo da Vinci epitomized the Renaissance polymath, excelling concurrently in anatomical drawing, engineering,
      and painting.
    tr: Leonardo da Vinci anatomik çizim, mühendislik ve resim sanatında eşzamanlı olarak sivrilerek Rönesans hezarfenliğini
      somutlaştırdı.
    context: History of Science
  - en: In an era of hyper-specialization, modern polymaths who synthesize disparate scientific domains generate rare paradigm
      shifts.
    tr: Aşırı uzmanlaşma çağında farklı bilimsel alanları sentezleyen modern çok yönlü bilginler nadir paradigma değişimleri
      yaratırlar.
    context: Intellectual History
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Sonundaki '-math' matematik demek değildir; Yunanca 'mathein' (öğrenmek) kökünden gelir. Çok şey öğrenmiş
      ve farklı disiplinlere hakim kimseyi anlatır.
    incorrect_example: A polymath is a master of polygons and mathematics.
    correct_example: A polymath commands extensive mastery across sciences, philosophy, and arts.
  register: academic
  topic_tags:
  - education
  - intellect
  - mastery
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.empiricism
  headword: empiricism
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ɪmˈpɪr.ɪ.sɪ.zəm/
  audio_ref: null
  definition_en: The philosophical theory that all knowledge is derived from sense-experience and experimental observation.
  meaning_tr: ampirizm, deneycilik (felsefi akım)
  collocations:
  - text: philosophical empiricism
    tr: felsefi deneycilik
  - text: grounded in empiricism
    tr: deneyciliğe dayanan
  - text: triumph of empiricism
    tr: deneyciliğin zaferi
  examples:
  - en: Classical British empiricism, championed by John Locke and David Hume, challenged continental rationalist dogmatism.
    tr: John Locke ve David Hume tarafından savunulan klasik İngiliz deneyciliği, kıta Avrupası rasyonalist dogmatizmine meydan
      okudu.
    context: Epistemology
  - en: Modern scientific inquiry bridges mathematical abstraction with strict experimental empiricism.
