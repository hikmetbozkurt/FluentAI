- id: vocab.oligopoly
  headword: oligopoly
  cefr_level: C2
  part_of_speech: noun
  phonetic: /ˌɒl.ɪˈɡɒp.əl.i/
  audio_ref: null
  definition_en: A state of limited competition, in which a market is dominated by a small number of producers or sellers.
  meaning_tr: oligopol, birkaç firmanın hakim olduğu pazar yapısı
  collocations:
  - text: market oligopoly
    tr: piyasa oligopolü
  - text: break up an oligopoly
    tr: oligopolü dağıtmak
  - text: operate as an oligopoly
    tr: oligopol olarak faaliyet göstermek
  examples:
  - en: The commercial aviation manufacturing sector effectively operates as a global duopolistic oligopoly dominated by Boeing
      and Airbus.
    tr: Ticari havacılık üretim sektörü fiilen Boeing ve Airbus'ın hakim olduğu küresel bir düopolistik oligopol olarak faaliyet
      göstermektedir.
    context: Industrial Economics
  - en: Antitrust regulators monitor telecom oligopolies closely to detect tacit price collusion and preserve fair consumer
      pricing.
    tr: Antitröst denetleyicileri zımni fiyat danışıklığını tespit etmek ve adil tüketici fiyatlandırmasını korumak için telekom
      oligopollerini yakından izler.
    context: Competition Regulation
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Monopoly'' tek bir firmanın tekel olmasıdır; ''oligopoly'' ise az sayıda dev firmanın pazarı kontrol
      etmesidir.'
    incorrect_example: The three companies have a monopoly together.
    correct_example: The three domestic mobile carriers form an entrenched commercial oligopoly.
