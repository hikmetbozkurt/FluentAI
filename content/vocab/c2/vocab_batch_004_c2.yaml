    tr: Araştırma monografisi, antlaşmayı on yedinci yüzyıl denizcilik anlaşmazlıkları bağlamına oturtmaktadır.
    context: Education
  - en: Without contextualizing historical statistics, one risks drawing completely erroneous conclusions.
    tr: Tarihsel istatistikler bağlama oturtulmadan değerlendirildiğinde büsbütün yanıltıcı sonuçlara varma riski doğar.
