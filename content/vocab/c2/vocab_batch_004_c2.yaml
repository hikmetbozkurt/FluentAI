- id: vocab.contextualize
  headword: contextualize
  part_of_speech: verb
  cefr_level: C2
  definition_en: To place an idea, event, or piece of evidence within its relevant surrounding environment or historical background
    to make its meaning fully intelligible.
  meaning_tr: bağlama oturtmak; tarihsel veya çevresel koşulları içinde ele almak
  examples:
