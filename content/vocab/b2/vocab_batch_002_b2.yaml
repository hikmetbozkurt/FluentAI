- id: vocab.diagnosis
  headword: diagnosis
  cefr_level: B2
  part_of_speech: noun
  phonetic: /ˌdaɪ.əɡˈnəʊ.sɪs/
  audio_ref: null
  definition_en: The identification of the nature of an illness or health condition by examining symptoms.
  meaning_tr: teşhis, tanı
  collocations:
  - text: early diagnosis
    tr: erken teşhis
  - text: accurate diagnosis
    tr: doğru tanı
  - text: make a diagnosis
    tr: teşhis koymak
  examples:
  - en: Early diagnosis of metabolic disorders allows patients to modify their lifestyle before complications arise.
    tr: Metabolik rahatsızlıkların erken teşhisi, hastaların komplikasyonlar ortaya çıkmadan önce yaşam tarzlarını değiştirmelerini
      sağlar.
    context: Preventive Medicine
  - en: The specialist reviewed the laboratory scans thoroughly before confirming the final medical diagnosis.
    tr: Uzman hekim nihai tıbbi teşhisi doğrulamadan önce laboratuvar taramalarını kapsamlı bir şekilde inceledi.
    context: Clinical Practice
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: Tekil hali 'diagnosis', çoğul hali ise Yunanca kökenli olarak 'diagnoses' (/ˌdaɪ.əɡˈnəʊ.siːz/) biçimindedir.
      Fiil hali 'diagnose' fiilidir.
    incorrect_example: The doctor gave two different diagnosises.
    correct_example: The doctor provided two different diagnoses after running scans.
  register: formal
  topic_tags:
  - health
  - medicine
  - clinical
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.rehabilitation
  headword: rehabilitation
  cefr_level: B2
  part_of_speech: noun
  phonetic: /ˌriː.həˌbɪl.ɪˈteɪ.ʃən/
  audio_ref: null
  definition_en: The process of helping someone return to a normal, healthy life after an injury, surgery, or illness.
  meaning_tr: rehabilitasyon, iyileştirme süreci
  collocations:
  - text: physical rehabilitation
    tr: fiziksel rehabilitasyon
  - text: undergo rehabilitation
    tr: rehabilitasyon sürecinden geçmek
  - text: rehabilitation center
    tr: rehabilitasyon merkezi
  examples:
  - en: After knee ligament surgery, the professional athlete underwent six months of intensive physical rehabilitation.
    tr: Diz bağı ameliyatının ardından profesyonel sporcu altı aylık yoğun bir fiziksel rehabilitasyon sürecinden geçti.
    context: Sports Medicine
  - en: Cardiac rehabilitation programs guide heart patients on safe exercise routines and nutritional habits.
    tr: Kardiyak rehabilitasyon programları kalp hastalarına güvenli egzersiz rutinleri ve beslenme alışkanlıkları konusunda
      rehberlik eder.
    context: Post-operative Care
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Günlük dilde bazen 'rehab' olarak kısaltılır; ancak tıbbi ve mesleki resmi yazışmalarda tam formu olan 'rehabilitation'
      tercih edilmelidir.
    incorrect_example: He entered to a rehab after the traffic accident.
    correct_example: He was admitted to a specialized rehabilitation center after the traffic accident.
  register: formal
  topic_tags:
  - health
  - recovery
  - therapy
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.prescribe
  headword: prescribe
  cefr_level: B2
  part_of_speech: verb
  phonetic: /prɪˈskraɪb/
  audio_ref: null
  definition_en: To authorize the use of a medicine or treatment for someone in writing; or to state officially what should
    be done.
  meaning_tr: reçete etmek, reçete yazmak; kural olarak buyurmak
  collocations:
  - text: prescribe medication
    tr: ilaç reçete etmek
  - text: prescribe antibiotics
    tr: antibiyotik yazmak
  - text: as prescribed
    tr: reçete edildiği şekilde
  examples:
  - en: The physician prescribed a mild painkiller and advised the patient to rest for forty-eight hours.
    tr: Hekim hafif bir ağrı kesici reçete etti ve hastaya kırk sekiz saat dinlenmesini tavsiye etti.
    context: Medical Prescription
  - en: Patients should always complete the full course of antibiotics exactly as prescribed by their doctor.
    tr: Hastalar antibiyotik tedavisini daima doktorları tarafından reçete edildiği şekilde eksiksiz tamamlamalıdır.
    context: Patient Safety
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Prescribe'' (reçete yazmak / buyurmak) ile ''proscribe'' (yasaklamak, gayrimeşru ilan etmek) zıt anlamlıdır
      ve ses benzerliği nedeniyle karıştırılmamalıdır.'
    incorrect_example: The law proscribed daily exercise for citizens.
    correct_example: The health authority prescribed thirty minutes of daily exercise for sedentary workers.
  register: formal
  topic_tags:
  - health
  - medicine
  - pharmacy
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.alleviate
  headword: alleviate
  cefr_level: B2
  part_of_speech: verb
  phonetic: /əˈliː.vi.eɪt/
  audio_ref: null
  definition_en: To make physical pain, emotional suffering, or practical difficulties less severe.
  meaning_tr: hafifletmek, dindirmek, yatıştırmak
  collocations:
  - text: alleviate pain
    tr: ağrıyı hafifletmek
  - text: alleviate symptoms
    tr: belirtileri yatıştırmak
  - text: alleviate stress
    tr: stresi azaltmak / hafifletmek
  examples:
  - en: Regular mindfulness meditation and gentle yoga can noticeably alleviate chronic workplace stress.
    tr: Düzenli farkındalık meditasyonu ve hafif yoga, kronik iş yeri stresini belirgin şekilde hafifletebilir.
    context: Wellness
  - en: Applying an ice pack immediately after a sprain helps alleviate swelling and localized discomfort.
    tr: Burkulmadan hemen sonra buz torbası uygulamak şişliği ve bölgesel rahatsızlığı dindirmeye yardımcı olur.
    context: First Aid
  turkish_traps:
  - trap_type: collocation_error
    trap_note_tr: '''Alleviate'' sıkıntı, ağrı veya zorluğu tamamen yok etmek değil, ''şiddetini azaltmak/hafifletmek''tir.
      Tamamen yok etmek için ''eliminate'' kullanılır.'
    incorrect_example: This tablet will alleviate the problem to 100% zero.
    correct_example: This tablet will alleviate your acute joint pain.
  register: formal
  topic_tags:
  - health
  - relief
  - wellbeing
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.chronic
  headword: chronic
  cefr_level: B2
  part_of_speech: adjective
  phonetic: /ˈkrɒn.ɪk/
  audio_ref: null
  definition_en: An illness or medical condition persisting for a long time or constantly recurring.
  meaning_tr: kronik, süreğen, müzmin
  collocations:
  - text: chronic illness
    tr: kronik hastalık
  - text: chronic pain
    tr: kronik ağrı
  - text: chronic condition
    tr: süreğen sağlık durumu
  examples:
  - en: Poor office chair ergonomics is a leading contributor to chronic lower back issues among desk workers.
    tr: Kötü ofis koltuğu ergonomisi, masa başı çalışanlar arasında kronik bel sorunlarının başlıca nedenlerinden biridir.
    context: Ergonomics
  - en: Managing chronic medical conditions such as diabetes requires disciplined diet and consistent monitoring.
    tr: Diyabet gibi kronik sağlık durumlarını yönetmek disiplinli bir diyet ve tutarlı takip gerektirir.
    context: Healthcare Management
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Chronic'' (uzun süreli/kronik) tıpta ''acute'' (ani gelişen/şiddetli) teriminin zıddıdır. ''Chronic''
      şiddetli demek değildir; kalıcı ve uzun süreli olduğunu belirtir.'
    incorrect_example: He had a chronic heart attack that lasted two minutes.
    correct_example: He had an acute heart attack, but has suffered from chronic hypertension for years.
  register: formal
  topic_tags:
  - health
  - medical
  - conditions
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.sedentary
  headword: sedentary
  cefr_level: B2
  part_of_speech: adjective
  phonetic: /ˈsed.ən.tər.i/
  audio_ref: null
  definition_en: Tending to spend much time seated; somewhat inactive physically.
  meaning_tr: hareketsiz, masa başı, sedanter
  collocations:
  - text: sedentary lifestyle
    tr: hareketsiz yaşam tarzı
  - text: sedentary job
    tr: masa başı iş
  - text: counteract sedentary habits
    tr: hareketsiz alışkanlıkları dengelemek
  examples:
  - en: Leading a sedentary lifestyle increases long-term risks of cardiovascular disease and metabolic slowdown.
    tr: Hareketsiz bir yaşam tarzı sürmek uzun vadede kalp-damar hastalığı ve metabolik yavaşlama risklerini artırır.
    context: Occupational Health
  - en: Health organizations recommend taking five-minute walking breaks to counteract the effects of sedentary desk jobs.
    tr: Sağlık kuruluşları masa başı hareketsiz işlerin etkilerini dengelemek için beş dakikalık yürüyüş molaları verilmesini
      önerir.
    context: Workplace Wellbeing
  turkish_traps:
  - trap_type: collocation_error
    trap_note_tr: İngilizcede hareketsiz yaşam tarzı için 'inactive lifestyle' yerine sağlık ve IELTS bağlamlarında 'sedentary
      lifestyle' tamlaması standarttır.
    incorrect_example: He lives a sitting life without sport.
    correct_example: He lives a sedentary lifestyle and rarely engages in vigorous physical activity.
  register: formal
  topic_tags:
  - health
  - lifestyle
  - habits
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.cut-down-on
  headword: cut down on
  cefr_level: B2
  part_of_speech: phrasal_verb
  phonetic: /kʌt daʊn ɒn/
  audio_ref: null
  definition_en: To reduce the amount or consumption of something, especially food, drink, or expenditure.
  meaning_tr: azaltmak, kısmak (tüketimi/masrafı)
  collocations:
  - text: cut down on caffeine
    tr: kafein tüketimini azaltmak
  - text: cut down on sugar
    tr: şekeri kısmak
  - text: cut down on expenses
    tr: masrafları kısmak
  examples:
  - en: My nutritionist advised me to cut down on processed carbohydrates to improve my sustained energy levels.
    tr: Beslenme uzmanım sürdürülebilir enerji seviyelerimi artırmak için işlenmiş karbonhidratları azaltmamı tavsiye etti.
    context: Nutritional Advice
  - en: To meet our annual green sustainability targets, the department cut down on paper printing by ninety percent.
    tr: Yıllık yeşil sürdürülebilirlik hedeflerimizi yakalamak için departman kağıt baskıyı yüzde doksan oranında azalttı.
    context: Sustainability
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: 'Bu phrasal verb üç parçalıdır: ''cut down on [something]''. ''On'' edatı unutulmamalıdır; ''cut down sugar''
      yerine ''cut down on sugar'' denir.'
    incorrect_example: I am trying to cut down coffee this month.
    correct_example: I am trying to cut down on coffee this month.
  register: general
  topic_tags:
  - health
  - nutrition
  - habits
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.biodiversity
  headword: biodiversity
  cefr_level: B2
  part_of_speech: noun
  phonetic: /ˌbaɪ.əʊ.daɪˈvɜː.sə.ti/
  audio_ref: null
  definition_en: The variety of plant and animal life in the world or in a particular habitat.
  meaning_tr: biyoçeşitlilik
  collocations:
  - text: loss of biodiversity
    tr: biyoçeşitlilik kaybı
  - text: preserve biodiversity
    tr: biyoçeşitliliği korumak
  - text: rich biodiversity
    tr: zengin biyoçeşitlilik
  examples:
  - en: Deforestation in tropical rainforests causes an irreversible loss of global biodiversity.
    tr: Tropikal yağmur ormanlarındaki ormansızlaşma küresel biyoçeşitlilikte geri döndürülemez bir kayba yol açar.
    context: Ecology
  - en: Establishing marine protected areas helps restore local biodiversity and fish populations.
    tr: Deniz koruma alanları oluşturmak yerel biyoçeşitliliği ve balık popülasyonlarını canlandırmaya yardımcı olur.
    context: Marine Conservation
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Biodiversity'' sayılamayan soyut bir isimdir; çoğul olarak ''biodiversities'' kullanımı nadirdir ve doğal
      İngilizcede genellikle tekil kullanılır.'
    incorrect_example: We must save many biodiversities in this forest.
    correct_example: We must preserve biodiversity in this forest ecosystem.
  register: formal
  topic_tags:
  - environment
  - ecology
  - nature
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.conservation
  headword: conservation
  cefr_level: B2
  part_of_speech: noun
  phonetic: /ˌkɒn.səˈveɪ.ʃən/
  audio_ref: null
  definition_en: The protection of plants, animals, natural resources, and historic buildings from damage or destruction.
  meaning_tr: koruma, muhafaza etme (doğa/tarih)
  collocations:
  - text: wildlife conservation
    tr: yaban hayatı koruma
  - text: environmental conservation
    tr: çevre koruma
  - text: water conservation
    tr: su tasarrufu / muhafazası
  examples:
  - en: Local communities are actively involved in wildlife conservation projects to protect endangered leopards.
    tr: Yerel topluluklar nesli tükenmekte olan leoparları korumak için yaban hayatı koruma projelerine aktif olarak katılıyor.
    context: Wildlife Protection
  - en: Implementing water conservation practices in agricultural irrigation prevents regional groundwater depletion.
    tr: Tarımsal sulamada su koruma uygulamalarını hayata geçirmek bölgesel yeraltı suyu tükenmesini önler.
    context: Resource Management
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Conservation'' (doğayı/kaynakları koruma) ile ''conversation'' (sohbet/konuşma) telaffuz ve yazılış olarak
      sıkça karıştırılır. /ˈkɒn.səˈveɪ.ʃən/ vs /ˌkɒn.vəˈseɪ.ʃən/.'
    incorrect_example: We had a long conservation about the quarterly budget.
    correct_example: We had a long conversation about wildlife conservation funding.
  register: formal
  topic_tags:
  - environment
  - protection
  - sustainability
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.contaminate
  headword: contaminate
  cefr_level: B2
  part_of_speech: verb
  phonetic: /kənˈtæm.ɪ.neɪt/
  audio_ref: null
  definition_en: To make something impure, poisonous, or polluted by adding an undesirable substance.
  meaning_tr: kirletmek, zehirlemek, bulaştırmak
  collocations:
  - text: contaminate water supplies
    tr: su kaynaklarını kirletmek
  - text: heavily contaminate
    tr: ağır derecede kirletmek
  - text: risk contaminating
    tr: kirletme riski taşımak
  examples:
  - en: Improper disposal of industrial chemical waste can contaminate freshwater rivers for decades.
    tr: Sanayi kimyasal atıklarının uygunsuz şekilde elden çıkarılması tatlı su nehirlerini onlarca yıl kirletebilir.
    context: Industrial Ecology
  - en: Emergency authorities warned residents not to consume municipal tap water contaminated by flood runoff.
    tr: Acil durum yetkilileri bölge sakinlerini taşkın sularıyla kirlenmiş belediye musluk suyunu tüketmemeleri konusunda
      uyardı.
    context: Public Health
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bir şeyle kirlenmek derken pasif yapıda 'contaminated with [substance]' veya 'by' kullanılır; 'to' denmez.
    incorrect_example: The soil was contaminated to heavy metals.
    correct_example: The soil was contaminated with heavy metals.
  register: formal
  topic_tags:
  - environment
  - pollution
  - hazards
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.renewable
  headword: renewable
  cefr_level: B2
  part_of_speech: adjective
  phonetic: /rɪˈnjuː.ə.bəl/
  audio_ref: null
  definition_en: Energy or natural resources that are not depleted when used, such as wind or solar power.
  meaning_tr: yenilenebilir (enerji/kaynak)
  collocations:
  - text: renewable energy
    tr: yenilenebilir enerji
  - text: renewable resources
    tr: yenilenebilir kaynaklar
  - text: transition to renewables
    tr: yenilenebilir enerjiye geçiş
  examples:
  - en: The government introduced tax incentives to encourage corporations to transition to renewable energy sources.
    tr: Hükümet, şirketlerin yenilenebilir enerji kaynaklarına geçişini teşvik etmek amacıyla vergi indirimleri sundu.
    context: Energy Transition
  - en: Wind and solar power currently represent the fastest-growing sectors in the renewable energy market.
    tr: Rüzgar ve güneş enerjisi şu anda yenilenebilir enerji pazarında en hızlı büyüyen sektörleri temsil ediyor.
    context: Clean Tech
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Renewable'' sıfattır; çoğul isim olarak ''renewables'' dendiğinde genel olarak yenilenebilir enerji kaynakları
      kastedilir.'
    incorrect_example: We must produce more renewable.
    correct_example: We must generate more renewable energy / invest heavily in renewables.
  register: formal
  topic_tags:
  - environment
  - energy
  - sustainability
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.curriculum
  headword: curriculum
  cefr_level: B2
  part_of_speech: noun
  phonetic: /kəˈrɪk.jə.ləm/
  audio_ref: null
  definition_en: The subjects comprising a course of study in a school, university, or training program.
  meaning_tr: müfredat, eğitim programı
  collocations:
  - text: school curriculum
    tr: okul müfredatı
  - text: design a curriculum
    tr: müfredat tasarlamak
  - text: core curriculum
    tr: temel / çekirdek müfredat
  examples:
  - en: The university updated its computer science curriculum to integrate modern cloud and machine learning courses.
    tr: Üniversite, modern bulut ve makine öğrenimi derslerini entegre etmek için bilgisayar mühendisliği müfredatını güncelledi.
    context: Higher Education
  - en: Critical thinking and digital literacy should form the core curriculum of modern primary education.
    tr: Eleştirel düşünme ve dijital okuryazarlık modern ilköğretimin çekirdek müfredatını oluşturmalıdır.
    context: Educational Policy
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: Latin kökenli tekil 'curriculum'un çoğulu 'curricula' veya 'curriculums' biçimindedir. 'Curriculum vitae'
      (CV) ile karıştırılsa da eğitim programı için sadece 'curriculum' denir.
    incorrect_example: Send your curriculum to human resources.
    correct_example: Send your CV to HR; the school is designing a new mathematics curriculum.
  register: formal
  topic_tags:
  - education
  - academic
  - learning
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.scholarship
  headword: scholarship
  cefr_level: B2
  part_of_speech: noun
  phonetic: /ˈskɒl.ə.ʃɪp/
  audio_ref: null
  definition_en: A grant or payment made to support a student's education, awarded on the basis of academic or other achievement.
  meaning_tr: burs, akademik öğrenim yardımı
  collocations:
  - text: win a scholarship
    tr: burs kazanmak
  - text: apply for a scholarship
    tr: bursa başvurmak
  - text: full scholarship
    tr: tam burs
  examples:
  - en: She was awarded a full scholarship to pursue her master's degree in artificial intelligence at Cambridge.
    tr: Cambridge'de yapay zeka alanında yüksek lisans yapmak üzere tam burs kazandı.
    context: Academic Funding
  - en: International tech foundations provide research scholarships for talented female engineers.
    tr: Uluslararası teknoloji vakıfları yetenekli kadın mühendisler için araştırma bursları sağlamaktadır.
    context: Philanthropy
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bursa başvururken 'apply for a scholarship' kullanılır; burs kazanırken 'win a scholarship' veya 'be awarded
      a scholarship' kalıbı geçerlidir.
    incorrect_example: He took a scholarship from the government.
    correct_example: He was awarded a prestigious government scholarship.
  register: formal
  topic_tags:
  - education
  - funding
  - university
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.compulsory
  headword: compulsory
  cefr_level: B2
  part_of_speech: adjective
  phonetic: /kəmˈpʌl.sər.i/
  audio_ref: null
  definition_en: Required by law or a rule; obligatory.
  meaning_tr: zorunlu, mecburî
  collocations:
  - text: compulsory education
    tr: zorunlu eğitim
  - text: compulsory course
    tr: zorunlu ders
  - text: make it compulsory
    tr: zorunlu kılmak
  examples:
  - en: Basic primary education is compulsory by law for all children until the age of sixteen.
    tr: Temel ilköğretim on altı yaşına kadar tüm çocuklar için kanunen zorunludur.
    context: Educational Law
  - en: Attending the information security workshop was compulsory for all newly hired software developers.
    tr: Bilgi güvenliği çalıştayına katılmak yeni işe alınan tüm yazılım geliştiriciler için zorunluydu.
    context: Corporate Compliance
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Compulsory'' kurallar gereği zorunlu olandır; ''optional'' (seçmeli) kelimesinin zıddıdır. İngiliz İngilizcesinde
      ''compulsory'' yaygındır, Amerikan İngilizcesinde ''mandatory'' sıklıkla tercih edilir.'
    incorrect_example: This lesson is forced for all students.
    correct_example: This course is compulsory for all undergraduate students.
  register: formal
  topic_tags:
  - education
  - rules
  - law
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.hypothesis
  headword: hypothesis
  cefr_level: B2
  part_of_speech: noun
  phonetic: /haɪˈpɒθ.ə.sɪs/
  audio_ref: null
  definition_en: A proposed explanation made on the basis of limited evidence as a starting point for further investigation.
  meaning_tr: hipotez, varsayım
  collocations:
  - text: test a hypothesis
    tr: hipotezi test etmek
  - text: formulate a hypothesis
    tr: hipotez oluşturmak
  - text: confirm a hypothesis
    tr: hipotezi doğrulamak
  examples:
  - en: The research team formulated a bold hypothesis regarding the cellular impact of intermittent fasting.
    tr: Araştırma ekibi aralıklı orucun hücresel etkisine ilişkin cesur bir hipotez ortaya koydu.
    context: Biomedical Research
  - en: Before writing production code, product managers run A/B experiments to test their behavioral hypotheses.
    tr: Canlıya kod yazmadan önce ürün yöneticileri davranışsal hipotezlerini test etmek için A/B deneyleri yürütür.
    context: Product Testing
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: Tekil hali 'hypothesis' (/haɪˈpɒθ.ə.sɪs/), çoğulu ise 'hypotheses' (/haɪˈpɒθ.ə.siːz/) biçimindedir. Düzensiz
      çoğul telaffuzuna dikkat edilmelidir.
    incorrect_example: We evaluated three hypothesises in the lab.
    correct_example: We evaluated three distinct hypotheses in the laboratory.
  register: academic
  topic_tags:
