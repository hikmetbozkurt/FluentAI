- id: vocab.reciprocity
  headword: reciprocity
  cefr_level: C1
  part_of_speech: noun
  phonetic: /ˌres.ɪˈprɒs.ə.ti/
  audio_ref: null
  definition_en: The practice of exchanging things with others for mutual benefit, especially privileges granted by one country
    or organization to another.
  meaning_tr: karşılıklılık, mütekabiliyet
  collocations:
  - text: principle of reciprocity
    tr: mütekabiliyet / karşılıklılık ilkesi
  - text: mutual reciprocity
    tr: karşılıklı menfaat değişimi
  - text: diplomatic reciprocity
    tr: diplomatik mütekabiliyet
  examples:
