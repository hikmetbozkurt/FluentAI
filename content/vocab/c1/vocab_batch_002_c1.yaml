  - text: state succinctly
    tr: özlü bir şekilde belirtmek
  - text: explain succinctly
    tr: kısa ve net açıklamak
  examples:
  - en: The executive summary succinctly encapsulated the complex five-hundred-page technical feasibility study.
    tr: Yönetici özeti beş yüz sayfalık karmaşık teknik fizibilite çalışmasını kısa ve öz olarak özetledi.
    context: Executive Reporting
  - en: During sprint demos, engineers should be able to explain architectural trade-offs succinctly to non-technical partners.
    tr: Sprint tanıtımlarında mühendisler mimari ödünleşimleri teknik olmayan ortaklara kısa ve net olarak açıklayabilmelidir.
    context: Agile Demos
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Succinct'' sıfattır; ''succinctly'' zarftır. ''Briefly'' günlük dildedir; ''succinctly'' ise az sözle
      çok şey anlatma ustalığını belirtir.'
    incorrect_example: He spoke succinct during the board presentation.
    correct_example: He summarized the quarterly revenue risks succinctly.
  register: formal
  topic_tags:
  - communication
  - brevity
  - clarity
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.attrition
  headword: attrition
  cefr_level: C1
  part_of_speech: noun
  phonetic: /əˈtrɪʃ.ən/
  audio_ref: null
  definition_en: The gradual reduction of a workforce through retirement, resignation, or sickness, without immediate replacement.
  meaning_tr: personel kaybı / azalması (emeklilik/istifa ile); yıpranma
  collocations:
  - text: employee attrition
    tr: çalışan sirkülasyonu / kaybı
  - text: high attrition rate
    tr: yüksek personel kaybı oranı
  - text: reduce attrition
    tr: personel kaybını azaltmak
  examples:
  - en: Improving corporate workplace flexibility and mentorship significantly curtailed annual employee attrition rates.
    tr: Kurumsal iş yeri esnekliğini ve mentorluğu geliştirmek yıllık çalışan kaybı oranlarını belirgin şekilde düşürdü.
    context: Human Resources
  - en: The technology consulting firm managed headcount reductions primarily through natural retirement attrition rather
      than layoffs.
    tr: Teknoloji danışmanlık firması çalışan sayısı azaltımını işten çıkarma yerine öncelikle doğal emeklilik ayrılmaları
      yoluyla yönetti.
    context: Corporate Strategy
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Attrition'' insan kaynaklarında çalışanların kendiliğinden ayrılmasıyla kadronun erimesidir; işten zorunlu
      çıkarma için ''layoff'' veya ''redundancy'' denir.'
    incorrect_example: The company fired ten workers by attrition.
    correct_example: The company reduced its operational budget through voluntary attrition.
  register: business
  topic_tags:
  - work-career
  - human-resources
  - headcount
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.spearhead
  headword: spearhead
  cefr_level: C1
  part_of_speech: verb
  phonetic: /ˈspɪə.hed/
  audio_ref: null
  definition_en: To lead or be the primary driving force behind an attack, movement, campaign, or initiative.
  meaning_tr: öncülük etmek, başını çekmek, liderliğini yapmak
  collocations:
  - text: spearhead an initiative
    tr: bir girişime öncülük etmek
  - text: spearhead a project
    tr: bir projenin başını çekmek
  - text: spearhead digital transformation
    tr: dijital dönüşüme öncülük etmek
  examples:
  - en: The newly appointed chief technology officer was recruited to spearhead our international cloud migration initiative.
    tr: Yeni atanan teknoloji direktörü uluslararası buluta geçiş girişimimize öncülük etmesi için işe alındı.
    context: Executive Leadership
  - en: Senior engineers spearhead internal knowledge-sharing workshops to foster clean architectural practices across squads.
    tr: Kıdemli mühendisler ekipler genelinde temiz mimari uygulamalarını teşvik etmek için şirket içi bilgi paylaşım çalıştaylarına
      öncülük eder.
    context: Engineering Culture
  turkish_traps:
  - trap_type: literal_translation
    trap_note_tr: '''Spearhead'' mızrak ucu demektir; iş dünyasında bir projeye liderlik etmek veya öncüsü olmak anlamında
      son derece güçlü bir CV eylem fiilidir.'
    incorrect_example: I was the head of spear in the migration project.
    correct_example: I spearhead the architectural redesign of the core payment service.
  register: business
  topic_tags:
  - work-career
  - leadership
  - initiatives
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.autonomous
  headword: autonomous
  cefr_level: C1
  part_of_speech: adjective
  phonetic: /ɔːˈtɒn.ə.məs/
  audio_ref: null
  definition_en: Having the freedom to act independently and exercise self-governance; or operating without direct human control.
  meaning_tr: özerk, otonom, bağımsız hareket edebilen
  collocations:
  - text: autonomous team
    tr: özerk ekip
  - text: autonomous vehicle
    tr: otonom araç
  - text: autonomous decision-making
    tr: bağımsız karar alma
  examples:
  - en: High-performing modern software organizations empower autonomous cross-functional teams to own their deployment pipelines.
    tr: Yüksek performanslı modern yazılım organizasyonları dağıtım süreçlerini sahiplenmeleri için özerk çapraz fonksiyonlu
      ekipleri yetkilendirir.
    context: Agile Organizations
  - en: Developing fully autonomous driving systems demands ultra-reliable computer vision and sub-millisecond sensor latency.
    tr: Tamamen otonom sürüş sistemleri geliştirmek son derece güvenilir bilgisayarlı görü ve milisaniyenin altında sensör
      gecikmesi gerektirir.
    context: Autonomous Systems
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Autonomous'' hem teknik olarak insansız/otonom çalışan cihazlar hem de iş hayatında kendi kararlarını
      kendi veren özerk çalışanlar/ekipler için kullanılır.'
    incorrect_example: Our developers are auto-working without managers.
    correct_example: Our developers work in autonomous squads with high strategic freedom.
  register: formal
  topic_tags:
  - work-career
  - technology
  - organization
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.solvency
  headword: solvency
  cefr_level: C1
  part_of_speech: noun
  phonetic: /ˈsɒl.vən.si/
  audio_ref: null
  definition_en: The ability of an enterprise or individual to meet long-term financial obligations and pay all debts.
  meaning_tr: ödeme gücü, borç ödeme yeterliliği
  collocations:
  - text: maintain solvency
    tr: ödeme gücünü korumak
  - text: solvency ratio
    tr: borç ödeme yeterlilik oranı
  - text: threaten solvency
    tr: ödeme yeterliliğini tehdit etmek
  examples:
  - en: Central banking regulators mandate strict capital buffer reserves to preserve commercial banking solvency during economic
      panics.
    tr: Merkez bankası düzenleyicileri ekonomik panikler sırasında ticari bankaların ödeme gücünü korumak için katı sermaye
      tamponu karşılıkları zorunlu kılar.
    context: Financial Regulation
  - en: The prolonged cash burn rate raised grave concerns among venture investors regarding the startup's long-term solvency.
    tr: Uzun süren nakit yakma oranı girişim yatırımcıları arasında girişimin uzun vadeli ödeme yeterliliğine ilişkin ciddi
      endişeler uyandırdı.
    context: Venture Finance
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Solvency'' uzun vadeli borç ödeyebilme kabiliyetidir (zıddı ''insolvency/iflas''). Kısa vadeli nakit
      ödeme yeteneği için ise ''liquidity'' terimi kullanılır.'
    incorrect_example: The company has good solving capacity.
    correct_example: The company proved its financial solvency by maintaining healthy assets-to-debt ratios.
  register: business
  topic_tags:
  - business
  - finance
  - accounting
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.monopoly
  headword: monopoly
  cefr_level: C1
  part_of_speech: noun
  phonetic: /məˈnɒp.əl.i/
  audio_ref: null
  definition_en: The exclusive possession or control of the supply of or trade in a commodity or service.
  meaning_tr: tekel, monopol
  collocations:
  - text: state monopoly
    tr: devlet tekeli
  - text: hold a monopoly
    tr: tekele sahip olmak
  - text: break a monopoly
    tr: tekeli kırmak
  examples:
  - en: Antitrust competition authorities investigated whether the dominant tech platform was misusing its monopoly in app
      distribution.
    tr: Antitröst rekabet otoriteleri hakim teknoloji platformunun uygulama dağıtımındaki tekelini kötüye kullanıp kullanmadığını
      soruşturdu.
    context: Antitrust Law
  - en: Breaking up telecommunication monopolies ushered in a wave of competitive private internet service providers.
    tr: Telekomünikasyon tekellerinin kırılması rekabetçi özel internet servis sağlayıcıları dalgası başlattı.
    context: Market Deregulation
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bir sektör veya pazar üzerinde tekel kurmak derken 'monopoly on [market]' veya 'monopoly over' kullanılır;
      'in' de kabul görür.
    incorrect_example: The company has a monopoly for railway transport.
    correct_example: The company holds a monopoly on passenger railway transportation.
  register: formal
  topic_tags:
  - business
  - economics
  - markets
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.liquidate
  headword: liquidate
  cefr_level: C1
  part_of_speech: verb
  phonetic: /ˈlɪk.wɪ.deɪt/
  audio_ref: null
  definition_en: To wind up the affairs of a company or firm by ascertaining liabilities and converting assets into cash.
  meaning_tr: tasfiye etmek, nakde çevirmek
  collocations:
  - text: liquidate assets
    tr: varlıkları nakde çevirmek
  - text: forced to liquidate
    tr: tasfiye etmek zorunda kalmak
  - text: liquidate a company
    tr: şirketi tasfiye etmek
  examples:
  - en: Unable to secure emergency refinancing, the retail chain was forced by creditors to liquidate its nationwide inventory.
    tr: Acil durum yeniden finansmanı sağlayamayan perakende zinciri alacaklılar tarafından ülke çapındaki envanterini nakde
      çevirmeye zorlandı.
    context: Corporate Restructuring
  - en: In times of acute market distress, hedge funds often liquidate profitable equity positions to raise cash.
    tr: Şiddetli piyasa sıkıntısı zamanlarında koruma fonları nakit oluşturmak için genellikle kârlı hisse senedi pozisyonlarını
      nakde çevirir.
    context: Asset Management
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Liquidate'' sıvılaştırmak değildir; finans ve hukukta varlıkları satıp nakde çevirmek veya borçları ödemek
      için şirketi kapatıp tasfiye etmektir.'
    incorrect_example: We made water our company assets.
    correct_example: The bankruptcy court appointed an administrator to liquidate remaining corporate assets.
  register: formal
  topic_tags:
  - business
  - finance
  - bankruptcy
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.fiscal
  headword: fiscal
  cefr_level: C1
  part_of_speech: adjective
  phonetic: /ˈfɪs.kəl/
  audio_ref: null
  definition_en: Relating to government revenue, especially taxes, or corporate financial accounting years.
  meaning_tr: mali, maliye ile ilgili, bütçesel
  collocations:
  - text: fiscal year
    tr: mali yıl
  - text: fiscal policy
    tr: maliye politikası
  - text: fiscal deficit
    tr: bütçe / mali açık
  examples:
  - en: The multinational technology conglomerate reported record cloud infrastructure earnings for the current fiscal year.
    tr: Çok uluslu teknoloji holdingi mevcut mali yıl için rekor bulut altyapısı kazancı bildirdi.
    context: Corporate Earnings
  - en: Governments implement counter-cyclical fiscal policy by expanding public infrastructure investment during economic
      downturns.
    tr: Hükümetler ekonomik gerileme dönemlerinde kamu altyapı yatırımlarını genişleterek konjonktür karşıtı maliye politikası
      uygularlar.
    context: Macroeconomics
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Fiscal'' vergi ve hükümet bütçesiyle veya şirketlerin mali yılıyla (''fiscal year'' / FY) ilgilidir;
      ''monetary'' ise para basımı ve faiz politikasıyla ilgilidir.'
    incorrect_example: The central bank decided the fiscal interest rates.
    correct_example: The government announced its annual fiscal budget, while the central bank handled monetary policy.
  register: formal
  topic_tags:
  - business
  - finance
  - economics
  related_ids: []
  status: APPROVED
  version: 1
