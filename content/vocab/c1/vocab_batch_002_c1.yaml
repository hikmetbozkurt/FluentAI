- id: vocab.longevity
  headword: longevity
  cefr_level: C1
  part_of_speech: noun
  phonetic: /lɒnˈdʒev.ə.ti/
  audio_ref: null
  definition_en: Long life, existence, or service; the capability to survive or remain functional over an extended duration.
  meaning_tr: uzun ömürlülük, uzun yaşam
  collocations:
  - text: promote longevity
    tr: uzun ömrü teşvik etmek
  - text: career longevity
    tr: kariyer kalıcılığı / uzunluğu
  - text: exceptional longevity
    tr: olağanüstü uzun ömürlülük
  examples:
  - en: Epidemiological studies indicate that regular caloric restriction and low-stress environments correlate with human
      longevity.
    tr: Epidemiyolojik çalışmalar, düzenli kalori kısıtlamasının ve düşük stresli ortamların insan ömrünün uzunluğu ile ilişkili
      olduğunu göstermektedir.
    context: Public Health
  - en: Investing in continuous professional development is vital for sustaining career longevity in rapidly changing industries.
    tr: Sürekli mesleki gelişime yatırım yapmak, hızla değişen sektörlerde kariyer kalıcılığını sürdürmek için hayati önem
      taşır.
    context: Career Strategy
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Longevity'' sadece biyolojik uzun yaşamı değil, ürünlerin veya kariyerlerin dayanıklılığını ve uzun ömürlülüğünü
      de ifade eder. ''Long life''tan daha formeldir.'
    incorrect_example: The long-livedness of this material is high.
    correct_example: Engineers tested the thermal longevity of the battery system.
  register: formal
  topic_tags:
  - health
  - aging
  - wellbeing
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.predisposition
  headword: predisposition
  cefr_level: C1
  part_of_speech: noun
  phonetic: /ˌpriː.dɪs.pəˈzɪʃ.ən/
  audio_ref: null
  definition_en: A liability or tendency to suffer from a particular medical condition or to act in a certain way.
  meaning_tr: yatkınlık, genetik/biyolojik eğilim
  collocations:
  - text: genetic predisposition
    tr: genetik yatkınlık
  - text: predisposition to disease
    tr: hastalığa yatkınlık
  - text: inherent predisposition
    tr: doğuştan gelen eğilim
  examples:
  - en: A genetic predisposition to hypertension does not guarantee disease if healthy dietary habits are maintained.
    tr: Hipertansiyona yönelik genetik bir yatkınlık, sağlıklı beslenme alışkanlıkları sürdürüldüğü takdirde hastalığı kesin
      kılmaz.
    context: Genomics
  - en: Understanding a patient's hereditary predisposition allows physicians to design proactive prevention plans.
    tr: Bir hastanın kalıtsal yatkınlığını anlamak hekimlerin proaktif önleme planları tasarlamasına olanak tanır.
    context: Clinical Genetics
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bir duruma veya hastalığa yatkınlık derken 'predisposition to' veya 'predisposition toward' kullanılır;
      'against' veya 'for' denmez.
    incorrect_example: He has a strong predisposition for respiratory infections.
    correct_example: He has a genetic predisposition to respiratory infections.
  register: formal
  topic_tags:
  - health
  - genetics
  - medicine
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.debilitate
  headword: debilitate
  cefr_level: C1
  part_of_speech: verb
  phonetic: /dɪˈbɪl.ɪ.teɪt/
  audio_ref: null
  definition_en: To make someone or something very weak, infirm, or severely impaired.
  meaning_tr: güçten düşürmek, takatsiz bırakmak, felce uğratmak
  collocations:
  - text: debilitating illness
    tr: güçten düşüren hastalık
  - text: severely debilitate
    tr: ağır şekilde takatsiz bırakmak
  - text: debilitate the system
    tr: sistemi zayıflatmak / felce uğratmak
  examples:
  - en: Chronic autoimmune diseases can gradually debilitate patients if appropriate immunosuppressive therapy is delayed.
    tr: Kronik otoimmün hastalıklar, uygun bağışıklık baskılayıcı tedavi geciktirilirse hastaları kademeli olarak güçten düşürebilir.
    context: Clinical Medicine
  - en: Prolonged bureaucratic delays have the power to debilitate promising startup initiatives.
    tr: Uzun süren bürokratik gecikmeler umut vadeden girişimcilik projelerini felce uğratma gücüne sahiptir.
    context: Business Metaphor
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: Fiil 'debilitate'dir; sıfat hali olan 'debilitating' ('debilitating disease/condition') akademik ve tıbbi
      metinlerde son derece yaygındır.
    incorrect_example: The disease was very debilitate.
    correct_example: The patient suffered from a severely debilitating neurological condition.
  register: formal
  topic_tags:
  - health
  - pathology
  - conditions
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.aggravate
  headword: aggravate
  cefr_level: C1
  part_of_speech: verb
  phonetic: /ˈæɡ.rə.veɪt/
  audio_ref: null
  definition_en: To make a disease, injury, or problematic situation worse or more severe.
  meaning_tr: kötüleştirmek, ağırlaştırmak, alevlendirmek
  collocations:
  - text: aggravate the condition
    tr: durumu kötüleştirmek
  - text: aggravate an injury
    tr: sakatlığı azdırmak / ağırlaştırmak
  - text: aggravate tensions
    tr: gerginlikleri tırmandırmak
  examples:
  - en: Returning to high-impact distance running too quickly will inevitably aggravate your healing tendon sprain.
    tr: Yüksek tempolu uzun mesafe koşusuna çok hızlı dönmek iyileşmekte olan tendon burkulmanızı kaçınılmaz olarak kötüleştirecektir.
    context: Physical Therapy
  - en: Hostile public statements during negotiations will only serve to aggravate bilateral diplomatic friction.
    tr: Müzakereler sırasındaki düşmanca kamuoyu açıklamaları yalnızca ikili diplomatik sürtüşmeyi tırmandırmaya yarayacaktır.
    context: Diplomacy
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Aggravate'' formel bağlamda ''bir durumu veya hastalığı kötüleştirmek'' demektir; gayriresmi İngilizcede
      ''sinir etmek/kızdırmak'' anlamına gelse de C1 seviyesinde öncelikle ''worsen'' manasıyla bilinmelidir.'
    incorrect_example: The medicine aggravated his health to good.
    correct_example: Skipping rest days aggravated his chronic lower back injury.
  register: formal
  topic_tags:
  - health
  - pathology
  - deterioration
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.counteract
  headword: counteract
  cefr_level: C1
  part_of_speech: verb
  phonetic: /ˌkaʊn.tərˈækt/
  audio_ref: null
  definition_en: To act against something in order to reduce its force or neutralize its negative effects.
  meaning_tr: etkisini azaltmak, dengelemek, nötralize etmek
  collocations:
  - text: counteract the effects
    tr: etkileri dengelemek / nötralize etmek
  - text: counteract fatigue
    tr: yorgunluğu gidermek / karşı koymak
  - text: counteract inflation
    tr: enflasyonu dengelemek
  examples:
  - en: Consuming antioxidant-rich foods helps cellular mechanisms counteract oxidative biological stress.
    tr: Antioksidan açısından zengin besinler tüketmek hücresel mekanizmaların oksidatif biyolojik stresi nötralize etmesine
      yardımcı olur.
    context: Nutritional Biochemistry
  - en: Central banks elevated base interest rates aggressively to counteract surging inflationary pressures.
    tr: Merkez bankaları tırmanan enflasyonist baskıları dengelemek için gösterge faiz oranlarını agresif şekilde yükseltti.
    context: Monetary Policy
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: '''Counteract'' fiili doğrudan nesne alır; ''counteract against'' denmez.'
    incorrect_example: We designed this policy to counteract against the currency decline.
    correct_example: We designed this policy to counteract the currency decline.
  register: formal
  topic_tags:
  - health
  - science
  - neutralization
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.recuperate
  headword: recuperate
  cefr_level: C1
  part_of_speech: verb
  phonetic: /rɪˈkuː.pər.eɪt/
  audio_ref: null
  definition_en: To recover from illness, exhaustion, or physical exertion through rest and careful restoration.
  meaning_tr: toparlanmak, kendini toplamak, nekahat döneminde iyileşmek
  collocations:
  - text: recuperate at home
    tr: evde istirahat edip toparlanmak
  - text: time to recuperate
    tr: toparlanma zamanı
  - text: fully recuperate
    tr: tamamen kendini toplamak
  examples:
  - en: Following complex spinal surgery, the executive retreated to the countryside to recuperate in quiet surroundings.
    tr: Karmaşık omurga ameliyatının ardından yönetici sessiz bir ortamda toparlanmak için kırsala çekildi.
    context: Post-surgical Care
  - en: Elite endurance cyclists take deliberate recovery weeks to allow their nervous systems to recuperate.
    tr: Seçkin dayanıklılık bisikletçileri sinir sistemlerinin toparlanmasını sağlamak için kasıtlı dinlenme haftaları ayırır.
    context: Athletic Science
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bir hastalıktan toparlanırken 'recuperate from' kalıbı kullanılır; 'recover'a kıyasla daha çok dinlenme
      ve istirahat sürecini vurgular.
    incorrect_example: He spent two months recuperating of the surgery.
    correct_example: He spent two months recuperating from the surgery.
  register: formal
  topic_tags:
  - health
  - recovery
  - rest
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.deleterious
  headword: deleterious
  cefr_level: C1
  part_of_speech: adjective
  phonetic: /ˌdel.ɪˈtɪə.ri.əs/
  audio_ref: null
  definition_en: Causing serious harm, damage, or detriment to health, progress, or wellbeing.
  meaning_tr: zararlı, tahrip edici, hasar verici
  collocations:
  - text: deleterious effect
    tr: zararlı / tahrip edici etki
  - text: deleterious to health
    tr: sağlığa zararlı
  - text: deleterious impact
    tr: hasar verici darbe / tesir
  examples:
  - en: Prolonged exposure to fine particulate matter in polluted air has a deleterious effect on pulmonary capacity.
    tr: Kirli havadaki ince partikül maddelere uzun süre maruz kalmak akciğer kapasitesi üzerinde zararlı bir etkiye sahiptir.
    context: Environmental Health
  - en: High executive turnover exerts a deleterious impact on corporate strategic continuity.
    tr: Üst düzey yönetici sirkülasyonunun yüksek olması kurumsal stratejik süreklilik üzerinde hasar verici bir tesir yaratır.
    context: Corporate Analysis
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bir şeye zarar vermek derken 'deleterious to [something]' yapısı kullanılır; 'for' veya 'against' denmez.
    incorrect_example: Smoking is deleterious for your lungs.
    correct_example: Smoking is deeply deleterious to cardiovascular health.
  register: academic
  topic_tags:
  - health
  - pathology
  - risk
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.holistic
  headword: holistic
  cefr_level: C1
  part_of_speech: adjective
  phonetic: /həʊˈlɪs.tɪk/
  audio_ref: null
  definition_en: Characterized by the treatment of the whole person, taking into account mental and social factors rather
    than just symptoms.
  meaning_tr: bütüncül, holistik
  collocations:
  - text: holistic approach
    tr: bütüncül yaklaşım
  - text: holistic healthcare
    tr: bütüncül sağlık hizmeti
  - text: holistic view
    tr: bütünsel bakış açısı
  examples:
  - en: Modern preventative medicine adopts a holistic approach that integrates nutrition, sleep, and emotional wellbeing.
    tr: Modern koruyucu hekimlik beslenme, uyku ve duygusal sağlığı entegre eden bütüncül bir yaklaşımı benimser.
    context: Integrative Health
  - en: Architects must take a holistic view of urban spaces to balance commercial vitality with ecological green corridors.
    tr: Mimarlar ticari canlılığı ekolojik yeşil koridorlarla dengelemek için kentsel alanlara bütüncül bir bakış açısıyla
      yaklaşmalıdır.
    context: Urban Design
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Holistic'' (bütüncül) kelimesi ''holy'' (kutsal) ile ilgili değildir; Yunanca ''holos'' (bütün) kökünden
      gelir. Sistemin parçalarını değil bütününü ele almayı vurgular.'
    incorrect_example: We need a sacred solution for this medical dilemma.
    correct_example: We need a comprehensive and holistic approach to healthcare reform.
  register: formal
  topic_tags:
  - health
  - methodology
  - wellness
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.depletion
  headword: depletion
  cefr_level: C1
  part_of_speech: noun
  phonetic: /dɪˈpliː.ʃən/
  audio_ref: null
  definition_en: Reduction in the number or quantity of something, especially natural resources or vital reserves.
  meaning_tr: tükenme, azalma, eksilme (kaynaklarda)
  collocations:
  - text: ozone layer depletion
    tr: ozon tabakası incelmesi / tükenmesi
  - text: resource depletion
    tr: kaynak tükenmesi
  - text: groundwater depletion
    tr: yeraltı suyu tükenmesi
  examples:
  - en: Over-extraction of subterranean aquifers has caused catastrophic groundwater depletion in agricultural river basins.
    tr: Yeraltı akiferlerinin aşırı çekilmesi tarımsal nehir havzalarında yıkıcı bir yeraltı suyu tükenmesine neden oldu.
    context: Hydrogeology
  - en: International environmental treaties were established to arrest the rapid depletion of critical fish stocks.
    tr: Kritik balık stoklarının hızlı tükenmesini durdurmak amacıyla uluslararası çevre anlaşmaları tesis edildi.
    context: Marine Law
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Deplete'' fiildir (tüketmek/azaltmak); ''depletion'' ise tükenme sürecini belirten soyut isimdir. ''Depletion
      of resources'' kalıbı standarttır.'
    incorrect_example: The finish of oil reserves will happen soon.
    correct_example: The rapid depletion of non-renewable fossil fuel reserves accelerates the energy transition.
  register: formal
  topic_tags:
  - environment
  - resources
  - ecology
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.afforestation
  headword: afforestation
  cefr_level: C1
  part_of_speech: noun
  phonetic: /æfˌɒr.ɪˈsteɪ.ʃən/
  audio_ref: null
  definition_en: The establishment of a forest or stand of trees in an area where there was no previous tree cover.
  meaning_tr: ağaçlandırma (önceden orman olmayan yeri)
  collocations:
  - text: large-scale afforestation
    tr: büyük ölçekli ağaçlandırma
  - text: afforestation projects
    tr: ağaçlandırma projeleri
  - text: afforestation for carbon capture
    tr: karbon tutumu için ağaçlandırma
  examples:
  - en: Massive governmental afforestation campaigns across semi-arid regions act as protective green barriers against desertification.
    tr: Yarı kurak bölgelerdeki büyük ölçekli hükümet ağaçlandırma kampanyaları çölleşmeye karşı koruyucu yeşil bariyerler
      görevi görür.
    context: Land Management
  - en: Corporate carbon offset programs increasingly fund scientific afforestation using native, climate-resilient tree species.
    tr: Kurumsal karbon dengeleme programları yerli ve iklime dayanıklı ağaç türlerini kullanan bilimsel ağaçlandırmayı giderek
      daha fazla finanse ediyor.
    context: Carbon Offsetting
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Afforestation'' önceden orman olmayan çıplak alana orman kurmaktır; yok olan ormanı yeniden dikmek için
      ise ''reforestation'' kullanılır.'
    incorrect_example: We made reforestation on the newly dried lakebed.
    correct_example: Scientists initiated an afforestation project on the barren plateau.
  register: academic
  topic_tags:
  - environment
  - forestry
  - climate-action
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.degrade
  headword: degrade
  cefr_level: C1
  part_of_speech: verb
  phonetic: /dɪˈɡreɪd/
  audio_ref: null
  definition_en: To deteriorate and break down chemically or physically; or to lower the quality or status of something.
  meaning_tr: bozulmak, ayrışmak; niteliğini düşürmek
  collocations:
  - text: degrade over time
    tr: zamanla bozulmak / ayrışmak
  - text: degrade the soil
    tr: toprağın kalitesini bozmak
  - text: slowly degrade
    tr: yavaşça ayrışmak
  examples:
  - en: Single-use petroleum-based plastics require hundreds of years to degrade fully in natural ocean ecosystems.
    tr: Tek kullanımlık petrol bazlı plastiklerin doğal okyanus ekosistemlerinde tamamen ayrışması yüzlerce yıl sürer.
    context: Environmental Science
  - en: Intensive agricultural pesticide use can severely degrade soil fertility and beneficial microbial communities.
    tr: Yoğun tarımsal tarım ilacı kullanımı toprak verimliliğini ve faydalı mikrobiyal toplulukları ciddi şekilde bozabilir.
    context: Soil Ecology
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: '''Degrade'' fiziksel ve kimyasal bozulmadır (''biodegradable'' buradan türemiştir); insani bağlamda ise
      ''itibarını düşürmek/küçük düşürmek'' anlamında da kullanılır.'
    incorrect_example: Plastic breaks itself in the soil.
    correct_example: Standard plastics do not degrade naturally under environmental conditions.
  register: academic
  topic_tags:
  - environment
  - materials
  - chemistry
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.curb-v
  headword: curb
  cefr_level: C1
  part_of_speech: verb
  phonetic: /kɜːb/
  audio_ref: null
  definition_en: To restrain or keep in check; to limit the growth or spread of something unwanted.
  meaning_tr: dizginlemek, frenlemek, sınırlandırmak
  collocations:
  - text: curb emissions
    tr: emisyonları dizginlemek
  - text: curb inflation
    tr: enflasyonu frenlemek
  - text: efforts to curb
    tr: dizginleme / sınırlama çabaları
  examples:
  - en: International climate agreements obligate industrialized nations to curb carbon emissions by 2030.
    tr: Uluslararası iklim anlaşmaları sanayileşmiş ulusları 2030 yılına kadar karbon salınımını dizginlemekle yükümlü kılar.
    context: Climate Policy
  - en: To maintain corporate solvency, executive leadership introduced strict travel guidelines to curb operating expenses.
    tr: Kurumsal ödeme gücünü korumak için üst yönetim işletme giderlerini frenlemek amacıyla katı seyahat kuralları getirdi.
    context: Cost Control
  turkish_traps:
  - trap_type: false_friend
    trap_note_tr: '''Curb'' fiil olarak ''dizginlemek/kısıtlamak''tır; isim olarak ise sokaktaki ''kaldırım kenarı/bordür
      taşı'' anlamına da gelir. İki anlam bağlama göre ayrılmalıdır.'
    incorrect_example: We must curb down the emissions.
    correct_example: We must introduce aggressive measures to curb emissions.
  register: formal
  topic_tags:
  - environment
  - policy
  - restraint
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.clean-up
  headword: clean up
  cefr_level: C1
  part_of_speech: phrasal_verb
  phonetic: /kliːn ʌp/
  audio_ref: null
  definition_en: To remove dirt, pollution, or hazards from a physical environment; or to eliminate corruption and malpractice.
  meaning_tr: çevre kirliliğini temizlemek, ıslah etmek; yolsuzluğu temizlemek
  collocations:
  - text: clean up toxic waste
    tr: zehirli atıkları temizlemek
  - text: clean up the coast
    tr: sahili temizlemek
  - text: environmental clean-up
    tr: çevresel temizlik / ıslah
  examples:
  - en: Volunteer marine divers partnered with maritime authorities to clean up submerged ghost fishing nets from coral reefs.
    tr: Gönüllü dalgıçlar mercan resiflerindeki batık hayalet balık ağlarını temizlemek için denizcilik yetkilileriyle ortaklık
      kurdu.
    context: Ocean Remediation
  - en: The industrial conglomerate was legally compelled to clean up hazardous chemical runoff surrounding the decommissioned
      plant.
    tr: Sanayi holdingi kapatılan tesisin çevresindeki tehlikeli kimyasal sızıntıyı temizlemekle yasal olarak yükümlü kılındı.
    context: Environmental Remediation
  turkish_traps:
  - trap_type: part_of_speech_confusion
    trap_note_tr: 'Ayrı yazıldığında fiildir (''clean up the river''); tire ile yazıldığında ise isimdir: ''a multi-million-dollar
      clean-up operation''.'
    incorrect_example: The government launched a big clean up operation yesterday.
    correct_example: The government launched an ambitious environmental clean-up operation yesterday.
  register: general
  topic_tags:
  - environment
  - remediation
  - ecology
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.perilous
  headword: perilous
  cefr_level: C1
  part_of_speech: adjective
  phonetic: /ˈper.əl.əs/
  audio_ref: null
  definition_en: Full of severe danger or extreme risk.
  meaning_tr: tehlikelerle dolu, son derece riskli, vahim
  collocations:
  - text: perilous journey
    tr: tehlikeli yolculuk
  - text: perilous situation
    tr: vahim / riskli durum
  - text: perilous state
    tr: tehlikeli vaziyet
  examples:
  - en: Rising sea levels and intensified storm surges place coastal mangrove ecosystems in a perilous state.
    tr: Yükselen deniz seviyeleri ve şiddetlenen fırtına kabarmaları kıyı mangrov ekosistemlerini son derece tehlikeli bir
      duruma sokuyor.
    context: Climate Risk
  - en: Navigating the Arctic shipping route without reinforced icebreaking vessels is considered exceedingly perilous.
    tr: Takviyeli buz kıran gemiler olmadan Arktik nakliye rotasında seyretmek son derece tehlikeli kabul edilir.
    context: Maritime Safety
  turkish_traps:
  - trap_type: register_mismatch
    trap_note_tr: '''Dangerous'' günlük dildeki genel tehlikedir; ''perilous'' ise felaket veya ölüm getirebilecek büyük tehlike
      ve riskleri anlatan yüksek seviyeli sıfattır.'
    incorrect_example: Crossing the red light is very perilous for cars.
    correct_example: Melting polar glaciers leave fragile wildlife in a perilous ecological state.
  register: formal
  topic_tags:
  - environment
  - risk
  - danger
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.ecologically
  headword: ecologically
  cefr_level: C1
  part_of_speech: adverb
  phonetic: /ˌiː.kəˈlɒdʒ.ɪ.kəl.i/
  audio_ref: null
