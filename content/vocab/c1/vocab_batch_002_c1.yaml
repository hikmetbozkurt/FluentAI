    tr: Sağlıklı uzun vadeli mesleki ortaklıklar gerçek bir karşılıklılık ve şeffaf değer paylaşımına dayanır.
    context: Strategic Alliances
  - en: Under international diplomatic reciprocity, visa exemptions granted by one state are mirrored by the other.
