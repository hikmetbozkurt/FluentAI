- id: vocab.prevent
  headword: prevent
  cefr_level: B1
  part_of_speech: verb
  phonetic: /prɪˈvent/
  audio_ref: null
  definition_en: To stop something bad or undesirable from happening or stop someone from doing something.
  meaning_tr: önlemek, engellemek
  collocations:
  - text: prevent disease
    tr: hastalığı önlemek
  - text: prevent from happening
    tr: gerçekleşmesini engellemek
  - text: preventive measures
    tr: önleyici tedbirler
  examples:
