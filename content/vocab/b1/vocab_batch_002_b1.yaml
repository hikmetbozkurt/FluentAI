- id: vocab.symptom
  headword: symptom
  cefr_level: B1
  part_of_speech: noun
  phonetic: /ˈsɪmp.təm/
  audio_ref: null
  definition_en: A physical or mental sign indicating the presence of an illness or health disorder.
  meaning_tr: belirti, semptom
  collocations:
  - text: common symptom
    tr: yaygın belirti
  - text: show symptoms
    tr: belirti göstermek
  - text: flu symptoms
    tr: grip belirtileri
  examples:
  - en: Fever, fatigue, and a persistent dry cough are primary symptoms of the seasonal flu.
    tr: Ateş, yorgunluk ve geçmeyen kuru öksürük mevsimsel gribin birincil belirtileridir.
    context: Health Clinic
  - en: If you experience any unusual symptoms after starting the medication, contact your doctor immediately.
    tr: İlaca başladıktan sonra olağandışı herhangi bir belirti yaşarsanız derhal doktorunuzla iletişime geçin.
    context: Medical Advice
  turkish_traps:
  - trap_type: preposition_confusion
    trap_note_tr: Bir hastalığın belirtisi derken 'symptom of [illness]' kalıbı kullanılır, 'symptom for' denmez.
    incorrect_example: A headache is a symptom for dehydration.
    correct_example: A headache is a symptom of dehydration.
  register: general
  topic_tags:
  - health
  - symptoms
  - medicine
  related_ids: []
  status: APPROVED
  version: 1
- id: vocab.injury
