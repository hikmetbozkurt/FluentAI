- id: vocab.objective
  headword: objective
  cefr_level: B1
  part_of_speech: noun
  phonetic: /əbˈdʒek.tɪv/
  audio_ref: null
  definition_en: A specific result that a person or organization aims to achieve within a timeframe.
  meaning_tr: hedef, amaç; nesnel, tarafsız
  collocations:
    - text: key objective
      tr: kilit hedef
    - text: achieve an objective
      tr: hedefe ulaşmak
  examples:
    - en: Our primary business objective this quarter is improving user retention by ten percent.
      tr: Bu çeyrekteki birincil iş hedefimiz, kullanıcı bağlılığını yüzde on oranında artırmaktır.
      context: OKR Setting
    - en: The code review process must remain objective and focused on code quality rather than personal style.
      tr: Kod inceleme süreci kişisel üsluptan ziyade kod kalitesine odaklanmalı ve nesnel kalmalıdır.
      context: Engineering Culture
  turkish_traps:
    - trap_type: false_friend
      trap_note_tr: >-
        "Objective" hem isim olarak "hedef/amaç", hem de sıfat olarak "tarafsız/nesnel" demektir.
        Öznel demek için "subjective" kullanılır.
      incorrect_example: We reached our object.
      correct_example: We achieved our objective.
  register: business
  topic_tags:
    - strategy
    - management
  related_ids:
    - vocab.initiative
    - vocab.milestone
  status: APPROVED
  version: 1

- id: vocab.priority
  headword: priority
  cefr_level: B1
  part_of_speech: noun
  phonetic: /praɪˈɒr.ə.ti/
  audio_ref: null
  definition_en: Something that is regarded as more important than other things and dealt with first.
  meaning_tr: öncelik, öncelikli konu
  collocations:
    - text: top priority
      tr: en yüksek öncelik
    - text: set priorities
      tr: öncelikleri belirlemek
  examples:
    - en: Customer data privacy and regulatory compliance are top priorities for our platform.
      tr: Müşteri veri gizliliği ve mevzuata uyum, platformumuz için en yüksek önceliklerdir.
      context: Corporate Strategy
    - en: Product management reprioritized the backlog to address high-severity bugs first.
      tr: Ürün yönetimi, öncelikle yüksek önem dereceli hataları ele almak için iş listesini yeniden önceliklendirdi.
      context: Backlog Refinement
  turkish_traps:
    - trap_type: collocation_error
      trap_note_tr: >-
        "Öncelik vermek" kalıbı İngilizcede "give priority to" veya fiil olarak "prioritize" şeklindedir.
      incorrect_example: We should make priority to stability.
      correct_example: We should give priority to stability.
  register: general
  topic_tags:
    - planning
    - time-management
  related_ids:
    - vocab.urgent
    - vocab.deadline
  status: APPROVED
  version: 1

- id: vocab.propose
  headword: propose
  cefr_level: B1
  part_of_speech: verb
  phonetic: /prəˈpəʊz/
  audio_ref: null
  definition_en: To put forward an idea, plan, or suggestion for consideration and discussion by others.
  meaning_tr: önermek, teklif etmek
  collocations:
    - text: propose a solution
      tr: bir çözüm önermek
    - text: propose changes
      tr: değişiklikler teklif etmek
  examples:
    - en: The security architect proposed switching to token-based authentication with rotating keys.
      tr: Güvenlik mimarı, dönen anahtarlarla belirteç tabanlı kimlik doğrulamaya geçilmesini önerdi.
      context: Security Design
    - en: We propose scheduling a brief sync meeting to resolve the blocking dependency.
      tr: Engelleyici bağımlılığı çözmek için kısa bir eşzamanlama toplantısı planlamayı öneriyoruz.
      context: Project Coordination
  turkish_traps:
    - trap_type: literal_translation
      trap_note_tr: >-
        "Propose" sonrasında doğrudan bir fiil geldiğinde fiil "-ing" alır ("propose doing something").
        Birine teklif götürürken "propose to someone" değil, nesne önce gelir: "propose a plan to the board".
      incorrect_example: I propose to delay the launch.
      correct_example: I propose delaying the launch.
  register: business
  topic_tags:
    - meetings
    - business
  related_ids:
    - vocab.brief
    - vocab.resolve
  status: APPROVED
  version: 1

- id: vocab.resolve
  headword: resolve
  cefr_level: B1
  part_of_speech: verb
  phonetic: /rɪˈzɒlv/
  audio_ref: null
  definition_en: To settle or find a satisfactory solution to a problem, dispute, or conflict.
  meaning_tr: çözüme kavuşturmak, gidermek, halletmek
  collocations:
    - text: resolve an issue
      tr: bir sorunu çözmek
    - text: resolve a conflict
      tr: bir anlaşmazlığı gidermek
  examples:
    - en: The DevOps squad resolved the networking latency issue within twenty minutes.
      tr: DevOps ekibi ağ gecikmesi sorununu yirmi dakika içinde çözüme kavuşturdu.
      context: Incident Management
    - en: Both founders held a private discussion to resolve their differing views on monetization.
      tr: Her iki kurucu da gelir modeli hakkındaki farklı görüşlerini çözüme kavuşturmak için özel bir görüşme yaptı.
      context: Leadership Dispute
  turkish_traps:
    - trap_type: false_friend
      trap_note_tr: >-
        "Resolve" ile "solve" benzerdir; ancak "solve" daha çok matematiksel veya teknik bir problemi
        çözmektir ("solve a math problem"), "resolve" ise karmaşık bir durumu, uyuşmazlığı veya sistemik bir
        sorunu uzlaştırarak ortadan kaldırmaktır ("resolve a conflict/issue").
      incorrect_example: We dissolved the bug in the software.
      correct_example: We resolved the bug in the software.
  register: general
  topic_tags:
    - problem-solving
    - operations
  related_ids:
    - vocab.complain
    - vocab.propose
  status: APPROVED
  version: 1

- id: vocab.stakeholder
  headword: stakeholder
  cefr_level: B1
  part_of_speech: noun
  phonetic: /ˈsteɪkˌhəʊl.dər/
  audio_ref: null
  definition_en: A person, group, or organization with a vested interest or concern in a company or project.
  meaning_tr: paydaş, ilgili taraf
  collocations:
    - text: key stakeholder
      tr: kilit paydaş
    - text: stakeholder engagement
      tr: paydaş katılımı
  examples:
    - en: We presented the redesigned system architecture to internal and external stakeholders.
      tr: Yeniden tasarlanan sistem mimarisini şirket içi ve şirket dışı paydaşlara sunduk.
      context: Architecture Review
    - en: Clear documentation prevents misunderstandings between engineering teams and business stakeholders.
      tr: Net dokümantasyon, mühendislik ekipleri ile iş paydaşları arasındaki yanlış anlamaları önler.
      context: Technical Writing
  turkish_traps:
    - trap_type: false_friend
      trap_note_tr: >-
        "Shareholder" sadece şirketin hisse senedine sahip olan "hissedar"dır. "Stakeholder" ise projeyle veya
        şirketle ilgisi olan çalışan, müşteri, yönetici gibi tüm "paydaş"ları kapsar.
      incorrect_example: The developers are project shareholders.
      correct_example: The developers are project stakeholders.
  register: business
  topic_tags:
    - governance
    - management
  related_ids:
    - vocab.colleague
    - vocab.objective
  status: APPROVED
  version: 1

- id: vocab.update
  headword: update
  cefr_level: B1
  part_of_speech: verb
  phonetic: /ʌpˈdeɪt/
  audio_ref: null
  definition_en: To give someone the most recent information, or to make something more modern or suitable.
  meaning_tr: güncellemek, en son durumu bildirmek; güncelleme
  collocations:
    - text: status update
      tr: durum güncellemesi
    - text: keep someone updated
      tr: birini sürekli bilgilendirmek
  examples:
    - en: Please keep me updated on the progress of the payment migration.
      tr: Lütfen ödeme geçişinin ilerleyişi hakkında beni sürekli bilgilendirin.
      context: Daily Collaboration
    - en: The security team updated the SSL certificates across all production endpoints.
      tr: Güvenlik ekibi, tüm canlı uç noktalardaki SSL sertifikalarını güncelledi.
      context: Infrastructure Maintenance
  turkish_traps:
    - trap_type: collocation_error
      trap_note_tr: >-
        "Beni gelişmelerden haberdar et" demek için İngilizcede yaygın kalıp "keep me updated"
        veya "keep me posted"dır.
      incorrect_example: Make me updated about the progress.
      correct_example: Keep me updated on the progress.
  register: general
  topic_tags:
    - communication
    - status
  related_ids:
    - vocab.brief
    - vocab.confirm
  status: APPROVED
  version: 1

- id: vocab.deliver
  headword: deliver
  cefr_level: B1
  part_of_speech: verb
  phonetic: /dɪˈlɪv.ər/
  audio_ref: null
  definition_en: To provide, hand over, or achieve promised results, services, or goods.
  meaning_tr: teslim etmek, sunmak, (söz verilen sonucu) gerçekleştirmek
  collocations:
    - text: deliver results
      tr: sonuç üretmek, başarı sağlamak
    - text: deliver a presentation
      tr: sunum yapmak
    - text: deliver on time
      tr: zamanında teslim etmek
  examples:
    - en: The development team worked overtime to deliver the critical payment feature on time.
      tr: Geliştirme ekibi, kritik ödeme özelliğini zamanında teslim etmek için fazla mesai yaptı.
      context: Software Delivery
    - en: To win leadership trust, new product managers must deliver measurable results in their first quarter.
      tr: Liderlik ekibinin güvenini kazanmak için yeni ürün yöneticileri ilk çeyreklerinde ölçülebilir sonuçlar ortaya koymalıdır.
      context: Performance Review
  turkish_traps:
    - trap_type: literal_translation
      trap_note_tr: >-
        Türkçedeki "sunum yapmak" kalıbı sıklıkla "make a presentation" şeklinde düşünülür. Profesyonel iş İngilizcesinde
        "deliver a presentation" veya "give a presentation" çok daha yaygın ve doğaldır. Ayrıca kurumsal dilde "deliver",
        sadece kargo teslim etmek değil, "deliver results" (sonuç üretmek) veya "deliver value" (değer sunmak) anlamında kullanılır.
      incorrect_example: We need to make the project results to the board.
      correct_example: We need to deliver the project results to the board.
  register: business
  topic_tags:
    - workplace
    - performance
    - management
  related_ids:
    - vocab.deliverable
    - vocab.deadline
  status: APPROVED
  version: 1

