- id: listening.c1.event-bus-schema-migration-review
  title: Debating Zero-Downtime Event Schema Evolution
  cefr_level: C1
  category: engineering_meeting
  scenario_context: Principal architect Yusuf and data platform lead Chloe plan splitting flat billing payloads into nested
    multi-currency objects safely across twenty Kafka consumers.
  speakers:
  - id: yusuf
    name: Yusuf
    role: Principal Systems Architect
    accent: Turkish
  - id: chloe
    name: Chloe
    role: Data Platform Lead
    accent: American
  audio_ref: audio/listening/c1_event_bus_schema_migration_review.mp3
  duration_seconds: 68
  transcript_items:
  - index: 1
    speaker_id: yusuf
    start_ms: 0
    end_ms: 9868
    text_en: Chloe, thanks for reviewing our invoice-settled event RFC. Representing foreign currency properly means deprecating
      flat integer 'amount_cents' fields cleanly.
    text_tr: Chloe, fatura tahsilat olayı RFC'mizi incelediğin için teşekkürler. Döviz kurlarını doğru modellemek için düz
      tam sayı 'amount_cents' alanını temiz biçimde kullanımdan kaldırmamız gerekiyor.
  - index: 2
    speaker_id: chloe
    start_ms: 10268
    end_ms: 18016
    text_en: I agree structurally, Yusuf, though twenty downstream microservices and our nightly warehouse loader subscribe
      directly to that topic.
    text_tr: Yapısal olarak katılıyorum Yusuf, ancak yirmi alt mikroservis ve gece veri ambarı yükleyicimiz doğrudan bu konuya
      abone.
  - index: 3
    speaker_id: yusuf
    start_ms: 18416
    end_ms: 26394
    text_en: Right—an instant hard schema break would poison half our data warehouse tables by dawn. How do we stage a zero-downtime
      transition cleanly?
    text_tr: Doğru—ani sert bir şema değişikliği şafakta veri ambarı tablolarımızın yarısını zehirler. Kesintisiz geçişi nasıl
      aşamalandırırız?
  - index: 4
    speaker_id: chloe
    start_ms: 26794
    end_ms: 37316
    text_en: 'Strictly expand-and-contract: step one keeps legacy ''amount_cents'' intact while appending an optional nested
      ''settlement_money'' object marked backward-compatible in our schema registry.'
    text_tr: 'Kesinlikle genişlet-ve-daralt: ilk adımda eski ''amount_cents'' alanı korunurken şema kaydında geriye uyumlu
      olarak isteğe bağlı iç içe ''settlement_money'' nesnesi eklenir.'
  - index: 5
    speaker_id: yusuf
    start_ms: 37716
    end_ms: 42279
    text_en: Should producers dual-write both fields identically across a thirty-day soak window?
    text_tr: Üreticiler otuz günlük geçiş penceresi boyunca her iki alanı da birebir çift yazmalı mı?
  - index: 6
    speaker_id: chloe
    start_ms: 42679
    end_ms: 51092
    text_en: Crucially yes, paired with deterministic unit verification ensuring integer amounts never diverge from nested
      minor-unit values during currency conversions.
    text_tr: Kesinlikle evet; kur çevrimlerinde tam sayı tutarların yeni nesnedeki alt birim değeriyle asla sapmamasını doğrulayan
      deterministik testlerle birlikte.
  - index: 7
    speaker_id: yusuf
    start_ms: 51492
    end_ms: 56425
    text_en: And how will we prevent silent stragglers before turning legacy field emission off permanently?
    text_tr: Peki eski alan yayımını kalıcı kapatmadan önce sessizce geride kalan tüketicileri nasıl yakalayacağız?
  - index: 8
    speaker_id: chloe
    start_ms: 56825
    end_ms: 67467
    text_en: Telemetry headers expose each consumer group's schema version in Grafana. Once v1 parser reads hit zero across
      fourteen consecutive days, we drop the obsolete property safely.
    text_tr: Telemetri başlıkları her tüketici grubunun şema sürümünü Grafana'da gösterir. Eski v1 okuyucuları art arda on
      dört gün sıfırlandığında eski alanı güvenle düşürürüz.
  key_vocabulary:
  - word: backward
    context_note_tr: eski tüketicilerin yeni olayı bozmadan okuyabilmesi
  - word: dual-write
    context_note_tr: geçiş boyunca hem eski hem yeni alanı yayınlama
  - word: idempotent
    context_note_tr: tekrar işlendiğinde yan etki yaratmayan
  comprehension_questions:
  - id: q_listening_c1_event-bus-schema-migration-review_01
    question_en: Why is Yusuf retiring the flat integer 'amount_cents' event property?
    options:
    - Twenty microservices stopped reading warehouse schedules
    - Grafana dashboards failed to plot decimal exchange rates
    - To support structured multi-currency money amounts cleanly
    - Kafka brokers rejected integer payloads over ten digits
    correct_answer: To support structured multi-currency money amounts cleanly
    explanation_en: Yusuf explains foreign currency modeling requires replacing flat integer fields with nested money objects.
    explanation_tr: Yusuf çoklu para birimi yapısını doğru modellemek için düz tam sayı alanından çıkılması gerektiğini açıklar.
  - id: q_listening_c1_event-bus-schema-migration-review_02
    question_en: What risk prohibits swapping directly to the new event format overnight?
    options:
    - Twenty downstream consumers and warehouse loaders would fail immediately
    - Schema registries reject optional nested objects
    - Producer servers would halt network switches forever
    - Banking customers cannot inspect settled invoices
    correct_answer: Twenty downstream consumers and warehouse loaders would fail immediately
    explanation_en: Chloe warns 20 microservices plus the warehouse loader read the topic and would crash cleanly without
      transition.
    explanation_tr: Chloe yirmi servisin ve veri ambarının ani şema kırılımında bozulacağını belirtir.
  - id: q_listening_c1_event-bus-schema-migration-review_03
    question_en: What does Chloe's 'expand-and-contract' strategy publish during transition?
    options:
    - Only encrypted payloads until schema logs clear
    - Both the preserved legacy field and the optional nested object together
    - Two separate duplicate Kafka clusters forever
    - Null placeholders in place of foreign currency fields
    correct_answer: Both the preserved legacy field and the optional nested object together
    explanation_en: Producers dual-write old 'amount_cents' alongside optional backward-compatible 'settlement_money'.
    explanation_tr: Genişlet-ve-daralt yaklaşımı eski alanla birlikte yeni iç içe nesneyi eşzamanlı yazar.
  - id: q_listening_c1_event-bus-schema-migration-review_04
    question_en: How do engineers verify dual-written fields do not drift apart in rounding?
    options:
    - Sampling monthly invoice PDFs visually by analysts
    - Disabling foreign-currency trades during maintenance
    - Pausing Kafka partitions every thirty days
    - Deterministic tests asserting exact parity on currency conversions
    correct_answer: Deterministic tests asserting exact parity on currency conversions
    explanation_en: Chloe emphasizes deterministic checks proving flat and minor-unit amounts match strictly.
    explanation_tr: Chloe deterministik doğrulama testleriyle çift yazılan tutarların sapmamasının sağlandığını belirtir.
  - id: q_listening_c1_event-bus-schema-migration-review_05
    question_en: What gate decides when legacy field emission can finally shut off?
    options:
    - Arbitrary expiration exactly thirty hours after merge
    - Approvals purely from two frontend engineers
    - Sending one advisory announcement inside Grafana
    - Fourteen straight days showing zero v1 reader telemetry
    correct_answer: Fourteen straight days showing zero v1 reader telemetry
    explanation_en: Telemetry confirms 14 consecutive days of zero v1 parser reads before removing the field.
    explanation_tr: Grafana telemetrisinde art arda on dört gün sıfır v1 okuması görülünce eski alan kaldırılır.
  topic_tags:
  - kafka
  - schema-evolution
  - zero-downtime
  related_ids: []
  status: APPROVED
  version: 1
