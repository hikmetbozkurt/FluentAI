    question_en: What aggressive migration timeline was originally demanded by the executive committee?
    question_tr_hint: Yönetim kurulu başlangıçta hangi agresif geçiş takvimini talep etmişti?
    options:
    - A forced six-month migration of all acquired accounts onto Salesforce
    - A ten-year gradual transition plan
    - A twenty-four hour complete shutdown and manual data entry
    - Canceling all existing customer accounts immediately
    correct_answer: A forced six-month migration of all acquired accounts onto Salesforce
    explanation_en: Leonard states the committee is mandating a six-month migration onto Salesforce.
    explanation_tr: Leonard kurulun 6 ay içinde tüm hesapların Salesforce'a taşınmasını zorunlu kıldığını söyler.
  - id: q_c1_mrg_02
    question_en: Why does Ipek warn against a sudden 'rip-and-replace' migration of Nordic Fintech's CRM?
    question_tr_hint: İpek Nordic Fintech'in CRM'inin ani bir 'sök-ve-değiştir' ile taşınmasına karşı neden uyarıda bulunuyor?
    options:
    - Nordic employees do not know how to turn on computer monitors
    - Salesforce has legally banned all European financial institutions
    - Nordic's contracts forbid using any software created in North America
    - Nordic's core banking workflows are deeply intertwined with their bespoke internal CRM
    correct_answer: Nordic's core banking workflows are deeply intertwined with their bespoke internal CRM
    explanation_en: Ipek warns that Nordic's banking workflows are deeply coupled with their custom CRM.
    explanation_tr: İpek bankacılık iş akışlarının özel CRM sistemleriyle derinden iç içe geçmiş olduğunu belirtir.
  - id: q_c1_mrg_03
    question_en: What annual cost penalty does Leonard cite for maintaining parallel CRM stacks?
    question_tr_hint: Leonard paralel CRM yapılarını sürdürmenin yıllık hangi maliyet cezasına yol açacağını belirtir?
    options:
    - Fifty thousand dollars
    - An extra two million dollars annually
    - One hundred million dollars
    - Ten dollars per employee
    correct_answer: An extra two million dollars annually
    explanation_en: 'Leonard highlights: ''Maintaining two parallel enterprise CRM stacks will cost an extra two million dollars
      annually.'''
    explanation_tr: Leonard paralel yapıların yılda fazladan iki milyon dolara mal olacağını ifade eder.
  - id: q_c1_mrg_04
    question_en: What intermediate solution does Ipek propose to provide unified executive visibility?
    question_tr_hint: İpek birleşik yönetim görünürlüğü sağlamak için hangi ara çözümü önermektedir?
    options:
