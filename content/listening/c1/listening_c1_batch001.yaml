    - Hiring fifty clerks to copy and paste data into Microsoft Excel spreadsheets
    - Deleting all customer records from both databases to start fresh
    - Conducting weekly telephone calls to read customer account balances out loud
    correct_answer: Building a real-time event-driven integration layer over Kafka to synchronize customer records
    explanation_en: Ipek proposes building a real-time event-driven integration layer over Kafka.
    explanation_tr: İpek Kafka üzerinden gerçek zamanlı olay odaklı bir entegrasyon katmanı kurmayı önerir.
  - id: q_c1_mrg_05
    question_en: How will data model schema conflicts between the two corporate entities be reconciled?
    question_tr_hint: İki kurumsal varlık arasındaki veri modeli şema çakışmaları nasıl uzlaştırılacaktır?
    options:
