    options:
    - Eight cents per gigabyte
    - One dollar per megabyte
    - Free of charge for all corporations
    - Ten dollars per kilobyte
    correct_answer: Eight cents per gigabyte
    explanation_en: 'Selcuk references: ''Your public internet egress tariff of eight cents per gigabyte is untenable.'''
    explanation_tr: Selcuk gigabayt başına sekiz sentlik genel internet tarifesini belirtir.
  - id: q_c1_egr_03
    question_en: In which co-location data centers does Selcuk propose establishing private interconnects?
    question_tr_hint: Selcuk hangi ortak yerleşim veri merkezlerinde özel ara bağlantılar kurmayı önermektedir?
    options:
    - Public university computer laboratories in Tokyo
    - Commercial retail electronics stores in London
