    vocab_id: vocab.objective
    context_note_tr: Milyonlarca dolarlık bulut çıkış maliyetlerini düşürme stratejik hedefi.
  - word: asynchronous
    vocab_id: vocab.asynchronous
    context_note_tr: Çoklu bulut veri ambarları arasındaki asenkron veri çoğaltma akışları.
  comprehension_questions:
  - id: q_c1_egr_01
    question_en: What monthly cross-cloud data replication volume is driving Selcuk's negotiation?
    question_tr_hint: Selcuk'un müzakeresini yönlendiren aylık bulutlar arası veri çoğaltma hacmi nedir?
    options:
    - One hundred megabytes
    - Fifty gigabytes
    - Twelve petabytes of data replication monthly
    - Five terabytes
    correct_answer: Twelve petabytes of data replication monthly
    explanation_en: Selcuk opens by citing twelve petabytes of cross-cloud analytical replication monthly.
    explanation_tr: Selcuk aylık 12 petabaytlık bulutlar arası analitik veri çoğaltma hacmini belirtir.
  - id: q_c1_egr_02
    question_en: What was the cloud provider's standard public internet egress tariff?
