- id: listening.c1.zero-trust-network-architecture
  title: 'Security Architecture: Transitioning to Zero-Trust Micro-Segmentation'
  cefr_level: C1
  category: engineering_meeting
  scenario_context: Tolga, principal security architect, and Vivienne, VP of Network Infrastructure, deliberate replacing
    legacy corporate VPN perimeters with identity-aware zero-trust proxies and mutual TLS.
  speakers:
  - id: tolga
    name: Tolga
    role: Principal Security Architect
    accent: Turkish
  - id: vivienne
    name: Vivienne
    role: VP of Network Infrastructure
    accent: British
  audio_ref: audio/listening/c1_zero_trust.mp3
  duration_seconds: 60
  transcript_items:
  - index: 1
    speaker_id: vivienne
    start_ms: 0
    end_ms: 8553
    text_en: Tolga, our perimeter firewall model is increasingly untenable now that eighty percent of our engineering workforce
      operates in a decentralized hybrid arrangement.
    text_tr: Tolga, mühendislik iş gücümüzün yüzde sekseni merkezi olmayan hibrit bir düzende çalışırken, çevre güvenlik duvarı
      modelimiz giderek savunulamaz hale geliyor.
  - index: 2
    speaker_id: tolga
    start_ms: 8953
    end_ms: 20735
    text_en: 'Indeed Vivienne. The fundamental flaw of castle-and-moat perimeter security is implicit lateral trust: once
      an attacker compromises an edge VPN endpoint, they can traverse our internal subnet unhindered.'
    text_tr: 'Kesinlikle Vivienne. Kale-ve-hendek çevre güvenliğinin temel kusuru örtük yanal güvendir: Bir saldırgan uçtaki
      bir VPN noktasını ele geçirdiğinde, dahili alt ağımızda engelsizce ilerleyebilir.'
  - index: 3
    speaker_id: vivienne
    start_ms: 21135
    end_ms: 30187
    text_en: So you are advocating a complete Zero-Trust transition. How do you propose enforcing continuous cryptographic
      verification without introducing crippling latency?
    text_tr: Yani tamamen Sıfır Güven (Zero-Trust) geçişini savunuyorsun. Felç edici bir gecikme yaratmadan sürekli kriptografik
      doğrulamayı nasıl uygulamayı öneriyorsun?
  - index: 4
    speaker_id: tolga
    start_ms: 30587
    end_ms: 40669
    text_en: We will implement an Envoy-based service mesh with SPIFFE-compliant ephemeral X.509 certificates, enforcing mutual
      TLS on every East-West microservice communication hop.
    text_tr: Her Doğu-Batı mikro servis iletişim sekmesinde karşılıklı TLS'i (mTLS) zorunlu kılan, SPIFFE uyumlu geçici X.509
      sertifikalarına sahip Envoy tabanlı bir servis ağı uygulayacağız.
  - index: 5
    speaker_id: vivienne
    start_ms: 41069
    end_ms: 47818
    text_en: What about legacy monolithic workloads running on bare-metal database instances that cannot embed sidecar proxy
      containers?
    text_tr: Peki yan araç (sidecar) vekil konteynerleri barındıramayan çıplak metal (bare-metal) veritabanı örneklerinde
      çalışan eski monolitik iş yükleri ne olacak?
  - index: 6
    speaker_id: tolga
    start_ms: 48218
    end_ms: 59000
    text_en: We will place them behind identity-aware ingress gateways with strict software-defined eBPF kernel packet filtering,
      verifying device posture and OAuth claims before opening single-packet sockets.
    text_tr: Onları tek paketlik soketleri açmadan önce cihaz güvenliğini ve OAuth taleplerini doğrulayan, katı yazılım tanımlı
      eBPF çekirdek paket filtrelemeli kimlik duyarlı ağ geçitlerinin ardına yerleştireceğiz.
  key_vocabulary:
  - word: vulnerability
    vocab_id: vocab.vulnerability
    context_note_tr: Ağ çevrelerinde örtük güven kaynaklı yanal sızma zafiyetleri.
  - word: latency
    vocab_id: vocab.latency
    context_note_tr: Sıfır güven doğrulamalarında servis ağı proxy gecikmesi.
  comprehension_questions:
  - id: q_c1_zt_01
    question_en: What structural vulnerability of perimeter VPN security does Tolga highlight?
    question_tr_hint: Tolga çevre VPN güvenliğinin hangi yapısal zafiyetini vurgulamaktadır?
    options:
    - Implicit lateral trust that allows attackers to traverse internal subnets once a perimeter endpoint is breached
    - VPN encryption consumes ninety percent of employee home electricity
    - Perimeter firewalls only permit network connections during daytime hours
    - VPN technology was banned by international United Nations treaties
    correct_answer: Implicit lateral trust that allows attackers to traverse internal subnets once a perimeter endpoint is
      breached
    explanation_en: Tolga points out that castle-and-moat security grants implicit trust, allowing attackers to move laterally
      unhindered.
    explanation_tr: Tolga kale-ve-hendek güvenliğinin örtük güven tanıdığını ve sızan bir saldırganın ağ içinde serbestçe
      ilerleyebildiğini söyler.
  - id: q_c1_zt_02
    question_en: How will mutual TLS (mTLS) be orchestrated across the microservice mesh?
    question_tr_hint: Mikro servis ağı genelinde karşılıklı TLS (mTLS) nasıl orkestre edilecektir?
    options:
    - By typing a secret administrative password manually into every server terminal each morning
    - By requiring all network data to be transmitted over public broadcast radio
    - By replacing all computer processors with analog mechanical gears
    - Through an Envoy service mesh with SPIFFE-compliant ephemeral X.509 certificates
    correct_answer: Through an Envoy service mesh with SPIFFE-compliant ephemeral X.509 certificates
    explanation_en: Tolga specifies implementing an Envoy service mesh using SPIFFE-compliant ephemeral X.509 certificates.
    explanation_tr: Tolga SPIFFE uyumlu geçici X.509 sertifikalı Envoy servis ağı kuracaklarını belirtir.
  - id: q_c1_zt_03
    question_en: How will bare-metal legacy databases without sidecar containers be protected?
    question_tr_hint: Yan araç konteynerleri barındıramayan çıplak metal eski veritabanları nasıl korunacaktır?
    options:
    - By disconnecting them physically from power whenever an engineer logs off
    - Behind identity-aware gateways enforcing eBPF kernel packet filtering and posture verification
    - By moving all physical servers into an underground concrete vault
    - By publishing all database records openly on social media
    correct_answer: Behind identity-aware gateways enforcing eBPF kernel packet filtering and posture verification
    explanation_en: Tolga explains they will place them behind identity-aware ingress gateways with eBPF filtering.
    explanation_tr: Tolga onları eBPF filtrelemeli kimlik duyarlı ağ geçitlerinin ardına yerleştireceklerini ifade eder.
  - id: q_c1_zt_04
    question_en: What percentage of the workforce currently operates in a decentralized hybrid arrangement?
    question_tr_hint: İş gücünün şu anda yüzde kaçı merkezi olmayan hibrit bir düzende çalışmaktadır?
    options:
    - Ten percent
    - One hundred percent completely remote
    - Eighty percent
    - Exactly five percent
    correct_answer: Eighty percent
    explanation_en: 'Vivienne notes: ''eighty percent of our engineering workforce operates in a decentralized hybrid arrangement.'''
    explanation_tr: Vivienne personelin %80'inin hibrit çalıştığını belirtir.
  - id: q_c1_zt_05
    question_en: What verification checks must succeed before the gateway opens single-packet sockets to legacy nodes?
    question_tr_hint: Ağ geçidi eski düğümlere paket açmadan önce hangi doğrulama kontrolleri başarılı olmalıdır?
    options:
    - Device posture verification and valid OAuth claims
    - Employee fingerprints submitted through physical postal mail
    - Unanimous executive board voting approval in person
    - A complete factory reset of the employee's personal smartphone
    correct_answer: Device posture verification and valid OAuth claims
    explanation_en: Tolga explains that the gateway verifies device posture and OAuth claims prior to opening sockets.
    explanation_tr: Tolga soket açılmadan önce cihaz güvenliği ve OAuth taleplerinin doğrulanacağını söyler.
  topic_tags:
  - zero-trust
  - cybersecurity
  - mtls
  - service-mesh
  - c1-mastery
  related_ids:
  - vocab.vulnerability
  - vocab.latency
  status: APPROVED
  version: 1
- id: listening.c1.distributed-tracing-observability
  title: 'Observability Strategy: Mitigating High-Cardinality Telemetry Overhead'
  cefr_level: C1
  category: engineering_meeting
  scenario_context: Elif, principal observability engineer, and Henrik, chief platform architect, analyze OpenTelemetry head-based
    vs tail-based sampling to mitigate storage costs and network overhead.
  speakers:
  - id: elif
    name: Elif
    role: Principal Observability Engineer
    accent: Turkish
  - id: henrik
    name: Henrik
    role: Chief Platform Architect
    accent: American
  audio_ref: audio/listening/c1_observability_overhead.mp3
  duration_seconds: 62
  transcript_items:
  - index: 1
    speaker_id: henrik
    start_ms: 0
    end_ms: 9238
    text_en: Elif, our OpenTelemetry ingestion pipelines are consuming four petabytes of storage monthly. We are experiencing
      catastrophic cardinality explosion.
    text_tr: Elif, OpenTelemetry veri alım hatlarımız ayda dört petabayt depolama tüketiyor. Felaket boyutunda bir kardinalite
      patlaması (cardinality explosion) yaşıyoruz.
  - index: 2
    speaker_id: elif
    start_ms: 9638
    end_ms: 21590
    text_en: I audited our metrics collectors, Henrik. Development teams have been embedding dynamic user UUIDs and IP addresses
      into Prometheus metric labels, multiplying unique time-series exponentially.
    text_tr: Metrik toplayıcılarımızı denetledim Henrik. Geliştirme ekipleri Prometheus metrik etiketlerine dinamik kullanıcı
      UUID'lerini ve IP adreslerini gömmüş, bu da benzersiz zaman serilerini katlanarak çoğaltmış.
  - index: 3
    speaker_id: henrik
    start_ms: 21990
    end_ms: 31443
    text_en: That completely violates metric modeling best practices. High-cardinality attributes belong in structured traces
      and log spans, never in metric labels.
    text_tr: Bu durum metrik modelleme en iyi uygulamalarını tamamen ihlal ediyor. Yüksek kardinaliteli öznitelikler yapılandırılmış
      izler (trace) ve log aralıklarına aittir, asla metrik etiketlerine değil.
  - index: 4
    speaker_id: elif
    start_ms: 31843
    end_ms: 40135
    text_en: Beyond stripping those tags, we need to transition our distributed tracing from naive head-based sampling to
      intelligent tail-based sampling in the collector layer.
    text_tr: Bu etiketleri temizlemenin ötesinde dağıtık izleme sistemimizi toplayıcı katmanında naif baştan örneklemeden
      (head-based) akıllı sondan örneklemeye (tail-based) geçirmeliyiz.
  - index: 5
    speaker_id: henrik
    start_ms: 40535
    end_ms: 47783
    text_en: Explain how tail-based sampling protects our forensic debugging capabilities without retaining ninety-nine percent
      of boring healthy requests.
    text_tr: Sondan örneklemenin sıkıcı sağlıklı isteklerin yüzde doksan dokuzunu saklamadan adli hata ayıklama yeteneklerimizi
      nasıl koruduğunu açıklar mısın?
  - index: 6
    speaker_id: elif
    start_ms: 48183
    end_ms: 61520
    text_en: The collector buffers entire trace trees in memory until the root span concludes. It samples one hundred percent
      of traces containing HTTP 5xx errors or latency exceeding two seconds, while discarding benign fast traces.
    text_tr: Toplayıcı kök aralık tamamlanana kadar tüm iz ağaçlarını bellekte tamponlar. HTTP 5xx hataları içeren veya iki
      saniyeyi aşan gecikmeye sahip izlerin yüzde yüzünü örneklerken zararsız hızlı izleri eler.
  key_vocabulary:
  - word: audit
    vocab_id: vocab.audit
    context_note_tr: Telemetri metrikleri ve etiket kardinalitesinin sistemik denetimi.
  - word: latency
    vocab_id: vocab.latency
    context_note_tr: İzleme sistemlerinde yüksek gecikmeli uç durumların yakalanması.
  comprehension_questions:
  - id: q_c1_obs_01
    question_en: What developer practice caused the cardinality explosion in Prometheus metrics?
    question_tr_hint: Prometheus metriklerinde kardinalite patlamasına hangi geliştirici uygulaması yol açtı?
    options:
    - Running software servers in different geographic time zones
    - Writing code comments entirely in uppercase characters
    - Embedding dynamic high-cardinality attributes like user UUIDs and IP addresses into metric labels
    - Testing software on mobile tablets instead of desktop computers
    correct_answer: Embedding dynamic high-cardinality attributes like user UUIDs and IP addresses into metric labels
    explanation_en: Elif explains that developers embedded dynamic user UUIDs and IPs into metric labels, causing time-series
      explosion.
    explanation_tr: Elif geliştiricilerin dinamik kullanıcı kimlikleri ve IP'leri etiketlere gömerek zaman serisi patlaması
      yarattığını açıklar.
  - id: q_c1_obs_02
    question_en: How much telemetry storage is currently consumed on a monthly basis?
    question_tr_hint: Şu anda aylık bazda ne kadar telemetri depolama alanı tüketilmektedir?
    options:
    - Fifty megabytes
    - Four petabytes monthly
    - Ten gigabytes
    - One hundred kilobytes
    correct_answer: Four petabytes monthly
    explanation_en: 'Henrik states: ''our OpenTelemetry ingestion pipelines are consuming four petabytes of storage monthly.'''
    explanation_tr: Henrik hatların ayda dört petabayt tükettiğini belirtir.
  - id: q_c1_obs_03
    question_en: Where do high-cardinality attributes legitimately belong according to Henrik?
    question_tr_hint: Henrik'e göre yüksek kardinaliteli öznitelikler haklı olarak nereye aittir?
    options:
    - In physical handwritten legal notebooks
    - Printed on paper and stored in office filing cabinets
    - Posted publicly on company social media pages
    - In structured traces and log spans, never in metric labels
    correct_answer: In structured traces and log spans, never in metric labels
    explanation_en: 'Henrik stresses: ''High-cardinality attributes belong in structured traces and log spans, never in metric
      labels.'''
    explanation_tr: Henrik bu özniteliklerin etiketlere değil, iz ve log aralıklarına ait olduğunu vurgular.
  - id: q_c1_obs_04
    question_en: How does intelligent tail-based sampling operate in the collector layer?
    question_tr_hint: Akıllı sondan örnekleme (tail-based sampling) toplayıcı katmanında nasıl çalışır?
    options:
    - It randomly deletes half of all incoming network requests before they reach the server
    - It charges users one dollar every time an error is reported
    - It buffers entire trace trees in memory and retains all error-ridden or slow traces while discarding healthy traces
    - It records only requests sent between midnight and one a.m.
    correct_answer: It buffers entire trace trees in memory and retains all error-ridden or slow traces while discarding healthy
      traces
    explanation_en: Elif explains that the collector buffers traces and samples 100% of errors and slow requests while dropping
      benign ones.
    explanation_tr: Elif toplayıcının hatalı veya yavaş istekleri %100 saklayıp sağlıklıları ayıkladığını açıklar.
  - id: q_c1_obs_05
    question_en: What latency threshold triggers automatic retention in the proposed tail-based sampling filter?
    question_tr_hint: Önerilen sondan örnekleme filtresinde otomatik saklamayı hangi gecikme eşiği tetikler?
    options:
    - Latency exceeding two seconds
    - Latency exceeding one millisecond
    - Latency exceeding fifteen minutes
    - Latency exceeding one hour
    correct_answer: Latency exceeding two seconds
    explanation_en: Elif notes it samples 100% of traces containing HTTP 5xx errors or latency exceeding two seconds.
    explanation_tr: Elif 5xx hataları veya 2 saniyeyi aşan gecikmelerin %100 örneklendiğini belirtir.
  topic_tags:
  - observability
  - opentelemetry
  - distributed-tracing
  - prometheus
  - c1-mastery
  related_ids:
  - vocab.audit
  - vocab.latency
  status: APPROVED
  version: 1
- id: listening.c1.board-cybersecurity-crisis-briefing
  title: 'Executive Briefing: Board Audit Committee Supply-Chain Breach Assessment'
  cefr_level: C1
  category: executive_briefing
  scenario_context: Baris, Chief Information Security Officer, briefs Diane, chair of the board audit committee, on an Advanced
    Persistent Threat supply-chain compromise and regulatory disclosure timelines.
  speakers:
  - id: baris
    name: Baris
    role: Chief Information Security Officer
    accent: Turkish
  - id: diane
    name: Diane
    role: Board Audit Committee Chair
    accent: British
  audio_ref: audio/listening/c1_board_cybersecurity.mp3
  duration_seconds: 64
  transcript_items:
  - index: 1
    speaker_id: diane
    start_ms: 0
    end_ms: 9022
    text_en: Baris, thank you for convening this emergency briefing. The audit committee requires an unvarnished assessment
      of the supply-chain compromise reported this morning.
    text_tr: Baris, bu acil bilgilendirme toplantısını düzenlediğin için teşekkürler. Denetim komitesi bu sabah bildirilen
      tedarik zinciri ihlaline ilişkin yalın ve net bir değerlendirme talep ediyor.
  - index: 2
    speaker_id: baris
    start_ms: 9422
    end_ms: 20879
    text_en: Understood, Diane. A sophisticated nation-state threat actor compromised the build infrastructure of our third-party
      code-signing utility, injecting a backdoored dependency into our CI pipeline.
    text_tr: Anlaşıldı Diane. Gelişmiş bir ulus-devlet tehdit aktörü üçüncü taraf kod imzalama aracımızın derleme altyapısını
      ele geçirerek CI hattımıza arka kapı içeren bir bağımlılık enjekte etti.
  - index: 3
    speaker_id: diane
    start_ms: 21279
    end_ms: 28772
    text_en: What is the substantiated blast radius? Did the adversary achieve persistence inside production customer database
      clusters?
    text_tr: Somutlaştırılmış etki alanı (blast radius) nedir? Düşman taraf canlı müşteri veritabanı kümeleri içinde kalıcılık
      sağlayabildi mi?
  - index: 4
    speaker_id: baris
    start_ms: 29172
    end_ms: 39174
    text_en: Forensic telemetry confirms the payload was quarantined in the build sandbox. Our immutable ephemeral build runners
      terminated before the malware could establish command-and-control egress.
    text_tr: Adli bilişim telemetrisi zararlı yükün derleme korumalı alanında (sandbox) karantinaya alındığını doğruluyor.
      Değişmez geçici derleme ortamlarımız zararlı yazılım komuta-kontrol çıkışı kuramadan sonlandı.
  - index: 5
    speaker_id: diane
    start_ms: 39574
    end_ms: 49747
    text_en: That is immensely reassuring from an operational continuity perspective. However, what are our statutory disclosure
      obligations under SEC and GDPR frameworks?
    text_tr: Bu operasyonel süreklilik açısından son derece rahatlatıcı. Ancak SEC ve GDPR düzenlemeleri kapsamındaki yasal
      bildirim yükümlülüklerimiz nelerdir?
  - index: 6
    speaker_id: baris
    start_ms: 50147
    end_ms: 62934
    text_en: Because zero customer PII was exfiltrated and operational impact was contained, mandatory four-day SEC material
      disclosure is not triggered. However, we will publish a proactive security advisory tomorrow.
    text_tr: Hiçbir müşteri kişisel verisi dışarı sızdırılmadığı ve operasyonel etki sınırlandırıldığı için SEC'in zorunlu
      dört günlük maddi olay bildirimi tetiklenmedi. Ancak yarın proaktif bir güvenlik duyurusu yayımlayacağız.
  key_vocabulary:
  - word: substantiate
    vocab_id: vocab.substantiate
    context_note_tr: Adli bilişim ve telemetri kanıtlarıyla saldırı boyutunu somutlaştırmak.
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Tedarik zinciri saldırılarına karşı değişmez derleme ortamı dayanıklılığı.
  comprehension_questions:
  - id: q_c1_brd_01
    question_en: What was the specific vector of the cybersecurity compromise?
    question_tr_hint: Siber güvenlik ihlalinin spesifik saldırı vektörü neydi?
    options:
    - A physical break-in by burglars through the executive boardroom windows
    - A lost USB thumb drive discovered in a public municipal park
    - An employee accidentally emailing passwords to all corporate customers
    - A supply-chain compromise of a third-party code-signing utility injecting a backdoored dependency
    correct_answer: A supply-chain compromise of a third-party code-signing utility injecting a backdoored dependency
    explanation_en: Baris explains that threat actors compromised a third-party code-signing utility's build infrastructure.
    explanation_tr: Baris üçüncü taraf kod imzalama aracının altyapısının ele geçirilip arka kapılı bağımlılık enjekte edildiğini
      açıklar.
  - id: q_c1_brd_02
    question_en: Why was the malicious payload unable to exfiltrate data or establish persistence?
    question_tr_hint: Zararlı yazılım yükü neden veri sızdıramadı veya sistemde kalıcılık sağlayamadı?
    options:
    - The hackers forgot to turn on their computer servers
    - It was quarantined in the build sandbox, and immutable ephemeral build runners terminated in time
    - The malware was written in a language that the operating system could not understand
    - Corporate legal lawyers threatened the hackers with lawsuits
    correct_answer: It was quarantined in the build sandbox, and immutable ephemeral build runners terminated in time
    explanation_en: Baris confirms the payload was quarantined and ephemeral runners terminated before command-and-control
      egress.
    explanation_tr: Baris geçici derleme ortamlarının komuta-kontrol bağlantısı kurulmadan sonlandığını doğrular.
  - id: q_c1_brd_03
    question_en: Did the adversary penetrate production customer database clusters?
    question_tr_hint: Saldırgan canlı müşteri veritabanı kümelerine sızabildi mi?
    options:
    - No, forensic telemetry confirms the incident was entirely contained in the build sandbox
    - Yes, all customer passwords and credit card numbers were stolen
    - Yes, but only databases located in South America
    - The forensic team was unable to determine what happened
    correct_answer: No, forensic telemetry confirms the incident was entirely contained in the build sandbox
    explanation_en: Baris confirms zero customer PII was exfiltrated and impact was contained in the sandbox.
    explanation_tr: Baris hiçbir müşteri verisinin sızdırılmadığını ve olayın sandbox'ta sınırlandığını teyit eder.
  - id: q_c1_brd_04
    question_en: Why is the mandatory four-day SEC material disclosure rule NOT triggered?
    question_tr_hint: SEC'in zorunlu dört günlük maddi olay bildirimi kuralı neden tetiklenmemiştir?
    options:
    - Because the SEC does not have authority over technology corporations
    - Because the company paid a confidential fine to government officials
    - Because the incident took place on a weekend
    - Because zero customer PII was compromised and there was no material operational impact
    correct_answer: Because zero customer PII was compromised and there was no material operational impact
    explanation_en: Baris states that because zero PII was exfiltrated and operational impact was contained, mandatory SEC
      disclosure is not triggered.
    explanation_tr: Baris veri sızdırılmadığı ve maddi etki oluşmadığı için zorunlu SEC bildiriminin tetiklenmediğini belirtir.
  - id: q_c1_brd_05
    question_en: What transparent action will the company take tomorrow?
    question_tr_hint: Şirket yarın şeffaflık adına hangi adımı atacaktır?
    options:
    - Firing the entire software development engineering division
    - Publishing a proactive security advisory explaining the contained incident
    - Shutting down all company operations and filing for bankruptcy
    - Denying that any software tools were ever evaluated
    correct_answer: Publishing a proactive security advisory explaining the contained incident
    explanation_en: 'Baris concludes: ''we will publish a proactive security advisory tomorrow.'''
    explanation_tr: Baris yarın proaktif bir güvenlik duyurusu yayımlayacaklarını açıklar.
  topic_tags:
  - cybersecurity
  - board-governance
  - supply-chain-attack
  - incident-disclosure
  - c1-mastery
  related_ids:
  - vocab.substantiate
  - vocab.resilience
  status: APPROVED
  version: 1
- id: listening.c1.multi-cloud-egress-cost-arbitrage
  title: 'Infrastructure Negotiation: Cloud Egress Tariffs and Direct Peering'
  cefr_level: C1
  category: negotiation
  scenario_context: Selcuk, head of global infrastructure, negotiates dedicated fiber interconnect pricing with Gregory, cloud
    strategic alliances director, to eliminate exorbitant data egress fees.
  speakers:
  - id: selcuk
    name: Selcuk
    role: Head of Global Infrastructure
    accent: Turkish
  - id: gregory
    name: Gregory
    role: Cloud Alliances Director
    accent: American
  audio_ref: audio/listening/c1_egress_arbitrage.mp3
  duration_seconds: 56
  transcript_items:
  - index: 1
    speaker_id: selcuk
    start_ms: 0
    end_ms: 10517
    text_en: Gregory, our multi-cloud architecture routes twelve petabytes of cross-cloud analytical replication each month.
      Your public internet egress tariff of eight cents per gigabyte is untenable.
    text_tr: Gregory, çoklu bulut mimarimiz her ay on iki petabayt bulutlar arası analitik çoğaltma yönlendiriyor. Gigabayt
      başına sekiz sentlik genel internet çıkış tarifeniz savunulamaz.
  - index: 2
    speaker_id: gregory
    start_ms: 10917
    end_ms: 22229
    text_en: Selcuk, our standard public egress pricing reflects the transit backbone transit costs across Tier-1 carriers.
      However, we value your multi-million-dollar annual enterprise commitment.
    text_tr: Selcuk, standart genel çıkış fiyatlandırmamız 1. Kademe taşıyıcılar genelindeki transit omurga maliyetlerini
      yansıtmaktadır. Ancak yıllık milyonlarca dolarlık kurumsal taahhüdünüze değer veriyoruz.
  - index: 3
    speaker_id: selcuk
    start_ms: 22629
    end_ms: 30912
    text_en: We are prepared to establish dedicated one-hundred-gigabit Direct Connect and Cloud Interconnect circuits in
      Equinix Frankfurt and Ashburn co-location facilities.
    text_tr: Equinix Frankfurt ve Ashburn ortak yerleşim (co-location) tesislerinde özel yüz gigabitlik Direct Connect ve
      Cloud Interconnect devreleri kurmaya hazırız.
  - index: 4
    speaker_id: gregory
    start_ms: 31312
    end_ms: 40775
    text_en: If you terminate private interconnect circuits in those strategic metro exchange fabrics, we can reclassify your
      traffic from public egress to private interconnect data transfer.
    text_tr: Bu stratejik metro değişim yapılarında özel ara bağlantı devrelerini sonlandırırsanız, trafiğinizi genel çıkıştan
      özel ara bağlantı veri transferi olarak yeniden sınıflandırabiliriz.
  - index: 5
    speaker_id: selcuk
    start_ms: 41175
    end_ms: 47448
    text_en: What exact unit rate can your alliances executive committee approve for sustained monthly volumes exceeding ten
      petabytes?
    text_tr: İttifaklar icra komiteniz aylık on petabaytı aşan sürekli hacimler için tam olarak hangi birim fiyatı onaylayabilir?
  - index: 6
    speaker_id: gregory
    start_ms: 47848
    end_ms: 55680
    text_en: We can compress the egress rate from eight cents down to one point two cents per gigabyte, provided you sign
      a thirty-six-month minimum commit addendum.
    text_tr: Otuz altı aylık asgari taahhüt zeyilnamesini imzalamanız koşuluyla, çıkış ücretini sekiz sentten gigabayt başına
      bir virgül iki sente indirebiliriz.
  key_vocabulary:
