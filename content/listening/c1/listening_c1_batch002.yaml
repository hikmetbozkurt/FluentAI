- id: listening.c1.distributed-consensus-split-brain
  title: Triage and Remediation of Distributed Raft Split-Brain Partition
  cefr_level: C1
  category: engineering_meeting
  scenario_context: Site Reliability Director Chloe and Distributed Database Architect Kerem examine asynchronous network
    partition logs to verify Paxos/Raft leader lease invariants and eliminate phantom writes.
  speakers:
  - id: chloe
    name: Chloe
    role: Site Reliability Director
    accent: American
  - id: kerem
    name: Kerem
    role: Distributed Systems Architect
    accent: Turkish
  audio_ref: audio/listening/c1_distributed_consensus_split_brain.mp3
  duration_seconds: 75
  transcript_items:
  - index: 1
    speaker_id: chloe
    start_ms: 0
    end_ms: 9188
    text_en: Kerem, during our transatlantic network fiber flap at twenty past eleven last night, our multi-region database
      cluster experienced a partial split-brain state.
    text_tr: Kerem, dün gece saat on biri yirmi geçe yaşanan transatlantik ağ fiber dalgalanması sırasında, çok bölgeli veritabanı
      kümemiz kısmi bir bölünmüş beyin durumu yaşadı.
  - index: 2
    speaker_id: kerem
    start_ms: 9588
    end_ms: 19965
    text_en: I analyzed the Raft consensus state machine logs, Chloe. Both the European and North American regions elected
      independent leader nodes concurrently for approximately twelve seconds.
    text_tr: Raft mutabakat durum makinesi günlüklerini inceledim Chloe. Hem Avrupa hem de Kuzey Amerika bölgeleri yaklaşık
      on iki saniye boyunca eşzamanlı olarak bağımsız lider düğümler seçti.
  - index: 3
    speaker_id: chloe
    start_ms: 20365
    end_ms: 26618
    text_en: How could two leaders be elected simultaneously under strict majority quorum consensus across our five-node cluster?
    text_tr: Beş düğümlü kümemizde kesin çoğunluk nisap mutabakatı altındayken nasıl iki lider aynı anda seçilebildi?
  - index: 4
    speaker_id: kerem
    start_ms: 27018
    end_ms: 36995
    text_en: The root cause was clock drift across AWS regions interacting with our leader-lease renewal mechanism. Node three
      suffered a six-hundred-millisecond NTP desynchronization.
    text_tr: Kök neden, lider kiralama yenileme mekanizmamızla etkileşime giren AWS bölgeleri arasındaki saat kaymasıydı.
      Üçüncü düğümde altı yüz milisaniyelik bir NTP senkronizasyon kaybı yaşandı.
  - index: 5
    speaker_id: chloe
    start_ms: 37395
    end_ms: 44912
    text_en: Causing node three to consider its leadership lease valid while the overseas majority quorum had already timed
      out and initiated a new term election.
    text_tr: Bu da yurt dışındaki çoğunluk nisabının zaman aşımına uğrayıp yeni bir dönem seçimi başlatmasına rağmen üçüncü
      düğümün liderlik kiralamasını geçerli saymasına neden oldu.
  - index: 6
    speaker_id: kerem
    start_ms: 45312
    end_ms: 54600
    text_en: Exactly. During that twelve-second window, Node three accepted approximately four hundred write transactions
      that were never replicated to the global majority log.
    text_tr: Kesinlikle. Bu on iki saniyelik pencere sırasında, Üçüncü Düğüm küresel çoğunluk günlüğüne hiçbir zaman kopyalanmayan
      yaklaşık dört yüz yazma işlemini kabul etti.
  - index: 7
    speaker_id: chloe
    start_ms: 55000
    end_ms: 61058
    text_en: Did those unreplicated writes result in dirty phantom reads or silent data corruption for enterprise banking
      tenants?
    text_tr: Bu kopyalanmamış yazmalar kurumsal bankacılık kiracıları için kirli hayali okumalara veya sessiz veri bozulmalarına
      yol açtı mı?
  - index: 8
    speaker_id: kerem
    start_ms: 61458
    end_ms: 74375
    text_en: Fortunately, our multi-version concurrency control flagged the uncommitted terms, and write-ahead transaction
      logs rolled back cleanly without data loss. We are now mandating monotonic TrueTime GPS hardware references.
    text_tr: Neyse ki, çok sürümlü eşzamanlılık kontrolümüz kesinleşmemiş dönemleri işaretledi ve işlem öncesi yazma günlükleri
      veri kaybı olmaksızın temiz bir şekilde geri alındı. Artık monoton TrueTime GPS donanım referanslarını zorunlu kılıyoruz.
  comprehension_questions:
  - id: q_listening_c1_distributed-consensus-split-brain_01
    question_en: What underlying physical defect triggered concurrent leader elections across regions?
    question_tr_hint: Bölgeler arasında eşzamanlı lider seçimlerini hangi temel fiziksel kusur tetikledi?
    options:
    - A power outage disabling all five server motherboards at once.
    - Clock drift and a 600ms NTP desynchronization colliding with the leader-lease interval.
    - An unauthorized firmware update deleting the consensus source code.
    - Malicious ransom software corrupting all disk partitioning tables.
    correct_answer: Clock drift and a 600ms NTP desynchronization colliding with the leader-lease interval.
    explanation_en: Kerem identifies clock drift and a 600ms NTP desynchronization on node 3 as the root cause.
    explanation_tr: Kerem kök nedenin saat kayması ve 3. düğümdeki 600 ms'lik NTP gecikmesi olduğunu belirtir.
  - id: q_listening_c1_distributed-consensus-split-brain_02
    question_en: How long did the split-brain dual-leader condition persist during the network flap?
    question_tr_hint: Ağ dalgalanması sırasında çift liderli bölünmüş beyin durumu ne kadar sürdü?
    options:
    - Exactly twenty-four hours.
    - Less than one nanosecond.
    - Approximately twelve seconds.
    - Over three full calendar weeks.
    correct_answer: Approximately twelve seconds.
    explanation_en: Kerem states both regions elected independent leaders for approximately 12 seconds.
    explanation_tr: Kerem bağımsız lider durumunun yaklaşık 12 saniye sürdüğünü söyler.
  - id: q_listening_c1_distributed-consensus-split-brain_03
    question_en: What happened to the four hundred write transactions accepted by the disconnected leader node?
    question_tr_hint: Bağlantısı kesilen lider düğüm tarafından kabul edilen dört yüz yazma işlemine ne oldu?
    options:
    - They were identified by multi-version concurrency control and cleanly rolled back without corruption.
    - They resulted in the immediate bankruptcy of fifty multinational banks.
    - They overwrote the entire operating system of every customer device.
    - They were permanently published to international public newspapers.
    correct_answer: They were identified by multi-version concurrency control and cleanly rolled back without corruption.
    explanation_en: Kerem reports MVCC flagged uncommitted terms and transaction logs rolled back cleanly.
    explanation_tr: Kerem MVCC kontrolünün işlemleri yakalayıp veri kaybı olmadan temizce geri aldığını belirtir.
  - id: q_listening_c1_distributed-consensus-split-brain_04
    question_en: What permanent hardware and architectural safeguard does Kerem mandate to prevent recurrence?
    question_tr_hint: Kerem tekrarı önlemek için hangi kalıcı donanım ve mimari güvenlik önlemini zorunlu kılıyor?
    options:
    - Using mechanical grandfather clocks inside datacenter server halls.
    - Requiring software engineers to manually approve every database query.
    - Eliminating all automated failover algorithms in favor of manual rebooting.
    - Mandating monotonic TrueTime GPS hardware time references across all cluster datacenters.
    correct_answer: Mandating monotonic TrueTime GPS hardware time references across all cluster datacenters.
    explanation_en: Kerem specifies mandating monotonic TrueTime GPS hardware references.
    explanation_tr: Kerem TrueTime GPS donanım saat referanslarının zorunlu kılınacağını açıklar.
  - id: q_listening_c1_distributed-consensus-split-brain_05
    question_en: How many total nodes comprise the consensus cluster under review?
    question_tr_hint: İnceleme altındaki mutabakat kümesi toplam kaç düğümden oluşmaktadır?
    options:
    - A single solitary mainframe server node.
    - Two hundred thousand individual server nodes.
    - Five nodes operating under majority quorum.
    - Exactly two interconnected server nodes.
    correct_answer: Five nodes operating under majority quorum.
    explanation_en: Chloe refers to strict majority quorum across our five-node cluster.
    explanation_tr: Chloe beş düğümlü kümede kesin çoğunluk nisabından bahseder.
  topic_tags:
  - problem_solving
  - engineering
