- id: listening.c1.cloud-security-penetration-testing
  title: Analyzing Zero-Trust Cloud Penetration Test Debriefings
  cefr_level: C1
  category: engineering_meeting
  scenario_context: Offensive security specialist Leo debriefs cloud infrastructure director Emre regarding privilege escalation
    vectors identified in identity federation and cross-tenant IAM policies.
  speakers:
  - id: leo
    name: Leo
    role: Lead Penetration Tester
    accent: Australian
  - id: emre
    name: Emre
    role: Director of Cloud Infrastructure
    accent: Turkish
  audio_ref: audio/listening/c1_cloud_security_penetration_testing.mp3
  duration_seconds: 80
  transcript_items:
  - index: 1
    speaker_id: leo
    start_ms: 0
    end_ms: 11427
    text_en: G'day Emre. Our red team has finalized our two-week blind adversarial assessment of your multi-cloud production
      environment. Overall, your perimeter perimeter ingress controls were solid.
    text_tr: İyi günler Emre. Kırmızı ekibimiz çoklu bulut üretim ortamınızdaki iki haftalık kör düşman değerlendirmesini
      tamamladı. Genel olarak, çevre giriş kontrolleriniz sağlamdı.
  - index: 2
    speaker_id: emre
    start_ms: 11827
    end_ms: 21110
    text_en: Thanks Leo. We invested heavily in web application firewalls and zero-trust mutual TLS. Did you identify any
      exploitable footholds?
    text_tr: Teşekkürler Leo. Web uygulaması güvenlik duvarlarına ve sıfır güven karşılıklı TLS'e büyük yatırım yaptık. Yararlanılabilecek
      herhangi bir sızma noktası belirlediniz mi?
  - index: 3
    speaker_id: leo
    start_ms: 21510
    end_ms: 31038
    text_en: Once we compromised a developer staging credential through an unrotated OAuth refresh token, we bypassed your
      internal network segmentation via identity federation abuse.
    text_tr: Döndürülmemiş bir OAuth yenileme belirteci aracılığıyla bir geliştirici hazırlık kimlik bilgisini ele geçirdikten
      sonra, kimlik federasyonu suistimali yoluyla dahili ağ bölümlemenizi aştık.
  - index: 4
    speaker_id: emre
    start_ms: 31438
    end_ms: 36986
    text_en: How did you bridge from a low-privilege staging environment into our restricted production Kubernetes cluster?
    text_tr: Düşük ayrıcalıklı bir hazırlık ortamından kısıtlı üretim Kubernetes kümemize nasıl geçiş yaptınız?
  - index: 5
    speaker_id: leo
    start_ms: 37386
    end_ms: 49677
    text_en: Your cloud IAM role permitted excessive wildcard permissions on instance metadata services. By assuming an over-privileged
      CI/CD service principal, we extracted temporary STS session credentials.
    text_tr: Bulut IAM rolünüz, bulut sunucusu meta veri hizmetlerinde aşırı joker karakter izinlerine olanak tanıyordu. Aşırı
      yetkili bir CI/CD hizmet sorumlusunu üstlenerek geçici STS oturum kimlik bilgilerini çıkardık.
  - index: 6
    speaker_id: emre
    start_ms: 50077
    end_ms: 58435
    text_en: Which granted access to our centralized Key Management Service and secrets store without generating an alert
      in our Security Information and Event Management platform.
    text_tr: Bu da Güvenlik Bilgileri ve Olay Yönetimi platformumuzda bir uyarı oluşturmadan merkezi Anahtar Yönetim Hizmetimize
      ve sırlar depomuza erişim sağladı.
  - index: 7
    speaker_id: leo
    start_ms: 58835
    end_ms: 70222
    text_en: Spot on. Because your SIEM lacked behavioral anomaly detection for cross-account assume-role API calls, our lateral
      movement was virtually indistinguishable from legitimate automated build pipelines.
    text_tr: Tam üstüne bastın. SIEM platformunuz hesaplar arası rol üstlenme API çağrıları için davranışsal anomali tespitinden
      yoksun olduğundan, yanal hareketimiz meşru otomatik derleme işlem hatlarından neredeyse ayırt edilemezdi.
  - index: 8
    speaker_id: emre
    start_ms: 70622
    end_ms: 79290
    text_en: We will immediately enforce IMDSv2 token-bound metadata across all instances and restrict IAM role assumption
      using cryptographic session-tag policies.
    text_tr: Tüm bulut sunucularında derhal IMDSv2 belirteç bağlantılı meta verileri zorunlu kılacağız ve kriptografik oturum
      etiketi ilkelerini kullanarak IAM rol üstlenimini kısıtlayacağız.
  comprehension_questions:
  - id: q_listening_c1_cloud-security-penetration-testing_01
    question_en: What initial entry vector enabled the red team to gain a foothold?
    question_tr_hint: Kırmızı ekibin sisteme sızmasını sağlayan ilk giriş vektörü neydi?
    options:
    - An unencrypted Wi-Fi router operating without a password.
    - An unrotated OAuth refresh token granting access to developer staging credentials.
    - A malicious USB drive planted in the office reception lobby.
    - A brute-force dictionary attack against public SSH ports.
    correct_answer: An unrotated OAuth refresh token granting access to developer staging credentials.
    explanation_en: Leo explains they compromised a developer staging credential through an unrotated OAuth token.
    explanation_tr: Leo döndürülmemiş bir OAuth belirteci ile geliştirici ortamına sızdıklarını açıklar.
  - id: q_listening_c1_cloud-security-penetration-testing_02
    question_en: How did the testers achieve privilege escalation from staging to production?
    question_tr_hint: Test uzmanları hazırlık ortamından üretime ayrıcalık yükseltmeyi nasıl başardı?
    options:
    - By assuming an over-privileged CI/CD principal via wildcard permissions on instance metadata.
    - By disconnecting the physical fiber-optic cables connecting the building.
    - By bribing a senior database administrator with monetary gifts.
    - By guessing the root administrative password on the main console.
    correct_answer: By assuming an over-privileged CI/CD principal via wildcard permissions on instance metadata.
    explanation_en: Leo details how excessive wildcard permissions on instance metadata allowed assuming an over-privileged
      CI/CD role.
    explanation_tr: Leo sunucu meta verilerindeki joker izinlerin aşırı yetkili CI/CD rolünü üstlenmelerini sağladığını söyler.
  - id: q_listening_c1_cloud-security-penetration-testing_03
    question_en: Why did the lateral movement fail to trigger alerts in the organization's SIEM platform?
    question_tr_hint: Yanal hareket kuruluşun SIEM platformunda neden uyarı tetiklemedi?
    options:
    - The security operations team was absent due to a national holiday.
    - The monitoring system lacked behavioral anomaly heuristics for cross-account role assumption.
    - All logging hard drives were filled to complete capacity.
    - The SIEM software was accidentally turned off during the assessment.
    correct_answer: The monitoring system lacked behavioral anomaly heuristics for cross-account role assumption.
    explanation_en: Leo notes the SIEM lacked behavioral anomaly detection for cross-account assume-role calls.
    explanation_tr: Leo SIEM sisteminin hesaplar arası rol üstlenme anomalilerini algılayamadığını belirtir.
  - id: q_listening_c1_cloud-security-penetration-testing_04
    question_en: What specific cloud security remediation does Emre commit to enacting immediately?
    question_tr_hint: Emre derhal hangi özel bulut güvenliği iyileştirmesini gerçekleştirmeyi taahhüt ediyor?
    options:
    - Enforcing IMDSv2 token-bound metadata and session-tag policy constraints on role assumptions.
    - Disabling all user passwords in favor of handwritten paper signatures.
    - Permanently terminating all cloud contracts and hosting servers on-premises.
    - Prohibiting developers from utilizing automated software build pipelines.
    correct_answer: Enforcing IMDSv2 token-bound metadata and session-tag policy constraints on role assumptions.
    explanation_en: Emre pledges to mandate IMDSv2 metadata and enforce cryptographic session-tag policies.
    explanation_tr: Emre IMDSv2 meta veri zorunluluğu ve oturum etiketi ilkeleri getireceğini taahhüt eder.
  - id: q_listening_c1_cloud-security-penetration-testing_05
    question_en: What aspect of Emre's defensive infrastructure performed well according to Leo?
    question_tr_hint: Leo'ya göre Emre'nin savunma altyapısının hangi yönü iyi performans gösterdi?
    options:
    - Perimeter ingress boundary controls including web application firewalls and mutual TLS.
    - Paper shredding procedures within the corporate accounting department.
    - Biometric voice recognition access controls on workstation microphones.
    - Automated physical security doors guarding executive office corridors.
    correct_answer: Perimeter ingress boundary controls including web application firewalls and mutual TLS.
    explanation_en: Leo acknowledges that perimeter ingress controls and WAF/mTLS were solid.
    explanation_tr: Leo çevre giriş kontrolleri ve WAF/mTLS yapısının sağlam olduğunu kabul eder.
  topic_tags:
  - technology
  - security
- id: listening.c1.municipal-smart-grid-zoning
  title: Aligning Urban District Decentralized Microgrid Planning
  cefr_level: C1
  category: stakeholder_alignment
  scenario_context: City urban development commissioner Vance and renewable energy consortium lead Hande review civic zoning
    permits, battery energy storage safety easements, and substation interconnects.
  speakers:
  - id: vance
    name: Vance
    role: Urban Planning Commissioner
    accent: American
  - id: hande
    name: Hande
    role: Clean Energy Program Director
    accent: Turkish
  audio_ref: audio/listening/c1_municipal_smart_grid_zoning.mp3
  duration_seconds: 81
  transcript_items:
  - index: 1
    speaker_id: vance
    start_ms: 0
    end_ms: 9073
    text_en: Hande, our municipal planning commission is enthusiastic about your consortium's proposal for an eight-megawatt
      decentralized urban microgrid in the historic port district.
    text_tr: Hande, belediye planlama komisyonumuz konsorsiyumunuzun tarihi liman bölgesinde sekiz megavatlık merkezi olmayan
      kentsel mikro şebeke önerisi konusunda çok hevesli.
  - index: 2
    speaker_id: hande
    start_ms: 9473
    end_ms: 20245
    text_en: Thank you Commissioner Vance. Integrating rooftop solar, commercial district fuel cells, and utility-scale battery
      energy storage will reduce peak grid strain by thirty-five percent.
    text_tr: Teşekkürler Komisyon Üyesi Vance. Çatı güneş enerjisini, ticari bölge yakıt hücrelerini ve şebeke ölçeğinde batarya
      enerji depolamasını entegre etmek zirve şebeke yükünü yüzde otuz beş azaltacaktır.
  - index: 3
    speaker_id: vance
    start_ms: 20645
    end_ms: 30952
    text_en: However, several neighborhood civic associations have filed zoning objections concerning the twenty-megawatt-hour
      lithium iron phosphate battery installation adjacent to residential heritage quarters.
    text_tr: Ancak, bazı mahalle sivil dernekleri, konut mirası mahallelerine komşu yirmi megavatsaatlik lityum demir fosfat
      batarya kurulumuyla ilgili imar itirazlarında bulundu.
  - index: 4
    speaker_id: hande
    start_ms: 31352
    end_ms: 43559
    text_en: I understand their apprehension regarding thermal runaway and fire propagation risks. However, lithium iron phosphate
      chemistry is intrinsically resistant to oxygen release compared to nickel manganese cobalt cells.
    text_tr: Termal kaçak ve yangın yayılma risklerine ilişkin endişelerini anlıyorum. Ancak lityum demir fosfat kimyası nikel
      manganez kobalt hücrelerine kıyasla oksijen salınımına karşı doğal olarak dirençlidir.
  - index: 5
    speaker_id: vance
    start_ms: 43959
    end_ms: 51577
    text_en: What engineered safeguards are integrated into the enclosure design to meet National Fire Protection Association
      standard 855?
    text_tr: Ulusal Yangından Korunma Birliği 855 standardını karşılamak için muhafaza tasarımına hangi mühendislik güvenlik
      önlemleri entegre edilmiştir?
  - index: 6
    speaker_id: hande
    start_ms: 51977
    end_ms: 63503
    text_en: Each battery module incorporates dedicated aerosol fire suppression canisters, deflagration pressure-relief venting,
      and continuous infrared gas sniffing to detect off-gassing thirty minutes prior to thermal events.
    text_tr: Her batarya modülü özel aerosol yangın bastırma kutuları, patlama basınç tahliye delikleri ve termal olaylardan
      otuz dakika önce gaz çıkışını tespit etmek için sürekli kızılötesi gaz algılayıcıları içerir.
  - index: 7
    speaker_id: vance
    start_ms: 63903
    end_ms: 72616
    text_en: If you supplement that with a fifty-foot landscaped green buffer and host an informational town hall for local
      residents, the commission is prepared to approve the zoning variance.
    text_tr: Bunu elli metrelik peyzajlı yeşil bir tampon bölgeyle tamamlarsanız ve bölge sakinleri için bilgilendirici bir
      halk toplantısı düzenlerseniz, komisyon imar değişikliğini onaylamaya hazırdır.
  - index: 8
    speaker_id: hande
    start_ms: 73016
    end_ms: 80139
    text_en: We will gladly commit to the acoustic green barrier and coordinate with municipal fire chiefs to conduct joint
      emergency drills next month.
    text_tr: Akustik yeşil bariyere memnuniyetle bağlı kalacağız ve önümüzdeki ay ortak acil durum tatbikatları yapmak üzere
      belediye itfaiye şefleriyle koordinasyon sağlayacağız.
  comprehension_questions:
  - id: q_listening_c1_municipal-smart-grid-zoning_01
    question_en: What primary civic concern was raised by neighborhood associations regarding the microgrid project?
    question_tr_hint: Mikro şebeke projesine ilişkin mahalle dernekleri tarafından hangi temel toplumsal endişe dile getirildi?
    options:
    - Fire hazards and thermal runaway risks stemming from battery storage near residential heritage zones.
    - Radioactivity leaks from underground miniature nuclear reactors.
    - Excessive dust generated by manual bicycle charging generators.
    - Loss of cellular mobile phone signals throughout the historic port.
    correct_answer: Fire hazards and thermal runaway risks stemming from battery storage near residential heritage zones.
    explanation_en: Vance notes objections over fire propagation and thermal runaway risks near homes.
    explanation_tr: Vance konut alanlarına yakın bataryalardaki termal kaçak ve yangın riskine dair itirazları belirtir.
  - id: q_listening_c1_municipal-smart-grid-zoning_02
    question_en: Why does Hande argue lithium iron phosphate (LFP) chemistry offers superior safety?
    question_tr_hint: Hande lityum demir fosfat (LFP) kimyasının neden üstün güvenlik sunduğunu savunuyor?
    options:
    - LFP cells do not conduct electrical current under any circumstances.
    - LFP chemistry is fundamentally resistant to thermal runaway oxygen release compared to NMC cells.
    - LFP enclosures operate at absolute zero degrees temperature permanently.
    - LFP batteries can be completely extinguished with household tap water.
    correct_answer: LFP chemistry is fundamentally resistant to thermal runaway oxygen release compared to NMC cells.
    explanation_en: Hande clarifies LFP is intrinsically resistant to oxygen release during thermal events.
    explanation_tr: Hande LFP kimyasının NMC hücrelerine kıyasla oksijen salınımına dirençli olduğunu açıklar.
  - id: q_listening_c1_municipal-smart-grid-zoning_03
    question_en: What advanced early-warning detection system is embedded inside each battery module?
    question_tr_hint: Her batarya modülünün içine hangi gelişmiş erken uyarı algılama sistemi yerleştirilmiştir?
    options:
    - A canary bird cage mounted on top of the external transformer.
    - Continuous infrared gas sniffing that detects off-gassing 30 minutes before thermal acceleration.
    - A human guard standing watch twenty-four hours a day with binoculars.
    - An acoustic microphone listening for lightning strikes.
    correct_answer: Continuous infrared gas sniffing that detects off-gassing 30 minutes before thermal acceleration.
    explanation_en: Hande describes infrared gas sniffing that detects off-gassing 30 minutes prior to events.
    explanation_tr: Hande termal olaylardan 30 dakika önce gaz çıkışını saptayan kızılötesi sensörleri anlatır.
  - id: q_listening_c1_municipal-smart-grid-zoning_04
    question_en: What civic concessions does Commissioner Vance require before granting the zoning variance?
    question_tr_hint: Komisyon Üyesi Vance imar değişikliğini onaylamadan önce hangi toplumsal tavizleri şart koşuyor?
    options:
    - Painting all solar panels in historical Victorian heritage colors.
    - Relocating the entire project to an uninhabited desert island.
    - Payment of personal cash stipends to every city municipal employee.
    - A landscaped fifty-foot green buffer and an informational public town hall for neighborhood residents.
    correct_answer: A landscaped fifty-foot green buffer and an informational public town hall for neighborhood residents.
    explanation_en: Vance requests a 50-foot green buffer and an informational town hall.
    explanation_tr: Vance 50 metrelik peyzajlı yeşil tampon ve halk bilgilendirme toplantısı talep eder.
  - id: q_listening_c1_municipal-smart-grid-zoning_05
    question_en: What overall grid performance benefit does the decentralized microgrid deliver?
    question_tr_hint: Merkezi olmayan mikro şebeke genel şebeke performansına nasıl bir fayda sağlar?
    options:
    - A thirty-five percent reduction in peak electricity grid strain across the urban district.
    - A hundred percent reduction in water consumption across the municipality.
    - Free unlimited electricity for every commercial entity in the nation.
    - Total eradication of all atmospheric greenhouse gas emissions globally.
    correct_answer: A thirty-five percent reduction in peak electricity grid strain across the urban district.
    explanation_en: Hande highlights a 35% reduction in peak grid strain.
    explanation_tr: Hande zirve şebeke yükünde %35 azalma sağlanacağını ifade eder.
  topic_tags:
  - society
  - urban_planning
- id: listening.c1.museum-curation-indigenous-artifacts
  title: Establishing Ethical Repatriation and Provenance Protocols
  cefr_level: C1
  category: stakeholder_alignment
  scenario_context: Senior museum curator Jonathan and cultural heritage jurist Serra confer over contested provenance documentation,
    reciprocal loan frameworks, and ethical restitution guidelines for antiquities.
  speakers:
  - id: jonathan
    name: Jonathan
    role: Senior Antiquities Curator
    accent: British
  - id: serra
    name: Serra
    role: International Cultural Heritage Jurist
    accent: Turkish
  audio_ref: audio/listening/c1_museum_curation_indigenous_artifacts.mp3
  duration_seconds: 78
  transcript_items:
  - index: 1
    speaker_id: jonathan
    start_ms: 0
    end_ms: 9523
    text_en: Serra, thank you for reviewing our classical Aegean statuary archive. Our board of trustees is committed to navigating
      provenance inquiries with absolute ethical rigor.
    text_tr: Serra, klasik Ege heykelleri arşivimizi incelediğin için teşekkür ederim. Mütevelli heyetimiz köken araştırmalarını
      mutlak etik titizlikle yürütmeye kararlıdır.
  - index: 2
    speaker_id: serra
    start_ms: 9923
    end_ms: 20415
    text_en: It is an essential endeavor, Jonathan. The legal landscape has shifted irreversibly from nineteen-seventy UNESCO
      compliance toward proactive decolonization and bilateral restitution.
    text_tr: Bu çok önemli bir girişim Jonathan. Hukuki zemin bin dokuz yüz yetmiş UNESCO uyumluluğundan proaktif dekolonizasyon
      ve ikili iadelere doğru geri döndürülemez biçimde değişti.
  - index: 3
    speaker_id: jonathan
    start_ms: 20815
    end_ms: 29633
    text_en: Specifically, we are examining the provenance file for the fourth-century BCE marble votive frieze acquired through
      a Geneva antiquities dealership in nineteen eighty-four.
    text_tr: Özellikle, bin dokuz yüz seksen dört yılında bir Cenevre antikacılık bayisi aracılığıyla edinilen MÖ dördüncü
      yüzyıl mermer adak frizinin köken dosyasını inceliyoruz.
  - index: 4
    speaker_id: serra
    start_ms: 30033
    end_ms: 42244
    text_en: The export documentation in that archive relies on a notarized declaration that recent isotopic marble analysis
      directly contradicts. The strontium isotope ratios map conclusively to an Anatolian quarry site.
    text_tr: Bu arşivdeki ihracat belgeleri son izotopik mermer analizinin doğrudan çürüttüğü noter tasdikli bir beyana dayanıyor.
      Stronsiyum izotop oranları kesin olarak bir Anadolu taş ocağı sahasıyla eşleşiyor.
  - index: 5
    speaker_id: jonathan
    start_ms: 42644
    end_ms: 48563
    text_en: Which suggests illicit excavation and clandestine smuggling prior to its arrival in Swiss art trade circles.
    text_tr: Bu da İsviçre sanat ticareti çevrelerine ulaşmadan önce yasadışı kazı ve gizli kaçakçılığa işaret ediyor.
  - index: 6
    speaker_id: serra
    start_ms: 48963
    end_ms: 60609
    text_en: Indubitably. A confrontational legal dispute will generate reputational damage. Instead, I recommend proposing
      a collaborative bilateral cultural heritage partnership with the origin ministry.
    text_tr: Kuşkusuz. Çatışmacı bir hukuki ihtilaf itibar kaybı yaratacaktır. Bunun yerine, menşe bakanlığıyla işbirlikçi
      ikili bir kültürel miras ortaklığı önermenizi tavsiye ederim.
  - index: 7
    speaker_id: jonathan
    start_ms: 61009
    end_ms: 70267
    text_en: Whereby legal title unconditionally transfers back to the source nation, while the physical frieze remains on
      reciprocal long-term loan with collaborative conservation exchanges?
    text_tr: Yani yasal mülkiyet koşulsuz olarak kaynak ülkeye geri devredilirken, fiziki friz işbirlikçi koruma değişimleriyle
      karşılıklı uzun vadeli ödünçte mi kalacak?
  - index: 8
    speaker_id: serra
    start_ms: 70667
    end_ms: 77270
    text_en: Precisely. That framework converts a historical injustice into an enduring international scholarly alliance.
    text_tr: Kesinlikle. Bu çerçeve tarihsel bir adaletsizliği kalıcı bir uluslararası akademik ittifaka dönüştürür.
  comprehension_questions:
  - id: q_listening_c1_museum-curation-indigenous-artifacts_01
    question_en: What scientific evidence contradicted the museum's historic acquisition paperwork?
    question_tr_hint: Müzenin tarihi edinim belgeleriyle hangi bilimsel kanıt çelişti?
    options:
    - Carbon dating revealed the statue was constructed from modern synthetic plastic.
    - Infrared photography showed signature stamps from an Italian tourist gift shop.
    - Microscopic examination revealed machine-tooled CNC cutting patterns.
    - Strontium isotope ratios in the marble conclusively matched an Anatolian quarry rather than documented origin.
    correct_answer: Strontium isotope ratios in the marble conclusively matched an Anatolian quarry rather than documented
      origin.
    explanation_en: Serra highlights that strontium isotope ratios conclusively map to an Anatolian quarry.
    explanation_tr: Serra mermerdeki stronsiyum izotop analizinin eserin Anadolu menşeini kanıtladığını belirtir.
  - id: q_listening_c1_museum-curation-indigenous-artifacts_02
    question_en: Why does Serra advise against pursuing a formal court litigation battle?
    question_tr_hint: Serra neden resmi bir mahkeme davası açılmasını tavsiye etmiyor?
    options:
    - The statue possesses negative spiritual curses that affect courtroom judges.
    - Public litigation creates severe reputational damage compared to collaborative partnership.
    - Attorneys fees would exceed the entire national gross domestic product.
    - International courts have ceased all legal adjudication globally.
    correct_answer: Public litigation creates severe reputational damage compared to collaborative partnership.
    explanation_en: Serra warns that a confrontational legal dispute generates severe reputational damage.
    explanation_tr: Serra çatışmacı bir hukuki sürecin ciddi itibar kaybı yaratacağı konusunda uyarır.
  - id: q_listening_c1_museum-curation-indigenous-artifacts_03
    question_en: What collaborative solution does Jonathan formulate based on Serra's counsel?
    question_tr_hint: Jonathan Serra'nın tavsiyesi üzerine nasıl bir işbirlikçi çözüm formüle ediyor?
    options:
    - Melting the marble frieze down to build museum cafeteria countertops.
    - Transferring full legal ownership to origin authorities while retaining reciprocal loan and conservation exchanges.
    - Selling the artwork at an unreserved international auction to highest private bidder.
    - Burying the statue in a deep concrete vault to evade public scrutiny.
    correct_answer: Transferring full legal ownership to origin authorities while retaining reciprocal loan and conservation
      exchanges.
    explanation_en: Jonathan suggests transferring legal title while maintaining reciprocal long-term loans.
    explanation_tr: Jonathan mülkiyetin devredilip eserin karşılıklı uzun vadeli ödünçte kalmasını önerir.
  - id: q_listening_c1_museum-curation-indigenous-artifacts_04
    question_en: In what decade was the controversial marble frieze originally acquired by the museum?
    question_tr_hint: Tartışmalı mermer friz müze tarafından ilk olarak hangi on yılda edinilmişti?
    options:
    - The nineteen-eighties (specifically 1984).
    - The nineteen-twenties.
    - The late nineteen-fifties.
    - The early eighteen-hundreds.
    correct_answer: The nineteen-eighties (specifically 1984).
    explanation_en: Jonathan specifies the frieze was acquired in 1984 through a Geneva dealer.
    explanation_tr: Jonathan frizin 1984 yılında bir Cenevre bayisi aracılığıyla alındığını belirtir.
  - id: q_listening_c1_museum-curation-indigenous-artifacts_05
    question_en: How has the broader legal and cultural landscape regarding antiquities shifted according to Serra?
    question_tr_hint: Serra'ya göre antik eserlere ilişkin daha geniş hukuki ve kültürel zemin nasıl değişti?
    options:
    - Toward abolishing all scientific provenance testing on cultural antiquities.
    - Toward banning all international travel for museum curatorial personnel.
    - From mere treaty compliance toward proactive restitution and cultural decolonization.
    - Toward the complete privatized commercialization of all public heritage.
    correct_answer: From mere treaty compliance toward proactive restitution and cultural decolonization.
    explanation_en: Serra notes the shift from 1970 UNESCO compliance toward proactive decolonization and restitution.
    explanation_tr: Serra UNESCO uyumundan proaktif iade ve dekolonizasyona doğru bir kayma olduğunu açıklar.
