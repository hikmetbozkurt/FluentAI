- id: listening.c1.crisis-communications-data-breach
  title: Formulating Executive Crisis Communications for Security Breaches
  cefr_level: C1
  category: incident_response
  scenario_context: Strategic communications director Patricia and Chief Information Security Officer Burak draft public disclosure
    disclosures and regulatory notifications following an unauthorized API extraction incident.
  speakers:
  - id: patricia
    name: Patricia
    role: VP of Strategic Communications
    accent: American
  - id: burak
    name: Burak
    role: Chief Information Security Officer
    accent: Turkish
  audio_ref: audio/listening/c1_crisis_communications_data_breach.mp3
  duration_seconds: 75
  transcript_items:
  - index: 1
    speaker_id: patricia
    start_ms: 0
    end_ms: 9762
    text_en: Burak, the executive committee convenes in forty-five minutes. We need absolute clarity on the scope of the incident
      before wire services start running speculative headlines.
    text_tr: Burak, icra kurulu kırk beş dakika içinde toplanıyor. Haber ajansları spekülatif başlıklar atmaya başlamadan
      önce olayın kapsamı konusunda mutlak netliğe ihtiyacımız var.
  - index: 2
    speaker_id: burak
    start_ms: 10162
    end_ms: 21104
    text_en: Understood, Patricia. At two-fifteen UTC, our automated anomaly detection flagged an unauthorized scraping cluster
      exploiting an authenticated API rate-limiting vulnerability.
    text_tr: Anlaşıldı Patricia. Saat 02:15 UTC'de otomatik anomali tespit sistemimiz, kimliği doğrulanmış bir API hız sınırlama
      açığından yararlanan yetkisiz bir kazıma kümesini işaretledi.
  - index: 3
    speaker_id: patricia
    start_ms: 21504
    end_ms: 31042
    text_en: Was personal identifiable information compromised, and does this trigger the statutory seventy-two-hour GDPR
      European Data Protection Board notification threshold?
    text_tr: Kişisel olarak tanımlanabilir bilgiler tehlikeye girdi mi ve bu durum yasal yetmiş iki saatlik GDPR Avrupa Veri
      Koruma Kurulu bildirim eşiğini tetikliyor mu?
  - index: 4
    speaker_id: burak
    start_ms: 31442
    end_ms: 40645
    text_en: Forensic log analysis indicates that salted-and-hashed passwords and financial payment instruments remained completely
      uncompromised inside our hardware security module vault.
    text_tr: Adli bilişim kayıt analizi, tuzlanmış ve özetlenmiş parolalar ile finansal ödeme araçlarının donanım güvenlik
      modülü kasamızda tamamen güvende kaldığını gösteriyor.
  - index: 5
    speaker_id: patricia
    start_ms: 41045
    end_ms: 45878
    text_en: What specific data was exfiltrated by the threat actor during the three-hour egress window?
    text_tr: Üç saatlik veri çıkış penceresi sırasında tehdit aktörü tarafından tam olarak hangi veriler sızdırıldı?
  - index: 6
    speaker_id: burak
    start_ms: 46278
    end_ms: 56515
    text_en: The adversary extracted approximately forty thousand enterprise profile records containing publicly indexed business
      email addresses, job titles, and hashed corporate domain identifiers.
    text_tr: Saldırgan; herkese açık olarak dizinlenmiş iş e-posta adreslerini, unvanları ve karma kurumsal alan adı tanımlayıcılarını
      içeren yaklaşık kırk bin kurumsal profil kaydını çıkardı.
  - index: 7
    speaker_id: patricia
    start_ms: 56915
    end_ms: 66348
    text_en: That substantially mitigates our catastrophic liability profile. We will structure our disclosure around transparent
      remediation rather than evasive corporate obfuscation.
    text_tr: Bu durum felaket niteliğindeki sorumluluk profilimizi önemli ölçüde hafifletiyor. Açıklamamızı kaçamak kurumsal
      gizleme yerine şeffaf iyileştirme etrafında yapılandıracağız.
  - index: 8
    speaker_id: burak
    start_ms: 66748
    end_ms: 74670
    text_en: We have already revoked all associated session tokens, patched the vulnerable endpoints, and rotated our microservice
      cryptographic keys.
    text_tr: İlişkili tüm oturum belirteçlerini iptal ettik, savunmasız uç noktaları yamaladık ve mikro hizmet kriptografik
      anahtarlarımızı rotasyona tabi tuttuk.
  comprehension_questions:
  - id: q_listening_c1_crisis-communications-data-breach_01
    question_en: What security vulnerability enabled the unauthorized data extraction?
    question_tr_hint: Yetkisiz veri çıkarımına hangi güvenlik açığı olanak sağladı?
    options:
    - An unencrypted backup tape misplaced in a public airport terminal.
    - A physical break-in into the main data center server room.
    - An authenticated API rate-limiting configuration loophole exploited by automated scrapers.
    - A rogue employee manually copying files onto USB flash drives.
    correct_answer: An authenticated API rate-limiting configuration loophole exploited by automated scrapers.
    explanation_en: Burak explains that scrapers exploited an authenticated API rate-limiting vulnerability.
    explanation_tr: Burak, kazıyıcıların kimliği doğrulanmış bir API hız sınırlama açığından yararlandığını belirtir.
  - id: q_listening_c1_crisis-communications-data-breach_02
    question_en: What critical user security data remained fully safeguarded in the security vault?
    question_tr_hint: Güvenlik kasasında hangi kritik kullanıcı güvenliği verileri tamamen korunmuş olarak kaldı?
    options:
    - Unclassified corporate promotional event flyers.
    - Salted-and-hashed passwords and financial payment instrument records.
    - Public marketing press releases and social media posts.
    - Employee payroll compensation spreadsheets.
    correct_answer: Salted-and-hashed passwords and financial payment instrument records.
    explanation_en: Burak confirms hashed passwords and financial payment instruments remained completely uncompromised.
    explanation_tr: Burak, tuzlanmış şifrelerin ve ödeme araçlarının donanım kasasında güvende kaldığını teyit eder.
  - id: q_listening_c1_crisis-communications-data-breach_03
    question_en: What was the exact composition of the data exfiltrated during the incident?
    question_tr_hint: Olay sırasında sızdırılan verilerin tam içeriği neydi?
    options:
    - Patient healthcare genetic diagnostic histories.
    - Biometric retinal scan records of all European citizens.
    - Top-secret national military defense coordinates.
    - Approximately forty thousand enterprise profiles containing public business emails, titles, and domain hashes.
    correct_answer: Approximately forty thousand enterprise profiles containing public business emails, titles, and domain
      hashes.
    explanation_en: Burak reports 40,000 enterprise profiles with public business emails, titles, and domain hashes were taken.
    explanation_tr: Burak, 40 bin kurumsal profilin (iş e-postaları, unvanlar, alan adı özetleri) sızdığını açıklar.
  - id: q_listening_c1_crisis-communications-data-breach_04
    question_en: What strategic posture does Patricia select for the upcoming public disclosure?
    question_tr_hint: Patricia yaklaşan kamuoyu açıklaması için nasıl bir stratejik tutum seçiyor?
    options:
    - Blaming competitor technology companies for fabricating false claims.
    - Permanently deleting all corporate social media and public relations channels.
    - Proactive and transparent disclosure highlighting swift technical remediation.
    - Denying all knowledge of the event until legal injunctions force disclosure.
    correct_answer: Proactive and transparent disclosure highlighting swift technical remediation.
    explanation_en: Patricia chooses transparent remediation over evasive corporate obfuscation.
    explanation_tr: Patricia kaçamak gizleme yerine şeffaf iyileştirme odaklı bir açıklama seçer.
  - id: q_listening_c1_crisis-communications-data-breach_05
    question_en: What immediate technical remediation did Burak's team enact?
    question_tr_hint: Burak'ın ekibi hangi acil teknik iyileştirmeyi gerçekleştirdi?
    options:
    - Shutting down the global electrical power grid entirely.
    - Destroying all enterprise server hard drives with industrial shredders.
    - Reverting corporate infrastructure back to paper-based filing cabinets.
    - Revoking session tokens, deploying API endpoint patches, and rotating microservice crypto keys.
    correct_answer: Revoking session tokens, deploying API endpoint patches, and rotating microservice crypto keys.
    explanation_en: Burak confirms tokens were revoked, endpoints patched, and crypto keys rotated.
    explanation_tr: Burak oturumların iptal edildiğini, açıkların yamandığını ve anahtarların yenilendiğini belirtir.
  topic_tags:
  - communication
  - leadership
- id: listening.c1.technical-fellow-executive-briefing
  title: Briefing Leadership on AI Compute Infrastructure and Microarchitectures
  cefr_level: C1
  category: executive_briefing
  scenario_context: Principal AI Research Scientist Melis briefs Chief Technology Officer Greg on high-bandwidth memory interconnects,
    accelerator cluster utilization, and capital expenditure forecasts.
  speakers:
  - id: greg
    name: Greg
    role: Chief Technology Officer
    accent: American
  - id: melis
    name: Melis
    role: Distinguished Technical Fellow
    accent: Turkish
  audio_ref: audio/listening/c1_technical_fellow_executive_briefing.mp3
  duration_seconds: 77
  transcript_items:
  - index: 1
    speaker_id: greg
    start_ms: 0
    end_ms: 11387
    text_en: Melis, the board is questioning our projected fifty-million-dollar capital outlay for next-generation accelerator
      hardware. They want to know why our current GPU clusters cannot sustain model fine-tuning.
    text_tr: Melis, yönetim kurulu yeni nesil hızlandırıcı donanımı için öngörülen elli milyon dolarlık sermaye harcamamızı
      sorguluyor. Mevcut GPU kümelerimizin neden model ince ayarını sürdüremediğini bilmek istiyorlar.
  - index: 2
    speaker_id: melis
    start_ms: 11787
    end_ms: 24329
    text_en: The core constraint is not raw floating-point operations per second, Greg; it is the memory-wall bottleneck.
      Our trillion-parameter multimodal models require high-bandwidth memory interconnects that exceed PCIe bandwidth.
    text_tr: Temel kısıtlama saniye başına ham kayan nokta işlemleri değil Greg; bellek duvarı darboğazıdır. Trilyon parametreli
      çok modlu modellerimiz, PCIe bant genişliğini aşan yüksek bant genişlikli bellek ara bağlantıları gerektirir.
  - index: 3
    speaker_id: greg
    start_ms: 24729
    end_ms: 30917
    text_en: Meaning that our tensor processing cores spend substantial cycles sitting idle waiting for memory cache lines
      to refill?
    text_tr: Yani tensör işleme çekirdeklerimiz bellek önbellek satırlarının yeniden dolmasını beklerken önemli sayıda döngüyü
      boşta mı geçiriyor?
  - index: 4
    speaker_id: melis
    start_ms: 31317
    end_ms: 44448
    text_en: Precisely. Our Model Flops Utilization is hovering at twenty-eight percent. Transitioning to custom ASIC accelerators
      with HBM3e stacks and liquid-cooled optical interconnects will elevate MFU to sixty-two percent.
    text_tr: Kesinlikle. Model Flops Kullanım oranımız yüzde yirmi sekizde seyrediyor. HBM3e yığınlarına ve sıvı soğutmalı
      optik ara bağlantılara sahip özel ASIC hızlandırıcılarına geçmek MFU'yu yüzde altmış ikiye çıkaracaktır.
  - index: 5
    speaker_id: greg
    start_ms: 44848
    end_ms: 49782
    text_en: More than doubling our effective computational throughput per watt of datacenter power consumed.
    text_tr: Tüketilen veri merkezi gücünün watt'ı başına etkin hesaplama verimimizi iki katından fazla artıracak.
  - index: 6
    speaker_id: melis
    start_ms: 50182
    end_ms: 62444
    text_en: Correct. Furthermore, by partitioning KV-cache memory across distributed non-volatile storage, we can scale context
      windows from thirty-two thousand tokens up to one million tokens without out-of-memory faults.
    text_tr: Doğru. Dahası, KV önbellek belleğini dağıtık kalıcı depolama boyunca bölümleyerek, bellek yetersizliği hataları
      olmaksızın bağlam pencerelerini otuz iki bin belirteçten bir milyon belirtece kadar ölçeklendirebiliriz.
  - index: 7
    speaker_id: greg
    start_ms: 62844
    end_ms: 67262
    text_en: What is the lead time on procurement and fabrication from our foundry partners?
    text_tr: Dökümhane ortaklarımızdan tedarik ve üretim için teslim süresi nedir?
  - index: 8
    speaker_id: melis
    start_ms: 67662
    end_ms: 76745
    text_en: If we place wafer allocation deposits this quarter, initial cluster rack integration begins in nine months, allowing
      production deployment before fiscal year-end.
    text_tr: Bu çeyrekte plaka tahsis depozitolarını yatırırsak, ilk küme kabin entegrasyonu dokuz ay içinde başlar ve mali
      yıl sonundan önce üretime geçişe olanak tanır.
  comprehension_questions:
  - id: q_listening_c1_technical-fellow-executive-briefing_01
    question_en: What architectural bottleneck prevents existing GPU clusters from efficiently training trillion-parameter
      models?
    question_tr_hint: Mevcut GPU kümelerinin trilyon parametreli modelleri verimli şekilde eğitmesini hangi mimari darboğaz
      engelliyor?
    options:
    - The memory-wall constraint where data bus throughput fails to feed tensor compute cores rapidly.
    - Excessive processor fan noise exceeding occupational health thresholds.
    - A complete lack of electrical wiring in modern enterprise server facilities.
    - An incompatible operating system kernel that cannot execute binary files.
    correct_answer: The memory-wall constraint where data bus throughput fails to feed tensor compute cores rapidly.
    explanation_en: Melis explains the constraint is the memory-wall bottleneck exceeding PCIe bandwidth.
    explanation_tr: Melis, temel kısıtlamanın PCIe bant genişliğini aşan bellek duvarı darboğazı olduğunu açıklar.
  - id: q_listening_c1_technical-fellow-executive-briefing_02
    question_en: What quantitative improvement in Model Flops Utilization (MFU) does Melis forecast?
    question_tr_hint: Melis Model Flops Kullanımında (MFU) nasıl bir niceliksel iyileşme öngörüyor?
    options:
    - A tenfold decrease in computational algorithmic efficiency.
    - A reduction down to zero percent during scheduled maintenance.
    - An increase from twenty-eight percent up to sixty-two percent.
    - A marginal rise from ninety-eight to ninety-nine percent.
    correct_answer: An increase from twenty-eight percent up to sixty-two percent.
    explanation_en: Melis states MFU will jump from 28% to 62% with custom ASICs and HBM3e.
    explanation_tr: Melis MFU'nun %28'den %62'ye yükseleceğini belirtir.
  - id: q_listening_c1_technical-fellow-executive-briefing_03
    question_en: How will distributed KV-cache partitioning impact model capabilities?
    question_tr_hint: Dağıtık KV önbellek bölümlemesi model yeteneklerini nasıl etkileyecek?
    options:
    - It will compress all text documents into binary Morse code.
    - It will restrict language models to single-sentence responses.
    - It will expand context windows from 32,000 tokens to one million tokens without memory overflow.
    - It will permanently prevent models from learning foreign languages.
    correct_answer: It will expand context windows from 32,000 tokens to one million tokens without memory overflow.
    explanation_en: Melis explains it scales context windows from 32k tokens up to 1 million tokens.
    explanation_tr: Melis bağlam penceresinin 32 bin belirteçten 1 milyon belirtece ölçekleneceğini ifade eder.
  - id: q_listening_c1_technical-fellow-executive-briefing_04
    question_en: What thermodynamic innovation is incorporated into the proposed accelerator architecture?
    question_tr_hint: Önerilen hızlandırıcı mimarisine hangi termodinamik yenilik dahil edilmiştir?
    options:
    - Liquid-cooled optical interconnects accompanying HBM3e high-bandwidth memory stacks.
    - Attaching manual hand-cranked ventilation fans to server doors.
    - Operating servers exclusively in outer-space vacuum orbits.
    - Submerging servers in Arctic glacial ice packs.
    correct_answer: Liquid-cooled optical interconnects accompanying HBM3e high-bandwidth memory stacks.
    explanation_en: Melis highlights HBM3e stacks paired with liquid-cooled optical interconnects.
    explanation_tr: Melis HBM3e yığınları ve sıvı soğutmalı optik ara bağlantıları vurgular.
  - id: q_listening_c1_technical-fellow-executive-briefing_05
    question_en: What operational timeline governs the delivery of the new compute cluster?
    question_tr_hint: Yeni bilgi işlem kümesinin teslimatını hangi operasyonel takvim yönetiyor?
    options:
    - Deployment will occur indefinitely after corporate dissolution.
    - Rack integration commences in nine months, achieving deployment within the fiscal year.
    - Fabrication will require fifteen consecutive calendar years.
    - Hardware delivery arrives by tomorrow afternoon via overnight courier.
    correct_answer: Rack integration commences in nine months, achieving deployment within the fiscal year.
    explanation_en: Melis outlines rack integration in 9 months, enabling deployment before fiscal year-end.
    explanation_tr: Melis kabin entegrasyonunun 9 ayda başlayıp mali yıl bitmeden devreye alınacağını belirtir.
  topic_tags:
  - work_career
  - technology
- id: listening.c1.mergers-acquisitions-due-diligence
  title: Evaluating Strategic Cross-Border FinTech Mergers & Acquisitions
  cefr_level: C1
  category: negotiation
  scenario_context: Private equity investment partner Simon and acquisition lead Yasemin evaluate regulatory anti-trust exposure,
    customer churn metrics, and intellectual property indemnification in a cross-border deal.
  speakers:
  - id: simon
    name: Simon
    role: Private Equity Partner
    accent: British
  - id: yasemin
    name: Yasemin
    role: M&A Strategy Lead
    accent: Turkish
  audio_ref: audio/listening/c1_mergers_acquisitions_due_diligence.mp3
  duration_seconds: 76
  transcript_items:
  - index: 1
    speaker_id: simon
    start_ms: 0
    end_ms: 10018
    text_en: Yasemin, our investment committee sits in forty-eight hours to decide whether to tender our formal offer for
      BalticPay. Have your due diligence workstreams uncovered any deal-breakers?
    text_tr: Yasemin, yatırım komitemiz BalticPay için resmi teklifimizi sunup sunmayacağımıza karar vermek üzere kırk sekiz
      saat içinde toplanıyor. Durum tespiti çalışma gruplarınız herhangi bir anlaşmayı bozacak pürüz ortaya çıkardı mı?
  - index: 2
    speaker_id: yasemin
    start_ms: 10418
    end_ms: 21849
    text_en: 'We haven''t uncovered outright fraud, Simon, but there are two significant valuation adjustments we must account
      for: recurring customer churn and regulatory exposure under the revised Payment Services Directive.'
    text_tr: 'Açık bir dolandırıcılık tespit etmedik Simon, ancak hesaba katmamız gereken iki önemli değerleme düzeltmesi
      var: tekrarlayan müşteri kaybı ve revize edilmiş Ödeme Hizmetleri Direktifi kapsamındaki düzenleyici risk.'
  - index: 3
    speaker_id: simon
    start_ms: 22249
    end_ms: 30098
    text_en: Let's unpack customer churn first. Their pitch deck claimed ninety-four percent net revenue retention across
      Nordic enterprise merchants.
    text_tr: Önce müşteri kaybını ele alalım. Sunum dosyaları İskandinav kurumsal üye işyerleri genelinde yüzde doksan dört
      net gelir elde tutma oranı iddia ediyordu.
  - index: 4
    speaker_id: yasemin
    start_ms: 30498
    end_ms: 41979
    text_en: Our forensic cohort analysis revealed that tier-one merchant retention is masked by heavy discounts. Once promotional
      interchange subsidies lapse, underlying gross merchant churn spikes to eighteen percent.
    text_tr: Adli kohort analizimiz, birinci sınıf üye işyeri elde tutma oranının ağır indirimlerle maskelendiğini ortaya
      koydu. Promosyonel takas sübvansiyonları sona erdiğinde, altta yatan brüt üye işyeri kaybı yüzde on sekize fırlıyor.
  - index: 5
    speaker_id: simon
    start_ms: 42379
    end_ms: 49873
    text_en: That substantially dampens our terminal EBITDA multiple expectations. What about their regulatory capital compliance?
    text_tr: Bu durum nihai FAVÖK çarpanı beklentilerimizi önemli ölçüde zayıflatıyor. Peki ya düzenleyici sermaye uyumları?
  - index: 6
    speaker_id: yasemin
    start_ms: 50273
    end_ms: 60910
    text_en: The European Banking Authority is probing their cross-border remittance corridor into non-EEA jurisdictions.
      They have under-provisioned anti-money laundering reserves by approximately twelve million euros.
    text_tr: Avrupa Bankacılık Otoritesi, AEA dışı yargı bölgelerine yönelik sınır ötesi havale koridorlarını inceliyor. Kara
      para aklamayı önleme karşılıklarını yaklaşık on iki milyon avro eksik ayırmışlar.
  - index: 7
    speaker_id: simon
    start_ms: 61310
    end_ms: 66153
    text_en: That necessitates a substantial purchase price haircut and an escrow indemnity holdback.
    text_tr: Bu da satın alma fiyatında ciddi bir indirim ve bir emanet tazminat kesintisi gerektirir.
  - index: 8
    speaker_id: yasemin
    start_ms: 66553
    end_ms: 75401
    text_en: I recommend shaving thirty million euros off the enterprise valuation and conditioning twenty percent of the
      cash consideration on an eighteen-month regulatory indemnity escrow.
    text_tr: Firma değerinden otuz milyon avro kırpılmasını ve nakit bedelin yüzde yirmisinin on sekiz aylık bir düzenleyici
      tazminat emanetine bağlanmasını öneriyorum.
  comprehension_questions:
  - id: q_listening_c1_mergers-acquisitions-due-diligence_01
    question_en: What discrepancy did forensic cohort analysis reveal regarding BalticPay's merchant retention?
    question_tr_hint: Adli kohort analizi BalticPay'in üye işyeri elde tutma oranına ilişkin hangi tutarsızlığı ortaya çıkardı?
    options:
    - Merchant retention was artificially inflated by fabricating fictitious transactions.
    - BalticPay was processing transactions without using mathematical addition.
    - All Nordic merchants had terminated their contracts simultaneously last week.
    - Promotional subsidies concealed an underlying gross merchant churn rate of eighteen percent.
    correct_answer: Promotional subsidies concealed an underlying gross merchant churn rate of eighteen percent.
    explanation_en: Yasemin reveals that after promotional subsidies lapse, gross merchant churn spikes to 18%.
    explanation_tr: Yasemin teşvikler bittiğinde gerçek müşteri kaybının %18'e fırladığını ortaya koyar.
  - id: q_listening_c1_mergers-acquisitions-due-diligence_02
    question_en: What regulatory liability did Yasemin uncover during compliance audits?
    question_tr_hint: Yasemin uyum denetimleri sırasında hangi düzenleyici yükümlülüğü ortaya çıkardı?
    options:
    - A mandatory bankruptcy decree signed by European commercial courts.
    - An estimated twelve-million-euro shortfall in anti-money laundering reserves under investigation.
    - An environmental fine for using unrecyclable cardboard envelopes.
    - An unpaid parking ticket issued to BalticPay's delivery bicycles.
    correct_answer: An estimated twelve-million-euro shortfall in anti-money laundering reserves under investigation.
    explanation_en: Yasemin notes the EBA probe and a 12-million-euro under-provisioning in AML reserves.
    explanation_tr: Yasemin kara para aklamayı önleme karşılıklarında 12 milyon avro açık olduğunu belirtir.
  - id: q_listening_c1_mergers-acquisitions-due-diligence_03
    question_en: How does Yasemin propose restructuring the purchase offer to insulate against liabilities?
    question_tr_hint: Yasemin yükümlülüklere karşı korunmak için satın alma teklifini nasıl yeniden yapılandırmayı öneriyor?
    options:
    - Refusing to sign any legal agreements until next decade.
    - Paying double the purchase price in cash to expedite closing.
    - Borrowing money from predatory offshore loan syndicates.
    - Reducing enterprise value by €30M and withholding 20% in an 18-month indemnity escrow.
    correct_answer: Reducing enterprise value by €30M and withholding 20% in an 18-month indemnity escrow.
    explanation_en: Yasemin recommends shaving €30M off valuation and putting 20% in an 18-month indemnity escrow.
    explanation_tr: Yasemin değerlemeden 30 milyon avro düşülmesini ve %20'nin emanet hesabında tutulmasını önerir.
  - id: q_listening_c1_mergers-acquisitions-due-diligence_04
    question_en: How do these due diligence findings impact Simon's financial projections?
    question_tr_hint: Bu durum tespiti bulguları Simon'ın finansal projeksiyonlarını nasıl etkiliyor?
    options:
    - They guarantee an immediate guaranteed return of ten thousand percent.
    - They force the immediate retirement of all private equity general partners.
    - They significantly lower the anticipated terminal EBITDA multiple upon eventual exit.
    - They eliminate all taxes owed by the private equity firm permanently.
    correct_answer: They significantly lower the anticipated terminal EBITDA multiple upon eventual exit.
    explanation_en: Simon notes the findings substantially dampen terminal EBITDA multiple expectations.
    explanation_tr: Simon bulguların nihai FAVÖK çarpanı beklentilerini önemli ölçüde düşürdüğünü söyler.
  - id: q_listening_c1_mergers-acquisitions-due-diligence_05
    question_en: When must the private equity investment committee reach a conclusive decision?
    question_tr_hint: Özel sermaye yatırım komitesi ne zaman nihai bir karara varmak zorundadır?
    options:
    - Before this morning's financial markets close at noon.
    - In exactly three business years.
    - Following the complete restructuring of European banking legislation.
    - Within forty-eight hours.
    correct_answer: Within forty-eight hours.
    explanation_en: Simon opens by stating the investment committee sits in forty-eight hours.
    explanation_tr: Simon komitenin kırk sekiz saat içinde toplanacağını belirtir.
  topic_tags:
