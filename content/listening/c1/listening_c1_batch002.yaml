- id: listening.c1.smart-home-iot-integration
  title: Architecting Heterogeneous Smart Home IoT Standards
  cefr_level: C1
  category: product_discovery
  scenario_context: Selin, an IoT systems architect, consults with Marcus, a firmware engineering lead, about unifying disparate
    Zigbee, Thread, and Matter protocols across consumer hardware ecosystems.
  speakers:
  - id: marcus
    name: Marcus
    role: Lead Embedded Firmware Engineer
    accent: American
  - id: selin
    name: Selin
    role: Principal IoT Architect
    accent: Turkish
  audio_ref: audio/listening/c1_smart_home_iot_integration.mp3
  duration_seconds: 76
  transcript_items:
  - index: 1
    speaker_id: marcus
    start_ms: 0
    end_ms: 9632
    text_en: Selin, looking at our upcoming appliance firmware roadmap, our dual-stack Zigbee and Bluetooth architecture is
      struggling to maintain low latency when bridging to Matter over Thread.
    text_tr: Selin, yaklaşan cihaz bellenimi yol haritamıza baktığımızda, ikili Zigbee ve Bluetooth mimarimiz Matter over
      Thread köprüsüne geçerken düşük gecikmeyi korumakta zorlanıyor.
  - index: 2
    speaker_id: selin
    start_ms: 10032
    end_ms: 20590
    text_en: I anticipated this bottleneck. Matter relies heavily on IPv6 routing throughout the mesh, whereas our legacy
      Zigbee clusters depend on application-layer gateway translation.
    text_tr: Bu darboğazı öngörmüştüm. Matter, mesh ağı boyunca büyük ölçüde IPv6 yönlendirmesine dayanır, oysa eski Zigbee
      kümelerimiz uygulama katmanı ağ geçidi çevirisine bağımlıdır.
  - index: 3
    speaker_id: marcus
    start_ms: 20990
    end_ms: 31532
    text_en: Exactly. When the gateway translates Zigbee cluster libraries into Matter data models, we observe intermittent
      packet drops and round-trip times exceeding six hundred milliseconds.
    text_tr: Kesinlikle. Ağ geçidi Zigbee küme kütüphanelerini Matter veri modellerine dönüştürürken, kesintili paket kayıpları
      ve altı yüz milisaniyeyi aşan gidiş-dönüş süreleri gözlemliyoruz.
  - index: 4
    speaker_id: selin
    start_ms: 31932
    end_ms: 40574
    text_en: We should deprecate direct proprietary bridging. Instead, we can implement an OpenThread Border Router daemon
      directly on our primary hub chipset.
    text_tr: Doğrudan tescilli köprülemeyi kullanımdan kaldırmalıyız. Bunun yerine, ana hub yonga setimiz üzerinde doğrudan
      bir OpenThread Border Router arka plan programı uygulamalıyız.
  - index: 5
    speaker_id: marcus
    start_ms: 40974
    end_ms: 48712
    text_en: That would allow Thread-enabled endpoint devices to establish end-to-end encrypted IP sessions without packet
      payload re-encoding at the gateway boundary.
    text_tr: Bu, Thread özellikli uç cihazların ağ geçidi sınırında paket yükü yeniden kodlamasına gerek kalmadan uçtan uca
      şifrelenmiş IP oturumları kurmasına olanak tanır.
  - index: 6
    speaker_id: selin
    start_ms: 49112
    end_ms: 60020
    text_en: Precisely. Furthermore, by offloading Matter commissioning to standard Bluetooth Low Energy advertising, initial
      device onboarding friction drops significantly for non-technical consumers.
    text_tr: Tam olarak öyle. Dahası, Matter devreye alımını standart Bluetooth Düşük Enerji duyurularına devrederek, teknik
      olmayan tüketiciler için ilk cihaz kurulum sürtünmesi önemli ölçüde azalır.
  - index: 7
    speaker_id: marcus
    start_ms: 60420
    end_ms: 66048
    text_en: What about backward compatibility for the half-million legacy Zigbee units currently in customer households?
    text_tr: Peki müşterilerin evlerinde bulunan yarım milyon eski Zigbee ünitesinin geriye dönük uyumluluğu ne olacak?
  - index: 8
    speaker_id: selin
    start_ms: 66448
    end_ms: 75705
    text_en: We will containerize the legacy translation service in isolated flash memory, dedicating dedicated hardware crypto-acceleration
      solely to modern IPv6 traffic.
    text_tr: Eski çeviri hizmetini yalıtılmış flaş bellekte konteynerleştireceğiz ve özel donanım kripto hızlandırmasını yalnızca
      modern IPv6 trafiğine tahsis edeceğiz.
  comprehension_questions:
  - id: q_listening_c1_smart-home-iot-integration_01
    question_en: What architectural divergence causes latency between Zigbee and Matter?
    question_tr_hint: Zigbee ve Matter arasındaki gecikmeye hangi mimari farklılık neden oluyor?
    options:
    - Matter operates natively over IPv6 mesh routing, whereas legacy Zigbee relies on application-layer gateway translation.
    - Matter disables all encryption protocols to prioritize raw transmission speed.
    - Zigbee lacks radio transmitters capable of broadcasting electromagnetic waves.
    - Zigbee requires high-voltage power lines while Matter runs on solar energy.
    correct_answer: Matter operates natively over IPv6 mesh routing, whereas legacy Zigbee relies on application-layer gateway
      translation.
    explanation_en: Selin explains that Matter utilizes IPv6 mesh routing while Zigbee requires gateway translation.
    explanation_tr: Selin, Matter'ın IPv6 yönlendirmesi kullandığını, Zigbee'nin ise ağ geçidi çevirisi gerektirdiğini belirtir.
  - id: q_listening_c1_smart-home-iot-integration_02
    question_en: What specific component does Selin propose implementing on the main hub?
    question_tr_hint: Selin ana hub üzerinde hangi özel bileşenin uygulanmasını öneriyor?
    options:
    - An OpenThread Border Router daemon running directly on the primary hub chipset.
    - An external analog modem connected via dial-up phone lines.
    - A liquid cooling system for battery thermal regulation.
    - A manual physical toggle switch for alternating between radios.
    correct_answer: An OpenThread Border Router daemon running directly on the primary hub chipset.
    explanation_en: Selin suggests embedding an OpenThread Border Router daemon on the chipset.
    explanation_tr: Selin, yonga seti üzerinde bir OpenThread Border Router arka plan programı çalıştırmayı önerir.
  - id: q_listening_c1_smart-home-iot-integration_03
    question_en: How does offloading onboarding to Bluetooth Low Energy improve consumer experience?
    question_tr_hint: Kurulumun BLE'ye aktarılması tüketici deneyimini nasıl iyileştirir?
    options:
    - It automatically registers the device with international patent authorities.
    - It minimizes device onboarding friction during initial setup for non-technical users.
    - It guarantees infinite battery life across all home sensors.
    - It eliminates the need for household electricity during pairing.
    correct_answer: It minimizes device onboarding friction during initial setup for non-technical users.
    explanation_en: Selin notes that using BLE advertising lowers onboarding friction for regular consumers.
    explanation_tr: Selin, BLE kullanımının teknik olmayan kullanıcılar için kurulum sürtünmesini azalttığını açıklar.
  - id: q_listening_c1_smart-home-iot-integration_04
    question_en: How will legacy Zigbee devices maintain support under the revised firmware plan?
    question_tr_hint: Eski Zigbee cihazları revize edilen bellenim planı altında nasıl desteklenmeye devam edecek?
    options:
    - A postal recall program will replace every installed circuit board.
    - Their translation service will be containerized in isolated flash memory alongside dedicated IPv6 crypto-acceleration.
    - Customers will be forced to discard all existing hardware immediately.
    - Legacy units will communicate strictly using audible ultrasonic frequencies.
    correct_answer: Their translation service will be containerized in isolated flash memory alongside dedicated IPv6 crypto-acceleration.
    explanation_en: Selin states the legacy translation service will be containerized in isolated flash memory.
    explanation_tr: Selin, eski çeviri servisinin yalıtılmış bellekte konteynerleştirileceğini belirtir.
  - id: q_listening_c1_smart-home-iot-integration_05
    question_en: What symptom did Marcus observe during payload conversion at the gateway boundary?
    question_tr_hint: Marcus ağ geçidi sınırında veri yükü dönüşümü sırasında hangi belirtiyi gözlemledi?
    options:
    - Intermittent packet loss and round-trip times surpassing six hundred milliseconds.
    - Inversion of screen display colors on domestic mobile devices.
    - Spontaneous hardware combustion in central processing units.
    - Permanent loss of internet connectivity across the entire municipality.
    correct_answer: Intermittent packet loss and round-trip times surpassing six hundred milliseconds.
    explanation_en: Marcus noted packet drops and latency exceeding 600 ms during conversion.
    explanation_tr: Marcus paket kayıpları ve 600 ms'yi aşan gecikmeler gözlemlediğini aktarır.
  topic_tags:
  - technology
  - daily_life
- id: listening.c1.airline-flight-cancellation-rebooking
  title: Managing Cascading Transatlantic Flight Disruptions
  cefr_level: C1
  category: incident_response
  scenario_context: Mert, an international traveler stranded in London due to airspace restrictions, negotiates complex interline
    rerouting, visa waivers, and duty-of-care vouchers with Claire, a premium service duty manager.
  speakers:
  - id: claire
    name: Claire
    role: Premium Airport Duty Manager
    accent: British
  - id: mert
    name: Mert
    role: Enterprise Management Consultant
    accent: Turkish
  audio_ref: audio/listening/c1_airline_flight_cancellation_rebooking.mp3
  duration_seconds: 74
  transcript_items:
  - index: 1
    speaker_id: claire
    start_ms: 0
    end_ms: 9683
    text_en: Good afternoon, Mr. Demir. As you are aware, severe convective weather across the North Atlantic corridor has
      led to widespread ground stops and cancellations.
    text_tr: İyi günler Sayın Demir. Bildiğiniz gibi, Kuzey Atlantik koridoru boyunca etkili olan şiddetli konvektif hava
      koşulları yaygın yer durdurmalarına ve iptallere yol açtı.
  - index: 2
    speaker_id: mert
    start_ms: 10083
    end_ms: 18540
    text_en: I understand the meteorological constraints, Claire, but I have a high-stakes board presentation in Chicago tomorrow
      at nine in the morning local time.
    text_tr: Meteorolojik kısıtlamaları anlıyorum Claire, ancak yarın yerel saatle sabah dokuzda Chicago'da çok kritik bir
      yönetim kurulu sunumum var.
  - index: 3
    speaker_id: claire
    start_ms: 18940
    end_ms: 27543
    text_en: Under our standard carrier policies, the next available direct seat on our metal departs tomorrow evening, which
      clearly will not fulfill your operational schedule.
    text_tr: Standart şirket politikalarımız gereği, kendi uçaklarımızdaki bir sonraki müsait direkt koltuk yarın akşam kalkıyor;
      bu da çalışma programınıza açıkça uymuyor.
  - index: 4
    speaker_id: mert
    start_ms: 27943
    end_ms: 34636
    text_en: Could you invoke an involuntary interline endorsement to route me through Dublin or Frankfurt on a Star Alliance
      partner carrier tonight?
    text_tr: Bu akşam bir Star Alliance ortak taşıyıcısıyla beni Dublin veya Frankfurt üzerinden yönlendirmek için zorunlu
      hatlar arası ciro kuralını işletebilir misiniz?
  - index: 5
    speaker_id: claire
    start_ms: 35036
    end_ms: 44433
    text_en: Because you are traveling on a full-fare business itinerary and hold elite tier status, I can authorize an involuntary
      reroute on Lufthansa via Frankfurt departing in two hours.
    text_tr: Tam ücretli business seyahat ettiğiniz ve elit statüye sahip olduğunuz için, iki saat sonra kalkan Frankfurt
      aktarmalı Lufthansa uçuşuna zorunlu yeniden rota izni verebilirim.
  - index: 6
    speaker_id: mert
    start_ms: 44833
    end_ms: 54916
    text_en: Does that transfer my checked luggage with biometric expedited handling, and will transit through Frankfurt necessitate
      a Schengen transit visa for a Turkish passport with a valid US B1 visa?
    text_tr: Bu işlem biyometrik hızlandırılmış bagajımı da aktarır mı ve geçerli ABD B1 vizesi olan Türk pasaportu için Frankfurt
      transit geçişi Schengen transit vizesi gerektirir mi?
  - index: 7
    speaker_id: claire
    start_ms: 55316
    end_ms: 66323
    text_en: Holding a valid United States visa exempts you from airport transit visa requirements in Frankfurt, provided
      you remain within the international transit concourse. Luggage transfers automatically.
    text_tr: Geçerli bir Amerika Birleşik Devletleri vizesine sahip olmak, uluslararası transit salonunda kalmanız şartıyla
      sizi Frankfurt'ta havalimanı transit vizesi şartından muaf tutar. Bagajınız otomatik aktarılacaktır.
  - index: 8
    speaker_id: mert
    start_ms: 66723
    end_ms: 73676
    text_en: That is a tremendous relief. Please reissue the electronic boarding passes and print the interline baggage tags
      immediately.
    text_tr: Bu muazzam bir rahatlama oldu. Lütfen elektronik biniş kartlarını yeniden düzenleyin ve hatlar arası bagaj etiketlerini
      hemen yazdırın.
  comprehension_questions:
  - id: q_listening_c1_airline-flight-cancellation-rebooking_01
    question_en: Why is the direct flight offered under standard carrier policy unacceptable to Mert?
    question_tr_hint: Standart şirket politikası kapsamında sunulan direkt uçuş Mert için neden kabul edilemez?
    options:
    - It requires him to travel in an unpressurized cargo hold.
    - It reroutes through three unauthorized international jurisdictions.
    - It charges an exorbitant additional baggage surcharge.
    - It departs tomorrow evening, causing him to miss a critical morning board presentation.
    correct_answer: It departs tomorrow evening, causing him to miss a critical morning board presentation.
    explanation_en: Mert explains he has a crucial board presentation tomorrow at 9:00 AM, so tomorrow evening is too late.
    explanation_tr: Mert yarın sabah 9'da sunumu olduğunu, bu yüzden yarın akşamki uçuşun çok geç olduğunu belirtir.
  - id: q_listening_c1_airline-flight-cancellation-rebooking_02
    question_en: What enables Claire to authorize an involuntary interline endorsement on a partner carrier?
    question_tr_hint: Claire'in ortak bir havayolunda zorunlu hatlar arası bilet onaylamasını sağlayan nedir?
    options:
    - Mert's full-fare business itinerary combined with his elite frequent-flyer status.
    - A written presidential emergency decree signed by civil aviation authorities.
    - A mandatory random lottery held at the customer service counter.
    - The complete insolvency and bankruptcy of the original operating airline.
    correct_answer: Mert's full-fare business itinerary combined with his elite frequent-flyer status.
    explanation_en: Claire points out his full-fare business ticket and elite tier status allow the exception.
    explanation_tr: Claire, tam ücretli business bileti ve elit statüsünün bu istisnaya izin verdiğini söyler.
  - id: q_listening_c1_airline-flight-cancellation-rebooking_03
    question_en: Why is Mert exempt from obtaining a Schengen transit visa during his layover in Frankfurt?
    question_tr_hint: Mert Frankfurt'taki aktarma sırasında neden Schengen transit vizesi almaktan muaftır?
    options:
    - All international visa treaties were permanently abolished across Europe.
    - Lufthansa operates a private subterranean tunnel outside legal territory.
    - He is traveling as an accredited ambassador of the United Nations.
    - His valid United States visa waives the transit visa rule while staying in the international concourse.
    correct_answer: His valid United States visa waives the transit visa rule while staying in the international concourse.
    explanation_en: Claire clarifies that holding a valid US visa grants an airport transit visa exemption.
    explanation_tr: Claire, geçerli bir ABD vizesine sahip olmanın uluslararası transit bölgesinde muafiyet sağladığını açıklar.
  - id: q_listening_c1_airline-flight-cancellation-rebooking_04
    question_en: What route does Claire arrange to accommodate Mert's urgent timeline?
    question_tr_hint: Claire Mert'in acil takvimine uyum sağlamak için hangi rotayı düzenler?
    options:
    - A flight connecting through Tokyo and Vancouver arriving two days later.
    - A thirty-hour transoceanic maritime ferry across the Atlantic.
    - A direct supersonic charter flight landing directly in downtown Chicago.
    - A Lufthansa flight routing through Frankfurt departing in two hours.
    correct_answer: A Lufthansa flight routing through Frankfurt departing in two hours.
    explanation_en: Claire arranges an involuntary reroute on Lufthansa via Frankfurt departing in two hours.
    explanation_tr: Claire, iki saat içinde kalkan Frankfurt aktarmalı bir Lufthansa uçuşu ayarlar.
  - id: q_listening_c1_airline-flight-cancellation-rebooking_05
    question_en: What handling will happen to Mert's checked luggage during the Frankfurt connection?
    question_tr_hint: Frankfurt aktarması sırasında Mert'in kayıtlı bagajına ne işlem yapılacaktır?
    options:
    - Mert must collect and re-check it manually during his brief connection.
    - It will be automatically transferred across carriers to his final destination.
    - It must be discarded due to international hazardous material regulations.
    - It will remain in London until the weather clears three days later.
    correct_answer: It will be automatically transferred across carriers to his final destination.
    explanation_en: Claire assures Mert that luggage transfers automatically.
    explanation_tr: Claire, bagajın otomatik olarak aktarılacağı güvencesini verir.
  topic_tags:
  - travel
  - customer_service
- id: listening.c1.functional-medicine-longevity-consult
  title: Consulting on Integrative Biomarker Diagnostics and Longevity
  cefr_level: C1
  category: product_discovery
  scenario_context: Dr. Bennett, a functional medicine specialist, interprets comprehensive metabolomic, lipid particle, and
    epigenetic methylation profiling for Ayla, tailoring an evidence-based preventative intervention.
  speakers:
  - id: dr_bennett
    name: Dr. Bennett
    role: Functional Medicine Physician
    accent: American
  - id: ayla
    name: Ayla
    role: Healthcare Executive
    accent: Turkish
  audio_ref: audio/listening/c1_functional_medicine_longevity_consult.mp3
  duration_seconds: 79
  transcript_items:
  - index: 1
    speaker_id: dr_bennett
    start_ms: 0
    end_ms: 11702
    text_en: Welcome back, Ayla. We have gathered your advanced biomarker panel, including your ApoB particle count, fasting
      insulin sensitivity, and DNA methylation biological age score.
    text_tr: Tekrar hoş geldiniz Ayla Hanım. ApoB parçacık sayınız, açlık insülin duyarlılığınız ve DNA metilasyon biyolojik
      yaş skorunuz dahil olmak üzere gelişmiş biyobelirteç panelinizi topladık.
  - index: 2
    speaker_id: ayla
    start_ms: 12102
    end_ms: 22549
    text_en: I was anxious to review the results, Dr. Bennett. My routine physical showed normal total cholesterol, but I
      suspect that aggregated metric masks underlying vascular risk.
    text_tr: Sonuçları incelemek için sabırsızlanıyordum Dr. Bennett. Rutin tahlillerim toplam kolesterolü normal gösterdi
      ancak bu birleştirilmiş metriğin altta yatan damar riskini maskelediğinden şüpheleniyorum.
  - index: 3
    speaker_id: dr_bennett
    start_ms: 22949
    end_ms: 33231
    text_en: Your intuition is spot on. While standard LDL-C appears benign at ninety-five milligrams per deciliter, your
      Apolipoprotein B is elevated at one hundred and fifteen.
    text_tr: Sezgileriniz tam olarak doğru. Standart LDL-C desilitrede doksan beş miligram ile zararsız görünse de, Apolipoprotein
      B değeriniz yüz on beşte yüksek seyrediyor.
  - index: 4
    speaker_id: ayla
    start_ms: 33631
    end_ms: 40809
    text_en: Which indicates an atherogenic particle concentration that could drive plaque accumulation despite normal volumetric
      lipid concentrations.
    text_tr: Bu da normal hacimsel lipid konsantrasyonlarına rağmen plak birikimini tetikleyebilecek aterojenik bir parçacık
      yoğunluğuna işaret ediyor.
  - index: 5
    speaker_id: dr_bennett
    start_ms: 41209
    end_ms: 50882
    text_en: Precisely. Furthermore, your Horvath epigenetic clock estimates your biological age at forty-one, approximately
      three years older than your chronological age.
    text_tr: Kesinlikle. Dahası, Horvath epigenetik saatiniz biyolojik yaşınızı kırk bir olarak tahmin ediyor, bu da takvim
      yaşınızdan yaklaşık üç yıl daha yaşlı.
  - index: 6
    speaker_id: ayla
    start_ms: 51282
    end_ms: 57905
    text_en: I assume that delta stems from chronic sleep deprivation and elevated cortisol from international corporate restructuring.
    text_tr: Bu farkın uluslararası kurumsal yeniden yapılanmadan kaynaklanan kronik uykusuzluk ve yüksek kortizolden kaynaklandığını
      tahmin ediyorum.
  - index: 7
    speaker_id: dr_bennett
    start_ms: 58305
    end_ms: 70627
    text_en: 'Without question. Rather than prescribing statins immediately, I recommend a multifaceted protocol: targeted
      high-intensity interval training, zone-two mitochondrial conditioning, and time-restricted feeding.'
    text_tr: 'Şüphesiz. Hemen statin reçete etmek yerine çok yönlü bir protokol öneriyorum: hedefe yönelik yüksek yoğunluklu
      interval antrenmanı, ikinci bölge mitokondriyal kondisyon ve zaman kısıtlamalı beslenme.'
  - index: 8
    speaker_id: ayla
    start_ms: 71027
    end_ms: 78410
    text_en: I will incorporate the zone-two aerobic sessions immediately and track my continuous glucose monitor metrics
      to evaluate glycemic variance.
    text_tr: İkinci bölge aerobik seanslarını hemen dahil edeceğim ve glisemik değişkenliği değerlendirmek için sürekli glikoz
      monitörü metriklerimi takip edeceğim.
  comprehension_questions:
  - id: q_listening_c1_functional-medicine-longevity-consult_01
    question_en: Why does Dr. Bennett express concern despite Ayla's normal total cholesterol?
    question_tr_hint: Ayla'nın toplam kolesterolü normal olmasına rağmen Dr. Bennett neden endişe duyuyor?
    options:
    - Her body temperature has permanently dropped below hypothermic levels.
    - She has contracted an acute viral infection affecting respiratory membranes.
    - Her elevated Apolipoprotein B indicates a high concentration of atherogenic plaque-forming particles.
    - Her red blood cell count has dropped below critical transfusion thresholds.
    correct_answer: Her elevated Apolipoprotein B indicates a high concentration of atherogenic plaque-forming particles.
    explanation_en: Dr. Bennett notes her ApoB is elevated, revealing atherogenic risk that standard cholesterol hides.
    explanation_tr: Dr. Bennett, yüksek ApoB'nin standart kolesterolün gizlediği aterojenik riski ortaya koyduğunu belirtir.
  - id: q_listening_c1_functional-medicine-longevity-consult_02
    question_en: What did the epigenetic methylation clock reveal about Ayla's physiology?
    question_tr_hint: Epigenetik metilasyon saati Ayla'nın fizyolojisi hakkında neyi ortaya koydu?
    options:
    - She possesses genetic immunity to all forms of cellular aging.
    - Her biological cellular age is equivalent to that of an infant.
    - Her biological age is approximately three years older than her chronological age.
    - Her genetic markers indicate acute hereditary muscle atrophy.
    correct_answer: Her biological age is approximately three years older than her chronological age.
    explanation_en: The Horvath epigenetic clock estimated her biological age at 41, three years older than her chronological
      age.
    explanation_tr: Epigenetik saat biyolojik yaşının takvim yaşından 3 yaş büyük olduğunu göstermiştir.
  - id: q_listening_c1_functional-medicine-longevity-consult_03
    question_en: What primary lifestyle factor does Ayla attribute her biological age acceleration to?
    question_tr_hint: Ayla biyolojik yaşının hızlanmasını hangi temel yaşam tarzı faktörüne bağlıyor?
    options:
    - Frequent participation in Olympic-distance marathons.
    - Chronic sleep deprivation and sustained cortisol elevation related to professional stress.
    - Living at extremely high altitudes without supplemental oxygen.
    - Extensive consumption of organic leafy green vegetables.
    correct_answer: Chronic sleep deprivation and sustained cortisol elevation related to professional stress.
    explanation_en: Ayla links the delta to chronic sleep deprivation and elevated cortisol from corporate stress.
    explanation_tr: Ayla bu farkı kurumsal strese bağlı kronik uykusuzluk ve yüksek kortizole bağlar.
  - id: q_listening_c1_functional-medicine-longevity-consult_04
    question_en: What intervention does Dr. Bennett favor prior to considering pharmacological statins?
    question_tr_hint: Dr. Bennett farmakolojik statinleri düşünmeden önce hangi müdahaleyi tercih ediyor?
    options:
    - Immediate invasive coronary bypass surgical intervention.
    - Complete bed rest and physical immobilization for six months.
    - A strictly liquid diet consisting exclusively of citrus juice.
    - Zone-two mitochondrial conditioning, targeted intervals, and time-restricted nutrition.
    correct_answer: Zone-two mitochondrial conditioning, targeted intervals, and time-restricted nutrition.
    explanation_en: Dr. Bennett recommends zone-two conditioning, HIIT, and time-restricted feeding.
    explanation_tr: Dr. Bennett bölge 2 kondisyonu, HIIT ve zaman kısıtlamalı beslenmeyi önerir.
  - id: q_listening_c1_functional-medicine-longevity-consult_05
    question_en: How does Ayla plan to objectively monitor her metabolic response to the new regimen?
    question_tr_hint: Ayla yeni düzene verdiği metabolik tepkiyi nesnel olarak nasıl izlemeyi planlıyor?
    options:
    - By measuring her body weight six times throughout each afternoon.
    - By recording daily voice memos regarding subjective fatigue.
    - By analyzing continuous glucose monitor data to observe glycemic fluctuations.
    - By counting the exact number of steps taken in her office hallway.
    correct_answer: By analyzing continuous glucose monitor data to observe glycemic fluctuations.
    explanation_en: Ayla intends to track continuous glucose monitor metrics to evaluate glycemic variance.
    explanation_tr: Ayla glisemik değişkenliği izlemek için sürekli glikoz monitörü verilerini takip etmeyi planlar.
  topic_tags:
  - health_lifestyle
  - consulting
- id: listening.c1.farm-to-table-procurement
  title: Negotiating Regenerative Agricultural Procurement Contracts
  cefr_level: C1
  category: negotiation
  scenario_context: Chef Julien and regional co-op director Elif negotiate an annual supply agreement for biodynamic heirloom
    produce, addressing harvest yield volatility, cold-chain compliance, and price hedging.
  speakers:
  - id: julien
    name: Julien
    role: Executive Restaurateur
    accent: French
  - id: elif
    name: Elif
    role: Agricultural Cooperative Director
    accent: Turkish
  audio_ref: audio/listening/c1_farm_to_table_procurement.mp3
  duration_seconds: 77
  transcript_items:
  - index: 1
    speaker_id: julien
    start_ms: 0
    end_ms: 10542
    text_en: Elif, our culinary reputation depends on uncompromising ingredient integrity. We want your cooperative to become
      our exclusive supplier for heritage brassicas and heirloom nightshades.
    text_tr: Elif, mutfak itibarımız tavizsiz malzeme bütünlüğüne dayanıyor. Kooperatifinizin ata tohumu lahanagiller ve yadigâr
      patlıcangiller konusunda tek tedarikçimiz olmasını istiyoruz.
  - index: 2
    speaker_id: elif
    start_ms: 10942
    end_ms: 21214
    text_en: We appreciate your patronage, Julien. However, farming under biodynamic regenerative standards leaves us vulnerable
      to unseasonal microclimate shifts and late frosts.
    text_tr: İlginiz için teşekkür ederiz Julien. Ancak biyodinamik onarıcı standartlar altında çiftçilik yapmak bizi mevsimsiz
      mikroklima değişimlerine ve geç donlara karşı savunmasız bırakıyor.
  - index: 3
    speaker_id: julien
    start_ms: 21614
    end_ms: 28467
    text_en: We cannot operate a Michelin-starred dining room if half our vegetable menu disappears whenever a frost impacts
      the Aegean foothills.
    text_tr: Ege eteklerini bir don vurduğunda sebze menümüzün yarısı ortadan kaybolursa Michelin yıldızlı bir restoranı işletemeyiz.
  - index: 4
    speaker_id: elif
    start_ms: 28867
    end_ms: 40475
    text_en: We propose a dynamic quota collar. If extreme weather impairs yield by more than thirty percent, our agreement
      permits substituting secondary heirloom cultivars that share identical organoleptic profiles.
    text_tr: Dinamik bir kota aralığı öneriyoruz. Aşırı hava koşulları verimi yüzde otuzdan fazla düşürürse, anlaşmamız aynı
      organoleptik profili paylaşan ikincil ata tohumu çeşitlerinin ikame edilmesine izin verir.
  - index: 5
    speaker_id: julien
    start_ms: 40875
    end_ms: 50352
    text_en: That flexibility is acceptable provided substitution notices arrive at least forty-eight hours before daily prep
      cycles, allowing our sous chefs to adjust our tasting pairings.
    text_tr: Sous şeflerimizin tadım eşleştirmelerini ayarlamasına olanak sağlamak için ikame bildirimleri günlük hazırlık
      döngülerinden en az kırk sekiz saat önce gelirse bu esneklik kabul edilebilir.
  - index: 6
    speaker_id: elif
    start_ms: 50752
    end_ms: 60280
    text_en: Agreed. In return, we require a guaranteed price floor with a twenty percent upfront retainer to finance our
      cover-crop seeding and mycorrhizal soil inoculants.
    text_tr: Anlaştık. Karşılığında, örtü bitkisi ekimimizi ve mikorizal toprak aşılarımızı finanse etmek için garantili bir
      taban fiyat ve yüzde yirmi peşin ön ödeme talep ediyoruz.
  - index: 7
    speaker_id: julien
    start_ms: 60680
    end_ms: 67533
    text_en: What cold-chain telemetry guarantees do you provide to prevent enzymatic degradation during transport across
      the Marmara straits?
    text_tr: Marmara boğazı üzerinden sevkiyat sırasında enzimatik bozulmayı önlemek için hangi soğuk zincir telemetri garantilerini
      sağlıyorsunuz?
  - index: 8
    speaker_id: elif
    start_ms: 67933
    end_ms: 75850
    text_en: Every delivery crate carries IoT temperature loggers transmitting real-time readings between three and five degrees
      Celsius directly to your kitchen tablet.
    text_tr: Her teslimat kasasında, doğrudan mutfak tabletinize üç ila beş santigrat derece arasında gerçek zamanlı okumalar
      ileten IoT sıcaklık kayıt cihazları bulunur.
  comprehension_questions:
  - id: q_listening_c1_farm-to-table-procurement_01
    question_en: What ecological challenge creates supply unpredictability for Elif's cooperative?
    question_tr_hint: Elif'in kooperatifi için hangi ekolojik zorluk tedarik öngörülemezliği yaratıyor?
    options:
    - Catastrophic insect swarms destroying all greenhouse glass structures.
    - A total labor embargo enacted by neighboring municipal authorities.
    - Contamination of regional water tables with synthetic industrial solvents.
    - Vulnerability to unseasonal microclimate fluctuations and late frost events under regenerative practices.
    correct_answer: Vulnerability to unseasonal microclimate fluctuations and late frost events under regenerative practices.
    explanation_en: Elif explains that biodynamic farming is vulnerable to microclimate shifts and late frosts.
    explanation_tr: Elif, onarıcı tarımın mikroklima değişimlerine ve geç donlara duyarlı olduğunu belirtir.
  - id: q_listening_c1_farm-to-table-procurement_02
    question_en: How does the proposed quota collar handle extreme agricultural yield losses?
    question_tr_hint: Önerilen kota aralığı aşırı tarımsal verim kayıplarını nasıl yönetir?
    options:
    - It automatically forces the restaurant to close until the next seasonal harvest.
    - It cancels all contractual liabilities without any financial compensation.
    - It imports cheap frozen vegetables from commercial overseas distributors.
    - It permits substituting secondary heirloom cultivars with matching flavor and culinary characteristics.
    correct_answer: It permits substituting secondary heirloom cultivars with matching flavor and culinary characteristics.
    explanation_en: Elif proposes substituting secondary cultivars with identical organoleptic profiles if yields drop >30%.
    explanation_tr: Elif, verim %30'dan fazla düşerse eşdeğer tat profiline sahip alternatif çeşitlerin ikamesini önerir.
  - id: q_listening_c1_farm-to-table-procurement_03
    question_en: What operational stipulation does Chef Julien attach to vegetable substitutions?
    question_tr_hint: Şef Julien sebze ikamelerine hangi operasyonel koşulu ekliyor?
    options:
    - Substituted vegetables must be discounted by ninety percent.
    - Substitutions must be formally notified at least forty-eight hours ahead of kitchen prep.
    - Substitutions must be personally inspected by regional agricultural ministers.
    - The cooperative must supply gold-plated packaging for all substitute produce.
    correct_answer: Substitutions must be formally notified at least forty-eight hours ahead of kitchen prep.
    explanation_en: Julien insists on at least 48 hours notice before prep cycles so menus can adjust.
    explanation_tr: Julien, hazırlık döngülerinden en az 48 saat önce bildirim yapılmasını şart koşar.
  - id: q_listening_c1_farm-to-table-procurement_04
    question_en: Why does Elif request a twenty percent upfront financial retainer?
    question_tr_hint: Elif neden yüzde yirmilik bir peşin avans talep ediyor?
    options:
    - To construct luxury executive suites at the agricultural co-op headquarters.
    - To finance cover-crop seeding and mycorrhizal soil inoculants ahead of planting.
    - To settle outstanding municipal parking violations across the fleet.
    - To purchase an armada of commercial cargo airplanes.
    correct_answer: To finance cover-crop seeding and mycorrhizal soil inoculants ahead of planting.
    explanation_en: Elif states the retainer finances cover-crop seeding and mycorrhizal soil inoculants.
    explanation_tr: Elif, avansın örtü bitkisi tohumları ve toprak aşılarını finanse etmek için gerektiğini belirtir.
  - id: q_listening_c1_farm-to-table-procurement_05
    question_en: How does the cooperative guarantee cold-chain integrity during produce transit?
    question_tr_hint: Kooperatif ürün sevkiyatı sırasında soğuk zincir bütünlüğünü nasıl garanti eder?
    options:
    - By shipping all vegetables packed tightly inside dry ice blocks.
    - By relying on verbal driver assurances upon delivery arrival.
    - Via IoT temperature loggers transmitting real-time readings between 3°C and 5°C directly to the kitchen.
    - By flying produce aboard supersonic cargo drones in twenty minutes.
    correct_answer: Via IoT temperature loggers transmitting real-time readings between 3°C and 5°C directly to the kitchen.
    explanation_en: Elif explains each crate carries IoT sensors transmitting 3-5°C readings to their tablet.
    explanation_tr: Elif, her kasada tablete 3-5°C arası canlı veri gönderen IoT sensörleri bulunduğunu açıklar.
  topic_tags:
  - food_shopping
  - supply_chain
- id: listening.c1.co-founder-equity-dispute
  title: Mediating Founder Vesting and IP Contribution Equities
  cefr_level: C1
  category: negotiation
  scenario_context: Venture legal mediator Rachel mediates a restructuring of cap table percentages and reverse-vesting milestones
    between early-stage tech co-founders Kaan and David following a technical pivot.
  speakers:
  - id: rachel
    name: Rachel
    role: Startup Legal Mediator
    accent: American
  - id: kaan
    name: Kaan
    role: Co-Founder & Chief Technology Officer
    accent: Turkish
  audio_ref: audio/listening/c1_co_founder_equity_dispute.mp3
  duration_seconds: 76
  transcript_items:
  - index: 1
    speaker_id: rachel
    start_ms: 0
    end_ms: 10637
    text_en: Thank you for coming in, Kaan. David and I spoke earlier. Our goal today is to establish an equitable path forward
      without compromising your upcoming Series A valuation.
    text_tr: Geldiğin için teşekkürler Kaan. David ile az önce konuştuk. Bugünkü amacımız, yaklaşan Seri A değerlemenizi tehlikeye
      atmadan adil bir uzlaşma yolu oluşturmaktır.
  - index: 2
    speaker_id: kaan
    start_ms: 11037
    end_ms: 21290
    text_en: I appreciate your neutrality, Rachel. However, when David founded the company, equity was split fifty-fifty based
      on our initial B2B sales automation concept.
    text_tr: Tarafsızlığın için teşekkürler Rachel. Ancak şirketi ilk kurduğumuzda hisseler, başlangıçtaki B2B satış otomasyonu
      konseptimize dayanarak yarı yarıya paylaştırılmıştı.
  - index: 3
    speaker_id: rachel
    start_ms: 21690
    end_ms: 30572
    text_en: And since then, the enterprise pivoted entirely into autonomous distributed database architecture, which represents
      exclusively your proprietary engineering.
    text_tr: Ve o zamandan bu yana girişim tamamen, münhasıran senin tescilli mühendisliğini temsil eden otonom dağıtık veritabanı
      mimarisine yöneldi.
  - index: 4
    speaker_id: kaan
    start_ms: 30972
    end_ms: 40270
    text_en: Exactly. I have authored eighty percent of the foundational codebase and secured our core patents, while David
      has struggled to close enterprise pilot contracts.
    text_tr: Kesinlikle. Temel kod tabanının yüzde seksenini ben yazdım ve ana patentlerimizi aldım; David ise kurumsal pilot
      sözleşmelerini kapatmakta zorlandı.
  - index: 5
    speaker_id: rachel
    start_ms: 40670
    end_ms: 49187
    text_en: David acknowledges the intellectual property disparity, but he argues his early sweat equity and initial seed
      capital secured your first eighteen months of runway.
    text_tr: David fikri mülkiyet farkını kabul ediyor ancak erken dönem emek ortaklığının ve tohum sermayesinin ilk on sekiz
      aylık nakit akışınızı sağladığını savunuyor.
  - index: 6
    speaker_id: kaan
    start_ms: 49587
    end_ms: 58030
    text_en: That runway was vital, but investors in our lead syndicate are already questioning why a non-technical CEO retains
      fifty percent without commercial validation.
    text_tr: O nakit akışı hayatiydi, ancak lider yatırımcı grubumuzdaki yatırımcılar şimdiden ticari doğrulama olmaksızın
      teknik olmayan bir CEO'nun neden yüzde elli paya sahip olduğunu sorguluyor.
  - index: 7
    speaker_id: rachel
    start_ms: 58430
    end_ms: 65603
    text_en: 'Here is a balanced compromise: we implement a dynamic milestone-based reverse vesting schedule on a ten percent
      equity tranche.'
    text_tr: 'İşte dengeli bir uzlaşma: yüzde onluk bir hisse dilimi üzerinde dinamik, dönüm noktasına dayalı bir ters hak
      ediş takvimi uygulayabiliriz.'
  - index: 8
    speaker_id: kaan
    start_ms: 66003
    end_ms: 75160
    text_en: If David hits two million in annual recurring revenue within four quarters, he vests that tranche; if not, those
      shares return to the employee stock option pool.
    text_tr: David dört çeyrek içinde iki milyon yıllık tekrarlayan gelire ulaşırsa bu dilimi hak eder; ulaşamazsa o hisseler
      çalışan hisse opsiyon havuzuna geri döner.
  comprehension_questions:
  - id: q_listening_c1_co-founder-equity-dispute_01
    question_en: What primary operational shift precipitated the equity disagreement between Kaan and David?
    question_tr_hint: Kaan ve David arasındaki hisse anlaşmazlığını tetikleyen temel operasyonel değişim neydi?
    options:
    - A hostile corporate buyout by an international defense conglomerate.
    - The accidental loss of all customer credit card information.
    - A total relocation of the company headquarters to an offshore territory.
    - The startup pivoted from a sales platform to a distributed database system engineered primarily by Kaan.
    correct_answer: The startup pivoted from a sales platform to a distributed database system engineered primarily by Kaan.
    explanation_en: Rachel notes the company pivoted into autonomous distributed database architecture built by Kaan.
    explanation_tr: Rachel, girişimin Kaan'ın geliştirdiği otonom dağıtık veritabanı mimarisine yöneldiğini belirtir.
  - id: q_listening_c1_co-founder-equity-dispute_02
    question_en: What contribution does David cite to justify maintaining his original equity percentage?
    question_tr_hint: David orijinal hisse oranını korumayı haklı çıkarmak için hangi katkısını öne sürüyor?
    options:
    - His personal relationship with federal trade regulatory commissioners.
    - His early founder labor and initial seed funding that financed their first eighteen months of operations.
    - His authorship of the company's trademarked logo illustrations.
    - His victory in an international competitive hackathon tournament.
    correct_answer: His early founder labor and initial seed funding that financed their first eighteen months of operations.
    explanation_en: Rachel explains David points to his early sweat equity and initial seed capital financing 18 months of
      runway.
    explanation_tr: Rachel, David'in ilk 18 aylık süreyi finanse eden emek ortaklığı ve tohum sermayesini öne sürdüğünü söyler.
  - id: q_listening_c1_co-founder-equity-dispute_03
    question_en: What pressure from external investors does Kaan convey to the mediator?
    question_tr_hint: Kaan arabulucuya dış yatırımcılardan gelen hangi baskıyı aktarıyor?
    options:
    - Investors insist on replacing all human employees with automated algorithms.
    - Lead investors question why a non-technical founder holds half the equity without commercial validation.
    - Investors demand an immediate liquidation of all corporate assets.
    - Investors require both founders to surrender all voting rights immediately.
    correct_answer: Lead investors question why a non-technical founder holds half the equity without commercial validation.
    explanation_en: Kaan notes lead investors question why a non-technical CEO retains 50% without commercial traction.
    explanation_tr: Kaan, lider yatırımcıların teknik olmayan CEO'nun ticari başarı olmadan %50 tutmasını sorguladığını söyler.
  - id: q_listening_c1_co-founder-equity-dispute_04
    question_en: What mechanism does Rachel recommend to resolve the cap table stalemate?
    question_tr_hint: Rachel hisse tablosu kilitlenmesini çözmek için hangi mekanizmayı öneriyor?
    options:
    - Selling all company intellectual property to the highest anonymous bidder.
    - A coin-toss ceremony conducted before independent court bailiffs.
    - Splitting the company into two separate bankrupt corporate entities.
    - A performance-contingent reverse vesting schedule applied to a ten percent equity block.
    correct_answer: A performance-contingent reverse vesting schedule applied to a ten percent equity block.
    explanation_en: Rachel proposes a dynamic milestone-based reverse vesting schedule on a 10% equity tranche.
    explanation_tr: Rachel, %10'luk dilim üzerinde dönüm noktasına bağlı ters hak ediş takvimi önerir.
  - id: q_listening_c1_co-founder-equity-dispute_05
    question_en: What consequence occurs if David fails to meet the two-million ARR benchmark?
    question_tr_hint: David iki milyonluk ARR hedefine ulaşamazsa nasıl bir sonuç ortaya çıkar?
    options:
    - Kaan is legally obligated to purchase the shares at full market price.
    - The shares are confiscated by federal tax authorities.
    - David is sentenced to mandatory unpaid community service.
    - The unvested ten percent equity returns to the employee incentive pool.
    correct_answer: The unvested ten percent equity returns to the employee incentive pool.
    explanation_en: Kaan states that if David misses the target, those shares revert to the employee option pool.
    explanation_tr: Kaan, hedefe ulaşılamazsa bu hisselerin çalışan opsiyon havuzuna geri döneceğini belirtir.
  topic_tags:
  - relationships
  - work_career
- id: listening.c1.university-curriculum-accreditation
  title: Reviewing Transnational Engineering Accreditation Standards
  cefr_level: C1
  category: stakeholder_alignment
  scenario_context: Dean Harrison and Vice Dean Deniz assess program alignment with ABET and EUR-ACE criteria, discussing
    laboratory modernization, interdisciplinary capstone rubrics, and faculty research quotas.
  speakers:
  - id: harrison
    name: Dean Harrison
    role: Faculty Dean
    accent: British
  - id: deniz
    name: Deniz
    role: Associate Dean of Academic Affairs
    accent: Turkish
  audio_ref: audio/listening/c1_university_curriculum_accreditation.mp3
  duration_seconds: 79
  transcript_items:
  - index: 1
    speaker_id: harrison
    start_ms: 0
    end_ms: 10058
    text_en: Deniz, our upcoming decennial ABET and EUR-ACE evaluation visits are less than six months away. How is the outcome
      assessment documentation progressing across departments?
    text_tr: Deniz, yaklaşan on yıllık ABET ve EUR-ACE değerlendirme ziyaretlerimize altı aydan az bir süre kaldı. Bölümler
      genelinde çıktı değerlendirme belgeleri nasıl ilerliyor?
  - index: 2
    speaker_id: deniz
    start_ms: 10458
    end_ms: 22704
    text_en: We have consolidated student learning outcome portfolios for ninety percent of core engineering courses, Dean
      Harrison. However, our multidisciplinary capstone evaluation criteria remain somewhat subjective.
    text_tr: Temel mühendislik derslerinin yüzde doksanı için öğrenci öğrenme çıktısı portföylerini birleştirdik Dekan Harrison.
      Ancak çok disiplinli bitirme projesi değerlendirme kriterlerimiz hâlâ biraz sübjektif kalıyor.
  - index: 3
    speaker_id: harrison
    start_ms: 23104
    end_ms: 34546
    text_en: Subjectivity in capstones is an immediate red flag for accreditation evaluators. They expect quantifiable rubrics
      covering professional ethics, life-cycle sustainability, and economic feasibility.
    text_tr: Bitirme projelerindeki öznellik, akreditasyon denetçileri için doğrudan bir kırmızı bayraktır. Mesleki etik,
      yaşam döngüsü sürdürülebilirliği ve ekonomik fizibiliteyi kapsayan ölçülebilir dereceli puanlama anahtarları bekliyorlar.
  - index: 4
    speaker_id: deniz
    start_ms: 34946
    end_ms: 43389
    text_en: I will standardize an institutional grading matrix benchmarked against IEEE ethical canons and lifecycle carbon
      accounting before next month's faculty senate.
    text_tr: Gelecek ayki fakülte senatosundan önce IEEE etik kuralları ve yaşam döngüsü karbon muhasebesi ile kıyaslanan
      kurumsal bir notlandırma matrisi standartlaştıracağım.
  - index: 5
    speaker_id: harrison
    start_ms: 43789
    end_ms: 50557
    text_en: Splendid. What about the feedback from our external industrial advisory board regarding laboratory modernization?
    text_tr: Harika. Dış endüstriyel danışma kurulumuzun laboratuvar modernizasyonuna ilişkin geri bildirimleri ne durumda?
  - index: 6
    speaker_id: deniz
    start_ms: 50957
    end_ms: 60589
    text_en: Industry advisors voiced concern that our cleanroom semiconductor microfabrication rigs and FPGA hardware synthesis
      benches lag behind modern wafer fabrication facilities.
    text_tr: Sektör danışmanları, temiz oda yarı iletken mikro fabrikasyon cihazlarımızın ve FPGA donanım sentez tezgahlarımızın
      modern yonga üretim tesislerinin gerisinde kaldığı endişesini dile getirdiler.
  - index: 7
    speaker_id: harrison
    start_ms: 60989
    end_ms: 68902
    text_en: We have allocated a four-million-euro infrastructure endowment grant to procure modern electron lithography tooling
      and advanced embedded testbeds this summer.
    text_tr: Bu yaz modern elektron litografi araçları ve gelişmiş gömülü test yatakları temin etmek için dört milyon avroluk
      bir altyapı bağış fonu tahsis ettik.
  - index: 8
    speaker_id: deniz
    start_ms: 69302
    end_ms: 78114
    text_en: That investment will ensure our laboratory facilities not only satisfy accreditation criteria but position our
      graduates at the vanguard of applied nanoelectronics.
    text_tr: Bu yatırım, laboratuvar tesislerimizin yalnızca akreditasyon kriterlerini karşılamakla kalmayıp mezunlarımızı
      uygulamalı nanoelektroniğin ön saflarına yerleştirmesini sağlayacaktır.
  comprehension_questions:
  - id: q_listening_c1_university-curriculum-accreditation_01
    question_en: What specific shortcoming does Deniz identify in the current engineering portfolio documentation?
    question_tr_hint: Deniz mevcut mühendislik portföy belgelerinde hangi özel eksikliği tespit ediyor?
    options:
    - Failure to teach basic differential calculus to engineering freshmen.
    - Total absence of certified teaching credentials among senior professors.
    - Evaluation rubrics for multidisciplinary capstone design projects remain excessively subjective.
    - A complete lack of attendance records across all undergraduate lectures.
    correct_answer: Evaluation rubrics for multidisciplinary capstone design projects remain excessively subjective.
    explanation_en: Deniz notes that multidisciplinary capstone evaluation criteria remain somewhat subjective.
    explanation_tr: Deniz, çok disiplinli bitirme projelerinin değerlendirme kriterlerinin sübjektif kaldığını belirtir.
  - id: q_listening_c1_university-curriculum-accreditation_02
    question_en: What dimensions must the standardized capstone rubric include to satisfy accreditation teams?
    question_tr_hint: Standartlaştırılmış bitirme projesi puanlama anahtarı akreditasyon ekiplerini tatmin etmek için hangi
      boyutları içermelidir?
    options:
    - Professional ethics, life-cycle sustainability, and economic feasibility assessments.
    - Artistic aesthetic evaluations of student engineering sketchbooks.
    - Memorization of historical patent registry identification numbers.
    - Physical athletic performance benchmarks in campus recreation facilities.
    correct_answer: Professional ethics, life-cycle sustainability, and economic feasibility assessments.
    explanation_en: Dean Harrison emphasizes rubrics covering professional ethics, sustainability, and economic feasibility.
    explanation_tr: Dekan Harrison mesleki etik, sürdürülebilirlik ve ekonomik fizibiliteyi vurgular.
  - id: q_listening_c1_university-curriculum-accreditation_03
    question_en: What concern was raised by the external industrial advisory board?
    question_tr_hint: Dış endüstriyel danışma kurulu tarafından hangi endişe dile getirildi?
    options:
    - Faculty parking garages lacked electric vehicle recharging plugs.
    - Semiconductor microfabrication and FPGA laboratory benches lagged behind contemporary industry standards.
    - Engineering students were spending too much time studying mathematics.
    - The campus cafeteria lacked vegan and gluten-free dining options.
    correct_answer: Semiconductor microfabrication and FPGA laboratory benches lagged behind contemporary industry standards.
    explanation_en: Advisors noted microfabrication rigs and FPGA benches lagged behind modern facilities.
    explanation_tr: Danışmanlar temiz oda ve FPGA donanımlarının güncel tesislerin gerisinde kaldığını bildirmiştir.
  - id: q_listening_c1_university-curriculum-accreditation_04
    question_en: How does the administration plan to remediate laboratory equipment deficiencies?
    question_tr_hint: Yönetim laboratuvar ekipmanı eksikliklerini nasıl gidermeyi planlıyor?
    options:
    - By deploying a four-million-euro endowment to procure electron lithography and embedded testbeds.
    - By mandating that students bring personal laptop computers to all practical exams.
    - By requesting second-hand donation surplus from local community colleges.
    - By replacing all physical laboratories with virtual two-dimensional video games.
    correct_answer: By deploying a four-million-euro endowment to procure electron lithography and embedded testbeds.
    explanation_en: Dean Harrison announces a 4-million-euro grant to acquire electron lithography tooling and testbeds.
    explanation_tr: Dekan Harrison 4 milyon avroluk bütçeyle elektron litografi ve test sistemleri alınacağını açıklar.
  - id: q_listening_c1_university-curriculum-accreditation_05
    question_en: When are the formal accreditation peer-review evaluation visits scheduled to take place?
    question_tr_hint: Resmi akreditasyon hakem değerlendirme ziyaretlerinin ne zaman yapılması planlanıyor?
    options:
    - In five years following curriculum overhauls.
    - By tomorrow morning.
    - In exactly three years.
    - Within the next six months.
    correct_answer: Within the next six months.
    explanation_en: Dean Harrison notes the evaluation visits are less than six months away.
    explanation_tr: Dekan Harrison değerlendirme ziyaretlerine altı aydan az bir süre kaldığını belirtir.
