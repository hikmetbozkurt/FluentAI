- id: listening.b1.code-review-feedback
  title: 'Pull Request Review: Unit Tests and Refactoring'
  cefr_level: B1
  category: engineering_meeting
  scenario_context: Leyla, a backend developer, meets with Robert, a senior engineer, to discuss feedback on her authentication
    pull request.
  speakers:
  - id: leyla
    name: Leyla
    role: Backend Engineer
    accent: Turkish
  - id: robert
    name: Robert
    role: Senior Staff Engineer
    accent: British
  audio_ref: audio/listening/b1_code_review.mp3
  duration_seconds: 58
  transcript_items:
  - index: 1
    speaker_id: robert
    start_ms: 0
    end_ms: 8898
    text_en: Hi Leyla, thanks for submitting PR 402. Overall the business logic for token validation looks very solid.
    text_tr: Selam Leyla, 402 numaralı PR'ı gönderdiğin için teşekkürler. Genel olarak belirteç doğrulama iş mantığı gayet
      sağlam görünüyor.
  - index: 2
    speaker_id: leyla
    start_ms: 9298
    end_ms: 18586
    text_en: Thanks Robert. I saw your inline comment regarding the user session service. Did you want me to break that into
      smaller methods?
    text_tr: Teşekkürler Robert. Kullanıcı oturum servisiyle ilgili satır içi yorumunu gördüm. Onu daha küçük metotlara bölmemi
      mi istedin?
  - index: 3
    speaker_id: robert
    start_ms: 18986
    end_ms: 30918
    text_en: Exactly. Right now, that single function handles database queries, password hashing, and audit logging. It violates
      the single responsibility principle.
    text_tr: Kesinlikle. Şu anda o tek fonksiyon veritabanı sorgularını, şifre özetlemeyi ve denetim günlüğü tutmayı aynı
      anda yapıyor. Tek sorumluluk ilkesini ihlal ediyor.
  - index: 4
    speaker_id: leyla
    start_ms: 31318
    end_ms: 41661
    text_en: That makes complete sense. If I decouple the audit logger, it will also be much easier to write isolated unit
      tests without mocking the entire database.
    text_tr: Bu son derece mantıklı. Denetim günlüğünü ayırırsam tüm veritabanını taklit etmeden (mocking) yalıtılmış birim
      testleri yazmak da çok daha kolay olacaktır.
  - index: 5
    speaker_id: robert
    start_ms: 42061
    end_ms: 50974
    text_en: Precisely. Once you extract that and achieve at least eighty percent test coverage on edge cases, I will gladly
      approve the merge.
    text_tr: Kesinlikle öyle. Onu ayırıp sınır durumlarında en az yüzde seksen test kapsamına ulaştığında birleştirmeyi memnuniyetle
      onaylayacağım.
  - index: 6
    speaker_id: leyla
    start_ms: 51374
    end_ms: 57542
    text_en: Awesome. I will push the refactored commits and update the test suite this afternoon.
    text_tr: Harika. Bu öğleden sonra yeniden yapılandırılmış commit'leri gönderip test paketini güncelleyeceğim.
  key_vocabulary:
  - word: collaborate
    vocab_id: vocab.collaborate
    context_note_tr: Kod inceleme sürecinde meslektaşlar arasında yapıcı iş birliği.
  - word: maintain
    vocab_id: vocab.maintain
    context_note_tr: Kod tabanının sürdürülebilirliğini ve test kapsamını korumak.
  comprehension_questions:
  - id: q_b1_cr_01
    question_en: What architectural concern does Robert raise about the user session function?
    question_tr_hint: Robert kullanıcı oturum fonksiyonuyla ilgili hangi mimari endişeyi dile getirmektedir?
    options:
    - It consumes seventy percent of the server's graphics processor memory
    - It was written in an outdated programming language from twenty years ago
    - It automatically charges user credit cards without authorization
    - 'It performs multiple distinct responsibilities: database queries, hashing, and audit logging'
    correct_answer: 'It performs multiple distinct responsibilities: database queries, hashing, and audit logging'
    explanation_en: Robert notes that the single function handles database queries, hashing, and audit logging, violating
      the single responsibility principle.
    explanation_tr: Robert tek fonksiyonun veritabanı, özetleme ve loglama işlemlerini aynı anda yaparak tek sorumluluk ilkesini
      ihlal ettiğini belirtir.
  - id: q_b1_cr_02
    question_en: What testing benefit does Leyla identify from decoupling the audit logger?
    question_tr_hint: Leyla denetim loglayıcısını ayırmanın hangi test avantajını sağlayacağını fark etmektedir?
    options:
    - It eliminates the need to run any software tests in production
    - It allows writing isolated unit tests without mocking the entire database
    - It makes the tests run ten times slower so developers can take a break
    - It permanently disables all database security passwords
    correct_answer: It allows writing isolated unit tests without mocking the entire database
    explanation_en: Leyla notes that decoupling allows writing unit tests without mocking the whole database.
    explanation_tr: Leyla ayırmanın tüm veritabanını mock'lamadan yalıtılmış testler yazmayı kolaylaştıracağını belirtir.
  - id: q_b1_cr_03
    question_en: What test coverage threshold does Robert require for approval?
    question_tr_hint: Robert onay vermek için hangi test kapsamı eşiğini şart koşmaktadır?
    options:
    - At least eighty percent test coverage on edge cases
    - One hundred percent coverage of all operating system drivers
    - Exactly ten percent coverage of documentation files
    - Fifty percent coverage of graphic UI animations
    correct_answer: At least eighty percent test coverage on edge cases
    explanation_en: 'Robert states: ''achieve at least eighty percent test coverage on edge cases, I will gladly approve.'''
    explanation_tr: Robert sınır durumlarında en az yüzde seksen test kapsamına ulaşılmasını ister.
  - id: q_b1_cr_04
    question_en: What was Robert's overall assessment of Leyla's initial business logic?
    question_tr_hint: Robert'ın Leyla'nın ilk iş mantığına dair genel değerlendirmesi nasıldı?
    options:
    - He believed the entire pull request should be deleted immediately
    - He thought the code was completely plagiarized from an external blog
    - He said the logic was too simple and elementary for a junior engineer
    - He thought the business logic for token validation was very solid
    correct_answer: He thought the business logic for token validation was very solid
    explanation_en: 'Robert opens by saying: ''Overall the business logic for token validation looks very solid.'''
    explanation_tr: Robert belirteç doğrulama iş mantığının genel olarak çok sağlam olduğunu belirtir.
  - id: q_b1_cr_05
    question_en: When does Leyla commit to pushing the refactored changes?
    question_tr_hint: Leyla yeniden düzenlenen değişiklikleri ne zaman göndereceğini taahhüt etmektedir?
    options:
    - Next month during the quarterly planning session
    - This afternoon
    - Late on Friday evening right before leaving the office
    - Next year after returning from sabbatical
    correct_answer: This afternoon
    explanation_en: 'Leyla confirms: ''I will push the refactored commits and update the test suite this afternoon.'''
    explanation_tr: Leyla bu öğleden sonra commit'leri göndereceğini teyit eder.
  topic_tags:
  - code-review
  - unit-testing
  - clean-code
  - software-engineering
  related_ids:
  - vocab.collaborate
  - vocab.maintain
  status: APPROVED
  version: 1
- id: listening.b1.user-onboarding-dropoff
  title: 'UX Discovery: Addressing Onboarding Drop-Off Rates'
  cefr_level: B1
  category: product_discovery
  scenario_context: Yasemin, a UX researcher, presents user telemetry to Patrick, the product manager, highlighting a steep
    drop-off at step three of mobile signup.
  speakers:
  - id: yasemin
    name: Yasemin
    role: UX Researcher
    accent: Turkish
  - id: patrick
    name: Patrick
    role: Product Manager
    accent: American
  audio_ref: audio/listening/b1_onboarding_dropoff.mp3
  duration_seconds: 52
  transcript_items:
  - index: 1
    speaker_id: patrick
    start_ms: 0
    end_ms: 8158
    text_en: Thanks for compiling the analytics report, Yasemin. What do the latest funnel metrics show for our mobile onboarding?
    text_tr: Analitik raporunu hazırladığın için teşekkürler Yasemin. Mobil ilk katılımımız için en son huni metrikleri ne
      gösteriyor?
  - index: 2
    speaker_id: yasemin
    start_ms: 8558
    end_ms: 17471
    text_en: Unfortunately, Patrick, we are losing thirty-five percent of new users at step three, where we request phone
      number verification.
    text_tr: Ne yazık ki Patrick, telefon numarası doğrulaması istediğimiz üçüncü adımda yeni kullanıcıların yüzde otuz beşini
      kaybediyoruz.
  - index: 3
    speaker_id: patrick
    start_ms: 17871
    end_ms: 25589
    text_en: That is an alarming drop-off. Did our qualitative user interviews reveal why prospective customers are hesitating?
    text_tr: Bu endişe verici bir kayıp oranı. Niteliksel kullanıcı görüşmelerimiz potansiyel müşterilerin neden tereddüt
      ettiğini ortaya koydu mu?
  - index: 4
    speaker_id: yasemin
    start_ms: 25989
    end_ms: 35821
    text_en: Yes. Users feel uncomfortable sharing phone numbers before they even explore the core product features. They
      suspect marketing spam.
    text_tr: Evet. Kullanıcılar temel ürün özelliklerini henüz keşfetmeden telefon numaralarını paylaşmaktan rahatsızlık duyuyorlar.
      Pazarlama spam'inden şüpheleniyorlar.
  - index: 5
    speaker_id: patrick
    start_ms: 36221
    end_ms: 42434
    text_en: What if we defer phone verification until they attempt to make their first financial transaction in the app?
    text_tr: Telefon doğrulamasını kullanıcılar uygulamada ilk finansal işlemlerini yapmaya kalkışana kadar ertelesek nasıl
      olur?
  - index: 6
    speaker_id: yasemin
    start_ms: 42834
    end_ms: 51542
    text_en: That would dramatically reduce upfront friction. Let's design an A/B experiment for next sprint to test that
      hypothesis.
    text_tr: Bu baştaki sürtünmeyi çarpıcı biçimde azaltacaktır. Bu hipotezi test etmek için gelecek sprint'e bir A/B deneyi
      tasarlayalım.
  key_vocabulary:
  - word: customer
    vocab_id: vocab.customer
    context_note_tr: Ürünü kullanan ve deneyimini test eden son kullanıcılar.
  - word: effective
    vocab_id: vocab.effective
    context_note_tr: Kullanıcı deneyiminde sürtünmeyi azaltan etkili ürün çözümleri.
  comprehension_questions:
  - id: q_b1_ux_01
    question_en: At which onboarding step does the sharpest user drop-off occur?
    question_tr_hint: En sert kullanıcı kaybı ilk katılımın hangi adımında gerçekleşmektedir?
    options:
    - At step one, when entering the username
    - At the final congratulations screen
    - At step three, where phone number verification is requested
    - After users have used the application for six months
    correct_answer: At step three, where phone number verification is requested
    explanation_en: 'Yasemin states: ''we are losing thirty-five percent of new users at step three, where we request phone
      number verification.'''
    explanation_tr: Yasemin telefon doğrulaması istenen 3. adımda kullanıcıların %35'inin kaybedildiğini belirtir.
  - id: q_b1_ux_02
    question_en: What percentage of new users abandon signup at that step?
    question_tr_hint: Yeni kullanıcıların yüzde kaçı bu adımda kayıt olmayı bırakmaktadır?
    options:
    - Thirty-five percent
    - Five percent
    - Eighty percent
    - Ninety-nine percent
    correct_answer: Thirty-five percent
    explanation_en: 'Yasemin explicitly cites: ''thirty-five percent of new users.'''
    explanation_tr: Yasemin açıkça yüzde otuz beş rakamını verir.
  - id: q_b1_ux_03
    question_en: Why are users reluctant to enter their phone number early in the process?
    question_tr_hint: Kullanıcılar neden sürecin başında telefon numaralarını vermekte tereddüt etmektedir?
    options:
    - Their mobile devices lack physical numeric keyboards
    - Entering a phone number automatically charges fifty dollars
    - They have not explored core features yet and fear receiving marketing spam
    - Local laws make phone numbers completely confidential
    correct_answer: They have not explored core features yet and fear receiving marketing spam
    explanation_en: Yasemin notes users feel uncomfortable sharing numbers before exploring features and suspect spam.
    explanation_tr: Yasemin kullanıcıların özellikleri görmeden numara paylaşmaktan çekindiğini ve spam'den şüphelendiğini
      söyler.
  - id: q_b1_ux_04
    question_en: What solution does Patrick propose to reduce upfront friction?
    question_tr_hint: Patrick ilk sürtünmeyi azaltmak için hangi çözümü önermektedir?
    options:
    - Requiring users to visit a physical office with their passport
    - Deferring phone verification until the user makes their first transaction
    - Removing all user accounts and making the app anonymous
    - Doubling the length of the signup registration form
    correct_answer: Deferring phone verification until the user makes their first transaction
    explanation_en: 'Patrick asks: ''What if we defer phone verification until they attempt to make their first financial
      transaction?'''
    explanation_tr: Patrick telefon doğrulamasını ilk işleme kadar ertelemeyi önerir.
  - id: q_b1_ux_05
    question_en: How do Yasemin and Patrick plan to evaluate this proposed change?
    question_tr_hint: Yasemin ve Patrick önerilen bu değişikliği nasıl değerlendirmeyi planlamaktadır?
    options:
    - By polling fifty random people on a public sidewalk
    - By asking company executives to guess the outcome
    - By immediately replacing all production databases
    - By designing an A/B experiment for the upcoming sprint
    correct_answer: By designing an A/B experiment for the upcoming sprint
    explanation_en: 'Yasemin concludes: ''Let''s design an A/B experiment for next sprint to test that hypothesis.'''
    explanation_tr: Yasemin gelecek sprint için hipotezi test edecek bir A/B deneyi tasarlamayı önerir.
  topic_tags:
  - ux-research
  - analytics
  - product-management
  - funnel-optimization
  related_ids:
  - vocab.customer
  - vocab.effective
  status: APPROVED
  version: 1
- id: listening.b1.staging-environment-outage
  title: 'Incident Sync: Investigating Staging Cluster Outage'
  cefr_level: B1
  category: incident_response
  scenario_context: Berk, a DevOps engineer, coordinates with Sandra, the QA lead, after an automated container deployment
    crashes the staging environment.
  speakers:
  - id: berk
    name: Berk
    role: DevOps Engineer
    accent: Turkish
  - id: sandra
    name: Sandra
    role: QA Lead
    accent: American
  audio_ref: audio/listening/b1_staging_outage.mp3
  duration_seconds: 50
  transcript_items:
  - index: 1
    speaker_id: sandra
    start_ms: 0
    end_ms: 8323
    text_en: Berk, our automated end-to-end regression tests failed completely on staging twenty minutes ago. Is the cluster
      down?
    text_tr: Berk, otomatik uçtan uca regresyon testlerimiz yirmi dakika önce staging ortamında tamamen başarısız oldu. Küme
      (cluster) çöktü mü?
  - index: 2
    speaker_id: berk
    start_ms: 8723
    end_ms: 17381
    text_en: Yes Sandra. The Kubernetes staging namespace entered a CrashLoopBackOff state immediately following the twelve-fifteen
      deployment.
    text_tr: Evet Sandra. Kubernetes staging ad alanı on iki on beş dağıtımının hemen ardından CrashLoopBackOff durumuna girdi.
  - index: 3
    speaker_id: sandra
    start_ms: 17781
    end_ms: 23094
    text_en: Did the server logs show an out-of-memory exception or a database connection timeout?
    text_tr: Sunucu günlüklerinde bellek yetersizliği hatası mı yoksa bir veritabanı bağlantı zaman aşımı mı göründü?
  - index: 4
    speaker_id: berk
    start_ms: 23494
    end_ms: 32477
    text_en: It was a missing environment secret. The new microservice required an API key that was not configured in the
      staging Helm values file.
    text_tr: Eksik bir ortam gizli anahtarıydı (secret). Yeni mikro servis staging Helm değerler dosyasında yapılandırılmamış
      bir API anahtarı gerektiriyordu.
  - index: 5
    speaker_id: sandra
    start_ms: 32877
    end_ms: 40965
    text_en: Ah, that explains why the container could not initialize. Can you inject the missing key into the staging vault
      right now?
    text_tr: Ah, bu durum konteynerin neden başlatılamadığını açıklıyor. Eksik anahtarı hemen şimdi staging kasasına (vault)
      ekleyebilir misin?
  - index: 6
    speaker_id: berk
    start_ms: 41365
    end_ms: 49688
    text_en: I already injected the secret and restarted the pods. All health checks are green now, so you can restart your
      test run.
    text_tr: Gizli anahtarı az önce ekledim ve pod'ları yeniden başlattım. Tüm sağlık kontrolleri artık yeşil, bu yüzden test
      çalıştırmanızı yeniden başlatabilirsiniz.
  key_vocabulary:
  - word: verify
    vocab_id: vocab.verify
    context_note_tr: Sistem sağlığını ve konfigürasyon anahtarlarını doğrulamak.
  - word: bottleneck
    vocab_id: vocab.bottleneck
    context_note_tr: Test ve dağıtım süreçlerini durduran operasyonel tıkanıklık.
  comprehension_questions:
  - id: q_b1_out_01
    question_en: What status did the staging Kubernetes namespace enter after the deployment?
    question_tr_hint: Dağıtımdan sonra staging Kubernetes ad alanı hangi duruma girdi?
    options:
    - HibernationMode
    - ReadyForTraffic
    - CrashLoopBackOff
    - SafeShutdown
    correct_answer: CrashLoopBackOff
    explanation_en: Berk explains that the namespace entered CrashLoopBackOff immediately following deployment.
    explanation_tr: Berk dağıtımın ardından ortamın CrashLoopBackOff durumuna girdiğini belirtir.
  - id: q_b1_out_02
    question_en: What was the actual root cause of the container startup failure?
    question_tr_hint: Konteynerin başlatılamamasının gerçek kök nedeni neydi?
    options:
    - A required API key secret was missing from the staging Helm configuration
    - The cloud hosting provider experienced a regional power cut
    - Someone spilled hot coffee onto the primary physical server rack
    - All software testing frameworks were permanently uninstalled
    correct_answer: A required API key secret was missing from the staging Helm configuration
    explanation_en: Berk identifies that a new microservice required an API key that was not configured in Helm values.
    explanation_tr: Berk yeni mikro servisin Helm değerlerinde yapılandırılmamış bir API anahtarı gerektirdiğini açıklar.
  - id: q_b1_out_03
    question_en: At what time did the problematic deployment take place?
    question_tr_hint: Sorunlu dağıtım saat kaçta gerçekleştirilmişti?
    options:
    - At seven o'clock in the morning
    - At midnight yesterday
    - At four-thirty in the afternoon
    - At twelve-fifteen
    correct_answer: At twelve-fifteen
    explanation_en: 'Berk refers to: ''immediately following the twelve-fifteen deployment.'''
    explanation_tr: Berk on iki on beş dağıtımının hemen ardından olduğunu söyler.
  - id: q_b1_out_04
    question_en: What corrective action did Berk take to resolve the outage?
    question_tr_hint: Berk kesintiyi gidermek için hangi düzeltici adımı attı?
    options:
    - He deleted all automated test scripts from the repository
    - He injected the missing secret into the vault and restarted the pods
    - He shut down the entire staging cluster permanently
    - He asked Sandra to rewrite the microservice from scratch
    correct_answer: He injected the missing secret into the vault and restarted the pods
    explanation_en: 'Berk states: ''I already injected the secret and restarted the pods.'''
    explanation_tr: Berk gizli anahtarı kasaya ekleyip pod'ları yeniden başlattığını söyler.
  - id: q_b1_out_05
    question_en: What is Sandra able to do now that the health checks are green?
    question_tr_hint: Sağlık kontrolleri yeşile döndüğüne göre Sandra şimdi ne yapabilir?
    options:
    - Restart the automated end-to-end regression test suite
    - Deploy the untested code straight into production
    - Go home because the staging cluster will be offline for a week
    - Cancel all upcoming product releases indefinitely
    correct_answer: Restart the automated end-to-end regression test suite
    explanation_en: 'Berk tells Sandra: ''All health checks are green now, so you can restart your test run.'''
    explanation_tr: Berk kontrollerin yeşil olduğunu ve test çalıştırmasını yeniden başlatabileceğini söyler.
  topic_tags:
  - devops
  - incident-response
  - kubernetes
  - troubleshooting
  related_ids:
  - vocab.verify
  - vocab.bottleneck
  status: APPROVED
  version: 1
- id: listening.b1.saas-license-renewal
  title: 'Vendor Negotiation: Developer Tooling License Renewal'
  cefr_level: B1
  category: negotiation
  scenario_context: Cenk, an IT procurement specialist, negotiates annual developer IDE cloud license pricing with Chloe,
    a SaaS account executive.
  speakers:
  - id: cenk
    name: Cenk
    role: IT Procurement Specialist
    accent: Turkish
  - id: chloe
    name: Chloe
    role: SaaS Account Executive
    accent: American
  audio_ref: audio/listening/b1_saas_renewal.mp3
  duration_seconds: 55
  transcript_items:
  - index: 1
    speaker_id: chloe
    start_ms: 0
    end_ms: 8613
    text_en: Hello Cenk, thank you for making time today. Your company's annual IDE subscription renewal is coming up next
      month.
    text_tr: Merhaba Cenk, bugün vakit ayırdığın için teşekkürler. Şirketinizin yıllık IDE abonelik yenilemesi gelecek ay
      yaklaşıyor.
  - index: 2
    speaker_id: cenk
    start_ms: 9013
    end_ms: 18596
    text_en: Hi Chloe. We are currently utilizing one hundred seats, but our engineering leadership plans to expand to one
      hundred and fifty developers.
    text_tr: Selam Chloe. Şu anda yüz lisans koltuğu kullanıyoruz ancak mühendislik liderliğimiz yüz elli geliştiriciye genişlemeyi
      planlıyor.
  - index: 3
    speaker_id: chloe
    start_ms: 18996
    end_ms: 26158
    text_en: That is exciting growth! Our standard enterprise tier is forty dollars per seat per month for that volume.
    text_tr: Bu heyecan verici bir büyüme! Bu hacim için standart kurumsal seviyemiz kullanıcı başına aylık kırk dolar.
  - index: 4
    speaker_id: cenk
    start_ms: 26558
    end_ms: 36411
    text_en: That represents a substantial budget increase. If we commit to a two-year contract upfront, can you offer a fifteen
      percent volume discount?
    text_tr: Bu önemli bir bütçe artışını temsil ediyor. Peşin olarak iki yıllık bir sözleşme taahhüt edersek yüzde on beş
      hacim indirimi sunabilir misiniz?
  - index: 5
    speaker_id: chloe
    start_ms: 36811
    end_ms: 45254
    text_en: For a two-year commitment on one hundred and fifty seats, I can definitely approve a fifteen percent reduction
      down to thirty-four dollars.
    text_tr: Yüz elli koltukta iki yıllık taahhüt karşılığında kesinlikle yüzde on beş indirimle otuz dört dolara inmeyi onaylayabilirim.
  - index: 6
    speaker_id: cenk
    start_ms: 45654
    end_ms: 53897
    text_en: That fits comfortably within our annual IT allocation. Please email the formal agreement so I can submit it for
      legal review.
    text_tr: Bu yıllık IT bütçe tahsisatımıza rahatlıkla uyuyor. Hukuki incelemeye sunabilmem için lütfen resmi sözleşmeyi
      e-posta ile gönderin.
  key_vocabulary:
  - word: objective
    vocab_id: vocab.objective
    context_note_tr: Müzakere sürecinde belirlenen bütçe ve maliyet hedefleri.
  - word: customer
    vocab_id: vocab.customer
    context_note_tr: Yazılım sağlayıcısı nezdinde kurumsal müşteri ilişkisi.
  comprehension_questions:
  - id: q_b1_saas_01
    question_en: How many developer seats does Cenk plan to license for the upcoming year?
    question_tr_hint: Cenk önümüzdeki yıl için kaç geliştirici lisansı almayı planlamaktadır?
    options:
    - Ten seats
    - One thousand seats
    - Only five seats
    - One hundred and fifty seats
    correct_answer: One hundred and fifty seats
    explanation_en: 'Cenk states: ''our engineering leadership plans to expand to one hundred and fifty developers.'''
    explanation_tr: Cenk yüz elli geliştiriciye genişlemeyi planladıklarını söyler.
  - id: q_b1_saas_02
    question_en: What was the vendor's standard list price before negotiation?
    question_tr_hint: Pazarlıktan önce tedarikçinin standart liste fiyatı ne kadardı?
    options:
    - Ten dollars per seat per year
    - Forty dollars per seat per month
    - One hundred dollars per day
    - Free with advertising
    correct_answer: Forty dollars per seat per month
    explanation_en: 'Chloe states: ''Our standard enterprise tier is forty dollars per seat per month.'''
    explanation_tr: Chloe standart fiyatın aylık 40 dolar olduğunu belirtir.
  - id: q_b1_saas_03
    question_en: What condition does Cenk propose in exchange for a fifteen percent discount?
    question_tr_hint: Cenk yüzde on beş indirim karşılığında hangi şartı önermektedir?
    options:
    - Paying entirely in physical gold bullion
    - Promising never to open customer support tickets
    - Committing to a two-year contract upfront
    - Sending company developers to work in the vendor's office
    correct_answer: Committing to a two-year contract upfront
    explanation_en: 'Cenk asks: ''If we commit to a two-year contract upfront, can you offer a fifteen percent volume discount?'''
    explanation_tr: Cenk peşin iki yıllık sözleşme karşılığında %15 indirim ister.
  - id: q_b1_saas_04
    question_en: What discounted monthly seat price does Chloe agree to provide?
    question_tr_hint: Chloe kullanıcı başına hangi indirimli aylık fiyatı onaylamaktadır?
    options:
    - Thirty-four dollars per seat
    - Twenty dollars per seat
    - Thirty-nine dollars per seat
    - Fifteen dollars per seat
    correct_answer: Thirty-four dollars per seat
    explanation_en: 'Chloe confirms: ''I can definitely approve a fifteen percent reduction down to thirty-four dollars.'''
    explanation_tr: Chloe fiyatın otuz dört dolara indirilmesini onaylayabileceğini söyler.
  - id: q_b1_saas_05
    question_en: What is Cenk's next step after reaching the price agreement?
    question_tr_hint: Fiyat anlaşmasına vardıktan sonra Cenk'in bir sonraki adımı nedir?
    options:
    - Immediately wiring fifty thousand dollars from his personal account
    - Canceling all software tools used by the engineering department
    - Submitting the formal agreement for company legal review
    - Hosting an office party to celebrate the discount
    correct_answer: Submitting the formal agreement for company legal review
    explanation_en: 'Cenk requests: ''Please email the formal agreement so I can submit it for legal review.'''
    explanation_tr: Cenk resmi sözleşmenin hukuki incelemeye sunulması için gönderilmesini ister.
