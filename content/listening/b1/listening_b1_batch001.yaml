- id: listening.b1.cross-team-api-contract
  title: 'Architecture Alignment: Payment Microservice Schema'
  cefr_level: B1
  category: stakeholder_alignment
  scenario_context: Derya, a mobile tech lead, and Simon, a payments backend architect, negotiate field formats for a new
    checkout endpoint.
  speakers:
  - id: derya
    name: Derya
    role: Mobile Tech Lead
    accent: Turkish
  - id: simon
    name: Simon
    role: Payment Backend Architect
    accent: British
  audio_ref: audio/listening/b1_cross_team_api.mp3
  duration_seconds: 50
  transcript_items:
  - index: 1
    speaker_id: simon
    start_ms: 0
    end_ms: 6568
    text_en: Hi Derya. Let's align on the JSON payload for the new v2 mobile checkout API.
    text_tr: Selam Derya. Yeni v2 mobil ödeme API'si için JSON veri yükü (payload) üzerinde uzlaşalım.
  - index: 2
    speaker_id: derya
    start_ms: 6968
    end_ms: 16111
    text_en: Thanks Simon. On the mobile client, we noticed that currency amounts are currently formatted as floating-point
      numbers in your draft schema.
    text_tr: Teşekkürler Simon. Mobil istemci tarafında taslak şemanızda para birimi tutarlarının kayan noktalı (float) sayılar
      olarak biçimlendirildiğini fark ettik.
  - index: 3
    speaker_id: simon
    start_ms: 16511
    end_ms: 24879
    text_en: You are right to flag that. Floating-point numbers can introduce subtle rounding inaccuracies across different
      mobile processors.
    text_tr: Bunu belirtmekte çok haklısın. Kayan noktalı sayılar farklı mobil işlemcilerde ince yuvarlama hatalarına yol
      açabilir.
  - index: 4
    speaker_id: derya
    start_ms: 25279
    end_ms: 33377
    text_en: Exactly. We strongly recommend transmitting amounts in minor currency units—like cents—as 64-bit integers.
    text_tr: Kesinlikle. Tutarların sent gibi alt para birimi cinsinden 64-bitlik tam sayılar (integer) olarak iletilmesini
      şiddetle öneriyoruz.
  - index: 5
    speaker_id: simon
    start_ms: 33777
    end_ms: 41590
    text_en: Agreed. We will update the schema to use integer cents and add an explicit three-letter ISO currency code string.
    text_tr: Anlaştık. Şemayı tam sayı sent kullanacak şekilde güncelleyecek ve açık bir üç harfli ISO para birimi kodu ekleyeceğiz.
  - index: 6
    speaker_id: derya
    start_ms: 41990
    end_ms: 49588
    text_en: That makes our client parsing completely deterministic. I will update our Kotlin serialization models today.
    text_tr: Bu durum istemci ayrıştırmamızı tamamen deterministik hale getirir. Bugün Kotlin serileştirme modellerimizi güncelleyeceğim.
  key_vocabulary:
  - word: collaborate
    vocab_id: vocab.collaborate
    context_note_tr: Ekipler arası teknik sözleşmelerde ortak mimari uzlaşma.
  - word: verify
    vocab_id: vocab.verify
    context_note_tr: Veri tiplerinin ve API sözleşmelerinin doğrulanması.
  comprehension_questions:
  - id: q_b1_api_01
    question_en: What potential issue does Derya raise regarding floating-point numbers in the payment schema?
    question_tr_hint: Derya ödeme şemasındaki kayan noktalı (float) sayılarla ilgili hangi potansiyel sorunu gündeme getirmektedir?
    options:
    - Floating numbers double the physical battery drain of mobile smartphones
    - Floating-point numbers can cause subtle rounding inaccuracies across different mobile processors
    - They cause Android devices to automatically disconnect from Wi-Fi
    - Floating-point values cannot be stored in modern cloud databases
    correct_answer: Floating-point numbers can cause subtle rounding inaccuracies across different mobile processors
    explanation_en: Both Derya and Simon agree that floating-point numbers can lead to rounding errors across devices.
    explanation_tr: Kayan noktalı sayıların cihazlar arasında yuvarlama hatalarına yol açabileceği konusunda uzlaşırlar.
  - id: q_b1_api_02
    question_en: What data format does Derya recommend for financial amounts?
    question_tr_hint: Derya finansal tutarlar için hangi veri biçimini önermektedir?
    options:
    - Unformatted descriptive paragraphs of text
    - High-resolution photographic images of paper receipts
    - Random hexadecimal encryption hashes
    - Minor currency units as 64-bit integers
    correct_answer: Minor currency units as 64-bit integers
    explanation_en: Derya recommends transmitting amounts in minor currency units—like cents—as 64-bit integers.
    explanation_tr: Derya tutarların sent gibi alt birimlerde 64-bitlik tam sayı olarak gönderilmesini önerir.
  - id: q_b1_api_03
    question_en: What additional field will Simon incorporate into the updated schema?
    question_tr_hint: Simon güncellenmiş şemaya hangi ek alanı dahil edecektir?
    options:
    - The personal home address of the software developer
    - A link to the developer's favorite music album
    - A three-letter ISO currency code string
    - The current atmospheric temperature in London
    correct_answer: A three-letter ISO currency code string
    explanation_en: 'Simon agrees to: ''add an explicit three-letter ISO currency code string.'''
    explanation_tr: Simon açık bir üç harfli ISO para birimi kodu ekleyeceğini ifade eder.
  - id: q_b1_api_04
    question_en: What framework will Derya use to update the mobile application models?
    question_tr_hint: Derya mobil uygulama modellerini güncellemek için hangi çatıyı kullanacaktır?
    options:
    - Kotlin serialization
    - Manual paper spreadsheets
    - C++ memory pointers
    - Visual Basic scripts
    correct_answer: Kotlin serialization
    explanation_en: 'Derya states: ''I will update our Kotlin serialization models today.'''
    explanation_tr: Derya Kotlin serileştirme modellerini güncelleyeceğini söyler.
  - id: q_b1_api_05
    question_en: What is the main advantage of this change for the mobile client?
    question_tr_hint: Bu değişikliğin mobil istemci için temel avantajı nedir?
    options:
    - It cuts download file sizes by ninety-nine percent
    - It allows payments without having a valid bank account
    - It removes the need to connect to the internet
    - It makes client-side payload parsing completely deterministic
    correct_answer: It makes client-side payload parsing completely deterministic
    explanation_en: 'Derya highlights: ''That makes our client parsing completely deterministic.'''
    explanation_tr: Derya bunun istemci tarafında ayrıştırmayı tamamen deterministik kıldığını vurgular.
  topic_tags:
  - api-design
  - cross-team-alignment
  - mobile-architecture
  - data-contracts
  related_ids:
  - vocab.collaborate
  - vocab.verify
  status: APPROVED
  version: 1
- id: listening.b1.sprint-retrospective-action-items
  title: 'Sprint Retrospective: Flaky Automated UI Tests'
  cefr_level: B1
  category: engineering_meeting
  scenario_context: Tolga, a scrum master, leads a retrospective discussion with Hannah, a fullstack engineer, about reducing
    CI pipeline build times.
  speakers:
  - id: tolga
    name: Tolga
    role: Scrum Master
    accent: Turkish
  - id: hannah
    name: Hannah
    role: Fullstack Engineer
    accent: American
  audio_ref: audio/listening/b1_retro_action.mp3
  duration_seconds: 50
  transcript_items:
  - index: 1
    speaker_id: tolga
    start_ms: 0
    end_ms: 8448
    text_en: Welcome to our retrospective. Looking at our sprint retro board, the biggest frustration was slow CI build pipelines.
    text_tr: Retrospektif toplantımıza hoş geldiniz. Sprint retro panomuza baktığımızda en büyük hayal kırıklığı yavaş CI
      derleme hatlarıydı.
  - index: 2
    speaker_id: hannah
    start_ms: 8848
    end_ms: 17086
    text_en: Yes Tolga. Our build pipeline currently takes forty-two minutes because fifty end-to-end UI tests run sequentially.
    text_tr: Evet Tolga. Elli adet uçtan uca UI testi sırayla çalıştığı için derleme hattımız şu anda kırk iki dakika sürüyor.
  - index: 3
    speaker_id: tolga
    start_ms: 17486
    end_ms: 23960
    text_en: And many of those UI tests are flaky, meaning developers have to re-trigger builds multiple times.
    text_tr: Ve bu UI testlerinin çoğu kararsız (flaky), yani geliştiriciler derlemeleri birden fazla kez yeniden tetiklemek
      zorunda kalıyor.
  - index: 4
    speaker_id: hannah
    start_ms: 24360
    end_ms: 33492
    text_en: Exactly. I propose we convert thirty of those UI tests into fast unit tests and run the remaining twenty UI tests
      in parallel.
    text_tr: Kesinlikle. Bu UI testlerinin otuz tanesini hızlı birim testlerine dönüştürmeyi ve kalan yirmi UI testini paralel
      çalıştırmayı öneriyorum.
  - index: 5
    speaker_id: tolga
    start_ms: 33892
    end_ms: 40695
    text_en: That would be a massive improvement. What target build duration do you think we can realistically achieve?
    text_tr: Bu muazzam bir gelişme olur. Gerçekçi olarak hangi hedef derleme süresine ulaşabileceğimizi düşünüyorsun?
  - index: 6
    speaker_id: hannah
    start_ms: 41095
    end_ms: 49304
    text_en: With parallel execution, our pipeline should finish in under twelve minutes. I will take ownership of this action
      item.
    text_tr: Paralel yürütme ile derleme hattımız on iki dakikanın altında tamamlanmalıdır. Bu aksiyon maddesinin sorumluluğunu
      ben alacağım.
  key_vocabulary:
  - word: bottleneck
    vocab_id: vocab.bottleneck
    context_note_tr: Geliştirici hızını ve teslimat süresini engelleyen darboğaz.
  - word: maintain
    vocab_id: vocab.maintain
    context_note_tr: CI hatlarının ve test otomasyonunun sağlıklı bakımını sürdürmek.
  comprehension_questions:
  - id: q_b1_retro_01
    question_en: What was identified as the main developer frustration during the sprint?
    question_tr_hint: Sprint boyunca temel geliştirici hayal kırıklığı olarak ne belirlendi?
    options:
    - Lack of free snacks in the office kitchen
    - Slow and unreliable CI build pipelines
    - Excessive room temperature in the conference rooms
    - Computer keyboards having the wrong color keycaps
    correct_answer: Slow and unreliable CI build pipelines
    explanation_en: 'Tolga opens by pointing out: ''the biggest frustration was slow CI build pipelines.'''
    explanation_tr: Tolga en büyük hayal kırıklığının yavaş CI derleme hatları olduğunu belirtir.
  - id: q_b1_retro_02
    question_en: How long does the current build pipeline take to complete?
    question_tr_hint: Mevcut derleme hattının tamamlanması ne kadar sürüyor?
    options:
    - Forty-two minutes
    - Five minutes
    - Two full days
    - Ten seconds
    correct_answer: Forty-two minutes
    explanation_en: 'Hannah states: ''Our build pipeline currently takes forty-two minutes.'''
    explanation_tr: Hannah derleme hattının şu anda kırk iki dakika sürdüğünü söyler.
  - id: q_b1_retro_03
    question_en: What does the term 'flaky test' describe in this engineering context?
    question_tr_hint: Bu mühendislik bağlamında 'flaky test' terimi neyi tanımlamaktadır?
    options:
    - Tests that test whether the screen brightness is high enough
    - Tests written in poetic rhyming English verse
    - Tests that verify the physical weight of computer monitors
    - Tests that intermittently fail without any actual code change, forcing developers to re-trigger builds
    correct_answer: Tests that intermittently fail without any actual code change, forcing developers to re-trigger builds
    explanation_en: Tolga clarifies that flaky tests fail unpredictably, forcing developers to re-run builds.
    explanation_tr: Tolga kararsız testlerin öngörülemez şekilde başarısız olup tekrar derleme gerektirdiğini belirtir.
  - id: q_b1_retro_04
    question_en: What concrete restructuring does Hannah propose for the test suite?
    question_tr_hint: Hannah test paketi için hangi somut yeniden yapılandırmayı önermektedir?
    options:
    - Deleting all fifty UI tests and never testing software again
    - Converting thirty UI tests to unit tests and running the remaining twenty in parallel
    - Paying external contractors to click buttons manually all night
    - Running tests only once per calendar year on Christmas Eve
    correct_answer: Converting thirty UI tests to unit tests and running the remaining twenty in parallel
    explanation_en: Hannah proposes turning 30 tests into unit tests and running the rest in parallel.
    explanation_tr: Hannah 30 testi birim testine dönüştürmeyi ve kalanları paralel çalıştırmayı önerir.
  - id: q_b1_retro_05
    question_en: What target build duration does Hannah expect after completing the work?
    question_tr_hint: Hannah çalışmayı tamamladıktan sonra hangi hedef derleme süresini beklemektedir?
    options:
    - Exactly thirty-nine minutes
    - Zero seconds instantaneously
    - Under twelve minutes
    - One hour and fifteen minutes
    correct_answer: Under twelve minutes
    explanation_en: Hannah projects that with parallel execution, the pipeline should finish in under twelve minutes.
    explanation_tr: Hannah paralel yürütme ile sürenin on iki dakikanın altına ineceğini öngörür.
  topic_tags:
  - agile
  - retrospective
  - continuous-integration
  - testing
  related_ids:
  - vocab.bottleneck
  - vocab.maintain
  status: APPROVED
  version: 1
- id: listening.b1.customer-feedback-prioritization
  title: 'Backlog Grooming: Search Performance and Filtering'
  cefr_level: B1
  category: product_discovery
  scenario_context: Gizem, a customer success lead, reviews user complaint tickets with Arthur, the product owner, to prioritize
    search filters for the next release.
  speakers:
  - id: gizem
    name: Gizem
    role: Customer Success Lead
    accent: Turkish
  - id: arthur
    name: Arthur
    role: Product Owner
    accent: British
  audio_ref: audio/listening/b1_search_feedback.mp3
  duration_seconds: 54
  transcript_items:
  - index: 1
    speaker_id: arthur
    start_ms: 0
    end_ms: 8068
    text_en: Thanks for joining this grooming session, Gizem. Which customer feedback themes surfaced most frequently this
      month?
    text_tr: Bu detaylandırma oturumuna katıldığın için teşekkürler Gizem. Bu ay en sık hangi müşteri geri bildirim temaları
      ortaya çıktı?
  - index: 2
    speaker_id: gizem
    start_ms: 8468
    end_ms: 15921
    text_en: Over forty percent of user support tickets complained about our product search functionality when browsing large
      catalogs.
    text_tr: Kullanıcı destek biletlerinin yüzde kırktan fazlası, büyük kataloglara göz atarken ürün arama işlevimizden şikayet
      etti.
  - index: 3
    speaker_id: arthur
    start_ms: 16321
    end_ms: 23014
    text_en: Are users unhappy with search result accuracy, or is query response latency the primary issue?
    text_tr: Kullanıcılar arama sonuçlarının doğruluğundan mı memnun değil yoksa sorgu yanıt gecikmesi mi ana sorun?
  - index: 4
    speaker_id: gizem
    start_ms: 23414
    end_ms: 32152
    text_en: Both. Queries take more than four seconds to load, and users cannot filter search results by brand or price range.
    text_tr: Her ikisi de. Sorguların yüklenmesi dört saniyeden fazla sürüyor ve kullanıcılar arama sonuçlarını marka veya
      fiyat aralığına göre filtreleyemiyor.
  - index: 5
    speaker_id: arthur
    start_ms: 32552
    end_ms: 42895
    text_en: Understood. The backend team recently indexed the product catalog in Elasticsearch, which reduces query latency
      to under two hundred milliseconds.
    text_tr: Anlaşıldı. Backend ekibi yakın zamanda ürün kataloğunu Elasticsearch'te dizinledi, bu da sorgu gecikmesini iki
      yüz milisaniyenin altına indiriyor.
  - index: 6
    speaker_id: gizem
    start_ms: 43295
    end_ms: 52907
    text_en: That is wonderful! If we combine that with multi-select filter chips on the UI, our customer satisfaction scores
      will improve significantly.
    text_tr: Bu harika! Bunu kullanıcı arayüzündeki çoklu seçim filtreleme etiketleriyle birleştirirsek müşteri memnuniyeti
      puanlarımız belirgin şekilde artacaktır.
  key_vocabulary:
  - word: customer
    vocab_id: vocab.customer
    context_note_tr: Kullanıcı deneyimi ve müşteri destek geri bildirimleri.
  - word: effective
    vocab_id: vocab.effective
    context_note_tr: Arama deneyimini hızlandıran etkili indeksleme çözümü.
  comprehension_questions:
  - id: q_b1_feed_01
    question_en: What proportion of customer support tickets concerned the product search feature?
    question_tr_hint: Müşteri destek biletlerinin ne kadarlık bir oranı ürün arama özelliğine ilişkindi?
    options:
    - Over forty percent of tickets
    - Less than one percent
    - Exactly five tickets in total
    - One hundred percent of all company emails
    correct_answer: Over forty percent of tickets
    explanation_en: 'Gizem states: ''Over forty percent of user support tickets complained about our product search.'''
    explanation_tr: Gizem destek biletlerinin yüzde kırktan fazlasının ürün aramayla ilgili olduğunu belirtir.
  - id: q_b1_feed_02
    question_en: What are the two specific pain points users experienced when searching?
    question_tr_hint: Kullanıcıların arama yaparken yaşadığı iki spesifik sorun noktası nedir?
    options:
    - The computer monitor turns off and the search bar requires a password
    - Search results are displayed entirely in upside-down letters
    - Queries take over four seconds, and results cannot be filtered by brand or price
    - Users are charged five dollars for every word they type into the search bar
    correct_answer: Queries take over four seconds, and results cannot be filtered by brand or price
    explanation_en: Gizem explains that queries take over 4 seconds and lack brand or price filtering.
    explanation_tr: Gizem sorguların 4 saniyeden uzun sürdüğünü ve marka/fiyat filtrelemesi yapılamadığını söyler.
  - id: q_b1_feed_03
    question_en: What backend indexing technology was recently implemented to accelerate queries?
    question_tr_hint: Sorguları hızlandırmak için yakın zamanda hangi backend dizinleme teknolojisi uygulandı?
    options:
    - Handwritten index paper cards
    - Elasticsearch
    - A single flat text file stored on an office USB drive
    - Microsoft Word document tables
    correct_answer: Elasticsearch
    explanation_en: 'Arthur explains: ''The backend team recently indexed the product catalog in Elasticsearch.'''
    explanation_tr: Arthur ürün kataloğunun Elasticsearch'te dizinlendiğini açıklar.
  - id: q_b1_feed_04
    question_en: To what response time will the new search index reduce query latency?
    question_tr_hint: Yeni arama dizini sorgu gecikmesini hangi yanıt süresine indirecektir?
    options:
    - Around forty-five seconds
    - Exactly five minutes
    - Ten milliseconds slower than before
    - Under two hundred milliseconds
    correct_answer: Under two hundred milliseconds
    explanation_en: Arthur confirms it reduces latency to under two hundred milliseconds.
    explanation_tr: Arthur sürenin iki yüz milisaniyenin altına ineceğini teyit eder.
  - id: q_b1_feed_05
    question_en: What frontend UI component does Gizem suggest introducing alongside the fast backend?
    question_tr_hint: Gizem hızlı backend'in yanına hangi ön yüz UI bileşeninin eklenmesini önermektedir?
    options:
    - Flashing red pop-up advertisements
    - An automatic video player with sound enabled
    - Multi-select filter chips
    - A mandatory twenty-question satisfaction quiz
    correct_answer: Multi-select filter chips
    explanation_en: 'Gizem says: ''If we combine that with multi-select filter chips on the UI, satisfaction will improve.'''
    explanation_tr: Gizem arayüze çoklu seçim filtreleme etiketleri eklenmesini önerir.
  topic_tags:
  - product-management
  - customer-feedback
  - search-ux
  - elasticsearch
  related_ids:
  - vocab.customer
  - vocab.effective
  status: APPROVED
  version: 1
- id: listening.b1.security-audit-compliance-check
  title: 'Security Briefing: Two-Factor Authentication Compliance'
  cefr_level: B1
  category: executive_briefing
  scenario_context: Kaan, an information security analyst, briefs Rachel, the corporate compliance director, on regional two-factor
    authentication adoption.
  speakers:
  - id: kaan
    name: Kaan
    role: Security Analyst
    accent: Turkish
  - id: rachel
    name: Rachel
    role: Compliance Director
    accent: British
  audio_ref: audio/listening/b1_security_audit.mp3
  duration_seconds: 53
  transcript_items:
  - index: 1
    speaker_id: rachel
    start_ms: 0
    end_ms: 9283
    text_en: Good morning Kaan. With our external SOC 2 security audit scheduled in two weeks, where do we stand on 2FA enforcement?
    text_tr: Günaydın Kaan. İki hafta içinde harici SOC 2 güvenlik denetimimiz varken iki faktörlü kimlik doğrulama (2FA)
      zorunluluğunda ne durumdayız?
  - index: 2
    speaker_id: kaan
    start_ms: 9683
    end_ms: 17416
    text_en: Ninety-four percent of all staff across our European and Turkish offices have already enrolled their hardware
      security tokens.
