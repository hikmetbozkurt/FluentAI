- id: listening.b1.mobile-search-speed-handoff
  title: Speeding Up Mobile Search Results
  cefr_level: B1
  category: engineering_meeting
  scenario_context: Android developer Emre and API engineer Sofia diagnose why vocabulary search lags while typing quickly
    on tablets.
  speakers:
  - id: emre
    name: Emre
    role: Android Engineer
    accent: Turkish
  - id: sofia
    name: Sofia
    role: Mobile Data Engineer
    accent: British
  audio_ref: audio/listening/b1_mobile_search_speed_handoff.mp3
  duration_seconds: 62
  transcript_items:
  - index: 1
    speaker_id: emre
    start_ms: 0
    end_ms: 7668
    text_en: Sofia, on our reading library screen, typing a fast seven-letter word makes the search bar freeze for a moment.
    text_tr: Sofia, okuma kütüphanesi ekranında hızlıca yedi harfli bir kelime yazınca arama çubuğu anlık donuyor.
  - index: 2
    speaker_id: sofia
    start_ms: 8068
    end_ms: 14986
    text_en: Interesting. Is the client running a full local database query on every single keystroke right now?
    text_tr: İlginç. İstemci şu an her tek tuş vuruşunda tam yerel veritabanı sorgusu mu çalıştırıyor?
  - index: 3
    speaker_id: emre
    start_ms: 15386
    end_ms: 22619
    text_en: Yes, typing 'deliver' triggers seven separate wildcard scans back to back across the entire articles table.
    text_tr: Evet, 'deliver' yazmak tüm makaleler tablosunda art arda yedi ayrı genel tarama tetikliyor.
  - index: 4
    speaker_id: sofia
    start_ms: 23019
    end_ms: 29998
    text_en: Aha—first, add a two-hundred-millisecond debounce delay so you only query after a brief pause in typing.
    text_tr: Aha—ilk olarak yazmada kısa bir duraklamadan sonra sorgu atmak için iki yüz milisaniyelik bekleme (debounce)
      ekle.
  - index: 5
    speaker_id: emre
    start_ms: 30398
    end_ms: 37806
    text_en: Good catch. Should we also switch SQLite from leading-wildcard matching toward a prefix search index?
    text_tr: Güzel nokta. SQLite'ı da başından genel eşlemeden ön ek arama dizinine mi geçirsek?
  - index: 6
    speaker_id: sofia
    start_ms: 38206
    end_ms: 47054
    text_en: Definitely for titles over two characters! Matching prefixes hits the index immediately instead of scanning every
      summary paragraph.
    text_tr: İki karakterden uzun başlıklarda kesinlikle! Ön ek eşleşmesi her özet paragrafını taramak yerine doğrudan dizine
      çarpar.
  - index: 7
    speaker_id: emre
    start_ms: 47454
    end_ms: 53652
    text_en: I will test both updates on my older tablet tonight and check whether frame drops vanish completely.
    text_tr: Her iki güncellemeyi bu akşam eski tabletimde test edip kare düşüşlerinin tamamen kaybolup kaybolmadığına bakacağım.
  - index: 8
    speaker_id: sofia
    start_ms: 54052
    end_ms: 60800
    text_en: Awesome. Drop the before-and-after timing chart in our pull request once tests stay green.
    text_tr: Süper. Testler yeşil kaldığında çekme isteğine öncesi-sonrası süre grafiğini de bırak.
  key_vocabulary:
  - word: debounce
    context_note_tr: tuş vuruşlarını kısa bekletip tek sorgu atma
  - word: prefix
    context_note_tr: kelime başı ön eki
  - word: freeze
    context_note_tr: arayüzün kısa süre donması
  comprehension_questions:
  - id: q_listening_b1_mobile-search-speed-handoff_01
    question_en: What symptom does Emre observe when typing quickly into mobile search?
    options:
    - Saved reading bookmarks disappear silently
    - Audio MP3 playback echoes twice
    - The search input freezes momentarily on long words
    - The tablet battery drains in ten minutes
    correct_answer: The search input freezes momentarily on long words
    explanation_en: Emre notes typing a quick seven-letter word freezes the search bar momentarily.
    explanation_tr: Emre hızlıca yedi harfli bir kelime yazıldığında arama çubuğunun anlık donduğunu söyler.
  - id: q_listening_b1_mobile-search-speed-handoff_02
    question_en: Why does typing 'deliver' cause heavy redundant database work?
    options:
    - SQLite converts English letters into Turkish definitions live
    - The app uploads every keystroke over mobile cellular links
    - Each button tap reloads cover WebP images from disk
    - Every keystroke runs an immediate full-table wildcard query
    correct_answer: Every keystroke runs an immediate full-table wildcard query
    explanation_en: Typing seven letters fires seven consecutive full-table wildcard scans.
    explanation_tr: Yedi harf yazmanın art arda yedi tam tablo taramasını tetiklediği anlatılır.
  - id: q_listening_b1_mobile-search-speed-handoff_03
    question_en: What UI timing tweak does Sofia advise first?
    options:
    - Disabling offline search altogether
    - Waiting 200 milliseconds after typing pauses before querying
    - Blocking users from typing more than three characters
    - Moving search filters onto a hidden dialog
    correct_answer: Waiting 200 milliseconds after typing pauses before querying
    explanation_en: Sofia recommends adding a 200ms debounce delay before dispatching the query.
    explanation_tr: Sofia 200 milisaniyelik debounce gecikmesi eklenmesini önerir.
  - id: q_listening_b1_mobile-search-speed-handoff_04
    question_en: How does prefix matching speed up the query itself?
    options:
    - It uses a fast SQL index rather than scanning full summary text
    - It caches results on an external website
    - It removes shorter A2 articles from search scope
    - It stores text inside unindexed JSON files
    correct_answer: It uses a fast SQL index rather than scanning full summary text
    explanation_en: Sofia notes prefix queries use the index cleanly instead of scanning every paragraph.
    explanation_tr: Sofia ön ek aramasının tüm paragrafları taramak yerine doğrudan dizini kullandığını açıklar.
  - id: q_listening_b1_mobile-search-speed-handoff_05
    question_en: What evidence should Emre attach to the code review?
    options:
    - Written surveys from clinic coordinators
    - Three pages of server logs
    - Updated tablet battery receipts
    - Before-and-after query timing benchmarks alongside green tests
    correct_answer: Before-and-after query timing benchmarks alongside green tests
    explanation_en: Sofia asks for a before-and-after timing chart on the pull request once tests pass.
    explanation_tr: Sofia testler geçince çekme isteğine öncesi-sonrası süre grafiğinin konmasını ister.
  topic_tags:
  - android
  - performance
  - search
