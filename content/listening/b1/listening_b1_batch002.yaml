- id: listening.b1.internship-interview-prep
  title: Preparing for a Tech Internship Interview
  cefr_level: B1
  category: stakeholder_alignment
  scenario_context: Defne consults career coach Andrew to practice behavioral interview questions and refine her technical
    storytelling using the STAR methodology.
  speakers:
  - id: andrew
    name: Andrew
    role: University Career Coach
    accent: British
  - id: defne
    name: Defne
    role: Computer Science Junior
    accent: Turkish
  audio_ref: audio/listening/b1_internship_interview_prep.mp3
  duration_seconds: 84
  transcript_items:
  - index: 1
    speaker_id: andrew
    start_ms: 0
    end_ms: 9733
    text_en: Welcome Defne! Congratulations on securing an interview with the cloud infrastructure team. How are your preparations
      coming along?
    text_tr: Hoş geldin Defne! Bulut altyapı ekibiyle mülakat ayarladığın için tebrikler. Hazırlıkların nasıl gidiyor?
  - index: 2
    speaker_id: defne
    start_ms: 10133
    end_ms: 21160
    text_en: Thank you Andrew. I feel confident with data structure coding challenges, but I struggle to articulate my project
      experience concisely in behavioral interviews.
    text_tr: Teşekkürler Andrew. Veri yapıları kodlama sorularında kendime güveniyorum ancak davranışsal mülakatlarda proje
      deneyimimi özlü bir şekilde ifade etmekte zorlanıyorum.
  - index: 3
    speaker_id: andrew
    start_ms: 21560
    end_ms: 31568
    text_en: 'That is very common among technical students. The key framework you must master is the STAR method: Situation,
      Task, Action, and Result.'
    text_tr: 'Bu teknik öğrenciler arasında çok yaygındır. Ustalaşman gereken temel çerçeve STAR yöntemidir: Durum (Situation),
      Görev (Task), Eylem (Action) ve Sonuç (Result).'
  - index: 4
    speaker_id: defne
    start_ms: 31968
    end_ms: 37881
    text_en: How should I structure the 'Action' portion without sounding like I am just listing technical tools?
    text_tr: Sadece teknik araçları listeliyormuş gibi görünmeden 'Eylem' kısmını nasıl yapılandırmalıyım?
  - index: 5
    speaker_id: andrew
    start_ms: 38281
    end_ms: 49969
    text_en: Focus on the engineering trade-offs you evaluated. Explain why you chose PostgreSQL over a NoSQL database, and
      highlight your specific individual contribution.
    text_tr: Değerlendirdiğin mühendislik ödünleşimlerine odaklan. Neden NoSQL yerine PostgreSQL'i seçtiğini açıkla ve kendi
      bireysel katkını vurgula.
  - index: 6
    speaker_id: defne
    start_ms: 50369
    end_ms: 59916
    text_en: That makes sense. In my open-source project, I optimized SQL indexing and reduced query execution latency by
      forty percent.
    text_tr: Bu mantıklı. Açık kaynak projemde SQL indekslemeyi optimize ettim ve sorgu yürütme gecikmesini yüzde kırk oranında
      azalttım.
  - index: 7
    speaker_id: andrew
    start_ms: 60316
    end_ms: 68739
    text_en: That is a stellar quantified metric! Interviewers love concrete numbers demonstrating tangible business or technical
      value.
    text_tr: Bu harika bir somutlaştırılmış metrik! Mülakatı yapanlar somut ticari veya teknik değeri gösteren net sayıları
      çok severler.
  - index: 8
    speaker_id: defne
    start_ms: 69139
    end_ms: 74657
    text_en: What thoughtful questions should I ask the engineering manager at the conclusion of the interview?
    text_tr: Mülakatın sonunda mühendislik yöneticisine hangi düşünceli soruları sormalıyım?
  - index: 9
    speaker_id: andrew
    start_ms: 75057
    end_ms: 82935
    text_en: Ask about their on-call incident rotation culture or how the team handles technical debt alongside new product
      feature velocity.
    text_tr: Nöbetçi arıza müdahale rotasyon kültürlerini veya ekibin yeni ürün özellikleri geliştirirken teknik borcu nasıl
      yönettiğini sor.
  comprehension_questions:
  - id: q_listening_b1_internship-interview-prep_01
    question_en: Which interview component does Defne find most challenging?
    question_tr_hint: Defne mülakatın hangi bileşenini en zorlu buluyor?
    options:
    - Writing complex algorithmic sorting code in Python.
    - Speaking English with a formal British accent.
    - Answering basic questions about computer hardware.
    - Articulating project experiences concisely in behavioral questions.
    correct_answer: Articulating project experiences concisely in behavioral questions.
    explanation_en: Defne explains she struggles to articulate project experience concisely in behavioral interviews.
    explanation_tr: Defne davranışsal mülakatlarda deneyimlerini özlü aktarmakta zorlandığını belirtir.
  - id: q_listening_b1_internship-interview-prep_02
    question_en: What does the STAR interview framework stand for?
    question_tr_hint: STAR mülakat çerçevesi ne anlama gelir?
    options:
    - Speed, Timing, Accuracy, and Response.
    - Situation, Task, Action, and Result.
    - Strategy, Testing, Analysis, and Review.
    - Software, Technology, Architecture, and Reliability.
    correct_answer: Situation, Task, Action, and Result.
    explanation_en: Andrew explains STAR stands for Situation, Task, Action, and Result.
    explanation_tr: Andrew STAR'ın Durum, Görev, Eylem ve Sonuç anlamına geldiğini açıklar.
  - id: q_listening_b1_internship-interview-prep_03
    question_en: What quantified achievement does Defne highlight from her open-source project?
    question_tr_hint: Defne açık kaynak projesinden hangi somutlaştırılmış başarıyı vurguluyor?
    options:
    - Reduced query execution latency by forty percent through SQL indexing.
    - Raised ten million dollars in private venture capital.
    - Deleted all database tables to save server space.
    - Wrote one million lines of code in two days.
    correct_answer: Reduced query execution latency by forty percent through SQL indexing.
    explanation_en: Defne mentions optimizing SQL indexing and cutting query latency by 40%.
    explanation_tr: Defne SQL indekslemeyi optimize edip sorgu gecikmesini %40 azalttığını belirtir.
  - id: q_listening_b1_internship-interview-prep_04
    question_en: Why does Andrew praise Defne's latency optimization example?
    question_tr_hint: Andrew Defne'nin gecikme optimizasyonu örneğini neden övüyor?
    options:
    - It shows she memorized the entire PostgreSQL documentation.
    - It indicates she has ten years of corporate executive experience.
    - It proves she can work seventy hours per week without sleep.
    - Interviewers appreciate concrete metrics demonstrating tangible technical value.
    correct_answer: Interviewers appreciate concrete metrics demonstrating tangible technical value.
    explanation_en: Andrew notes interviewers love concrete numbers demonstrating tangible value.
    explanation_tr: Andrew mülakatçıların somut değeri gösteren net sayıları sevdiğini belirtir.
  - id: q_listening_b1_internship-interview-prep_05
    question_en: What thoughtful question does Andrew recommend asking the manager?
    question_tr_hint: Andrew yöneticiye hangi düşünceli soruyu sormayı öneriyor?
    options:
    - How much money the company president earns each year.
    - How the team handles technical debt alongside product feature development.
    - Whether employees are allowed to sleep during working hours.
    - How many free snacks are stocked in the office kitchen.
    correct_answer: How the team handles technical debt alongside product feature development.
    explanation_en: Andrew suggests asking about technical debt management alongside feature velocity.
    explanation_tr: Andrew özellik hızı yanında teknik borcun nasıl yönetildiğini sormayı önerir.
  topic_tags:
  - work-career
  - interview
  - career
  - soft-skills
