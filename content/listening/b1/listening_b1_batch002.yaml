- id: listening.b1.bike-repair-shop
  title: Diagnosing a Bicycle Drivetrain Problem
  cefr_level: B1
  category: product_discovery
  scenario_context: Can brings his commuter bicycle to a neighborhood cycle shop after hearing grinding sounds in the drivetrain,
    consulting mechanic Sam.
  speakers:
  - id: sam
    name: Sam
    role: Bicycle Mechanic
    accent: British
  - id: can
    name: Can
    role: Cyclist
    accent: Turkish
  audio_ref: audio/listening/b1_bike_repair_shop.mp3
  duration_seconds: 64
  transcript_items:
  - index: 1
    speaker_id: sam
    start_ms: 0
    end_ms: 5354
    text_en: Good afternoon! What seems to be the problem with your commuter bike today?
    text_tr: Tünaydın! Bugün şehir bisikletinizle ilgili sorun nedir?
  - index: 2
    speaker_id: can
    start_ms: 5754
    end_ms: 13962
    text_en: Hi Sam. Whenever I pedal uphill or shift into higher gears, there is a metallic grinding sound near the rear
      wheel.
    text_tr: Merhaba Sam. Ne zaman yokuş yukarı pedal çevirsem ya da yüksek vitese geçsem arka tekerleğin yakınından metalik
      bir sürtünme sesi geliyor.
  - index: 3
    speaker_id: sam
    start_ms: 14362
    end_ms: 22130
    text_en: Let me put it on the repair stand and check the rear derailleur alignment. Ah, your chain is significantly stretched.
    text_tr: Tamir sehpasına koyup arka aktarıcı hizalamasını kontrol edeyim. Ah, zinciriniz belirgin şekilde esnemiş.
  - index: 4
    speaker_id: can
    start_ms: 22530
    end_ms: 26189
    text_en: Does a stretched chain damage the cassette cogs as well?
    text_tr: Esnemiş bir zincir kaset dişlilerine de zarar verir mi?
  - index: 5
    speaker_id: sam
    start_ms: 26589
    end_ms: 36117
    text_en: Yes, if you ride with a worn chain, the teeth on the cassette wear down unevenly. Fortunately, your cassette
      still looks serviceable.
    text_tr: Evet, aşınmış bir zincirle sürerseniz kasetteki dişler dengesiz aşınır. Neyse ki kasetiniz hala kullanılabilir
      durumda görünüyor.
  - index: 6
    speaker_id: can
    start_ms: 36517
    end_ms: 42885
    text_en: That is a relief. How much would a replacement nine-speed chain and basic tune-up cost?
    text_tr: Bu rahatlatıcı. Dokuz vitesli yeni bir zincir ve temel bakım ne kadara mal olur?
  - index: 7
    speaker_id: sam
    start_ms: 43285
    end_ms: 50873
    text_en: A durable nickel-plated chain is twenty-five pounds, and labor for the safety inspection and indexing is twenty
      pounds.
    text_tr: Dayanıklı nikel kaplı bir zincir yirmi beş sterlin, güvenlik denetimi ve vites ayarı işçiliği ise yirmi sterlindir.
  - index: 8
    speaker_id: can
    start_ms: 51273
    end_ms: 57137
    text_en: Sounds great. Could I pick it up tomorrow afternoon before my evening commute?
    text_tr: Harika. Yarın öğleden sonra akşam iş çıkışı yolculuğumdan önce alabilir miyim?
  - index: 9
    speaker_id: sam
    start_ms: 57537
    end_ms: 63385
    text_en: Absolutely. I will have it fully tuned and test-ridden by three o'clock tomorrow.
    text_tr: Kesinlikle. Yarın saat üçe kadar tamamen ayarlanmış ve test edilmiş olarak hazır ederim.
  comprehension_questions:
  - id: q_listening_b1_bike-repair-shop_01
    question_en: What specific noise prompted Can to bring his bicycle to the shop?
    question_tr_hint: Can'ın bisikletini dükkana getirmesine hangi ses neden oldu?
    options:
    - A high-pitched squealing from the front hydraulic brakes.
    - A loud clicking from the handlebars during turns.
    - An air leakage hissing from the front tire tube.
    - A metallic grinding sound near the rear wheel when pedaling uphill.
    correct_answer: A metallic grinding sound near the rear wheel when pedaling uphill.
    explanation_en: Can explains that he hears metallic grinding near the rear wheel under load.
    explanation_tr: Can yük altındayken arka tekerlek yakınında metalik bir sürtünme duyduğunu açıklar.
  - id: q_listening_b1_bike-repair-shop_02
    question_en: What primary mechanical issue does Sam discover upon inspection?
    question_tr_hint: Sam inceleme sırasında hangi temel mekanik sorunu keşfediyor?
    options:
    - The hydraulic brake fluid has completely leaked out.
    - The bicycle chain is significantly stretched from wear.
    - The pedal crank arm has fallen off.
    - The rear wheel frame is completely cracked.
    correct_answer: The bicycle chain is significantly stretched from wear.
    explanation_en: Sam discovers that the chain is significantly stretched.
    explanation_tr: Sam zincirin belirgin şekilde esnediğini keşfeder.
  - id: q_listening_b1_bike-repair-shop_03
    question_en: What is the condition of the rear cassette?
    question_tr_hint: Arka kaset dişlisinin durumu nasıldır?
    options:
    - It is still serviceable and does not need immediate replacement.
    - It is completely stripped and dangerously broken.
    - It has completely rusted through from rainwater.
    - It was missing three critical mounting bolts.
    correct_answer: It is still serviceable and does not need immediate replacement.
    explanation_en: Sam confirms the cassette still looks serviceable.
    explanation_tr: Sam kasetin hala kullanılabilir durumda olduğunu doğrular.
  - id: q_listening_b1_bike-repair-shop_04
    question_en: What is the total estimated cost for the replacement chain and labor?
    question_tr_hint: Değiştirilen zincir ve işçilik için tahmini toplam maliyet nedir?
    options:
    - Forty-five pounds.
    - Twenty pounds.
    - One hundred pounds.
    - Seventy-five pounds.
    correct_answer: Forty-five pounds.
    explanation_en: Twenty-five pounds for chain plus twenty pounds for labor equals 45 pounds.
    explanation_tr: 25 sterlin zincir ve 20 sterlin işçilik toplamda 45 sterlin eder.
  - id: q_listening_b1_bike-repair-shop_05
    question_en: When will the bicycle be ready for pickup?
    question_tr_hint: Bisiklet ne zaman teslim alınmaya hazır olacak?
    options:
    - In one month after replacement parts arrive.
    - Late next week on Friday evening.
    - Immediately within ten minutes.
    - By 3:00 PM tomorrow afternoon.
    correct_answer: By 3:00 PM tomorrow afternoon.
    explanation_en: Sam promises it will be tuned and tested by 3:00 PM tomorrow.
    explanation_tr: Sam yarın saat 15:00'e kadar ayarlanıp test edilmiş olacağını taahhüt eder.
  topic_tags:
  - daily-life
  - transportation
  - bicycle
  - repair
- id: listening.b1.home-broadband-upgrade
  title: Troubleshooting Home Internet and Upgrading to Fiber
  cefr_level: B1
  category: incident_response
  scenario_context: Merve calls customer technical support to resolve frequent home Wi-Fi disconnects and explores upgrading
    to a fiber optic connection with technician David.
  speakers:
  - id: david
    name: David
    role: Technical Support Specialist
    accent: American
  - id: merve
    name: Merve
    role: Broadband Customer
    accent: Turkish
  audio_ref: audio/listening/b1_home_broadband_upgrade.mp3
  duration_seconds: 72
  transcript_items:
  - index: 1
    speaker_id: david
    start_ms: 0
    end_ms: 7363
    text_en: Thank you for calling Apex Broadband support. My name is David. How can I help you?
    text_tr: Apex Genişbant desteğini aradığınız için teşekkürler. Benim adım David. Size nasıl yardımcı olabilirim?
  - index: 2
    speaker_id: merve
    start_ms: 7763
    end_ms: 16841
    text_en: Hi David. My home internet connection keeps dropping during critical video meetings for work. The router lights
      turn amber.
    text_tr: Merhaba David. Ev internet bağlantım iş için yaptığım kritik video toplantıları sırasında sürekli kopuyor. Yönlendirici
      ışıkları turuncuya dönüyor.
  - index: 3
    speaker_id: david
    start_ms: 17241
    end_ms: 26654
    text_en: I can run a remote line diagnostic right now. Yes, I see significant packet loss and latency spikes on your copper
      DSL line.
    text_tr: Hemen uzaktan bir hat tanılama testi çalıştırabilirim. Evet, bakır DSL hattınızda belirgin paket kaybı ve gecikme
      sıçramaları görüyorum.
  - index: 4
    speaker_id: merve
    start_ms: 27054
    end_ms: 31908
    text_en: Is the issue with my internal wireless router or the physical neighborhood line?
    text_tr: Sorun benim dahili kablosuz yönlendiricimde mi yoksa mahalledeki fiziksel hatta mı?
  - index: 5
    speaker_id: david
    start_ms: 32308
    end_ms: 41910
    text_en: It is electrical interference on the legacy copper line from the street cabinet. However, optical fiber was installed
      in your street last month.
    text_tr: Sokak panosundan gelen eski bakır hattaki elektriksel parazitten kaynaklanıyor. Ancak geçen ay sokağınıza optik
      fiber döşendi.
  - index: 6
    speaker_id: merve
    start_ms: 42310
    end_ms: 46559
    text_en: What speeds and pricing would a full fiber optic upgrade offer?
    text_tr: Tam bir fiber optik yükseltme hangi hızları ve fiyatlandırmayı sunar?
  - index: 7
    speaker_id: david
    start_ms: 46959
    end_ms: 55967
    text_en: Our 500-megabit symmetrical fiber plan is forty-five dollars a month, which is actually five dollars cheaper
      than your current legacy plan.
    text_tr: 500 megabitlik simetrik fiber planımız ayda kırk beş dolar, bu da aslında mevcut eski planınızdan beş dolar daha
      ucuz.
  - index: 8
    speaker_id: merve
    start_ms: 56367
    end_ms: 63080
    text_en: That is fantastic. How soon can a field technician install the optical termination box?
    text_tr: Bu harika. Bir saha teknisyeni optik sonlandırma kutusunu ne kadar sürede kurabilir?
  - index: 9
    speaker_id: david
    start_ms: 63480
    end_ms: 70783
    text_en: We have an open installation slot this Thursday morning between nine and eleven. I will book that for you right
      away.
    text_tr: Bu perşembe sabahı dokuz ile on bir arasında açık bir kurulum randevumuz var. Sizin için hemen ayırtıyorum.
  comprehension_questions:
  - id: q_listening_b1_home-broadband-upgrade_01
    question_en: What symptom alerts Merve that her internet connection has dropped?
    question_tr_hint: Merve'yi internet bağlantısının koptuğuna dair hangi belirti uyarıyor?
    options:
    - Her router lights turn amber and video calls freeze.
    - Her laptop computer automatically shuts down.
    - The television screen turns completely purple.
    - A loud siren sounds from the wall outlet.
    correct_answer: Her router lights turn amber and video calls freeze.
    explanation_en: Merve states that her router lights turn amber during video meeting drops.
    explanation_tr: Merve video toplantıları koparken yönlendirici ışıklarının turuncuya döndüğünü belirtir.
  - id: q_listening_b1_home-broadband-upgrade_02
    question_en: What is the technical root cause of Merve's connectivity issues?
    question_tr_hint: Merve'nin bağlantı sorunlarının teknik kök nedeni nedir?
    options:
    - Merve exceeding her monthly data download ceiling.
    - A malicious virus infecting Merve's mobile smartphone.
    - Underground earthquake tremors severing submarine cables.
    - Electrical interference on the legacy copper DSL line from the street cabinet.
    correct_answer: Electrical interference on the legacy copper DSL line from the street cabinet.
    explanation_en: David explains it is electrical interference on the legacy copper line.
    explanation_tr: David eski bakır hattaki elektriksel parazitten kaynaklandığını açıklar.
  - id: q_listening_b1_home-broadband-upgrade_03
    question_en: What infrastructure improvement was recently completed on Merve's street?
    question_tr_hint: Merve'nin sokağında yakın zamanda hangi altyapı iyileştirmesi tamamlandı?
    options:
    - Optical fiber was installed last month.
    - All telephone wires were completely removed.
    - A new satellite communications tower was built.
    - A massive electrical power plant was constructed.
    correct_answer: Optical fiber was installed last month.
    explanation_en: David notes that optical fiber was installed in her street last month.
    explanation_tr: David sokağa geçen ay optik fiber döşendiğini belirtir.
  - id: q_listening_b1_home-broadband-upgrade_04
    question_en: How does the price of the 500-megabit fiber plan compare to Merve's current bill?
    question_tr_hint: 500 megabitlik fiber planın fiyatı Merve'nin mevcut faturasıyla nasıl karşılaştırılır?
    options:
    - It requires paying one thousand dollars upfront.
    - It is forty-five dollars a month, which is five dollars cheaper.
    - It is fifty dollars more expensive each month.
    - It costs exactly double the price of the copper plan.
    correct_answer: It is forty-five dollars a month, which is five dollars cheaper.
    explanation_en: David explains it is $45/month, which is five dollars cheaper than her current plan.
    explanation_tr: David ayda 45 dolar olduğunu ve mevcut plandan 5 dolar daha ucuz olduğunu açıklar.
  - id: q_listening_b1_home-broadband-upgrade_05
    question_en: When is the technician scheduled to install the fiber box?
    question_tr_hint: Teknisyenin fiber kutusunu kurması ne zamana planlanıyor?
    options:
    - This Thursday morning between 9:00 and 11:00 AM.
    - Late on Sunday evening after dinner.
    - Next month on the final business day.
    - In six weeks after city council approval.
    correct_answer: This Thursday morning between 9:00 and 11:00 AM.
    explanation_en: David books the installation slot for this Thursday morning between 9 and 11.
    explanation_tr: David kurulumu bu perşembe sabahı 9 ile 11 arasına kaydeder.
  topic_tags:
  - daily-life
  - technology
  - internet
  - support
- id: listening.b1.airport-lost-luggage
  title: Filing a Lost Baggage Claim at Dublin Airport
  cefr_level: B1
  category: incident_response
  scenario_context: Tolga speaks with an airline baggage recovery agent, Brenda, after his checked suitcase fails to appear
    on the carousel following an international flight.
  speakers:
  - id: brenda
    name: Brenda
    role: Baggage Services Agent
    accent: Irish
  - id: tolga
    name: Tolga
    role: Arriving Passenger
    accent: Turkish
  audio_ref: audio/listening/b1_airport_lost_luggage.mp3
  duration_seconds: 75
  transcript_items:
  - index: 1
    speaker_id: brenda
    start_ms: 0
    end_ms: 6204
    text_en: Hello sir, welcome to Dublin Baggage Enquiries. How can I assist you?
    text_tr: Merhaba efendim, Dublin Bagaj Danışma'ya hoş geldiniz. Size nasıl yardımcı olabilirim?
  - index: 2
    speaker_id: tolga
    start_ms: 6604
    end_ms: 18011
    text_en: Hi Brenda. I just arrived on flight EI 452 from Frankfurt. The carousel stopped, but my large checked suitcase
      never arrived.
    text_tr: Merhaba Brenda. Frankfurt'tan gelen EI 452 sefer sayılı uçuşla az önce indim. Bagaj bandı durdu ancak büyük teslim
      edilmiş valizim hiç gelmedi.
  - index: 3
    speaker_id: brenda
    start_ms: 18411
    end_ms: 25395
    text_en: I am very sorry about that. Could you hand me your boarding pass with the baggage receipt barcode attached?
    text_tr: Bunun için çok üzgünüm. Bagaj fişi barkodunun ekli olduğu biniş kartınızı bana uzatabilir misiniz?
  - index: 4
    speaker_id: tolga
    start_ms: 25795
    end_ms: 31813
    text_en: Here it is. The tag number is TK 89204.
    text_tr: İşte burada. Etiket numarası TK 89204.
  - index: 5
    speaker_id: brenda
    start_ms: 32213
    end_ms: 42541
    text_en: Thank you. Let me check the global baggage tracking database. Ah, your bag missed the tight connection in Frankfurt
      due to the late transfer gate.
    text_tr: Teşekkürler. Küresel bagaj takip veritabanını kontrol edeyim. Ah, valiziniz Frankfurt'taki geç transfer kapısı
      nedeniyle dar bağlantıyı kaçırmış.
  - index: 6
    speaker_id: tolga
    start_ms: 42941
    end_ms: 47260
    text_en: Where is the suitcase now, and when can I expect to receive it?
    text_tr: Valiz şu anda nerede ve ne zaman teslim almayı bekleyebilirim?
  - index: 7
    speaker_id: brenda
    start_ms: 47660
    end_ms: 57337
    text_en: It has already been scanned onto the next evening flight, arriving here at eight tonight. A courier will deliver
      it directly to your hotel tomorrow morning.
    text_tr: Bu akşam sekizde buraya varacak olan bir sonraki akşam uçuşuna çoktan tarandı. Bir kurye yarın sabah doğrudan
      otelinize teslim edecek.
  - index: 8
    speaker_id: tolga
    start_ms: 57737
    end_ms: 64111
    text_en: That is good news. Do I receive emergency funds to buy essential toiletries tonight?
    text_tr: Bu iyi haber. Bu gece temel tuvalet malzemeleri satın almak için acil durum ödeneği alıyor muyum?
  - index: 9
    speaker_id: brenda
    start_ms: 64511
    end_ms: 73773
    text_en: Yes, you can claim up to seventy-five euros for essential hygiene items with valid store receipts. Here is your
      reference file number.
    text_tr: Evet, geçerli mağaza fişleriyle temel hijyen ürünleri için yetmiş beş avroya kadar talepte bulunabilirsiniz.
      İşte referans dosya numaranız.
  comprehension_questions:
  - id: q_listening_b1_airport-lost-luggage_01
    question_en: On which flight did Tolga arrive in Dublin?
    question_tr_hint: Tolga Dublin'e hangi uçuşla vardı?
    options:
    - Flight BA 101 from London Heathrow.
    - Flight AF 789 from Paris Charles de Gaulle.
    - Flight EI 452 from Frankfurt.
    - Flight TK 200 from Istanbul Atatürk.
    correct_answer: Flight EI 452 from Frankfurt.
    explanation_en: Tolga explicitly mentions arriving on flight EI 452 from Frankfurt.
    explanation_tr: Tolga Frankfurt'tan EI 452 uçuşuyla geldiğini açıkça belirtir.
  - id: q_listening_b1_airport-lost-luggage_02
    question_en: Why did Tolga's suitcase fail to arrive on the carousel?
    question_tr_hint: Tolga'nın valizi bagaj bandına neden ulaşamadı?
    options:
    - It was confiscated by border customs agents.
    - It fell out of the airplane cargo door in flight.
    - The suitcase was physically destroyed by airport machinery.
    - It missed a tight connection in Frankfurt due to a late transfer.
    correct_answer: It missed a tight connection in Frankfurt due to a late transfer.
    explanation_en: Brenda explains the bag missed the tight connection in Frankfurt.
    explanation_tr: Brenda valizin Frankfurt'taki dar bağlantıyı kaçırdığını açıklar.
  - id: q_listening_b1_airport-lost-luggage_03
    question_en: When will the missing suitcase arrive in Dublin?
    question_tr_hint: Kayıp valiz Dublin'e ne zaman varacak?
    options:
    - At 8:00 PM tonight on the next evening flight.
    - At midnight next Saturday.
    - In two weeks after customs clearance.
    - Never; it is permanently lost.
    correct_answer: At 8:00 PM tonight on the next evening flight.
    explanation_en: Brenda states it was scanned onto the next flight arriving at 8:00 PM tonight.
    explanation_tr: Brenda bu akşam 20:00'de varacak sonraki uçuşa yüklendiğini belirtir.
  - id: q_listening_b1_airport-lost-luggage_04
    question_en: How will the suitcase be delivered to Tolga?
    question_tr_hint: Valiz Tolga'ya nasıl teslim edilecek?
    options:
    - A courier will deliver it directly to his hotel tomorrow morning.
    - It will be sent via national postal envelope.
    - Tolga must return to the airport and search the basement.
    - He must collect it from the Frankfurt train terminal.
    correct_answer: A courier will deliver it directly to his hotel tomorrow morning.
    explanation_en: Brenda confirms a courier will deliver it directly to his hotel tomorrow morning.
    explanation_tr: Brenda bir kuryenin yarın sabah doğrudan otele teslim edeceğini onaylar.
  - id: q_listening_b1_airport-lost-luggage_05
    question_en: What compensation does Brenda offer for essential hygiene items?
    question_tr_hint: Brenda temel hijyen ürünleri için nasıl bir tazminat sunuyor?
    options:
    - Up to seventy-five euros with valid store receipts.
    - One thousand euros in cash immediately.
    - A free business-class ticket for his next journey.
    - A box of sample soaps from the airline lounge.
    correct_answer: Up to seventy-five euros with valid store receipts.
    explanation_en: Brenda explains he can claim up to 75 euros for essential items with receipts.
    explanation_tr: Brenda fişlerle 75 avroya kadar talepte bulunabileceğini açıklar.
  topic_tags:
  - travel
  - airport
  - baggage
  - lost-and-found
- id: listening.b1.gym-membership-fitness
  title: Consulting a Personal Trainer at a Fitness Center
  cefr_level: B1
  category: product_discovery
  scenario_context: Yasemin visits a health club to discuss creating a sustainable workout routine to counteract sedentary
    desk work with personal trainer Marcus.
  speakers:
  - id: marcus
    name: Marcus
    role: Senior Fitness Coach
    accent: American
  - id: yasemin
    name: Yasemin
    role: New Club Member
    accent: Turkish
  audio_ref: audio/listening/b1_gym_membership_fitness.mp3
  duration_seconds: 72
  transcript_items:
  - index: 1
    speaker_id: marcus
    start_ms: 0
    end_ms: 6933
    text_en: Welcome to Peak Fitness Yasemin! What fitness goals are you hoping to achieve over the next six months?
    text_tr: Peak Fitness'a hoş geldin Yasemin! Önümüzdeki altı ay içinde hangi fitness hedeflerine ulaşmayı umuyorsun?
  - index: 2
    speaker_id: yasemin
    start_ms: 7333
    end_ms: 17976
    text_en: Hi Marcus. As a remote software engineer, I spend ten hours a day sitting. I have lower back stiffness and low
      cardiovascular stamina.
    text_tr: Merhaba Marcus. Uzaktan çalışan bir yazılım mühendisi olarak günde on saat oturuyorum. Bel tutulmam ve düşük
      kardiyovasküler dayanıklılığım var.
  - index: 3
    speaker_id: marcus
    start_ms: 18376
    end_ms: 26674
    text_en: That is very common with desk professionals. We should prioritize posterior chain strengthening and functional
      core mobility.
    text_tr: Masa başı profesyonellerinde bu çok yaygındır. Arka zincir güçlendirmesine ve fonksiyonel merkez bölgesi hareketliliğine
      öncelik vermeliyiz.
  - index: 4
    speaker_id: yasemin
    start_ms: 27074
    end_ms: 32367
    text_en: I am worried about lifting heavy barbells because I have never done weight training before.
    text_tr: Ağır halter kaldırma konusunda endişeliyim çünkü daha önce hiç ağırlık antrenmanı yapmadım.
  - index: 5
    speaker_id: marcus
    start_ms: 32767
    end_ms: 42100
    text_en: Do not worry. We start with bodyweight movement mechanics, resistance bands, and kettlebell goblet squats to
      establish solid posture.
    text_tr: Endişelenme. Sağlam bir duruş oluşturmak için vücut ağırlığı hareket mekaniği, direnç bantları ve kettlebell
      goblet squat ile başlıyoruz.
  - index: 6
    speaker_id: yasemin
    start_ms: 42500
    end_ms: 47388
    text_en: How many days per week would you recommend for an effective but manageable commitment?
    text_tr: Etkili ancak yönetilebilir bir taahhüt için haftada kaç gün önerirsiniz?
  - index: 7
    speaker_id: marcus
    start_ms: 47788
    end_ms: 57136
    text_en: Three forty-five-minute sessions per week is optimal. It builds steady neuromuscular adaptation without triggering
      systemic central nervous fatigue.
    text_tr: Haftada kırk beş dakikalık üç seans optimaldir. Merkezi sinir sistemi yorgunluğunu tetiklemeden istikrarlı nöromüsküler
      adaptasyon oluşturur.
  - index: 8
    speaker_id: yasemin
    start_ms: 57536
    end_ms: 62894
    text_en: Does the premium membership include access to the heated recovery hydrotherapy pool?
    text_tr: Premium üyelik ısıtmalı toparlanma hidroterapi havuzuna erişimi içeriyor mu?
  - index: 9
    speaker_id: marcus
    start_ms: 63294
    end_ms: 71612
