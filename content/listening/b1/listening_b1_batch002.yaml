- id: listening.b1.restaurant-table-reservation
  title: Arranging a Corporate Team Dinner Reservation
  cefr_level: B1
  category: stakeholder_alignment
  scenario_context: Emre phones an Italian bistro host, Laura, to book a private dining table for ten colleagues and accommodate
    specific dietary requirements.
  speakers:
  - id: laura
    name: Laura
    role: Restaurant Maitre d'
    accent: Italian
  - id: emre
    name: Emre
    role: Team Lead
    accent: Turkish
  audio_ref: audio/listening/b1_restaurant_table_reservation.mp3
  duration_seconds: 64
  transcript_items:
  - index: 1
    speaker_id: laura
    start_ms: 0
    end_ms: 6969
    text_en: Buonasera, Trattoria Bella Vista. Laura speaking. How can I help you?
    text_tr: İyi akşamlar, Trattoria Bella Vista. Ben Laura. Size nasıl yardımcı olabilirim?
  - index: 2
    speaker_id: emre
    start_ms: 7369
    end_ms: 14927
    text_en: Hello Laura. I would like to reserve a table for a party of ten colleagues this coming Friday evening at seven
      thirty.
    text_tr: Merhaba Laura. Bu cuma akşamı saat yedi buçukta on kişilik bir meslektaş grubu için masa ayırtmak istiyorum.
  - index: 3
    speaker_id: laura
    start_ms: 15327
    end_ms: 22250
    text_en: Friday is quite busy, but we have a lovely semi-private alcove in the garden room available at seven thirty.
    text_tr: Cuma oldukça yoğun, ancak saat yedi buçukta bahçe odasında çok hoş yarı özel bir bölmemiz müsait.
  - index: 4
    speaker_id: emre
    start_ms: 22650
    end_ms: 29948
    text_en: That would be wonderful. Two of our colleagues have severe gluten allergies, and one is strictly vegan.
    text_tr: Bu harika olur. İki meslektaşımızın ciddi glüten alerjisi var ve biri kesinlikle vegan.
  - index: 5
    speaker_id: laura
    start_ms: 30348
    end_ms: 40680
    text_en: That is no problem at all. Our chef prepares fresh gluten-free handmade pasta in a dedicated kitchen station,
      and we have an extensive plant-based menu.
    text_tr: Bu kesinlikle sorun değil. Şefimiz özel bir mutfak istasyonunda taze glütensiz el yapımı makarna hazırlıyor ve
      kapsamlı bir bitki bazlı menümüz var.
  - index: 6
    speaker_id: emre
    start_ms: 41080
    end_ms: 47254
    text_en: Excellent. Can we bring our own celebratory company anniversary cake for dessert?
    text_tr: Mükemmel. Tatlı için kendi kutlama şirket yıldönümü pastamızı getirebilir miyiz?
  - index: 7
    speaker_id: laura
    start_ms: 47654
    end_ms: 55647
    text_en: Yes, you may. We charge a modest plating fee of two euros per person to slice and serve outside cakes.
    text_tr: Evet, getirebilirsiniz. Dışarıdan gelen pastaları dilimleyip servis etmek için kişi başı iki avroluk mütevazı
      bir servis ücreti alıyoruz.
  - index: 8
    speaker_id: emre
    start_ms: 56047
    end_ms: 63215
    text_en: That is completely reasonable. Please confirm the reservation under Emre Kaya from FinTech Solutions.
    text_tr: Bu son derece makul. Lütfen FinTech Solutions'tan Emre Kaya adına rezervasyonu onaylayın.
  comprehension_questions:
  - id: q_listening_b1_restaurant-table-reservation_01
    question_en: For how many people is Emre making the dinner reservation?
    question_tr_hint: Emre kaç kişi için akşam yemeği rezervasyonu yapıyor?
    options:
    - Two people for a romantic dinner.
    - Fifty wedding banquet guests.
    - Four family members.
    - Ten colleagues.
    correct_answer: Ten colleagues.
    explanation_en: Emre explicitly requests a table for a party of ten colleagues.
    explanation_tr: Emre on kişilik bir meslektaş grubu için masa talep ettiğini açıkça belirtir.
  - id: q_listening_b1_restaurant-table-reservation_02
    question_en: Where is the reserved table located inside the restaurant?
    question_tr_hint: Rezerve edilen masa restoranın neresinde yer alıyor?
    options:
    - Directly in front of the main entrance door.
    - In the underground wine cellar.
    - In a semi-private alcove in the garden room.
    - Next to the noisy dishwashing station.
    correct_answer: In a semi-private alcove in the garden room.
    explanation_en: Laura offers a semi-private alcove in the garden room.
    explanation_tr: Laura bahçe odasında yarı özel bir bölme sunar.
  - id: q_listening_b1_restaurant-table-reservation_03
    question_en: What dietary accommodations can the restaurant provide?
    question_tr_hint: Restoran hangi beslenme uyarlamalarını sağlayabiliyor?
    options:
    - No dietary accommodations whatsoever.
    - Only raw meat and unpasteurized milk.
    - Fast food hamburgers ordered from next door.
    - Gluten-free handmade pasta in a dedicated station and plant-based vegan dishes.
    correct_answer: Gluten-free handmade pasta in a dedicated station and plant-based vegan dishes.
    explanation_en: Laura explains the chef prepares gluten-free pasta and has a plant-based menu.
    explanation_tr: Laura şefin glütensiz makarna hazırladığını ve bitki bazlı menüleri olduğunu açıklar.
  - id: q_listening_b1_restaurant-table-reservation_04
    question_en: What policy applies if the party brings their own anniversary cake?
    question_tr_hint: Grup kendi yıldönümü pastasını getirirse hangi politika geçerlidir?
    options:
    - The restaurant charges five hundred euros penalty.
    - Outside cakes are strictly confiscated and thrown away.
    - A plating fee of two euros per person is charged for slicing and serving.
    - Customers must wash their own dessert plates.
    correct_answer: A plating fee of two euros per person is charged for slicing and serving.
    explanation_en: Laura mentions a modest plating fee of two euros per person.
    explanation_tr: Laura kişi başı iki avroluk servis ücreti olduğunu belirtir.
  - id: q_listening_b1_restaurant-table-reservation_05
    question_en: At what time is the dinner reservation booked for Friday?
    question_tr_hint: Akşam yemeği rezervasyonu cuma günü saat kaça yapıldı?
    options:
    - 7:30 PM.
    - 1:00 PM.
    - 10:00 PM.
    - 5:00 PM.
    correct_answer: 7:30 PM.
    explanation_en: Emre requests 7:30 PM, which Laura confirms.
    explanation_tr: Emre saat 19:30'u talep eder ve Laura bunu onaylar.
