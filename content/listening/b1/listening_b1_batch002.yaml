  - id: sinan
    name: Sinan
    role: Frontend Developer
    accent: Turkish
  audio_ref: audio/listening/b1_remote_team_catchup.mp3
  duration_seconds: 73
  transcript_items:
  - index: 1
    speaker_id: rachel
    start_ms: 0
    end_ms: 9288
    text_en: Good morning Sinan! Thanks for jumping on this quick ten-minute alignment sync. How is the sprint progress on
      the dashboard redesign?
    text_tr: Günaydın Sinan! Bu hızlı on dakikalık uyum görüşmesine katıldığın için teşekkürler. Kontrol paneli yeniden tasarımındaki
      sprint ilerlemesi nasıl gidiyor?
  - index: 2
    speaker_id: sinan
    start_ms: 9688
    end_ms: 18851
    text_en: Morning Rachel. Coding is on schedule, but our developers across different time zones are getting overwhelmed
      by constant Slack pings.
    text_tr: Günaydın Rachel. Kodlama takvime uygun gidiyor ancak farklı saat dilimlerindeki geliştiricilerimiz sürekli Slack
      bildirimlerinden bunalıyor.
  - index: 3
    speaker_id: rachel
    start_ms: 19251
    end_ms: 27819
    text_en: I have noticed that as well. People feel pressured to respond instantly, which completely breaks their focused
      engineering flow.
    text_tr: Ben de bunu fark ettim. İnsanlar anında yanıt verme baskısı hissediyor, bu da odaklanmış mühendislik akışlarını
      tamamen bozuyor.
  - index: 4
    speaker_id: sinan
    start_ms: 28219
    end_ms: 37496
    text_en: Exactly. Could we establish a team norm that non-urgent inquiries should be posted on our project documentation
      board instead of direct chat?
    text_tr: Kesinlikle. Acil olmayan soruların doğrudan sohbet yerine proje dokümantasyon panomuza yazılması yönünde bir
      ekip normu belirleyebilir miyiz?
  - index: 5
    speaker_id: rachel
    start_ms: 37896
    end_ms: 49374
    text_en: 'That is an excellent proposal. Let''s document an official communication charter: async updates by default,
      and urgent escalations only via dedicated alert channels.'
    text_tr: 'Bu mükemmel bir öneri. Resmi bir iletişim tüzüğü hazırlayalım: varsayılan olarak eşzamansız güncellemeler ve
      acil durumlar yalnızca özel uyarı kanalları üzerinden.'
  - index: 6
    speaker_id: sinan
    start_ms: 49774
    end_ms: 57807
    text_en: That will protect our engineers' deep focus hours. What response window should we set for general pull request
      reviews?
    text_tr: Bu mühendislerimizin derin odaklanma saatlerini koruyacaktır. Genel PR incelemeleri için nasıl bir yanıt süresi
      belirlemeliyiz?
  - index: 7
    speaker_id: rachel
    start_ms: 58207
    end_ms: 65555
    text_en: A four-hour turnaround during working hours seems reasonable without forcing developers to interrupt active coding
      tasks.
    text_tr: Çalışma saatleri içinde dört saatlik bir geri dönüş süresi, geliştiricileri aktif kodlama görevlerini bölmeye
      zorlamadan makul görünüyor.
  - index: 8
    speaker_id: sinan
    start_ms: 65955
    end_ms: 72528
    text_en: Perfect. I will share this draft charter in our team channel before tomorrow's standup meeting.
    text_tr: Mükemmel. Yarınki ayaküstü toplantıdan önce bu taslak tüzüğü ekip kanalımızda paylaşacağım.
  comprehension_questions:
  - id: q_listening_b1_remote-team-catchup_01
    question_en: What primary complaint does Sinan share regarding distributed team collaboration?
    question_tr_hint: Sinan dağıtık ekip işbirliği konusunda hangi temel şikayeti paylaşıyor?
    options:
    - Internet connection speeds are too slow for video.
    - Developers are overwhelmed by constant instant chat notifications across time zones.
    - The cloud hosting server crashes every afternoon.
    - Team members refuse to write any unit test code.
    correct_answer: Developers are overwhelmed by constant instant chat notifications across time zones.
    explanation_en: Sinan explains developers across time zones are overwhelmed by chat pings.
    explanation_tr: Sinan farklı saat dilimlerindeki geliştiricilerin sohbet bildirimlerinden bunaldığını açıklar.
  - id: q_listening_b1_remote-team-catchup_02
    question_en: What proposal does Sinan suggest for non-urgent team inquiries?
    question_tr_hint: Sinan acil olmayan ekip soruları için nasıl bir öneride bulunuyor?
    options:
    - Calling developers on their personal mobile phones at midnight.
    - Printing physical paper memos and mailing them through postal courier.
    - Canceling all project documentation permanently.
    - Posting inquiries on the project documentation board rather than in direct chat.
    correct_answer: Posting inquiries on the project documentation board rather than in direct chat.
    explanation_en: Sinan proposes posting non-urgent inquiries on the documentation board.
    explanation_tr: Sinan acil olmayan soruların dokümantasyon panosuna yazılmasını önerir.
  - id: q_listening_b1_remote-team-catchup_03
    question_en: What principle will form the baseline of the new team communication charter?
    question_tr_hint: Yeni ekip iletişim tüzüğünün temelini hangi ilke oluşturacak?
    options:
    - Asynchronous updates by default, with chat reserved for urgent escalations.
    - Completely eliminating all written communication.
    - Mandatory continuous video recording during all work hours.
    - Working eighteen hours per day without breaks.
    correct_answer: Asynchronous updates by default, with chat reserved for urgent escalations.
    explanation_en: Rachel outlines async updates by default and alerts only for emergencies.
    explanation_tr: Rachel varsayılan olarak eşzamansız güncellemeleri ve yalnızca acil durumlarda uyarıları belirtir.
  - id: q_listening_b1_remote-team-catchup_04
    question_en: What turnaround window is agreed upon for pull request code reviews?
    question_tr_hint: PR kod incelemeleri için üzerinde anlaşılan geri dönüş süresi nedir?
    options:
    - Three weeks after code submission.
    - Only on the last day of each quarter.
    - Within thirty seconds immediately.
    - A four-hour window during working hours.
    correct_answer: A four-hour window during working hours.
    explanation_en: Rachel suggests a 4-hour turnaround during working hours.
    explanation_tr: Rachel çalışma saatleri içinde 4 saatlik bir geri dönüş süresi önerir.
  - id: q_listening_b1_remote-team-catchup_05
    question_en: When will Sinan share the draft communication charter with the team?
    question_tr_hint: Sinan taslak iletişim tüzüğünü ekiple ne zaman paylaşacak?
    options:
    - Never; it remains confidential between them.
    - Before tomorrow's daily standup meeting.
    - At the end of next year's annual conference.
    - During the upcoming weekend holiday.
    correct_answer: Before tomorrow's daily standup meeting.
    explanation_en: Sinan says he will share the draft before tomorrow's standup.
    explanation_tr: Sinan taslağı yarınki standup toplantısından önce paylaşacağını söyler.
