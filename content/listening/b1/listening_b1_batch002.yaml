- id: listening.b1.flatmate-chore-schedule
  title: Negotiating a Household Chore Agreement with a Flatmate
  cefr_level: B1
  category: negotiation
  scenario_context: Burak discusses restructuring the shared apartment cleaning schedule and recycling duties with his flatmate
    Liam to maintain domestic harmony.
  speakers:
  - id: liam
    name: Liam
    role: Flatmate
    accent: British
  - id: burak
    name: Burak
    role: Flatmate
    accent: Turkish
  audio_ref: audio/listening/b1_flatmate_chore_schedule.mp3
  duration_seconds: 68
  transcript_items:
  - index: 1
    speaker_id: burak
    start_ms: 0
    end_ms: 8448
    text_en: Hey Liam, do you have ten minutes to chat about our apartment chore routine? The kitchen counter has been getting
      cluttered lately.
    text_tr: Selam Liam, daire temizlik rutinimiz hakkında konuşmak için on dakikan var mı? Mutfak tezgahı son zamanlarda
      çok dağılmaya başladı.
  - index: 2
    speaker_id: liam
    start_ms: 8848
    end_ms: 16781
    text_en: Sure Burak. You are right; with my new work deadlines, I have been neglecting dishwashing during the week.
    text_tr: Elbette Burak. Haklısın; yeni iş teslim tarihlerim yüzünden hafta içi bulaşıkları ihmal ediyordum.
  - index: 3
    speaker_id: burak
    start_ms: 17181
    end_ms: 25479
    text_en: I understand completely. How about we establish a rotating system where one person handles kitchen deep-cleaning
      each week?
    text_tr: Tamamen anlıyorum. Her hafta bir kişinin mutfağın derinlemesine temizliğini üstlendiği dönüşümlü bir sistem kursak
      nasıl olur?
  - index: 4
    speaker_id: liam
    start_ms: 25879
    end_ms: 35622
    text_en: That makes sense. If you take the kitchen this week, I can take full responsibility for vacuuming the common
      areas and taking out the recycling bins.
    text_tr: Bu mantıklı. Bu hafta mutfağı sen alırsan, ben ortak alanları süpürme ve geri dönüşüm kutularını çıkarma sorumluluğunu
      üstlenebilirim.
  - index: 5
    speaker_id: burak
    start_ms: 36022
    end_ms: 44650
    text_en: That sounds very balanced. For the municipal glass and cardboard recycling, bins need to go to the curb by Tuesday
      morning.
    text_tr: Kulağa çok dengeli geliyor. Belediye cam ve karton geri dönüşümü için kutuların salı sabahına kadar kaldırıma
      çıkarılması gerekiyor.
  - index: 6
    speaker_id: liam
    start_ms: 45050
    end_ms: 52148
    text_en: Got it. I will set a recurring reminder on my phone for Monday nights so we never miss the collection truck.
    text_tr: Anlaşıldı. Pazartesi geceleri için telefonuma tekrarlayan bir hatırlatıcı kuracağım, böylece çöp toplama kamyonunu
      asla kaçırmayız.
  - index: 7
    speaker_id: burak
    start_ms: 52548
    end_ms: 59721
    text_en: Awesome. Let's write down this chore agreement on the whiteboard in the hallway so it is visible to both of us.
    text_tr: Harika. Bu temizlik anlaşmasını koridordaki beyaz tahtaya yazalım, böylece ikimiz için de görünür olur.
  - index: 8
    speaker_id: liam
    start_ms: 60121
    end_ms: 67310
    text_en: Deal. Thanks for bringing this up constructively Burak; it makes living together so much easier.
    text_tr: Anlaştık. Bunu yapıcı bir şekilde dile getirdiğin için teşekkürler Burak; birlikte yaşamayı çok daha kolaylaştırıyor.
  comprehension_questions:
  - id: q_listening_b1_flatmate-chore-schedule_01
    question_en: What domestic issue prompted Burak to initiate the conversation?
    question_tr_hint: Burak'ın bu konuşmayı başlatmasına hangi evsel sorun neden oldu?
    options:
    - Liam playing electric guitar loudly at midnight.
    - A broken water pipe flooding the bathroom floor.
    - Clutter on the kitchen counter and neglected dishwashing during the week.
    - A loud argument over paying the monthly rent.
    correct_answer: Clutter on the kitchen counter and neglected dishwashing during the week.
    explanation_en: Burak mentions the kitchen counter getting cluttered and neglected dishes.
    explanation_tr: Burak mutfak tezgahının dağılmasını ve ihmal edilen bulaşıkları belirtir.
  - id: q_listening_b1_flatmate-chore-schedule_02
    question_en: What system does Burak propose for kitchen cleaning?
    question_tr_hint: Burak mutfak temizliği için nasıl bir sistem öneriyor?
    options:
    - Throwing away all ceramic plates after single use.
    - A rotating weekly system where one flatmate handles deep cleaning.
    - Hiring an expensive daily private maid.
    - Never cooking food at home and eating only at restaurants.
    correct_answer: A rotating weekly system where one flatmate handles deep cleaning.
    explanation_en: Burak proposes a rotating weekly system for kitchen deep-cleaning.
    explanation_tr: Burak haftalık dönüşümlü bir derinlemesine temizlik sistemi önerir.
  - id: q_listening_b1_flatmate-chore-schedule_03
    question_en: What tasks does Liam volunteer to handle this week?
    question_tr_hint: Liam bu hafta hangi görevleri üstlenmeye gönüllü oluyor?
    options:
    - Repainting the entire apartment living room.
    - Fixing the electrical wiring in the basement.
    - Buying groceries for the whole month.
    - Vacuuming common areas and taking out the recycling bins.
    correct_answer: Vacuuming common areas and taking out the recycling bins.
    explanation_en: Liam offers to vacuum common areas and handle the recycling bins.
    explanation_tr: Liam ortak alanları süpürmeyi ve geri dönüşüm kutularını çıkarmayı teklif eder.
  - id: q_listening_b1_flatmate-chore-schedule_04
    question_en: When do municipal recycling bins need to be at the curb?
    question_tr_hint: Belediye geri dönüşüm kutularının ne zamana kadar kaldırımda olması gerekiyor?
    options:
    - Every Sunday at midnight sharp.
    - By Tuesday morning.
    - Only on the first day of each month.
    - On Friday afternoon before sunset.
    correct_answer: By Tuesday morning.
    explanation_en: Burak states bins need to be at the curb by Tuesday morning.
    explanation_tr: Burak kutuların salı sabahına kadar kaldırımda olması gerektiğini belirtir.
  - id: q_listening_b1_flatmate-chore-schedule_05
    question_en: Where do the flatmates decide to record their agreement?
    question_tr_hint: Ev arkadaşları anlaşmalarını nereye kaydetmeye karar veriyorlar?
    options:
    - In a formal legal contract sent to their landlord.
    - In a text message group on their smartphones.
    - On the hallway whiteboard.
    - Carved into the wooden kitchen table.
    correct_answer: On the hallway whiteboard.
    explanation_en: Burak suggests writing it down on the whiteboard in the hallway.
    explanation_tr: Burak koridordaki beyaz tahtaya yazmayı önerir.
  topic_tags:
  - relationships
  - housing
  - communication
  - cooperation
- id: listening.b1.university-study-group
  title: Organizing an Academic Presentation Study Group
  cefr_level: B1
  category: stakeholder_alignment
  scenario_context: Ece and Daniel coordinate their research tasks and rehearsal schedule for an upcoming university economics
    seminar presentation.
  speakers:
  - id: daniel
    name: Daniel
    role: University Classmate
    accent: American
  - id: ece
    name: Ece
    role: Undergraduate Student
    accent: Turkish
  audio_ref: audio/listening/b1_university_study_group.mp3
  duration_seconds: 71
  transcript_items:
  - index: 1
    speaker_id: daniel
    start_ms: 0
    end_ms: 9543
    text_en: Hey Ece, thanks for meeting at the campus library. Professor Clark expects our twenty-minute macroeconomics presentation
      in two weeks.
    text_tr: Selam Ece, kampüs kütüphanesinde buluştuğun için teşekkürler. Profesör Clark yirmi dakikalık makroekonomi sunumumuzu
      iki hafta içinde bekliyor.
  - index: 2
    speaker_id: ece
    start_ms: 9943
    end_ms: 19886
    text_en: Hi Daniel. Yes, our topic is renewable energy subsidies and regional employment growth. We should divide the
      case studies evenly.
    text_tr: Merhaba Daniel. Evet, konumuz yenilenebilir enerji sübvansiyonları ve bölgesel istihdam artışı. Vaka çalışmalarını
      eşit olarak bölmeliyiz.
  - index: 3
    speaker_id: daniel
    start_ms: 20286
    end_ms: 27628
    text_en: I can analyze the European offshore wind sector data and prepare the quantitative charts showing job creation
      figures.
    text_tr: Ben Avrupa açık deniz rüzgar sektörü verilerini analiz edebilir ve istihdam yaratma rakamlarını gösteren nicel
      grafikleri hazırlayabilirim.
  - index: 4
    speaker_id: ece
    start_ms: 28028
    end_ms: 37171
    text_en: Great. Then I will cover the North American solar manufacturing subsidies and evaluate the policy trade-offs
      and government debt impacts.
    text_tr: Harika. O zaman ben de Kuzey Amerika güneş enerjisi üretim sübvansiyonlarını ele alıp politika ödünleşimlerini
      ve hükümet borç etkilerini değerlendireyim.
  - index: 5
    speaker_id: daniel
    start_ms: 37571
    end_ms: 45369
    text_en: That gives us a very clear analytical contrast between wind and solar policies. How many slides should we target?
    text_tr: Bu bize rüzgar ve güneş politikaları arasında çok net bir analitik karşıtlık sağlar. Kaç slayt hedeflemeliyiz?
  - index: 6
    speaker_id: ece
    start_ms: 45769
    end_ms: 55167
    text_en: Professor Clark emphasized that brevity is key. Around twelve to fifteen clean slides with visual charts rather
      than dense blocks of text.
    text_tr: Profesör Clark kısalığın kilit önemde olduğunu vurguladı. Yoğun metin blokları yerine görsel grafikler içeren
      yaklaşık on iki ila on beş temiz slayt.
  - index: 7
    speaker_id: daniel
    start_ms: 55567
    end_ms: 63235
    text_en: Agreed. Let's finish our individual research drafts by next Monday and meet here to rehearse our spoken timing.
    text_tr: Anlaştık. Bireysel araştırma taslaklarımızı gelecek pazartesiye kadar bitirelim ve konuşma süremizin provasını
      yapmak için burada buluşalım.
  - index: 8
    speaker_id: ece
    start_ms: 63635
    end_ms: 70393
    text_en: Perfect. I will book a private multimedia study room on the third floor for our rehearsal session.
    text_tr: Mükemmel. Prova seansımız için üçüncü katta özel bir multimedya çalışma odası ayırtacağım.
  comprehension_questions:
  - id: q_listening_b1_university-study-group_01
    question_en: What is the topic of Ece and Daniel's university presentation?
    question_tr_hint: Ece ve Daniel'in üniversite sunumunun konusu nedir?
    options:
    - Ancient Greek archaeological excavations in Crete.
    - Quantum computing algorithms for medical diagnosis.
    - Renewable energy subsidies and regional employment growth.
    - The history of medieval European banking architecture.
    correct_answer: Renewable energy subsidies and regional employment growth.
    explanation_en: Ece states their topic is renewable energy subsidies and employment growth.
    explanation_tr: Ece konularının yenilenebilir enerji sübvansiyonları ve istihdam artışı olduğunu belirtir.
  - id: q_listening_b1_university-study-group_02
    question_en: Which sector data will Daniel focus on analyzing?
    question_tr_hint: Daniel hangi sektör verilerini analiz etmeye odaklanacak?
    options:
    - Automotive internal combustion engine manufacturing.
    - South American copper mining statistics.
    - European offshore wind sector data and job creation figures.
    - Global airline passenger traffic trends.
    correct_answer: European offshore wind sector data and job creation figures.
    explanation_en: Daniel offers to analyze the European offshore wind sector data.
    explanation_tr: Daniel Avrupa açık deniz rüzgar sektörü verilerini analiz etmeyi teklif eder.
  - id: q_listening_b1_university-study-group_03
    question_en: What guideline did Professor Clark emphasize regarding the slide deck?
    question_tr_hint: Profesör Clark slayt destesi hakkında hangi kuralı vurguladı?
    options:
    - Reading directly from a printed paper textbook.
    - Presenting without any digital visual aids whatsoever.
    - At least one hundred detailed slides with complete paragraphs.
    - 'Brevity: 12 to 15 clean slides with visual charts rather than dense text.'
    correct_answer: 'Brevity: 12 to 15 clean slides with visual charts rather than dense text.'
    explanation_en: Ece notes Clark emphasized brevity with 12-15 visual slides.
    explanation_tr: Ece Clark'ın 12-15 görsel slaytla kısalığı vurguladığını belirtir.
  - id: q_listening_b1_university-study-group_04
    question_en: When do the students plan to complete their individual research drafts?
    question_tr_hint: Öğrenciler bireysel araştırma taslaklarını ne zaman tamamlamayı planlıyorlar?
    options:
    - On the morning of the final presentation.
    - In two months after final semester exams.
    - By next Monday.
    - Late tonight before midnight.
    correct_answer: By next Monday.
    explanation_en: Daniel suggests finishing drafts by next Monday.
    explanation_tr: Daniel taslakları gelecek pazartesiye kadar bitirmeyi önerir.
  - id: q_listening_b1_university-study-group_05
    question_en: Where will the rehearsal session take place?
    question_tr_hint: Prova seansı nerede gerçekleşecek?
    options:
    - In a private multimedia study room on the third floor of the library.
    - Inside Professor Clark's private faculty office.
    - In the university cafeteria during lunch hour.
    - At an outdoor coffee patio near the subway.
    correct_answer: In a private multimedia study room on the third floor of the library.
    explanation_en: Ece plans to book a private multimedia study room on the third floor.
    explanation_tr: Ece üçüncü katta özel bir multimedya çalışma odası ayırtacağını söyler.
  topic_tags:
  - education
  - university
  - presentation
  - teamwork
