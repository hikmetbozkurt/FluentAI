- id: listening.c2.cross-border-clearing-failover-drill
  title: Orchestrating Cross-Border Settlement Failover
  cefr_level: C2
  category: incident_response
  scenario_context: Incident Commander Emre and Core Banking Lead Grace execute a live cross-region settlement failover while
    guarding strictly against split-brain duplicate wires.
  speakers:
  - id: emre_ic
    name: Emre
    role: Incident Commander
    accent: Turkish
  - id: grace
    name: Grace
    role: Core Settlement Architect
    accent: British
  audio_ref: audio/listening/c2_cross_border_clearing_failover_drill.mp3
  duration_seconds: 82
  transcript_items:
  - index: 1
    speaker_id: emre_ic
    start_ms: 0
    end_ms: 9478
    text_en: Grace, Frankfurt's primary clearing quorum just lost sixty percent packet stability across SWIFT gateways—are
      we clear to promote Zurich to authoritative ledger write status?
    text_tr: Grace, Frankfurt ana takas kümesi SWIFT ağ geçitlerinde yüzde altmış paket istikrarını kaybetti—Zürih'i yetkili
      defter yazma konumuna yükseltmeye hazır mıyız?
  - index: 2
    speaker_id: grace
    start_ms: 9878
    end_ms: 21989
    text_en: Hold sixty seconds, Emre! Before promoting Zurich, we must guarantee absolute quorum fencing against stalled
      Frankfurt nodes so two regions never authorize duplicate cross-border wires simultaneously.
    text_tr: Altmış saniye bekle Emre! Zürih'i yükseltmeden önce, duraklamış Frankfurt düğümlerine karşı mutlak çitleme (fencing)
      kilidini doğrulamalıyız ki iki bölge aynı anda mükerrer sınır ötesi havale onaylamasın.
  - index: 3
    speaker_id: emre_ic
    start_ms: 22389
    end_ms: 32152
    text_en: Copy that. Read-only monitoring still sees three Frankfurt workers holding expired lease locks—initiating hardware
      power-fence revocation and revoking their signing tokens now.
    text_tr: Anlaşıldı. Salt okunur izleme hâlâ süresi dolmuş kira kilitleri tutan üç Frankfurt çalışanı görüyor—donanım güç
      kilidini kesip imzalama belirteçlerini şimdi iptal ediyorum.
  - index: 4
    speaker_id: grace
    start_ms: 32552
    end_ms: 43694
    text_en: Telemetry confirms Frankfurt lease tokens invalidated cleanly and SWIFT egress queues drained zero residual packets.
      Promoting Zurich master write mode—verifying monotonic ledger sequence hashes.
    text_tr: Telemetri Frankfurt belirteçlerinin tamamen geçersiz kılındığını ve SWIFT çıkış kuyruklarının sıfır artık paketle
      boşaldığını doğruluyor. Zürih ana yazma modunu yükseltiyorum—monotonik defter sıra özetlerini doğruluyorum.
  - index: 5
    speaker_id: emre_ic
    start_ms: 44094
    end_ms: 48638
    text_en: What about twelve client transfers caught mid-flight during the four-second lease gap?
    text_tr: Peki dört saniyelik kilit boşluğu sırasında yarı yolda yakalanan on iki müşteri transferi ne durumda?
  - index: 6
    speaker_id: grace
    start_ms: 49038
    end_ms: 61664
    text_en: Client gateways enforce strict SHA-256 idempotency keys across regional endpoints. Zurich's reconciliation loop
      replays those twelve hashes harmlessly—eleven never committed, one settled prior and skips clean.
    text_tr: İstemci geçitleri bölgesel uç noktalar arasında katı SHA-256 eşsiz işlem anahtarları uyguluyor. Zürih'in mutabakat
      döngüsü o on iki özeti zararsızca tekrar kontrol ediyor—on biri işlenmemiş, biri önceden tamamlanmış ve temizce atlanıyor.
  - index: 7
    speaker_id: emre_ic
    start_ms: 62064
    end_ms: 71567
    text_en: Confirming synthetic end-to-end euro clearing check passed in two hundred eighty milliseconds out of Zurich.
      Keeping customer status banner green with note on minor four-second blip.
    text_tr: Zürih üzerinden sentetik uçtan uca avro takas kontrolünün iki yüz seksen milisaniyede geçtiğini teyit ediyorum.
      Müşteri durum panosunu küçük dört saniyelik dalgalanma notuyla yeşil tutuyoruz.
  - index: 8
    speaker_id: grace
    start_ms: 71967
    end_ms: 81209
    text_en: Outstanding discipline. Once Frankfurt network carriers stabilize, remember we remain strictly locked on Zurich
      until postmortem completes tomorrow morning.
    text_tr: Kusursuz disiplin. Frankfurt ağ taşıyıcıları istikrara kavuştuğunda bile, yarın sabah olay sonrası değerlendirme
      bitene kadar Zürih üzerinde kilitli kaldığımızı unutmayın.
  key_vocabulary:
  - word: fencing
    context_note_tr: bölünmüş beyin yazmalarını kesen kesin erişim kilidi
  - word: split-brain
    context_note_tr: iki bölgenin aynı anda aktif sanılıp çift işlem yazması
  - word: idempotency
    context_note_tr: aynı havale anahtarının yalnızca bir kez geçmesini sağlama
  comprehension_questions:
  - id: q_listening_c2_cross-border-clearing-failover-drill_01
    question_en: Why does Grace pause Emre for sixty seconds before promoting Zurich's database?
    options:
    - To prevent split-brain duplicate wire authorizations across two active masters
    - Client portals forbid logging packet instability publicly
    - Zurich servers require manual software installation beforehand
    - SWIFT gateways close for four-second scheduled maintenance
    correct_answer: To prevent split-brain duplicate wire authorizations across two active masters
    explanation_en: Grace insists on quorum fencing first so two regions can never concurrently authorize duplicate transfers.
    explanation_tr: Grace iki bölgenin aynı anda çift havale onaylamasını önlemek için önce çitleme kilidinin tamamlanmasını
      ister.
  - id: q_listening_c2_cross-border-clearing-failover-drill_02
    question_en: How does Emre ensure stalled Frankfurt nodes cannot write stale settlement records?
    options:
    - Emailing German network operators during peak hours
    - Dropping monitoring telemetry down to zero percent
    - Revoking signing lease tokens and triggering hard power fencing
    - Increasing client timeout periods by sixty seconds
    correct_answer: Revoking signing lease tokens and triggering hard power fencing
    explanation_en: Emre executes hardware power fencing and revokes signing tokens held by stalled Frankfurt workers.
    explanation_tr: Emre donanım güç çitlemesi başlatır ve Frankfurt çalışanlarının imzalama belirteçlerini iptal eder.
  - id: q_listening_c2_cross-border-clearing-failover-drill_03
    question_en: What guaranteed those twelve mid-flight customer transfers neither vanished nor doubled?
    options:
    - Idempotency keys allowed safe replay checking prior ledger commitment
    - Zurich paused client gateways permanently during failover
    - Support clerks manually called twelve recipient banks later
    - SWIFT automatically refunded every transaction over four seconds
    correct_answer: Idempotency keys allowed safe replay checking prior ledger commitment
    explanation_en: Grace explains SHA-256 idempotency keys let reconciliation safely skip the one committed wire and complete
      the rest.
    explanation_tr: Grace SHA-256 eşsiz anahtarlarının mutabakat döngüsünde çift ödemeyi önlediğini anlatır.
  - id: q_listening_c2_cross-border-clearing-failover-drill_04
    question_en: How long did post-failover synthetic euro clearing checks take from Zurich?
    options:
    - Sixty seconds
    - Four full seconds
    - Two hundred eighty milliseconds
    - Two days after maintenance
    correct_answer: Two hundred eighty milliseconds
    explanation_en: Emre confirms the end-to-end synthetic check passed cleanly in 280ms.
    explanation_tr: Emre sentetik kontrolün 280 milisaniyede geçtiğini teyit eder.
  - id: q_listening_c2_cross-border-clearing-failover-drill_05
    question_en: What rule governs failing back toward Frankfurt once its network recovers?
    options:
    - Fail back automatically within sixty milliseconds of packet recovery
    - Run active writes in both cities simultaneously overnight
    - Keep traffic on Zurich until tomorrow morning's postmortem finishes
    - Decommission Zurich servers right after green status appears
    correct_answer: Keep traffic on Zurich until tomorrow morning's postmortem finishes
    explanation_en: Grace cautions remaining on Zurich until postmortem review completes prevents ping-pong churn.
    explanation_tr: Grace olay sonrası inceleme tamamlanana dek trafiğin Zürih'te kilitli kalması gerektiğini hatırlatır.
  topic_tags:
  - disaster-recovery
  - fintech
  - failover
  related_ids: []
  status: APPROVED
  version: 1
- id: listening.c2.multi-unit-platform-charter-alignment
  title: Reconciling Subsidiary Engineering Budgets Under One Charter
  cefr_level: C2
  category: stakeholder_alignment
  scenario_context: Platform VP Serkan and Subsidiary CTO Claire resolve political tension between group standardization efficiency
    and acquired regional unit speed.
  speakers:
  - id: claire_cto
    name: Claire
    role: Subsidiary CTO
    accent: British
  - id: serkan
    name: Serkan
    role: VP of Group Platform
    accent: Turkish
  audio_ref: audio/listening/c2_multi_unit_platform_charter_alignment.mp3
  duration_seconds: 85
  transcript_items:
  - index: 1
    speaker_id: claire_cto
    start_ms: 0
    end_ms: 10172
    text_en: Serkan, following our acquisition by group headquarters, my regional engineering leads fear our autonomous checkout
      roadmap is about to vanish inside slow central infrastructure tickets.
    text_tr: Serkan, grubumuzca satın alınmamızın ardından bölgesel mühendislik liderlerim özerk ödeme yol haritamızın yavaş
      merkezi altyapı taleplerinin içinde erimesinden endişeleniyor.
  - index: 2
    speaker_id: serkan
    start_ms: 10572
    end_ms: 20580
    text_en: Valid fear, Claire—we have seen heavy central mandates strangle post-merger agility before. Tell me which platform
      mandates feel genuinely obstructive versus helpful right now.
    text_tr: Çok haklı bir korku Claire—birleşme sonrası katı merkezi dayatmaların çevikliği boğduğuna daha önce tanık olduk.
      Şu an hangi platform kararlarının gerçekten engelleyici, hangilerinin yararlı hissettirdiğini söyle lütfen.
  - index: 3
    speaker_id: claire_cto
    start_ms: 20980
    end_ms: 34721
    text_en: Honestly, consolidating enterprise SSO identity and automated security vulnerability scanning saves us two scarce
      headcounts immediately. Where friction explodes is forcing our custom payment orchestrator onto headquarters' slower
      legacy pipeline.
    text_tr: Açıkçası kurumsal SSO kimlik doğrulamayı ve otomatik güvenlik açık taramasını birleştirmek bize hemen iki kıt
      mühendis kadrosu kazandırıyor. Sürtünmenin patladığı yer, özel ödeme düzenleyicimizi merkezin daha yavaş eski hattına
      zorlamak.
  - index: 4
    speaker_id: serkan
    start_ms: 35121
    end_ms: 48333
    text_en: Fair distinction. Group charter policy only requires non-negotiable alignment across security perimeter controls,
      telemetry logging schemas, and disaster-recovery verification—never dictating application runtime frameworks.
    text_tr: Adil bir ayrım. Grup tüzüğü yalnızca güvenlik sınırı kontrolleri, telemetri günlükleme şemaları ve felaket kurtarma
      doğrulaması arasında tavizsiz uyum ister; uygulama çalışma zamanı çatısını dikte etmez.
  - index: 5
    speaker_id: claire_cto
    start_ms: 48733
    end_ms: 57540
    text_en: And what about internal platform chargebacks? My division already worries flat headcount allocation fees will
      bloat without proportional usage transparency.
    text_tr: Peki şirket içi platform maliyet paylaşımı (chargeback) ne olacak? Birimim zaten orantılı kullanım şeffaflığı
      olmadan kişi başı sabit kesintilerin şişmesinden endişe ediyor.
  - index: 6
    speaker_id: serkan
    start_ms: 57940
    end_ms: 66753
    text_en: Subsidiaries consume shared modules strictly on metered telemetry usage alongside a two-quarter integration grace
      waiver while duplicated identity tools wind down.
    text_tr: İştirakler ortak modülleri yalnızca ölçülmüş telemetri kullanımına göre öder; ayrıca mükerrer kimlik araçları
      kapatılırken iki çeyreklik uyum muafiyeti uygulanır.
  - index: 7
    speaker_id: claire_cto
    start_ms: 67153
    end_ms: 74111
    text_en: One final safeguard—suppose urgent merchant compliance forces a forty-eight-hour workaround violating standard
      API templates?
    text_tr: Son bir güvence daha—acil bir üye işyeri uyumluluk kuralı standart API şablonunu aşan kırk sekiz saatlik acil
      bir geçici çözüm gerektirirse ne olur?
  - index: 8
    speaker_id: serkan
    start_ms: 74511
    end_ms: 84158
    text_en: Every subsidiary retains an explicit architectural escape-hatch logged with a thirty-day sunset target. Accountability
      without red tape—let us co-sign the joint charter Friday.
    text_tr: Her iştirak otuz günlük kapanış hedefiyle kaydedilen açık bir mimari çıkış kapısı (escape-hatch) yetkisini korur.
      Bürokrasi olmadan hesap verebilirlik—cuma günü ortak tüzüğü birlikte imzalayalım.
  key_vocabulary:
  - word: subsidiary
    context_note_tr: gruba bağlı özerk alt şirket birimi
  - word: chargeback
    context_note_tr: ortak altyapı maliyetinin birimlere faturalanması
  - word: escape-hatch
    context_note_tr: yerel ürün ekibine geçici istisna sağlayan kural
  comprehension_questions:
  - id: q_listening_c2_multi-unit-platform-charter-alignment_01
    question_en: Which shared group services does Subsidiary CTO Claire enthusiastically welcome?
    options:
    - Replacing regional checkout teams with external contractors
    - Flat per-headcount allocation fees regardless of cloud volume
    - Mandating headquarters' slow legacy payment deployment pipeline
    - Unified enterprise SSO authentication and automated vulnerability scanning
    correct_answer: Unified enterprise SSO authentication and automated vulnerability scanning
    explanation_en: Claire welcomes shared SSO identity and automated security scanning for freeing two scarce headcounts.
    explanation_tr: Claire kurumsal SSO ve güvenlik taramalarının iki kıt mühendis kadrosu kazandırdığını memnuniyetle kabul
      eder.
  - id: q_listening_c2_multi-unit-platform-charter-alignment_02
    question_en: According to Serkan, where must group infrastructure standardization stay non-negotiable?
    options:
    - Regional checkout roadmaps and merchant hiring priorities
    - Forbidding custom orchestrators indefinitely post-acquisition
    - Security perimeter rules, logging telemetry formats, and recovery audits
    - Programming language choices and internal UI font families
    correct_answer: Security perimeter rules, logging telemetry formats, and recovery audits
    explanation_en: Serkan limits strict standardization to security perimeter, telemetry schemas, and disaster-recovery verification.
    explanation_tr: Serkan katı standartların yalnızca güvenlik sınırı, telemetri şeması ve felaket kurtarma testleriyle sınırlı
      olduğunu açıklar.
  - id: q_listening_c2_multi-unit-platform-charter-alignment_03
    question_en: How does Serkan keep internal platform chargebacks transparent during transition?
    options:
    - Charging flat headcount taxes regardless of actual compute
    - Eliminating group budget tracking across regional units
    - Halting subsidiary checkout launches until SSO completes
    - Metering actual telemetry usage plus granting a two-quarter duplicate-tool waiver
    correct_answer: Metering actual telemetry usage plus granting a two-quarter duplicate-tool waiver
    explanation_en: Subsidiaries pay strictly by metered usage with a two-quarter waiver during legacy tool sunsetting.
    explanation_tr: Gerçek ölçülen kullanım esas alınır ve mükerrer araçlar kapanana kadar iki çeyreklik geçiş muafiyeti tanınır.
  - id: q_listening_c2_multi-unit-platform-charter-alignment_04
    question_en: How can Claire's team deliver an emergency 48-hour merchant compliance patch safely?
    options:
    - Shutting down regional payment switches overnight
    - Ignoring security logging schemas permanently
    - Invoking an explicit escape-hatch paired with a thirty-day cleanup date
    - Waiting two quarters for headquarters charter amendments
    correct_answer: Invoking an explicit escape-hatch paired with a thirty-day cleanup date
    explanation_en: Serkan notes every subsidiary keeps an explicit escape-hatch logged with a 30-day sunset commitment.
    explanation_tr: Her iştirakin otuz günlük sonlanma tarihine bağlı açık bir mimari istisna çıkış kapısına sahip olduğu
      belirtilir.
  - id: q_listening_c2_multi-unit-platform-charter-alignment_05
    question_en: What headline balance best captures the charter Serkan and Claire agree to sign?
    options:
    - Total subsidiary independence from corporate security governance
    - Centralized control over every subsidiary product sprint
    - Accountability across security boundaries without bureaucratic bottlenecks
    - Indefinite coexistence of duplicate identity infrastructures
    correct_answer: Accountability across security boundaries without bureaucratic bottlenecks
    explanation_en: Serkan summarizes the charter cleanly as 'accountability without red tape.'
    explanation_tr: Serkan ortak tüzüğü 'bürokrasi olmadan hesap verebilirlik' olarak özetler.
  topic_tags:
  - m-and-a
  - platform-governance
  - alignment
  related_ids: []
  status: APPROVED
  version: 1
