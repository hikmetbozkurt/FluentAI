- id: listening.c2.liquidity-stress-committee-brief
  title: Board Risk Committee Liquidity Stress Review
  cefr_level: C2
  category: executive_briefing
  scenario_context: Group Treasurer Murat presents quarterly tail-risk liquidity scenarios, deposit concentration ratios,
    and undrawn facility triggers to Board Chairwoman Victoria.
  speakers:
  - id: victoria
    name: Victoria
    role: Risk Committee Chair
    accent: British
  - id: murat
    name: Murat
    role: Group Treasurer
    accent: Turkish
  audio_ref: audio/listening/c2_liquidity_stress_committee_brief.mp3
  duration_seconds: 78
  transcript_items:
  - index: 1
    speaker_id: victoria
    start_ms: 0
    end_ms: 8977
    text_en: Murat, headline group cash sits cleanly above ninety million, yet committee directors want to interrogate underlying
      availability under severe systemic stress.
    text_tr: Murat, grup manşet nakdi doksan milyonun üzerinde rahat görünüyor; ancak risk komitesi üyeleri ciddi sistemik
      stres altında gerçek erişilebilirliği sorgulamak istiyor.
  - index: 2
    speaker_id: murat
    start_ms: 9377
    end_ms: 19910
    text_en: Rightly so, Victoria. Roughly nineteen million inside foreign clearing subsidiaries remains legally ring-fenced
      for operational settlement and cannot sweep upward within forty-eight hours.
    text_tr: Çok haklısınız Victoria. Yabancı takas iştiraklerindeki yaklaşık on dokuz milyon dolar yasal olarak operasyonel
      takas için çember içinde tutuluyor ve kırk sekiz saatte yukarı çekilemiyor.
  - index: 3
    speaker_id: victoria
    start_ms: 20310
    end_ms: 29977
    text_en: Precisely why consolidated balances can flatter headquarters liquidity. Furthermore, how concentrated are remaining
      unrestricted reserves across counterparty banks?
    text_tr: Tam da bu yüzden konsolide bakiyeler merkez likiditesini olduğundan parlak gösterebilir. Kalan serbest rezervler
      karşı taraf bankalar arasında ne kadar yoğunlaşmış durumda?
  - index: 4
    speaker_id: murat
    start_ms: 30377
    end_ms: 39719
    text_en: Until February, sixty-two percent rested with two regional lenders; we have already rebalanced across four sovereign
      money-market sleeves plus T-bill custodianship.
    text_tr: Şubat'a kadar yüzde altmış ikisi iki bölgesel bankada duruyordu; şimdiden dört devlet para piyasası dilimine
      ve doğrudan hazine bonosu saklama hesabına dağıttık.
  - index: 5
    speaker_id: victoria
    start_ms: 40119
    end_ms: 50012
    text_en: Wise diversification. Suppose export receivables slip thirty days simultaneously alongside an unexpected raw-copper
      price spike—when do revolving credit covenants bite?
    text_tr: Yerinde bir çeşitlendirme. İhracat alacaklarının otuz gün sarktığı ve aynı anda hammadde bakır fiyatının sıçradığı
      bir senaryoda kredi sözleşmesi eşikleri (covenant) ne zaman sıkışır?
  - index: 6
    speaker_id: murat
    start_ms: 50412
    end_ms: 58870
    text_en: At thirty-five million drawn, our senior leverage ceiling leaves minimal headroom before breaching the quarterly
      interest-coverage ratio, triggering repricing.
    text_tr: Otuz beş milyon çekildiğinde kıdemli kaldıraç tavanımız üç aylık faiz karşılama oranını ihlal edip yeniden fiyatlamayı
      tetiklemeden hemen önce çok dar bir boşluk bırakıyor.
  - index: 7
    speaker_id: victoria
    start_ms: 59270
    end_ms: 66693
    text_en: Then our board playbook must pre-stage mitigating levers before drawdowns approach twenty-five million, not after
      rating inquiries commence.
    text_tr: O halde yönetim kurulu eylem planımız kredi çekimi yirmi beş milyona yaklaşmadan önce hafifletici kaldıraçları
      devreye almalı, kredi notu sorgulamaları başladıktan sonra değil.
  - index: 8
    speaker_id: murat
    start_ms: 67093
    end_ms: 76765
    text_en: Agreed. Automated weekly treasury dashboards now flag a yellow governance trigger at twenty-two million, giving
      us six-month operational runway without covenant impairment.
    text_tr: Mutabıkız. Otomatik haftalık hazine panolarımız artık yirmi iki milyonda sarı yönetişim uyarısı veriyor; bu da
      bize sözleşme ihlali olmadan altı aylık manevra alanı sağlıyor.
  key_vocabulary:
  - word: encumbered
    context_note_tr: teminat altına bağlı olduğu için serbest kullanılamayan
  - word: covenant
    context_note_tr: kredi sözleşmesinde borçlu için bağlayıcı finansal eşik
  - word: runway
    context_note_tr: stres altında likiditenin yeteceği süre
  comprehension_questions:
  - id: q_listening_c2_liquidity-stress-committee-brief_01
    question_en: Why does the $90M headline cash balance overstate parent headquarters flexibility?
    options:
    - T-bill custody requires three years before liquidating assets
    - Exports settled strictly in illiquid local equipment
    - Counterparty banks deduct forty percent fees upon wire sweeps
    - Roughly $19M sits legally trapped in foreign clearing units short-term
    correct_answer: Roughly $19M sits legally trapped in foreign clearing units short-term
    explanation_en: Murat clarifies ~$19M in foreign subsidiaries is ring-fenced and cannot sweep upward within 48 hours.
    explanation_tr: Murat yabancı iştiraklerdeki yaklaşık on dokuz milyonun yasal olarak kilitli olduğunu ve hızla aktarılamayacağını
      belirtir.
  - id: q_listening_c2_liquidity-stress-committee-brief_02
    question_en: How did Murat recently reduce banking counterparty concentration?
    options:
    - Converted working cash completely into raw copper futures
    - Shifted surplus cash from two regional banks into four sovereign funds and T-bills
    - Consolidated every reserve inside one domestic branch
    - Stopped collecting export receivables across subsidiaries
    correct_answer: Shifted surplus cash from two regional banks into four sovereign funds and T-bills
    explanation_en: Murat rebalanced away from two regional banks (62%) into sovereign money-market sleeves and T-bills.
    explanation_tr: Rezervlerin iki bölgesel bankadan dört devlet para piyasası fonuna ve hazine bonosu saklamasına dağıtıldığı
      anlatılır.
  - id: q_listening_c2_liquidity-stress-committee-brief_03
    question_en: What adverse outcome strikes if revolving credit draws exceed $35M in stress?
    options:
    - Interest-coverage covenant breaches force adverse loan repricing
    - Committee chairs dissolve automated weekly dashboards
    - Government treasuries confiscate remaining foreign subsidiary equity
    - Raw-copper shipments double automatically at ports
    correct_answer: Interest-coverage covenant breaches force adverse loan repricing
    explanation_en: Murat notes $35M drawn risks breaching quarterly interest coverage and triggering repricing.
    explanation_tr: Otuz beş milyon çekildiğinde faiz karşılama oranının ihlal edilip kredi maliyetinin artacağı belirtilir.
  - id: q_listening_c2_liquidity-stress-committee-brief_04
    question_en: Why does Victoria demand governance triggers at much lower draw levels?
    options:
    - T-bills expire cleanly every twenty-four hours
    - Automated dashboards cannot read metrics above thirty million
    - Proactive cost adjustments must occur well before formal credit warnings
    - Regional banks forbid holding less than twenty-five million in checking
    correct_answer: Proactive cost adjustments must occur well before formal credit warnings
    explanation_en: Victoria insists staging mitigation before $25M rather than reacting after rating scrutiny starts.
    explanation_tr: Victoria kredi derecelendirme baskısı başlamadan önce erken harekete geçilmesini ister.
  - id: q_listening_c2_liquidity-stress-committee-brief_05
    question_en: At what threshold does Murat's updated weekly alert sound a yellow warning?
    options:
    - Twenty-two million drawn
    - Sixty-two percent reserve ratio
    - Ninety million consolidated cash
    - Thirty-five million breached limit
    correct_answer: Twenty-two million drawn
    explanation_en: Murat sets the automated governance trigger at $22M to safeguard a six-month unencumbered runway.
    explanation_tr: Murat haftalık yönetişim uyarısının yirmi iki milyonda devreye girdiğini söyler.
  topic_tags:
  - treasury
  - stress-testing
  - governance
  related_ids: []
  status: APPROVED
  version: 1
- id: listening.c2.capital-reallocation-board-memo
  title: Repositioning Capital Toward High-Margin Workflows
  cefr_level: C2
  category: executive_briefing
  scenario_context: CEO Alison and Finance Chief Baris debate sunsetting a plateaued legacy hardware bundle to fund high-retention
    workflow automation.
  speakers:
  - id: alison
    name: Alison
    role: Chief Executive Officer
    accent: American
  - id: baris
    name: Baris
    role: Chief Financial Officer
    accent: Turkish
  audio_ref: audio/listening/c2_capital_reallocation_board_memo.mp3
  duration_seconds: 80
  transcript_items:
  - index: 1
    speaker_id: alison
    start_ms: 0
    end_ms: 8828
    text_en: Baris, our board deck shows revenue stalling around four percent quarterly while engineering still burns forty
      percent of R&D sustaining legacy scanner boxes.
    text_tr: Barış, yönetim kurulu dosyamız gelir büyümesinin yüzde dört civarında yataylaştığını, oysa Ar-Ge bütçesinin hâlâ
      yüzde kırkının eski tarayıcı cihazlara harcandığını gösteriyor.
  - index: 2
    speaker_id: baris
    start_ms: 9228
    end_ms: 18550
    text_en: Right—and when we strip capitalized support payroll out properly, legacy hardware yields barely thirty-one percent
      gross margin against seventy-eight percent on our workflow cloud.
    text_tr: Doğru—üstelik destek bordrosunu doğru düştüğümüzde eski donanım yalnızca yüzde otuz bir brüt kâr marjı üretirken
      iş akışı bulutumuz yüzde yetmiş sekiz kazandırıyor.
  - index: 3
    speaker_id: alison
    start_ms: 18950
    end_ms: 27468
    text_en: Yet sales directors push back fiercely whenever we hint at sunsetting hardware, arguing clients only trust software
      bundled onto familiar physical terminals.
    text_tr: Ama ne zaman donanımı sonlandırmayı ima etsek satış direktörleri müşterilerin yazılıma yalnızca tanıdık fiziksel
      terminallerle paketlenince güvendiğini savunup direniyor.
  - index: 4
    speaker_id: baris
    start_ms: 27868
    end_ms: 38925
    text_en: 'Actually, I audited renewal cohorts yesterday: sixty-four percent of new logos bypassed our proprietary device
      completely, installing the workflow client cleanly on consumer Android tablets.'
    text_tr: 'Aslında dün yenileme kohortlarını denetledim: yeni müşterilerin yüzde altmış dördü tescilli cihazımızı tamamen
      pas geçip yazılımı standart Android tabletlerine kurmuş.'
  - index: 5
    speaker_id: alison
    start_ms: 39325
    end_ms: 48902
    text_en: That shatters the bundling myth completely! Still, forcing abrupt hardware discontinuation risks triggering breach
      claims inside five legacy logistics hospitals.
    text_tr: Bu paketleme efsanesini tamamen çürütüyor! Yine de donanımı aniden kesmek beş eski lojistik hastanesinde sözleşme
      ihlali iddiasına yol açabilir.
  - index: 6
    speaker_id: baris
    start_ms: 49302
    end_ms: 62083
    text_en: 'Agreed—we execute a graceful three-year end-of-support horizon: end new manufacturing this quarter, retain spare
      repair pools through twenty-twenty-eight, and redirect half of saved R&D straight toward enterprise workflow integrations.'
    text_tr: 'Mutabıkız—üç yıllık zarif bir destek sonu takvimi uygularız: yeni üretimi bu çeyrek durdurup 2028 sonuna kadar
      yedek onarım stoku tutarız, kurtarılan Ar-Ge''nin yarısını doğrudan kurumsal iş akışı entegrasyonlarına aktarırız.'
  - index: 7
    speaker_id: alison
    start_ms: 62483
    end_ms: 70781
    text_en: And align sales commissions cleanly so representatives earn double accelerators converting legacy accounts toward
      pure software rather than shipping low-margin crates.
    text_tr: Satış primlerini de temsilcilerin düşük marjlı kutu satmak yerine eski hesapları saf yazılıma geçirirken çift
      hızlandırıcı kazanacağı şekilde hizalayalım.
  - index: 8
    speaker_id: baris
    start_ms: 71181
    end_ms: 79668
    text_en: Brilliant alignment. Reallocating twelve million annually lifts operating margin six points within six quarters
      without shrinking gross customer retention.
    text_tr: Kusursuz hizalama. Yılda on iki milyon doları yeniden dağıtmak müşteri kaybını artırmadan altı çeyrekte faaliyet
      marjını altı puan yükseltir.
  key_vocabulary:
  - word: cannibalization
    context_note_tr: yeni ürünün eski gelir akışını aşındırması
  - word: gross-margin
    context_note_tr: satış maliyeti düşüldükten sonraki brüt kârlılık
  - word: graceful
    context_note_tr: mevcut müşteriyi mağdur etmeyen kademeli kapanış
  comprehension_questions:
  - id: q_listening_c2_capital-reallocation-board-memo_01
    question_en: What sharp margin contrast does Baris highlight between legacy boxes and workflow cloud?
    options:
    - Equal margins once R&D capitalization shifts upward
    - Thirty-one percent gross margin on hardware versus seventy-eight percent on software
    - Forty percent on hardware and four percent on logistics clouds
    - Negative margins exclusively on Android tablet builds
    correct_answer: Thirty-one percent gross margin on hardware versus seventy-eight percent on software
    explanation_en: Baris contrasts 31% hardware gross margin against 78% software margin.
    explanation_tr: Barış donanımdaki yüzde otuz birlik brüt marj ile buluttaki yüzde yetmiş sekizlik marjı karşılaştırır.
  - id: q_listening_c2_capital-reallocation-board-memo_02
    question_en: How does recent buyer data disprove sales directors' defense of bundling hardware?
    options:
    - Double sales commissions lowered hardware manufacturing bills
    - 64% of new clients already run the software on standard Android tablets
    - All five logistics hospitals returned Android tablets last month
    - Enterprise clients prefer paper logs over physical scanners
    correct_answer: 64% of new clients already run the software on standard Android tablets
    explanation_en: Baris's audit reveals 64% of new buyers install the app directly on consumer Android tablets.
    explanation_tr: Yeni müşterilerin yüzde altmış dördünün yazılımı zaten standart Android tabletlerde çalıştırdığı ortaya
      çıkar.
  - id: q_listening_c2_capital-reallocation-board-memo_03
    question_en: Why avoid immediately shutting down legacy hardware support overnight?
    options:
    - Hardware crates hold seventy-eight percent operating margins
    - Android engineers refuse supporting consumer tablets
    - Manufacturing spares require ten years of regulatory testing
    - Abrupt cancellation would violate contracts at five existing institutional sites
    correct_answer: Abrupt cancellation would violate contracts at five existing institutional sites
    explanation_en: Alison warns abrupt discontinuation triggers breach disputes across five legacy hospitals.
    explanation_tr: Alison ani kesintinin beş eski kurumda sözleşme ihlali riskini doğuracağını uyarır.
  - id: q_listening_c2_capital-reallocation-board-memo_04
    question_en: What sales incentive overhaul ensures reps embrace software migration?
    options:
    - Freezing sales salaries throughout the three-year sunset
    - Subsidizing hardware crates at zero customer cost
    - Requiring representatives to repair broken scanner boxes
    - Doubling commission accelerators for converting clients to software-only plans
    correct_answer: Doubling commission accelerators for converting clients to software-only plans
    explanation_en: Alison aligns commissions to double accelerators on pure software migrations.
    explanation_tr: Alison saf yazılıma geçiş yaptıran temsilcilere çift prim hızlandırıcısı verilmesini önerir.
  - id: q_listening_c2_capital-reallocation-board-memo_05
    question_en: What financial outcome does Baris project over the next six quarters?
    options:
    - Spending forty percent more on factory repair pools
    - Sixty-four percent shrinkage in quarterly gross sales
    - Zero change until twenty-twenty-eight close
    - Reallocating $12M annually expands operating margin by six points
    correct_answer: Reallocating $12M annually expands operating margin by six points
    explanation_en: Baris projects saving/reallocating $12M lifts operating margin six points within six quarters.
    explanation_tr: Barış yıllık 12 milyonun yeniden yönlendirilmesinin altı çeyrekte faaliyet marjını altı puan artıracağını
      öngörür.
  topic_tags:
  - capital-allocation
  - portfolio
  - strategy
  related_ids: []
  status: APPROVED
  version: 1
- id: listening.c2.clinical-triage-copilot-discovery
  title: Evaluating Explainability Inside Clinical Triage Software
  cefr_level: C2
  category: product_discovery
  scenario_context: AI product strategist Melis conducts an observational study with emergency nurse practitioner Dr. Grant
    regarding algorithmic bias, alert fatigue, and provenance UI.
  speakers:
  - id: melis
    name: Melis
    role: Clinical AI Product Lead
    accent: Turkish
  - id: grant
    name: Dr. Grant
    role: Emergency Nurse Practitioner
    accent: British
  audio_ref: audio/listening/c2_clinical_triage_copilot_discovery.mp3
  duration_seconds: 75
  transcript_items:
  - index: 1
    speaker_id: melis
    start_ms: 0
    end_ms: 9822
    text_en: Dr. Grant, audit telemetry shows triage nurses overriding eighty-eight percent of our sepsis priority flags during
      peak Friday shifts—can you diagnose why clinicians tune them out?
    text_tr: Dr. Grant, denetim telemetrisi yoğun cuma nöbetlerinde triyaj hemşirelerinin sepsis öncelik uyarılarımızın yüzde
      seksen sekizini geçersiz kıldığını gösteriyor—klinisyenlerin bunları neden görmezden geldiğini açıklayabilir misiniz?
  - index: 2
    speaker_id: grant
    start_ms: 10222
    end_ms: 19415
    text_en: 'Frankly, Melis, presenting an opaque purple ''High Risk: 74%'' badge with zero rationale slows a chaotic intake
      bay instead of helping.'
    text_tr: 'Açıkçası Melis, hiçbir gerekçe sunmayan şeffaf olmayan mor bir ''Yüksek Risk: %74'' rozeti kaotik bir acil kabul
      alanını hızlandırmak yerine yavaşlatıyor.'
  - index: 3
    speaker_id: melis
    start_ms: 19815
    end_ms: 25888
    text_en: So opaque numeric probability feels like another unverified alarm demanding manual chart re-verification?
    text_tr: Yani açıklaması olmayan sayısal olasılık yalnızca hasta dosyasını baştan elle doğrulamayı gerektiren bir başka
      şüpheli alarm gibi mi hissettiriyor?
  - index: 4
    speaker_id: grant
    start_ms: 26288
    end_ms: 36591
    text_en: Precisely. Nurses don't need abstract model percentages—they need instantaneous data provenance showing whether
      mild fever combined with elevated lactate over ninety minutes triggered the alert.
    text_tr: Kesinlikle. Hemşirelerin soyut model yüzdelerine ihtiyacı yok; uyarının doksan dakika içindeki hafif ateş ile
      yükselen laktat değerinin birleşiminden mi çıktığını anında gösteren veri kökenine ihtiyaçları var.
  - index: 5
    speaker_id: melis
    start_ms: 36991
    end_ms: 46088
    text_en: 'That aligns closely with clinical accountability: showing the two contributing vitals and timestamp deltas inline
      beside a quiet neutral border rather than blinking sirens.'
    text_tr: 'Bu klinik hesap verebilirlikle birebir örtüşüyor: yanıp sönen sirenler yerine katkıda bulunan iki yaşamsal bulguyu
      ve zaman değişim farkını sade bir çerçevede yan yana göstermek.'
  - index: 6
    speaker_id: grant
    start_ms: 46488
    end_ms: 54676
    text_en: Equally crucial—stop flagging routine dehydrated runners identically alongside elderly immunocompromised arrivals
      simply because heart rates crossed ninety.
    text_tr: Aynı derecede hayati bir nokta daha—kalp atışı doksanı geçti diye susuz kalmış genç maratoncuları bağışıklığı
      baskılanmış yaşlı hastalarla aynı şekilde işaretlemeyi bırakın.
  - index: 7
    speaker_id: melis
    start_ms: 55076
    end_ms: 66483
    text_en: 'Agreed. Tuning subgroup threshold calibration alongside a lightweight ''Clinical context: dehydration'' one-tap
      override captures clean feedback for quarterly safety governance without delaying intake.'
    text_tr: 'Katılıyorum. Alt grup eşik kalibrasyonunu tek dokunuşlu ''Klinik bağlam: dehidrasyon'' geçersiz kılma seçeneğiyle
      birleştirmek, hasta kabulünü geciktirmeden üç aylık güvenlik yönetişimi için temiz geri bildirim toplar.'
  - index: 8
    speaker_id: grant
    start_ms: 66883
    end_ms: 73861
    text_en: Make provenance explicit and respect clinical judgment, and override fatigue collapses sharply within the very
      first triage week.
    text_tr: Veri kökenini açık kılıp klinik yargıya saygı duyduğunuzda uyarı yorgunluğu daha ilk triyaj haftasında keskin
      biçimde düşer.
  key_vocabulary:
  - word: provenance
    context_note_tr: uyarının hangi somut laboratuvar verisine dayandığı
  - word: calibration
    context_note_tr: sistemin aşırı veya eksik uyarı vermeden ayarlanması
  - word: override
    context_note_tr: klinisyenin öneriyi bilinçli biçimde geçersiz kılması
  comprehension_questions:
  - id: q_listening_c2_clinical-triage-copilot-discovery_01
    question_en: Why do Friday triage nurses ignore nearly ninety percent of AI risk flags?
    options:
    - Lab lactate results remain legally confidential for ninety minutes
    - Opaque percentage badges omit concrete clinical evidence and force chart checks
    - Emergency bays lack tablet wireless connectivity
    - Staff deliberately disable notification audio on desktops
    correct_answer: Opaque percentage badges omit concrete clinical evidence and force chart checks
    explanation_en: Dr. Grant explains an unexplained '74%' badge forces chaotic intake staff to re-read whole charts.
    explanation_tr: Dr. Grant gerekçesiz yüzdelik rozetin hemşireleri tüm dosyayı baştan kontrol etmeye zorladığını belirtir.
  - id: q_listening_c2_clinical-triage-copilot-discovery_02
    question_en: What UI redesign replaces blinking alerts and bare model percentages?
    options:
    - Hiding sepsis criteria permanently from junior nurses
    - Showing specific vital-sign deltas and timestamps inline cleanly
    - Making warning banners twice as large in bright purple
    - Sending summary PDF emails only after midnight
    correct_answer: Showing specific vital-sign deltas and timestamps inline cleanly
    explanation_en: Melis and Dr. Grant design inline display of contributing vitals and time deltas.
    explanation_tr: Uyarıyı tetikleyen yaşamsal bulguların ve zaman farklarının satır içinde açıkça gösterilmesi seçilir.
  - id: q_listening_c2_clinical-triage-copilot-discovery_03
    question_en: What calibration flaw currently generates excessive false alarms?
    options:
    - Immune status is hidden inside handwritten patient charts
    - Identical thresholds flag benign dehydrated runners alongside high-risk patients
    - Algorithm weights completely omit heart-rate readings
    - Tablet clocks drift backward every Friday evening
    correct_answer: Identical thresholds flag benign dehydrated runners alongside high-risk patients
    explanation_en: Dr. Grant faults uncalibrated threshold alerts equating dehydrated athletes with immunocompromised seniors.
    explanation_tr: Susuz kalmış koşucularla yüksek riskli yaşlı hastaların aynı kalp hızı eşiğiyle işaretlendiği eleştirilir.
  - id: q_listening_c2_clinical-triage-copilot-discovery_04
    question_en: How does Melis plan to gather training feedback without slowing emergency intake?
    options:
    - Providing lightweight one-tap override reason chips like 'dehydration'
    - Booking post-shift interviews every Saturday morning
    - Requiring five-paragraph written essays on every override
    - Pausing patient triage whenever scores fall under seventy percent
    correct_answer: Providing lightweight one-tap override reason chips like 'dehydration'
    explanation_en: A lightweight one-tap context override feeds safety governance cleanly without workflow delay.
    explanation_tr: Hasta kabulünü yavaşlatmadan tek dokunuşlu gerekçe seçeneğiyle geri bildirim toplanır.
  - id: q_listening_c2_clinical-triage-copilot-discovery_05
    question_en: What behavioral shift does Dr. Grant expect once provenance becomes explicit?
    options:
    - Eighty-eight percent increase in ambulance wait times
    - Total elimination of nurse triage supervision
    - Mandatory paper checklists replacing tablet records
    - Rapid decline in alert dismissal within the opening week
    correct_answer: Rapid decline in alert dismissal within the opening week
    explanation_en: Dr. Grant predicts override fatigue will drop sharply in week one when evidence provenance is clear.
    explanation_tr: Dr. Grant veri kökeni şeffaflaştığında uyarı yorgunluğunun ilk haftadan itibaren hızla düşeceğini öngörür.
  topic_tags:
  - healthtech
  - explainability
  - ai-ux
  related_ids: []
  status: APPROVED
