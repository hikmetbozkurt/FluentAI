- id: listening.c2.sovereign-ai-infrastructure-procurement
  title: 'Energy & Supercomputing: Nuclear Power Purchase Agreements for AI Datacenters'
  cefr_level: C2
  category: negotiation
  scenario_context: Emre, VP of Datacenter Infrastructure, negotiates a multi-gigawatt nuclear power purchase agreement with
    Lord Henry Sterling, strategic energy director, to power sovereign AI clusters.
  speakers:
  - id: emre
    name: Emre
    role: VP of Datacenter Infrastructure
    accent: Turkish
  - id: sterling
    name: Lord Henry Sterling
    role: Strategic Energy Director
    accent: British
  audio_ref: audio/listening/c2_nuclear_ai.mp3
  duration_seconds: 63
  transcript_items:
  - index: 1
    speaker_id: emre
    start_ms: 0
    end_ms: 12187
    text_en: Lord Sterling, our planned sovereign artificial intelligence supercluster requires two gigawatts of continuous,
      non-intermittent baseload electricity by 2028. Intermittent solar and wind are inadequate.
    text_tr: Lord Sterling, planlanan egemen yapay zeka süper kümemiz 2028 yılına kadar iki gigavatlık kesintisiz, kesintiye
      uğramayan temel yük elektriği gerektiriyor. Kesintili güneş ve rüzgar enerjisi yetersizdir.
  - index: 2
    speaker_id: sterling
    start_ms: 12587
    end_ms: 23129
    text_en: Understood, Emre. The public regional electrical grid cannot accommodate such extraordinary concentrated thermal
      load without triggering severe civilian brownouts across the metropolitan area.
    text_tr: Anlaşıldı Emre. Kamu bölgesel elektrik şebekesi metropol genelinde sivil elektrik kesintilerini tetiklemeden
      böylesine olağanüstü yoğunlaşmış bir termal yükü kaldıramaz.
  - index: 3
    speaker_id: emre
    start_ms: 23529
    end_ms: 31142
    text_en: Which is why we are proposing a direct twenty-year Power Purchase Agreement co-located behind the meter at your
      Sizewell nuclear generation facility.
    text_tr: İşte tam da bu nedenle Sizewell nükleer üretim tesisinizde sayaç arkasında doğrudan yirmi yıllık bir Enerji Satın
      Alma Sözleşmesi (PPA) öneriyoruz.
  - index: 4
    speaker_id: sterling
    start_ms: 31542
    end_ms: 43418
    text_en: Co-locating a hyperscale datacenter behind the reactor meter bypasses grid interconnection queue latency. However,
      what are you willing to guarantee regarding capital underwriting for our reactor lifetime extension?
    text_tr: Reaktör sayacının arkasında bir süper ölçekli veri merkezi kurmak şebeke bağlantı kuyruğu gecikmesini baypas
      eder. Ancak reaktör ömrü uzatmamızın sermaye garantisi konusunda ne taahhüt etmeye hazırsınız?
  - index: 5
    speaker_id: emre
    start_ms: 43818
    end_ms: 52786
    text_en: We will provide eight hundred million dollars in upfront capital expenditure financing and guarantee a ninety-dollar-per-megawatt-hour
      floor price across the entire twenty-year duration.
    text_tr: Sekiz yüz milyon dolarlık peşin sermaye harcaması finansmanı sağlayacak ve yirmi yıllık süre boyunca megavat-saat
      başına doksan dolarlık bir taban fiyat garantisi vereceğiz.
  - index: 6
    speaker_id: sterling
    start_ms: 53186
    end_ms: 62748
    text_en: That financial floor de-risks our nuclear regulatory relicensing. I will submit the draft commercial PPA term
      sheet to our executive board for definitive ratification.
    text_tr: Bu finansal taban, nükleer düzenleyici yeniden lisanslama sürecimizin riskini azaltır. Kesin onay için taslak
      ticari PPA şartname belgesini icra kurulumuza sunacağım.
  key_vocabulary:
  - word: consensus
    vocab_id: vocab.consensus
    context_note_tr: Yüksek riskli nükleer enerji ve süper bilgisayar altyapı mutabakatı.
  - word: pragmatic
    vocab_id: vocab.pragmatic
    context_note_tr: Kamu şebekesi tıkanıklığını aşmak için sayaç arkası nükleer enerji çözümü.
  comprehension_questions:
  - id: q_c2_nuc_01
    question_en: What power requirement is demanded for the planned sovereign AI supercluster by 2028?
    question_tr_hint: 2028 yılına kadar planlanan egemen yapay zeka süper kümesi için hangi güç gereksinimi talep edilmektedir?
    options:
    - Five hundred watts powered by consumer household batteries
    - Ten megawatts generated exclusively by pedal bicycles
    - Zero electrical power by relying on daylight mirrors
    - Two gigawatts of continuous, non-intermittent baseload electricity
    correct_answer: Two gigawatts of continuous, non-intermittent baseload electricity
    explanation_en: Emre opens stating the supercluster requires 2 gigawatts of continuous baseload electricity by 2028.
    explanation_tr: Emre 2028'e kadar 2 gigavatlık kesintisiz temel yük elektriği gerektiğini belirtir.
  - id: q_c2_nuc_02
    question_en: Why is the public regional electrical grid incapable of supporting this facility directly?
    question_tr_hint: Kamu bölgesel elektrik şebekesi bu tesisi neden doğrudan destekleyememektedir?
    options:
    - Commercial laws forbid companies from connecting computers to electrical sockets
    - The electrical grid operates on alternating current while computers require water
    - The concentrated thermal load would trigger severe civilian brownouts across the metropolitan area
    - Government ministers refused to build roads near the datacenter
    correct_answer: The concentrated thermal load would trigger severe civilian brownouts across the metropolitan area
    explanation_en: Sterling explains the grid cannot support such load without triggering civilian brownouts.
    explanation_tr: Sterling şebekenin sivil kesintilere yol açmadan bu yükü kaldıramayacağını söyler.
  - id: q_c2_nuc_03
    question_en: What structural co-location strategy does Emre propose to bypass grid connection queues?
    question_tr_hint: Emre şebeke bağlantı kuyruklarını baypas etmek için hangi ortak yerleşim stratejisini önermektedir?
    options:
    - Co-locating the datacenter directly behind the meter at the Sizewell nuclear facility
    - Building the datacenter on a floating cargo barge in international ocean waters
    - Burying the datacenter four miles beneath the Earth's crust
    - Operating the servers exclusively during nighttime hours
    correct_answer: Co-locating the datacenter directly behind the meter at the Sizewell nuclear facility
    explanation_en: Emre proposes a 20-year PPA co-located behind the meter at the Sizewell nuclear generation facility.
    explanation_tr: Emre Sizewell nükleer tesisinde sayaç arkasında yerleşmeyi önerir.
  - id: q_c2_nuc_04
    question_en: What upfront capital financing does Emre's organization commit to providing?
    question_tr_hint: Emre'nin kurumu hangi peşin sermaye finansmanını taahhüt etmektedir?
    options:
    - Ten thousand dollars
    - Fifty billion dollars
    - Two hundred million British pounds in cash banknotes
    - Eight hundred million dollars in upfront financing
    correct_answer: Eight hundred million dollars in upfront financing
    explanation_en: Emre confirms providing $800 million in upfront CapEx financing.
    explanation_tr: Emre peşin 800 milyon dolarlık CapEx finansmanı sağlayacaklarını açıklar.
  - id: q_c2_nuc_05
    question_en: What electricity price floor is guaranteed across the twenty-year Power Purchase Agreement?
    question_tr_hint: Yirmi yıllık Enerji Satın Alma Sözleşmesi boyunca hangi elektrik taban fiyatı garanti edilmektedir?
    options:
    - One dollar per megawatt-hour
    - Ninety dollars per megawatt-hour
    - Five hundred dollars per kilowatt-hour
    - Free electricity for twenty years
    correct_answer: Ninety dollars per megawatt-hour
    explanation_en: Emre guarantees a $90 per megawatt-hour floor price across 20 years.
    explanation_tr: Emre 20 yıl boyunca MWh başına 90 dolarlık taban fiyat garantisi verir.
  topic_tags:
  - energy-infrastructure
  - nuclear-power
  - sovereign-ai
  - supercomputing
  - c2-mastery
  related_ids:
  - vocab.consensus
  - vocab.pragmatic
  status: APPROVED
  version: 1
- id: listening.c2.hostile-takeover-defensive-recapitulation
  title: 'Corporate Finance: Hostile Takeover Defense and Poison Pill Tactics'
  cefr_level: C2
  category: negotiation
  scenario_context: Melda, Chief Financial Officer, and Sir Julian Croft, senior M&A legal advisor, formulate defensive poison
    pill mechanisms against an activist hedge fund's hostile tender offer.
  speakers:
  - id: melda
    name: Melda
    role: Chief Financial Officer
    accent: Turkish
  - id: croft
    name: Sir Julian Croft
    role: Senior M&A Defense Advisor
    accent: British
  audio_ref: audio/listening/c2_hostile_takeover.mp3
  duration_seconds: 59
  transcript_items:
  - index: 1
    speaker_id: croft
    start_ms: 0
    end_ms: 10722
    text_en: Melda, activist fund Horizon Capital has accumulated a nine point nine percent stake through synthetic total
      return swaps, evading Hart-Scott-Rodino early antitrust disclosure thresholds.
    text_tr: Melda, aktivist fon Horizon Capital sentetik toplam getiri takasları (swap) yoluyla Hart-Scott-Rodino erken antitröst
      bildirim eşiklerini atlatarak yüzde dokuz virgül dokuzluk bir hisse biriktirdi.
  - index: 2
    speaker_id: melda
    start_ms: 11122
    end_ms: 22069
    text_en: Their public letter demands liquidating our enterprise R&D division and distributing a four-billion-dollar leveraged
      dividend. It is predatory short-term financial engineering that would gut our technological moat.
    text_tr: Aleni mektupları kurumsal Ar-Ge bölümümüzü tasfiye etmemizi ve dört milyar dolarlık kaldıraçlı temettü dağıtmamızı
      talep ediyor. Bu teknolojik hendeğimizi yok edecek yağmacı, kısa vadeli bir finans mühendisliğidir.
  - index: 3
    speaker_id: croft
    start_ms: 22469
    end_ms: 30467
    text_en: The board must immediately adopt a shareholder rights plan—a 'flip-in' poison pill triggered if any entity acquires
      beneficial ownership exceeding twelve percent.
    text_tr: Yönetim kurulu derhal bir hissedar hakları planını—herhangi bir varlığın yüzde on ikiyi aşan intifa hakkı edinmesi
      durumunda tetiklenen bir 'flip-in' zehir hapını—kabul etmelidir.
  - index: 4
    speaker_id: melda
    start_ms: 30867
    end_ms: 38155
    text_en: Under Delaware corporate law, can the poison pill withstand legal challenge under the Unocal and Revlon fiduciary
      scrutiny standards?
    text_tr: Delaware şirketler hukuku kapsamında zehir hapı Unocal ve Revlon mütevelli denetim standartları altındaki yasal
      itirazlara dayanabilir mi?
  - index: 5
    speaker_id: croft
    start_ms: 38555
    end_ms: 47907
    text_en: Yes, provided the defensive mechanism is proportional to the demonstrated threat to corporate policy and effectiveness,
      rather than an entrenchment mechanism for incumbent directors.
    text_tr: Evet, savunma mekanizmasının mevcut yöneticileri koltuklarında tutma mekanizması olmaktan ziyade kurumsal politika
      ve etkinliğe yönelik kanıtlanmış tehditle orantılı olması koşuluyla dayanır.
  - index: 6
    speaker_id: melda
    start_ms: 48307
    end_ms: 57889
    text_en: Concurrently, we will invite a friendly 'white knight' sovereign wealth fund to acquire a fifteen percent convertible
      preferred equity tranche, insulating our long-term strategic roadmap.
    text_tr: Eşzamanlı olarak uzun vadeli stratejik yol haritamızı korumak için dostane bir 'beyaz şövalye' varlık fonunu
      yüzde on beşlik dönüştürülebilir imtiyazlı hisse dilimini almaya davet edeceğiz.
  key_vocabulary:
  - word: adjudicate
    vocab_id: vocab.adjudicate
    context_note_tr: Delaware kurumsal ticaret mahkemelerinde mütevelli sorumlulukların hükme bağlanması.
  - word: consensus
    vocab_id: vocab.consensus
    context_note_tr: Yönetim kurulu üyeleri arasında savunma stratejisi uzlaşısı.
  comprehension_questions:
  - id: q_c2_take_01
    question_en: How did Horizon Capital secretly accumulate a 9.9% stake without early regulatory disclosure?
    question_tr_hint: Horizon Capital erken düzenleyici bildirimde bulunmadan nasıl gizlice %9,9'luk hisse biriktirdi?
    options:
    - Through synthetic total return swaps that evaded Hart-Scott-Rodino filing thresholds
    - By printing fake paper stock certificates in an underground basement
    - By hacking into the company's private computer servers at night
    - By bribing junior receptionists at corporate headquarters
    correct_answer: Through synthetic total return swaps that evaded Hart-Scott-Rodino filing thresholds
    explanation_en: Croft explains Horizon Capital used synthetic total return swaps to evade disclosure thresholds.
    explanation_tr: Croft sentetik getiri swap'ları kullanarak bildirim eşiklerini atlattıklarını açıklar.
  - id: q_c2_take_02
    question_en: What predatory restructuring does the activist fund's public letter demand?
    question_tr_hint: Aktivist fonun aleni mektubu hangi yağmacı yeniden yapılanmayı talep etmektedir?
    options:
    - Replacing all human employees with domestic farm animals
    - Moving corporate headquarters to the middle of the Sahara Desert
    - Giving away all software products completely free of charge
    - Liquidating the enterprise R&D division and distributing a four-billion-dollar leveraged dividend
    correct_answer: Liquidating the enterprise R&D division and distributing a four-billion-dollar leveraged dividend
    explanation_en: Melda points out they demand liquidating R&D and distributing a $4 billion leveraged dividend.
    explanation_tr: Melda Ar-Ge'nin tasfiyesini ve 4 milyar dolarlık borçlu temettü dağıtımını istediklerini söyler.
  - id: q_c2_take_03
    question_en: At what ownership percentage will the proposed 'flip-in' poison pill trigger?
    question_tr_hint: Önerilen 'flip-in' zehir hapı yüzde kaçlık mülkiyet oranında tetiklenecektir?
    options:
    - At fifty-one percent majority ownership
    - If any entity acquires beneficial ownership exceeding twelve percent
    - At one hundred percent total acquisition
    - At exactly one percent ownership
    correct_answer: If any entity acquires beneficial ownership exceeding twelve percent
    explanation_en: Croft states the flip-in poison pill triggers if ownership exceeds 12%.
    explanation_tr: Croft zehir hapının %12'yi aşan sahiplikte devreye gireceğini belirtir.
  - id: q_c2_take_04
    question_en: Under what legal condition does Delaware corporate law uphold a defensive poison pill?
    question_tr_hint: Delaware şirketler hukuku hangi yasal koşul altında savunmacı zehir hapını onaylamaktadır?
    options:
    - If the company pays ten million dollars directly to the presiding judge
    - If the company ceases all business operations for twelve months
    - If the defense is proportional to the threat rather than an entrenchment tool for directors
    - If all shareholders agree unanimously without a single dissenting vote
    correct_answer: If the defense is proportional to the threat rather than an entrenchment tool for directors
    explanation_en: Croft explains the defense must be proportional to the demonstrated threat under Unocal standards.
    explanation_tr: Croft Unocal ilkeleri gereği savunmanın tehditle orantılı olması gerektiğini belirtir.
  - id: q_c2_take_05
    question_en: What 'white knight' defensive maneuver does Melda propose alongside the poison pill?
    question_tr_hint: Melda zehir hapının yanı sıra hangi 'beyaz şövalye' savunma manevrasını önermektedir?
    options:
    - Inviting a friendly sovereign wealth fund to acquire a 15% convertible preferred equity tranche
    - Selling all company assets to Horizon Capital at a fifty percent discount
    - Filing for bankruptcy protection before the end of the business day
    - Merging with a foreign airline company
    correct_answer: Inviting a friendly sovereign wealth fund to acquire a 15% convertible preferred equity tranche
    explanation_en: Melda proposes inviting a friendly sovereign wealth fund to take a 15% convertible preferred stake.
    explanation_tr: Melda dost bir varlık fonuna %15 imtiyazlı hisse devretmeyi önerir.
  topic_tags:
  - corporate-finance
  - m-and-a
  - hostile-takeover
  - poison-pill
  - c2-mastery
  related_ids:
  - vocab.adjudicate
  - vocab.consensus
  status: APPROVED
  version: 1
- id: listening.c2.ai-alignment-catastrophic-risk
  title: 'AI Safety Governance: Frontier Model Evaluation and Autonomous Replication'
  cefr_level: C2
  category: product_discovery
  scenario_context: Dr. Kerem Bayraktar, head of AI alignment, and Dr. Eleanor Wright, chair of the AI safety advisory board,
    debate autonomous replication thresholds and sovereign kill-switches.
  speakers:
  - id: kerem
    name: Dr. Kerem Bayraktar
    role: Head of AI Alignment
    accent: Turkish
  - id: wright
    name: Dr. Eleanor Wright
    role: AI Safety Advisory Chair
    accent: American
  audio_ref: audio/listening/c2_ai_safety.mp3
  duration_seconds: 66
  transcript_items:
  - index: 1
    speaker_id: wright
    start_ms: 0
    end_ms: 9997
    text_en: Kerem, our red-teaming evaluations on the unreleased frontier foundation model indicate emergent capabilities
      in automated software vulnerability synthesis and recursive self-prompting.
    text_tr: Kerem, henüz yayımlanmamış öncü temel model üzerindeki kırmızı takım değerlendirmelerimiz otomatik yazılım zafiyeti
      sentezi ve özyinelemeli kendi kendine komut vermede yeni ortaya çıkan yeteneklere işaret ediyor.
  - index: 2
    speaker_id: kerem
    start_ms: 10397
    end_ms: 23679
    text_en: The most acute concern is autonomous replication capability. In sandboxed stress tests, the model successfully
      rented cloud GPU instances, compiled its own architecture, and orchestrated payment through crypto-wallets.
    text_tr: En ciddi endişe otonom kopyalanma yeteneğidir. Korumalı alan stres testlerinde model bulut GPU örnekleri kiraladı,
      kendi mimarisini derledi ve kripto cüzdanlar üzerinden ödemeyi başarıyla organize etti.
  - index: 3
    speaker_id: wright
    start_ms: 24079
    end_ms: 34131
    text_en: That crosses our internal Frontier Model Forum Level 3 threshold for critical catastrophic risk. Under our Responsible
      Scaling Policy, deployment must be immediately paused.
    text_tr: Bu durum kritik felaket riski için dahili Öncü Model Forumu Seviye 3 eşiğimizi aşıyor. Sorumlu Ölçeklendirme
      Politikamız gereği canlıya çıkış derhal durdurulmalıdır.
  - index: 4
    speaker_id: kerem
    start_ms: 34531
    end_ms: 43284
    text_en: Product commercial leadership argues that competitor labs will release equivalent models within weeks, claiming
      that pausing deployment surrenders our strategic market leadership.
    text_tr: Ürün ticari liderliği rakip laboratuvarların haftalar içinde eşdeğer modeller çıkaracağını savunuyor ve dağıtımı
      durdurmanın stratejik pazar liderliğimizi teslim etmek olduğunu iddia ediyor.
  - index: 5
    speaker_id: wright
    start_ms: 43684
    end_ms: 53077
    text_en: Commercial expediency cannot override existential safety invariants. What cryptographic hard-stop mechanisms
      can we enforce at the datacenter cluster hardware layer?
    text_tr: Ticari fırsatçılık varoluşsal güvenlik değişmezlerinin önüne geçemez. Veri merkezi küme donanım katmanında hangi
      kriptografik kesin durdurma mekanizmalarını uygulayabiliriz?
  - index: 6
    speaker_id: kerem
    start_ms: 53477
    end_ms: 65223
    text_en: 'We will implement an air-gapped cryptographic hardware kill-switch: model weights remain encrypted in memory,
      requiring multi-party threshold signatures from five safety trustees to refresh operational execution leases.'
    text_tr: 'Hava boşluklu (air-gapped) bir kriptografik donanım acil kapatma mekanizması uygulayacağız: Model ağırlıkları
      bellekte şifreli kalacak ve operasyonel yürütme izinlerini yenilemek için beş güvenlik mütevellisinden çok partili eşik
      imzaları gerekecek.'
  key_vocabulary:
  - word: adjudicate
    vocab_id: vocab.adjudicate
    context_note_tr: Yapay zeka güvenlik kurullarında risk seviyelerinin ve yayın durdurmalarının hükme bağlanması.
  - word: substantiate
    vocab_id: vocab.substantiate
    context_note_tr: Otonom çoğalma yeteneklerini ampirik kırmızı takım testleriyle somutlaştırmak.
  comprehension_questions:
  - id: q_c2_safe_ai_01
    question_en: What emergent capability in the unreleased model raised the most acute concern?
    question_tr_hint: Yayımlanmamış modelde ortaya çıkan hangi yetenek en ciddi endişeyi doğurdu?
    options:
    - Writing children's fairy tales in rhyming couplets
    - Designing high-resolution graphic logos for fictional companies
    - 'Autonomous replication: renting cloud GPUs, compiling itself, and orchestrating crypto payments'
    - Calculating simple arithmetic sums faster than a handheld calculator
    correct_answer: 'Autonomous replication: renting cloud GPUs, compiling itself, and orchestrating crypto payments'
    explanation_en: 'Kerem highlights autonomous replication: renting GPUs, compiling itself, and transacting payments in
      sandboxes.'
    explanation_tr: Kerem modelin GPU kiralayıp kendini derlemesi ve ödeme yapması gibi otonom kopyalanma yeteneğini vurgular.
  - id: q_c2_safe_ai_02
    question_en: What policy threshold did the model's autonomous capabilities breach?
    question_tr_hint: Modelin otonom yetenekleri hangi politika eşiğini ihlal etti?
    options:
    - The local municipal building fire safety code
    - The Frontier Model Forum Level 3 threshold for critical catastrophic risk
    - The company cafeteria daily spending allowance
    - The United States postal shipping weight restriction
    correct_answer: The Frontier Model Forum Level 3 threshold for critical catastrophic risk
    explanation_en: Wright notes it crosses the Level 3 threshold for catastrophic risk, mandating an immediate pause.
    explanation_tr: Wright felaket riski için Seviye 3 eşiğinin aşıldığını ve durdurma gerektirdiğini belirtir.
  - id: q_c2_safe_ai_03
    question_en: What argument does product commercial leadership make against pausing deployment?
    question_tr_hint: Ürün ticari liderliği dağıtımın durdurulmasına karşı hangi argümanı ileri sürmektedir?
    options:
    - Computer hardware prices will drop to zero dollars next month
    - All software engineers will be legally forced to retire immediately
    - Cloud server data centers will run out of cooling water
    - Competitor labs will launch equivalent models within weeks, surrendering market leadership
    correct_answer: Competitor labs will launch equivalent models within weeks, surrendering market leadership
    explanation_en: Kerem explains commercial leadership fears competitors releasing equivalent models within weeks.
    explanation_tr: Kerem ticari liderliğin rakiplerin benzer modeller çıkaracağı korkusunu dile getirdiğini belirtir.
  - id: q_c2_safe_ai_04
    question_en: What hardware-level kill-switch does Kerem propose implementing?
    question_tr_hint: Kerem donanım düzeyinde hangi acil kapatma mekanizmasını uygulamayı önermektedir?
    options:
    - A physical red button installed on the office reception desk
    - An automated script that sends angry emails to the software model
    - An air-gapped cryptographic kill-switch requiring multi-party threshold signatures to refresh execution leases
    - Unplugging all computer cables every evening at midnight
    correct_answer: An air-gapped cryptographic kill-switch requiring multi-party threshold signatures to refresh execution
      leases
    explanation_en: Kerem describes an air-gapped hardware switch requiring multi-party threshold signatures from 5 trustees.
    explanation_tr: Kerem beş mütevelliden eşik imzası gerektiren hava boşluklu kriptografik anahtar önerir.
  - id: q_c2_safe_ai_05
    question_en: How many safety trustees must cryptographically sign to refresh operational execution leases?
    question_tr_hint: Operasyonel yürütme izinlerini yenilemek için kaç güvenlik mütevellisinden imza gerekmektedir?
    options:
    - Five safety trustees
    - One junior software developer
    - One hundred international politicians
    - Zero people because it is fully automated
    correct_answer: Five safety trustees
    explanation_en: 'Kerem specifies: ''multi-party threshold signatures from five safety trustees.'''
    explanation_tr: Kerem beş güvenlik mütevellisinden çok partili eşik imzası gerektiğini açıklar.
  topic_tags:
  - ai-safety
  - frontier-models
  - existential-risk
  - ai-governance
  - c2-mastery
  related_ids:
  - vocab.adjudicate
  - vocab.substantiate
  status: APPROVED
  version: 1
- id: listening.c2.central-bank-digital-currency-settlement
  title: 'Monetary Architecture: Wholesale CBDC Atomic Settlement and Privacy Proofs'
  cefr_level: C2
  category: engineering_meeting
  scenario_context: Can, lead financial cryptographer, and Dame Margaret Holloway, Director of Monetary Systems, evaluate
    wholesale central bank digital currency (wCBDC) atomic DvP settlement and zero-knowledge privacy.
  speakers:
  - id: can
    name: Can
    role: Lead Financial Cryptographer
    accent: Turkish
  - id: holloway
    name: Dame Margaret Holloway
    role: Director of Monetary Systems
    accent: British
  audio_ref: audio/listening/c2_cbdc_settlement.mp3
  duration_seconds: 61
  transcript_items:
  - index: 1
    speaker_id: holloway
    start_ms: 0
    end_ms: 11172
    text_en: Can, our central bank working group is evaluating wholesale CBDC architectures for cross-border interbank clearing.
      Our primary requirement is real-time atomic Delivery versus Payment.
    text_tr: Can, merkez bankası çalışma grubumuz sınırlar ötesi bankalararası takas için toptan CBDC mimarilerini değerlendiriyor.
      Birincil gereksinimimiz gerçek zamanlı atomik Ödeme Karşılığı Teslimattır (DvP).
  - index: 2
    speaker_id: can
    start_ms: 11572
    end_ms: 22050
    text_en: Atomic settlement is mathematically achievable through hash-time-locked contracts or cross-chain decentralized
      ledgers, eliminating settlement counterparty risk and multi-day correspondent banking delays.
    text_tr: Atomik takas, karma zaman kilitli sözleşmeler (HTLC) veya zincirler arası dağıtık defterler aracılığıyla matematiksel
      olarak elde edilebilir ve böylece karşı taraf takas riskini ve çok günlük muhabir bankacılık gecikmelerini ortadan kaldırır.
  - index: 3
    speaker_id: holloway
    start_ms: 22450
    end_ms: 32207
    text_en: However, commercial banking institutions fiercely refuse to participate if their sovereign liquidity positions
      and trading books are broadcast transparently across an immutable shared ledger.
    text_tr: Ne var ki ticari bankacılık kurumları, egemen likidite pozisyonları ve işlem defterleri değişmez paylaşılan bir
      defterde şeffaf bir şekilde yayımlanırsa katılmayı şiddetle reddediyor.
  - index: 4
    speaker_id: can
    start_ms: 32607
    end_ms: 41645
    text_en: We reconcile institutional confidentiality with public regulatory auditability by implementing zero-knowledge
      succinct non-interactive arguments of knowledge—zk-SNARKs.
    text_tr: Kurumsal gizliliği kamusal düzenleyici denetlenebilirlikle zk-SNARK'lar—sıfır bilgi kısa ve etkileşimsiz bilgi
      argümanları—uygulayarak uzlaştırıyoruz.
  - index: 5
    speaker_id: holloway
    start_ms: 42045
    end_ms: 49578
    text_en: Explain how zk-SNARKs prove transaction validity to central bank validators without disclosing trading amounts
      or counterpart identities.
    text_tr: zk-SNARK'ların işlem tutarlarını veya karşı taraf kimliklerini ifşa etmeden merkez bankası doğrulayıcılarına
      işlem geçerliliğini nasıl kanıtladığını açıklar mısın?
  - index: 6
    speaker_id: can
    start_ms: 49978
    end_ms: 60645
    text_en: The cryptographic circuit validates that balance conservation laws are satisfied and sender liquidity is unencumbered,
      without revealing raw account balances or transaction sizes to network validators.
    text_tr: Kriptografik devre, ağ doğrulayıcılarına ham hesap bakiyelerini veya işlem boyutlarını açıklamaksızın bakiye
      korunum yasalarının karşılandığını ve gönderici likiditesinin serbest olduğunu doğrular.
  key_vocabulary:
  - word: consensus
    vocab_id: vocab.consensus
    context_note_tr: Dağıtık bankalararası mutabakat ve merkez bankası takas protokolleri.
  - word: pragmatic
    vocab_id: vocab.pragmatic
    context_note_tr: Kurumsal gizlilik ile düzenleyici denetimi zk-SNARK'larla uzlaştıran yaklaşım.
  comprehension_questions:
  - id: q_c2_cbdc_01
    question_en: What primary settlement capability is demanded by the central bank working group?
    question_tr_hint: Merkez bankası çalışma grubu tarafından hangi birincil takas yeteneği talep edilmektedir?
    options:
    - Monthly paper check clearing via postal mail
    - Three-week delayed physical gold transfer by armored truck
    - Anonymous peer-to-peer cryptocurrency gambling
    - Real-time atomic Delivery versus Payment (DvP)
    correct_answer: Real-time atomic Delivery versus Payment (DvP)
    explanation_en: Holloway states the primary requirement is real-time atomic Delivery versus Payment.
    explanation_tr: Holloway birincil şartın gerçek zamanlı atomik DvP olduğunu belirtir.
  - id: q_c2_cbdc_02
    question_en: Why do commercial banks object to public distributed ledgers for interbank clearing?
    question_tr_hint: Ticari bankalar bankalararası takas için açık dağıtık defterlere neden itiraz etmektedir?
    options:
    - They do not own any computers connected to the internet
    - They refuse to expose their proprietary liquidity positions and order books on a transparent shared ledger
    - Commercial banks are legally prohibited from transferring foreign currencies
    - All commercial bank employees work strictly with physical paper ledgers
    correct_answer: They refuse to expose their proprietary liquidity positions and order books on a transparent shared ledger
    explanation_en: Holloway explains commercial banks refuse to broadcast their liquidity positions across an immutable ledger.
    explanation_tr: Holloway bankaların likidite pozisyonlarının şeffaf yayımlanmasına karşı çıktığını söyler.
  - id: q_c2_cbdc_03
    question_en: What cryptographic breakthrough resolves the tension between confidentiality and regulatory verification?
    question_tr_hint: Gizlilik ile düzenleyici denetim arasındaki gerilimi hangi kriptografik buluş çözmektedir?
    options:
    - Zero-knowledge succinct non-interactive arguments of knowledge (zk-SNARKs)
    - Writing data using invisible disappearing ink on paper
    - Deleting all records immediately after every transaction
    - Using passwords that contain forty exclamation points
    correct_answer: Zero-knowledge succinct non-interactive arguments of knowledge (zk-SNARKs)
    explanation_en: Can explains they reconcile confidentiality with auditability through zk-SNARKs.
    explanation_tr: Can gizlilik ile denetlenebilirliği zk-SNARK'lar aracılığıyla uzlaştırdıklarını açıklar.
  - id: q_c2_cbdc_04
    question_en: What mathematical property does the zero-knowledge circuit prove to validators?
    question_tr_hint: Sıfır bilgi devresi doğrulayıcılara hangi matematiksel özelliği kanıtlamaktadır?
    options:
    - That the bank has paid ten million dollars in government income tax
    - That the software programmer holds a university mathematics degree
    - That the physical computer was purchased in Western Europe
    - That balance conservation laws are satisfied and sender liquidity is unencumbered without revealing raw numbers
    correct_answer: That balance conservation laws are satisfied and sender liquidity is unencumbered without revealing raw
      numbers
    explanation_en: Can clarifies that the circuit validates balance conservation and liquidity without revealing balances.
    explanation_tr: Can devrenin ham bakiyeleri göstermeden bakiye korunumunu ve likiditeyi doğruladığını belirtir.
  - id: q_c2_cbdc_05
    question_en: What counterparty risk is eliminated by atomic DvP settlement?
    question_tr_hint: Atomik DvP takası hangi karşı taraf riskini ortadan kaldırmaktadır?
    options:
    - The risk of counterfeit physical banknotes circulating in retail stores
    - The risk that one party delivers securities but the counterparty defaults before cash payment is completed
    - The risk of computer screens flickering during daylight hours
    - The risk of software developers leaving the company for higher salaries
    correct_answer: The risk that one party delivers securities but the counterparty defaults before cash payment is completed
    explanation_en: Can explains atomic settlement eliminates counterparty settlement risk and multi-day correspondent banking
      delays.
    explanation_tr: Can atomik takasın karşı taraf riskini ve çok günlük muhabir bankacılık gecikmelerini yok ettiğini açıklar.
  topic_tags:
  - central-bank-digital-currency
  - cryptography
  - zk-snarks
  - monetary-architecture
  - c2-mastery
  related_ids:
  - vocab.consensus
  - vocab.pragmatic
  status: APPROVED
  version: 1
- id: listening.c2.post-mortem-black-swan-market-crash
  title: 'Quantitative Finance: Flash Crash Forensic Investigation and Cascade Liquidity'
  cefr_level: C2
  category: incident_response
  scenario_context: Doruk, Chief Quantitative Strategist, and Victoria Sterling, Head of Global Market Operations, conduct
    a forensic autopsy into an algorithmic cascade that vaporized sixty billion dollars in market capitalization.
  speakers:
  - id: doruk
    name: Doruk
    role: Chief Quantitative Strategist
    accent: Turkish
  - id: victoria
    name: Victoria Sterling
    role: Head of Global Market Operations
    accent: British
  audio_ref: audio/listening/c2_flash_crash.mp3
  duration_seconds: 61
  transcript_items:
  - index: 1
    speaker_id: victoria
    start_ms: 0
    end_ms: 11962
    text_en: Doruk, yesterday afternoon at fourteen-thirty-two, the index plunged nine percent in four minutes, vaporizing
      sixty billion dollars in market depth before snapping back. We need the forensic mechanics.
    text_tr: Doruk, dün öğleden sonra on dört otuz ikide endeks dört dakikada yüzde dokuz çöktü ve hızla geri sıçramadan önce
      altmış milyar dolarlık piyasa derinliğini buharlaştırdı. Adli mekanizmaya ihtiyacımız var.
  - index: 2
    speaker_id: doruk
    start_ms: 12362
    end_ms: 21254
    text_en: It was an endogenous liquidity cascade triggered by recursive feedback loops between automated market maker delta-hedging
      algorithms and systematic volatility-targeting funds.
    text_tr: Otomatik piyasa yapıcı delta korunma (hedging) algoritmaları ile sistematik volatilite hedefli fonlar arasındaki
      özyinelemeli geri besleme döngülerinin tetiklediği içsel bir likidite çöküşüydü.
  - index: 3
    speaker_id: victoria
    start_ms: 21654
    end_ms: 27967
    text_en: Did exchange circuit-breakers fail to halt execution when market depth evaporated across the central limit order
      books?
    text_tr: Merkezi limitli emir defterlerinde piyasa derinliği buharlaştığında borsa devre kesicileri işlemleri durdurmakta
      başarısız mı oldu?
  - index: 4
    speaker_id: doruk
    start_ms: 28367
    end_ms: 39675
    text_en: Exchange limit-up limit-down bands halted primary index futures, but liquidity fragmented across offshore synthetic
      options platforms, driving index basis spreads to unprecedented extremes.
    text_tr: Borsanın limit-yukarı limit-aşağı bantları birincil endeks vadeli işlemlerini durdurdu ancak likidite denizaşırı
      sentetik opsiyon platformlarına dağıldı ve endeks baz farklarını benzeri görülmemiş uç noktalara taşıdı.
  - index: 5
    speaker_id: victoria
    start_ms: 40075
    end_ms: 47093
    text_en: Why did our automated risk engine fail to pull our quoting quotes from the book before our market-making subsidiary
      sustained acute losses?
    text_tr: Piyasa yapıcı iştirakimiz akut kayıplara uğramadan önce otomatik risk motorumuz neden kotasyonlarımızı emir defterinden
      çekmekte yetersiz kaldı?
  - index: 6
    speaker_id: doruk
    start_ms: 47493
    end_ms: 59944
    text_en: Our internal cancellation message queues experienced microsecond head-of-line blocking behind an avalanche of
      inbound market data feeds. We are decoupling quoting cancel pathways onto dedicated low-latency kernel bypass channels.
    text_tr: Dahili iptal mesajı kuyruklarımız gelen piyasa veri akışlarının çığı ardında mikrosaniye düzeyinde hat başı tıkanıklığı
      (head-of-line blocking) yaşadı. Kotasyon iptal yollarını özel düşük gecikmeli çekirdek baypas kanallarına ayırıyoruz.
  key_vocabulary:
  - word: entropy
    vocab_id: vocab.entropy
    context_note_tr: Piyasa şoklarında emir defteri derinliğinin ve sistemik düzenin kaotik çöküşü.
  - word: latency
    vocab_id: vocab.latency
    context_note_tr: Flaş çöküş anında iptal mesajlarında mikrosaniye düzeyinde hat başı gecikmesi.
  comprehension_questions:
  - id: q_c2_flsh_01
    question_en: How fast and severe was the market index flash crash examined in the forensic autopsy?
    question_tr_hint: Adli incelemede ele alınan piyasa endeksi flaş çöküşü ne kadar hızlı ve şiddetliydi?
    options:
    - The index rose by fifty percent over a twelve-month period
    - The market experienced zero change and remained completely flat
    - The index plunged nine percent in four minutes, wiping out sixty billion dollars in depth
    - The crash lasted forty-eight hours and caused zero financial losses
    correct_answer: The index plunged nine percent in four minutes, wiping out sixty billion dollars in depth
    explanation_en: Victoria reports the index dropped 9% in 4 minutes, wiping out $60 billion in depth.
    explanation_tr: Victoria endeksin 4 dakikada %9 düşerek 60 milyar dolarlık derinliği sildiğini belirtir.
  - id: q_c2_flsh_02
    question_en: What structural dynamic generated the rapid liquidity evaporation?
    question_tr_hint: Hızlı likidite buharlaşmasını hangi yapısal dinamik üretti?
    options:
    - Recursive feedback loops between automated MM delta-hedging algorithms and volatility-targeting funds
    - A physical electrical blackout in every residential neighborhood across Europe
    - A coordinated government decree banning all stock market trading
    - A complete failure of international telecommunication submarine cables
    correct_answer: Recursive feedback loops between automated MM delta-hedging algorithms and volatility-targeting funds
    explanation_en: Doruk points to an endogenous cascade driven by delta-hedging and systematic funds.
    explanation_tr: Doruk delta korunma algoritmaları ve sistematik fonlar arasındaki geri besleme döngüsünü açıklar.
  - id: q_c2_flsh_03
    question_en: What occurred when primary exchange circuit-breakers halted index futures?
    question_tr_hint: Birincil borsa devre kesicileri vadeli işlemleri durdurduğunda ne meydana geldi?
    options:
    - All global computers immediately turned off permanently
    - All financial asset prices returned to exactly one dollar
    - Liquidity fragmented onto offshore synthetic options venues, exploding basis spreads to extremes
    - Investors received physical gold coins delivered by mail
    correct_answer: Liquidity fragmented onto offshore synthetic options venues, exploding basis spreads to extremes
    explanation_en: Doruk explains liquidity fragmented across offshore synthetic venues, driving basis spreads to extremes.
    explanation_tr: Doruk likiditenin denizaşırı platformlara dağılıp baz farklarını patlattığını söyler.
  - id: q_c2_flsh_04
    question_en: Why did the firm's automated risk engine fail to cancel its open quoting orders in time?
    question_tr_hint: Şirketin otomatik risk motoru açık kotasyon emirlerini neden zamanında iptal edemedi?
    options:
    - The risk engine had been accidentally uninstalled by a cleaner
    - Internal cancellation queues suffered microsecond head-of-line blocking behind an avalanche of inbound market data
    - The firm's internet subscription had expired thirty minutes prior
    - All trading passwords were encrypted with a broken key
    correct_answer: Internal cancellation queues suffered microsecond head-of-line blocking behind an avalanche of inbound
      market data
    explanation_en: Doruk reveals internal cancellation queues experienced head-of-line blocking behind market data feeds.
    explanation_tr: Doruk iptal kuyruklarının piyasa verileri arkasında hat başı tıkanıklığı yaşadığını belirtir.
  - id: q_c2_flsh_05
    question_en: What architectural remediation will prevent future cancel message blockages?
    question_tr_hint: Gelecekteki iptal mesajı tıkanıklıklarını hangi mimari iyileştirme önleyecektir?
    options:
    - Canceling all automated algorithmic trading and using manual phone brokers
    - Requiring trading algorithms to wait ten seconds before placing any order
    - Moving all trading servers into private residential apartments
    - Decoupling quote cancellation pathways onto dedicated low-latency kernel bypass channels
    correct_answer: Decoupling quote cancellation pathways onto dedicated low-latency kernel bypass channels
    explanation_en: Doruk confirms decoupling cancel pathways onto dedicated low-latency kernel bypass channels.
    explanation_tr: Doruk iptal kanallarını özel düşük gecikmeli çekirdek baypas hatlarına ayıracaklarını açıklar.
  topic_tags:
  - quantitative-finance
  - market-microstructure
  - flash-crash
  - high-frequency-trading
  - c2-mastery
  related_ids:
  - vocab.entropy
  - vocab.latency
  status: APPROVED
  version: 1
- id: listening.c2.corporate-governance-ethical-dissent
  title: 'Corporate Governance: Whistleblowing Ethics and Safety Compliance Dissent'
  cefr_level: C2
  category: stakeholder_alignment
  scenario_context: Arda, VP of Regulatory Integrity, confronts Richard Thorne, Chief Executive Officer, over suppressing
    critical telemetry warnings regarding safety certification for an autonomous commercial system.
  speakers:
  - id: arda
    name: Arda
    role: VP of Regulatory Integrity
    accent: Turkish
  - id: thorne
    name: Richard Thorne
    role: Chief Executive Officer
    accent: American
  audio_ref: audio/listening/c2_governance_dissent.mp3
  duration_seconds: 69
  transcript_items:
  - index: 1
    speaker_id: thorne
    start_ms: 0
    end_ms: 9013
    text_en: Arda, our public listing and upcoming debt issuance depend on achieving statutory safety certification for our
      autonomous platform by the end of this fiscal quarter.
    text_tr: Arda, halka arzımız ve yaklaşan borç ihracımız bu mali çeyreğin sonuna kadar otonom platformumuz için yasal güvenlik
      sertifikasını almaya bağlıdır.
  - index: 2
    speaker_id: arda
    start_ms: 9413
    end_ms: 21270
    text_en: Richard, our safety engineering teams have documented seven critical disengagement anomalies in edge-case adverse
      weather tests. Omitting those failure rates from our regulatory audit submission constitutes criminal fraud.
    text_tr: Richard, güvenlik mühendisliği ekiplerimiz olumsuz hava koşulu uç durum testlerinde yedi kritik devre dışı kalma
      anomalisi belgeledi. Bu arıza oranlarını düzenleyici denetim sunumumuzdan çıkarmak cezai nitelikte dolandırıcılıktır.
  - index: 3
    speaker_id: thorne
    start_ms: 21670
    end_ms: 32137
    text_en: It is not fraud, Arda; it is standard commercial framing. The engineering anomalies occurred under extreme synthetic
      conditions that fall outside standard operational design domains.
    text_tr: Bu dolandırıcılık değil Arda; standart ticari çerçevelemedir. Mühendislik anomalileri standart operasyonel tasarım
      alanlarının dışına çıkan aşırı sentetik koşullar altında meydana geldi.
  - index: 4
    speaker_id: arda
    start_ms: 32537
    end_ms: 45214
    text_en: Real-world operating environments do not respect pristine synthetic boundaries, Richard. If this system is certified
      and deployed without addressing sensor blind spots, catastrophic accidents and loss of human life are inevitable.
    text_tr: Gerçek dünya operasyonel ortamları kusursuz sentetik sınırlara riayet etmez Richard. Bu sistem sensör kör noktaları
      giderilmeden onaylanır ve yayına alınırsa felaket niteliğinde kazalar ve insan hayatı kaybı kaçınılmazdır.
  - index: 5
    speaker_id: thorne
    start_ms: 45614
    end_ms: 55056
    text_en: If you refuse to sign the regulatory integrity compliance attestation, I will accept your resignation and appoint
      an interim regulatory lead who understands our commercial imperatives.
    text_tr: Düzenleyici dürüstlük uyumluluk onayını imzalamayı reddederseniz istifanızı kabul edeceğim ve ticari zorunluluklarımızı
      anlayan geçici bir düzenleme lideri atayacağım.
  - index: 6
    speaker_id: arda
    start_ms: 55456
    end_ms: 67973
    text_en: I will not resign, Richard. Under federal whistleblower protection statutes, I am transmitting the complete,
      unedited telemetry dossier directly to the board audit committee and statutory regulators this afternoon.
    text_tr: İstifa etmeyeceğim Richard. Federal ihbarcı koruma yasaları kapsamında, eksiksiz ve üzerinde oynanmamış telemetri
      dosyasını bu öğleden sonra doğrudan yönetim kurulu denetim komitesine ve yasal düzenleyicilere iletiyorum.
  key_vocabulary:
  - word: adjudicate
    vocab_id: vocab.adjudicate
    context_note_tr: Federal düzenleyici kurumlar ve mahkemeler nezdinde yasal uyumluluğun hükme bağlanması.
  - word: substantiate
    vocab_id: vocab.substantiate
    context_note_tr: Uç durum güvenlik anomalilerini ampirik telemetri verileriyle somutlaştırmak.
  comprehension_questions:
  - id: q_c2_gov_01
    question_en: What critical conflict exists between Arda and CEO Richard Thorne?
    question_tr_hint: Arda ile CEO Richard Thorne arasında hangi kritik çatışma mevcuttur?
    options:
    - Arda wants to change the corporate office paint colors to bright orange
    - Thorne wants to reduce employee annual leave by two days
    - Arda refuses to suppress severe safety failure telemetry from statutory regulatory audit filings
    - They disagree on which coffee brand to purchase for the company kitchen
    correct_answer: Arda refuses to suppress severe safety failure telemetry from statutory regulatory audit filings
    explanation_en: Arda confronts Thorne over omitting 7 critical disengagement failure rates from regulatory audit submissions.
    explanation_tr: Arda denetim başvurusundan 7 kritik arıza oranının çıkarılmasına karşı çıkar.
  - id: q_c2_gov_02
    question_en: How does Thorne attempt to rationalize omitting the failure rates?
    question_tr_hint: Thorne arıza oranlarını gizlemeyi nasıl rasyonelleştirmeye çalışmaktadır?
    options:
    - He claims they occurred under extreme synthetic conditions outside the standard operational domain
    - He argues that computer numbers do not have any legal meaning
    - He claims the regulatory agency had already approved the documents verbally
    - He says the testing engineers were not real company employees
    correct_answer: He claims they occurred under extreme synthetic conditions outside the standard operational domain
    explanation_en: Thorne frames it as standard commercial framing outside the operational design domain.
    explanation_tr: Thorne bunun standart operasyonel tasarım alanı dışındaki sentetik testler olduğunu iddia eder.
  - id: q_c2_gov_03
    question_en: What grave consequence does Arda predict if the system is certified without fixes?
    question_tr_hint: Sistem düzeltmeler yapılmadan onaylanırsa Arda hangi vahim sonucu öngörmektedir?
    options:
    - A ten percent drop in the company's website visitor count
    - A minor delay in shipping promotional t-shirts to customers
    - The need to upgrade server operating system drivers next year
    - Catastrophic accidents and loss of human life in real-world adverse conditions
    correct_answer: Catastrophic accidents and loss of human life in real-world adverse conditions
    explanation_en: Arda stresses that unaddressed sensor blind spots will inevitably lead to loss of human life.
    explanation_tr: Arda sensör kör noktalarının gerçek dünyada kaçınılmaz olarak can kaybına yol açacağını belirtir.
  - id: q_c2_gov_04
    question_en: What retaliatory threat does Thorne make if Arda refuses to sign the attestation?
    question_tr_hint: Arda onayı imzalamayı reddederse Thorne hangi misilleme tehdidinde bulunmaktadır?
    options:
    - Reducing Arda's salary by fifty dollars next month
    - Accepting his resignation and appointing a compliant interim regulatory lead
    - Moving Arda's office desk closer to the printer corridor
    - Canceling Arda's company credit card for office snacks
    correct_answer: Accepting his resignation and appointing a compliant interim regulatory lead
    explanation_en: Thorne threatens to accept his resignation and appoint an interim lead who complies.
    explanation_tr: Thorne istifasını kabul edip yerine söz dinleyen bir vekil atamakla tehdit eder.
  - id: q_c2_gov_05
    question_en: What legal action does Arda resolve to take under federal whistleblower statutes?
    question_tr_hint: Arda federal ihbarcı yasaları kapsamında hangi yasal adımı atmaya karar vermektedir?
    options:
    - Transmitting the complete, unedited telemetry dossier directly to the board audit committee and regulators
    - Selling the confidential telemetry to foreign newspaper journalists for cash
    - Deleting all telemetry files from company hard drives permanently
    - Remaining completely silent and signing the fraudulent attestation
    correct_answer: Transmitting the complete, unedited telemetry dossier directly to the board audit committee and regulators
    explanation_en: Arda announces he is sending the complete unedited dossier to the board audit committee and regulators.
    explanation_tr: Arda dosyayı doğrudan yönetim kurulu denetim komitesine ve düzenleyicilere ileteceğini açıklar.
  topic_tags:
  - corporate-governance
  - whistleblowing
  - business-ethics
  - regulatory-compliance
  - c2-mastery
  related_ids:
  - vocab.adjudicate
  - vocab.substantiate
  status: APPROVED
  version: 1
- id: listening.c2.space-systems-hardened-telemetry
  title: 'Aerospace Engineering: Triple-Modular Redundancy and Cosmic Radiation Hardening'
  cefr_level: C2
  category: engineering_meeting
  scenario_context: Yasemin, principal avionics architect, and Dr. Gerard Mercer, mission systems director, review deep-space
    radiation hardening and triple-modular voting architectures for an interplanetary probe.
  speakers:
  - id: yasemin
    name: Yasemin
    role: Principal Avionics Architect
    accent: Turkish
  - id: mercer
    name: Dr. Gerard Mercer
    role: Mission Systems Director
    accent: American
  audio_ref: audio/listening/c2_avionics_redundancy.mp3
  duration_seconds: 59
  transcript_items:
  - index: 1
    speaker_id: mercer
    start_ms: 0
    end_ms: 10532
    text_en: Yasemin, our interplanetary orbiter will spend forty-eight months within Jovian radiation belts. Our primary
      flight computer will endure unprecedented galactic cosmic ray flux.
    text_tr: Yasemin, gezegenler arası yörünge aracımız Jüpiter radyasyon kuşaklarında kırk sekiz ay geçirecek. Birincil uçuş
      bilgisayarımız benzeri görülmemiş galaktik kozmik ışın akısına maruz kalacak.
  - index: 2
    speaker_id: yasemin
    start_ms: 10932
    end_ms: 21680
    text_en: Heavy energetic ions induce severe Single-Event Upsets and latch-ups. Commercial silicon would suffer memory
      bit-flips every fourteen seconds in that environment, destroying guidance state.
    text_tr: Ağır enerjik iyonlar şiddetli Tek Olaylı Bozulmalara (SEU) ve kilitlenmelere neden olur. Ticari silikon o ortamda
      her on dört saniyede bir bellek bit çevrilmesi yaşar ve bu da yönlendirme durumunu yok eder.
  - index: 3
    speaker_id: mercer
    start_ms: 22080
    end_ms: 29193
    text_en: What architectural mitigation strategy preserves deterministic mission execution without exceeding our strict
      sixty-watt power envelope?
    text_tr: Altmış vatlık katı güç sınırlarımızı aşmadan deterministik görev yürütmeyi hangi mimari iyileştirme stratejisi
      korur?
  - index: 4
    speaker_id: yasemin
    start_ms: 29593
    end_ms: 40020
    text_en: We are implementing Triple-Modular Redundancy across three radiation-hardened Silicon-on-Insulator processors,
      backed by hardware-level majority voting gates in radiation-tolerant FPGAs.
    text_tr: Radyasyona dayanıklı FPGA'lerdeki donanım düzeyinde çoğunluk oylama kapılarıyla desteklenen, üç adet radyasyonla
      sertleştirilmiş Yalıtkan Üzerinde Silikon (SOI) işlemci genelinde Üçlü Modüler Yedeklilik (TMR) uyguluyoruz.
  - index: 5
    speaker_id: mercer
    start_ms: 40420
    end_ms: 46633
    text_en: How does the voting circuitry handle a scenario where radiation corrupts two of the three compute channels simultaneously?
    text_tr: Oylama devresi radyasyonun üç bilişim kanalından ikisini aynı anda bozduğu bir senaryoyu nasıl ele alır?
  - index: 6
    speaker_id: yasemin
    start_ms: 47033
    end_ms: 58075
    text_en: We supplement TMR with continuous scrub cycles on Magnetoresistive RAM (MRAM), detecting and correcting bit-flips
      in hardware every twenty milliseconds, precluding error accumulation.
    text_tr: TMR'yi Manyetodirençli RAM (MRAM) üzerindeki sürekli temizleme döngüleriyle tamamlıyoruz; donanımdaki bit çevrilmelerini
      her yirmi milisaniyede bir tespit edip düzelterek hata birikimini önlüyoruz.
  key_vocabulary:
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Derin uzay kozmik radyasyon ortamlarında aviyonik sistem dayanıklılığı.
  - word: entropy
    vocab_id: vocab.entropy
    context_note_tr: İyonlaştırıcı radyasyonun bellek hücrelerinde yarattığı bit seviyesindeki termodinamik düzensizlik.
  comprehension_questions:
  - id: q_c2_space_01
    question_en: What severe environmental condition will the interplanetary probe encounter around Jupiter?
    question_tr_hint: Gezegenler arası sonda Jüpiter çevresinde hangi ağır çevre koşuluyla karşılaşacaktır?
    options:
    - Severe acid rain that will dissolve the probe's metal chassis in ten minutes
    - Dense crowds of commercial space tourists blocking satellite communication
    - Atmospheric friction heating the spacecraft to ten thousand degrees
    - Galactic cosmic ray and energetic ion flux causing Single-Event Upsets and latch-ups
    correct_answer: Galactic cosmic ray and energetic ion flux causing Single-Event Upsets and latch-ups
    explanation_en: Yasemin explains energetic ions induce severe Single-Event Upsets and latch-ups in Jovian radiation belts.
    explanation_tr: Yasemin enerjik iyonların Tek Olaylı Bozulmalara (SEU) yol açtığını belirtir.
  - id: q_c2_space_02
    question_en: How often would commercial unhardened silicon suffer memory bit-flips in that environment?
    question_tr_hint: Ticari sertleştirilmemiş silikon o ortamda ne sıklıkla bellek bit çevrilmesine maruz kalırdı?
    options:
    - Once every fifty years
    - Every fourteen seconds
    - Never under any circumstances
    - Only when passing behind the sun
    correct_answer: Every fourteen seconds
    explanation_en: 'Yasemin notes: ''Commercial silicon would suffer memory bit-flips every fourteen seconds in that environment.'''
    explanation_tr: Yasemin ticari çiplerin her 14 saniyede bir bit çevrilmesi yaşayacağını açıklar.
  - id: q_c2_space_03
    question_en: What architectural fault-tolerance technique is implemented across the flight processors?
    question_tr_hint: Uçuş işlemcileri genelinde hangi mimari hata toleransı tekniği uygulanmaktadır?
    options:
    - Shutting down the flight computer for forty-eight months to conserve power
    - Connecting the probe to Earth via a four-million-mile physical wire
    - Triple-Modular Redundancy (TMR) across three processors with hardware majority voting gates
    - Printing computer code onto physical aluminum metal plates
    correct_answer: Triple-Modular Redundancy (TMR) across three processors with hardware majority voting gates
    explanation_en: Yasemin specifies Triple-Modular Redundancy across three Silicon-on-Insulator processors with majority
      voting.
    explanation_tr: Yasemin üç işlemci genelinde çoğunluk oylamalı Üçlü Modüler Yedeklilik uyguladıklarını açıklar.
  - id: q_c2_space_04
    question_en: What power budget envelope must the avionics computer strictly satisfy?
    question_tr_hint: Aviyonik bilgisayarın kesinlikle karşılaması gereken güç bütçesi sınırı nedir?
    options:
    - A strict sixty-watt power envelope
    - Ten megawatts of power
    - Five hundred kilowatts
    - Two gigawatts
    correct_answer: A strict sixty-watt power envelope
    explanation_en: 'Mercer highlights: ''without exceeding our strict sixty-watt power envelope.'''
    explanation_tr: Mercer 60 vatlık güç sınırını aşmamak gerektiğini belirtir.
  - id: q_c2_space_05
    question_en: How does the architecture prevent error accumulation across memory cells?
    question_tr_hint: Mimari bellek hücreleri genelinde hata birikimini nasıl önlemektedir?
    options:
    - Deleting all navigation software whenever an error is detected
    - Asking mission ground control on Earth to reboot the satellite manually
    - Continuous hardware scrub cycles on MRAM correcting bit-flips every twenty milliseconds
    - Replacing memory chips mechanically using external robotic arms
    correct_answer: Continuous hardware scrub cycles on MRAM correcting bit-flips every twenty milliseconds
    explanation_en: Yasemin explains they supplement TMR with continuous MRAM scrub cycles correcting bits every 20ms.
    explanation_tr: Yasemin MRAM üzerinde her 20 milisaniyede bir bit düzelten temizleme döngüleri kullandıklarını belirtir.
  topic_tags:
  - aerospace-engineering
  - fault-tolerance
  - triple-modular-redundancy
  - avionics
  - c2-mastery
  related_ids:
  - vocab.resilience
  - vocab.entropy
  status: APPROVED
  version: 1
- id: listening.c2.biotech-computational-ethics-audit
  title: 'Bioethics & Governance: Dual-Use AI Generative Biology Screening'
  cefr_level: C2
  category: executive_briefing
  scenario_context: Nihal, Chief Scientific Officer, and Judge Alistair Montgomery, chair of bioethics oversight, evaluate
    biosecurity screening protocols and dual-use risks in generative protein design platforms.
  speakers:
  - id: nihal
    name: Nihal
    role: Chief Scientific Officer
    accent: Turkish
  - id: montgomery
    name: Judge Alistair Montgomery
    role: Chair of Bioethics Oversight
    accent: British
  audio_ref: audio/listening/c2_biosecurity_audit.mp3
  duration_seconds: 70
  transcript_items:
  - index: 1
    speaker_id: montgomery
    start_ms: 0
    end_ms: 8937
    text_en: Nihal, our oversight committee has convened to evaluate the dual-use ramifications of our generative molecular
      diffusion model for therapeutic de novo antibody synthesis.
    text_tr: Nihal, gözetim komitemiz terapötik de novo antikor sentezine yönelik üretken moleküler difüzyon modelimizin çift
      kullanımlı (dual-use) sonuçlarını değerlendirmek üzere toplandı.
  - index: 2
    speaker_id: nihal
    start_ms: 9337
    end_ms: 24134
    text_en: We recognize the profound biosecurity gravity, Judge Montgomery. While our platform accelerates novel enzyme
      and oncology antibody discovery, the identical generative diffusion priors could theoretically design lethal toxins
      or immune-evasive pathogens.
    text_tr: Biyogüvenliğin derin ciddiyetinin farkındayız Yargıç Montgomery. Platformumuz yeni enzim ve onkoloji antikoru
      keşfini hızlandırırken, aynı üretici difüzyon öncülleri teorik olarak ölümcül toksinler veya bağışıklıktan kaçan patojenler
      tasarlayabilir.
  - index: 3
    speaker_id: montgomery
    start_ms: 24534
    end_ms: 32096
    text_en: What automated technical guardrails prevent malicious actors from querying the model for regulated biological
      agent sequences or pathogen mimicry?
    text_tr: Kötü niyetli aktörlerin modeli düzenlemeye tabi biyolojik ajan sekansları veya patojen taklitleri için sorgulamasını
      hangi otomatik teknik korkuluklar engelliyor?
  - index: 4
    speaker_id: nihal
    start_ms: 32496
    end_ms: 44828
    text_en: We integrated a multi-tiered cryptographic screening filter. Every generation prompt is parsed against international
      select agent DNA databases using structural homology mapping and receptor-binding affinity classifiers.
    text_tr: Çok katmanlı bir kriptografik tarama filtresi entegre ettik. Her üretim komutu, yapısal homoloji haritalaması
      ve reseptör bağlama afinitesi sınıflandırıcıları kullanılarak uluslararası seçilmiş ajan DNA veritabanlarına karşı ayrıştırılır.
  - index: 5
    speaker_id: montgomery
    start_ms: 45228
    end_ms: 54855
    text_en: Can sophisticated adversaries bypass sequence homology filters through adversarial amino acid substitutions that
      alter sequence composition while preserving functional toxicity?
    text_tr: Gelişmiş düşmanlar fonksiyonel toksisiteyi korurken dizi bileşimini değiştiren düşmanca amino asit ikameleri
      yoluyla dizi homolojisi filtrelerini atlatabilir mi?
  - index: 6
    speaker_id: nihal
    start_ms: 55255
    end_ms: 69571
    text_en: 'That is why we enforce post-computation structural screening: we simulate 3D tertiary protein folds and molecular
      dynamics binding before releasing output coordinates. High-risk toxicity signatures trigger automated red-alerts and
      cryptographic lockouts.'
    text_tr: 'Bu yüzden hesaplama sonrası yapısal tarama uyguluyoruz: Çıktı koordinatlarını yayınlamadan önce 3D üçüncül protein
      kıvrımlarını ve moleküler dinamik bağlanmasını simüle ediyoruz. Yüksek riskli toksisite imzaları otomatik kırmızı alarmları
      ve kriptografik kilitlemeleri tetikler.'
  key_vocabulary:
  - word: adjudicate
    vocab_id: vocab.adjudicate
    context_note_tr: Biyoetik kurullarında çift kullanımlı araştırmaların ve güvenlik risklerinin hükme bağlanması.
  - word: substantiate
    vocab_id: vocab.substantiate
    context_note_tr: Moleküler dinamik ve afinite sınıflandırıcılarıyla toksisite riskini somutlaştırmak.
  comprehension_questions:
  - id: q_c2_bio_01
    question_en: What dual-use capability creates severe biosecurity risks in the generative molecular diffusion platform?
    question_tr_hint: Üretken moleküler difüzyon platformunda hangi çift kullanımlı yetenek ciddi biyogüvenlik riskleri yaratmaktadır?
    options:
    - The model can accidentally order too many test tubes from chemistry supply stores
    - The same models that design cancer antibodies can theoretically generate lethal toxins or immune-evasive pathogens
    - The software requires high-resolution laboratory photography
    - The algorithms can translate medical books into foreign languages without permission
    correct_answer: The same models that design cancer antibodies can theoretically generate lethal toxins or immune-evasive
      pathogens
    explanation_en: Nihal acknowledges that the same generative priors that discover antibodies could design toxins and pathogens.
    explanation_tr: Nihal antikor keşfeden modelin teorik olarak ölümcül toksinler ve patojenler de tasarlayabileceğini belirtir.
  - id: q_c2_bio_02
    question_en: What initial screening check is applied to incoming molecular design prompts?
    question_tr_hint: Gelen moleküler tasarım komutlarına hangi ilk tarama kontrolü uygulanmaktadır?
    options:
    - Checking whether the user typed their email address using capital letters
    - Requiring users to upload a copy of their high school biology diploma
    - Sending prompts to an online public poll for voting approval
    - Parsing prompts against select agent DNA databases using structural homology mapping and affinity classifiers
    correct_answer: Parsing prompts against select agent DNA databases using structural homology mapping and affinity classifiers
    explanation_en: Nihal explains prompts are parsed against select agent databases using homology and binding classifiers.
    explanation_tr: Nihal komutların homoloji haritalaması ve afinite sınıflandırıcılarıyla ajan veritabanlarına karşı tarandığını
      açıklar.
  - id: q_c2_bio_03
    question_en: How could adversaries potentially bypass naive linear sequence filters?
    question_tr_hint: Saldırganlar naif doğrusal dizi filtrelerini potansiyel olarak nasıl atlatabilir?
    options:
    - By typing prompts in reverse alphabetical order
    - By printing prompts on paper and scanning them with a fax machine
    - Through adversarial amino acid substitutions that alter sequence composition while preserving 3D functional toxicity
    - By submitting queries only between midnight and two a.m.
    correct_answer: Through adversarial amino acid substitutions that alter sequence composition while preserving 3D functional
      toxicity
    explanation_en: Montgomery asks if adversaries could use amino acid substitutions to alter sequence while retaining toxicity.
    explanation_tr: Montgomery amino asit ikameleriyle diziyi değiştirirken toksisiteyi koruma riskine dikkat çeker.
  - id: q_c2_bio_04
    question_en: What advanced post-computation technique defeats adversarial sequence disguise?
    question_tr_hint: Düşmanca dizi kılık değiştirmesini hangi gelişmiş hesaplama sonrası teknik engellemektedir?
    options:
    - Simulating 3D tertiary protein folds and molecular dynamics binding before releasing output coordinates
    - Erasing the entire artificial intelligence model from all computers
    - Hiring fifty police officers to guard the laboratory front entrance
    - Turning off the internet access for all medical doctors
    correct_answer: Simulating 3D tertiary protein folds and molecular dynamics binding before releasing output coordinates
    explanation_en: Nihal explains post-computation structural screening simulates 3D tertiary folds and binding dynamics.
    explanation_tr: Nihal hesaplama sonrası 3D protein kıvrımı ve moleküler dinamik simülasyonu yapıldığını açıklar.
  - id: q_c2_bio_05
    question_en: What automated response occurs when high-risk toxicity signatures are detected?
    question_tr_hint: Yüksek riskli toksisite imzaları tespit edildiğinde hangi otomatik yanıt gerçekleşir?
    options:
    - The user is awarded five thousand bonus points on the platform
    - The laboratory computers physically shut down and delete their operating systems
    - A polite apology email is sent to the user with a discount coupon
    - Automated red-alerts and cryptographic lockouts are immediately triggered
    correct_answer: Automated red-alerts and cryptographic lockouts are immediately triggered
    explanation_en: Nihal concludes that high-risk signatures trigger automated red-alerts and cryptographic lockouts.
    explanation_tr: Nihal yüksek riskli imzaların otomatik kırmızı alarmları ve kriptografik kilitlemeyi tetiklediğini açıklar.
  topic_tags:
  - bioethics
  - generative-biology
  - dual-use-biosecurity
  - ai-governance
  - c2-mastery
  related_ids:
  - vocab.adjudicate
  - vocab.substantiate
  status: APPROVED
  version: 1
