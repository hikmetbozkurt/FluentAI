- id: listening.c2.anti-fragile-systems-governance
  title: 'Board Deliberation: Anti-Fragile Governance and Deliberate Redundancy'
  cefr_level: C2
  category: executive_briefing
  scenario_context: Kagan, Chief Risk Officer, and Dr. Evelyn Vance, Chief Systems Architect, deliberate anti-fragile systems
    engineering, operational slack, and chaos engineering in mission-critical banking infrastructure.
  speakers:
  - id: kagan
    name: Kagan
    role: Chief Risk Officer
    accent: Turkish
  - id: evelyn
    name: Dr. Evelyn Vance
    role: Chief Systems Architect
    accent: British
  audio_ref: audio/listening/c2_antifragile_systems.mp3
  duration_seconds: 72
  transcript_items:
  - index: 1
    speaker_id: kagan
    start_ms: 0
    end_ms: 8183
    text_en: Evelyn, our management consulting advisors continue to urge aggressive elimination of duplicate cloud clusters
      to optimize short-term operating margins.
    text_tr: Evelyn, yönetim danışmanı danışmanlarımız kısa vadeli işletme marjlarını optimize etmek için mükerrer bulut kümelerinin
      agresif bir şekilde ortadan kaldırılmasını telkin etmeye devam ediyor.
  - index: 2
    speaker_id: evelyn
    start_ms: 8583
    end_ms: 22704
    text_en: That represents a catastrophic conflation of hyper-efficiency with institutional strength, Kagan. Nassim Taleb's
      anti-fragility framework demonstrates that ruthless elimination of redundancy guarantees systemic fragility under unexpected
      tail-risk events.
    text_tr: Bu aşırı verimliliği kurumsal güçle vahim biçimde karıştırmaktır Kagan. Nassim Taleb'in kırılganlık karşıtlığı
      çerçevesi, yedekliliğin acımasızca yok edilmesinin beklenmedik kuyruk riski olaylarında sistemik kırılganlığı garanti
      ettiğini kanıtlar.
  - index: 3
    speaker_id: kagan
    start_ms: 23104
    end_ms: 31571
    text_en: How do you substantiate the commercial necessity of preserving deliberate operational slack when presenting our
      infrastructure capital expenditures to the board audit committee?
    text_tr: Yönetim kurulu denetim komitesine altyapı sermaye harcamalarımızı sunarken kasti operasyonel esneklik payı bırakmanın
      ticari gerekliliğini nasıl somutlaştırıyorsun?
  - index: 4
    speaker_id: evelyn
    start_ms: 31971
    end_ms: 46543
    text_en: Through empirical telemetry derived from continuous chaos engineering experiments. By deliberately injecting
      adversarial network partitions and power loss simulations, we demonstrate that systems with ten percent operational
      buffer absorb shocks without customer disruption.
    text_tr: Sürekli kaos mühendisliği deneylerinden elde edilen ampirik telemetri yoluyla. Kasti olarak düşmanca ağ bölünmeleri
      ve güç kaybı simülasyonları enjekte ederek, yüzde onluk operasyonel tampona sahip sistemlerin müşteri kesintisi olmadan
      şokları emdiğini kanıtlıyoruz.
  - index: 5
    speaker_id: kagan
    start_ms: 46943
    end_ms: 56395
    text_en: So rather than merely withstanding shocks in a passive robust state, an anti-fragile architecture actively improves
      its evolutionary heuristics when subjected to controlled volatility?
    text_tr: Yani pasif ve sağlam bir durumda yalnızca şoklara dayanmak yerine, kırılganlık karşıtı bir mimari kontrollü oynaklığa
      maruz kaldığında evrimsel sezgilerini aktif olarak geliştiriyor mu?
  - index: 6
    speaker_id: evelyn
    start_ms: 56795
    end_ms: 70977
    text_en: Precisely. Every localized failure surfaces an unmonitored invariant, enabling autonomous self-healing topologies.
      We must treat deliberate redundancy not as an idle cost center, but as an indispensable existential insurance policy.
    text_tr: Kesinlikle. Her yerel arıza izlenmeyen bir değişmezi su yüzüne çıkararak otonom kendi kendini iyileştiren topolojilere
      olanak tanır. Kasti yedekliliği atıl bir maliyet merkezi olarak değil, vazgeçilmez bir varoluşsal sigorta poliçesi olarak
      ele almalıyız.
  key_vocabulary:
  - word: substantiate
    vocab_id: vocab.substantiate
    context_note_tr: Kaos mühendisliği ve telemetri verileriyle operasyonel gereksinimleri somutlaştırmak.
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Kriz anlarında ayakta kalma ve kırılganlık karşıtı sistemik toparlanma.
  comprehension_questions:
  - id: q_c2_ant_01
    question_en: What management consulting recommendation does Dr. Evelyn Vance vigorously repudiate?
    question_tr_hint: Dr. Evelyn Vance yönetim danışmanlarının hangi tavsiyesini şiddetle reddetmektedir?
    options:
    - The aggressive elimination of duplicate cloud clusters to maximize short-term operating margins
    - The proposal to hire additional software testing interns during the summer
    - The mandate to migrate corporate email servers to modern cloud providers
    - The installation of solar panels on the roof of the corporate office
    correct_answer: The aggressive elimination of duplicate cloud clusters to maximize short-term operating margins
    explanation_en: Evelyn warns that aggressively eliminating duplicate clusters confuses hyper-efficiency with resilience.
    explanation_tr: Evelyn kümelerin kaldırılmasının aşırı verimliliği dayanıklılıkla karıştırmak olduğunu söyleyerek karşı
      çıkar.
  - id: q_c2_ant_02
    question_en: According to Nassim Taleb's anti-fragility framework cited by Evelyn, what does ruthless efficiency cause?
    question_tr_hint: Evelyn tarafından atıfta bulunulan Nassim Taleb'in anti-kırılganlık çerçevesine göre acımasız verimlilik
      neye yol açar?
    options:
    - It ensures infinite corporate profitability without any risk of bankruptcy
    - It eliminates the necessity for human software engineers entirely
    - It guarantees acute systemic fragility under unexpected tail-risk disruptions
    - It reduces electrical power consumption to zero across all servers
    correct_answer: It guarantees acute systemic fragility under unexpected tail-risk disruptions
    explanation_en: Evelyn explains that ruthless elimination of redundancy guarantees fragility under tail risks.
    explanation_tr: Evelyn yedekliliği yok etmenin kuyruk riskleri karşısında kırılganlığı kaçınılmaz kıldığını vurgular.
  - id: q_c2_ant_03
    question_en: How does Evelyn substantiate the commercial need for operational slack to the board?
    question_tr_hint: Evelyn operasyonel esneklik payının ticari gerekliliğini yönetim kuruluna nasıl somutlaştırmaktadır?
    options:
    - By quoting ancient classical poetry written in classical Latin
    - Through empirical telemetry generated by continuous chaos engineering experiments and simulated partitions
    - By threatening to resign from the organization immediately
    - By organizing an unannounced general strike among junior developers
    correct_answer: Through empirical telemetry generated by continuous chaos engineering experiments and simulated partitions
    explanation_en: Evelyn relies on empirical telemetry from chaos engineering experiments injecting partitions and power
      loss.
    explanation_tr: Evelyn ağ bölünmeleri ve güç kaybı simüle eden kaos mühendisliği telemetrisine dayanır.
  - id: q_c2_ant_04
    question_en: What distinguishes an 'anti-fragile' architecture from a merely 'robust' system?
    question_tr_hint: '''Anti-kırılgan'' bir mimariyi yalnızca ''sağlam'' bir sistemden ayıran temel fark nedir?'
    options:
    - An anti-fragile system is completely made of physical stone rather than computers
    - An anti-fragile system never runs any software programs or processes
    - An anti-fragile system costs zero dollars to maintain over fifty years
    - An anti-fragile system actively learns and improves its heuristics when exposed to controlled volatility
    correct_answer: An anti-fragile system actively learns and improves its heuristics when exposed to controlled volatility
    explanation_en: Kagan and Evelyn agree that anti-fragile systems actively improve when exposed to controlled volatility.
    explanation_tr: Anti-kırılgan sistemlerin kontrollü oynaklığa maruz kaldığında aktif olarak kendini geliştirdiği belirtilir.
  - id: q_c2_ant_05
    question_en: How does Evelyn characterize deliberate architectural redundancy at the conclusion?
    question_tr_hint: Evelyn sonuç bölümünde kasti mimari yedekliliği nasıl nitelendirmektedir?
    options:
    - As an embarrassing waste of company shareholder capital
    - As a temporary hack that will be deleted next quarter
    - As an indispensable existential insurance policy rather than an idle cost center
    - As an optional luxury reserved only for technology giants
    correct_answer: As an indispensable existential insurance policy rather than an idle cost center
    explanation_en: Evelyn insists on treating redundancy as an indispensable existential insurance policy.
    explanation_tr: Evelyn yedekliliğin vazgeçilmez bir varoluşsal sigorta poliçesi olarak görülmesi gerektiğini ifade eder.
  topic_tags:
  - anti-fragility
  - chaos-engineering
  - systems-architecture
  - risk-governance
  - c2-mastery
  related_ids:
  - vocab.substantiate
  - vocab.resilience
  status: APPROVED
  version: 1
- id: listening.c2.quantum-cryptography-transition
  title: 'Cryptographic Engineering: Post-Quantum Migration and Lattice Schemes'
  cefr_level: C2
  category: engineering_meeting
  scenario_context: Taner, principal cryptographic engineer, and Prof. Alistair Finch, head of quantum security, evaluate
    migrating enterprise banking HSMs from RSA and ECDSA to NIST post-quantum lattice algorithms.
  speakers:
  - id: taner
    name: Taner
    role: Principal Cryptographic Engineer
    accent: Turkish
  - id: finch
    name: Prof. Alistair Finch
    role: Head of Quantum Security
    accent: British
  audio_ref: audio/listening/c2_post_quantum.mp3
  duration_seconds: 77
  transcript_items:
  - index: 1
    speaker_id: finch
    start_ms: 0
    end_ms: 11402
    text_en: Taner, with recent advances in fault-tolerant quantum error correction, Shor's algorithm poses an imminent existential
      threat to all public-key infrastructure based on integer factorization and discrete logarithms.
    text_tr: Taner, hataya dayanıklı kuantum hata düzeltmesindeki son gelişmelerle birlikte Shor algoritması tamsayı çarpanlara
      ayırma ve ayrık logaritmaya dayalı tüm açık anahtar altyapısına doğrudan varoluşsal bir tehdit oluşturuyor.
  - index: 2
    speaker_id: taner
    start_ms: 11802
    end_ms: 26698
    text_en: Indeed Professor Finch. Adversarial state actors are already executing 'harvest-now, decrypt-later' campaigns,
      intercepting and storing encrypted banking telemetry to decrypt retrospectively once cryptanalytically relevant quantum
      computers materialize.
    text_tr: Kesinlikle Profesör Finch. Düşman devlet aktörleri kriptanalitik açıdan yetkin kuantum bilgisayarlar ortaya çıktığında
      geriye dönük deşifre etmek üzere şifreli bankacılık telemetrisini şimdiden toplayıp saklayan 'şimdi topla, sonra çöz'
      operasyonları yürütüyor.
  - index: 3
    speaker_id: finch
    start_ms: 27098
    end_ms: 40105
    text_en: 'NIST has formally standardized post-quantum schemes: ML-KEM for key encapsulation and ML-DSA for digital signatures.
      What performance trade-offs do these lattice constructions impose upon our high-frequency payment gateways?'
    text_tr: 'NIST kuantum sonrası şemaları resmen standartlaştırdı: Anahtar kapsülleme için ML-KEM ve dijital imzalar için
      ML-DSA. Bu kafes (lattice) yapıları yüksek frekanslı ödeme ağ geçitlerimize hangi performans ödünleşimlerini dayatıyor?'
  - index: 4
    speaker_id: taner
    start_ms: 40505
    end_ms: 54702
    text_en: 'Public key and signature payload sizes balloon by orders of magnitude: an ML-KEM-768 encapsulation payload is
      nearly twelve hundred bytes compared to thirty-two bytes for Curve25519, threatening TCP packet fragmentation.'
    text_tr: 'Açık anahtar ve imza veri yükü boyutları kat kat büyüyor: Bir ML-KEM-768 kapsülleme yükü Curve25519''daki otuz
      iki bayta kıyasla yaklaşık bin iki yüz bayttır ve bu da TCP paket parçalanması tehdidi yaratır.'
  - index: 5
    speaker_id: finch
    start_ms: 55102
    end_ms: 62365
    text_en: How do you propose safeguarding transaction throughput while mitigating the unverified mathematical risks of
      nascent lattice-based assumptions?
    text_tr: Henüz yeni olan kafes tabanlı varsayımların doğrulanmamış matematiksel risklerini azaltırken işlem verimini nasıl
      korumayı öneriyorsun?
  - index: 6
    speaker_id: taner
    start_ms: 62765
    end_ms: 76666
    text_en: 'We will implement hybrid post-quantum key exchange: combining classical X25519 ECDH with ML-KEM in a dual-encapsulation
      handshake. Compromising the session requires breaking both mathematical paradigms simultaneously.'
    text_tr: 'Hibrit kuantum sonrası anahtar değişimi uygulayacağız: Klasik X25519 ECDH ile ML-KEM''i çift kapsüllemeli bir
      el sıkışmada birleştireceğiz. Oturumu ele geçirmek her iki matematiksel paradigmayı aynı anda kırmayı gerektirir.'
  key_vocabulary:
  - word: entropy
    vocab_id: vocab.entropy
    context_note_tr: Kuantum sonrası kriptografide anahtar türetimi ve rastgelelik entropisi.
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Kuantum bilgisayarların Shor algoritması saldırılarına karşı kriptografik dayanıklılık.
  comprehension_questions:
  - id: q_c2_qnt_01
    question_en: Why is the 'harvest-now, decrypt-later' espionage campaign considered an urgent threat today?
    question_tr_hint: '''Şimdi topla, sonra çöz'' casusluk faaliyeti neden bugün acil bir tehdit olarak görülmektedir?'
    options:
    - Adversaries are intercepting and storing encrypted data today to decrypt once quantum computers become available
    - Adversaries are physically stealing paper cash from bank automated teller machines
    - Quantum computers have already decoded every password in the world yesterday
    - Computer monitors turn off automatically when exposed to quantum radio waves
    correct_answer: Adversaries are intercepting and storing encrypted data today to decrypt once quantum computers become
      available
    explanation_en: Taner explains that state actors are intercepting encrypted traffic now to decrypt it once quantum hardware
      arrives.
    explanation_tr: Taner aktörlerin şifreli verileri ileride kuantum bilgisayarlarla çözmek üzere şimdiden topladığını belirtir.
  - id: q_c2_qnt_02
    question_en: Which two post-quantum algorithmic schemes were formally standardized by NIST?
    question_tr_hint: NIST tarafından resmen hangi iki kuantum sonrası algoritma şeması standartlaştırıldı?
    options:
    - RSA-1024 and MD5 hashing algorithms
    - Bitcoin Proof of Work and Ethereum Smart Contracts
    - Rot13 cipher and Morse code transmission
    - ML-KEM for key encapsulation and ML-DSA for digital signatures
    correct_answer: ML-KEM for key encapsulation and ML-DSA for digital signatures
    explanation_en: Finch cites ML-KEM for key encapsulation and ML-DSA for digital signatures.
    explanation_tr: Finch ML-KEM ve ML-DSA şemalarını açıklar.
  - id: q_c2_qnt_03
    question_en: What network protocol complication is introduced by lattice-based public key sizes?
    question_tr_hint: Kafes tabanlı açık anahtar boyutları hangi ağ protokolü komplikasyonunu beraberinde getirmektedir?
    options:
    - Network cables physically overheat and melt during transmission
    - Payloads expand to nearly twelve hundred bytes, threatening TCP packet fragmentation and handshake latency
    - Internet service providers charge ten thousand dollars per packet
    - Computer keyboards lose their ability to type capital letters
    correct_answer: Payloads expand to nearly twelve hundred bytes, threatening TCP packet fragmentation and handshake latency
    explanation_en: Taner explains ML-KEM-768 payloads reach 1,200 bytes compared to 32 bytes, risking TCP fragmentation.
    explanation_tr: Taner 1200 bayta çıkan yüklerin TCP paket parçalanması riski yarattığını açıklar.
  - id: q_c2_qnt_04
    question_en: What security design does Taner propose to hedge against unproven mathematical assumptions in lattice cryptography?
    question_tr_hint: Taner kafes kriptografisindeki kanıtlanmamış varsayımlara karşı hangi güvenlik tasarımını önermektedir?
    options:
    - A hybrid key exchange combining classical X25519 ECDH with ML-KEM in dual encapsulation
    - Abandoning all computer encryption and using paper couriers
    - Relying exclusively on forty-character passwords updated daily
    - Encrypting data twice using the exact same RSA key
    correct_answer: A hybrid key exchange combining classical X25519 ECDH with ML-KEM in dual encapsulation
    explanation_en: Taner proposes a hybrid post-quantum key exchange combining X25519 ECDH with ML-KEM.
    explanation_tr: Taner klasik X25519 ile ML-KEM'i birleştiren hibrit bir yaklaşım önerir.
  - id: q_c2_qnt_05
    question_en: What must an adversary accomplish to break the proposed hybrid post-quantum handshake?
    question_tr_hint: Saldırganın önerilen hibrit kuantum sonrası el sıkışmayı kırması için neyi başarması gerekir?
    options:
    - Guess a single four-digit numeric PIN code
    - Find the physical building where the servers are located
    - Wait for thirty seconds after the handshake concludes
    - Break both classical elliptic-curve and post-quantum lattice mathematical paradigms simultaneously
    correct_answer: Break both classical elliptic-curve and post-quantum lattice mathematical paradigms simultaneously
    explanation_en: Taner highlights that breaking the session requires breaking both mathematical paradigms simultaneously.
    explanation_tr: Taner her iki matematiksel paradigmanın aynı anda kırılmasını gerektirdiğini vurgular.
  topic_tags:
  - cryptography
  - quantum-computing
  - post-quantum-cryptography
  - security-architecture
  - c2-mastery
  related_ids:
  - vocab.entropy
  - vocab.resilience
  status: APPROVED
  version: 1
- id: listening.c2.geopolitical-supply-chain-decoupling
  title: 'Geopolitical Strategy: Semiconductor Fab Concentration and Decoupling'
  cefr_level: C2
  category: executive_briefing
  scenario_context: Sibel, Chief Supply Chain Officer, and Marcus Vance, Board Vice Chairman, analyze the geopolitical concentration
    of advanced node semiconductor fabrication and contingency decoupling.
  speakers:
  - id: sibel
    name: Sibel
    role: Chief Supply Chain Officer
    accent: Turkish
  - id: marcus
    name: Marcus Vance
    role: Board Vice Chairman
    accent: American
  audio_ref: audio/listening/c2_semiconductor_decoupling.mp3
  duration_seconds: 68
  transcript_items:
  - index: 1
    speaker_id: marcus
    start_ms: 0
    end_ms: 11422
    text_en: Sibel, the board audit committee is gravely alarmed by our tier-one hardware exposure. Over ninety percent of
      our proprietary AI accelerator silicon is fabricated within a single island maritime corridor.
    text_tr: Sibel, yönetim kurulu denetim komitesi birinci kademe donanım risk maruziyetimizden ciddi şekilde endişeli. Özel
      yapay zeka hızlandırıcı silikonumuzun yüzde doksanından fazlası tek bir ada deniz koridorunda üretiliyor.
  - index: 2
    speaker_id: sibel
    start_ms: 11822
    end_ms: 26608
    text_en: The strategic bottleneck is acute, Marcus. Sub-three-nanometer extreme ultraviolet lithography remains monopolized
      by TSMC in Taiwan, dependent entirely on ASML optical mirrors from the Netherlands and specialized photoresists from
      Japan.
    text_tr: Stratejik darboğaz çok ciddi Marcus. Üç nanometre altı aşırı ultraviyole (EUV) litografi, Tayvan'daki TSMC tekelinde
      kalmaya devam ediyor ve tamamen Hollanda'dan gelen ASML optik aynalarına ve Japonya'dan gelen özel fotorezistlere bağımlı.
  - index: 3
    speaker_id: marcus
    start_ms: 27008
    end_ms: 35441
    text_en: If a regional naval blockade or seismic event suspends shipping for even ninety days, our cloud infrastructure
      expansion grinds to an absolute halt globally.
    text_tr: Bölgesel bir deniz ablukası veya sismik olay sevkiyatı doksan gün bile durdursa küresel çapta bulut altyapı genişlememiz
      tamamen durma noktasına gelir.
  - index: 4
    speaker_id: sibel
    start_ms: 35841
    end_ms: 47364
    text_en: Precisely. Therefore, I propose diversifying our foundry allocation by qualifying Intel Foundry Services in Ohio
      and TSMC's nascent fabrication facilities in Arizona and Dresden.
    text_tr: Kesinlikle. Bu nedenle Ohio'daki Intel Dökümhane Hizmetleri'ni ve TSMC'nin Arizona ile Dresden'deki yeni dökümhane
      tesislerini yetkilendirerek dökümhane tahsisimizi çeşitlendirmeyi öneriyorum.
  - index: 5
    speaker_id: marcus
    start_ms: 47764
    end_ms: 54652
    text_en: What unit cost penalty and yield degradation must we absorb during the initial tape-out and secondary fab qualification
      cycles?
    text_tr: İlk entegre devre tasarımı (tape-out) ve ikincil dökümhane yetkilendirme döngüleri sırasında hangi birim maliyet
      cezasını ve verim kaybını kabullenmek zorundayız?
  - index: 6
    speaker_id: sibel
    start_ms: 55052
    end_ms: 67719
    text_en: Silicon wafer yields in Arizona will initially trail Taiwan by approximately fifteen percent, increasing unit
      production costs by twenty-two percent. However, that premium buys sovereign supply chain continuity.
    text_tr: Arizona'daki silikon gofret verimi başlangıçta Tayvan'ın yaklaşık yüzde on beş gerisinde kalacak ve birim üretim
      maliyetlerini yüzde yirmi iki artıracaktır. Ancak bu prim, egemen tedarik zinciri sürekliliğini satın alır.
  key_vocabulary:
  - word: substantiate
    vocab_id: vocab.substantiate
    context_note_tr: Tedarik zinciri risk analizlerini jeopolitik ampirik verilerle somutlaştırmak.
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Yarı iletken tedarikinde çok kıtalı dökümhane dayanıklılığı.
  comprehension_questions:
  - id: q_c2_semi_01
    question_en: What geographic concentration risk threatens the company's proprietary AI accelerator silicon?
    question_tr_hint: Şirketin özel yapay zeka hızlandırıcı silikonunu hangi coğrafi yoğunlaşma riski tehdit etmektedir?
    options:
    - All microchips are manufactured manually inside local university classrooms
    - Over ninety percent of fabrication is concentrated within a single island maritime corridor
    - Computer microchips are transported exclusively by passenger trains across Antarctica
    - Semiconductor patents are held entirely by private commercial banks
    correct_answer: Over ninety percent of fabrication is concentrated within a single island maritime corridor
    explanation_en: Marcus opens by noting over 90% of proprietary silicon is fabricated in a single island maritime corridor.
    explanation_tr: Marcus silikon üretiminin %90'ından fazlasının tek bir ada deniz koridorunda toplandığını belirtir.
  - id: q_c2_semi_02
    question_en: Which technology company holds an effective monopoly over sub-three-nanometer EUV lithography?
    question_tr_hint: Üç nanometre altı EUV litografisinde hangi teknoloji şirketi fiili bir tekele sahiptir?
    options:
    - A private bicycle manufacturing factory in Switzerland
    - A local software startup based in London
    - TSMC in Taiwan, dependent on ASML optics from the Netherlands
    - A state-owned timber logging company in Canada
    correct_answer: TSMC in Taiwan, dependent on ASML optics from the Netherlands
    explanation_en: Sibel explains sub-3nm lithography is monopolized by TSMC, dependent on ASML and Japanese chemicals.
    explanation_tr: Sibel litografinin Hollandalı ASML ve TSMC tekelinde olduğunu açıklar.
  - id: q_c2_semi_03
    question_en: What global consequence would result if shipping from that region were halted for 90 days?
    question_tr_hint: O bölgeden sevkiyatlar 90 gün durursa küresel ölçekte nasıl bir sonuç doğar?
    options:
    - Global cloud infrastructure expansion would grind to an absolute halt
    - Computer programmers would be legally required to work outdoors
    - All commercial airplanes would cease flying immediately
    - The price of paper banknotes would increase by one thousand percent
    correct_answer: Global cloud infrastructure expansion would grind to an absolute halt
    explanation_en: Marcus warns that a 90-day blockade would bring cloud infrastructure expansion to an absolute halt globally.
    explanation_tr: Marcus 90 günlük ablukanın bulut altyapı genişlemesini tamamen durduracağını belirtir.
  - id: q_c2_semi_04
    question_en: Which secondary semiconductor fabrication facilities does Sibel propose qualifying?
    question_tr_hint: Sibel hangi ikincil yarı iletken dökümhane tesislerini yetkilendirmeyi önermektedir?
    options:
    - Underground copper mines in South America
    - Commercial warehouse facilities in Iceland
    - Intel Foundry Services in Ohio and TSMC facilities in Arizona and Dresden
    - Local electronics repair shops in Paris
    correct_answer: Intel Foundry Services in Ohio and TSMC facilities in Arizona and Dresden
    explanation_en: Sibel proposes qualifying Intel Foundry Services in Ohio and TSMC plants in Arizona and Dresden.
    explanation_tr: Sibel Ohio, Arizona ve Dresden tesislerini yetkilendirmeyi önerir.
  - id: q_c2_semi_05
    question_en: What production cost increase does Sibel anticipate during the initial transition?
    question_tr_hint: Sibel ilk geçiş döneminde hangi üretim maliyeti artışını öngörmektedir?
    options:
    - A ninety-nine percent cost reduction
    - A twenty-two percent increase in unit production costs
    - Zero financial difference in wafer production
    - A five hundred percent price surge
    correct_answer: A twenty-two percent increase in unit production costs
    explanation_en: Sibel confirms unit production costs will increase by 22% due to initial yield trailing by 15%.
    explanation_tr: Sibel verim düşüklüğü nedeniyle birim maliyetin %22 artacağını belirtir.
