- id: listening.b2.mentorship-career-pivot
  title: Navigating a Career Pivot to Data Platform Engineering
  cefr_level: B2
  category: stakeholder_alignment
  scenario_context: Onur consults his staff engineering mentor Elena on transitioning from legacy monolith backend development
    to distributed data infrastructure engineering.
  speakers:
  - id: elena
    name: Elena
    role: Staff Engineering Mentor
    accent: American
  - id: onur
    name: Onur
    role: Senior Backend Developer
    accent: Turkish
  audio_ref: audio/listening/b2_mentorship_career_pivot.mp3
  duration_seconds: 87
  transcript_items:
  - index: 1
    speaker_id: elena
    start_ms: 0
    end_ms: 10188
    text_en: Hi Onur. Thanks for booking this quarterly mentorship session. You mentioned in your prep notes that you are
      contemplating a lateral career transition?
    text_tr: Selam Onur. Bu üç aylık mentorluk seansını ayırttığın için teşekkürler. Hazırlık notlarında yatay bir kariyer
      geçişi düşündüğünü belirtmiştin?
  - index: 2
    speaker_id: onur
    start_ms: 10588
    end_ms: 24645
    text_en: Hi Elena. Yes, after five years building CRUD microservices and REST APIs, I feel my intellectual growth has
      plateaued. I want to transition into distributed data platform engineering.
    text_tr: Selam Elena. Evet, beş yıl CRUD mikroservisleri ve REST API'leri geliştirdikten sonra entelektüel gelişimimin
      duraksadığını hissediyorum. Dağıtık veri platformu mühendisliğine geçmek istiyorum.
  - index: 3
    speaker_id: elena
    start_ms: 25045
    end_ms: 34817
    text_en: That is an exceptionally high-leverage domain. What foundational architectural paradigms do you need to bridge
      between standard backend and streaming systems?
    text_tr: Bu son derece yüksek etkili bir alan. Standart arka uç ile akış sistemleri arasında hangi temel mimari paradigmalar
      arasında köprü kurman gerekiyor?
  - index: 4
    speaker_id: onur
    start_ms: 35217
    end_ms: 46879
    text_en: I understand relational SQL indexing well, but I need deep hands-on mastery of distributed event logs like Apache
      Kafka, partition rebalancing, and stream processing with Flink.
    text_tr: İlişkisel SQL indekslemeyi iyi anlıyorum ancak Apache Kafka gibi dağıtık olay günlükleri, bölüm yeniden dengeleme
      ve Flink ile akış işleme konularında derin pratik uzmanlığa ihtiyacım var.
  - index: 5
    speaker_id: elena
    start_ms: 47279
    end_ms: 58556
    text_en: Exactly. You must shift mental models from synchronous request-response guarantees to asynchronous eventual consistency,
      watermarking, and backpressure handling.
    text_tr: Kesinlikle. Zihinsel modellerini senkronize istek-yanıt güvencelerinden eşzamansız nihai tutarlılık, filigranlama
      (watermarking) ve geri basınç yönetimine kaydırmalısın.
  - index: 6
    speaker_id: onur
    start_ms: 58956
    end_ms: 65214
    text_en: How can I demonstrate credible competency internally without taking a demotion to a junior data role?
    text_tr: Junior bir veri rolüne düşürülmeden şirket içinde güvenilir yetkinliği nasıl sergileyebilirim?
  - index: 7
    speaker_id: elena
    start_ms: 65614
    end_ms: 76977
    text_en: Partner with our data platform squad on their current CDC migration. Volunteer to write the Kafka Connect sink
      connectors that ingest our product databases into Snowflake.
    text_tr: Mevcut CDC geçişlerinde veri platformu ekibimizle ortaklık kur. Ürün veritabanlarımızı Snowflake'e aktaran Kafka
      Connect alıcı bağlayıcılarını yazmaya gönüllü ol.
  - index: 8
    speaker_id: onur
    start_ms: 77377
    end_ms: 86089
    text_en: That gives me production-grade distributed systems experience directly tied to business value. I will reach out
      to their tech lead today.
    text_tr: Bu bana doğrudan ticari değerle bağlantılı üretim kalitesinde dağıtık sistemler deneyimi kazandırır. Bugün onların
      teknik liderine ulaşacağım.
  comprehension_questions:
  - id: q_listening_b2_mentorship-career-pivot_01
    question_en: Why does Onur want to transition away from traditional backend API development?
    question_tr_hint: Onur geleneksel arka uç API geliştirmeden neden ayrılmak istiyor?
    options:
    - After five years of building CRUD APIs, he feels his intellectual growth has plateaued.
    - He lost all interest in writing any computer software code.
    - His manager ordered him to transfer immediately or face dismissal.
    - His company announced bankruptcy and cancelled all salaries.
    correct_answer: After five years of building CRUD APIs, he feels his intellectual growth has plateaued.
    explanation_en: Onur states he feels his intellectual growth has plateaued after five years.
    explanation_tr: Onur beş yılın ardından entelektüel gelişiminin duraksadığını hissettiğini belirtir.
  - id: q_listening_b2_mentorship-career-pivot_02
    question_en: What distributed systems concepts does Elena identify as critical for data engineering?
    question_tr_hint: Elena veri mühendisliği için hangi dağıtık sistem kavramlarını kritik olarak tanımlıyor?
    options:
    - Manual paper filing and analog telephone switchboards.
    - Fixing physical hardware power cords in the server closet.
    - Eventual consistency, watermarking, and backpressure handling in event streams.
    - Basic HTML web formatting and simple spreadsheet entry.
    correct_answer: Eventual consistency, watermarking, and backpressure handling in event streams.
    explanation_en: Elena emphasizes shifting mental models to eventual consistency, watermarking, and backpressure.
    explanation_tr: Elena zihinsel modelleri nihai tutarlılık, filigranlama ve geri basınca kaydırmayı vurgular.
  - id: q_listening_b2_mentorship-career-pivot_03
    question_en: What concern does Onur express regarding his career transition?
    question_tr_hint: Onur kariyer geçişiyle ilgili hangi endişeyi dile getiriyor?
    options:
    - He has forgotten all high school mathematics theorems.
    - He is afraid of having to move to another country.
    - He worries about taking a demotion to a junior role during the transition.
    - He cannot understand English technical documentation.
    correct_answer: He worries about taking a demotion to a junior role during the transition.
    explanation_en: Onur asks how to demonstrate competency without taking a demotion to junior.
    explanation_tr: Onur junior seviyesine düşürülmeden yetkinliği nasıl kanıtlayacağını sorar.
  - id: q_listening_b2_mentorship-career-pivot_04
    question_en: What strategic project does Elena recommend Onur volunteer for?
    question_tr_hint: Elena Onur'un hangi stratejik projeye gönüllü olmasını öneriyor?
    options:
    - Writing Kafka Connect sink connectors for the data squad's CDC migration into Snowflake.
    - Redesigning the company graphic logo in Photoshop.
    - Answering incoming customer billing complaints.
    - Organizing the annual holiday office party catering.
    correct_answer: Writing Kafka Connect sink connectors for the data squad's CDC migration into Snowflake.
    explanation_en: Elena suggests writing Kafka Connect sink connectors for the CDC migration.
    explanation_tr: Elena CDC geçişi için Kafka Connect bağlayıcıları yazmasını önerir.
  - id: q_listening_b2_mentorship-career-pivot_05
    question_en: What next step does Onur decide to take immediately?
    question_tr_hint: Onur hemen hangi sonraki adımı atmaya karar veriyor?
    options:
    - Reach out to the data platform squad's tech lead today.
    - Enroll in a full-time four-year college degree.
    - Submit his formal resignation to human resources.
    - Delete all his existing software code repositories.
    correct_answer: Reach out to the data platform squad's tech lead today.
    explanation_en: Onur says he will reach out to their tech lead today.
    explanation_tr: Onur bugün teknik lidere ulaşacağını söyler.
  topic_tags:
  - relationships
  - career
  - mentorship
  - software-engineering
  - data
- id: listening.b2.postgraduate-thesis-proposal
  title: Defending an Algorithmic Fairness Master's Thesis Proposal
  cefr_level: B2
  category: stakeholder_alignment
  scenario_context: Seda defends her graduate research methodology on auditing demographic disparity in credit scoring machine
    learning models before advisor Professor Wallace.
  speakers:
  - id: prof_wallace
    name: Professor Wallace
    role: Faculty Research Advisor
    accent: British
  - id: seda
    name: Seda
    role: Master's Candidate
    accent: Turkish
  audio_ref: audio/listening/b2_postgraduate_thesis_proposal.mp3
  duration_seconds: 87
  transcript_items:
  - index: 1
    speaker_id: prof_wallace
    start_ms: 0
    end_ms: 11717
    text_en: Welcome Seda. I read your thesis prospectus on algorithmic fairness in automated credit underwriting. You propose
      evaluating demographic parity against equalized odds.
    text_tr: Hoş geldin Seda. Otomatik kredi değerlendirmesinde algoritmik adillik üzerine tez taslağını okudum. Demografik
      eşitliği fırsat eşitliğine (equalized odds) karşı değerlendirmeyi öneriyorsun.
  - index: 2
    speaker_id: seda
    start_ms: 12117
    end_ms: 24449
    text_en: Thank you Professor Wallace. Yes, demographic parity enforces equal acceptance rates across protected demographic
      groups, regardless of underlying credit risk distributions.
    text_tr: Teşekkürler Profesör Wallace. Evet, demografik eşitlik temel kredi riski dağılımlarına bakılmaksızın korunan
      demografik gruplar genelinde eşit kabul oranlarını zorunlu kılar.
  - index: 3
    speaker_id: prof_wallace
    start_ms: 24849
    end_ms: 32602
    text_en: And what mathematical trade-off arises when lenders attempt to enforce demographic parity simultaneously with
      equalized odds?
    text_tr: Peki kredi kuruluşları fırsat eşitliği ile eşzamanlı olarak demografik eşitliği uygulamaya çalıştığında hangi
      matematiksel ödünleşim ortaya çıkar?
  - index: 4
    speaker_id: seda
    start_ms: 33002
    end_ms: 43899
    text_en: Kleinberg's impossibility theorem demonstrates that unless base rates of default are identical across populations,
      these two fairness criteria are mathematically incompatible.
    text_tr: Kleinberg'in imkansızlık teoremi temerrüt taban oranları popülasyonlar genelinde özdeş olmadıkça bu iki adillik
      kriterinin matematiksel olarak uyumsuz olduğunu göstermektedir.
  - index: 5
    speaker_id: prof_wallace
    start_ms: 44299
    end_ms: 55920
    text_en: Precisely formulated. Now, how will your empirical methodology validate model fairness without access to protected
      attributes like race or gender in commercial loan datasets?
    text_tr: Kesinlikle doğru formüle edilmiş. Peki ticari kredi veri setlerinde ırk veya cinsiyet gibi korunan özelliklere
      erişim olmadan ampirik metodolojiniz model adilliğini nasıl doğrulayacak?
  - index: 6
    speaker_id: seda
    start_ms: 56320
    end_ms: 67258
    text_en: I will employ Bayesian Improved First Name Surname Geocoding (BIFSG) to infer probabilistic demographic distributions
      while evaluating proxy variable leakage.
    text_tr: Vekil değişken sızıntısını değerlendirirken olasılıksal demografik dağılımları çıkarmak için Bayesçi Geliştirilmiş
      İsim Soyisim Coğrafi Kodlaması (BIFSG) kullanacağım.
  - index: 7
    speaker_id: prof_wallace
    start_ms: 67658
    end_ms: 77920
    text_en: BIFSG introduces imputation noise. You must incorporate sensitivity analysis to quantify how imputation error
      bounds impact your fairness metrics.
    text_tr: BIFSG atama gürültüsü getirir. Atama hata sınırlarının adillik metriklerinizi nasıl etkilediğini ölçmek için
      duyarlılık analizini dahil etmelisiniz.
  - index: 8
    speaker_id: seda
    start_ms: 78320
    end_ms: 86113
    text_en: I will add a formal Monte Carlo perturbation chapter to measure the variance of fairness metrics under synthetic
      imputation noise.
    text_tr: Sentetik atama gürültüsü altında adillik metriklerinin varyansını ölçmek için resmi bir Monte Carlo pertürbasyon
      bölümü ekleyeceğim.
  comprehension_questions:
  - id: q_listening_b2_postgraduate-thesis-proposal_01
    question_en: What is the core subject of Seda's master's thesis proposal?
    question_tr_hint: Seda'nın yüksek lisans tez önerisinin ana konusu nedir?
    options:
    - Developing biological vaccines against plant agricultural viruses.
    - Designing high-speed quantum processors for space exploration.
    - Algorithmic fairness criteria and demographic disparities in automated credit underwriting.
    - The history of ancient Egyptian architectural excavation techniques.
    correct_answer: Algorithmic fairness criteria and demographic disparities in automated credit underwriting.
    explanation_en: Wallace notes the prospectus is on algorithmic fairness in automated credit underwriting.
    explanation_tr: Wallace taslağın otomatik kredi değerlendirmesinde algoritmik adillik üzerine olduğunu belirtir.
  - id: q_listening_b2_postgraduate-thesis-proposal_02
    question_en: What mathematical principle does Seda cite regarding conflicting fairness definitions?
    question_tr_hint: Seda çelişen adillik tanımlarıyla ilgili hangi matematiksel ilkeye atıfta bulunuyor?
    options:
    - Moore's law of microprocessor transistor scaling.
    - Newton's universal law of gravitation.
    - Pythagoras's geometric triangle theorem.
    - Kleinberg's impossibility theorem proving demographic parity and equalized odds are incompatible.
    correct_answer: Kleinberg's impossibility theorem proving demographic parity and equalized odds are incompatible.
    explanation_en: Seda cites Kleinberg's theorem on incompatible fairness criteria when base rates differ.
    explanation_tr: Seda taban oranlar farklıyken adillik kriterlerinin uyumsuzluğunu gösteren Kleinberg teoremini anar.
  - id: q_listening_b2_postgraduate-thesis-proposal_03
    question_en: How does Seda plan to handle the absence of protected demographic labels in commercial data?
    question_tr_hint: Seda ticari verilerde korunan demografik etiketlerin bulunmamasını nasıl ele almayı planlıyor?
    options:
    - Guessing demographic attributes randomly with coin flips.
    - Calling every credit applicant on their personal telephone.
    - Using Bayesian Improved First Name Surname Geocoding (BIFSG) to infer probabilistic distributions.
    - Ignoring fairness completely and assuming zero discrimination.
    correct_answer: Using Bayesian Improved First Name Surname Geocoding (BIFSG) to infer probabilistic distributions.
    explanation_en: Seda proposes using BIFSG to infer probabilistic demographics.
    explanation_tr: Seda olasılıksal demografiyi çıkarmak için BIFSG kullanmayı önerir.
  - id: q_listening_b2_postgraduate-thesis-proposal_04
    question_en: What methodological limitation does Professor Wallace point out regarding BIFSG?
    question_tr_hint: Profesör Wallace BIFSG hakkında hangi metodolojik sınırlamaya işaret ediyor?
    options:
    - It introduces imputation noise that requires sensitivity analysis.
    - It is completely illegal under international copyright law.
    - It only works on ancient dead languages.
    - It requires supercomputers that do not exist on Earth.
    correct_answer: It introduces imputation noise that requires sensitivity analysis.
    explanation_en: Wallace notes BIFSG introduces imputation noise needing sensitivity analysis.
    explanation_tr: Wallace BIFSG'nin duyarlılık analizi gerektiren atama gürültüsü getirdiğini belirtir.
  - id: q_listening_b2_postgraduate-thesis-proposal_05
    question_en: What analytical technique does Seda promise to add to quantify imputation variance?
    question_tr_hint: Seda atama varyansını ölçmek için hangi analitik tekniği eklemeyi vaat ediyor?
    options:
    - A public survey on social media networks.
    - A manual physical coin-toss tournament.
    - A written essay describing personal opinions.
    - A formal Monte Carlo perturbation analysis.
    correct_answer: A formal Monte Carlo perturbation analysis.
    explanation_en: Seda promises to add a formal Monte Carlo perturbation chapter.
    explanation_tr: Seda resmi bir Monte Carlo pertürbasyon bölümü ekleyeceğini söyler.
  topic_tags:
  - education
  - academic
  - thesis
  - machine-learning
  - ethics
- id: listening.b2.cross-cultural-client-pitch
  title: Debriefing a Japanese Enterprise Client Presentation
  cefr_level: B2
  category: stakeholder_alignment
  scenario_context: Berk and marketing partner Chloe debrief a high-stakes enterprise software sales pitch to a Tokyo conglomerate,
    decoding subtle non-verbal cues and indirect consensus dynamics.
  speakers:
  - id: chloe
    name: Chloe
    role: Global Account Director
    accent: American
  - id: berk
    name: Berk
    role: Technical Sales Engineer
    accent: Turkish
  audio_ref: audio/listening/b2_cross_cultural_client_pitch.mp3
  duration_seconds: 83
  transcript_items:
  - index: 1
    speaker_id: chloe
    start_ms: 0
    end_ms: 10323
    text_en: Great presentation Berk! The live microservice latency benchmark demo was flawless. How do you feel about the
      executive committee's reaction?
    text_tr: Harika sunumdu Berk! Canlı mikroservis gecikme kıyaslama demosu kusursuzdu. Yönetim kurulunun tepkisi hakkında
      ne hissediyorsun?
  - index: 2
    speaker_id: berk
    start_ms: 10723
    end_ms: 22060
    text_en: Thanks Chloe. The technical directors nodded continuously throughout our slides, but when I asked if they were
      ready to sign the pilot agreement, the room fell completely silent.
    text_tr: Teşekkürler Chloe. Teknik direktörler slaytlarımız boyunca sürekli başlarını salladılar ancak pilot sözleşmeyi
      imzalamaya hazır olup olmadıklarını sorduğumda oda tamamen sessizliğe gömüldü.
  - index: 3
    speaker_id: chloe
    start_ms: 22460
    end_ms: 34952
    text_en: Ah, that is a classic cross-cultural misinterpretation. In Japanese business culture, nodding indicates 'I hear
      and understand you', not necessarily 'I agree with your proposal'.
    text_tr: Ah, bu klasik bir kültürlerarası yanlış yorumlama. Japon iş kültüründe baş sallamak 'Sizi duyuyor ve anlıyorum'
      anlamına gelir; ille de 'Teklifinize katılıyorum' demek değildir.
  - index: 4
    speaker_id: berk
    start_ms: 35352
    end_ms: 40791
    text_en: Did I commit a faux pas by asking for an immediate commercial commitment at the end of the meeting?
    text_tr: Toplantının sonunda hemen ticari bir taahhüt isteyerek bir pot mu kırdım?
  - index: 5
    speaker_id: chloe
    start_ms: 41191
    end_ms: 54318
    text_en: A slight one. Enterprise procurement in Japan relies on 'ringisho'—a meticulous bottom-up consensus building
      process. Asking executives to commit publicly on the spot causes loss of face.
    text_tr: Ufak bir pot. Japonya'da kurumsal satın alma 'ringisho'ya—aşağıdan yukarıya titiz bir fikir birliği oluşturma
      sürecine—dayanır. Yöneticilerden anında kamuya açık taahhüt istemek itibar kaybına neden olur.
  - index: 6
    speaker_id: berk
    start_ms: 54718
    end_ms: 63125
    text_en: I understand now. The silence was not rejection; they needed internal space to deliberate without confrontational
      pressure.
    text_tr: Şimdi anlıyorum. Sessizlik ret değildi; çatışmacı baskı olmadan müzakere etmek için iç alana ihtiyaçları vardı.
  - index: 7
    speaker_id: chloe
    start_ms: 63525
    end_ms: 73188
    text_en: Precisely. The managing director did mention that our technical compliance documentation was very thorough. That
      is an encouraging signal.
    text_tr: Kesinlikle. Genel müdür teknik uyumluluk belgelerimizin çok kapsamlı olduğunu belirtti. Bu cesaret verici bir
      sinyal.
  - index: 8
    speaker_id: berk
    start_ms: 73588
    end_ms: 82241
    text_en: I will send a polite, formal follow-up letter expressing gratitude for their hospitality and offering supplementary
      architectural schematics.
    text_tr: Misafirperverlikleri için minnettarlığımı ifade eden ve ek mimari şemalar sunan kibar, resmi bir takip mektubu
      göndereceğim.
  comprehension_questions:
  - id: q_listening_b2_cross-cultural-client-pitch_01
    question_en: How did Berk misinterpret the Japanese executives' nodding during the presentation?
    question_tr_hint: Berk sunum sırasında Japon yöneticilerin baş sallamasını nasıl yanlış yorumladı?
    options:
    - He believed they were rejecting his software completely.
    - He thought they were falling asleep from boredom.
    - He assumed nodding meant agreement, whereas it only signaled attentive listening.
    - He thought they did not speak any English.
    correct_answer: He assumed nodding meant agreement, whereas it only signaled attentive listening.
    explanation_en: Chloe explains nodding signifies comprehension and listening, not agreement.
    explanation_tr: Chloe baş sallamanın onay değil anlama ve dinleme anlamına geldiğini açıklar.
  - id: q_listening_b2_cross-cultural-client-pitch_02
    question_en: Why was asking for an immediate contract signing considered a cultural misstep?
    question_tr_hint: Hemen sözleşme imzalanmasını istemek neden kültürel bir hata olarak görüldü?
    options:
    - Foreign vendors are forbidden from entering corporate office towers.
    - Contracts must always be carved into physical wooden tablets.
    - Signatures are completely illegal under Japanese corporate law.
    - Decisions rely on consensus building (ringisho), and public on-the-spot pressure causes loss of face.
    correct_answer: Decisions rely on consensus building (ringisho), and public on-the-spot pressure causes loss of face.
    explanation_en: Chloe explains decisions require bottom-up consensus and spot pressure causes loss of face.
    explanation_tr: Chloe kararların konsensüs gerektirdiğini ve anlık baskının itibar kaybına yol açtığını açıklar.
  - id: q_listening_b2_cross-cultural-client-pitch_03
    question_en: What positive signal did the managing director communicate before departing?
    question_tr_hint: Genel müdür ayrılmadan önce hangi olumlu sinyali verdi?
    options:
    - Commended the technical compliance documentation as being very thorough.
    - Invited Berk to a private karaoke party that night.
    - Handed over a cashier's check for one million dollars.
    - Offered to buy the entire software startup company.
    correct_answer: Commended the technical compliance documentation as being very thorough.
    explanation_en: Chloe notes the managing director praised the thoroughness of technical documentation.
    explanation_tr: Chloe genel müdürün teknik belgelerin kapsamlılığını övdüğünü belirtir.
  - id: q_listening_b2_cross-cultural-client-pitch_04
    question_en: What did the prolonged silence following Berk's closing question truly indicate?
    question_tr_hint: Berk'in kapanış sorusunun ardından gelen uzun sessizlik gerçekte neyi gösteriyordu?
    options:
    - A need for internal deliberation space without confrontational sales pressure.
    - The translation headphones ran out of battery power.
    - A sudden medical emergency among the executives.
    - An intentional insult intended to end the business relationship.
    correct_answer: A need for internal deliberation space without confrontational sales pressure.
    explanation_en: Berk realizes silence was not rejection, but need for deliberation space.
    explanation_tr: Berk sessizliğin ret değil müzakere alanı ihtiyacı olduğunu fark eder.
  - id: q_listening_b2_cross-cultural-client-pitch_05
    question_en: What appropriate follow-up action does Berk propose?
    question_tr_hint: Berk nasıl uygun bir takip eylemi öneriyor?
    options:
    - Call the managing director's home telephone repeatedly.
    - Send a formal thank-you letter offering supplementary architectural schematics.
    - Threaten to sell the technology to their biggest competitor.
    - Show up unannounced at the client's corporate headquarters tomorrow.
    correct_answer: Send a formal thank-you letter offering supplementary architectural schematics.
    explanation_en: Berk decides to send a polite formal thank-you letter with supplementary schematics.
    explanation_tr: Berk ek şemalar içeren kibar resmi bir teşekkür mektubu göndermeye karar verir.
  topic_tags:
  - communication
  - cross-cultural
  - sales
  - japan
  - negotiation
- id: listening.b2.incident-postmortem-database
  title: Conducting a Blameless Database Outage Postmortem
  cefr_level: B2
  category: incident_response
  scenario_context: Engineering lead Ziya convenes a blameless post-incident review with site reliability engineer Maya to
    analyze a major production database connection pool starvation outage.
  speakers:
  - id: maya
    name: Maya
    role: Site Reliability Engineer
    accent: British
  - id: ziya
    name: Ziya
    role: Principal Engineering Lead
    accent: Turkish
  audio_ref: audio/listening/b2_incident_postmortem_database.mp3
  duration_seconds: 83
  transcript_items:
  - index: 1
    speaker_id: ziya
    start_ms: 0
    end_ms: 10617
    text_en: Welcome everyone to the incident postmortem for yesterday's Severity-1 outage. As always, this is a blameless
      retrospective focused on systemic resilience.
    text_tr: Dünkü 1. Seviye kesintinin olay sonrası incelemesine hoş geldiniz. Her zaman olduğu gibi bu sistemik dayanıklılığa
      odaklanan suçlamasız bir retrospektiftir.
  - index: 2
    speaker_id: maya
    start_ms: 11017
    end_ms: 25734
    text_en: Thanks Ziya. The outage began at fourteen twenty UTC when API gateway latency breached five seconds, followed
      by fifty-four percent of checkout requests failing with HTTP 504 gateway timeouts.
    text_tr: Teşekkürler Ziya. Kesinti UTC ile 14:20'de API ağ geçidi gecikmesinin beş saniyeyi aşmasıyla başladı, ardından
      ödeme isteklerinin yüzde elli dördü HTTP 504 ağ geçidi zaman aşımıyla başarısız oldu.
  - index: 3
    speaker_id: ziya
    start_ms: 26134
    end_ms: 31162
    text_en: What was the immediate mechanical root cause identified during incident mitigation?
    text_tr: Olay giderme sırasında tespit edilen acil mekanik kök neden neydi?
  - index: 4
    speaker_id: maya
    start_ms: 31562
    end_ms: 42080
    text_en: A scheduled background batch job initiated an unindexed analytical query across the order history table, triggering
      a full table scan that held exclusive table locks.
    text_tr: Zamanlanmış bir arka plan toplu işi sipariş geçmişi tablosunda indekslenmemiş bir analitik sorgu başlattı ve
      özel tablo kilitleri tutan tam bir tablo taramasını tetikledi.
  - index: 5
    speaker_id: ziya
    start_ms: 42480
    end_ms: 48623
    text_en: And that locked query starved the connection pool for incoming transactional customer checkout traffic?
    text_tr: Ve kilitlenen bu sorgu gelen işlemsel müşteri ödeme trafiği için bağlantı havuzunu tüketti, öyle mi?
  - index: 6
    speaker_id: maya
    start_ms: 49023
    end_ms: 62920
    text_en: Exactly. All two hundred connection pool threads became blocked waiting for lock acquisition. Because our connection
      acquisition timeout was set to thirty seconds, client requests piled up exponentially.
    text_tr: Kesinlikle. İki yüz bağlantı havuzu iş parçacığının tümü kilit alımını beklerken engellendi. Bağlantı edinme
      zaman aşımımız otuz saniyeye ayarlandığından istemci istekleri katlanarak birikti.
  - index: 7
    speaker_id: ziya
    start_ms: 63320
    end_ms: 67918
    text_en: What architectural safeguards are we implementing to prevent recurrence?
    text_tr: Tekrarlanmasını önlemek için hangi mimari önlemleri uyguluyoruz?
  - index: 8
    speaker_id: maya
    start_ms: 68318
    end_ms: 82220
    text_en: First, analytical reporting queries are strictly segregated to a read-only replica with query cancellation timeouts.
      Second, we are reducing connection acquisition timeouts to two seconds with circuit breaking.
    text_tr: İlk olarak analitik raporlama sorguları sorgu iptal zaman aşımlarına sahip salt okunur bir kopyaya kesin olarak
      ayrılıyor. İkinci olarak devre kesici ile bağlantı edinme zaman aşımlarını iki saniyeye düşürüyoruz.
  comprehension_questions:
  - id: q_listening_b2_incident-postmortem-database_01
    question_en: What is the primary cultural principle of Ziya's incident review meeting?
    question_tr_hint: Ziya'nın olay inceleme toplantısının temel kültürel ilkesi nedir?
    options:
    - Calculating financial deductions from developer paychecks.
    - Reporting software bugs to federal regulatory police.
    - A blameless retrospective focused on systemic resilience rather than individual punishment.
    - Identifying and firing the engineer who wrote the bad query.
    correct_answer: A blameless retrospective focused on systemic resilience rather than individual punishment.
    explanation_en: Ziya begins by stating it is a blameless retrospective focused on systemic resilience.
    explanation_tr: Ziya bunun sistemik dayanıklılığa odaklanan suçlamasız bir retrospektif olduğunu belirtir.
  - id: q_listening_b2_incident-postmortem-database_02
    question_en: What error code did 54 percent of checkout requests return during the outage?
    question_tr_hint: Kesinti sırasında ödeme isteklerinin yüzde 54'ü hangi hata kodunu döndürdü?
    options:
    - HTTP 504 gateway timeouts.
    - HTTP 301 permanent redirect.
    - HTTP 404 page not found.
    - HTTP 200 successful OK.
    correct_answer: HTTP 504 gateway timeouts.
    explanation_en: Maya states 54% of requests failed with HTTP 504 gateway timeouts.
    explanation_tr: Maya isteklerin %54'ünün HTTP 504 zaman aşımıyla başarısız olduğunu belirtir.
  - id: q_listening_b2_incident-postmortem-database_03
    question_en: What triggered the database table lock?
    question_tr_hint: Veritabanı tablo kilidini ne tetikledi?
    options:
    - An unindexed analytical query initiated by a background batch job.
    - An earthquake damaging the primary cloud data center.
    - A computer virus encrypting all server files.
    - A physical power cable severed by a backhoe operator.
    correct_answer: An unindexed analytical query initiated by a background batch job.
    explanation_en: Maya explains an unindexed query triggered a full table scan with exclusive locks.
    explanation_tr: Maya indekslenmemiş bir sorgunun özel kilitli tam tablo taraması başlattığını açıklar.
  - id: q_listening_b2_incident-postmortem-database_04
    question_en: Why did client requests pile up exponentially in the connection pool?
    question_tr_hint: Bağlantı havuzunda istemci istekleri neden katlanarak birikti?
    options:
    - The database was limited to only two simultaneous users.
    - The cloud provider deliberately throttled network traffic.
    - The connection acquisition timeout was set to an excessive thirty seconds.
    - Customers clicked the submit button fifty times per second.
    correct_answer: The connection acquisition timeout was set to an excessive thirty seconds.
    explanation_en: Maya explains the timeout was 30 seconds, causing exponential queue accumulation.
    explanation_tr: Maya zaman aşımının 30 saniye olmasının katlanarak birikmeye yol açtığını açıklar.
  - id: q_listening_b2_incident-postmortem-database_05
    question_en: What two architectural safeguards will Maya implement?
    question_tr_hint: Maya hangi iki mimari önlemi uygulayacak?
    options:
    - Upgrading to an on-premise mainframe computer running magnetic tape.
    - Closing the online checkout store during afternoon peak hours.
    - Segregating analytical queries to read replicas and cutting acquisition timeouts to two seconds with circuit breaking.
    - Deleting all historical customer orders and banning background jobs.
    correct_answer: Segregating analytical queries to read replicas and cutting acquisition timeouts to two seconds with circuit
      breaking.
    explanation_en: Maya specifies read-only replica segregation and 2-second timeouts with circuit breaking.
    explanation_tr: Maya salt okunur kopya ayrımı ve devre kesicili 2 saniyelik zaman aşımı belirtir.
  topic_tags:
  - communication
  - incident-management
  - engineering
  - postmortem
  - databases
- id: listening.b2.performance-appraisal-promotion
  title: Negotiating Promotion to Staff Software Engineer
  cefr_level: B2
  category: negotiation
  scenario_context: Alper reviews his annual engineering impact metrics and strategic organizational leadership with VP of
    Engineering Sandra, making the case for promotion to Staff level.
  speakers:
  - id: sandra
    name: Sandra
    role: VP of Engineering
    accent: American
  - id: alper
    name: Alper
    role: Senior Software Engineer
    accent: Turkish
  audio_ref: audio/listening/b2_performance_appraisal_promotion.mp3
  duration_seconds: 95
  transcript_items:
  - index: 1
    speaker_id: sandra
    start_ms: 0
    end_ms: 10837
    text_en: Good morning Alper. Thank you for submitting your comprehensive self-evaluation packet. You are seeking promotion
      from Senior Engineer to Staff Engineer.
    text_tr: Günaydın Alper. Kapsamlı öz değerlendirme paketini sunduğun için teşekkürler. Kıdemli Mühendislikten Staff Mühendisliğe
      terfi arıyorsun.
  - index: 2
    speaker_id: alper
    start_ms: 11237
    end_ms: 22295
    text_en: Morning Sandra. Yes, over the past twelve months, I have deliberately transitioned from individual feature delivery
      to organizational-level technical leadership.
    text_tr: Günaydın Sandra. Evet, son on iki ayda bireysel özellik teslimatından kasıtlı olarak organizasyon düzeyinde teknik
      liderliğe geçiş yaptım.
  - index: 3
    speaker_id: sandra
    start_ms: 22695
    end_ms: 32622
    text_en: The promotion committee looks for demonstrated scope of influence across multiple squads. Walk me through your
      work on the distributed event streaming architecture.
    text_tr: Terfi komitesi birden fazla ekip genelinde kanıtlanmış etki kapsamı arar. Bana dağıtık olay akışı mimarisi üzerindeki
      çalışmandan bahset.
  - index: 4
    speaker_id: alper
    start_ms: 33022
    end_ms: 44479
    text_en: I authored the RFC for our multi-region event bus, mentored four engineers across three distinct product squads,
      and established our company-wide asynchronous testing standards.
    text_tr: Çok bölgeli olay veri yolumuz için RFC'yi kaleme aldım, üç farklı ürün ekibindeki dört mühendise mentorluk yaptım
      ve şirket çapındaki eşzamansız test standartlarımızı oluşturdum.
  - index: 5
    speaker_id: sandra
    start_ms: 44879
    end_ms: 54412
    text_en: The cross-squad mentorship is evident in your peer 360 reviews. What measurable business outcomes did the streaming
      initiative unlock?
    text_tr: Ekipler arası mentorluk 360 derece akran değerlendirmelerinde açıkça görülüyor. Akış girişimi hangi ölçülebilir
      ticari sonuçların önünü açtı?
  - index: 6
    speaker_id: alper
    start_ms: 54812
    end_ms: 63884
    text_en: It reduced our inter-service message latency by sixty percent and dropped cloud infrastructure operational expenses
      by forty thousand dollars monthly.
    text_tr: Servisler arası mesaj gecikmemizi yüzde altmış azalttı ve bulut altyapısı operasyonel giderlerini ayda kırk bin
      dolar düşürdü.
  - index: 7
    speaker_id: sandra
    start_ms: 64284
    end_ms: 75201
    text_en: Those metrics provide concrete executive justification. A Staff engineer must also demonstrate strategic technical
      roadmapping aligned with executive business goals.
    text_tr: Bu metrikler somut yönetici gerekçelendirmesi sağlıyor. Bir Staff mühendis ayrıca yönetici iş hedefleriyle uyumlu
      stratejik teknik yol haritaları sergilemelidir.
  - index: 8
    speaker_id: alper
    start_ms: 75601
    end_ms: 85348
    text_en: I have drafted a two-year zero-trust data governance roadmap that satisfies our upcoming SOC 2 Type II and GDPR
      audit compliance requirements.
    text_tr: Gelecek SOC 2 Tip II ve GDPR denetim uyumluluk gereksinimlerimizi karşılayan iki yıllık sıfır güven veri yönetişimi
      yol haritası taslağı hazırladım.
  - index: 9
    speaker_id: sandra
    start_ms: 85748
    end_ms: 94146
    text_en: Impressive foresight Alper. I will enthusiastically sponsor your dossier at next week's executive calibration
      committee.
    text_tr: Etkileyici bir öngörü Alper. Gelecek haftaki yönetici kalibrasyon komitesinde dosyanı coşkuyla destekleyeceğim.
  comprehension_questions:
  - id: q_listening_b2_performance-appraisal-promotion_01
    question_en: What promotion level is Alper seeking in his appraisal?
    question_tr_hint: Alper değerlendirmesinde hangi terfi seviyesini arıyor?
    options:
    - From Junior Developer to Mid-level Developer.
    - From Intern to Full-time Associate.
    - From Senior Software Engineer to Staff Software Engineer.
    - From Engineering Manager to Chief Executive Officer.
    correct_answer: From Senior Software Engineer to Staff Software Engineer.
    explanation_en: Sandra notes Alper is seeking promotion from Senior to Staff Engineer.
    explanation_tr: Sandra Alper'in Senior'dan Staff seviyesine terfi aradığını belirtir.
  - id: q_listening_b2_performance-appraisal-promotion_02
    question_en: What primary qualification does the promotion committee demand for Staff level?
    question_tr_hint: Terfi komitesi Staff seviyesi için hangi temel niteliği talep ediyor?
    options:
    - Having a doctorate degree in theoretical mathematics.
    - Demonstrated technical scope of influence across multiple engineering squads.
    - Winning international programming speed contests.
    - Working eighty hours per week in the office.
    correct_answer: Demonstrated technical scope of influence across multiple engineering squads.
    explanation_en: Sandra states the committee looks for demonstrated scope of influence across squads.
    explanation_tr: Sandra komitenin ekipler arası kanıtlanmış etki kapsamı aradığını belirtir.
  - id: q_listening_b2_performance-appraisal-promotion_03
    question_en: What tangible financial saving did Alper's event streaming architecture deliver?
    question_tr_hint: Alper'in olay akışı mimarisi ne kadar somut bir finansal tasarruf sağladı?
    options:
    - Saved five dollars on office printer paper.
    - Generated one billion dollars in immediate stock value.
    - Cut executive salaries by fifty percent.
    - Reduced cloud infrastructure expenses by forty thousand dollars monthly.
    correct_answer: Reduced cloud infrastructure expenses by forty thousand dollars monthly.
    explanation_en: Alper mentions dropping cloud operational expenses by $40,000 monthly.
    explanation_tr: Alper bulut operasyonel giderlerini ayda 40.000 dolar düşürdüğünü belirtir.
  - id: q_listening_b2_performance-appraisal-promotion_04
    question_en: What strategic roadmap has Alper drafted for the coming two years?
    question_tr_hint: Alper önümüzdeki iki yıl için nasıl bir stratejik yol haritası taslağı hazırladı?
    options:
    - A scheme to rewrite the entire codebase in assembly language.
    - A plan to replace all human software developers with AI bots.
    - A two-year zero-trust data governance roadmap for SOC 2 and GDPR compliance.
    - A proposal to close all international sales branch offices.
    correct_answer: A two-year zero-trust data governance roadmap for SOC 2 and GDPR compliance.
    explanation_en: Alper drafted a zero-trust data governance roadmap for SOC 2 and GDPR.
    explanation_tr: Alper SOC 2 ve GDPR için sıfır güven veri yönetişimi yol haritası hazırladığını açıklar.
  - id: q_listening_b2_performance-appraisal-promotion_05
    question_en: What action does Sandra promise to take regarding Alper's promotion?
    question_tr_hint: Sandra Alper'in terfisiyle ilgili hangi adımı atmaya söz veriyor?
    options:
    - Enthusiastically sponsor his dossier at next week's executive calibration committee.
    - Reject his promotion request immediately.
    - Order him to take a three-month unpaid leave of absence.
    - Transfer him to the customer support call center.
    correct_answer: Enthusiastically sponsor his dossier at next week's executive calibration committee.
    explanation_en: Sandra promises to enthusiastically sponsor his dossier at the committee.
    explanation_tr: Sandra gelecek haftaki komitede dosyasını coşkuyla destekleyeceğine söz verir.
  topic_tags:
  - work-career
  - leadership
  - promotion
  - performance-review
  - engineering
- id: listening.b2.sprint-velocity-estimation
  title: Refining User Story Estimation and Technical Debt in Sprint Planning
  cefr_level: B2
  category: engineering_meeting
  scenario_context: Scrum master Gizem guides senior engineers Lucas and Tarik through evaluating technical story points and
    unblocking legacy dependencies during sprint planning.
  speakers:
  - id: gizem
    name: Gizem
    role: Agile Delivery Coach
    accent: Turkish
  - id: lucas
    name: Lucas
    role: Senior Cloud Engineer
    accent: American
  audio_ref: audio/listening/b2_sprint_velocity_estimation.mp3
  duration_seconds: 83
  transcript_items:
  - index: 1
    speaker_id: gizem
    start_ms: 0
    end_ms: 11117
    text_en: 'Alright team, let''s estimate Ticket 512: migrating our user notification pipeline to serverless event triggers.
      What is our consensus estimate?'
    text_tr: 'Pekala ekip, Bilet 512''yi tahmin edelim: kullanıcı bildirim hattımızın sunucusuz olay tetikleyicilerine taşınması.
      Ortak tahminimiz nedir?'
  - index: 2
    speaker_id: lucas
    start_ms: 11517
    end_ms: 22085
    text_en: I pointed this at an eight. While the Lambda function implementation is straightforward, our legacy message queue
      lacks dead-letter queue handling for dropped payloads.
    text_tr: Ben buna sekiz puan verdim. Lambda fonksiyonunun uygulanması basit olsa da eski mesaj kuyruğumuzda bırakılan
      yükler için teslim edilemeyen mesaj (dead-letter) kuyruğu yönetimi yok.
  - index: 3
    speaker_id: gizem
    start_ms: 22485
    end_ms: 33212
    text_en: An eight point story consumes nearly twenty percent of our historical forty-point sprint velocity. Can we decompose
      this story into two vertical deliverable slices?
    text_tr: Sekiz puanlık bir hikaye geçmiş kırk puanlık sprint hızımızın neredeyse yüzde yirmisini tüketiyor. Bu hikayeyi
      dikey olarak teslim edilebilir iki dilime ayırabilir miyiz?
  - index: 4
    speaker_id: lucas
    start_ms: 33612
    end_ms: 47584
    text_en: Yes. Story 512A could establish the dead-letter queue and retry infrastructure, which is a solid three points.
      Story 512B would handle the actual Lambda migration for five points.
    text_tr: Evet. Hikaye 512A sağlam bir üç puan olan dead-letter kuyruğunu ve yeniden deneme altyapısını kurabilir. Hikaye
      512B ise beş puanla asıl Lambda geçişini halleder.
  - index: 5
    speaker_id: gizem
    start_ms: 47984
    end_ms: 59401
    text_en: That makes testing and verification much safer. If 512A finishes mid-sprint, quality assurance can validate error
      retries while you proceed with 512B.
    text_tr: Bu test ve doğrulamayı çok daha güvenli hale getirir. 512A sprint ortasında biterse siz 512B ile ilerlerken kalite
      güvence hata yeniden denemelerini doğrulayabilir.
  - index: 6
    speaker_id: lucas
    start_ms: 59801
    end_ms: 66395
    text_en: Exactly. Furthermore, it prevents an all-or-nothing delivery risk at the sprint boundary.
    text_tr: Kesinlikle. Dahası sprint sınırında ya hep ya hiç teslimat riskini de önler.
  - index: 7
    speaker_id: gizem
    start_ms: 66795
    end_ms: 72698
    text_en: Are there any cross-squad architectural dependencies on the security team for IAM permissions?
    text_tr: IAM izinleri konusunda güvenlik ekibine herhangi bir ekipler arası mimari bağımlılık var mı?
  - index: 8
    speaker_id: lucas
    start_ms: 73098
    end_ms: 82116
    text_en: I already paired with security yesterday. They provisioned the least-privilege IAM roles in staging, so we are
      completely unblocked.
    text_tr: Dün güvenlikle zaten eşleştik. Hazırlık ortamında en az ayrıcalıklı IAM rollerini sağladılar, bu yüzden önümüz
      tamamen açık.
  comprehension_questions:
  - id: q_listening_b2_sprint-velocity-estimation_01
    question_en: Why did Lucas initially estimate Ticket 512 as an 8-point story?
    question_tr_hint: Lucas başlangıçta Bilet 512'yi neden 8 puanlık bir hikaye olarak tahmin etti?
    options:
    - The legacy queue lacked dead-letter queue handling for dropped payloads.
    - The cloud provider was shutting down server operations permanently.
    - No engineers on the team knew how to write Python code.
    - The entire codebase had to be translated into French.
    correct_answer: The legacy queue lacked dead-letter queue handling for dropped payloads.
    explanation_en: Lucas explains the legacy queue lacked dead-letter handling for dropped payloads.
    explanation_tr: Lucas eski kuyrukta kayıp yükler için dead-letter yönetiminin eksik olduğunu açıklar.
  - id: q_listening_b2_sprint-velocity-estimation_02
    question_en: What is the team's historical sprint velocity?
    question_tr_hint: Ekibin geçmiş sprint hızı ne kadardır?
    options:
    - Five hundred points.
    - Ten points.
    - One hundred points.
    - Forty points.
    correct_answer: Forty points.
    explanation_en: Gizem notes an 8-point story consumes 20% of their 40-point sprint velocity.
    explanation_tr: Gizem 8 puanlık hikayenin 40 puanlık hızın %20'sini tükettiğini belirtir.
  - id: q_listening_b2_sprint-velocity-estimation_03
    question_en: How does Lucas propose decomposing the ticket into deliverable slices?
    question_tr_hint: Lucas bileti teslim edilebilir dilimlere nasıl ayırmayı öneriyor?
    options:
    - Canceling the story and ignoring cloud migration completely.
    - Assigning the entire project to an offshore external agency.
    - Story 512A (3 points) for queue retries, and 512B (5 points) for Lambda migration.
    - Postponing all work until next fiscal calendar year.
    correct_answer: Story 512A (3 points) for queue retries, and 512B (5 points) for Lambda migration.
    explanation_en: Lucas divides it into 512A (3 points) and 512B (5 points).
    explanation_tr: Lucas bunu 512A (3 puan) ve 512B (5 puan) olarak ikiye böler.
  - id: q_listening_b2_sprint-velocity-estimation_04
    question_en: What testing advantage does splitting the story provide according to Gizem?
    question_tr_hint: Gizem'e göre hikayeyi bölmek nasıl bir test avantajı sağlar?
    options:
    - It eliminates the need for any software testing whatsoever.
    - It allows developers to skip writing automated unit tests.
    - It forces all testing to be completed by human end users.
    - QA can validate error retries mid-sprint while developers implement the migration.
    correct_answer: QA can validate error retries mid-sprint while developers implement the migration.
    explanation_en: Gizem points out QA can validate retries while coding continues on 512B.
    explanation_tr: Gizem 512B kodlanırken QA'in yeniden denemeleri doğrulayabileceğini belirtir.
  - id: q_listening_b2_sprint-velocity-estimation_05
    question_en: What status does the dependency on the security team hold?
    question_tr_hint: Güvenlik ekibine olan bağımlılığın durumu nedir?
    options:
    - Completely unblocked; least-privilege IAM roles were provisioned in staging.
    - Waiting three weeks for an executive board approval signature.
    - The security lead resigned from the company yesterday.
    - Completely blocked; the security team refused all access.
    correct_answer: Completely unblocked; least-privilege IAM roles were provisioned in staging.
    explanation_en: Lucas confirms security provisioned the roles in staging, so they are unblocked.
    explanation_tr: Lucas güvenliğin rolleri sağladığını ve önlerinin tamamen açık olduğunu doğrular.
  topic_tags:
