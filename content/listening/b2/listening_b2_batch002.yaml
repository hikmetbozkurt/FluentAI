- id: listening.b2.electric-vehicle-charging
  title: Consulting an EV Home Charging Specialist
  cefr_level: B2
  category: product_discovery
  scenario_context: Tarik consults an electrical infrastructure specialist, Fiona, regarding installing a Level 2 smart home
    charger and optimizing time-of-use tariffs.
  speakers:
  - id: fiona
    name: Fiona
    role: Electrical Infrastructure Engineer
    accent: British
  - id: tarik
    name: Tarik
    role: EV Homeowner
    accent: Turkish
  audio_ref: audio/listening/b2_electric_vehicle_charging.mp3
  duration_seconds: 76
  transcript_items:
  - index: 1
    speaker_id: fiona
    start_ms: 0
    end_ms: 9053
    text_en: Good morning Tarik. I reviewed your home panel photos. Your current consumer unit has a sixty-amp main service
      fuse.
    text_tr: Günaydın Tarık. Evinizin elektrik panosu fotoğraflarını inceledim. Mevcut sigorta kutunuzda altmış amperlik bir
      ana servis sigortası var.
  - index: 2
    speaker_id: tarik
    start_ms: 9453
    end_ms: 18471
    text_en: Thanks Fiona. Would that sixty-amp capacity support a standard seven-kilowatt Level 2 charging station alongside
      heat pumps?
    text_tr: Teşekkürler Fiona. Bu altmış amperlik kapasite, ısı pompalarının yanı sıra standart yedi kilovatlık bir Seviye
      2 şarj istasyonunu destekler mi?
  - index: 3
    speaker_id: fiona
    start_ms: 18871
    end_ms: 29904
    text_en: It is borderline during peak winter evenings. If your induction cooktop, heat pump, and EV charger run simultaneously,
      you risk tripping the main breaker.
    text_tr: Kış akşamları zirve saatlerde sınırda kalır. İndüksiyonlu ocağınız, ısı pompanız ve elektrikli araç şarj cihazınız
      aynı anda çalışırsa ana şalteri attırma riskiyle karşılaşırsınız.
  - index: 4
    speaker_id: tarik
    start_ms: 30304
    end_ms: 37361
    text_en: What solutions exist to prevent that without waiting months for the utility to upgrade the street cable to one
      hundred amps?
    text_tr: Elektrik dağıtım şirketinin sokak kablosunu yüz ampere yükseltmesini aylarca beklemeden bunu önleyecek hangi
      çözümler var?
  - index: 5
    speaker_id: fiona
    start_ms: 37761
    end_ms: 48424
    text_en: We can install a smart dynamic load-balancing charger. It clamps a current transformer sensor onto your main
      incoming cable and modulates charging current in real time.
    text_tr: Akıllı dinamik yük dengeleyici bir şarj cihazı kurabiliriz. Ana giriş kablonuza bir akım trafosu sensörü kelepçeler
      ve şarj akımını gerçek zamanlı olarak ayarlar.
  - index: 6
    speaker_id: tarik
    start_ms: 48824
    end_ms: 55467
    text_en: So when domestic household demand spikes, the charger automatically throttles down the charging rate?
    text_tr: Yani evdeki elektrik talebi aniden yükseldiğinde şarj cihazı şarj hızını otomatik olarak kısıyor mu?
  - index: 7
    speaker_id: fiona
    start_ms: 55867
    end_ms: 67874
    text_en: Exactly. Furthermore, it integrates with time-of-use tariffs, scheduling your charging window between midnight
      and five in the morning when kilowatt rates drop by seventy percent.
    text_tr: Kesinlikle. Dahası çok zamanlı tarifelerle entegre olarak şarj pencerenizi kilovatsaat tarifelerinin yüzde yetmiş
      düştüğü gece yarısı ile sabah beş arasına planlar.
  - index: 8
    speaker_id: tarik
    start_ms: 68274
    end_ms: 75692
    text_en: That dynamic load-balancing unit sounds like the ideal compromise. Let's proceed with that quotation.
    text_tr: Bu dinamik yük dengeleme ünitesi ideal bir uzlaşma gibi görünüyor. Bu teklifle ilerleyelim.
  comprehension_questions:
  - id: q_listening_b2_electric-vehicle-charging_01
    question_en: What capacity limitation does Fiona identify on Tarik's home electrical panel?
    question_tr_hint: Fiona Tarık'ın ev elektrik panosunda hangi kapasite kısıtlamasını tespit ediyor?
    options:
    - A sixty-amp main service fuse that could trip during peak household demand.
    - A completely severed copper ground cable.
    - A dangerous high-voltage electrical fire hazard.
    - Missing circuit breakers for all second-floor rooms.
    correct_answer: A sixty-amp main service fuse that could trip during peak household demand.
    explanation_en: Fiona notes his main service fuse is 60 amps, which could trip during simultaneous usage.
    explanation_tr: Fiona ana sigortanın 60 amper olduğunu ve eşzamanlı kullanımda atabileceğini belirtir.
  - id: q_listening_b2_electric-vehicle-charging_02
    question_en: How does a dynamic load-balancing charger resolve the capacity bottleneck?
    question_tr_hint: Dinamik yük dengeleyici bir şarj cihazı kapasite darboğazını nasıl çözer?
    options:
    - It turns off the household refrigerator whenever the car charges.
    - It doubles the street grid voltage automatically.
    - It converts alternating current into solar battery power.
    - It monitors overall household current and throttles charging speed dynamically in real time.
    correct_answer: It monitors overall household current and throttles charging speed dynamically in real time.
    explanation_en: Fiona explains it monitors current and modulates charging in real time.
    explanation_tr: Fiona akımı izleyip şarjı gerçek zamanlı ayarladığını açıklar.
  - id: q_listening_b2_electric-vehicle-charging_03
    question_en: What financial benefit does integration with time-of-use tariffs offer?
    question_tr_hint: Çok zamanlı tarifelerle entegrasyon nasıl bir finansal fayda sağlar?
    options:
    - The power company provides free electricity on weekends.
    - The car manufacturer pays for all household heating bills.
    - It schedules charging between midnight and 5:00 AM when electricity rates drop by seventy percent.
    - Government rebates cover the entire cost of the vehicle.
    correct_answer: It schedules charging between midnight and 5:00 AM when electricity rates drop by seventy percent.
    explanation_en: Fiona notes charging between midnight and 5:00 AM saves 70% on rates.
    explanation_tr: Fiona gece yarısı ile 5:00 arasında şarjın tarifelerde %70 tasarruf sağladığını belirtir.
  - id: q_listening_b2_electric-vehicle-charging_04
    question_en: Why does Tarik prefer dynamic load balancing over upgrading the street cable?
    question_tr_hint: Tarık sokak kablosunu yükseltmek yerine neden dinamik yük dengelemeyi tercih ediyor?
    options:
    - He is planning to move out of the country next week.
    - Upgrading the street cable would require waiting months for the utility company.
    - Dynamic chargers require no electrical permits whatsoever.
    - Street cable upgrades are illegal under local building regulations.
    correct_answer: Upgrading the street cable would require waiting months for the utility company.
    explanation_en: Tarik mentions avoiding waiting months for the utility to upgrade the street cable.
    explanation_tr: Tarık dağıtım şirketinin sokak kablosunu yükseltmesini aylarca beklemekten kaçınmak istediğini belirtir.
  - id: q_listening_b2_electric-vehicle-charging_05
    question_en: What decision does Tarik make at the end of the consultation?
    question_tr_hint: Danışmanlığın sonunda Tarık nasıl bir karar alıyor?
    options:
    - Install a gas-powered generator in his backyard.
    - Rely exclusively on public commercial fast chargers.
    - Cancel the electric vehicle purchase entirely.
    - Proceed with the quotation for the smart dynamic load-balancing charger.
    correct_answer: Proceed with the quotation for the smart dynamic load-balancing charger.
    explanation_en: Tarik approves moving forward with the dynamic load-balancing quotation.
    explanation_tr: Tarık dinamik yük dengeleme teklifiyle ilerlemeyi onaylar.
  topic_tags:
  - daily-life
  - ev
  - sustainability
  - energy
  - technology
- id: listening.b2.high-speed-rail-delay
  title: Managing a Cross-Border Rail Disruption at Munich Central
  cefr_level: B2
  category: incident_response
  scenario_context: Ceyda coordinates alternative connecting travel arrangements with train station controller Hans following
    an overhead catenary wire failure.
  speakers:
  - id: hans
    name: Hans
    role: Station Operations Controller
    accent: German
  - id: ceyda
    name: Ceyda
    role: Business Traveler
    accent: Turkish
  audio_ref: audio/listening/b2_high_speed_rail_delay.mp3
  duration_seconds: 74
  transcript_items:
  - index: 1
    speaker_id: hans
    start_ms: 0
    end_ms: 6538
    text_en: Guten Tag, Deutsche Bahn Customer Information. How may I direct your travel route?
    text_tr: İyi günler, Deutsche Bahn Müşteri Danışma. Seyahat rotanızı nasıl yönlendirebilirim?
  - index: 2
    speaker_id: ceyda
    start_ms: 6938
    end_ms: 16021
    text_en: Hello Hans. The information board just announced that the ICE train to Vienna has been canceled due to overhead
      wire damage near Salzburg.
    text_tr: Merhaba Hans. Bilgi panosu az önce Salzburg yakınlarındaki havai hat hasarı nedeniyle Viyana'ya giden ICE treninin
      iptal edildiğini duyurdu.
  - index: 3
    speaker_id: hans
    start_ms: 16421
    end_ms: 25499
    text_en: Unfortunately yes. High winds brought down a major catenary section, blocking both primary tracks through the
      mountain corridor.
    text_tr: Maalesef evet. Şiddetli rüzgar ana bir kataner hattını devirerek dağ koridorundaki her iki ana rayı da kapattı.
  - index: 4
    speaker_id: ceyda
    start_ms: 25899
    end_ms: 35197
    text_en: I have an essential medical conference keynote presentation in Vienna tomorrow morning at nine o'clock. What
      alternative transit options exist?
    text_tr: Yarın sabah saat dokuzda Viyana'da önemli bir tıp konferansı açılış konuşmam var. Hangi alternatif ulaşım seçenekleri
      mevcut?
  - index: 5
    speaker_id: hans
    start_ms: 35597
    end_ms: 45404
    text_en: We are operating emergency diesel shuttle services around the damaged track section to Linz, connecting with
      an Austrian RailJet directly to Vienna Hauptbahnhof.
    text_tr: Hasarlı hat bölümünün etrafından Linz'e acil dizel servis trenleri çalıştırıyoruz, oradan doğrudan Viyana Hauptbahnhof'a
      giden Avusturya RailJet'e bağlanıyor.
  - index: 6
    speaker_id: ceyda
    start_ms: 45804
    end_ms: 51277
    text_en: How much additional journey time would that detour entail compared to the direct high-speed line?
    text_tr: Bu aktarma doğrudan yüksek hızlı hatta kıyasla ne kadar ek yolculuk süresi gerektirir?
  - index: 7
    speaker_id: hans
    start_ms: 51677
    end_ms: 63174
    text_en: It adds roughly eighty minutes, which puts your estimated arrival in Vienna at eleven thirty tonight. Your existing
      first-class ticket is fully valid on all replacement services.
    text_tr: Yaklaşık seksen dakika ekler, bu da Viyana'ya tahmini varışınızı bu gece saat on bir buçuğa denk getirir. Mevcut
      birinci sınıf biletiniz tüm alternatif seferlerde tamamen geçerlidir.
  - index: 8
    speaker_id: ceyda
    start_ms: 63574
    end_ms: 72767
    text_en: Eleven thirty tonight still gives me adequate rest before my morning presentation. Could you stamp my ticket
      for the Austrian transfer conductor?
    text_tr: Bu gece on bir buçuk yine de sabah sunumumdan önce yeterli dinlenme sağlar. Avusturyalı aktarma kondüktörü için
      biletime kaşe basabilir misiniz?
  comprehension_questions:
  - id: q_listening_b2_high-speed-rail-delay_01
    question_en: What infrastructure failure caused the cancellation of the ICE train to Vienna?
    question_tr_hint: Viyana'ya giden ICE treninin iptal edilmesine hangi altyapı arızası neden oldu?
    options:
    - A national railroad strike by train drivers.
    - Overhead catenary wires were downed by high winds near Salzburg.
    - A widespread computer cyberattack shutting down ticketing.
    - A massive locomotive engine explosion inside Munich station.
    correct_answer: Overhead catenary wires were downed by high winds near Salzburg.
    explanation_en: Hans explains high winds brought down a catenary section blocking tracks.
    explanation_tr: Hans şiddetli rüzgarın kataner hattını devirerek rayları kapattığını açıklar.
  - id: q_listening_b2_high-speed-rail-delay_02
    question_en: Why is Ceyda's arrival in Vienna time-critical?
    question_tr_hint: Ceyda'nın Viyana'ya varışı neden zaman açısından kritik?
    options:
    - She is delivering an essential medical conference keynote presentation tomorrow at 9:00 AM.
    - She must catch an intercontinental cruise ship departure.
    - She is attending a close family wedding ceremony at dawn.
    - She is attending an international soccer championship match.
    correct_answer: She is delivering an essential medical conference keynote presentation tomorrow at 9:00 AM.
    explanation_en: Ceyda explains she has a keynote presentation tomorrow at 9:00 AM.
    explanation_tr: Ceyda yarın sabah saat 9:00'da açılış konuşması olduğunu belirtir.
  - id: q_listening_b2_high-speed-rail-delay_03
    question_en: What replacement transit route does Hans recommend?
    question_tr_hint: Hans hangi alternatif ulaşım güzergahını öneriyor?
    options:
    - A sixteen-hour commercial bus through Switzerland.
    - Booking a domestic flight from Munich airport.
    - An emergency diesel shuttle to Linz connecting with an Austrian RailJet to Vienna.
    - Renting a luxury limousine to drive across the Alps.
    correct_answer: An emergency diesel shuttle to Linz connecting with an Austrian RailJet to Vienna.
    explanation_en: Hans explains emergency diesel shuttles connect to Linz for an Austrian RailJet.
    explanation_tr: Hans acil dizel servislerin Avusturya RailJet için Linz'e bağlandığını açıklar.
  - id: q_listening_b2_high-speed-rail-delay_04
    question_en: How much additional transit time does the detour add?
    question_tr_hint: Bu aktarma yolculuğa yaklaşık ne kadar ek süre ekliyor?
    options:
    - Roughly eighty minutes, arriving at 11:30 PM.
    - Ten additional minutes.
    - Two full calendar days.
    - Over six hours of extra travel.
    correct_answer: Roughly eighty minutes, arriving at 11:30 PM.
    explanation_en: Hans notes it adds roughly 80 minutes, arriving at 11:30 PM.
    explanation_tr: Hans yaklaşık 80 dakika eklediğini ve 23:30'da varacağını belirtir.
  - id: q_listening_b2_high-speed-rail-delay_05
    question_en: What status does Ceyda's ticket hold on the replacement train?
    question_tr_hint: Ceyda'nın biletinin alternatif trendeki durumu nedir?
    options:
    - She is only allowed to board if space permits.
    - Her first-class ticket is fully valid without any additional surcharge.
    - She must purchase an entirely new ticket in cash.
    - Her ticket is downgraded to economy freight seating.
    correct_answer: Her first-class ticket is fully valid without any additional surcharge.
    explanation_en: Hans confirms her existing first-class ticket is fully valid.
    explanation_tr: Hans mevcut birinci sınıf biletinin tamamen geçerli olduğunu onaylar.
  topic_tags:
  - travel
  - rail
  - transit
  - incident-management
  - germany
- id: listening.b2.preventative-health-screening
  title: Interpreting Cardiovascular and Metabolic Biomarkers
  cefr_level: B2
  category: product_discovery
  scenario_context: Kemal discusses his comprehensive annual executive health screening panel, focusing on lipid profiles
    and glycemic control, with physician Dr. Aris.
  speakers:
  - id: dr_aris
    name: Dr. Aris
    role: Preventative Health Physician
    accent: American
  - id: kemal
    name: Kemal
    role: Executive Patient
    accent: Turkish
  audio_ref: audio/listening/b2_preventative_health_screening.mp3
  duration_seconds: 83
  transcript_items:
  - index: 1
    speaker_id: dr_aris
    start_ms: 0
    end_ms: 7563
    text_en: Good afternoon Kemal. I have compiled the results from your comprehensive annual executive metabolic screening.
    text_tr: Tünaydın Kemal. Kapsamlı yıllık yönetici metabolik taramanızın sonuçlarını derledim.
  - index: 2
    speaker_id: kemal
    start_ms: 7963
    end_ms: 17356
    text_en: Thank you Dr. Aris. I have been feeling slightly fatigued during late afternoons. How do my lipid and glucose
      panels look?
    text_tr: Teşekkürler Dr. Aris. Öğleden sonraları kendimi biraz yorgun hissediyordum. Lipid ve glukoz panellerim nasıl
      görünüyor?
  - index: 3
    speaker_id: dr_aris
    start_ms: 17756
    end_ms: 28509
    text_en: Your fasting glucose is ninety-two, which is normal, but your hemoglobin A1c is five point seven percent, placing
      you right at the pre-diabetes threshold.
    text_tr: Açlık glukozunuz doksan iki, bu normal; ancak hemoglobin A1c'niz yüzde beş nokta yedi, bu da sizi tam prediyabet
      eşiğine koyuyor.
  - index: 4
    speaker_id: kemal
    start_ms: 28909
    end_ms: 36412
    text_en: That is concerning given my family history of Type 2 diabetes. What about my cardiovascular markers?
    text_tr: Ailemdeki Tip 2 diyabet geçmişi göz önüne alındığında bu endişe verici. Peki ya kardiyovasküler belirteçlerim?
  - index: 5
    speaker_id: dr_aris
    start_ms: 36812
    end_ms: 47119
    text_en: Your total cholesterol is slightly elevated, but the more critical marker is ApoB and small dense LDL particles,
      which indicate atherogenic particle burden.
    text_tr: Toplam kolesterolünüz biraz yüksek ancak daha kritik belirteç aterojenik parçacık yükünü gösteren ApoB ve küçük
      yoğun LDL parçacıklarıdır.
  - index: 6
    speaker_id: kemal
    start_ms: 47519
    end_ms: 54822
    text_en: Do I need to initiate prescription statin therapy immediately, or can we attempt lifestyle intervention first?
    text_tr: Hemen reçeteli statin tedavisine başlamam gerekiyor mu, yoksa önce yaşam tarzı müdahalesini deneyebilir miyiz?
  - index: 7
    speaker_id: dr_aris
    start_ms: 55222
    end_ms: 64620
    text_en: Given that your coronary artery calcium score is zero, we have a safe twelve-week window to trial structured
      nutritional and exercise interventions.
    text_tr: Koroner arter kalsiyum skorunuzun sıfır olduğu göz önüne alındığında yapılandırılmış beslenme ve egzersiz müdahalelerini
      denemek için güvenli bir on iki haftalık penceremiz var.
  - index: 8
    speaker_id: kemal
    start_ms: 65020
    end_ms: 71023
    text_en: What specific dietary modifications will yield the most impactful glycemic improvements?
    text_tr: Hangi özel beslenme değişiklikleri en etkili glisemik iyileşmeleri sağlayacaktır?
  - index: 9
    speaker_id: dr_aris
    start_ms: 71423
    end_ms: 81971
    text_en: Eliminate refined carbohydrates and ultra-processed seed oils, increase viscous soluble fiber to forty grams
      daily, and incorporate zone-two aerobic training.
    text_tr: Rafine karbonhidratları ve aşırı işlenmiş tohum yağlarını hayatınızdan çıkarın, yapışkan çözünür lifi günde kırk
      grama çıkarın ve bölge-iki aerobik antrenmanını dahil edin.
  comprehension_questions:
  - id: q_listening_b2_preventative-health-screening_01
    question_en: What specific biomarker indicates that Kemal is at the pre-diabetes threshold?
    question_tr_hint: Kemal'in prediyabet eşiğinde olduğunu hangi belirteç göstermektedir?
    options:
    - Extremely low platelet density.
    - Hemoglobin A1c of 5.7 percent.
    - A fasting blood glucose of four hundred.
    - An elevated white blood cell count.
    correct_answer: Hemoglobin A1c of 5.7 percent.
    explanation_en: Dr. Aris explains HbA1c is 5.7%, which sits right at the pre-diabetes threshold.
    explanation_tr: Dr. Aris HbA1c'nin %5.7 olup prediyabet eşiğinde olduğunu açıklar.
  - id: q_listening_b2_preventative-health-screening_02
    question_en: Why does Dr. Aris emphasize ApoB and small dense LDL over total cholesterol?
    question_tr_hint: Dr. Aris toplam kolesterol yerine neden ApoB ve küçük yoğun LDL'yi vurguluyor?
    options:
    - They reflect atherogenic particle burden and cardiovascular plaque risk more accurately.
    - Small dense LDL indicates liver hepatitis.
    - Total cholesterol tests are universally illegal.
    - ApoB measures bone density in the legs.
    correct_answer: They reflect atherogenic particle burden and cardiovascular plaque risk more accurately.
    explanation_en: Dr. Aris notes ApoB indicates true atherogenic particle burden.
    explanation_tr: Dr. Aris ApoB'nin gerçek aterojenik parçacık yükünü yansıttığını belirtir.
  - id: q_listening_b2_preventative-health-screening_03
    question_en: What crucial diagnostic test allows Kemal to trial lifestyle changes before medication?
    question_tr_hint: Hangi kritik tanı testi Kemal'in ilaçtan önce yaşam tarzı değişikliklerini denemesine izin veriyor?
    options:
    - A coronary artery calcium (CAC) score of zero.
    - A normal resting electrocardiogram.
    - Normal psychological cognitive screening.
    - A negative chest X-ray examination.
    correct_answer: A coronary artery calcium (CAC) score of zero.
    explanation_en: Dr. Aris points out his coronary artery calcium score is zero, allowing a 12-week trial.
    explanation_tr: Dr. Aris koroner kalsiyum skorunun sıfır olduğunu ve 12 haftalık denemeye izin verdiğini belirtir.
  - id: q_listening_b2_preventative-health-screening_04
    question_en: How long is the structured trial window before re-testing biomarkers?
    question_tr_hint: Belirteçlerin yeniden test edilmesinden önceki yapılandırılmış deneme penceresi ne kadardır?
    options:
    - Twelve weeks.
    - Five years.
    - One single week.
    - Two days.
    correct_answer: Twelve weeks.
    explanation_en: Dr. Aris specifies a safe twelve-week window.
    explanation_tr: Dr. Aris güvenli bir 12 haftalık pencere belirtir.
  - id: q_listening_b2_preventative-health-screening_05
    question_en: What dietary and training changes does Dr. Aris recommend?
    question_tr_hint: Dr. Aris hangi beslenme ve antrenman değişikliklerini öneriyor?
    options:
    - Consuming sugar before every meal and sleeping four hours.
    - Eliminating refined carbohydrates, increasing soluble fiber to 40g, and zone-two aerobic training.
    - Drinking three liters of fruit juice every morning.
    - Eating only red meat and avoiding all physical activity.
    correct_answer: Eliminating refined carbohydrates, increasing soluble fiber to 40g, and zone-two aerobic training.
    explanation_en: Dr. Aris recommends cutting refined carbs, hitting 40g fiber, and zone-two training.
    explanation_tr: Dr. Aris rafine karbonhidratları kesmeyi, 40 gr lif almayı ve bölge-2 antrenmanı önerir.
  topic_tags:
  - health-lifestyle
  - medicine
  - biomarkers
  - preventative-care
- id: listening.b2.artisanal-coffee-sourcing
  title: Negotiating Specialty Coffee Direct-Trade Contracts
  cefr_level: B2
  category: negotiation
  scenario_context: Nilay negotiates direct-trade specialty green coffee procurement contracts with Colombian cooperative
    export director Mateo, balancing bean quality against shipping volatility.
  speakers:
  - id: mateo
    name: Mateo
    role: Coffee Cooperative Export Director
    accent: Spanish
  - id: nilay
    name: Nilay
    role: Specialty Coffee Roaster
    accent: Turkish
  audio_ref: audio/listening/b2_artisanal_coffee_sourcing.mp3
  duration_seconds: 88
  transcript_items:
  - index: 1
    speaker_id: mateo
    start_ms: 0
    end_ms: 10463
    text_en: Welcome to our cupping lab Nilay. You evaluated the anaerobic natural Geisha and washed Pink Bourbon lots this
      morning. What were your cupping scores?
    text_tr: Tadım laboratuvarımıza hoş geldin Nilay. Bu sabah anaerobik doğal Geisha ve yıkanmış Pink Bourbon partilerini
      değerlendirdin. Tadım puanların neydi?
  - index: 2
    speaker_id: nilay
    start_ms: 10863
    end_ms: 22230
    text_en: Hello Mateo. The Pink Bourbon lot was extraordinary. It scored an eighty-eight point five with distinct jasmine
      florals, peach acidity, and clean silky mouthfeel.
    text_tr: Merhaba Mateo. Pink Bourbon partisi olağanüstüydü. Belirgin yasemin çiçekleri, şeftali asiditesi ve temiz ipeksi
      gövdesiyle seksen sekiz nokta beş puan aldı.
  - index: 3
    speaker_id: mateo
    start_ms: 22630
    end_ms: 35092
    text_en: That lot represents our highest-altitude harvest at nineteen hundred meters in Huila. Because yield was limited
      by unseasonal rains, we are pricing it at five dollars twenty per pound FOB.
    text_tr: Bu parti Huila'da bin dokuz yüz metredeki en yüksek irtifa hasadımızı temsil ediyor. Mevsim dışı yağmurlar verimi
      sınırladığından, FOB bazında libresi beş dolar yirmi sent olarak fiyatlandırıyoruz.
  - index: 4
    speaker_id: nilay
    start_ms: 35492
    end_ms: 46055
    text_en: Five twenty is above our projected benchmark for specialty microlots. Could we negotiate four dollars eighty
      if we contract for sixty GrainPro bags upfront?
    text_tr: Beş yirmi, özel mikro partiler için öngördüğümüz kıstasın üzerinde. Peşin olarak altmış GrainPro çuval için sözleşme
      yaparsak dört dolar seksene anlaşabilir miyiz?
  - index: 5
    speaker_id: mateo
    start_ms: 46455
    end_ms: 56117
    text_en: If you commit to sixty bags, we can meet at five dollars flat, provided you cover the temperature-controlled
      reefer container surcharge for maritime shipping.
    text_tr: Altmış çuvala taahhüt verirseniz, deniz taşımacılığı için sıcaklık kontrollü reefer konteyner ek ücretini karşılamanız
      şartıyla düz beş dolarda buluşabiliriz.
  - index: 6
    speaker_id: nilay
    start_ms: 56517
    end_ms: 65250
    text_en: Preserving moisture stability through maritime transit is essential to prevent baggy cardboard defects. I accept
      the reefer surcharge.
    text_tr: Deniz taşımacılığı sırasında nem dengesini korumak çuval karton kusurlarını önlemek için esastır. Reefer ek ücretini
      kabul ediyorum.
  - index: 7
    speaker_id: mateo
    start_ms: 65650
    end_ms: 76672
    text_en: Excellent. We will mill the parchment and pack the green coffee in multi-layer hermetic GrainPro bags next week.
      Export documentation will follow shortly.
    text_tr: Mükemmel. Parşömeni ayıklayıp yeşil kahveyi gelecek hafta çok katmanlı hermetik GrainPro torbalarda paketleyeceğiz.
      İhracat belgeleri kısa süre içinde takip edecek.
  - index: 8
    speaker_id: nilay
    start_ms: 77072
    end_ms: 87190
    text_en: Thank you Mateo. This direct partnership guarantees exceptional quality for our roastery while ensuring sustainable
      premium prices for your farming community.
    text_tr: Teşekkürler Mateo. Bu doğrudan ortaklık kavurmahanemiz için olağanüstü kaliteyi garanti ederken çiftçi topluluğunuz
      için sürdürülebilir prim fiyatları sağlar.
  comprehension_questions:
  - id: q_listening_b2_artisanal-coffee-sourcing_01
    question_en: What sensory cupping score did Nilay award the washed Pink Bourbon lot?
    question_tr_hint: Nilay yıkanmış Pink Bourbon partisine kaç tadım puanı verdi?
    options:
