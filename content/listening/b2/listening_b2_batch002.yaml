- id: listening.b2.venture-capital-due-diligence
  title: Defending SaaS Unit Economics During Series A Due Diligence
  cefr_level: B2
  category: negotiation
  scenario_context: Startup founder Kaan defends customer acquisition costs, net revenue retention, and gross margins during
    a rigorous due diligence interview with venture partner Victoria.
  speakers:
  - id: victoria
    name: Victoria
    role: Venture Capital Partner
    accent: American
  - id: kaan
    name: Kaan
    role: FinTech Startup Founder
    accent: Turkish
  audio_ref: audio/listening/b2_venture_capital_due_diligence.mp3
  duration_seconds: 88
  transcript_items:
  - index: 1
    speaker_id: victoria
    start_ms: 0
    end_ms: 10877
    text_en: Welcome Kaan. Our investment committee was impressed by your four-million-dollar ARR traction. Today I want to
      dissect your underlying unit economics.
    text_tr: Hoş geldin Kaan. Yatırım komitemiz dört milyon dolarlık yıllık yinelenen gelir (ARR) ivmenizden etkilendi. Bugün
      altta yatan birim ekonominizi derinlemesine incelemek istiyorum.
  - index: 2
    speaker_id: kaan
    start_ms: 11277
    end_ms: 19745
    text_en: Glad to dive into the data, Victoria. Our metrics reflect capital-efficient, organic enterprise expansion.
    text_tr: Verilere dalmaktan memnuniyet duyarım Victoria. Metriklerimiz sermaye açısından verimli, organik kurumsal genişlemeyi
      yansıtıyor.
  - index: 3
    speaker_id: victoria
    start_ms: 20145
    end_ms: 30188
    text_en: Looking at your customer acquisition cost, your blended CAC is twelve thousand dollars, but your CAC payback
      period has widened from eight to fourteen months.
    text_tr: Müşteri edinme maliyetinize (CAC) baktığımızda harmanlanmış CAC'niz on iki bin dolar ancak CAC geri ödeme süreniz
      sekiz aydan on dört aya çıktı.
  - index: 4
    speaker_id: kaan
    start_ms: 30588
    end_ms: 42570
    text_en: That lengthening payback is intentional. We shifted from selling twenty-seat mid-market tiers to closing six-figure
      enterprise contracts, which entail ninety-day procurement cycles.
    text_tr: Bu uzayan geri ödeme süresi kasıtlıdır. Yirmi koltuklu orta ölçekli kademeleri satmaktan doksan günlük satın
      alma döngüleri içeren altı haneli kurumsal sözleşmeleri kapatmaya geçtik.
  - index: 5
    speaker_id: victoria
    start_ms: 42970
    end_ms: 54212
    text_en: Enterprise moves increase enterprise value, provided Net Revenue Retention (NRR) holds up. What is your cohort
      expansion rate after month twelve?
    text_tr: Net Gelir Elde Tutma (NRR) oranı korunduğu sürece kurumsal hamleler işletme değerini artırır. On ikinci aydan
      sonra kohort genişleme oranınız nedir?
  - index: 6
    speaker_id: kaan
    start_ms: 54612
    end_ms: 66149
    text_en: Our enterprise cohort NRR is one hundred and twenty-eight percent. Customers who adopt our core billing API consistently
      expand into our automated treasury management module.
    text_tr: Kurumsal kohort NRR'miz yüzde yüz yirmi sekizdir. Temel faturalandırma API'mizi benimseyen müşteriler sürekli
      olarak otomatik hazine yönetimi modülümüze genişliyor.
  - index: 7
    speaker_id: victoria
    start_ms: 66549
    end_ms: 76272
    text_en: A 128 percent NRR is upper-quartile for B2B infrastructure software. What are your current subscription gross
      margins?
    text_tr: Yüzde 128'lik bir NRR B2B altyapı yazılımları için üst çeyrektir. Mevcut abonelik brüt karlarınız nedir?
  - index: 8
    speaker_id: kaan
    start_ms: 76672
    end_ms: 87504
    text_en: We operate at seventy-six percent gross margin. As we optimize our multi-tenant cloud database partitioning next
      quarter, we project reaching eighty-one percent.
    text_tr: Yüzde yetmiş altı brüt kar marjı ile çalışıyoruz. Gelecek çeyrekte çok kiracılı bulut veritabanı bölümlememizi
      optimize ettikçe yüzde seksen bire ulaşmayı öngörüyoruz.
  comprehension_questions:
  - id: q_listening_b2_venture-capital-due-diligence_01
    question_en: What annual recurring revenue (ARR) traction did Kaan's company achieve?
    question_tr_hint: Kaan'ın şirketi ne kadar yıllık yinelenen gelir (ARR) ivmesi elde etti?
    options:
    - One hundred thousand dollars.
    - Fifty million dollars.
    - Ten billion dollars.
    - Four million dollars.
    correct_answer: Four million dollars.
    explanation_en: Victoria mentions their 4-million-dollar ARR traction.
    explanation_tr: Victoria 4 milyon dolarlık ARR ivmelerinden bahseder.
  - id: q_listening_b2_venture-capital-due-diligence_02
    question_en: Why did the customer acquisition cost (CAC) payback period widen to 14 months?
    question_tr_hint: Müşteri edinme maliyeti (CAC) geri ödeme süresi neden 14 aya uzadı?
    options:
    - Customers refused to pay their monthly invoices on time.
    - The company shifted from mid-market sales to enterprise contracts with longer sales cycles.
    - The company lost fifty percent of its sales team.
    - The marketing budget was wasted on expensive television commercials.
    correct_answer: The company shifted from mid-market sales to enterprise contracts with longer sales cycles.
    explanation_en: Kaan explains the shift to 6-figure enterprise contracts with 90-day cycles.
    explanation_tr: Kaan 90 günlük döngüleri olan 6 haneli kurumsal sözleşmelere geçişi açıklar.
  - id: q_listening_b2_venture-capital-due-diligence_03
    question_en: What is the company's enterprise Net Revenue Retention (NRR) rate?
    question_tr_hint: Şirketin kurumsal Net Gelir Elde Tutma (NRR) oranı nedir?
    options:
    - 50 percent.
    - 200 percent.
    - 90 percent.
    - 128 percent.
    correct_answer: 128 percent.
    explanation_en: Kaan confirms their enterprise cohort NRR is 128%.
    explanation_tr: Kaan kurumsal kohort NRR'sinin %128 olduğunu onaylar.
  - id: q_listening_b2_venture-capital-due-diligence_04
    question_en: How do existing customers expand their annual spend according to Kaan?
    question_tr_hint: Kaan'a göre mevcut müşteriler yıllık harcamalarını nasıl genişletiyor?
    options:
    - They purchase physical corporate merchandise and T-shirts.
    - They hire the startup's engineers as private consultants.
    - They are forced to pay penalty fees for late renewals.
    - They expand from the core billing API into the automated treasury module.
    correct_answer: They expand from the core billing API into the automated treasury module.
    explanation_en: Kaan explains customers expand from the billing API into treasury management.
    explanation_tr: Kaan müşterilerin faturalandırmadan hazine yönetimine genişlediğini açıklar.
  - id: q_listening_b2_venture-capital-due-diligence_05
    question_en: What target gross margin does Kaan project following database optimization?
    question_tr_hint: Kaan veritabanı optimizasyonunun ardından hangi hedef brüt kar marjını öngörüyor?
    options:
    - 100 percent.
    - 81 percent.
    - 76 percent.
    - 50 percent.
    correct_answer: 81 percent.
    explanation_en: Kaan projects reaching 81% from their current 76%.
    explanation_tr: Kaan mevcut %76'dan %81'e ulaşmayı öngördüklerini belirtir.
  topic_tags:
  - business
  - venture-capital
  - finance
  - saas
  - startups
- id: listening.b2.cloud-architecture-refactor
  title: Architecting a Container Migration from Monolithic EC2
  cefr_level: B2
  category: engineering_meeting
  scenario_context: Lead cloud architect Melis and systems engineer Patrick evaluate refactoring their monolithic virtual
    machine infrastructure into containerized microservices managed on AWS EKS.
  speakers:
  - id: patrick
    name: Patrick
    role: Senior Cloud Infrastructure Engineer
    accent: British
  - id: melis
    name: Melis
    role: Lead Cloud Architect
    accent: Turkish
  audio_ref: audio/listening/b2_cloud_architecture_refactor.mp3
  duration_seconds: 83
  transcript_items:
  - index: 1
    speaker_id: patrick
    start_ms: 0
    end_ms: 12073
    text_en: Morning Melis. I completed our load test analysis on the legacy monolithic EC2 cluster. During peak traffic,
      autoscaling spin-up takes nearly eight minutes.
    text_tr: Günaydın Melis. Eski monolitik EC2 kümesindeki yük testi analizimizi tamamladım. Yoğun trafik sırasında otomatik
      ölçeklendirme başlatması neredeyse sekiz dakika sürüyor.
  - index: 2
    speaker_id: melis
    start_ms: 12473
    end_ms: 22405
    text_en: Eight minutes is unacceptable when sudden marketing traffic surges occur. Cold-booting complete virtual machines
      with full operating systems is far too heavy.
    text_tr: Ani pazarlama trafiği dalgalanmaları meydana geldiğinde sekiz dakika kabul edilemez. Eksiksiz işletim sistemlerine
      sahip sanal makineleri sıfırdan başlatmak çok ağır.
  - index: 3
    speaker_id: patrick
    start_ms: 22805
    end_ms: 34888
    text_en: Exactly. If we decompose the monolith into lightweight Docker containers orchestrated on managed Kubernetes via
      EKS, container pod spin-up takes less than twelve seconds.
    text_tr: Kesinlikle. Monoliti EKS üzerinden yönetilen Kubernetes üzerinde düzenlenen hafif Docker konteynerlerine ayırırsak,
      konteyner pod başlatması on iki saniyeden az sürer.
  - index: 4
    speaker_id: melis
    start_ms: 35288
    end_ms: 45400
    text_en: That represents a massive improvement in autoscaling elasticity. How do we manage stateful database connections
      across hundreds of ephemeral container pods?
    text_tr: Bu otomatik ölçeklendirme esnekliğinde muazzam bir gelişmeyi temsil eder. Yüzlerce geçici konteyner pod'u genelinde
      durum bilgisi içeren veritabanı bağlantılarını nasıl yöneteceğiz?
  - index: 5
    speaker_id: patrick
    start_ms: 45800
    end_ms: 58837
    text_en: We should deploy AWS RDS Proxy between the Kubernetes pods and our Aurora database clusters. It pools and multiplexes
      connections, insulating the database from connection storms.
    text_tr: Kubernetes pod'ları ile Aurora veritabanı kümelerimiz arasına AWS RDS Proxy konuşlandırmalıyız. Bağlantıları
      havuzlayıp çoğullayarak veritabanını bağlantı fırtınalarından yalıtır.
  - index: 6
    speaker_id: melis
    start_ms: 59237
    end_ms: 63890
    text_en: What about observability across distributed container microservices?
    text_tr: Peki dağıtık konteyner mikroservisleri genelinde gözlemlenebilirlik ne olacak?
  - index: 7
    speaker_id: patrick
    start_ms: 64290
    end_ms: 74212
    text_en: We will instrument OpenTelemetry sidecar containers to collect distributed traces, exporting telemetry data into
      our central Grafana and Jaeger dashboards.
    text_tr: Dağıtık izleri toplamak için OpenTelemetry sidecar konteynerleri entegre edeceğiz ve telemetri verilerini merkezi
      Grafana ve Jaeger panolarımıza aktaracağız.
  - index: 8
    speaker_id: melis
    start_ms: 74612
    end_ms: 82560
    text_en: Outstanding architecture Patrick. Let's draft the migration proof-of-concept for the authentication service first.
    text_tr: Mükemmel mimari Patrick. Önce kimlik doğrulama servisi için geçiş konsept kanıtı taslağını hazırlayalım.
  comprehension_questions:
  - id: q_listening_b2_cloud-architecture-refactor_01
    question_en: What primary operational limitation does the monolithic EC2 cluster exhibit?
    question_tr_hint: Monolitik EC2 kümesi hangi temel operasyonel sınırlamayı sergiliyor?
    options:
    - The cloud provider charges one million dollars per hour.
    - The servers can only run on weekends.
    - The virtual machines lose all stored data every midnight.
    - Autoscaling cold-booting of virtual machines takes nearly eight minutes during traffic surges.
    correct_answer: Autoscaling cold-booting of virtual machines takes nearly eight minutes during traffic surges.
    explanation_en: Patrick explains autoscaling spin-up takes nearly eight minutes during peak traffic.
    explanation_tr: Patrick yoğun trafikte otomatik ölçeklendirmenin neredeyse 8 dakika sürdüğünü açıklar.
  - id: q_listening_b2_cloud-architecture-refactor_02
    question_en: How fast does container pod spin-up take on managed Kubernetes (EKS)?
    question_tr_hint: Yönetilen Kubernetes (EKS) üzerinde konteyner pod başlatması ne kadar sürer?
    options:
    - Three business days.
    - Five minutes.
    - One full hour.
    - Less than twelve seconds.
    correct_answer: Less than twelve seconds.
    explanation_en: Patrick notes container pod spin-up takes less than twelve seconds.
    explanation_tr: Patrick konteyner başlatmasının 12 saniyeden az sürdüğünü belirtir.
  - id: q_listening_b2_cloud-architecture-refactor_03
    question_en: What component will insulate the database from connection exhaustion storms?
    question_tr_hint: Veritabanını bağlantı tükenmesi fırtınalarından hangi bileşen yalıtacak?
    options:
    - Disconnecting the database from the internet completely.
    - AWS RDS Proxy pooling and multiplexing database connections.
    - A physical analog circuit breaker in the server rack.
    - A manual spreadsheet updated by on-call engineers.
    correct_answer: AWS RDS Proxy pooling and multiplexing database connections.
    explanation_en: Patrick suggests deploying AWS RDS Proxy to pool and multiplex connections.
    explanation_tr: Patrick bağlantıları havuzlamak için AWS RDS Proxy konuşlandırmayı önerir.
  - id: q_listening_b2_cloud-architecture-refactor_04
    question_en: How will the engineering team achieve distributed observability across microservices?
    question_tr_hint: Mühendislik ekibi mikroservisler genelinde dağıtık gözlemlenebilirliği nasıl sağlayacak?
    options:
    - OpenTelemetry sidecar containers exporting traces to Grafana and Jaeger.
    - Asking users to report software bugs via postal letters.
    - Printing log files onto physical rolls of thermal paper.
    - Recording audio voice memos during code deployment.
    correct_answer: OpenTelemetry sidecar containers exporting traces to Grafana and Jaeger.
    explanation_en: Patrick explains OpenTelemetry sidecars will export traces to Grafana and Jaeger.
    explanation_tr: Patrick OpenTelemetry'nin izleri Grafana ve Jaeger'a aktaracağını açıklar.
  - id: q_listening_b2_cloud-architecture-refactor_05
    question_en: Which service will serve as the initial migration proof-of-concept?
    question_tr_hint: Hangi servis ilk geçiş konsept kanıtı olarak hizmet edecek?
    options:
    - The corporate marketing public blog.
    - The entire global payment billing gateway.
    - The authentication service.
    - The legacy database storage engine.
    correct_answer: The authentication service.
    explanation_en: Melis suggests drafting the proof-of-concept for the authentication service first.
    explanation_tr: Melis konsept kanıtı için önce kimlik doğrulama servisini taslaklaştırmayı önerir.
  topic_tags:
  - technology
  - cloud
  - kubernetes
  - aws
  - architecture
