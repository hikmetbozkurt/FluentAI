  - id: q_b2_sla_02
    question_en: What monetary value does the twenty percent contractual credit represent?
    question_tr_hint: Yüzde yirmilik sözleşme kredisi hangi parasal değere denk gelmektedir?
    options:
    - Five thousand dollars
    - One million dollars
    - Two hundred dollars
    - Forty-five thousand dollars
    correct_answer: Forty-five thousand dollars
    explanation_en: 'Kerem states: ''twenty percent credit, which amounts to forty-five thousand dollars.'''
    explanation_tr: Kerem kredinin kırk beş bin dolara karşılık geldiğini belirtir.
  - id: q_b2_sla_03
    question_en: What external technical issue was identified in the vendor root-cause analysis?
    question_tr_hint: Tedarikçi kök neden analizinde hangi harici teknik sorun tespit edildi?
    options:
    - An earthquake that swallowed the primary data center
    - A third-party upstream fiber optic cable cut
