- id: listening.b2.feature-flag-rollout-strategy
  title: 'Release Engineering: Canary Deployments and Feature Flags'
  cefr_level: B2
  category: product_discovery
  scenario_context: Pinar, a senior product manager, and Julian, release QA lead, design a progressive feature flag rollout
    for the new biometric authentication update.
  speakers:
  - id: pinar
    name: Pinar
    role: Senior Product Manager
    accent: Turkish
  - id: julian
    name: Julian
    role: Release QA Lead
    accent: American
  audio_ref: audio/listening/b2_canary_rollout.mp3
  duration_seconds: 56
  transcript_items:
  - index: 1
    speaker_id: pinar
    start_ms: 0
    end_ms: 9023
    text_en: Julian, the engineering team has wrapped up development on biometric face-unlock. How should we orchestrate the
      production rollout?
    text_tr: Julian, mühendislik ekibi biyometrik yüz tanıma kilidi üzerindeki geliştirmeyi tamamladı. Canlıya çıkış sürecini
      (rollout) nasıl yönetmeliyiz?
  - index: 2
    speaker_id: julian
    start_ms: 9423
    end_ms: 18865
    text_en: Given that biometric authentication touches sensitive user security, we should enforce a phased canary rollout
      using our LaunchDarkly feature flags.
    text_tr: Biyometrik kimlik doğrulamanın hassas kullanıcı güvenliğine temas ettiği göz önüne alındığında, LaunchDarkly
      özellik bayraklarımızı (feature flags) kullanarak aşamalı bir 'canary' dağıtımı uygulamalıyız.
  - index: 3
    speaker_id: pinar
    start_ms: 19265
    end_ms: 26029
    text_en: Agreed. What user cohort percentages and monitoring duration do you recommend for each phase?
    text_tr: Anlaştık. Her aşama için hangi kullanıcı kohort yüzdelerini ve izleme süresini öneriyorsun?
  - index: 4
    speaker_id: julian
    start_ms: 26429
    end_ms: 37486
    text_en: Let's enable it for five percent of internal dogfooding users on day one, expand to twenty percent of production
      users on day three, and reach one hundred percent by day seven.
    text_tr: Birinci gün şirket içi test kullanıcılarının yüzde beşine açalım, üçüncü gün canlı kullanıcıların yüzde yirmisine
      genişletelim ve yedinci günde yüzde yüze ulaşalım.
  - index: 5
    speaker_id: pinar
    start_ms: 37886
    end_ms: 44859
    text_en: What automated telemetry safeguards will trigger an immediate emergency rollback if an unexpected regression
      occurs?
    text_tr: Beklenmedik bir gerileme (regression) meydana gelirse acil bir geri almayı (rollback) hangi otomatik telemetri
      korumaları tetikleyecek?
  - index: 6
    speaker_id: julian
    start_ms: 45259
    end_ms: 55566
    text_en: If authentication error rates exceed zero point five percent or crash-free session rates drop below ninety-nine
      point nine, the flag automatically disables itself.
    text_tr: Kimlik doğrulama hata oranları yüzde sıfır virgül beşi aşarsa veya çökmesiz oturum oranları yüzde doksan dokuz
      virgül dokuzun altına düşerse bayrak kendini otomatik olarak devre dışı bırakır.
  key_vocabulary:
  - word: verify
    vocab_id: vocab.verify
    context_note_tr: Yeni özelliklerin kademeli dağıtımla telemetri üzerinden doğrulanması.
  - word: vulnerability
    vocab_id: vocab.vulnerability
    context_note_tr: Hassas kimlik doğrulama akışlarındaki olası zafiyetlerin önlenmesi.
  comprehension_questions:
  - id: q_b2_roll_01
    question_en: What new feature is being prepared for progressive rollout?
    question_tr_hint: Kademeli canlıya çıkış için hangi yeni özellik hazırlanmaktadır?
    options:
    - An automated cryptocurrency investment trading bot
    - Biometric face-unlock authentication
    - A physical drone delivery tracking radar
    - An audio podcast streaming service
    correct_answer: Biometric face-unlock authentication
    explanation_en: 'Pinar introduces the topic: ''engineering team has wrapped up development on biometric face-unlock.'''
    explanation_tr: Pinar ekibin biyometrik yüz tanıma kilidi geliştirmesini tamamladığını söyler.
  - id: q_b2_roll_02
    question_en: Which feature flag management platform is being utilized for the rollout?
    question_tr_hint: Dağıtım için hangi özellik bayrağı (feature flag) yönetim platformu kullanılmaktadır?
    options:
    - WordPress Admin
    - Google Sheets
    - LaunchDarkly
    - Microsoft Paint
    correct_answer: LaunchDarkly
    explanation_en: 'Julian refers to: ''phased canary rollout using our LaunchDarkly feature flags.'''
    explanation_tr: Julian LaunchDarkly özellik bayraklarını kullanacaklarını belirtir.
  - id: q_b2_roll_03
    question_en: What rollout cohort percentage is scheduled for day three of production release?
    question_tr_hint: Canlı yayının üçüncü günü için hangi dağıtım kohort yüzdesi planlanmıştır?
    options:
    - Twenty percent of production users
    - Five percent
    - Fifty percent
    - One hundred percent
    correct_answer: Twenty percent of production users
    explanation_en: 'Julian outlines: ''expand to twenty percent of production users on day three.'''
    explanation_tr: Julian 3. gün canlı kullanıcıların %20'sine genişletileceğini ifade eder.
  - id: q_b2_roll_04
    question_en: What error rate threshold triggers an automated feature flag kill-switch?
    question_tr_hint: Otomatik özellik bayrağı acil kapatma düğmesini (kill-switch) hangi hata oranı eşiği tetikler?
    options:
    - If error rates exceed twenty-five percent
    - If any single user complains on social media
    - If authentication error rates exceed zero point five percent
    - If the battery life of smartphones drops by ten percent
    correct_answer: If authentication error rates exceed zero point five percent
    explanation_en: 'Julian specifies: ''If authentication error rates exceed zero point five percent... flag automatically
      disables itself.'''
    explanation_tr: Julian hata oranının %0,5'i aşması durumunda bayrağın kapanacağını açıklar.
  - id: q_b2_roll_05
    question_en: What minimum crash-free session rate is required to keep the flag active?
    question_tr_hint: Bayrağın aktif kalması için hangi asgari çökmesiz oturum oranı şarttır?
    options:
    - Fifty percent
    - Ninety-nine point nine percent crash-free sessions
    - Eighty percent
    - Ninety percent
    correct_answer: Ninety-nine point nine percent crash-free sessions
    explanation_en: 'Julian confirms: ''or crash-free session rates drop below ninety-nine point nine.'''
    explanation_tr: Julian oranın %99,9'un altına düşmemesi gerektiğini belirtir.
  topic_tags:
  - canary-deployment
  - feature-flags
  - release-engineering
  - quality-assurance
  related_ids:
  - vocab.verify
  - vocab.vulnerability
  status: APPROVED
  version: 1
- id: listening.b2.event-driven-message-broker-selection
  title: 'System Design: Kafka Partitioning vs RabbitMQ AMQP'
  cefr_level: B2
  category: engineering_meeting
  scenario_context: Onur, a platform engineer, debates message broker architectures with Natalie, the data streaming architect,
    for real-time logistics tracking.
  speakers:
  - id: onur
    name: Onur
    role: Platform Engineer
    accent: Turkish
  - id: natalie
    name: Natalie
    role: Data Streaming Architect
    accent: British
  audio_ref: audio/listening/b2_message_broker.mp3
  duration_seconds: 60
  transcript_items:
  - index: 1
    speaker_id: onur
    start_ms: 0
    end_ms: 9203
    text_en: Natalie, our current RabbitMQ broker is suffering memory backpressure as vehicle telemetry surges to eighty thousand
      GPS events per second.
    text_tr: Natalie, araç telemetrisi saniyede seksen bin GPS olayına fırlarken mevcut RabbitMQ aracımız bellek geri basıncı
      (backpressure) yaşıyor.
  - index: 2
    speaker_id: natalie
    start_ms: 9603
    end_ms: 20050
    text_en: RabbitMQ is an excellent general-purpose message queue with rich routing, but it stores unacknowledged messages
      in RAM, which creates severe bottlenecks at high volumes.
    text_tr: RabbitMQ zengin yönlendirmeye sahip mükemmel bir genel amaçlı mesaj kuyruğudur ancak onaylanmamış mesajları RAM'de
      saklar, bu da yüksek hacimlerde ciddi darboğazlar yaratır.
  - index: 3
    speaker_id: onur
    start_ms: 20450
    end_ms: 27043
    text_en: Are you suggesting we migrate our GPS location ingestion pipeline to an Apache Kafka cluster?
    text_tr: GPS konum alım hattımızı bir Apache Kafka kümesine taşımamızı mı öneriyorsun?
  - index: 4
    speaker_id: natalie
    start_ms: 27443
    end_ms: 38750
    text_en: Precisely. Kafka utilizes an append-only distributed commit log written sequentially to disk, providing orders
      of magnitude higher throughput and horizontal scalability.
    text_tr: Kesinlikle. Kafka, diske sıralı olarak yazılan yalnızca eklemeli (append-only) dağıtık bir kayıt günlüğü kullanır;
      bu da kat kat daha yüksek verim ve yatay ölçeklenebilirlik sağlar.
  - index: 5
    speaker_id: onur
    start_ms: 39150
    end_ms: 48223
    text_en: How should we partition the Kafka topics to ensure that GPS coordinates for a specific delivery vehicle are processed
      in strict chronological order?
    text_tr: Belirli bir teslimat aracına ait GPS koordinatlarının kesin kronolojik sırada işlenmesini sağlamak için Kafka
      konularını nasıl bölümlemeliyiz (partitioning)?
  - index: 6
    speaker_id: natalie
    start_ms: 48623
    end_ms: 58775
    text_en: We will use the unique vehicle UUID as the Kafka partition key. That guarantees that all updates for any single
      vehicle land on the exact same partition.
    text_tr: Kafka bölümleme anahtarı (partition key) olarak benzersiz araç UUID'sini kullanacağız. Bu tek bir araca ait tüm
      güncellemelerin tam olarak aynı bölüme düşmesini garanti eder.
  key_vocabulary:
  - word: bottleneck
    vocab_id: vocab.bottleneck
    context_note_tr: Yüksek veri hacminde kuyruk sistemlerinde oluşan bellek darboğazı.
  - word: latency
    vocab_id: vocab.latency
    context_note_tr: Gerçek zamanlı olay akışlarında veri iletim gecikmesi.
  comprehension_questions:
  - id: q_b2_brok_01
    question_en: What data volume is overwhelming the existing RabbitMQ message broker?
    question_tr_hint: Mevcut RabbitMQ mesaj aracını zorlayan veri hacmi nedir?
    options:
    - Five emails per day
    - Ten thousand database backups per month
    - Three text messages per minute
    - Eighty thousand GPS events per second
    correct_answer: Eighty thousand GPS events per second
    explanation_en: Onur reports telemetry surging to 80,000 GPS events per second.
    explanation_tr: Onur telemetrinin saniyede 80.000 GPS olayına çıktığını bildirir.
  - id: q_b2_brok_02
    question_en: Why does RabbitMQ struggle under extreme high-throughput telemetry streams?
    question_tr_hint: RabbitMQ aşırı yüksek verimli telemetri akışları altında neden zorlanmaktadır?
    options:
    - It requires developers to hand-draw network diagrams for every message
    - It charges twenty dollars for every message processed by the system
    - It retains unacknowledged messages in RAM, which creates severe memory backpressure
    - It operates exclusively on obsolete analog telephone modems
    correct_answer: It retains unacknowledged messages in RAM, which creates severe memory backpressure
    explanation_en: Natalie explains that RabbitMQ stores unacknowledged messages in RAM, creating severe bottlenecks.
    explanation_tr: Natalie RabbitMQ'nun onaylanmamış mesajları RAM'de tutarak darboğaz yarattığını belirtir.
  - id: q_b2_brok_03
    question_en: What structural design allows Apache Kafka to achieve superior throughput?
    question_tr_hint: Apache Kafka'nın üstün verim elde etmesini hangi yapısal tasarım sağlamaktadır?
    options:
    - An append-only distributed commit log written sequentially to disk
    - Storing all messages in an unencrypted Microsoft Word file
    - Sending data using optical lasers pointed at the sky
    - Compressing all messages by deleting ninety percent of the numbers
    correct_answer: An append-only distributed commit log written sequentially to disk
    explanation_en: Natalie points out that Kafka uses an append-only distributed commit log written sequentially to disk.
    explanation_tr: Natalie Kafka'nın diske sıralı yazılan eklemeli bir kayıt günlüğü kullandığını açıklar.
  - id: q_b2_brok_04
    question_en: How will the team ensure strict ordering for events originating from a single vehicle?
    question_tr_hint: Ekip tek bir araçtan gelen olaylar için kesin sıralamayı nasıl garanti edecektir?
    options:
    - By running only one computer server for the entire world
    - By waiting twelve hours between sending each GPS coordinate
    - By asking vehicle drivers to call headquarters verbally
    - By using the vehicle UUID as the Kafka partition key
    correct_answer: By using the vehicle UUID as the Kafka partition key
    explanation_en: Natalie confirms that using the unique vehicle UUID as partition key guarantees ordered processing on
      the same partition.
    explanation_tr: Natalie araç UUID'sini bölümleme anahtarı yaparak aynı bölümde sıralı işleme sağlanacağını açıklar.
  - id: q_b2_brok_05
    question_en: What specific domain is this streaming architecture designed to support?
    question_tr_hint: Bu veri akış mimarisi hangi spesifik alanı desteklemek üzere tasarlanmaktadır?
    options:
    - Online multiplayer video game graphics rendering
    - Real-time logistics vehicle telemetry tracking
    - Automated hospital surgical robotic arm controls
    - Undersea submarine acoustic sonar communications
    correct_answer: Real-time logistics vehicle telemetry tracking
    explanation_en: The context and dialogue explicitly address vehicle fleet telemetry and GPS tracking coordinates.
    explanation_tr: Bağlam ve diyalog açıkça araç filosu telemetrisi ve GPS takibini ele almaktadır.
  topic_tags:
  - system-design
  - kafka
  - rabbitmq
  - event-driven-architecture
  - streaming
  related_ids:
  - vocab.bottleneck
  - vocab.latency
  status: APPROVED
  version: 1
- id: listening.b2.security-vulnerability-bounty-triage
  title: 'Security Incident: SSRF Vulnerability Triage and Hotfix'
  cefr_level: B2
  category: incident_response
  scenario_context: Sarp, an application security engineer, alerts Elena, principal infrastructure lead, about a critical
    Server-Side Request Forgery vulnerability in the document preview service.
  speakers:
  - id: sarp
    name: Sarp
    role: Application Security Lead
    accent: Turkish
  - id: elena
    name: Elena
    role: Principal Infrastructure Lead
    accent: American
  audio_ref: audio/listening/b2_ssrf_triage.mp3
  duration_seconds: 62
  transcript_items:
  - index: 1
    speaker_id: sarp
    start_ms: 0
    end_ms: 6983
    text_en: Elena, we received a critical severity submission through our HackerOne bug bounty program thirty minutes ago.
    text_tr: Elena, otuz dakika önce HackerOne ödül programımız üzerinden kritik önem derecesinde bir bildirim aldık.
  - index: 2
    speaker_id: elena
    start_ms: 7383
    end_ms: 15066
    text_en: What is the vulnerability classification and affected endpoint? Have we validated the researcher's proof of concept?
    text_tr: Zafiyet sınıflandırması ve etkilenen uç nokta nedir? Araştırmacının kavram kanıtını (PoC) doğruladık mı?
  - index: 3
    speaker_id: sarp
    start_ms: 15466
    end_ms: 26088
    text_en: It is an unauthenticated Server-Side Request Forgery on the PDF preview generator. The researcher demonstrated
      accessing the AWS cloud metadata IP.
    text_tr: PDF önizleme oluşturucusunda kimlik doğrulamasız bir Sunucu Taraflı İstek Sahteciliği (SSRF). Araştırmacı AWS
      bulut meta veri IP'sine erişebildiğini gösterdi.
  - index: 4
    speaker_id: elena
    start_ms: 26488
    end_ms: 36706
    text_en: That is an acute risk because metadata services can expose IAM node credentials. Have we enforced IMDSv2 session
      tokens across that cluster?
    text_tr: Bu çok ciddi bir risk çünkü meta veri servisleri IAM düğüm kimlik bilgilerini açığa çıkarabilir. O kümede IMDSv2
      oturum belirteçlerini zorunlu kılmış mıydık?
  - index: 5
    speaker_id: sarp
    start_ms: 37106
    end_ms: 48003
    text_en: IMDSv2 is enforced, which prevented the researcher from exfiltrating credentials. However, we must immediately
      block internal network requests.
    text_tr: IMDSv2 zorunlu kılınmıştı, bu da araştırmacının kimlik bilgilerini dışarı sızdırmasını engelledi. Ancak dahili
      ağ isteklerini derhal engellemeliyiz.
  - index: 6
    speaker_id: elena
    start_ms: 48403
    end_ms: 61480
    text_en: I will deploy a network egress firewall rule blocking all traffic to 169.254.169.254, while you patch the URL
      parser with strict domain allowlisting.
    text_tr: Sen URL ayrıştırıcısını katı alan adı beyaz listesiyle yamarken, ben 169.254.169.254'e giden tüm trafiği engelleyen
      bir ağ çıkış güvenlik duvarı kuralı dağıtacağım.
  key_vocabulary:
  - word: vulnerability
    vocab_id: vocab.vulnerability
    context_note_tr: Yazılım ve bulut altyapısında keşfedilen güvenlik açığı.
  - word: verify
    vocab_id: vocab.verify
    context_note_tr: Güvenlik araştırmacısının gönderdiği açığın doğrulanması.
  comprehension_questions:
  - id: q_b2_ssrf_01
    question_en: What specific type of security vulnerability was submitted via the bug bounty platform?
    question_tr_hint: Ödül platformu üzerinden hangi spesifik güvenlik zafiyeti bildirildi?
    options:
    - Server-Side Request Forgery (SSRF) on the PDF preview generator
    - A Cross-Site Scripting bug in the company blog comment section
    - A physical security badge clone used to enter the building garage
    - A denial-of-service attack on the office telephone lines
    correct_answer: Server-Side Request Forgery (SSRF) on the PDF preview generator
    explanation_en: Sarp identifies an unauthenticated Server-Side Request Forgery on the PDF preview generator.
    explanation_tr: Sarp PDF önizleme oluşturucusunda kimlik doğrulamasız SSRF zafiyeti olduğunu bildirir.
  - id: q_b2_ssrf_02
    question_en: What sensitive internal resource was the security researcher able to reach?
    question_tr_hint: Güvenlik araştırmacısı hangi hassas dahili kaynağa erişebildi?
    options:
    - The personal laptop of the chief executive officer
    - The corporate cafeteria lunch ordering database
    - The local municipal electricity power grid
    - The AWS cloud metadata IP service
    correct_answer: The AWS cloud metadata IP service
    explanation_en: 'Sarp states: ''The researcher demonstrated accessing the AWS cloud metadata IP.'''
    explanation_tr: Sarp araştırmacının AWS meta veri IP'sine eriştiğini belirtir.
  - id: q_b2_ssrf_03
    question_en: What prior security measure prevented the researcher from stealing IAM node credentials?
    question_tr_hint: Hangi önceki güvenlik önlemi araştırmacının IAM düğüm kimlik bilgilerini çalmasını engelledi?
    options:
    - Turning off the internet every fifteen minutes
    - Enforced IMDSv2 session token requirements
    - Encrypting the hard drive with a physical padlock
    - Removing all network cables from the computer servers
    correct_answer: Enforced IMDSv2 session token requirements
    explanation_en: 'Sarp confirms: ''IMDSv2 is enforced, which prevented the researcher from exfiltrating credentials.'''
    explanation_tr: Sarp IMDSv2'nin zorunlu kılınmış olmasının kimlik bilgilerinin sızdırılmasını engellediğini açıklar.
  - id: q_b2_ssrf_04
    question_en: What immediate network-level hotfix does Elena commit to deploying?
    question_tr_hint: Elena ağ düzeyinde hangi acil düzeltmeyi dağıtmayı taahhüt etmektedir?
    options:
    - Shutting down the entire cloud provider region indefinitely
    - Deleting all customer accounts created in the last month
    - A network egress firewall rule blocking all traffic to 169.254.169.254
    - Rewriting the entire cloud architecture in assembly language
    correct_answer: A network egress firewall rule blocking all traffic to 169.254.169.254
    explanation_en: Elena confirms she will deploy an egress rule blocking traffic to 169.254.169.254.
    explanation_tr: Elena 169.254.169.254 IP'sine giden trafiği engelleyen güvenlik duvarı kuralı koyacağını söyler.
  - id: q_b2_ssrf_05
    question_en: What application-level remediation will Sarp implement in the code?
    question_tr_hint: Sarp kod tarafında hangi uygulama düzeyinde iyileştirmeyi uygulayacaktır?
    options:
    - Patching the URL parser with strict domain allowlisting
    - Removing the PDF preview feature entirely from the product
    - Permitting users to enter any internal IP address they want
    - Allowing only administrative employees to read security logs
    correct_answer: Patching the URL parser with strict domain allowlisting
    explanation_en: 'Elena summarizes Sarp''s task: ''while you patch the URL parser with strict domain allowlisting.'''
    explanation_tr: Elena Sarp'ın URL ayrıştırıcısını katı alan adı beyaz listesiyle yamayacağını belirtir.
