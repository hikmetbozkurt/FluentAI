- id: listening.b2.quarterly-engineering-okr-alignment
  title: 'Executive Alignment: Balancing Feature Velocity and Technical Debt'
  cefr_level: B2
  category: stakeholder_alignment
  scenario_context: Alp, director of engineering, negotiates quarterly OKR resource allocations with Morgan, VP of Product,
    to secure capacity for refactoring.
  speakers:
  - id: alp
    name: Alp
    role: Director of Engineering
    accent: Turkish
  - id: morgan
    name: Morgan
    role: VP of Product
    accent: American
  audio_ref: audio/listening/b2_okr_alignment.mp3
  duration_seconds: 59
  transcript_items:
  - index: 1
    speaker_id: morgan
    start_ms: 0
    end_ms: 10408
    text_en: 'Alp, our Q3 business OKRs require shipping three major revenue features: automated billing invoicing, multi-currency
      support, and AI search.'
    text_tr: 'Alp, üçüncü çeyrek iş hedeflerimiz (OKR) üç büyük gelir getiren özelliği yayına almayı gerektiriyor: otomatik
      faturalandırma, çoklu para birimi desteği ve yapay zeka destekli arama.'
  - index: 2
    speaker_id: alp
    start_ms: 10808
    end_ms: 20840
    text_en: Morgan, our engineering teams are eager to deliver customer value, but our legacy monolithic codebase has accumulated
      dangerous levels of architectural debt.
    text_tr: Morgan, mühendislik ekiplerimiz müşteri değeri sunmaya son derece istekli ancak eski monolitik kod tabanımız
      tehlikeli seviyelerde mimari borç biriktirdi.
  - index: 3
    speaker_id: morgan
    start_ms: 21240
    end_ms: 30033
    text_en: I understand developer concerns, but if we don't launch multi-currency by August, we lose a multi-million-dollar
      European client.
    text_tr: Geliştiricilerin endişelerini anlıyorum ancak Ağustos ayına kadar çoklu para birimini başlatamazsak milyonlarca
      dolarlık Avrupalı bir müşteriyi kaybederiz.
  - index: 4
    speaker_id: alp
    start_ms: 30433
    end_ms: 40135
    text_en: If we force multi-currency on top of our brittle database models without refactoring, our deployment lead times
      will double and production outages will escalate.
    text_tr: Kod iyileştirme yapmadan çoklu para birimini kırılgan veritabanı modellerimizin üzerine zorlarsak dağıtım sürelerimiz
      iki katına çıkar ve canlı kesintiler tırmanır.
  - index: 5
    speaker_id: morgan
    start_ms: 40535
    end_ms: 47633
    text_en: What resource allocation split do you propose to ensure we meet the commercial deadline without crippling engineering
      health?
    text_tr: Mühendislik sağlığını felce uğratmadan ticari teslim tarihini yakalamamızı sağlamak için nasıl bir kaynak tahsis
      dağılımı öneriyorsun?
  - index: 6
    speaker_id: alp
    start_ms: 48033
    end_ms: 58366
    text_en: 'A strict seventy-thirty split: seventy percent throughput committed to product deliverables, and thirty percent
      dedicated to schema refactoring and CI automation.'
    text_tr: 'Kesin bir yetmiş-otuz dağılımı: İş gücünün yüzde yetmişi ürün teslimatlarına, yüzde otuzu ise şema iyileştirmelerine
      ve CI otomasyonuna ayrılacak.'
  key_vocabulary:
  - word: objective
    vocab_id: vocab.objective
    context_note_tr: Çeyreklik dönemde belirlenen ürün ve mühendislik OKR hedefleri.
  - word: maintain
    vocab_id: vocab.maintain
    context_note_tr: Teknik borcu temizleyerek kod tabanının sürdürülebilirliğini korumak.
  comprehension_questions:
  - id: q_b2_okr_01
    question_en: What commercial risk does Morgan highlight if multi-currency support is delayed past August?
    question_tr_hint: Çoklu para birimi desteği Ağustos sonrasına ertelenirse Morgan hangi ticari riski vurgulamaktadır?
    options:
    - The company will be forced to file for immediate bankruptcy
    - All software developers will be prohibited from using credit cards
    - The company risks losing a multi-million-dollar European enterprise client
    - Government regulators will seize all office furniture
    correct_answer: The company risks losing a multi-million-dollar European enterprise client
    explanation_en: 'Morgan warns: ''if we don''t launch multi-currency by August, we lose a multi-million-dollar European
      client.'''
    explanation_tr: Morgan Ağustos'a kadar çıkılmazsa milyon dolarlık Avrupalı müşterinin kaybedileceğini belirtir.
  - id: q_b2_okr_02
    question_en: What technical consequence does Alp predict if new features are added without refactoring?
    question_tr_hint: Kod iyileştirme yapılmadan yeni özellikler eklenirse Alp hangi teknik sonucu öngörmektedir?
    options:
    - Computer monitors will display text entirely in reverse order
    - Deployment lead times will double and production outages will escalate
    - All developers will immediately forget how to write software
    - The cloud provider will double the electrical voltage to the servers
    correct_answer: Deployment lead times will double and production outages will escalate
    explanation_en: Alp predicts that piling features onto brittle models will double deployment times and escalate outages.
    explanation_tr: Alp kırılgan modeller üzerine geliştirme yapmanın teslimat sürelerini ikiye katlayacağını ve kesintileri
      artıracağını söyler.
  - id: q_b2_okr_03
    question_en: What specific resource allocation split does Alp negotiate?
    question_tr_hint: Alp hangi spesifik kaynak tahsis oranını müzakere etmektedir?
    options:
    - One hundred percent for marketing and zero percent for software engineering
    - Fifty percent for sports activities and fifty percent for office cleaning
    - Ten percent for features and ninety percent for vacation time
    - Seventy percent for product features, and thirty percent for refactoring and CI automation
    correct_answer: Seventy percent for product features, and thirty percent for refactoring and CI automation
    explanation_en: Alp proposes a strict 70/30 split between product deliverables and debt refactoring.
    explanation_tr: Alp ürün teslimatları ile borç temizliği arasında net bir %70 / %30 dağılımı önerir.
  - id: q_b2_okr_04
    question_en: Which three product deliverables were demanded for Q3 by leadership?
    question_tr_hint: Yönetim tarafından 3. çeyrek için hangi üç ürün teslimatı talep edilmişti?
    options:
    - Free coffee machines, office swimming pools, and gaming consoles
    - Corporate private jets, luxury company cars, and designer suits
    - Automated billing invoicing, multi-currency support, and AI search
    - Paper encyclopedias, landline telephones, and postal stamps
    correct_answer: Automated billing invoicing, multi-currency support, and AI search
    explanation_en: 'Morgan lists: automated billing invoicing, multi-currency support, and AI search.'
    explanation_tr: Morgan otomatik faturalama, çoklu para birimi ve yapay zeka aramasını sıralar.
  - id: q_b2_okr_05
    question_en: What is the ultimate purpose of dedicated technical debt capacity in this context?
    question_tr_hint: Bu bağlamda teknik borca ayrılan kapasitenin nihai amacı nedir?
    options:
    - Preserving sustainable engineering velocity, schema health, and system reliability
    - Giving software developers unlimited time to play video games
    - Delaying commercial product launches until competitors go out of business
    - Replacing all human developers with external automated scripts
    correct_answer: Preserving sustainable engineering velocity, schema health, and system reliability
    explanation_en: Both leaders agree that investing 30% in debt reduction protects long-term velocity and prevents catastrophic
      outages.
    explanation_tr: Her iki lider de %30'luk yatırımın uzun vadeli geliştirme hızını ve sistem güvenilirliğini koruduğu konusunda
      uzlaşır.
  topic_tags:
  - engineering-leadership
  - okrs
  - technical-debt
  - product-strategy
  related_ids:
  - vocab.objective
  - vocab.maintain
  status: APPROVED
