- id: listening.b2.database-migration-failover
  title: 'Incident Response: Zero-Downtime Database Failover'
  cefr_level: B2
  category: incident_response
  scenario_context: Murat, a site reliability engineer, coordinates with Rebecca, the lead DBA, as the primary PostgreSQL
    node experiences hardware degradation.
  speakers:
  - id: murat
    name: Murat
    role: Site Reliability Engineer
    accent: Turkish
  - id: rebecca
    name: Rebecca
    role: Lead Database Administrator
    accent: British
  audio_ref: audio/listening/b2_database_failover.mp3
  duration_seconds: 63
  transcript_items:
  - index: 1
    speaker_id: murat
    start_ms: 0
    end_ms: 9463
    text_en: Rebecca, our monitoring alerts just triggered on database cluster zero-one. Disk I/O latency has spiked above
      four hundred milliseconds.
    text_tr: Rebecca, sıfır bir nolu veritabanı kümesinde izleme uyarılarımız az önce tetiklendi. Disk G/Ç gecikmesi dört
      yüz milisaniyenin üzerine fırladı.
  - index: 2
    speaker_id: rebecca
    start_ms: 9863
    end_ms: 20985
    text_en: I see the hardware degradation logs. Storage controllers are reporting corrupted sectors. We need to initiate
      an immediate failover to the standby replica.
    text_tr: Donanım bozulma günlüklerini görüyorum. Depolama kontrolörleri bozuk sektörler bildiriyor. Bekleme modundaki
      kopyaya (standby replica) derhal yük devretme (failover) başlatmamız gerekiyor.
  - index: 3
    speaker_id: murat
    start_ms: 21385
    end_ms: 29018
    text_en: What is the current replication lag on the read-replica in availability zone B? Can we guarantee zero data loss?
    text_tr: B kullanılabilirlik bölgesindeki salt-okunur kopyada mevcut çoğaltma gecikmesi nedir? Sıfır veri kaybını garanti
      edebilir miyiz?
  - index: 4
    speaker_id: rebecca
    start_ms: 29418
    end_ms: 40536
    text_en: The replication lag is under forty milliseconds. Because we operate in synchronous replication mode, transactions
      are already committed to the WAL logs on both nodes.
    text_tr: Çoğaltma gecikmesi kırk milisaniyenin altında. Eşzamanlı çoğaltma modunda çalıştığımız için işlemler her iki
      düğümdeki WAL günlüklerine çoktan işlendi.
  - index: 5
    speaker_id: murat
    start_ms: 40936
    end_ms: 50994
    text_en: Understood. I will reroute connection pooling traffic through PgBouncer, promote the replica to primary, and
      monitor application error rates.
    text_tr: Anlaşıldı. Bağlantı havuzu trafiğini PgBouncer üzerinden yeniden yönlendirecek, kopyayı birincil düğüme yükseltecek
      ve uygulama hata oranlarını izleyeceğim.
  - index: 6
    speaker_id: rebecca
    start_ms: 51394
    end_ms: 61996
    text_en: Promoting standby node now. Traffic transitioned smoothly with only three transient timeout errors. Latency is
      back down to two milliseconds.
    text_tr: Bekleme düğümünü şimdi yükseltiyorum. Trafik yalnızca üç geçici zaman aşımı hatasıyla sorunsuzca aktarıldı. Gecikme
      tekrar iki milisaniyeye düştü.
  key_vocabulary:
  - word: latency
    vocab_id: vocab.latency
    context_note_tr: Disk I/O ve veritabanı yanıtlarında meydana gelen işlem gecikmesi.
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Donanım arızalarında sıfır kesintiyle toparlanma sistem direnci.
  comprehension_questions:
  - id: q_b2_fail_01
    question_en: What critical symptom first alerted Murat to the database anomaly?
    question_tr_hint: Murat'ı veritabanı anomalisine karşı ilk uyaran kritik belirti neydi?
    options:
    - The physical server chassis caught fire in the local server room
    - Disk I/O latency surged above four hundred milliseconds on cluster zero-one
    - A hacker transferred all customer funds to an offshore bank account
    - All database passwords were deleted by a rogue terminal command
    correct_answer: Disk I/O latency surged above four hundred milliseconds on cluster zero-one
    explanation_en: Murat opens by reporting that disk I/O latency spiked above 400 milliseconds on database cluster 01.
    explanation_tr: Murat 01 nolu kümede disk G/Ç gecikmesinin 400 milisaniyenin üzerine çıktığını bildirir.
  - id: q_b2_fail_02
    question_en: What was the root cause detected by the hardware controllers?
    question_tr_hint: Donanım kontrolörleri tarafından tespit edilen kök neden neydi?
    options:
    - A power failure across the entire European electrical grid
    - A sudden rise in room temperature due to broken air conditioning
    - A junior developer accidentally dropping a glass of water on the hard drive
    - Corrupted storage sectors caused by storage controller degradation
    correct_answer: Corrupted storage sectors caused by storage controller degradation
    explanation_en: 'Rebecca states: ''Storage controllers are reporting corrupted sectors.'''
    explanation_tr: Rebecca depolama kontrolörlerinin bozuk sektörler bildirdiğini ifade eder.
  - id: q_b2_fail_03
    question_en: Why were Rebecca and Murat confident that zero data loss would occur during failover?
    question_tr_hint: Rebecca ve Murat yük devretme sırasında neden sıfır veri kaybı yaşanacağından emindiler?
    options:
    - They had printed every database record onto physical paper sheets
    - They were using an external AI tool that memorizes all customer data
    - They operate in synchronous replication mode with write-ahead logs committed to both nodes
    - The database was completely empty with zero real customer users
    correct_answer: They operate in synchronous replication mode with write-ahead logs committed to both nodes
    explanation_en: Rebecca explains synchronous replication committed transactions to WAL logs on both nodes with under 40ms
      lag.
    explanation_tr: Rebecca eşzamanlı çoğaltma modu sayesinde işlemlerin her iki düğümdeki günlüklere işlendiğini belirtir.
  - id: q_b2_fail_04
    question_en: Which proxy tool does Murat use to manage connection pooling during the transition?
    question_tr_hint: Murat geçiş sırasında bağlantı havuzunu yönetmek için hangi aracı kullanır?
    options:
    - PgBouncer
    - Apache HTTP Server
    - Docker Desktop
    - Microsoft Word
    correct_answer: PgBouncer
    explanation_en: 'Murat confirms: ''I will reroute connection pooling traffic through PgBouncer.'''
    explanation_tr: Murat trafiği PgBouncer üzerinden yönlendireceğini açıklar.
  - id: q_b2_fail_05
    question_en: What was the final outcome after promoting the standby replica?
    question_tr_hint: Bekleme kopyası yükseltildikten sonra nihai sonuç ne oldu?
    options:
    - The entire application crashed and remained offline for forty-eight hours
    - All existing customer accounts had to be manually re-registered
    - The database cluster had to be abandoned and reconstructed from scratch
    - Traffic transitioned smoothly, and latency dropped back to two milliseconds
    correct_answer: Traffic transitioned smoothly, and latency dropped back to two milliseconds
    explanation_en: Rebecca reports the transition was smooth with only 3 transient errors, and latency returned to 2ms.
    explanation_tr: Rebecca geçişin sorunsuz tamamlandığını ve gecikmenin 2 milisaniyeye düştüğünü bildirir.
  topic_tags:
  - database
  - reliability
  - failover
  - postgresql
  - high-availability
  related_ids:
  - vocab.latency
  - vocab.resilience
  status: APPROVED
  version: 1
- id: listening.b2.cloud-cost-finops-review
  title: 'FinOps Audit: Reining in Over-Provisioned Cloud Compute'
  cefr_level: B2
  category: executive_briefing
  scenario_context: Sinan, a cloud solutions architect, and Catherine, the FinOps lead, review monthly cloud expenditures
    to eliminate waste and optimize reserved instances.
  speakers:
  - id: sinan
    name: Sinan
    role: Cloud Solutions Architect
    accent: Turkish
  - id: catherine
    name: Catherine
    role: FinOps Lead
    accent: American
  audio_ref: audio/listening/b2_finops_audit.mp3
  duration_seconds: 60
  transcript_items:
  - index: 1
    speaker_id: catherine
    start_ms: 0
    end_ms: 8768
    text_en: Sinan, our cloud infrastructure bill increased by twenty-eight percent last quarter, exceeding our budget by
      sixty thousand dollars.
    text_tr: Sinan, bulut altyapı faturamız geçen çeyrekte yüzde yirmi sekiz artarak bütçemizi altmış bin dolar aştı.
  - index: 2
    speaker_id: sinan
    start_ms: 9168
    end_ms: 19291
    text_en: I performed a cost allocation breakdown. The primary driver is our staging and load-testing clusters running
      on twenty-four seven on-demand instances.
    text_tr: Bir maliyet dağılımı analizi yaptım. Ana etken, talep üzerine (on-demand) örneklerde yedi yirmi dört çalışan
      staging ve yük testi kümelerimiz.
  - index: 3
    speaker_id: catherine
    start_ms: 19691
    end_ms: 28088
    text_en: That is completely unnecessary. Why are staging environments consuming expensive compute over weekends and overnight
      hours?
    text_tr: Bu tamamen gereksiz. Staging ortamları neden hafta sonları ve gece saatlerinde pahalı bilişim kaynağı tüketiyor?
  - index: 4
    speaker_id: sinan
    start_ms: 28488
    end_ms: 38611
    text_en: Development teams forgot to shut down their test nodes. We can deploy an automated cron schedule to scale staging
      replicas down to zero after seven p.m.
    text_tr: Geliştirme ekipleri test düğümlerini kapatmayı unuttu. Akşam saat yediden sonra staging kopyalarını sıfıra indirecek
      otomatik bir zamanlayıcı devreye sokabiliriz.
  - index: 5
    speaker_id: catherine
    start_ms: 39011
    end_ms: 49028
    text_en: That alone will save thirty thousand monthly. What about our production baseline workloads? Can we purchase three-year
      compute savings plans?
    text_tr: Yalnızca bu ayda otuz bin tasarruf sağlayacaktır. Peki ya üretim taban iş yüklerimiz? Üç yıllık bilişim tasarruf
      planları satın alabilir miyiz?
  - index: 6
    speaker_id: sinan
    start_ms: 49428
    end_ms: 59676
    text_en: Yes. Our steady-state baseline is sixty instances. Committing to a three-year savings plan will yield an additional
      thirty-five percent discount.
    text_tr: Evet. Sabit taban seviyemiz altmış örnek. Üç yıllık bir tasarruf planına taahhüt vermek ek yüzde otuz beş indirim
      sağlayacaktır.
  key_vocabulary:
  - word: audit
    vocab_id: vocab.audit
    context_note_tr: Bulut kaynakları ve finansal harcamaların denetlenmesi.
  - word: objective
    vocab_id: vocab.objective
    context_note_tr: Altyapı maliyetlerini düşürme ve tasarruf hedefleri.
  comprehension_questions:
  - id: q_b2_fin_01
    question_en: By what percentage did the cloud infrastructure expenditure increase last quarter?
    question_tr_hint: Geçen çeyrekte bulut altyapı harcaması yüzde kaç artış gösterdi?
    options:
    - Five percent
    - Twenty-eight percent
    - Seventy-five percent
    - Exactly two percent
    correct_answer: Twenty-eight percent
    explanation_en: 'Catherine states: ''our cloud infrastructure bill increased by twenty-eight percent last quarter.'''
    explanation_tr: Catherine faturanın geçen çeyrekte %28 arttığını söyler.
  - id: q_b2_fin_02
    question_en: What was identified as the primary driver of cloud budget overruns?
    question_tr_hint: Bulut bütçe aşımının ana etkeni olarak ne belirlendi?
    options:
    - Staging and load-testing clusters running continuously on-demand without shutting down
    - Excessive long-distance telephone calls made from corporate offices
    - Purchasing thousands of physical hard drives for employee homes
    - Massive cryptocurrency mining performed by external hackers
    correct_answer: Staging and load-testing clusters running continuously on-demand without shutting down
    explanation_en: Sinan notes staging and load-testing environments running 24/7 on on-demand instances drove the costs.
    explanation_tr: Sinan test ortamlarının 7/24 talep üzerine çalışmasının maliyeti artırdığını belirtir.
  - id: q_b2_fin_03
    question_en: What automated policy does Sinan propose to curb non-production waste?
    question_tr_hint: Sinan üretim dışı israfı dizginlemek için hangi otomatik politikayı önermektedir?
    options:
    - Permanently deleting all staging environments and only testing directly in production
    - Charging developers ten dollars for every server instance they launch
    - Turning off the office building electricity every evening at five p.m.
    - Scaling staging replicas down to zero automatically after seven p.m. using cron schedules
    correct_answer: Scaling staging replicas down to zero automatically after seven p.m. using cron schedules
    explanation_en: Sinan proposes an automated cron schedule to scale staging replicas down to zero after 7 p.m.
    explanation_tr: Sinan saat 19:00'dan sonra staging kopyalarını sıfıra indirecek zamanlayıcı önerir.
  - id: q_b2_fin_04
    question_en: How much monthly savings does Catherine anticipate from the non-production shutdown alone?
    question_tr_hint: Catherine yalnızca üretim dışı sistemlerin kapatılmasından aylık ne kadar tasarruf beklemektedir?
    options:
    - Five hundred dollars
    - Thirty thousand dollars monthly
    - One million dollars
    - Two thousand dollars
    correct_answer: Thirty thousand dollars monthly
    explanation_en: 'Catherine estimates: ''That alone will save thirty thousand monthly.'''
    explanation_tr: Catherine bunun tek başına ayda otuz bin dolar tasarruf sağlayacağını belirtir.
  - id: q_b2_fin_05
    question_en: What additional discount rate is unlocked by committing to a three-year savings plan?
    question_tr_hint: Üç yıllık tasarruf planına taahhüt vermek hangi ek indirim oranını açmaktadır?
    options:
    - An additional five percent discount
    - A ninety percent reduction
    - An additional thirty-five percent discount
    - No financial discount at all
    correct_answer: An additional thirty-five percent discount
    explanation_en: Sinan confirms that a 3-year commitment yields an additional 35% discount on steady baseline instances.
    explanation_tr: Sinan üç yıllık taahhüdün ek yüzde otuz beş indirim sağlayacağını açıklar.
  topic_tags:
  - finops
  - cloud-computing
  - cost-optimization
  - infrastructure
  related_ids:
  - vocab.audit
  - vocab.objective
  status: APPROVED
  version: 1
- id: listening.b2.monolith-to-microservices-strangler
  title: 'Architecture Strategy: Strangler Fig Pattern Decomposition'
  cefr_level: B2
  category: engineering_meeting
  scenario_context: Defne, a staff backend engineer, discusses breaking up a legacy billing system with Craig, the principal
    systems architect, using the Strangler Fig pattern.
  speakers:
  - id: defne
    name: Defne
    role: Staff Backend Engineer
    accent: Turkish
  - id: craig
    name: Craig
    role: Principal Systems Architect
    accent: British
  audio_ref: audio/listening/b2_strangler_pattern.mp3
  duration_seconds: 56
  transcript_items:
  - index: 1
    speaker_id: craig
    start_ms: 0
    end_ms: 9463
    text_en: Defne, our executive stakeholders are pressuring us to migrate away from the seven-year-old billing monolith.
      How do you envision the roadmap?
    text_tr: Defne, yönetim paydaşlarımız yedi yıllık faturalandırma monolitinden uzaklaşmamız için bize baskı yapıyor. Yol
      haritasını nasıl görüyorsun?
  - index: 2
    speaker_id: defne
    start_ms: 9863
    end_ms: 19770
    text_en: We must strictly avoid a high-risk 'big bang' rewrite. I advocate adopting Martin Fowler's Strangler Fig pattern
      to decouple functionality incrementally.
    text_tr: Kesinlikle yüksek riskli 'büyük patlama' (big bang) yeniden yazımından kaçınmalıyız. İşlevselliği kademeli olarak
      ayırmak için Martin Fowler'ın Strangler Fig desenini benimsemeyi savunuyorum.
  - index: 3
    speaker_id: craig
    start_ms: 20170
    end_ms: 27328
    text_en: That minimizes operational disruption. Which bounded context should we intercept and carve out first?
    text_tr: Bu durum operasyonel kesintiyi en aza indirir. İlk önce hangi sınırlı etki alanını (bounded context) araya girip
      ayırmalıyız?
  - index: 4
    speaker_id: defne
    start_ms: 27728
    end_ms: 39246
    text_en: The invoice generation service. We can configure our API gateway to route all invoice PDF requests to a new Go
      microservice while the monolith processes ledger writes.
    text_tr: Fatura oluşturma servisi. API ağ geçidimizi tüm fatura PDF isteklerini yeni bir Go mikro servisine yönlendirecek
      şekilde yapılandırabiliriz, monolit ise muhasebe defteri yazımlarını işlemeye devam eder.
  - index: 5
    speaker_id: craig
    start_ms: 39646
    end_ms: 46529
    text_en: How will the new microservice stay synchronized with customer profile updates occurring inside the legacy database?
    text_tr: Yeni mikro servis eski veritabanı içinde gerçekleşen müşteri profili güncellemeleriyle nasıl senkronize kalacak?
  - index: 6
    speaker_id: defne
    start_ms: 46929
    end_ms: 54927
    text_en: We will implement change data capture using Debezium to stream database transaction logs into Kafka topics asynchronously.
    text_tr: Veritabanı işlem günlüklerini Kafka konularına asenkron olarak aktarmak için Debezium kullanarak Değişiklik Verisi
      Yakalama (CDC) uygulayacağız.
  key_vocabulary:
  - word: collaborate
    vocab_id: vocab.collaborate
    context_note_tr: Monolitik sistemleri modern mimarilere dönüştürürken ekipler arası iş birliği.
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Kademeli mimari dönüşümle sistem kesintisizliğini koruma yeteneği.
  comprehension_questions:
  - id: q_b2_strang_01
    question_en: Why does Defne reject a 'big bang' complete rewrite of the billing system?
    question_tr_hint: Defne faturalandırma sisteminin 'büyük patlama' tarzında sıfırdan tamamen yeniden yazılmasını neden
      reddediyor?
    options:
    - A big bang rewrite carries excessive operational and business risk compared to incremental migration
    - Company developers are forbidden from writing new software code by corporate bylaws
    - The original billing system was written by the company's founder and cannot be touched
    - Software rewrites always cause computer monitors to physically implode
    correct_answer: A big bang rewrite carries excessive operational and business risk compared to incremental migration
    explanation_en: Defne warns against a high-risk big bang rewrite, proposing the Strangler Fig pattern for incremental
      migration.
    explanation_tr: Defne yüksek riskli büyük patlama yeniden yazımından kaçınmayı ve kademeli Strangler Fig desenini savunur.
  - id: q_b2_strang_02
    question_en: What architectural pattern does Defne advocate to decompose the monolith?
    question_tr_hint: Defne monoliti ayrıştırmak için hangi mimari deseni savunmaktadır?
    options:
    - The Waterfall Model
    - The Monolithic Blob pattern
    - The Strangler Fig pattern
    - The Random Shuffling technique
    correct_answer: The Strangler Fig pattern
    explanation_en: Defne explicitly recommends Martin Fowler's Strangler Fig pattern.
    explanation_tr: Defne açıkça Martin Fowler'ın Strangler Fig desenini önerir.
  - id: q_b2_strang_03
    question_en: Which bounded context will be extracted first as an independent microservice?
    question_tr_hint: Bağımsız bir mikro servis olarak ilk önce hangi sınırlı etki alanı çıkarılacaktır?
    options:
    - The corporate human resources directory
    - The invoice generation service
    - The internal office catering ordering menu
    - The warehouse parking garage barrier controller
    correct_answer: The invoice generation service
    explanation_en: Defne identifies invoice generation as the initial candidate to decouple.
    explanation_tr: Defne fatura oluşturma servisini ilk aday olarak belirler.
  - id: q_b2_strang_04
    question_en: How will incoming traffic be split between the legacy monolith and the new microservice?
    question_tr_hint: Gelen trafik eski monolit ile yeni mikro servis arasında nasıl bölünecektir?
    options:
    - Employees will manually flip physical electrical switches on the server racks
    - Users will be required to download two separate smartphone applications
    - All incoming network cables will be cut in half with scissors
    - The API gateway will route invoice requests to the new service while routing ledger writes to the monolith
    correct_answer: The API gateway will route invoice requests to the new service while routing ledger writes to the monolith
    explanation_en: Defne explains that the API gateway will route invoice PDF requests to the new Go service.
    explanation_tr: Defne API ağ geçidinin fatura isteklerini yeni Go servisine yönlendireceğini açıklar.
  - id: q_b2_strang_05
    question_en: What technology solution ensures data synchronization without modifying legacy write code?
    question_tr_hint: Eski yazma kodunu değiştirmeden veri senkronizasyonunu hangi teknoloji çözümü sağlar?
    options:
    - Printing daily summary reports and scanning them back into the system
    - Sending automated SMS messages between software engineers
    - Change Data Capture (CDC) with Debezium streaming transaction logs to Kafka
    - Using manual spreadsheet copy-pasting every midnight
    correct_answer: Change Data Capture (CDC) with Debezium streaming transaction logs to Kafka
    explanation_en: Defne states they will implement change data capture using Debezium and Kafka topics.
    explanation_tr: Defne Debezium ve Kafka kullanarak Değişiklik Verisi Yakalama uygulayacaklarını belirtir.
  topic_tags:
  - microservices
  - strangler-pattern
  - software-architecture
  - refactoring
  related_ids:
  - vocab.collaborate
  - vocab.resilience
  status: APPROVED
  version: 1
- id: listening.b2.enterprise-sla-penalty-negotiation
  title: 'Commercial Negotiation: Service Level Agreement Breach Penalty'
  cefr_level: B2
  category: negotiation
  scenario_context: Kerem, director of customer engineering, negotiates service credit remedies with Fiona, enterprise procurement
    lead, following an unplanned cloud disruption.
  speakers:
  - id: kerem
    name: Kerem
    role: Director of Customer Engineering
    accent: Turkish
  - id: fiona
    name: Fiona
    role: Enterprise Procurement Director
    accent: British
  audio_ref: audio/listening/b2_sla_negotiation.mp3
  duration_seconds: 60
  transcript_items:
  - index: 1
    speaker_id: fiona
    start_ms: 0
    end_ms: 10922
    text_en: Kerem, last Tuesday's three-hour payment gateway downtime caused severe disruptions across our retail stores.
      Our SLA mandates a twenty percent billing credit.
    text_tr: Kerem, geçen Salı günkü üç saatlik ödeme ağ geçidi kesintisi perakende mağazalarımızda ciddi aksamalara neden
      oldu. Hizmet Seviyesi Sözleşmemiz (SLA) yüzde yirmi fatura kredisi gerektiriyor.
  - index: 2
    speaker_id: kerem
    start_ms: 11322
    end_ms: 21365
    text_en: We deeply apologize for that incident, Fiona. We have published our comprehensive root-cause analysis explaining
      the third-party upstream fiber cut.
    text_tr: O olay için çok özür dileriz Fiona. Üçüncü taraf sağlayıcıdaki fiber kesintisini açıklayan kapsamlı kök neden
      analizimizi yayımladık.
  - index: 3
    speaker_id: fiona
    start_ms: 21765
    end_ms: 30352
    text_en: We appreciate the transparency, but our contract clearly states that upstream vendor failures do not excuse availability
      commitments.
    text_tr: Şeffaflığı takdir ediyoruz ancak sözleşmemiz açıkça üçüncü taraf tedarikçi arızalarının kullanılabilirlik taahhütlerini
      mazur göstermediğini belirtiyor.
  - index: 4
    speaker_id: kerem
    start_ms: 30752
    end_ms: 40110
    text_en: Understood. We are completely prepared to honor the twenty percent credit, which amounts to forty-five thousand
      dollars on this month's invoice.
    text_tr: Anlaşıldı. Bu ayki faturada kırk beş bin dolara tekabül eden yüzde yirmilik krediyi eksiksiz olarak karşılamaya
      tamamen hazırız.
  - index: 5
    speaker_id: fiona
    start_ms: 40510
    end_ms: 49298
    text_en: Beyond the financial credit, what architectural redundancy are you deploying to ensure such an outage cannot
      recur during peak holiday shopping?
    text_tr: Mali kredinin ötesinde yoğun tatil alışverişi döneminde böyle bir kesintinin tekrarlanmamasını sağlamak için
      hangi mimari yedekliliği devreye alıyorsunuz?
  - index: 6
    speaker_id: kerem
    start_ms: 49698
    end_ms: 59415
    text_en: We are provisioning active-active multi-region failover across two distinct cloud regions, with automatic traffic
      rerouting completed in under five seconds.
    text_tr: İki ayrı bulut bölgesi genelinde aktif-aktif çok bölgeli yük devretme kuruyoruz; otomatik trafik yeniden yönlendirmesi
      beş saniyenin altında tamamlanacak.
  key_vocabulary:
  - word: customer
    vocab_id: vocab.customer
    context_note_tr: Kurumsal müşteri ilişkileri ve ticari sözleşme yükümlülükleri.
  - word: resilience
    vocab_id: vocab.resilience
    context_note_tr: Hizmet kesintilerine karşı sunulan aktif-aktif çok bölgeli dayanıklılık.
  comprehension_questions:
  - id: q_b2_sla_01
    question_en: How long did the payment gateway service outage last on Tuesday?
    question_tr_hint: Salı günkü ödeme ağ geçidi hizmet kesintisi ne kadar sürdü?
    options:
    - Three hours
    - Fifteen minutes
    - Three full days
    - Ten seconds
    correct_answer: Three hours
    explanation_en: 'Fiona opens by noting: ''last Tuesday''s three-hour payment gateway downtime.'''
