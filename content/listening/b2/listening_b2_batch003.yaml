- id: listening.b2.api-versioning-deprecation-sync
  title: Planning a Safe Legacy API Sunset
  cefr_level: B2
  category: engineering_meeting
  scenario_context: Platform engineer Deniz and partner success lead Jason coordinate deprecating legacy v1 webhook payloads
    without breaking enterprise integrations.
  speakers:
  - id: deniz_eng
    name: Deniz
    role: Staff Platform Engineer
    accent: Turkish
  - id: jason
    name: Jason
    role: Partner Success Lead
    accent: British
  audio_ref: audio/listening/b2_api_versioning_deprecation_sync.mp3
  duration_seconds: 70
  transcript_items:
  - index: 1
    speaker_id: deniz_eng
    start_ms: 0
    end_ms: 9648
    text_en: Jason, thanks for checking API telemetry with me. Supporting v1 webhooks adds two days of manual testing to every
      billing release.
    text_tr: Jason, API telemetrisini benimle incelediğin için teşekkürler. Eski v1 web kancalarını desteklemek her faturalama
      sürümüne iki gün manuel test ekliyor.
  - index: 2
    speaker_id: jason
    start_ms: 10048
    end_ms: 16946
    text_en: Totally fair to sunset it, Deniz—how many active enterprise accounts are still calling v1 endpoints?
    text_tr: Kapatmak istemeniz çok haklı Deniz—şu an kaç aktif kurumsal hesap hâlâ v1 uç noktalarını çağırıyor?
  - index: 3
    speaker_id: deniz_eng
    start_ms: 17346
    end_ms: 24379
    text_en: Only eleven organizations worldwide, yet three of them process major monthly invoice reconciliations.
    text_tr: Dünya genelinde yalnızca on bir kuruluş, ancak bunların üçü çok büyük aylık fatura mutabakatları işliyor.
  - index: 4
    speaker_id: jason
    start_ms: 24779
    end_ms: 35077
    text_en: Sending one quiet email won't move busy IT contractors. Can we inject explicit sunset warning headers into v1
      HTTP responses first?
    text_tr: Tek bir sessiz e-posta meşgul BT yüklenicilerini harekete geçirmez. Önce v1 HTTP yanıtlarına açık kapanma uyarı
      başlıkları ekleyebilir miyiz?
  - index: 5
    speaker_id: deniz_eng
    start_ms: 35477
    end_ms: 44699
    text_en: Yes! Better still, our developer portal can display a live breakdown showing exactly which webhook keys still
      trigger v1 calls.
    text_tr: Evet! Daha da iyisi, geliştirici portalımız hangi web kancası anahtarlarının hâlâ v1 çağrısı yaptığını canlı
      gösterebilir.
  - index: 6
    speaker_id: jason
    start_ms: 45099
    end_ms: 51162
    text_en: And what migration timeline protects those eleven partners fairly without breaking month-end billing?
    text_tr: Peki ay sonu faturalamasını bozmadan o on bir ortağı adilce koruyacak geçiş takvimi nedir?
  - index: 7
    speaker_id: deniz_eng
    start_ms: 51562
    end_ms: 61000
    text_en: Ninety-day notice starting May first, followed by two scheduled brownout hours in late July so silent scripts
      surface safely before hard shutdown.
    text_tr: Bir Mayıs'tan itibaren doksan gün bildirim, ardından Temmuz sonunda planlı iki kısa kesinti penceresi; böylece
      sessiz betikler tamamen kapanmadan fark edilir.
  - index: 8
    speaker_id: jason
    start_ms: 61400
    end_ms: 69483
    text_en: Scheduled brownouts always wake dormant owners cleanly. Let us book personal check-ins with the top three partners
      this week.
    text_tr: Planlı kısa kesinti provaları unutulmuş sahipleri hep temiz biçimde uyandırır. Bu hafta en büyük üç ortakla kişisel
      görüşmeler ayarlayalım.
  key_vocabulary:
  - word: deprecation
    context_note_tr: eski sürümün aşamalı olarak kullanımdan kaldırılması
  - word: payload
    context_note_tr: API üzerinden gönderilen veri yükü
  - word: telemetry
    context_note_tr: canlı kullanım ölçüm verisi
  comprehension_questions:
  - id: q_listening_b2_api-versioning-deprecation-sync_01
    question_en: Why does Deniz want to retire legacy v1 webhooks?
    options:
    - Enterprise accounts stopped integrating with webhooks
    - Partner IT teams requested shorter API contracts
    - HTTP response headers broke v2 encryption keys
    - Maintaining v1 adds two days of manual testing to every billing release
    correct_answer: Maintaining v1 adds two days of manual testing to every billing release
    explanation_en: Deniz says legacy v1 support costs two days of extra manual testing on each release.
    explanation_tr: Deniz v1 desteğinin her sürümde iki gün ek manuel test yükü çıkardığını söyler.
  - id: q_listening_b2_api-versioning-deprecation-sync_02
    question_en: Why can't engineers simply turn v1 off tomorrow?
    options:
    - Telemetries failed to track v1 usage for months
    - Contractors demanded free annual cloud credits
    - Three of eleven remaining partners rely on it for heavy monthly invoicing
    - Developer portal dashboards cannot display API keys
    correct_answer: Three of eleven remaining partners rely on it for heavy monthly invoicing
    explanation_en: Though only eleven orgs remain, three handle major invoice reconciliations on v1.
    explanation_tr: Yalnızca on bir kurum kalsa da üçünün büyük fatura mutabakatlarını buradan yürüttüğü belirtilir.
  - id: q_listening_b2_api-versioning-deprecation-sync_03
    question_en: Besides email alerts, how will Deniz make outdated v1 calls visible to partner engineers?
    options:
    - By turning off weekend customer phone support
    - By adding HTTP sunset headers and showing active v1 keys in the portal
    - By deleting invoice PDFs cleanly on May first
    - By raising v1 API prices by twenty-eight percent
    correct_answer: By adding HTTP sunset headers and showing active v1 keys in the portal
    explanation_en: They add sunset warning HTTP headers plus a live developer-portal breakdown of v1 keys.
    explanation_tr: HTTP kapanma uyarı başlıkları ve geliştirici portalında canlı anahtar kırılımı eklenmesine karar verilir.
  - id: q_listening_b2_api-versioning-deprecation-sync_04
    question_en: What is the purpose of scheduled short 'brownouts' in late July?
    options:
    - To reset partner portal passwords automatically
    - To double testing throughput before invoice close
    - To expose forgotten scripts safely before permanent shutdown
    - To cut S3 bandwidth during retail peak season
    correct_answer: To expose forgotten scripts safely before permanent shutdown
    explanation_en: Jason and Deniz explain controlled brownout hours reveal silent scripts safely while support is ready.
    explanation_tr: Kısa planlı kesintilerin unutulmuş gizli entegrasyonları tamamen kapanmadan önce güvenli biçimde ortaya
      çıkardığı anlatılır.
  - id: q_listening_b2_api-versioning-deprecation-sync_05
    question_en: What immediate action does Jason plan for the three largest remaining accounts?
    options:
    - Scheduling personal proactive calls this week
    - Switching them manually without notification
    - Writing automated newsletter summaries for July
    - Extending their v1 grace window by three years
    correct_answer: Scheduling personal proactive calls this week
    explanation_en: Jason proposes personal check-ins this week with the top three partners.
    explanation_tr: Jason bu hafta en büyük üç ortakla kişisel takip görüşmeleri ayarlamayı önerir.
  topic_tags:
  - api
  - deprecation
  - platform
  related_ids: []
  status: APPROVED
  version: 1
