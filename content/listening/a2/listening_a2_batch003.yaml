- id: listening.a2.asking-client-about-reports
  title: Asking a Client About Report Filters
  cefr_level: A2
  category: product_discovery
  scenario_context: Product specialist Liam calls store manager Ece to learn how she exports weekly inventory figures.
  speakers:
  - id: liam
    name: Liam
    role: Product Specialist
    accent: American
  - id: ece
    name: Ece
    role: Retail Manager
    accent: Turkish
  audio_ref: audio/listening/a2_asking_client_about_reports.mp3
  duration_seconds: 55
  transcript_items:
  - index: 1
    speaker_id: liam
    start_ms: 0
    end_ms: 7573
    text_en: Hi Ece, thanks for talking with us today. Which screen do you open first every Monday morning?
    text_tr: Merhaba Ece, bugün bizimle konuştuğun için teşekkürler. Her pazartesi sabahı ilk hangi ekranı açıyorsun?
  - index: 2
    speaker_id: ece
    start_ms: 7973
    end_ms: 14537
    text_en: Hi Liam. I always open the weekly stock report before opening the shop doors.
    text_tr: Merhaba Liam. Mağaza kapılarını açmadan önce her zaman haftalık stok raporunu açarım.
  - index: 3
    speaker_id: liam
    start_ms: 14937
    end_ms: 19136
    text_en: What feels slow or difficult when you use that page right now?
    text_tr: Şu an o sayfayı kullanırken ne yavaş veya zor hissettiriyor?
  - index: 4
    speaker_id: ece
    start_ms: 19536
    end_ms: 27094
    text_en: 'Every Monday I must pick three filters manually: warehouse city, product size, and unpaid orders.'
    text_tr: 'Her pazartesi üç filtreyi elle seçmek zorundayım: depo şehri, ürün bedeni ve ödenmemiş siparişler.'
  - index: 5
    speaker_id: liam
    start_ms: 27494
    end_ms: 33218
    text_en: Got it. How long does picking those same filters usually take you?
    text_tr: Anladım. Bu aynı filtreleri seçmek genelde ne kadar zamanını alıyor?
  - index: 6
    speaker_id: ece
    start_ms: 33618
    end_ms: 39957
    text_en: About ten minutes, and then I export the table to check damaged boxes in our back room.
    text_tr: Yaklaşık on dakika, ardından arka odadaki hasarlı kutuları kontrol etmek için tabloyu dışa aktarıyorum.
  - index: 7
    speaker_id: liam
    start_ms: 40357
    end_ms: 46205
    text_en: If you could save one favorite filter view under a single button, would that save time?
    text_tr: Favori filtre görünümünü tek bir düğmenin altına kaydedebilsen bu zaman kazandırır mıydı?
  - index: 8
    speaker_id: ece
    start_ms: 46605
    end_ms: 54009
    text_en: Yes, definitely! Clicking one saved button would save me half an hour every single week.
    text_tr: Evet, kesinlikle! Kayıtlı tek bir düğmeye tıklamak bana her hafta yarım saat kazandırırdı.
  key_vocabulary:
  - word: filter
    context_note_tr: veriyi süzmeye yarayan filtre
  - word: weekly
    context_note_tr: haftalık düzenli işlem
  - word: export
    context_note_tr: dosyayı dışa aktarma
  comprehension_questions:
  - id: q_listening_a2_asking-client-about-reports_01
    question_en: When does Ece open the weekly stock report?
    options:
    - Late Friday night after locking the back room
    - Once every three months for tax audits
    - Only when customers return damaged coats
    - Every Monday morning before opening the shop
    correct_answer: Every Monday morning before opening the shop
    explanation_en: Ece checks the weekly stock report first every Monday morning before opening.
    explanation_tr: Ece her pazartesi sabahı mağazayı açmadan önce stok raporuna baktığını söyler.
  - id: q_listening_a2_asking-client-about-reports_02
    question_en: How many manual filters does Ece set on every visit?
    options:
    - Only one filter
    - Three filters
    - Twelve filters
    - Zero filters
    correct_answer: Three filters
    explanation_en: She selects warehouse city, product size, and unpaid orders—three filters manually.
    explanation_tr: Depo şehri, ürün bedeni ve ödenmemiş siparişler olmak üzere üç filtre seçtiğini anlatır.
  - id: q_listening_a2_asking-client-about-reports_03
    question_en: Why does Ece export the report table afterward?
    options:
    - To send invoices to international banks
    - To check damaged boxes in the stockroom
    - To delete unpaid orders automatically
    - To design marketing banners for mobile
    correct_answer: To check damaged boxes in the stockroom
    explanation_en: Ece exports the table to check damaged boxes in the back room.
    explanation_tr: Arka odadaki hasarlı kutuları kontrol etmek için dışa aktarım yaptığını söyler.
  - id: q_listening_a2_asking-client-about-reports_04
    question_en: What solution does Liam suggest testing?
    options:
    - Hiring another shop manager for Mondays
    - Sending paper tables by post weekly
    - Saving a favorite filter view under one button
    - Removing product sizes from stock screens
    correct_answer: Saving a favorite filter view under one button
    explanation_en: Liam asks whether saving a favorite filter view as a single button would help.
    explanation_tr: Liam favori filtre görünümünü tek bir düğmede saklamayı sorar.
  - id: q_listening_a2_asking-client-about-reports_05
    question_en: How much weekly time does Ece estimate a saved button would return?
    options:
    - About half an hour each week
    - Three hours per hour
    - Two full business days
    - Ten seconds per month
    correct_answer: About half an hour each week
    explanation_en: Ece says one saved button would save her half an hour every single week.
    explanation_tr: Ece tek kayıtlı düğmenin her hafta yarım saat kazandıracağını ifade eder.
  topic_tags:
  - product-discovery
  - ux-research
  - reporting
  related_ids: []
  status: APPROVED
  version: 1
- id: listening.a2.fixing-office-wifi-outage
  title: Reporting an Office Wi-Fi Drop
  cefr_level: A2
  category: incident_response
  scenario_context: Support analyst Cem calls office IT technician Nora after laptops on the third floor disconnect suddenly.
  speakers:
  - id: cem
    name: Cem
    role: Customer Support Analyst
    accent: Turkish
  - id: nora
    name: Nora
    role: IT Helpdesk Technician
    accent: British
  audio_ref: audio/listening/a2_fixing_office_wifi_outage.mp3
  duration_seconds: 57
  transcript_items:
  - index: 1
    speaker_id: cem
    start_ms: 0
    end_ms: 7713
    text_en: Hi Nora, this is Cem from the third-floor support room. Our Wi-Fi just went down completely.
    text_tr: Merhaba Nora, ben üçüncü kat destek odasından Cem. Kablosuz internetimiz az önce tamamen kesildi.
  - index: 2
    speaker_id: nora
    start_ms: 8113
    end_ms: 15802
    text_en: Thanks for calling fast, Cem. Is the problem affecting laptops on the second floor too?
    text_tr: Hızlı aradığın için teşekkürler Cem. Sorun ikinci kattaki dizüstü bilgisayarları da etkiliyor mu?
  - index: 3
    speaker_id: cem
    start_ms: 16202
    end_ms: 22420
    text_en: No, I checked with Sarah downstairs and her team still has green bars and normal calls.
    text_tr: Hayır, aşağıdaki Sarah'ya sordum, ekibinde hâlâ tam çekim ve normal görüşmeler var.
  - index: 4
    speaker_id: nora
    start_ms: 22820
    end_ms: 29493
    text_en: Okay, that narrows it down cleanly to the third-floor network switch inside the printer closet.
    text_tr: Tamam, bu durumu temiz biçimde yazıcı dolabındaki üçüncü kat ağ anahtarına daraltıyor.
  - index: 5
    speaker_id: cem
    start_ms: 29893
    end_ms: 34707
    text_en: I can stand right beside that closet if you need me to check the lights.
    text_tr: Işıkları kontrol etmemi istersen tam dolabın yanında durabilirim.
  - index: 6
    speaker_id: nora
    start_ms: 35107
    end_ms: 40986
    text_en: Great. Do you see a flashing orange light next to power port one?
    text_tr: Harika. Bir numaralı güç girişinin yanında yanıp sönen turuncu bir ışık görüyor musun?
  - index: 7
    speaker_id: cem
    start_ms: 41386
    end_ms: 48424
    text_en: Wait a second... Actually the power plug is slightly loose because a supply box bumped it.
    text_tr: Bir saniye... Aslında bir malzeme kutusu çarptığı için güç fişi hafifçe gevşemiş.
  - index: 8
    speaker_id: nora
    start_ms: 48824
    end_ms: 55823
    text_en: Push that plug firmly back in, wait thirty seconds for the reboot, and Wi-Fi should return.
    text_tr: O fişi sıkıca yerine it, yeniden başlatma için otuz saniye bekle; internet geri gelecektir.
  key_vocabulary:
  - word: disconnect
    context_note_tr: bağlantının kesilmesi
  - word: switch
    context_note_tr: ağ yönlendirme cihazı
  - word: reboot
    context_note_tr: cihazı yeniden başlatmak
  comprehension_questions:
  - id: q_listening_a2_fixing-office-wifi-outage_01
    question_en: Which office area lost wireless internet?
    options:
    - Both the second and third floors
    - Only Sarah's downstairs room
    - Only the third floor
    - The entire office street
    correct_answer: Only the third floor
    explanation_en: Cem checks with Sarah downstairs and confirms only the third-floor support room disconnected.
    explanation_tr: Cem alt kattaki Sarah'nın sorun yaşamadığını, kesintinin yalnızca üçüncü katta olduğunu belirtir.
  - id: q_listening_a2_fixing-office-wifi-outage_02
    question_en: Where is the third-floor network switch located?
    options:
    - Inside the printer closet
    - Under Cem's meeting table
    - Outside on the building balcony
    - Near the front security reception
    correct_answer: Inside the printer closet
    explanation_en: Nora identifies the switch inside the third-floor printer closet.
    explanation_tr: Nora ağ anahtarının üçüncü kat yazıcı dolabının içinde olduğunu söyler.
  - id: q_listening_a2_fixing-office-wifi-outage_03
    question_en: What actually caused the outage?
    options:
    - Too many guests joined video calls
    - An overnight software update crashed
    - Someone cut the green ceiling cable
    - A supply box bumped the power plug loose
    correct_answer: A supply box bumped the power plug loose
    explanation_en: Cem notices the power plug came loose because a supply box bumped it.
    explanation_tr: Cem bir malzeme kutusunun çarpmasıyla güç fişinin gevşediğini fark eder.
  - id: q_listening_a2_fixing-office-wifi-outage_04
    question_en: How long should Cem wait after pushing the plug in?
    options:
    - Until Friday morning maintenance
    - Half an hour before opening any laptop
    - Fifteen minutes until Nora walks upstairs
    - Thirty seconds for the device reboot
    correct_answer: Thirty seconds for the device reboot
    explanation_en: Nora tells Cem to wait thirty seconds for the switch to reboot.
    explanation_tr: Nora yeniden başlatma için otuz saniye beklemesini söyler.
  - id: q_listening_a2_fixing-office-wifi-outage_05
    question_en: How did Nora pinpoint the problem without leaving her desk?
    options:
    - By asking whether another floor still worked properly
    - By restarting every employee laptop remotely
    - By replacing the printer cable over email
    - By calling external internet engineers immediately
    correct_answer: By asking whether another floor still worked properly
    explanation_en: Confirming the second floor worked isolated the issue strictly to the third-floor switch.
    explanation_tr: İkinci katın sorunsuz çalıştığını doğrulayarak sorunu üçüncü kat anahtarına daralttı.
  topic_tags:
  - it-support
  - wifi
  - troubleshooting
  related_ids: []
  status: APPROVED
  version: 1
- id: listening.a2.ordering-annual-stationery-discount
  title: Requesting a Bulk Stationery Discount
  cefr_level: A2
  category: negotiation
  scenario_context: Office manager Defne speaks with stationery supplier David about lowering unit prices on an annual paper
    and notebook order.
  speakers:
  - id: defne
    name: Defne
    role: Office Manager
    accent: Turkish
  - id: david
    name: David
    role: Account Representative
    accent: American
  audio_ref: audio/listening/a2_ordering_annual_stationery_discount.mp3
  duration_seconds: 57
  transcript_items:
  - index: 1
    speaker_id: defne
    start_ms: 0
    end_ms: 6683
    text_en: Hello David, thank you for sending the quote for our notebooks, pens, and printer paper.
    text_tr: Merhaba David, defterlerimiz, kalemlerimiz ve yazıcı kağıtlarımız için teklifi gönderdiğin teşekkürler.
  - index: 2
    speaker_id: david
    start_ms: 7083
    end_ms: 14177
    text_en: You are welcome, Defne. Do those standard catalog numbers fit your office plan?
    text_tr: Rica ederim Defne. Bu standart katalog rakamları ofis planınıza uyuyor mu?
  - index: 3
    speaker_id: defne
    start_ms: 14577
    end_ms: 20735
    text_en: We like the paper quality, yet we are ordering for all four floors together this year.
    text_tr: Kağıt kalitesini beğendik ama bu yıl dört katın tamamı için birlikte sipariş veriyoruz.
  - index: 4
    speaker_id: david
    start_ms: 21135
    end_ms: 27654
    text_en: Oh, combining four floors into one big pallet is much easier for our warehouse to pack.
    text_tr: Aa, dört katı tek büyük palette birleştirmek depomuzun paketlemesi için çok daha kolay.
  - index: 5
    speaker_id: defne
    start_ms: 28054
    end_ms: 33638
    text_en: Could you offer a ten percent bulk discount and free Tuesday delivery if we commit now?
    text_tr: Şimdi onaylarsak yüzde on toplu alım indirimi ve ücretsiz salı teslimatı sunabilir misiniz?
  - index: 6
    speaker_id: david
    start_ms: 34038
    end_ms: 41351
    text_en: I cannot go all the way to ten percent on paper, though I can give eight percent off everything plus free shipping.
    text_tr: Kağıtta yüzde ona kadar çıkamam ama her şeyde yüzde sekiz indirim ve ücretsiz kargo verebilirim.
  - index: 7
    speaker_id: defne
    start_ms: 41751
    end_ms: 48794
    text_en: Eight percent with free shipping works nicely for our quarterly budget. When will boxes arrive?
    text_tr: Ücretsiz kargo ile yüzde sekiz üç aylık bütçemize güzel uyuyor. Kutular ne zaman ulaşır?
  - index: 8
    speaker_id: david
    start_ms: 49194
    end_ms: 56128
    text_en: Next Tuesday morning at nine sharp. Send the signed form today and I will lock that rate.
    text_tr: Gelecek salı sabahı tam dokuzda. İmzalı formu bugün gönderin, fiyatı kilitleyeyim.
  key_vocabulary:
  - word: discount
    context_note_tr: toplu alım indirimi
  - word: quote
    context_note_tr: fiyat teklifi
  - word: delivery
    context_note_tr: teslimat ücreti ve süreci
  comprehension_questions:
  - id: q_listening_a2_ordering-annual-stationery-discount_01
    question_en: Why does Defne expect a lower price than the standard catalog quote?
    options:
    - Competitors gave away free printer paper
    - Her office is ordering together for all four floors at once
    - She wants lower-grade thin recycled paper
    - The notebooks arrived late last Tuesday
    correct_answer: Her office is ordering together for all four floors at once
    explanation_en: Defne explains they are combining supplies for all four floors into one bulk order.
    explanation_tr: Defne bu yıl dört katın tamamı için toplu sipariş verdiklerini açıklar.
  - id: q_listening_a2_ordering-annual-stationery-discount_02
    question_en: Why does David appreciate packing one combined order?
    options:
    - Pens weigh less than shipping cartons
    - Packing one big pallet is much simpler for his warehouse
    - Tuesdays have no traffic near the office
    - Quarterly forms eliminate invoice writing
    correct_answer: Packing one big pallet is much simpler for his warehouse
    explanation_en: David notes combining four floors onto one large pallet is much easier to pack.
    explanation_tr: David dört katı tek büyük palette toplamanın depo için çok daha kolay olduğunu belirtir.
  - id: q_listening_a2_ordering-annual-stationery-discount_03
    question_en: What exact discount does David agree to offer?
    options:
    - Eight percent off everything plus free delivery
    - Ten percent off notebooks only
    - Fifteen percent off next year's order
    - Free pens without any shipping discount
    correct_answer: Eight percent off everything plus free delivery
    explanation_en: David compromises at eight percent off the whole order plus free shipping.
    explanation_tr: David her şeyde yüzde sekiz indirim ve ücretsiz kargo ile anlaşır.
  - id: q_listening_a2_ordering-annual-stationery-discount_04
    question_en: When will the stationery shipment arrive?
    options:
    - Friday afternoon before five
    - Tomorrow morning at eight
    - Next Tuesday morning at nine
    - Next month after quarterly close
    correct_answer: Next Tuesday morning at nine
    explanation_en: David confirms delivery next Tuesday morning at nine sharp.
    explanation_tr: David teslimatın gelecek salı sabah tam dokuzda geleceğini söyler.
  - id: q_listening_a2_ordering-annual-stationery-discount_05
    question_en: What must Defne do today to secure the agreed price?
    options:
    - Send back the signed order form
    - Cancel printer paper from the pallet
    - Visit David's warehouse personally
    - Pay two extra delivery drivers in cash
    correct_answer: Send back the signed order form
    explanation_en: David asks Defne to send the signed form today so he can lock the rate.
    explanation_tr: David fiyatı sabitlemek için bugün imzalı formu göndermesini ister.
  topic_tags:
  - negotiation
  - procurement
  - supplies
  related_ids: []
  status: APPROVED
  version: 1
- id: listening.a2.planning-website-banner-change
  title: Updating the Homepage Notice Together
  cefr_level: A2
  category: stakeholder_alignment
  scenario_context: Support lead Burak and web designer Hannah align on wording and placement for an upcoming holiday hours
    banner.
  speakers:
  - id: burak
    name: Burak
    role: Customer Support Lead
    accent: Turkish
  - id: hannah
    name: Hannah
    role: Web Designer
    accent: British
