- id: listening.a2.daily-team-budget-update
  title: Weekly Department Budget Update
  cefr_level: A2
  category: executive_briefing
  scenario_context: Team lead Maya gives junior coordinator Kerem a short update on monthly travel and software spending before
    Friday afternoon.
  speakers:
  - id: maya
    name: Maya
    role: Operations Lead
    accent: British
  - id: kerem
    name: Kerem
    role: Team Coordinator
    accent: Turkish
  audio_ref: audio/listening/a2_daily_team_budget_update.mp3
  duration_seconds: 63
  transcript_items:
  - index: 1
    speaker_id: maya
    start_ms: 0
    end_ms: 7388
    text_en: Good morning, Kerem. Do you have five minutes to check our March department budget together?
    text_tr: Günaydın Kerem. Mart ayı departman bütçemizi birlikte kontrol etmek için beş dakikan var mı?
  - index: 2
    speaker_id: kerem
    start_ms: 7788
    end_ms: 15697
    text_en: Yes, of course, Maya. I updated all hotel and train receipts yesterday afternoon.
    text_tr: Evet, elbette Maya. Tüm otel ve tren fişlerini dün öğleden sonra güncelledim.
  - index: 3
    speaker_id: maya
    start_ms: 16097
    end_ms: 23815
    text_en: Thank you. Travel costs look much calmer this month, about fifteen percent below our limit.
    text_tr: Teşekkürler. Seyahat masrafları bu ay çok daha sakin görünüyor, limitimizin yaklaşık yüzde on beş altında.
  - index: 4
    speaker_id: kerem
    start_ms: 24215
    end_ms: 32543
    text_en: That is great news. However, our video call software renewed early with two extra guest licenses.
    text_tr: Bu harika haber. Ancak görüntülü görüşme yazılımımız iki fazladan misafir lisansıyla erken yenilendi.
  - index: 5
    speaker_id: maya
    start_ms: 32943
    end_ms: 39602
    text_en: Did any department ask for those extra seats, or were they left over from January training?
    text_tr: Herhangi bir departman o ek koltukları istedi mi, yoksa Ocak eğitiminden mi kalmış?
  - index: 6
    speaker_id: kerem
    start_ms: 40002
    end_ms: 47200
    text_en: They were temporary workshop accounts from January. I already canceled them for next month.
    text_tr: Ocak ayından kalan geçici atölye hesaplarıymış. Gelecek ay için onları zaten iptal ettim.
  - index: 7
    speaker_id: maya
    start_ms: 47600
    end_ms: 55073
    text_en: Smart catch. Also, let us delay ordering the two spare monitors until April second.
    text_tr: İyi yakalamışsın. Ayrıca iki yedek monitör siparişini iki Nisan'a kadar erteleyelim.
  - index: 8
    speaker_id: kerem
    start_ms: 55473
    end_ms: 62672
    text_en: Understood. I will save that note on the calendar and send finance our clean Friday summary.
    text_tr: Anlaşıldı. Bu notu takvime kaydedip finans ekibine temiz cuma özetimizi göndereceğim.
  key_vocabulary:
  - word: budget
    context_note_tr: aylık harcama planı, bütçe
  - word: receipts
    context_note_tr: harcama fişleri ve makbuzlar
  - word: delay
    context_note_tr: gecikme, erteleme
  comprehension_questions:
  - id: q_listening_a2_daily-team-budget-update_01
    question_en: How does March travel spending compare to the department limit?
    options:
    - Frozen completely until next January
    - Twenty percent higher than planned
    - Missing every train and hotel receipt
    - About fifteen percent under budget
    correct_answer: About fifteen percent under budget
    explanation_en: Maya confirms travel costs are calm and about fifteen percent below their limit.
    explanation_tr: Maya seyahat giderlerinin limitlerinin yaklaşık yüzde on beş altında olduğunu belirtir.
  - id: q_listening_a2_daily-team-budget-update_02
    question_en: Why did the video software bill look higher this month?
    options:
    - February bills were delayed by bank holidays
    - The software company doubled prices for Kerem
    - New hires accidentally ordered ten extra cameras
    - Two temporary January training licenses remained active
    correct_answer: Two temporary January training licenses remained active
    explanation_en: Kerem explains two temporary January workshop accounts stayed on the renewal.
    explanation_tr: Kerem Ocak atölyesinden kalan iki geçici hesabın yenilemede açık kaldığını açıklar.
  - id: q_listening_a2_daily-team-budget-update_03
    question_en: What has Kerem already done about the unused guest licenses?
    options:
    - Transferred them to the regional sales office
    - Asked guests to pay back the balance
    - Upgraded the whole office to an enterprise contract
    - Canceled them starting next month
    correct_answer: Canceled them starting next month
    explanation_en: Kerem says he already canceled the temporary accounts for next month.
    explanation_tr: Kerem geçici hesapları gelecek ay için şimdiden iptal ettiğini söyler.
  - id: q_listening_a2_daily-team-budget-update_04
    question_en: What equipment order are Maya and Kerem postponing until April second?
    options:
    - Train tickets for Maya
    - Five ergonomic office chairs
    - Two spare monitors
    - New wireless routers
    correct_answer: Two spare monitors
    explanation_en: Maya asks Kerem to delay ordering two spare monitors until April second.
    explanation_tr: Maya iki yedek monitör siparişini iki Nisan'a ertelemelerini ister.
  - id: q_listening_a2_daily-team-budget-update_05
    question_en: Who will receive the updated budget summary?
    options:
    - January workshop guests
    - Building security staff
    - The finance team
    - The video software vendor
    correct_answer: The finance team
    explanation_en: Kerem promises to send finance their clean Friday summary.
    explanation_tr: Kerem temiz cuma özetini finans ekibine göndereceğini söyler.
  topic_tags:
  - budget
  - briefing
  - office
  related_ids: []
  status: APPROVED
