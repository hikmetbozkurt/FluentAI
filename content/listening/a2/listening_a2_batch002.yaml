- id: listening.a2.neighbor-package-delivery
  title: Collecting a Delivered Parcel from a Neighbor
  cefr_level: A2
  category: stakeholder_alignment
  scenario_context: Kerem knocks on his neighbor Emma's apartment door to retrieve an online shopping parcel that the courier
    left with her.
  speakers:
  - id: emma
    name: Emma
    role: Neighbor
    accent: British
  - id: kerem
    name: Kerem
    role: Apartment Resident
    accent: Turkish
  audio_ref: audio/listening/a2_neighbor_package_delivery.mp3
  duration_seconds: 61
  transcript_items:
  - index: 1
    speaker_id: kerem
    start_ms: 0
    end_ms: 7669
    text_en: Hi Emma! Sorry to bother you on a Tuesday evening. Did the courier leave a box for me?
    text_tr: Selam Emma! Bir salı akşamı seni rahatsız ettiğim için kusura bakma. Kurye benim için bir kutu bıraktı mı?
  - index: 2
    speaker_id: emma
    start_ms: 8069
    end_ms: 16242
    text_en: Hello Kerem! Yes, the postal driver rang my doorbell around two o'clock because you were at work.
    text_tr: Merhaba Kerem! Evet, sen işte olduğun için posta şoförü saat iki civarında benim zilimi çaldı.
  - index: 3
    speaker_id: kerem
    start_ms: 16642
    end_ms: 23546
    text_en: Thank you so much for taking it in. It is a new ergonomic keyboard for my home office.
    text_tr: Aldığın için çok teşekkür ederim. Ev ofisim için yeni bir ergonomik klavyeydi.
  - index: 4
    speaker_id: emma
    start_ms: 23946
    end_ms: 31104
    text_en: Here it is. The box was quite light, and it is in perfect condition with no damage.
    text_tr: İşte burada. Kutu oldukça hafifti ve hiç hasar görmemiş, mükemmel durumda.
  - index: 5
    speaker_id: kerem
    start_ms: 31504
    end_ms: 39762
    text_en: I really appreciate your help. If you ever have deliveries when you are away, feel free to use my address.
    text_tr: Yardımın için gerçekten minnettarım. Uzakta olduğunda teslimatların olursa, çekinmeden benim adresimi kullanabilirsin.
  - index: 6
    speaker_id: emma
    start_ms: 40162
    end_ms: 45771
    text_en: That is very kind of you Kerem. Neighbors should look out for each other.
    text_tr: Çok naziksin Kerem. Komşular birbirine göz kulak olmalı.
  - index: 7
    speaker_id: kerem
    start_ms: 46171
    end_ms: 53884
    text_en: By the way, I baked some fresh Turkish walnut cookies yesterday. I will bring some over tomorrow.
    text_tr: Bu arada dün taze Türk cevizli kurabiyesi pişirdim. Yarın biraz getiririm.
  - index: 8
    speaker_id: emma
    start_ms: 54284
    end_ms: 59858
    text_en: Oh, that sounds delicious! Have a wonderful evening Kerem.
    text_tr: Kulağa çok lezzetli geliyor! İyi akşamlar Kerem.
  comprehension_questions:
  - id: q_listening_a2_neighbor-package-delivery_01
    question_en: Why did the postal driver deliver Kerem's package to Emma?
    question_tr_hint: Posta şoförü Kerem'in paketini neden Emma'ya teslim etti?
    options:
    - The package was addressed to Emma by mistake.
    - Kerem's front door was locked with a chain.
    - Kerem forgot his apartment building number.
    - Kerem was away at work when the courier arrived.
    correct_answer: Kerem was away at work when the courier arrived.
    explanation_en: Emma explains the courier rang her bell because Kerem was at work.
    explanation_tr: Emma Kerem işte olduğu için kuryenin kendi zilini çaldığını açıklar.
  - id: q_listening_a2_neighbor-package-delivery_02
    question_en: What item was inside the delivered parcel?
    question_tr_hint: Teslim edilen paketin içinde ne vardı?
    options:
    - A printed paperback novel.
    - A set of ceramic coffee cups.
    - An ergonomic keyboard for Kerem's home office.
    - A pair of leather running shoes.
    correct_answer: An ergonomic keyboard for Kerem's home office.
    explanation_en: Kerem mentions it is a new ergonomic keyboard for his home office.
    explanation_tr: Kerem ev ofisi için yeni ergonomik bir klavye olduğunu söyler.
  - id: q_listening_a2_neighbor-package-delivery_03
    question_en: At approximately what time did the delivery occur?
    question_tr_hint: Teslimat yaklaşık olarak saat kaçta gerçekleşti?
    options:
    - Around two o'clock in the afternoon.
    - At noon sharp.
    - Past midnight on Sunday.
    - At seven o'clock in the morning.
    correct_answer: Around two o'clock in the afternoon.
    explanation_en: Emma notes the driver rang her doorbell around two o'clock.
    explanation_tr: Emma şoförün saat iki civarında zilini çaldığını belirtir.
  - id: q_listening_a2_neighbor-package-delivery_04
    question_en: What reciprocal offer does Kerem make to Emma?
    question_tr_hint: Kerem Emma'ya nasıl karşılıklı bir teklifte bulunuyor?
    options:
    - He offers to drive her to work every morning.
    - He will clean her apartment windows every Saturday.
    - She can have her packages delivered to his apartment when she is away.
    - He will pay for her monthly internet subscription.
    correct_answer: She can have her packages delivered to his apartment when she is away.
    explanation_en: Kerem offers that Emma can use his address for deliveries when away.
    explanation_tr: Kerem Emma'nın uzaktayken teslimatlar için kendi adresini kullanabileceğini teklif eder.
  - id: q_listening_a2_neighbor-package-delivery_05
    question_en: What food item does Kerem promise to share with Emma tomorrow?
    question_tr_hint: Kerem yarın Emma ile hangi yiyeceği paylaşacağına söz veriyor?
    options:
    - Homemade chocolate ice cream.
    - A loaf of freshly baked sourdough bread.
    - Fresh Turkish walnut cookies.
    - A bowl of spicy tomato pasta.
    correct_answer: Fresh Turkish walnut cookies.
    explanation_en: Kerem says he baked fresh Turkish walnut cookies and will bring some over.
    explanation_tr: Kerem cevizli kurabiye pişirdiğini ve yarın getireceğini söyler.
  topic_tags:
  - relationships
  - community
  - neighbors
  - delivery
- id: listening.a2.language-course-registration
  title: Enrolling in an Evening English Class
  cefr_level: A2
  category: stakeholder_alignment
  scenario_context: Zeynep visits a community college continuing education office to register for an evening conversational
    English course with advisor Mark.
  speakers:
  - id: mark
    name: Mark
    role: Course Registration Advisor
    accent: American
  - id: zeynep
    name: Zeynep
    role: Prospective Student
    accent: Turkish
  audio_ref: audio/listening/a2_language_course_registration.mp3
  duration_seconds: 59
  transcript_items:
  - index: 1
    speaker_id: mark
    start_ms: 0
    end_ms: 6708
    text_en: Good afternoon! Are you interested in enrolling in our autumn adult education classes?
    text_tr: Tünaydın! Sonbahar yetişkin eğitimi sınıflarımıza kaydolmakla ilgileniyor musunuz?
  - index: 2
    speaker_id: zeynep
    start_ms: 7108
    end_ms: 14101
    text_en: Yes, I would like to join an intermediate English conversation class that meets after work hours.
    text_tr: Evet, mesai saatlerinden sonra toplanan orta düzey bir İngilizce konuşma sınıfına katılmak istiyorum.
  - index: 3
    speaker_id: mark
    start_ms: 14501
    end_ms: 21435
    text_en: We have an excellent conversational class on Tuesday and Thursday evenings from six thirty to eight thirty.
    text_tr: Salı ve perşembe akşamları altı buçuktan sekiz buçuğa kadar mükemmel bir konuşma sınıfımız var.
  - index: 4
    speaker_id: zeynep
    start_ms: 21835
    end_ms: 28608
    text_en: That schedule fits my working hours perfectly. How many weeks does the course last?
    text_tr: Bu program çalışma saatlerime tam olarak uyuyor. Kurs kaç hafta sürüyor?
  - index: 5
    speaker_id: mark
    start_ms: 29008
    end_ms: 37651
    text_en: The term runs for ten weeks, starting on the fifteenth of next month. Total tuition is two hundred dollars.
    text_tr: Dönem gelecek ayın on beşinde başlayarak on hafta sürüyor. Toplam eğitim ücreti iki yüz dolardır.
  - index: 6
    speaker_id: zeynep
    start_ms: 38051
    end_ms: 43790
    text_en: Do I need to take a placement assessment test before my registration is confirmed?
    text_tr: Kaydım onaylanmadan önce seviye belirleme sınavına girmem gerekiyor mu?
  - index: 7
    speaker_id: mark
    start_ms: 44190
    end_ms: 50883
    text_en: Yes, we have a short fifteen-minute online test to ensure the class level is right for you.
    text_tr: Evet, sınıf seviyesinin sizin için uygun olduğundan emin olmak için on beş dakikalık kısa bir çevrimiçi testimiz
      var.
  - index: 8
    speaker_id: zeynep
    start_ms: 51283
    end_ms: 57942
    text_en: Sounds great. I will complete the online placement test tonight on my computer.
    text_tr: Kulağa harika geliyor. Çevrimiçi seviye belirleme sınavını bu gece bilgisayarımda tamamlayacağım.
  comprehension_questions:
  - id: q_listening_a2_language-course-registration_01
    question_en: What type of course is Zeynep looking for?
    question_tr_hint: Zeynep ne tür bir kurs arıyor?
    options:
    - A weekend beginner French cooking workshop.
    - A full-time morning intensive medical degree.
    - An online advanced computer programming course.
    - An intermediate English conversation class meeting after work hours.
    correct_answer: An intermediate English conversation class meeting after work hours.
    explanation_en: Zeynep states she wants an intermediate English conversation class after work hours.
    explanation_tr: Zeynep iş saatlerinden sonra orta düzey bir konuşma sınıfı istediğini belirtir.
  - id: q_listening_a2_language-course-registration_02
    question_en: On which days and times does the course meet?
    question_tr_hint: Kurs hangi günlerde ve saatlerde toplanıyor?
    options:
    - Monday and Wednesday mornings from 9:00 to 11:00 AM.
    - Saturday afternoons from 1:00 to 5:00 PM.
    - Every day during lunch hour.
    - Tuesday and Thursday evenings from 6:30 to 8:30 PM.
    correct_answer: Tuesday and Thursday evenings from 6:30 to 8:30 PM.
    explanation_en: Mark confirms Tuesday and Thursday evenings from 6:30 to 8:30 PM.
    explanation_tr: Mark salı ve perşembe akşamları 18:30 ile 20:30 arasında olduğunu onaylar.
  - id: q_listening_a2_language-course-registration_03
    question_en: How long is the course duration and what is the tuition?
    question_tr_hint: Kurs süresi ne kadardır ve eğitim ücreti nedir?
    options:
    - Six months free of charge.
    - Three weeks for five hundred dollars.
    - One full year for fifty dollars.
    - Ten weeks for two hundred dollars.
    correct_answer: Ten weeks for two hundred dollars.
    explanation_en: Mark states the term runs for 10 weeks and tuition is $200.
    explanation_tr: Mark dönemin 10 hafta olduğunu ve ücretin 200 dolar olduğunu söyler.
  - id: q_listening_a2_language-course-registration_04
    question_en: What must Zeynep complete before registration is confirmed?
    question_tr_hint: Kaydı onaylanmadan önce Zeynep neyi tamamlamalıdır?
    options:
    - A medical physical examination at a clinic.
    - A short fifteen-minute online placement assessment test.
    - An in-person interview with the university president.
    - A formal three-hour written grammar dissertation.
    correct_answer: A short fifteen-minute online placement assessment test.
    explanation_en: Mark explains she needs a short 15-minute online placement test.
    explanation_tr: Mark 15 dakikalık kısa bir çevrimiçi seviye belirleme sınavı gerektiğini açıklar.
  - id: q_listening_a2_language-course-registration_05
    question_en: When does Zeynep plan to take the online placement test?
    question_tr_hint: Zeynep çevrimiçi seviye belirleme sınavına ne zaman girmeyi planlıyor?
    options:
    - In two weeks after returning from vacation.
    - Tonight on her computer.
    - Next month after classes begin.
    - Tomorrow morning at the university campus.
    correct_answer: Tonight on her computer.
    explanation_en: Zeynep says she will complete the online test tonight on her computer.
    explanation_tr: Zeynep çevrimiçi testi bu gece bilgisayarında tamamlayacağını söyler.
  topic_tags:
  - education
  - registration
  - language-learning
  - college
