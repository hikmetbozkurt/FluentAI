- id: listening.a2.it-support-ticket
  title: 'Helpdesk Call: Password Reset and Account Access'
  cefr_level: A2
  category: incident_response
  scenario_context: Can, a new data analyst, calls the company IT helpdesk because his account is locked after entering the
    wrong password three times.
  speakers:
  - id: can
    name: Can
    role: Data Analyst
    accent: Turkish
  - id: maya
    name: Maya
    role: IT Support Specialist
    accent: British
  audio_ref: audio/listening/a2_it_support_ticket.mp3
  duration_seconds: 54
  transcript_items:
  - index: 1
    speaker_id: maya
    start_ms: 0
    end_ms: 6749
    text_en: Hello, IT Helpdesk, Maya speaking. How can I help you today?
    text_tr: Merhaba, IT Destek Hattı, ben Maya. Bugün size nasıl yardımcı olabilirim?
  - index: 2
    speaker_id: can
    start_ms: 7149
    end_ms: 15838
    text_en: Hi Maya, my name is Can. I cannot log into my company email. My account is locked.
    text_tr: Merhaba Maya, benim adım Can. Şirket e-postama giriş yapamıyorum. Hesabım kilitlendi.
  - index: 3
    speaker_id: maya
    start_ms: 16238
    end_ms: 22716
    text_en: No problem, Can. Did you enter the wrong password multiple times?
    text_tr: Sorun değil Can. Yanlış şifreyi birkaç kez mi girdiniz?
  - index: 4
    speaker_id: can
    start_ms: 23116
    end_ms: 29695
    text_en: Yes, I typed it three times incorrectly after updating my laptop system this morning.
    text_tr: Evet, bu sabah dizüstü bilgisayar sistemimi güncelledikten sonra üç kez yanlış yazdım.
  - index: 5
    speaker_id: maya
    start_ms: 30095
    end_ms: 37488
    text_en: I understand. I am sending a secure temporary reset code to your registered mobile phone now.
    text_tr: Anlıyorum. Şimdi kayıtlı cep telefonunuza güvenli bir geçici sıfırlama kodu gönderiyorum.
  - index: 6
    speaker_id: can
    start_ms: 37888
    end_ms: 44692
    text_en: I received the SMS code. I will create a new twelve-character password right now.
    text_tr: SMS kodunu aldım. Hemen şimdi on iki karakterli yeni bir şifre oluşturacağım.
  - index: 7
    speaker_id: maya
    start_ms: 45092
    end_ms: 53315
    text_en: Great! Please call us back if you encounter any other technical difficulties. Have a good day.
    text_tr: Harika! Başka bir teknik sorunla karşılaşırsanız lütfen bizi tekrar arayın. İyi günler.
  key_vocabulary:
  - word: office
    vocab_id: vocab.office
    context_note_tr: Çalışılan şirket ofisi veya çalışma ortamı.
  - word: receive
    vocab_id: vocab.receive
    context_note_tr: Mesaj veya sıfırlama kodunu teslim almak.
  comprehension_questions:
  - id: q_a2_it_01
    question_en: Why is Can unable to access his company email account?
    question_tr_hint: Can neden şirket e-posta hesabına erişememektedir?
    options:
    - His account was locked after he entered an incorrect password three times
    - His company laptop was permanently confiscated by building security guards
    - He forgot his own full name and employee identification number
    - The entire corporate internet network was disconnected for holiday renovations
    correct_answer: His account was locked after he entered an incorrect password three times
    explanation_en: Can explains that he entered his password incorrectly three times after a system update, locking the account.
    explanation_tr: Can, sistem güncellemesinden sonra şifresini üç kez yanlış girdiği için hesabının kilitlendiğini belirtir.
  - id: q_a2_it_02
    question_en: How does Maya deliver the temporary verification code to Can?
    question_tr_hint: Maya geçici doğrulama kodunu Can'a nasıl ulaştırmaktadır?
    options:
    - By printing a physical letter and mailing it through postal services
    - By asking a colleague to announce the code over the office loudspeaker
    - By sending a secure text message to his registered mobile phone
    - By uploading the code publicly to the corporate marketing website
    correct_answer: By sending a secure text message to his registered mobile phone
    explanation_en: Maya confirms she is sending a temporary reset code to Can's registered mobile phone via SMS.
    explanation_tr: Maya, Can'ın kayıtlı cep telefonuna SMS ile geçici bir sıfırlama kodu gönderdiğini teyit eder.
  - id: q_a2_it_03
    question_en: When did Can begin experiencing the password problem?
    question_tr_hint: Can şifre sorununu ne zaman yaşamaya başlamıştır?
    options:
    - Three weeks ago during an overseas business vacation
    - This morning after performing a system update on his laptop
    - Last year before joining the company's data department
    - Late yesterday evening while driving his personal car home
    correct_answer: This morning after performing a system update on his laptop
    explanation_en: 'Can states: ''I typed it three times incorrectly after updating my laptop system this morning.'''
    explanation_tr: 'Can: ''Bu sabah dizüstü bilgisayar sistemimi güncelledikten sonra üç kez yanlış yazdım'' demektedir.'
  - id: q_a2_it_04
    question_en: What length of password is Can planning to set up?
    question_tr_hint: Can nasıl bir şifre belirlemeyi planlamaktadır?
    options:
    - A four-digit numerical banking PIN
    - A single capital letter with no numbers
    - A fifty-word philosophical quotation
    - A twelve-character password
    correct_answer: A twelve-character password
    explanation_en: 'Can confirms: ''I will create a new twelve-character password right now.'''
    explanation_tr: 'Can: ''Hemen şimdi on iki karakterli yeni bir şifre oluşturacağım'' der.'
  - id: q_a2_it_05
    question_en: What final advice does Maya offer before ending the phone call?
    question_tr_hint: Maya görüşmeyi sonlandırmadan önce hangi tavsiyede bulunmaktadır?
    options:
    - To immediately purchase a brand new personal laptop computer
    - To refrain from using corporate computers for the rest of the week
    - To call helpdesk back if he encounters further technical difficulties
    - To delete all existing spreadsheet files stored on his hard drive
    correct_answer: To call helpdesk back if he encounters further technical difficulties
    explanation_en: Maya politely asks him to call back if he encounters any other technical difficulties.
    explanation_tr: Maya başka teknik sorunlarla karşılaşması halinde yardım masasını tekrar aramasını söyler.
  topic_tags:
  - it-support
  - helpdesk
  - troubleshooting
  - workplace-basics
  related_ids:
  - vocab.office
  - vocab.receive
  status: APPROVED
  version: 1
- id: listening.a2.office-equipment-delivery
  title: 'Delivery Coordination: Ergonomic Office Chairs'
  cefr_level: A2
  category: engineering_meeting
  scenario_context: Zeynep and Alex coordinate the arrival of twenty ergonomic chairs and new computer monitors on the third
    floor.
  speakers:
  - id: zeynep
    name: Zeynep
    role: HR Assistant
    accent: Turkish
  - id: alex
    name: Alex
    role: Office Coordinator
    accent: American
  audio_ref: audio/listening/a2_office_equipment.mp3
  duration_seconds: 41
  transcript_items:
  - index: 1
    speaker_id: zeynep
    start_ms: 0
    end_ms: 5869
    text_en: Alex, the delivery van has just arrived downstairs at the main entrance.
    text_tr: Alex, teslimat kamyoneti az önce ana girişe aşağıya geldi.
  - index: 2
    speaker_id: alex
    start_ms: 6269
    end_ms: 12727
    text_en: Great! Are all twenty ergonomic office chairs included in this morning's shipment?
    text_tr: Harika! Bu sabahki sevkiyata yirmi ergonomik ofis koltuğunun tümü dahil mi?
  - index: 3
    speaker_id: zeynep
    start_ms: 13127
    end_ms: 19460
    text_en: Yes, twenty chairs and ten dual-monitor desk mounts are inside the delivery boxes.
    text_tr: Evet, teslimat kutularının içinde yirmi koltuk ve on adet çift monitörlü masa aparatı var.
  - index: 4
    speaker_id: alex
    start_ms: 19860
    end_ms: 25159
    text_en: We should use the large service elevator on the left to move them up to the third floor.
    text_tr: Onları üçüncü kata çıkarmak için sol taraftaki büyük servis asansörünü kullanmalıyız.
  - index: 5
    speaker_id: zeynep
    start_ms: 25559
    end_ms: 32368
    text_en: Good idea. I will ask the facilities team to help us assemble the chairs after lunch.
    text_tr: İyi fikir. Öğle yemeğinden sonra koltukları monte etmemize yardım etmesi için bina teknik ekibine danışacağım.
  - index: 6
    speaker_id: alex
    start_ms: 32768
    end_ms: 40471
    text_en: Sounds like a solid plan. Let's go sign the delivery receipt right now so the driver can unload.
    text_tr: Sağlam bir plan gibi görünüyor. Sürücünün eşyaları indirebilmesi için hemen şimdi teslimat makbuzunu imzalamaya
      gidelim.
  key_vocabulary:
  - word: deliver
    vocab_id: vocab.deliver
    context_note_tr: Sipariş edilen eşyaların adrese teslim edilmesi.
  - word: office
    vocab_id: vocab.office
    context_note_tr: Şirket çalışma binası ve çalışma alanı.
  comprehension_questions:
  - id: q_a2_deliv_01
    question_en: How many ergonomic chairs arrived in the delivery van?
    question_tr_hint: Teslimat kamyonetinde kaç adet ergonomik koltuk gelmiştir?
    options:
    - Twenty ergonomic chairs
    - Five plastic stools
    - One hundred wooden dining chairs
    - Three antique armchairs
    correct_answer: Twenty ergonomic chairs
    explanation_en: Alex asks if all twenty chairs are included, and Zeynep confirms there are twenty chairs.
    explanation_tr: Alex yirmi koltuğun da dahil olup olmadığını sorar ve Zeynep yirmi koltuk olduğunu onaylar.
  - id: q_a2_deliv_02
    question_en: Which floor will the new equipment be moved to?
    question_tr_hint: Yeni ekipmanlar hangi kata taşınacaktır?
    options:
    - The basement parking lot
    - The roof garden terrace
    - The tenth floor boardroom
    - The third floor
    correct_answer: The third floor
    explanation_en: Alex specifies using the service elevator to take them to the third floor.
    explanation_tr: Alex eşyaları üçüncü kata çıkarmak için servis asansörünü kullanmayı belirtir.
  - id: q_a2_deliv_03
    question_en: How do Alex and Zeynep plan to transport the heavy delivery boxes upstairs?
    question_tr_hint: Alex ve Zeynep ağır teslimat kutularını yukarıya nasıl taşımayı planlamaktadır?
    options:
    - By carrying them one by one up the fire escape staircase
    - By using the large service elevator on the left
    - By hiring a commercial helicopter crane
    - By sliding them along the hallway floor with ropes
    correct_answer: By using the large service elevator on the left
    explanation_en: 'Alex explicitly suggests: ''We should use the large service elevator on the left.'''
    explanation_tr: 'Alex: ''Onları çıkarmak için sol taraftaki büyük servis asansörünü kullanmalıyız'' der.'
  - id: q_a2_deliv_04
    question_en: When will the chairs be assembled?
    question_tr_hint: Koltuklar ne zaman monte edilecektir?
    options:
    - After lunch with assistance from the facilities team
    - Next month during the annual company retreat
    - Immediately at midnight by external security guards
    - During tomorrow's quarterly shareholder meeting
    correct_answer: After lunch with assistance from the facilities team
    explanation_en: Zeynep says she will ask facilities for help assembling the chairs after lunch.
    explanation_tr: Zeynep öğle yemeğinden sonra montaj için teknik ekipten yardım isteyeceğini belirtir.
  - id: q_a2_deliv_05
    question_en: What immediate action must Alex and Zeynep take downstairs?
    question_tr_hint: Alex ve Zeynep'in aşağıda atması gereken acil adım nedir?
    options:
    - Paying the driver five thousand dollars in cash banknotes
    - Washing the exterior windows of the delivery truck
    - Cooking lunch for the warehouse logistics crew
    - Signing the delivery receipt so the driver can unload the boxes
    correct_answer: Signing the delivery receipt so the driver can unload the boxes
    explanation_en: 'Alex says: ''Let''s go sign the delivery receipt right now so the driver can unload.'''
    explanation_tr: Alex sürücünün indirebilmesi için teslimat makbuzunu imzalamaya gitmeyi önerir.
  topic_tags:
  - facilities
  - office-logistics
  - coordination
  - equipment
  related_ids:
  - vocab.deliver
  - vocab.office
  status: APPROVED
