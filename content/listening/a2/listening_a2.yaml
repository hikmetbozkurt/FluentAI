- id: listening.a2.scheduling-team-lunch
  title: 'Team Celebration: Organizing Friday Lunch'
  cefr_level: A2
  category: stakeholder_alignment
  scenario_context: Burak, a software intern, and Sarah, his engineering manager, discuss arranging a team lunch to celebrate
    shipping the mobile app update.
  speakers:
  - id: burak
    name: Burak
    role: Software Intern
    accent: Turkish
  - id: sarah
    name: Sarah
    role: Engineering Team Lead
    accent: British
  audio_ref: audio/listening/a2_team_lunch.mp3
  duration_seconds: 51
  transcript_items:
  - index: 1
    speaker_id: sarah
    start_ms: 0
    end_ms: 8414
    text_en: Burak, since our team successfully deployed the app update yesterday, we should organize a team lunch on Friday.
    text_tr: Burak, ekibimiz dün uygulama güncellemesini başarıyla yayına aldığına göre Cuma günü bir ekip yemeği düzenlemeliyiz.
  - index: 2
    speaker_id: burak
    start_ms: 8814
    end_ms: 16372
    text_en: That sounds wonderful, Sarah! Should we reserve a table at the Italian bistro near the park?
    text_tr: Kulağa harika geliyor Sarah! Parkın yakınındaki İtalyan bistrosunda masa ayırtalım mı?
  - index: 3
    speaker_id: sarah
    start_ms: 16772
    end_ms: 25180
    text_en: That restaurant is lovely. However, please remember that Elena is vegetarian and Murat cannot eat gluten.
    text_tr: O restoran çok güzel. Ancak lütfen Elena'nın vejetaryen olduğunu ve Murat'ın glüten tüketemediğini unutma.
  - index: 4
    speaker_id: burak
    start_ms: 25580
    end_ms: 33778
    text_en: I checked their menu online. They offer certified gluten-free pasta and several fresh vegetarian salads.
    text_tr: İnternetten menülerini kontrol ettim. Sertifikalı glütensiz makarna ve birkaç taze vejetaryen salata sunuyorlar.
  - index: 5
    speaker_id: sarah
    start_ms: 34178
    end_ms: 41551
    text_en: Excellent research! What time works best between our scheduled code reviews and customer demos?
    text_tr: Mükemmel araştırma! Planlanan kod incelemelerimiz ve müşteri demolarımız arasında en uygun saat hangisi?
  - index: 6
    speaker_id: burak
    start_ms: 41951
    end_ms: 50269
    text_en: Everyone is completely free between twelve-thirty and two o'clock. I will book a table for eight people at twelve-thirty.
    text_tr: Herkes on iki buçuk ile iki arası tamamen müsait. On iki buçuğa sekiz kişilik bir masa ayırtacağım.
  key_vocabulary:
  - word: collaborate
    vocab_id: vocab.collaborate
    context_note_tr: Ekip arkadaşlarıyla ortak etkinlik ve planlamada iş birliği yapmak.
  - word: customer
    vocab_id: vocab.customer
    context_note_tr: Şirketin ürün ve hizmetlerini kullanan müşteri kitlesi.
  comprehension_questions:
  - id: q_a2_lunch_01
    question_en: What milestone is the engineering team celebrating with Friday's lunch?
    question_tr_hint: Mühendislik ekibi Cuma günkü yemekle hangi başarıyı kutlamaktadır?
    options:
    - Signing a ten-year corporate office lease agreement
    - Successfully deploying the mobile app update
    - Moving the entire engineering team to a foreign branch
    - Purchasing eighty brand new desktop computers
    correct_answer: Successfully deploying the mobile app update
    explanation_en: 'Sarah opens by saying: ''since our team successfully deployed the app update yesterday, we should organize
      a team lunch.'''
    explanation_tr: Sarah ekibin dün uygulama güncellemesini başarıyla yayına almasını kutlamak istediklerini söyler.
  - id: q_a2_lunch_02
    question_en: What dietary restriction does Murat have?
    question_tr_hint: Murat'ın hangi beslenme kısıtlaması bulunmaktadır?
    options:
    - He is allergic to drinking clean water
    - He strictly eats only raw meat
    - He cannot eat gluten
    - He cannot consume any hot cooked food
    correct_answer: He cannot eat gluten
    explanation_en: 'Sarah explicitly notes: ''Elena is vegetarian and Murat cannot eat gluten.'''
    explanation_tr: Sarah açıkça Elena'nın vejetaryen olduğunu ve Murat'ın glüten tüketemediğini belirtir.
  - id: q_a2_lunch_03
    question_en: Why is the suggested Italian bistro suitable for the whole team?
    question_tr_hint: Önerilen İtalyan bistrosu tüm ekip için neden uygundur?
    options:
    - It serves certified gluten-free pasta and vegetarian salads
    - It gives free laptop chargers to every customer
    - It has no chairs so everyone stands during the meal
    - It serves only sugary desserts and chocolate shakes
    correct_answer: It serves certified gluten-free pasta and vegetarian salads
    explanation_en: Burak checked the online menu and confirmed they offer gluten-free pasta and vegetarian options.
    explanation_tr: Burak internetten menüyü incelemiş ve glütensiz makarna ile vejetaryen seçeneklerin bulunduğunu teyit
      etmiştir.
  - id: q_a2_lunch_04
    question_en: What time is the lunch reservation scheduled for?
    question_tr_hint: Yemek rezervasyonu saat kaça planlanmaktadır?
    options:
    - Nine o'clock in the morning
    - Six o'clock in the evening
    - Twelve-thirty in the afternoon
    - Eleven o'clock at night
    correct_answer: Twelve-thirty in the afternoon
    explanation_en: 'Burak states: ''I will book a table for eight people at twelve-thirty.'''
    explanation_tr: Burak on iki buçuğa sekiz kişilik masa ayırtacağını belirtir.
  - id: q_a2_lunch_05
    question_en: How many seats will Burak reserve at the restaurant?
    question_tr_hint: Burak restoranda kaç kişilik yer ayırtacaktır?
    options:
    - Two people
    - Eight people
    - Twenty-five people
    - Fifty people
    correct_answer: Eight people
    explanation_en: Burak confirms he is booking a table for eight people.
    explanation_tr: Burak sekiz kişilik bir masa ayırtacağını ifade eder.
  topic_tags:
  - team-building
  - social
  - workplace-culture
  - scheduling
  related_ids:
  - vocab.collaborate
  - vocab.customer
  status: APPROVED
  version: 1
- id: listening.a2.new-hire-orientation-call
  title: 'Onboarding Check-In: First Week Essentials'
  cefr_level: A2
  category: product_discovery
  scenario_context: David, a senior mentor, welcomes Deniz, a junior frontend developer, and reviews his first-week orientation
    schedule and tools.
  speakers:
  - id: david
    name: David
    role: Senior Engineer
    accent: American
  - id: deniz
    name: Deniz
    role: Junior Developer
    accent: Turkish
  audio_ref: audio/listening/a2_new_hire_orientation.mp3
  duration_seconds: 48
  transcript_items:
  - index: 1
    speaker_id: david
    start_ms: 0
    end_ms: 6899
    text_en: Good morning Deniz, and welcome to the team! How was your very first day yesterday?
    text_tr: Günaydın Deniz, ekibe hoş geldin! Dünkü ilk günün nasıl geçti?
  - index: 2
    speaker_id: deniz
    start_ms: 7299
    end_ms: 15352
    text_en: Good morning David! It was great. I set up my development environment and configured Git.
    text_tr: Günaydın David! Harikaydı. Geliştirme ortamımı kurdum ve Git ayarlarımı yaptım.
  - index: 3
    speaker_id: david
    start_ms: 15752
    end_ms: 23595
    text_en: Fantastic. Today our main goal is to review our team channels on Slack and our sprint board on Jira.
    text_tr: Harika. Bugün temel hedefimiz Slack üzerindeki ekip kanallarımızı ve Jira üzerindeki sprint panomuzu incelemek.
  - index: 4
    speaker_id: deniz
    start_ms: 23995
    end_ms: 31403
    text_en: Sounds good. Where should I post questions if I encounter an error while running the build scripts?
    text_tr: Kulağa iyi geliyor. Derleme komutlarını çalıştırırken bir hatayla karşılaşırsam sorularımı nereye yazmalıyım?
  - index: 5
    speaker_id: david
    start_ms: 31803
    end_ms: 39167
    text_en: Always post them in the dev-help channel. We also pair program every afternoon from two to three.
    text_tr: Her zaman dev-help kanalına yaz. Ayrıca her öğleden sonra iki ile üç arası eşli programlama (pair programming)
      yapıyoruz.
  - index: 6
    speaker_id: deniz
    start_ms: 39567
    end_ms: 47010
    text_en: That is very reassuring. I will review the documentation and join the pairing session at two o'clock.
    text_tr: Bu çok rahatlatıcı. Dokümantasyonu inceleyip saat ikideki eşli çalışma oturumuna katılacağım.
  key_vocabulary:
  - word: professional
    vocab_id: vocab.professional
    context_note_tr: İş ortamında sergilenen yetkin ve saygılı profesyonel tutum.
  - word: support
    vocab_id: vocab.support-v
    context_note_tr: Yeni katılan ekip üyesine rehberlik ve destek sağlama.
  comprehension_questions:
  - id: q_a2_orient_01
    question_en: What did Deniz successfully finish during his first day at work?
    question_tr_hint: Deniz işteki ilk gününde neyi başarıyla tamamlamıştır?
    options:
    - Deploying a major architectural database migration to live servers
    - Conducting annual performance appraisals for twenty senior directors
    - Negotiating an international cloud contract with foreign investors
    - Setting up his development environment and configuring Git
    correct_answer: Setting up his development environment and configuring Git
    explanation_en: 'Deniz confirms: ''I set up my development environment and configured Git.'''
    explanation_tr: Deniz geliştirme ortamını kurduğunu ve Git yapılandırmasını yaptığını söyler.
  - id: q_a2_orient_02
    question_en: Which Slack channel should Deniz use when asking technical build questions?
    question_tr_hint: Deniz teknik derleme soruları sorarken hangi Slack kanalını kullanmalıdır?
    options:
    - The general-announcements channel
    - The executive-boardroom channel
    - The dev-help channel
    - The random-jokes channel
    correct_answer: The dev-help channel
    explanation_en: 'David instructs: ''Always post them in the dev-help channel.'''
    explanation_tr: David her zaman dev-help kanalına yazmasını belirtir.
  - id: q_a2_orient_03
    question_en: At what time does the daily pair programming session take place?
    question_tr_hint: Günlük eşli programlama (pair programming) oturumu saat kaçta gerçekleşmektedir?
    options:
    - Between two and three in the afternoon
    - At seven o'clock in the early morning
    - Between nine and ten at night
    - During the Sunday morning weekend breakfast
    correct_answer: Between two and three in the afternoon
    explanation_en: 'David explains: ''We also pair program every afternoon from two to three.'''
    explanation_tr: David her öğleden sonra iki ile üç arası eşli programlama yaptıklarını açıklar.
  - id: q_a2_orient_04
    question_en: What are the two tools David wants Deniz to review today?
    question_tr_hint: David bugün Deniz'in incelemesini istediği iki araç hangisidir?
    options:
    - Word processing documents and personal bank statements
    - Analog telephone lines and printed paper encyclopedias
    - Cryptocurrency wallets and video game consoles
    - Slack channels and the Jira sprint board
    correct_answer: Slack channels and the Jira sprint board
    explanation_en: David states the goal is to review team channels on Slack and the sprint board on Jira.
    explanation_tr: David Slack ekip kanallarını ve Jira sprint panosunu incelemenin bugünkü hedef olduğunu söyler.
  - id: q_a2_orient_05
    question_en: How does Deniz react to learning about the daily pairing session?
    question_tr_hint: Deniz günlük eşli çalışma oturumunu öğrenince nasıl bir tepki vermektedir?
    options:
