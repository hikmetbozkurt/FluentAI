- id: reading.a2.budgeting-starter-guide
  title: Simple Budgeting Techniques for New Technology Projects
  cefr_level: A2
  category: finance_and_economics
  summary_en: A beginner's guide to tracking direct software costs, hardware subscriptions, labor hours, and building realistic
    contingency reserves for small projects.
  summary_tr: Yeni projeler için doğrudan yazılım maliyetlerini, donanım aboneliklerini, çalışma saatlerini izleme ve beklenmedik
    durum payı oluşturma rehberi.
  word_count: 142
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: Why Every Project Needs a Budget
    content_en: Starting an exciting new software project is rewarding, but technical passion without financial discipline
      leads to premature failure. Without a clear budget, small expenses like cloud hosting fees, software licenses, and contractor
      hours accumulate rapidly. Creating an initial cost estimate ensures your team has enough capital to finish what you
      start.
    content_tr: Heyecan verici yeni bir yazılım projesine başlamak tatmin edicidir, ancak finansal disiplin olmadan teknik
      tutku erken başarısızlığa yol açar. Net bir bütçe olmadan bulut barındırma ücretleri, yazılım lisansları ve yüklenici
      saatleri gibi küçük harcamalar hızla birikir. Başlangıç maliyet tahmini oluşturmak, ekibinizin başladığı işi bitirmek
      için yeterli sermayeye sahip olmasını sağlar.
  - paragraph_index: 2
    title: Categorizing Direct and Indirect Costs
    content_en: 'To organize your project expenses, separate costs into two main categories: fixed direct costs and variable
      expenses. Direct costs include monthly server subscriptions and required developer software tools. Variable expenses
      fluctuate based on workload, such as freelance design help or promotional digital marketing campaigns.'
    content_tr: 'Proje harcamalarınızı düzenlemek için maliyetleri iki ana kategoriye ayırın: sabit doğrudan maliyetler ve
      değişken giderler. Doğrudan maliyetler aylık sunucu aboneliklerini ve gerekli yazılımcı araçlarını içerir. Değişken
      harcamalar serbest zamanlı tasarım yardımı veya dijital tanıtım kampanyaları gibi iş yüküne göre dalgalanır.'
  - paragraph_index: 3
    title: Building a Contingency Buffer
    content_en: Experienced project managers know that unexpected challenges always occur. An API provider might increase
      its pricing, or unexpected security testing might require extra hours. Always add a ten to fifteen percent contingency
      reserve to your overall budget. This financial cushion prevents minor surprises from halting your project.
    content_tr: Deneyimli proje yöneticileri beklenmedik zorlukların her zaman ortaya çıkacağını bilir. Bir API sağlayıcısı
      fiyatlarını artırabilir veya beklenmedik güvenlik testleri fazladan saatler gerektirebilir. Genel bütçenize her zaman
      yüzde on ila on beşlik bir beklenmedik durum payı (yedek akçe) ekleyin. Bu finansal tampon, küçük sürprizlerin projenizi
      durdurmasını önler.
  vocabulary_annotations:
  - word: contingency
    vocab_id: vocab.contingency
    context_definition_en: A provision for an unforeseen event or future emergency.
    context_meaning_tr: Öngörülemeyen bir durum veya acil hal için ayrılan pay.
  - word: software
    vocab_id: vocab.software
    context_definition_en: The programs and other operating information used by a computer or electronic device.
    context_meaning_tr: yazılım
  comprehension_questions:
  - id: q_r_a2_06_01
    question_en: What often happens when technical teams lack financial discipline?
    question_tr_hint: Teknik ekiplerde finansal disiplin olmadığında sıklıkla ne olur?
    options:
    - The software code converts into machine binary automatically
    - All developers are promoted to senior executive roles immediately
    - Expenses accumulate rapidly and the project may fail prematurely
    - The company website receives millions of visits without marketing
    correct_answer: Expenses accumulate rapidly and the project may fail prematurely
    explanation_en: Paragraph 1 explains that without financial discipline, expenses accumulate and projects fail.
    explanation_tr: 1. paragraf finansal disiplin olmadığında harcamaların hızla biriktiğini ve projenin çöktüğünü belirtir.
  - id: q_r_a2_06_02
    question_en: Which expense is considered a direct fixed cost in the article?
    question_tr_hint: Makalede hangi harcama doğrudan sabit maliyet olarak kabul edilir?
    options:
    - Catering for an annual corporate celebration banquet
    - Monthly cloud server subscriptions and developer software tools
    - New office furniture for visiting foreign dignitaries
    - Television advertisements during international sporting events
    correct_answer: Monthly cloud server subscriptions and developer software tools
    explanation_en: Paragraph 2 lists monthly server subscriptions and software tools as direct costs.
    explanation_tr: 2. paragraf aylık sunucu aboneliklerini ve geliştirici araçlarını doğrudan maliyet sayar.
  - id: q_r_a2_06_03
    question_en: Why should project managers include a contingency reserve?
    question_tr_hint: Proje yöneticileri neden bir beklenmedik durum payı eklemelidir?
    options:
    - To pay personal holiday bonuses to company executives
    - To replace all office desks with gold-plated furniture
    - To invest in speculative real estate markets overseas
    - To absorb unexpected price increases and unforeseen technical hours
    correct_answer: To absorb unexpected price increases and unforeseen technical hours
    explanation_en: Paragraph 3 states that a contingency buffer handles unexpected costs without halting work.
    explanation_tr: 3. paragraf bu payın beklenmedik fiyat artışlarını karşılayıp işin durmasını önlediğini açıklar.
  - id: q_r_a2_06_04
    question_en: What percentage range is recommended for the contingency buffer?
    question_tr_hint: Beklenmedik durum payı için hangi yüzde aralığı önerilmektedir?
    options:
    - Exactly eighty-five percent of all company revenue
    - Less than zero point zero one percent
    - Between ten and fifteen percent of the overall budget
    - Fifty percent every single morning
    correct_answer: Between ten and fifteen percent of the overall budget
    explanation_en: Paragraph 3 recommends adding a ten to fifteen percent contingency reserve.
    explanation_tr: 3. paragraf yüzde 10 ila 15 oranında pay eklenmesini önerir.
  - id: q_r_a2_06_05
    question_en: What is a variable expense according to the passage?
    question_tr_hint: Metne göre değişken gider nedir?
    options:
    - An expense that changes depending on workload, such as freelance design help
    - A fixed yearly fee charged by the national government
    - The price of paper clips purchased five years ago
    - The salary of the company's full-time permanent president
    correct_answer: An expense that changes depending on workload, such as freelance design help
    explanation_en: Paragraph 2 defines variable expenses as those that fluctuate, like freelance help.
    explanation_tr: 2. paragraf değişken harcamaların serbest zamanlı tasarımcı gibi iş yüküne göre değiştiğini söyler.
  topic_tags:
