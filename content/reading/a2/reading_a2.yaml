- id: reading.a2.customer-email-etiquette
  title: Writing Polite Professional Emails to International Clients
  cefr_level: A2
  category: workplace_communication
  summary_en: Essential guidelines for composing clear, respectful emails in English, including greeting conventions, clear
    calls to action, and courteous closing sign-offs.
  summary_tr: 'Uluslararası müşterilere açık ve saygılı e-postalar yazma rehberi: selamlama kuralları, net eylem çağrıları
    ve kibar kapanış kalıpları.'
  word_count: 172
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: First Impressions and Greetings
    content_en: In modern international business, the tone of your opening sentence establishes the relationship with your
      client. Using overly informal greetings like 'Hey' can sound unprofessional to new business partners. Instead, use 'Dear
      Mr. Smith' or 'Dear Alex' depending on your familiarity with the person. If you are writing to a group, 'Dear Team'
      or 'Hello everyone' is both friendly and appropriate.
    content_tr: Modern uluslararası iş dünyasında, açılış cümlenizin tonu müşterinizle olan ilişkinizi belirler. 'Hey' gibi
      aşırı samimi selamlamalar kullanmak yeni iş ortaklarına gayri profesyonel gelebilir. Bunun yerine tanışıklık derecenize
      göre 'Dear Mr. Smith' veya 'Dear Alex' kullanın. Bir gruba yazıyorsanız 'Dear Team' veya 'Hello everyone' hem samimi
      hem uygundur.
  - paragraph_index: 2
    title: Clarity in the Message Body
    content_en: Business professionals receive dozens of emails every day, so long paragraphs are often skipped. State the
      primary purpose of your message in the very first or second sentence. If you are requesting an action or sharing feedback,
      use concise bullet points. This visual structure allows the client to scan the information quickly and understand what
      you need.
    content_tr: İş insanları her gün düzinelerce e-posta alır, bu nedenle uzun paragraflar genellikle atlanır. Mesajınızın
      asıl amacını ilk veya ikinci cümlede belirtin. Bir eylem talep ediyorsanız veya geri bildirim paylaşıyorsanız kısa madde
      işaretleri kullanın. Bu görsel yapı, müşterinin bilgileri hızla taramasına ve neye ihtiyacınız olduğunu anlamasına olanak
      tanır.
  - paragraph_index: 3
    title: Courteous Closing and Next Steps
    content_en: Always conclude your message with a polite sign-off and a clear expectation for next steps. Phrases like 'Please
      let me know if you have any questions' show willingness to support the client. Finish with standard business closings
      such as 'Best regards' or 'Sincerely' followed by your full name, job title, and company contact details.
    content_tr: Mesajınızı daima kibar bir kapanış ve sonraki adımlara dair net bir beklentiyle sonlandırın. 'Please let me
      know if you have any questions' gibi ifadeler müşteriye destek olma isteğinizi gösterir. 'Best regards' veya 'Sincerely'
      gibi standart iş kapanışlarının ardından tam adınız, unvanınız ve şirket iletişim bilgilerinizle bitirin.
  vocabulary_annotations:
  - word: tone
    vocab_id: vocab.tone
    context_definition_en: The quality or mood of vocal expression or written communication showing feeling.
    context_meaning_tr: Ton; ses tonu; üslup.
  - word: concise
    vocab_id: vocab.concise
    context_definition_en: Giving a lot of information clearly and in a few words.
    context_meaning_tr: Kısa, öz ve net ifade edilmiş.
  comprehension_questions:
  - id: q_r_a2_02_01
    question_en: Why should you avoid opening a formal business email with 'Hey'?
    question_tr_hint: Resmi bir iş e-postasına 'Hey' ile başlamaktan neden kaçınılmalıdır?
    options:
    - It can sound excessively informal and unprofessional to new clients
    - It triggers automated email spam filters immediately
    - It is considered illegal in international maritime trade
    - It prevents attachments from uploading properly
    correct_answer: It can sound excessively informal and unprofessional to new clients
    explanation_en: Paragraph 1 notes that 'Hey' can sound unprofessional to new business partners.
    explanation_tr: 1. paragraf 'Hey' ifadesinin yeni iş ortaklarına gayri profesyonel gelebileceğini belirtir.
  - id: q_r_a2_02_02
    question_en: Where should the main purpose of your email be stated?
    question_tr_hint: E-postanızın ana amacı nerede belirtilmelidir?
    options:
    - At the very end of the email signature block
    - In an encrypted zip attachment file
    - Only after five introductory paragraphs
    - In the very first or second sentence of the message body
    correct_answer: In the very first or second sentence of the message body
    explanation_en: Paragraph 2 states that the primary purpose should appear in the first or second sentence.
    explanation_tr: 2. paragraf ana amacın ilk veya ikinci cümlede belirtilmesi gerektiğini söyler.
  - id: q_r_a2_02_03
    question_en: How does using bullet points help international readers?
    question_tr_hint: Madde işaretleri kullanmak uluslararası okuyuculara nasıl yardımcı olur?
    options:
    - It translates English text into Turkish automatically
    - It organizes information visually so it can be scanned quickly
    - It guarantees that the email will never be deleted
    - It allows you to send emails without an internet connection
    correct_answer: It organizes information visually so it can be scanned quickly
    explanation_en: Paragraph 2 explains that bullet points allow the client to scan information quickly.
    explanation_tr: 2. paragraf madde işaretlerinin müşterinin bilgiyi hızla taramasına imkan verdiğini açıklar.
  - id: q_r_a2_02_04
    question_en: Which phrase is recommended for offering continued assistance?
    question_tr_hint: Sürekli yardım sunmak için hangi ifade önerilmektedir?
    options:
    - Please let me know if you have any questions
    - Do not reply to this email under any circumstances
    - I will never answer any inquiries about this project
    - You must accept this contract without reading it
    correct_answer: Please let me know if you have any questions
    explanation_en: Paragraph 3 mentions 'Please let me know if you have any questions' as a courteous phrase.
    explanation_tr: 3. paragraf nezaketi göstermek için bu kalıbı tavsiye eder.
  - id: q_r_a2_02_05
    question_en: What information should follow 'Best regards' in a professional sign-off?
    question_tr_hint: Profesyonel bir kapanışta 'Best regards' sonrasında ne yer almalıdır?
    options:
    - A list of your personal social media passwords
    - A complaint about your company's management
    - A detailed weather report for your city
    - Your full name, job title, and company contact details
    correct_answer: Your full name, job title, and company contact details
    explanation_en: The text advises finishing with your full name, job title, and contact details.
    explanation_tr: Metin tam adınız, unvanınız ve iletişim bilgilerinizle bitirmeyi önerir.
  topic_tags:
  - business-writing
  - email-etiquette
  - workplace-communication
  - a2-reading
  related_ids:
  - vocab.concise
  - vocab.tone
  status: APPROVED
