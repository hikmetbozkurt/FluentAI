- id: reading.a2.daily-standup-guide
  title: Why Daily Standup Meetings Keep Teams Aligned
  cefr_level: A2
  category: engineering_culture
  summary_en: An overview of the fifteen-minute daily standup ritual in modern agile teams, focusing on yesterday's progress,
    today's goals, and removing blockers.
  summary_tr: 'Modern çevik ekiplerde 15 dakikalık günlük standup toplantısının işleyişi: dünün ilerlemesi, bugünün hedefleri
    ve engellerin kaldırılması.'
  word_count: 153
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: The Purpose of a Quick Morning Alignment
    content_en: In many modern companies, engineering and product teams start each workday with a fifteen-minute meeting called
      the daily standup. The goal is not to deliver long managerial lectures, but to share a quick synchronization. Participants
      literally stand up in office settings, which encourages everyone to keep their updates concise and focused.
    content_tr: Birçok modern şirkette mühendislik ve ürün ekipleri her iş gününe günlük standup adı verilen 15 dakikalık
      bir toplantıyla başlar. Amaç uzun yönetim dersleri vermek değil, hızlı bir eşzamanlama paylaşmaktır. Katılımcılar ofis
      ortamında kelimenin tam anlamıyla ayağa kalkarlar, bu da herkesin güncellemelerini kısa ve odaklı tutmasını teşvik eder.
  - paragraph_index: 2
    title: The Three Core Questions
    content_en: During the standup, each team member briefly answers three fundamental questions. First, what tasks did you
      complete yesterday? Second, what are you planning to work on today? Third, is there any blocker preventing you from
      finishing your work? By keeping the conversation strictly on these points, the meeting finishes on time.
    content_tr: Standup sırasında her ekip üyesi üç temel soruyu kısaca yanıtlar. Birincisi, dün hangi görevleri tamamladınız?
      İkincisi, bugün ne üzerinde çalışmayı planlıyorsunuz? Üçüncüsü, işinizi bitirmenizi engelleyen herhangi bir engel var
      mı? Konuşmayı kesinlikle bu noktalar üzerinde tutarak toplantı zamanında biter.
  - paragraph_index: 3
    title: Focusing on Blockers Rather than Blame
    content_en: The most critical part of the standup is identifying impediments early. If a developer is waiting for a database
      password or design asset, the team lead steps in immediately to assist. Standups create a supportive culture where asking
      for help is valued, ensuring small problems do not become major project delays.
    content_tr: Standup toplantısının en kritik kısmı, engelleri erkenden tespit etmektir. Bir yazılımcı bir veritabanı şifresi
      veya tasarım dosyası bekliyorsa, ekip lideri yardım etmek için hemen devreye girer. Standup'lar yardım istemenin değerli
      görüldüğü destekleyici bir kültür yaratarak küçük sorunların büyük proje gecikmelerine dönüşmesini önler.
  vocabulary_annotations:
  - word: product
    vocab_id: vocab.product
    context_definition_en: An article or substance that is manufactured or refined for sale to consumers.
    context_meaning_tr: ürün, mamul
  - word: deliver
    vocab_id: vocab.deliver
    context_definition_en: To provide, hand over, or achieve promised results, services, or goods.
    context_meaning_tr: teslim etmek, sunmak, (söz verilen sonucu) gerçekleştirmek
  comprehension_questions:
  - id: q_r_a2_04_01
    question_en: Why do participants physically stand up during in-person standups?
    question_tr_hint: Katılımcılar yüz yüze toplantılarda neden fiziksel olarak ayağa kalkarlar?
    options:
    - It is a mandatory physical fitness test required by company health insurance
    - It helps the office cameras record facial expressions more clearly
    - There are never enough chairs in corporate conference rooms
    - It encourages people to keep their speaking updates brief and concise
    correct_answer: It encourages people to keep their speaking updates brief and concise
    explanation_en: Paragraph 1 notes that standing up encourages everyone to keep updates concise.
    explanation_tr: 1. paragraf ayakta durmanın konuşmaları kısa ve öz tutmayı teşvik ettiğini belirtir.
  - id: q_r_a2_04_02
    question_en: Which of the following is NOT one of the three core standup questions?
    question_tr_hint: Aşağıdakilerden hangisi üç temel standup sorusundan biri DEĞİLDİR?
    options:
    - What tasks did you complete yesterday?
    - What are you planning to work on today?
    - How much money did the company make in the stock market today?
    - Is there any blocker preventing you from finishing your work?
    correct_answer: How much money did the company make in the stock market today?
