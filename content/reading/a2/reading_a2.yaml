- id: reading.a2.healthy-desk-habits
  title: Ergonomics and Well-Being at the Office Desk
  cefr_level: A2
  category: workplace_communication
  summary_en: Simple ergonomic adjustments and micro-break routines to prevent physical fatigue, eye strain, and back discomfort
    during long desk hours.
  summary_tr: Uzun masa başı mesailerinde fiziksel yorgunluğu, göz yorgunluğunu ve sırt ağrısını önlemek için ergonomik ayarlar
    ve mikro mola rutinleri.
  word_count: 178
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: The Dangers of Prolonged Sitting
    content_en: Many knowledge workers spend eight or more hours every day sitting in front of a computer screen. Without
      proper posture and ergonomic equipment, prolonged sitting frequently leads to chronic neck stiffness, wrist pain, and
      lower back tension. Fortunately, small adjustments to your chair and monitor position can significantly improve your
      physical comfort. Taking frequent micro-breaks helps reduce physical and mental fatigue.
    content_tr: Birçok bilgi işçisi her gün bir bilgisayar ekranı karşısında oturarak sekiz veya daha fazla saat geçirir.
      Uygun duruş ve ergonomik ekipman olmadan, uzun süreli oturma sıklıkla kronik boyun tutulmasına, bilek ağrısına ve bel
      gerginliğine yol açar. Neyse ki sandalyenize ve monitör konumunuza yapacağınız küçük ayarlamalar fiziksel konforunuzu
      önemli ölçüde artırabilir. Sık sık mikro molalar vermek fiziksel ve zihinsel yorgunluğu azaltmaya yardımcı olur.
  - paragraph_index: 2
    title: Setting Up an Ergonomic Workstation
    content_en: Begin by adjusting your chair height so that your feet rest flat on the floor and your knees form a ninety-degree
      angle. Your computer monitor should be positioned directly in front of you at arm's length, with the top of the display
      aligned with your eye level. This setup prevents you from tilting your head forward or hunching your shoulders.
    content_tr: Ayaklarınızın yere düz basması ve dizlerinizin doksan derecelik bir açı oluşturması için sandalye yüksekliğinizi
      ayarlayarak başlayın. Bilgisayar monitörünüz, ekranın üst kısmı göz hizanızla aynı hizada olacak şekilde, kol mesafesinde
      doğrudan önünüze yerleştirilmelidir. Bu kurulum başınızı öne eğmenizi veya omuzlarınızı kamburlaştırmanızı önler.
  - paragraph_index: 3
    title: The Power of Regular Micro-Breaks
    content_en: 'Even with an ideal ergonomic desk, the human body needs regular movement. Follow the 20-20-20 rule to protect
      your vision: every twenty minutes, look at an object twenty feet away for at least twenty seconds. Stand up, stretch
      your arms, and drink a glass of water every hour to keep your circulation active and your mind refreshed.'
    content_tr: 'İdeal bir ergonomik masada bile insan vücudunun düzenli harekete ihtiyacı vardır. Gözlerinizi korumak için
      20-20-20 kuralını uygulayın: her yirmi dakikada bir, en az yirmi saniye boyunca yirmi fit (yaklaşık 6 metre) uzaktaki
      bir nesneye bakın. Dolaşımınızı aktif ve zihninizi taze tutmak için her saat başı ayağa kalkın, kollarınızı esnetin
      ve bir bardak su için.'
  vocabulary_annotations:
  - word: posture
    vocab_id: vocab.posture
    context_definition_en: The position in which someone holds their body when standing or sitting.
    context_meaning_tr: Otururken veya ayaktayken vücudun duruş biçimi.
  - word: fatigue
    vocab_id: vocab.fatigue
    context_definition_en: Extreme physical or mental tiredness resulting from effort or stress.
    context_meaning_tr: Aşırı yorgunluk ve bitkinlik durumu.
  comprehension_questions:
  - id: q_r_a2_05_01
    question_en: What physical problems commonly result from prolonged improper sitting?
    question_tr_hint: Uzun süre hatalı oturmaktan yaygın olarak hangi fiziksel sorunlar kaynaklanır?
    options:
    - Neck stiffness, wrist discomfort, and lower back tension
    - Instant loss of speech and total memory amnesia
    - Severe allergic reactions to fresh fruit and vegetables
    - Permanent discoloration of the fingernails
    correct_answer: Neck stiffness, wrist discomfort, and lower back tension
    explanation_en: Paragraph 1 lists neck stiffness, wrist pain, and lower back tension.
    explanation_tr: 1. paragraf boyun tutulması, bilek ağrısı ve bel gerginliğini sıralar.
  - id: q_r_a2_05_02
    question_en: How should a computer monitor be positioned relative to your eyes?
    question_tr_hint: Bilgisayar monitörü gözlerinize göre nasıl konumlandırılmalıdır?
    options:
    - Resting on the floor tilted upwards toward the ceiling
    - Directly against your nose for maximum visual magnification
    - Hidden behind books to minimize screen brightness
    - At arm's length with the top edge aligned with eye level
    correct_answer: At arm's length with the top edge aligned with eye level
    explanation_en: Paragraph 2 states the monitor should be at arm's length, top aligned with eye level.
    explanation_tr: 2. paragraf monitörün kol mesafesinde ve üst kenarının göz hizasında olması gerektiğini belirtir.
  - id: q_r_a2_05_03
    question_en: What is the recommended 20-20-20 rule designed to protect?
    question_tr_hint: Önerilen 20-20-20 kuralı neyi korumak için tasarlanmıştır?
    options:
    - Your company laptop from overheating during gaming
    - Your eyesight and visual comfort during screen time
    - Your office chair fabric from wearing out too quickly
    - Your financial bank account from internet fraud
    correct_answer: Your eyesight and visual comfort during screen time
    explanation_en: Paragraph 3 explains that the 20-20-20 rule protects vision.
    explanation_tr: 3. paragraf bu kuralın göz sağlığını koruduğunu açıklar.
  - id: q_r_a2_05_04
    question_en: How often does the article recommend standing up and moving?
    question_tr_hint: Makale ne sıklıkla ayağa kalkıp hareket etmeyi önermektedir?
    options:
    - Only once at the end of each calendar month
    - Never, because sitting continuously burns more calories
    - Every hour for brief stretching and hydration
    - Every thirty seconds without ever sitting down
    correct_answer: Every hour for brief stretching and hydration
    explanation_en: The text advises standing up, stretching, and drinking water every hour.
    explanation_tr: Metin her saat başı ayağa kalkıp esnemeyi ve su içmeyi tavsiye eder.
  - id: q_r_a2_05_05
    question_en: How should your feet be placed when your desk chair is adjusted properly?
    question_tr_hint: Çalışma koltuğu düzgün ayarlandığında ayaklarınız nasıl durmalıdır?
    options:
    - Resting flat on the floor with knees at a ninety-degree angle
    - Crossed tightly behind the chair wheels
    - Elevated high above the desk surface
    - Dangling without touching any surface
    correct_answer: Resting flat on the floor with knees at a ninety-degree angle
    explanation_en: Paragraph 2 states feet should rest flat on the floor with knees at ninety degrees.
    explanation_tr: 2. paragraf ayakların yere düz basması ve dizlerin 90 derece olması gerektiğini belirtir.
