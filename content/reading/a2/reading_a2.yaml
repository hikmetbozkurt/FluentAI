- id: reading.a2.team-collaboration-tools
  title: Modern Digital Tools for Global Engineering Collaboration
  cefr_level: A2
  category: technology
  summary_en: An examination of how version control repositories, digital issue boards, and chat channels empower distributed
    technical teams to build software together.
  summary_tr: Sürüm kontrol sistemlerinin, dijital iş panolarının ve sohbet kanallarının dağıtık teknik ekiplerin birlikte
    yazılım geliştirmesini nasıl sağladığı.
  word_count: 140
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: The Distributed Workplace Reality
    content_en: Today, software engineering teams rarely share a single physical office room. Developers in Istanbul frequently
      collaborate with product managers in London and designers in Berlin. To coordinate complex technical deliverables across
      multiple time zones, international organizations rely on a suite of modern digital collaboration tools.
    content_tr: Günümüzde yazılım mühendisliği ekipleri nadiren tek bir fiziksel ofis odasını paylaşır. İstanbul'daki yazılımcılar
      sıklıkla Londra'daki ürün yöneticileri ve Berlin'deki tasarımcılarla iş birliği yapar. Birden fazla saat diliminde karmaşık
      teknik çıktıları koordine etmek için uluslararası kuruluşlar modern dijital iş birliği araçlarına güvenir.
  - paragraph_index: 2
    title: Version Control and Code Repositories
    content_en: At the foundation of technical collaboration is the version control repository. Platforms like GitHub and
      GitLab allow hundreds of engineers to work on the exact same codebase simultaneously without overwriting each other's
      code. Developers submit pull requests, allowing peers to review syntax, detect bugs, and suggest optimizations before
      code is merged.
    content_tr: Teknik iş birliğinin temelinde sürüm kontrol deposu yer alır. GitHub ve GitLab gibi platformlar yüzlerce mühendisin
      birbirinin kodunun üzerine yazmadan tam olarak aynı kod tabanında eşzamanlı çalışmasına olanak tanır. Yazılımcılar çekme
      istekleri (pull requests) göndererek kod birleştirilmeden önce meslektaşlarının sözdizimini incelemesine, hataları bulmasına
      ve iyileştirmeler önermesine imkan verir.
  - paragraph_index: 3
    title: Transparent Task Management Boards
    content_en: Equally important are digital Kanban boards. Instead of sending endless status emails, teams visualize their
      progress across columns labeled 'To Do', 'In Progress', and 'Done'. Every ticket clearly displays who is responsible,
      the target sprint deadline, and relevant technical documentation, ensuring complete organizational transparency.
    content_tr: Aynı derecede önemli olan diğer bir unsur dijital Kanban panolarıdır. Ekipler sonsuz durum e-postaları göndermek
      yerine ilerlemelerini 'Yapılacak', 'Sürüyor' ve 'Tamamlandı' sütunları üzerinden görselleştirir. Her bilet kimin sorumlu
      olduğunu, hedef sprint teslim tarihini ve ilgili teknik belgeleri net şekilde göstererek tam bir kurumsal şeffaflık
      sağlar.
  vocabulary_annotations:
  - word: repository
    vocab_id: vocab.repository
    context_definition_en: A central digital location where code and version histories are stored.
    context_meaning_tr: Kodların ve sürüm geçmişlerinin saklandığı merkezi dijital depo.
  - word: software
    vocab_id: vocab.software
    context_definition_en: The programs and other operating information used by a computer or electronic device.
    context_meaning_tr: yazılım
  comprehension_questions:
  - id: q_r_a2_07_01
    question_en: Why are digital collaboration tools essential for contemporary software squads?
    question_tr_hint: Çağdaş yazılım ekipleri için dijital iş birliği araçları neden vazgeçilmezdir?
    options:
    - Because physical office buildings are legally banned in North America
    - Because software cannot run without video cameras continuously active
    - Because developers are not permitted to speak out loud
    - Because engineers frequently work distributed across multiple cities and time zones
    correct_answer: Because engineers frequently work distributed across multiple cities and time zones
    explanation_en: Paragraph 1 notes that teams work distributed across Istanbul, London, Berlin, etc.
    explanation_tr: 1. paragraf ekiplerin farklı şehir ve saat dilimlerine dağılmış olarak çalıştığını açıklar.
  - id: q_r_a2_07_02
    question_en: How do version control repositories prevent code conflicts?
    question_tr_hint: Sürüm kontrol depoları kod çakışmalarını nasıl önler?
    options:
    - By automatically deleting code whenever an engineer makes a mistake
    - By allowing many engineers to work simultaneously without overwriting files
    - By limiting total company source code to only twenty lines
    - By turning off computer monitors during compile times
    correct_answer: By allowing many engineers to work simultaneously without overwriting files
    explanation_en: Paragraph 2 states repositories let hundreds of engineers work without overwriting each other.
    explanation_tr: 2. paragraf depoların birbirinin kodunun üzerine yazmadan çalışmayı sağladığını belirtir.
  - id: q_r_a2_07_03
    question_en: What is the function of a 'pull request' mentioned in the text?
    question_tr_hint: Metinde bahsedilen 'pull request' mekanizmasının işlevi nedir?
    options:
    - To let colleagues review, test, and approve code before merging
    - To request an immediate cash advance from the finance director
    - To demand that all other developers stop working for the day
    - To shut down the entire cloud datacenter for maintenance
    correct_answer: To let colleagues review, test, and approve code before merging
    explanation_en: Paragraph 2 explains that pull requests let peers review syntax and detect bugs before merging.
    explanation_tr: 2. paragraf birleştirmeden önce meslektaşların kodu incelemesini sağladığını ifade eder.
  - id: q_r_a2_07_04
    question_en: How do digital Kanban boards replace endless status emails?
    question_tr_hint: Dijital Kanban panoları sonsuz durum e-postalarının yerini nasıl alır?
    options:
    - By automatically printing emails onto paper every evening
    - By requiring daily voice phone calls with every customer
    - By blocking all incoming internet connections
    - By visualizing tasks across clear columns like 'To Do' and 'Done'
    correct_answer: By visualizing tasks across clear columns like 'To Do' and 'Done'
    explanation_en: Paragraph 3 describes visualizing tasks across columns like To Do, In Progress, and Done.
    explanation_tr: 3. paragraf görevleri sütunlar halinde görselleştirdiğini belirtir.
  - id: q_r_a2_07_05
    question_en: What information is typically shown on a digital task ticket?
    question_tr_hint: Dijital bir görev biletinde genellikle hangi bilgiler gösterilir?
    options:
    - The personal home address of the company CEO
    - The assigned engineer, target deadline, and technical documentation
    - The current market price of airline tickets to Tokyo
    - A list of employee dietary preferences for dinner
    correct_answer: The assigned engineer, target deadline, and technical documentation
    explanation_en: Paragraph 3 lists who is responsible, target deadlines, and relevant documentation.
    explanation_tr: 3. paragraf sorumlu kişiyi, son teslim tarihini ve belgeleri listeler.
  topic_tags:
