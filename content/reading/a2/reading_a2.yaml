- id: reading.a2.cloud-storage-guide
  title: How Cloud Storage Protects Everyday Workplace Documents
  cefr_level: A2
  category: technology
  summary_en: An accessible introduction to cloud storage systems, synchronization across devices, automated version backups,
    and remote team access.
  summary_tr: Bulut depolama sistemleri, cihazlar arası eşitleme, otomatik sürüm yedekleme ve uzaktan ekip erişimine giriş
    rehberi.
  word_count: 145
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: What is Cloud Storage?
    content_en: In the past, office workers saved important spreadsheets and presentations onto physical USB drives or local
      hard drives. If a computer was lost or damaged, crucial files were permanently gone. Cloud storage solves this vulnerability
      by saving your documents onto secure remote data centers managed by trusted technology providers.
    content_tr: Geçmişte ofis çalışanları önemli tabloları ve sunumları fiziksel USB disklere veya yerel sabit disklere kaydederdi.
      Bir bilgisayar kaybolduğunda veya hasar gördüğünde önemli dosyalar kalıcı olarak yok olurdu. Bulut depolama, belgelerinizi
      güvenilir teknoloji sağlayıcıları tarafından yönetilen uzak veri merkezlerine kaydederek bu açığı çözer.
  - paragraph_index: 2
    title: Automatic Synchronization Across Devices
    content_en: One of the most valuable benefits of the cloud is automatic file synchronization. When you edit a document
      on your office computer, the changes update immediately on your home laptop and smartphone. You no longer need to email
      different file versions like 'report_final_v2.docx' to yourself or your colleagues.
    content_tr: Bulutun en değerli faydalarından biri otomatik dosya eşitlemesidir. Ofis bilgisayarınızda bir belgeyi düzenlediğinizde,
      değişiklikler evdeki dizüstü bilgisayarınızda ve akıllı telefonunuzda anında güncellenir. Artık 'rapor_son_v2.docx'
      gibi farklı dosya sürümlerini kendinize veya iş arkadaşlarınıza e-posta ile göndermenize gerek kalmaz.
  - paragraph_index: 3
    title: Version History and Safe Recovery
    content_en: Modern cloud platforms also maintain an automated version history for every file. If someone accidentally
      deletes an important paragraph or modifies a complex formula, you can restore previous versions with a single click.
      This safety feature gives engineering and finance teams peace of mind during rapid daily updates.
    content_tr: Modern bulut platformları ayrıca her dosya için otomatik bir sürüm geçmişi tutar. Biri yanlışlıkla önemli
      bir paragrafı silerse veya karmaşık bir formülü değiştirirse, önceki sürümleri tek bir tıklamayla geri yükleyebilirsiniz.
      Bu güvenlik özelliği, hızlı günlük güncellemeler sırasında mühendislik ve finans ekiplerine huzur verir.
  vocabulary_annotations:
  - word: office
    vocab_id: vocab.office
    context_definition_en: A room, set of rooms, or building used as a place for commercial or professional work.
    context_meaning_tr: ofis, yazıhane, büro
  - word: local
    vocab_id: vocab.local-adj
    context_definition_en: Belonging or relating to a particular neighborhood, district, or town.
    context_meaning_tr: yerel, yöresel, mahalli
  comprehension_questions:
  - id: q_r_a2_03_01
    question_en: What was a primary risk of relying on local hard drives in the past?
    question_tr_hint: Geçmişte yerel sabit disklere güvenmenin ana riski neydi?
    options:
    - Hard drives required continuous human voice input to operate
    - Hardware damage could permanently destroy important business files
    - Computers could only save text files written in Latin
    - Local disks were strictly forbidden by international law
    correct_answer: Hardware damage could permanently destroy important business files
    explanation_en: Paragraph 1 notes that if a computer was lost or damaged, crucial files were gone.
    explanation_tr: 1. paragraf bilgisayar hasar gördüğünde dosyaların kalıcı olarak yok olduğunu belirtir.
  - id: q_r_a2_03_02
    question_en: How does automatic file synchronization improve daily collaboration?
    question_tr_hint: Otomatik dosya eşitlemesi günlük iş birliğini nasıl geliştirir?
    options:
    - It prints physical copies of every document automatically
    - It limits file editing to only one person per month
    - Changes update across all connected devices without emailing attachments
    - It forces employees to work only from the office
    correct_answer: Changes update across all connected devices without emailing attachments
    explanation_en: Paragraph 2 states that changes update immediately across devices without emailing versions.
    explanation_tr: 2. paragraf değişikliklerin e-posta göndermeden tüm cihazlarda güncellendiğini açıklar.
  - id: q_r_a2_03_03
    question_en: What does cloud 'version history' allow users to do?
    question_tr_hint: Bulut 'sürüm geçmişi' kullanıcıların ne yapmasına imkan tanır?
    options:
    - Recover previously saved copies of a document if mistakes happen
    - Translate any document into forty languages instantly
    - Delete all previous files from the entire internet permanently
    - Monitor employee keystrokes without their permission
    correct_answer: Recover previously saved copies of a document if mistakes happen
    explanation_en: Paragraph 3 explains that version history allows you to restore previous versions with one click.
    explanation_tr: 3. paragraf sürüm geçmişinin önceki versiyonları tek tıkla geri yüklemeyi sağladığını belirtir.
  - id: q_r_a2_03_04
    question_en: Where are cloud files physically stored according to the passage?
    question_tr_hint: Metne göre bulut dosyaları fiziksel olarak nerede saklanır?
    options:
    - Inside the user's home computer keyboard
    - On local paper records stored in underground vaults
    - In secure remote data centers managed by technology providers
    - In satellites that only orbit over European airspace
    correct_answer: In secure remote data centers managed by technology providers
    explanation_en: The text mentions that documents are saved in secure remote data centers.
    explanation_tr: Metin belgelerin güvenli uzak veri merkezlerinde saklandığını ifade eder.
  - id: q_r_a2_03_05
    question_en: Which teams benefit especially from version recovery during daily work?
    question_tr_hint: Günlük çalışma sırasında sürüm kurtarmadan özellikle hangi ekipler yararlanır?
    options:
    - Teams that never use computers or digital spreadsheets
    - Engineering and finance teams making rapid regular updates
    - Outdoor sports coaches during summer athletic events
    - Aircraft pilots during routine ocean crossings
    correct_answer: Engineering and finance teams making rapid regular updates
    explanation_en: Paragraph 3 specifically mentions engineering and finance teams.
    explanation_tr: 3. paragraf özellikle mühendislik ve finans ekiplerini örnek verir.
