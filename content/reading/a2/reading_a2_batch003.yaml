- id: reading.a2.understanding-subscription-costs
  title: Reviewing Team Software Subscriptions Safely
  cefr_level: A2
  category: finance_and_economics
  summary_en: How auditing recurring cloud tool charges every quarter cuts wasted licenses without disrupting daily work.
  summary_tr: Yinelenen bulut yazılım aboneliklerini her çeyrekte gözden geçirmenin günlük işi aksatmadan israfı nasıl azalttığını
    anlatır.
  word_count: 224
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: Silent Costs Add Up
    content_en: Modern teams rely on cloud tools for chat, design files, task tracking, and video calls. Signing up with a
      company credit card takes two minutes, so managers easily forget old accounts. An unused fifteen-dollar seat seems tiny
      on Monday morning, yet thirty forgotten seats cost thousands every year. Checking subscriptions regularly keeps small
      fees under control.
    content_tr: Modern ekipler sohbet, tasarım dosyaları, görev takibi ve görüntülü görüşmeler için bulut araçlarına güvenir.
      Şirket kredi kartıyla kayıt olmak iki dakika sürer, bu yüzden yöneticiler eski hesapları kolayca unutabilir. Kullanılmayan
      on beş dolarlık bir lisans pazartesi sabahı küçük görünür, ancak otuz unutulmuş lisans her yıl binlerce dolara mal olur.
      Abonelikleri düzenli kontrol etmek küçük ücretleri kontrol altında tutar.
  - paragraph_index: 2
    title: Building a Simple Tool List
    content_en: Start by listing every paid app on one shared page alongside the person who manages it. Write down the monthly
      cost, renewal date, and how many active seats the team uses. Often two separate departments pay for different tools
      that do the exact same job, such as duplicate survey or whiteboard apps. Combining onto one approved tool simplifies
      both bills and training.
    content_tr: İşe her ücretli uygulamayı, yöneticisiyle birlikte tek bir ortak sayfada listeleyerek başlayın. Aylık maliyeti,
      yenileme tarihini ve ekibin kaç aktif kullanıcı koltuğu kullandığını yazın. Genellikle iki ayrı departman anket veya
      beyaz tahta uygulamaları gibi aynı işi yapan farklı araçlara ödeme yapar. Tek bir onaylı araçta birleşmek hem faturaları
      hem eğitimi basitleştirir.
  - paragraph_index: 3
    title: Checking Before Automatic Renewal
    content_en: Many annual software plans renew automatically unless canceled thirty days before the renewal date. Setting
      a calendar reminder six weeks ahead gives teams plenty of room to decide calmly. Before removing any seat, message the
      assigned user first so nobody loses access during an urgent client project. Polite checks avoid painful surprises on
      Monday deadlines.
    content_tr: Birçok yıllık yazılım planı, yenileme tarihinden otuz gün önce iptal edilmedikçe otomatik olarak yenilenir.
      Altı hafta önceden bir takvim hatırlatıcısı koymak ekiplere sakince karar vermeleri için geniş zaman bırakır. Herhangi
      bir lisansı kaldırmadan önce atanan kullanıcıya mesaj atın ki kimse acil bir müşteri projesi sırasında erişimini kaybetmesin.
      Nazik kontroller pazartesi teslimlerinde tatsız sürprizleri önler.
  - paragraph_index: 4
    title: Reinvesting Saved Budget Wisely
    content_en: Cleaning up forgotten seats is not only about spending less money. Money saved from unused cloud tools can
      fund staff training courses, ergonomic chairs, or faster test laptops. When teams treat subscription checks as a normal
      quarterly habit, finances stay lean and every tool on the list truly earns its keep.
    content_tr: Unutulmuş lisansları temizlemek yalnızca daha az para harcamakla ilgili değildir. Kullanılmayan bulut araçlarından
      artan para çalışan eğitim kurslarını, ergonomik sandalyeleri veya daha hızlı test dizüstü bilgisayarlarını finanse edebilir.
      Ekipler abonelik kontrollerini normal bir üç aylık alışkanlık haline getirdiğinde bütçe sade kalır ve listedeki her
      araç gerçekten karşılığını verir.
  vocabulary_annotations:
  - word: subscription
    context_definition_en: a recurring payment plan for ongoing software use
    context_meaning_tr: abonelik
  - word: duplicate
    context_definition_en: an unnecessary second tool doing the same work
    context_meaning_tr: mükerrer, ikilenen
  - word: renewal
    context_definition_en: the date when a contract automatically starts another cycle
    context_meaning_tr: yenileme
  - word: quarterly
    context_definition_en: happening once every three months
    context_meaning_tr: üç aylık
  comprehension_questions:
  - id: q_reading_a2_understanding-subscription-costs_01
    question_en: Why do forgotten cloud subscriptions become expensive over a year?
    options:
    - Vendors double prices every Friday afternoon
    - Design files only work with thirty licenses
    - Many small unused seats add up into large annual charges
    - Teams delete all company credit cards monthly
    correct_answer: Many small unused seats add up into large annual charges
    explanation_en: Paragraph 1 points out that dozens of small unused seats accumulate into thousands annually.
    explanation_tr: 1. paragraf kullanılmayan onlarca küçük lisansın yılda binlerce dolara biriktiğini belirtir.
  - id: q_reading_a2_understanding-subscription-costs_02
    question_en: What waste does listing tools across departments often uncover?
    options:
    - Travel budgets being used on ergonomic chairs
    - Employees sharing too few laptops at work
    - Managers writing long meeting transcripts
    - Different teams paying for two apps that do the same task
    correct_answer: Different teams paying for two apps that do the same task
    explanation_en: Paragraph 2 notes that separate departments often pay for duplicate survey or whiteboard apps.
    explanation_tr: 2. paragraf ayrı departmanların aynı işi yapan mükerrer uygulamalara ödeme yapabildiğini anlatır.
  - id: q_reading_a2_understanding-subscription-costs_03
    question_en: Why set a calendar reminder six weeks before annual renewal?
    options:
    - Software companies close during winter months
    - Many plans require cancellation thirty days in advance
    - Managers need six weeks to sign a paper check
    - Banks only refund money after six months
    correct_answer: Many plans require cancellation thirty days in advance
    explanation_en: Paragraph 3 explains that annual contracts often auto-renew unless canceled thirty days early.
    explanation_tr: 3. paragraf yıllık planların otuz gün önceden iptal edilmezse otomatik yenilendiğini açıklar.
  - id: q_reading_a2_understanding-subscription-costs_04
    question_en: What step protects ongoing work before removing an inactive license?
    options:
    - Deleting their workspace without notice
    - Messaging the assigned user first to confirm
    - Waiting until the credit card expires
    - Blocking all video calls for a week
    correct_answer: Messaging the assigned user first to confirm
    explanation_en: Paragraph 3 instructs asking the assigned user first so urgent projects are not interrupted.
    explanation_tr: 3. paragraf acil projelerin aksamaması için önce ilgili kullanıcıya sorulmasını söyler.
  - id: q_reading_a2_understanding-subscription-costs_05
    question_en: How can teams benefit from savings found in software audits?
    options:
    - By funding training, ergonomic gear, or faster equipment
    - By keeping balances idle in closed accounts
    - By stopping quarterly finance meetings
    - By removing every collaboration tool permanently
    correct_answer: By funding training, ergonomic gear, or faster equipment
    explanation_en: Paragraph 4 gives training courses, ergonomic chairs, and faster laptops as reinvestment examples.
    explanation_tr: 4. paragraf tasarrufun eğitim, ergonomik koltuk veya daha hızlı dizüstü bilgisayarlara aktarılabileceğini
      belirtir.
