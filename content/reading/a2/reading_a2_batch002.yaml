- id: reading.a2.effective-team-communication
  title: Effective Communication in Cross-Functional Teams
  cefr_level: A2
  category: leadership_and_management
  summary_en: How clear project updates, active listening, and simple documentation prevent misunderstandings in modern workplaces.
  summary_tr: Net proje güncellemeleri, aktif dinleme ve basit dokümantasyonun işyerinde yanlış anlaşılmaları nasıl önlediği.
  word_count: 254
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: The Challenge of Different Perspectives
    content_en: When software developers, graphic designers, and marketing managers collaborate on a single product launch,
      misunderstandings frequently occur. Each discipline uses specialized technical vocabulary and naturally holds distinctly
      different expectations regarding project delivery timelines. For instance, an engineer might consider a feature complete
      when the core code runs, while a marketer expects polished graphics and user manuals. Recognizing these differing professional
      viewpoints is the foundational first step toward cultivating effective, supportive workplace teamwork. Every department
      possesses distinct responsibilities, and learning to bridge these gaps prevents costly friction during crucial deadlines.
    content_tr: Yazılım geliştiriciler, grafik tasarımcılar ve pazarlama yöneticileri tek bir ürün lansmanında işbirliği yaptığında
      sık sık yanlış anlaşılmalar meydana gelir. Her disiplin özel bir terminoloji kullanır ve zaman çizelgelerine ilişkin
      farklı beklentilere sahiptir. Örneğin bir mühendis çekirdek kod çalıştığında bir özelliği tamamlanmış sayabilirken,
      bir pazarlamacı cilalı grafikler ve kullanıcı kılavuzları bekler. Bu farklı bakış açılarını tanımak, etkili işyeri takım
      çalışmasına doğru ilk adımdır.
  - paragraph_index: 2
    title: Active Listening and Shared Notes
    content_en: Successful cross-functional teams prevent confusion by practicing active listening during meetings. Team members
      paraphrase colleagues' requests before answering, confirming that they understand the underlying problem. Furthermore,
      maintaining brief written notes in shared digital documents ensures that agreed deliverables, ownership roles, and target
      delivery dates remain transparent to all participants across departments.
    content_tr: Başarılı çapraz fonksiyonlu ekipler, toplantılar sırasında aktif dinleme uygulayarak kafa karışıklığını önler.
      Ekip üyeleri cevap vermeden önce meslektaşlarının isteklerini kendi cümleleriyle özetleyerek asıl sorunu anladıklarını
      teyit ederler. Ayrıca paylaşılan dijital belgelerde kısa yazılı notlar tutmak; üzerinde anlaşılan çıktıların, sahiplik
      rollerinin ve hedef teslim tarihlerinin departmanlar genelinde tüm katılımcılar için şeffaf kalmasını sağlar.
  - paragraph_index: 3
    title: Encouraging Constructive Questions
    content_en: In many fast-paced corporate teams, junior members frequently hesitate to ask clarifying questions because
      they secretly fear appearing inexperienced. Team leaders should explicitly encourage inquiries during weekly catch-ups.
      When leaders celebrate questions instead of treating them as delays, errors are caught early before they become costly
      emergencies. Open curiosity creates an environment where everyone feels safe sharing honest feedback and innovative
      thoughts.
    content_tr: Birçok ekipte genç üyeler deneyimsiz görünmekten korktukları için netleştirici sorular sormaktan çekinirler.
      Ekip liderleri haftalık değerlendirmelerde soruları açıkça teşvik etmelidir. Liderler soruları gecikme olarak görmek
      yerine memnuniyetle karşıladıklarında, hatalar maliyetli acil durumlara dönüşmeden önce erken yakalanır.
  - paragraph_index: 4
    title: Building Strong Interpersonal Bonds
    content_en: Finally, spending informal time together during coffee breaks or team lunches strengthens interpersonal trust.
      When colleagues know one another as individuals, they assume positive intent during disagreements. Mutual respect transforms
      diverse opinions into innovative company solutions. When team members celebrate mutual contributions, the entire organization
      thrives and achieves ambitious business milestones together.
    content_tr: Son olarak, kahve molalarında veya ekip yemeklerinde gayriresmi zaman geçirmek kişisel güveni pekiştirir.
      Meslektaşlar birbirlerini birey olarak tanıdıklarında, anlaşmazlıklarda olumlu niyet varsayarlar. Karşılıklı saygı,
      farklı görüşleri yenilikçi şirket çözümlerine dönüştürür.
  vocabulary_annotations:
  - word: discipline
    context_definition_en: A branch of knowledge or area of professional practice.
    context_meaning_tr: disiplin, uzmanlık alanı
  - word: deliverables
    context_definition_en: Tangible products or outcomes delivered upon project completion.
    context_meaning_tr: teslim edilecek çıktılar
  - word: interpersonal
    context_definition_en: Relating to relationships or communication between people.
    context_meaning_tr: kişilerarası
  comprehension_questions:
  - id: q_reading_a2_effective-team-communication_01
    question_en: Why do misunderstandings often arise in cross-functional project teams?
    question_tr_hint: Çapraz fonksiyonlu proje ekiplerinde yanlış anlaşılmalar neden sıkça ortaya çıkar?
    options:
    - Different departments use specialized jargon and hold contrasting expectations.
    - Software tools delete project files automatically every morning.
    - Corporate managers intentionally give contradictory instructions.
    - Employees are not permitted to speak the same language at work.
    correct_answer: Different departments use specialized jargon and hold contrasting expectations.
    explanation_en: Paragraph 1 explains that each discipline uses specialized vocabulary and has different expectations.
    explanation_tr: 1. paragraf her disiplinin farklı terimler ve beklentiler taşıdığını açıklar.
  - id: q_reading_a2_effective-team-communication_02
    question_en: How does paraphrasing during conversations improve communication?
    question_tr_hint: Konuşmalar sırasında söylenenleri özetlemek iletişimi nasıl geliştirir?
    options:
    - It doubles the required meeting length for each attendee.
    - It translates spoken English into automated code strings.
    - It proves that the listener is smarter than the team manager.
    - It verifies that the listener accurately comprehended the speaker's request.
    correct_answer: It verifies that the listener accurately comprehended the speaker's request.
    explanation_en: Paragraph 2 states that paraphrasing confirms mutual understanding of the problem.
    explanation_tr: 2. paragraf söylenenleri tekrarlamanın sorunun anlaşıldığını teyit ettiğini belirtir.
  - id: q_reading_a2_effective-team-communication_03
    question_en: What is the purpose of documenting decisions in shared digital documents?
    question_tr_hint: Kararları paylaşılan dijital belgelerde kaydetmenin amacı nedir?
    options:
    - To print hundreds of paper flyers for promotional street distribution.
    - To keep deliverables, responsibility, and deadlines transparent to everyone.
    - To hide confidential mistakes from executive management audits.
    - To prevent workers from taking mandatory lunch breaks.
    correct_answer: To keep deliverables, responsibility, and deadlines transparent to everyone.
    explanation_en: Paragraph 2 notes that shared notes keep deliverables, roles, and deadlines transparent.
    explanation_tr: 2. paragraf paylaşılan notların çıktıları ve teslim tarihlerini şeffaf tuttuğunu söyler.
  - id: q_reading_a2_effective-team-communication_04
    question_en: Why should team leaders explicitly encourage questions during meetings?
    question_tr_hint: Ekip liderleri toplantılarda neden soruları açıkça teşvik etmelidir?
    options:
    - To test which employees have memorized the company dictionary.
    - To eliminate all written documentation requirements.
    - To prolong meetings until the end of the working day.
    - To catch mistakes early before they become costly emergencies.
    correct_answer: To catch mistakes early before they become costly emergencies.
    explanation_en: Paragraph 3 explains that welcoming questions helps catch mistakes early.
    explanation_tr: 3. paragraf soruları teşvik etmenin hataların erken yakalanmasını sağladığını belirtir.
  - id: q_reading_a2_effective-team-communication_05
    question_en: What is a key benefit of having informal coffee breaks with team members?
    question_tr_hint: Ekip üyeleriyle gayriresmi kahve molaları yapmanın temel faydası nedir?
    options:
    - It guarantees an immediate salary bonus for all participants.
    - It eliminates all company payroll processing requirements.
    - It ensures employees do not need to attend formal client presentations.
    - It builds personal trust, leading to positive assumptions during disagreements.
    correct_answer: It builds personal trust, leading to positive assumptions during disagreements.
    explanation_en: Paragraph 4 states that informal time strengthens trust and fosters positive intent during debates.
    explanation_tr: 4. paragraf gayriresmi vakit geçirmenin güveni güçlendirdiğini ve tartışmalarda olumlu niyeti sağladığını
      ifade eder.
  topic_tags:
  - relationships
  - communication
  - teamwork
  - workplace
  status: APPROVED
  version: 1
- id: reading.a2.learning-languages-asynchronously
  title: The Flexibility of Asynchronous Language Learning
  cefr_level: A2
  category: workplace_communication
  summary_en: How modern digital platforms allow adult learners to study foreign languages at their own pace without rigid
    classroom schedules.
  summary_tr: Modern dijital platformların yetişkin öğrenenlerin katı sınıf programları olmadan kendi hızlarında dil öğrenmelerine
    nasıl olanak tanıdığı.
  word_count: 253
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: Escaping the Rigid Classroom Schedule
    content_en: Traditional evening language schools require students to travel across busy cities to attend classes at predetermined
      hours twice a week. For working professionals with fluctuating overtime demands and family commitments, missing lessons
      is almost inevitable. When students miss sequential sessions, they fall behind and often feel discouraged, leading many
      to abandon their language goals completely. The emotional pressure of falling behind causes unnecessary frustration
      for people who genuinely desire to become fluent.
    content_tr: Geleneksel akşam dil okulları, öğrencilerin haftada iki kez önceden belirlenmiş saatlerde derslere katılmak
      için yoğun şehirlerde seyahat etmelerini gerektirir. Değişken fazla mesai talepleri ve aile sorumlulukları olan çalışan
      profesyoneller için dersleri kaçırmak neredeyse kaçınılmazdır. Öğrenciler ardışık dersleri kaçırdıklarında geride kalırlar
      ve genellikle cesaretleri kırılır, bu da birçoğunun dil hedeflerini tamamen terk etmesine yol açar.
  - paragraph_index: 2
    title: The Autonomy of Self-Paced Learning
    content_en: Asynchronous language learning platforms solve this problem by putting learners in complete control of their
      educational calendar. Using mobile applications, learners complete grammar exercises, practice vocabulary with spaced
      repetition flashcards, and listen to authentic dialogue recordings whenever free moments emerge. Whether studying fifteen
      minutes during a morning commute or an hour on Saturday, learning adapts seamlessly to personal lifestyles. This empowering
      approach transforms wasted transit time into productive educational milestones.
    content_tr: Asenkron dil öğrenme platformları, öğrenenleri eğitim takvimlerinin tam kontrolüne koyarak bu sorunu çözer.
      Mobil uygulamaları kullanan öğrenciler, dilbilgisi alıştırmalarını tamamlar, aralıklı tekrar kartlarıyla kelime pratiği
      yapar ve boş zamanlar ortaya çıktıkça özgün diyalog kayıtlarını dinlerler. İster sabah yolculuğunda on beş dakika, ister
      cumartesi günü bir saat çalışılsın, öğrenme kişisel yaşam tarzlarına sorunsuz şekilde uyarlanır.
  - paragraph_index: 3
    title: Reviewing at Your Own Speed
    content_en: In a physical classroom, teachers must progress at an average pace that suits the majority of students. Fast
      learners may feel bored, while others feel rushed when complex grammatical concepts are introduced. With asynchronous
      digital courses, you can replay recorded audio sentences twenty times without feeling self-conscious. You move forward
      only when you feel genuinely confident and comfortable with the material. Taking full ownership of your learning velocity
      leads to deeper comprehension and greater personal satisfaction.
    content_tr: Fiziksel bir sınıfta öğretmenler çoğu öğrenciye uyan ortalama bir hızda ilerlemek zorundadır. Hızlı öğrenenler
      sıkılabilirken, diğerleri karmaşık dilbilgisi kavramları sunulduğunda aceleye getirilmiş hissedebilir. Asenkron dijital
      kurslarla, çekinmeden ses kayıtlarını yirmi kez tekrar çalabilirsiniz. Yalnızca gerçekten kendinizden emin hissettiğinizde
      ilerlersiniz.
  - paragraph_index: 4
    title: Consistency Over Intensity
    content_en: Educational psychologists confirm that ten minutes of focused daily study creates stronger neural memories
      than one long class every two weeks. Small, consistent daily practices turn language acquisition into an enjoyable and
      lasting personal habit.
    content_tr: Eğitim psikologları, her gün on dakikalık odaklanmış çalışmanın iki haftada bir yapılan uzun bir dersten daha
      güçlü sinirsel anılar oluşturduğunu doğrulamaktadır. Küçük ve tutarlı günlük pratikler dil edinimini keyifli ve kalıcı
      bir kişisel alışkanlığa dönüştürür.
  vocabulary_annotations:
  - word: inevitable
    context_definition_en: Certain to happen; unavoidable.
    context_meaning_tr: kaçınılmaz
  - word: asynchronous
    context_definition_en: Not occurring at the same time; self-paced.
    context_meaning_tr: eşzamansız, asenkron
  - word: acquisition
    context_definition_en: The learning or development of a skill or habit.
    context_meaning_tr: edinme, kazanım
  comprehension_questions:
  - id: q_reading_a2_learning-languages-asynchronously_01
    question_en: What common issue do working adults face with traditional evening language courses?
    question_tr_hint: Çalışan yetişkinler geleneksel akşam dil kurslarında hangi yaygın sorunla karşılaşır?
    options:
    - Traditional schools only teach ancient languages that are no longer spoken.
    - Classrooms require students to bring their own electrical generators.
    - Rigid fixed schedules make missing sequential lessons very likely.
    - Adults are legally prohibited from learning foreign languages after age thirty.
    correct_answer: Rigid fixed schedules make missing sequential lessons very likely.
    explanation_en: Paragraph 1 states that busy work schedules make missing rigid classes almost inevitable.
    explanation_tr: 1. paragraf yoğun çalışma saatlerinin katı ders saatlerini kaçırmayı kaçınılmaz hale getirdiğini açıklar.
  - id: q_reading_a2_learning-languages-asynchronously_02
    question_en: What does asynchronous learning allow students to do?
    question_tr_hint: Asenkron öğrenme öğrencilerin ne yapmasına olanak tanır?
    options:
    - Speak English fluently in less than twenty-four hours guaranteed.
    - Receive free international airline flights to practice conversation.
    - Earn a university degree without answering any assessment questions.
    - Study grammar and vocabulary whenever they have free moments throughout the day.
    correct_answer: Study grammar and vocabulary whenever they have free moments throughout the day.
    explanation_en: Paragraph 2 explains that learners can study whenever free moments emerge in their day.
    explanation_tr: 2. paragraf öğrencilerin gün içindeki boş vakitlerinde çalışabildiklerini belirtir.
  - id: q_reading_a2_learning-languages-asynchronously_03
    question_en: What is an advantage of digital courses over traditional classroom pacing?
    question_tr_hint: Dijital kursların geleneksel sınıf hızına göre avantajı nedir?
    options:
    - Computers take all comprehension tests on behalf of the student.
    - Digital courses eliminate all grammar rules from human language.
    - Learners can replay challenging audio sentences multiple times without embarrassment.
    - Students never need to listen to foreign speech sounds.
    correct_answer: Learners can replay challenging audio sentences multiple times without embarrassment.
    explanation_en: Paragraph 3 notes that students can replay audio twenty times without feeling self-conscious.
    explanation_tr: 3. paragraf öğrencilerin çekinmeden ses kayıtlarını yirmi kez tekrar çalabileceğini ifade eder.
  - id: q_reading_a2_learning-languages-asynchronously_04
    question_en: What does educational research conclude about study frequency?
    question_tr_hint: Eğitim araştırmaları çalışma sıklığı hakkında ne sonuca varmaktadır?
    options:
    - Language skills can only be acquired during unconscious sleep.
    - Brief daily practice builds stronger retention than rare, lengthy study sessions.
    - Studying once every three months is the most effective approach.
    - Daily practice destroys short-term memory completely.
    correct_answer: Brief daily practice builds stronger retention than rare, lengthy study sessions.
    explanation_en: Paragraph 4 confirms that ten minutes of daily study creates stronger memories than biweekly classes.
    explanation_tr: 4. paragraf günlük on dakikanın iki haftada bir yapılan dersten daha güçlü hafıza oluşturduğunu doğrular.
  - id: q_reading_a2_learning-languages-asynchronously_05
    question_en: What is the primary conclusion of the text?
    question_tr_hint: Metnin ana sonucu nedir?
    options:
    - Learning languages is impossible without moving abroad permanently.
    - Traditional classrooms will be completely closed by international treaty.
    - Adults should never study without hiring three private tutors simultaneously.
    - Flexible, self-paced learning integrates sustainably into modern adult routines.
    correct_answer: Flexible, self-paced learning integrates sustainably into modern adult routines.
    explanation_en: The article demonstrates that flexible self-paced learning fits adult lifestyles smoothly.
    explanation_tr: Makale, esnek ve kendi hızında öğrenmenin yetişkin rutinlerine sorunsuz şekilde uyduğunu gösterir.
  topic_tags:
  - education
  - language-learning
  - technology
  - self-improvement
  status: APPROVED
  version: 1
- id: reading.a2.urban-bike-sharing-programs
  title: The Growth of Urban Bike-Sharing Programs
  cefr_level: A2
  category: engineering_culture
  summary_en: How shared bicycle networks reduce traffic congestion, lower pollution, and encourage healthy commuting habits
    in modern cities.
  summary_tr: Paylaşımlı bisiklet ağlarının modern şehirlerde trafik sıkışıklığını ve kirliliği nasıl azalttığı ve sağlıklı
    ulaşım alışkanlıklarını nasıl teşvik ettiği.
  word_count: 254
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: Combating Gridlock in Crowded Cities
    content_en: Traffic congestion in major metropolitan regions wastes billions of hours every year. Commuters sit motionless
      in long queues of private automobiles, breathing exhaust fumes and arriving at workplaces agitated and exhausted. In
      response, municipal planners around the world are investing in municipal bike-sharing systems to provide clean, healthy,
      and convenient transportation for short city journeys. By offering accessible bicycles across neighborhoods, local governments
      encourage active transit and reduce the number of private cars entering central districts.
    content_tr: Büyük metropol bölgelerindeki trafik sıkışıklığı her yıl milyarlarca saat israfına neden olur. İşe gidip gelenler
      özel otomobillerden oluşan uzun kuyruklarda hareketsiz oturur, egzoz dumanı solur ve iş yerlerine huzursuz ve bitkin
      varırlar. Buna karşılık, dünyanın dört bir yanındaki şehir plancıları kısa şehir yolculukları için temiz, sağlıklı ve
      kullanışlı ulaşım sağlamak amacıyla belediye bisiklet paylaşım sistemlerine yatırım yapıyor.
  - paragraph_index: 2
    title: How Bike Sharing Works
    content_en: Modern bike-sharing networks are remarkably straightforward to use. Commuters unlock bicycles using smartphone
      applications, ride safely along protected urban bike lanes, and return the bicycles to any designated docking station
      near their destination. Electric-assist bicycles now make riding uphill effortless, enabling older residents and business
      commuters wearing professional attire to travel comfortably without breaking into a heavy sweat. Modern geofencing technology
      ensures bicycles are returned neatly to designated zones, maintaining tidy sidewalks for pedestrians.
    content_tr: Modern bisiklet paylaşım ağlarının kullanımı son derece basittir. İşe gidip gelenler akıllı telefon uygulamalarını
      kullanarak bisikletlerin kilidini açar, korumalı şehir içi bisiklet yollarında güvenle sürer ve bisikletleri varış noktalarının
      yakınındaki herhangi bir belirlenmiş istasyona iade eder. Elektrik destekli bisikletler artık yokuş yukarı sürmeyi zahmetsiz
      hale getirerek yaşlı sakinlerin ve profesyonel kıyafetler giyen iş insanlarının aşırı terlemeden rahatça seyahat etmelerini
      sağlıyor.
  - paragraph_index: 3
    title: Environmental and Economic Benefits
    content_en: Widespread bicycle use dramatically reduces urban air pollution and noise levels. Furthermore, bike sharing
      is exceptionally economical compared to owning a private vehicle. Users avoid costly parking fees, fuel expenses, and
      routine mechanical maintenance, saving hundreds of euros every month while staying physically active. Many forward-thinking
      companies even subsidize monthly bike-share memberships for their employees to promote wellness.
    content_tr: Yaygın bisiklet kullanımı kentsel hava kirliliğini ve gürültü seviyelerini önemli ölçüde azaltır. Ayrıca bisiklet
      paylaşımı özel bir araca sahip olmaya kıyasla son derece ekonomiktir. Kullanıcılar pahalı park ücretlerinden, yakıt
      masraflarından ve rutin mekanik bakımlardan kaçınarak fiziksel olarak aktif kalırken her ay yüzlerce avro tasarruf ederler.
  - paragraph_index: 4
    title: Supporting Healthier Lifestyles
    content_en: Integrating moderate physical activity into daily commutes enhances cardiovascular stamina and lifts everyday
      mood. As cities expand dedicated cycling lanes, bicycles are becoming the preferred mode of travel for modern urban
      citizens. Embracing pedal power creates cleaner air, quieter streets, and happier communities across the metropolis.
    content_tr: Orta düzeyde fiziksel aktiviteyi günlük işe gidiş gelişlere entegre etmek kardiyovasküler dayanıklılığı artırır
      ve günlük ruh halini yükseltir. Şehirler özel bisiklet yollarını genişlettikçe, bisikletler modern şehir sakinleri için
      tercih edilen seyahat modu haline geliyor.
  vocabulary_annotations:
  - word: congestion
    context_definition_en: The state of being crowded and full of traffic.
    context_meaning_tr: trafik sıkışıklığı
  - word: designated
    context_definition_en: Officially allocated or specified for a particular purpose.
    context_meaning_tr: belirlenmiş, tahsis edilmiş
  - word: economical
    context_definition_en: Giving good value or return in relation to money or effort.
    context_meaning_tr: ekonomik, tasarruflu
  comprehension_questions:
  - id: q_reading_a2_urban-bike-sharing-programs_01
    question_en: What primary problem prompted cities to build shared bicycle networks?
    question_tr_hint: Şehirlerin paylaşımlı bisiklet ağları kurmasına hangi temel sorun yol açtı?
    options:
    - The complete collapse of all municipal electricity grids.
    - Severe traffic gridlock and exhaust pollution caused by private car commutes.
    - A mandatory international ban on pedestrian walking.
    - An unexpected shortage of asphalt on municipal streets.
    correct_answer: Severe traffic gridlock and exhaust pollution caused by private car commutes.
    explanation_en: Paragraph 1 identifies traffic congestion and exhaust fumes as the core reasons.
    explanation_tr: 1. paragraf trafik sıkışıklığını ve egzoz dumanını temel nedenler olarak tanımlar.
  - id: q_reading_a2_urban-bike-sharing-programs_02
    question_en: How do riders typically unlock shared bicycles today?
    question_tr_hint: Sürücüler günümüzde paylaşımlı bisikletlerin kilidini genellikle nasıl açar?
    options:
    - By answering complex mathematical calculus equations.
    - Using dedicated mobile applications on their smartphones.
    - By presenting an international pilot's license.
    - By purchasing physical metal keys at city hall once a year.
    correct_answer: Using dedicated mobile applications on their smartphones.
    explanation_en: Paragraph 2 states that commuters unlock bikes using smartphone applications.
    explanation_tr: 2. paragraf kullanıcıların akıllı telefon uygulamalarıyla kilit açtığını belirtir.
  - id: q_reading_a2_urban-bike-sharing-programs_03
    question_en: What advantage do electric-assist bicycles provide to commuters?
    question_tr_hint: Elektrik destekli bisikletler işe gidip gelenlere hangi avantajı sağlar?
    options:
    - They fly above tall skyscrapers to avoid traffic lights.
    - They do not require riders to hold onto the handlebars.
    - They can travel underwater across city rivers.
    - They make riding uphill easy, preventing heavy sweating in office clothes.
    correct_answer: They make riding uphill easy, preventing heavy sweating in office clothes.
    explanation_en: Paragraph 2 explains that electric bikes make uphill riding effortless without sweating in work clothes.
    explanation_tr: 2. paragraf elektrikli bisikletlerin yokuşları kolaylaştırdığını ve iş kıyafetleriyle terlemeyi önlediğini
      açıklar.
  - id: q_reading_a2_urban-bike-sharing-programs_04
    question_en: How does using bike-sharing programs save money for city dwellers?
