- id: reading.a2.smart-grocery-planning
  title: Smart Grocery Planning for Busy Professionals
  cefr_level: A2
  category: workplace_communication
  summary_en: How creating weekly meal plans and organized grocery lists saves time, reduces food waste, and supports healthy
    daily routines.
  summary_tr: Haftalık yemek planı ve düzenli alışveriş listeleri oluşturmanın nasıl zaman kazandırdığını ve israfı önlediğini
    anlatan rehber.
  word_count: 260
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: The Problem with Daily Decisions
    content_en: Many modern professionals arrive home exhausted in the evening without knowing what to prepare for dinner.
      Deciding what to cook every single night consumes mental energy and frequently leads to ordering expensive takeout meals.
      Taking thirty minutes on Sunday afternoon to plan five simple weekday dinners eliminates this daily stress. When your
      menu is planned in advance, grocery shopping becomes a fast and focused errand rather than a chaotic chore.
    content_tr: Birçok modern profesyonel, akşam eve yorgun gelip akşam yemeğinde ne hazırlayacağını bilmez. Her akşam ne
      pişireceğine karar vermek zihinsel enerji tüketir ve sıklıkla pahalı hazır yemek siparişlerine yol açar. Pazar öğleden
      sonra otuz dakikanızı beş basit hafta içi akşam yemeğini planlamaya ayırmak bu günlük stresi ortadan kaldırır. Menünüz
      önceden planlandığında, market alışverişi kaotik bir angarya yerine hızlı ve odaklı bir iş haline gelir.
  - paragraph_index: 2
    title: Structuring the Grocery List
    content_en: 'An effective grocery shopping list should be categorized by supermarket sections: fresh produce, pantry staples,
      dairy, and household essentials. When items appear in the order of the store layout, shoppers move systematically through
      the aisles and resist impulsive candy purchases near the checkout counter. Additionally, checking kitchen cupboards
      before leaving home prevents buying duplicate ingredients like olive oil or rice. These simple habits save money and
      keep daily eating routines nutritious.'
    content_tr: 'Etkili bir market alışveriş listesi süpermarket bölümlerine göre kategorize edilmelidir: taze sebze-meyve,
      kiler temel gıdaları, süt ürünleri ve ev ihtiyaçları. Ürünler mağaza düzenine göre sıralandığında, alışveriş yapanlar
      reyonlar arasında sistemli bir şekilde ilerler ve kasa yanındaki anlık şekerleme alışverişlerine direnir. Ayrıca evden
      çıkmadan önce mutfak dolaplarını kontrol etmek, zeytinyağı veya pirinç gibi mükerrer malzemelerin alınmasını önler.
      Bu basit alışkanlıklar para tasarrufu sağlar ve günlük beslenme rutinlerini besleyici tutar.'
  - paragraph_index: 3
    title: Cooking in Batches
    content_en: Another useful technique is cooking large portions of food on quiet evenings. Making a big pot of soup, roasted
      seasonal vegetables, or seasoned chicken provides meals for two or three days. You can store these prepared containers
      in the refrigerator or freezer. On busy workdays, reheating a wholesome homemade dish takes only five minutes, allowing
      you to relax immediately after work.
    content_tr: Diğer faydalı bir teknik de sakin akşamlarda büyük porsiyonlar pişirmektir. Büyük bir tencere çorba, fırınlanmış
      mevsim sebzeleri veya baharatlı tavuk hazırlamak iki ya da üç günlük yemek sağlar. Bu hazırlanmış kapları buzdolabında
      veya dondurucuda saklayabilirsiniz. Yoğun iş günlerinde sağlıklı ev yemeğini ısıtmak sadece beş dakika sürer ve işten
      sonra hemen dinlenmenize imkan tanır.
  - paragraph_index: 4
    title: Reviewing and Adjusting the Plan
    content_en: At the end of each week, look at what food remains in your refrigerator. If fresh spinach or berries were
      not eaten, adjust your list for the next shopping trip. Gradually, you will discover your exact weekly consumption patterns.
      Planning your food brings calm predictability to your home life and leaves you with more energy for your hobbies.
    content_tr: Her haftanın sonunda buzdolabınızda hangi yiyeceklerin kaldığına bakın. Taze ıspanak veya meyveler yenmediyse,
      bir sonraki alışveriş gezisi için listenizi ayarlayın. Kademeli olarak tam haftalık tüketim düzeninizi keşfedeceksiniz.
      Yiyeceklerinizi planlamak ev hayatınıza sakin bir öngörülebilirlik getirir ve hobileriniz için size daha fazla enerji
      bırakır.
  vocabulary_annotations:
  - word: produce
    context_definition_en: Fresh agricultural goods like fruits and vegetables.
    context_meaning_tr: taze sebze ve meyve
  - word: staples
    context_definition_en: Basic, essential food supplies regularly used.
    context_meaning_tr: temel gıda maddeleri
  - word: predictability
    context_definition_en: The quality of being known or expected beforehand.
    context_meaning_tr: öngörülebilirlik
  comprehension_questions:
  - id: q_reading_a2_smart-grocery-planning_01
    question_en: According to the article, why is deciding what to cook every evening problematic?
    question_tr_hint: Metne göre her akşam ne pişirileceğine karar vermek neden sorunludur?
    options:
    - It depletes mental energy and often results in costly food deliveries.
    - It requires hiring an expensive personal chef.
    - It prevents people from having breakfast on time.
    - It causes kitchen appliances to break down frequently.
    correct_answer: It depletes mental energy and often results in costly food deliveries.
    explanation_en: Paragraph 1 explains that deciding daily consumes mental energy and leads to expensive takeout.
    explanation_tr: 1. paragraf günlük karar vermenin zihinsel enerji tükettiğini ve pahalı hazır yemeklere yönlendirdiğini
      açıklar.
  - id: q_reading_a2_smart-grocery-planning_02
    question_en: When does the author recommend organizing the weekday menu?
    question_tr_hint: Yazar hafta içi menüsünü ne zaman organize etmeyi öneriyor?
    options:
    - On Sunday afternoon for approximately thirty minutes.
    - Every morning before heading to the office.
    - Only on national public holidays.
    - Immediately after finishing Friday dinner.
    correct_answer: On Sunday afternoon for approximately thirty minutes.
    explanation_en: Paragraph 1 mentions dedicating thirty minutes on Sunday afternoon to plan five dinners.
    explanation_tr: 1. paragrafta Pazar öğleden sonra otuz dakikanın beş akşam yemeğini planlamaya ayrılması önerilir.
  - id: q_reading_a2_smart-grocery-planning_03
    question_en: How should an efficient shopping list be structured?
    question_tr_hint: Verimli bir alışveriş listesi nasıl yapılandırılmalıdır?
    options:
    - Grouped by the physical sections of the supermarket aisles.
    - By the color and packaging size of the products.
    - Alphabetically from A to Z across all categories.
    - Strictly in order of item expiration dates.
    correct_answer: Grouped by the physical sections of the supermarket aisles.
    explanation_en: Paragraph 2 states that the list should be categorized by supermarket sections.
    explanation_tr: 2. paragraf listenin süpermarket reyonlarına göre kategorize edilmesi gerektiğini belirtir.
  - id: q_reading_a2_smart-grocery-planning_04
    question_en: What is the primary benefit of cooking in large batches?
    question_tr_hint: Büyük porsiyonlar halinde yemek pişirmenin temel faydası nedir?
    options:
    - It eliminates the need for fresh drinking water.
    - It provides ready meals that take only minutes to reheat on busy workdays.
    - It requires buying three new refrigerators every month.
    - It allows you to open a commercial restaurant from home.
    correct_answer: It provides ready meals that take only minutes to reheat on busy workdays.
    explanation_en: Paragraph 3 explains that batch cooking allows reheating a healthy meal in five minutes.
    explanation_tr: 3. paragraf toplu yemek pişirmenin yoğun günlerde yemeği beş dakikada ısıtma imkanı sağladığını belirtir.
  - id: q_reading_a2_smart-grocery-planning_05
    question_en: Why should you check what food remains in your refrigerator at the end of the week?
    question_tr_hint: Hafta sonunda buzdolabında kalan yiyecekleri neden kontrol etmelisiniz?
    options:
    - To turn off the electricity in your kitchen completely.
    - To adjust future shopping lists and understand true consumption patterns.
    - To throw away all kitchen cooking utensils immediately.
    - To invite thirty strangers for a sudden party.
    correct_answer: To adjust future shopping lists and understand true consumption patterns.
    explanation_en: Paragraph 4 explains that reviewing leftovers helps adjust future lists and discover consumption patterns.
    explanation_tr: 4. paragraf kalan yiyecekleri incelemenin gelecek listeleri ayarlamaya ve tüketim alışkanlıklarını anlamaya
      yaradığını söyler.
  topic_tags:
  - daily-life
  - planning
  - habits
  - routine
  status: APPROVED
  version: 1
- id: reading.a2.walking-for-desk-workers
  title: The Health Benefits of Daily Walking for Office Workers
  cefr_level: A2
  category: workplace_communication
  summary_en: Simple strategies for incorporating regular walking breaks into sedentary office days to boost physical and
    mental health.
  summary_tr: Masa başı çalışanların fiziksel ve zihinsel sağlıklarını korumak için günlük yürüyüş molalarını rutinlerine
    ekleme stratejileri.
  word_count: 264
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: The Sedentary Desk Problem
    content_en: Sitting in an office chair for eight consecutive hours places significant strain on the human body. Office
      workers frequently experience tight hip flexors, stiff shoulder muscles, and sluggish circulation by mid-afternoon.
      Scientific studies show that human bodies require regular movement to metabolize sugars and maintain healthy blood pressure
      levels. Even a gym session in the evening cannot completely undo the negative effects of sitting motionless all day
      long. Long periods without muscular activity lower metabolic rates and make the body feel sluggish by late afternoon.
    content_tr: Ofis koltuğunda aralıksız sekiz saat oturmak insan vücuduna önemli bir yük bindirir. Masa başı çalışanlar
      öğleden sonra sık sık gergin kalça kasları, sert omuzlar ve yavaşlayan kan dolaşımı yaşarlar. Bilimsel çalışmalar, insan
      vücudunun şekerleri metabolize etmek ve sağlıklı kan basıncını korumak için düzenli harekete ihtiyaç duyduğunu göstermektedir.
      Akşam spor salonuna gitmek bile bütün gün hareketsiz oturmanın olumsuz etkilerini tamamen ortadan kaldıramaz.
  - paragraph_index: 2
    title: Small Walking Habits
    content_en: Fortunately, you do not need intense athletic workouts to counteract sedentary desk time. Taking a brisk ten-minute
      walk after lunch stimulates digestion and prevents the heavy fatigue that often strikes at two o'clock. Walking to colleagues'
      desks instead of sending instant chat messages also increases daily step totals. Using stairs instead of elevators provides
      gentle cardiovascular stimulation without requiring extra workout clothes. These brief moments of activity accumulate
      into substantial physical exercise over weeks of office work.
    content_tr: Neyse ki, hareketsiz masa saatlerini telafi etmek için yoğun atletik antrenmanlara ihtiyacınız yok. Öğle yemeğinden
      sonra on dakikalık tempolu bir yürüyüş yapmak sindirimi uyarır ve genellikle saat ikide vuran ağır yorgunluğu önler.
      Anlık mesajlar göndermek yerine meslektaşlarınızın masasına yürümek de günlük adım toplamını artırır. Asansör yerine
      merdivenleri kullanmak, ekstra spor kıyafetleri gerektirmeden hafif kardiyovasküler uyarı sağlar.
  - paragraph_index: 3
    title: Mental Benefits of Walking
    content_en: Walking also provides wonderful mental benefits. Stepping away from computer screens into fresh outdoor air
      helps clear mental fog and reduces workday anxiety. Many famous writers and business leaders hold walking meetings because
      gentle physical movement sparks creative problem-solving. When you walk, ideas flow more freely than when staring at
      blank monitors.
    content_tr: Yürüyüş ayrıca harika zihinsel faydalar da sunar. Bilgisayar ekranlarından uzaklaşıp açık havaya çıkmak zihinsel
      sisi temizlemeye ve iş kaygısını azaltmaya yardımcı olur. Birçok ünlü yazar ve iş lideri yürüyüş toplantıları düzenler
      çünkü hafif fiziksel hareket yaratıcı problem çözmeyi tetikler. Yürüdüğünüzde, fikirler boş monitörlere bakmaktan çok
      daha serbest akar.
  - paragraph_index: 4
    title: Setting Achievable Targets
    content_en: Begin by aiming for five thousand steps each day instead of demanding an intimidating ten-thousand-step goal
      immediately. Track your daily progress with a smartphone sensor or a simple wristwatch pedometer. Celebrating these
      small daily achievements builds confidence. Consistent daily walking transforms your energy levels and keeps your body
      feeling resilient.
    content_tr: Hemen on bin adımlık korkutucu bir hedef koymak yerine her gün beş bin adımı hedefleyerek başlayın. Günlük
      ilerlemenizi bir akıllı telefon sensörü veya basit bir adımsayar kol saati ile takip edin. Bu küçük günlük başarıları
      kutlamak özgüven kazandırır. Tutarlı günlük yürüyüş enerji seviyenizi dönüştürür ve vücudunuzun dirençli hissetmesini
      sağlar.
  vocabulary_annotations:
  - word: sedentary
    context_definition_en: Involving much sitting and little physical exercise.
    context_meaning_tr: hareketsiz, oturarak yapılan
  - word: fatigue
    context_definition_en: Extreme tiredness resulting from mental or physical exertion.
    context_meaning_tr: yorgunluk, bitkinlik
  - word: resilient
    context_definition_en: Able to withstand or recover quickly from difficult conditions.
    context_meaning_tr: dirençli, güçlü
  comprehension_questions:
  - id: q_reading_a2_walking-for-desk-workers_01
    question_en: What physical problem is caused by sitting continuously at a desk all day?
    question_tr_hint: Bütün gün masada sürekli oturmak hangi fiziksel soruna yol açar?
    options:
    - Permanent loss of color vision.
    - Stiff shoulder muscles, tight hips, and sluggish circulation.
    - An immediate loss of fingernail growth.
    - Sudden allergic reactions to wooden office furniture.
    correct_answer: Stiff shoulder muscles, tight hips, and sluggish circulation.
    explanation_en: Paragraph 1 lists tight hip flexors, stiff shoulders, and sluggish circulation as consequences.
    explanation_tr: 1. paragraf kalça gerginliği, omuz sertliği ve yavaş kan dolaşımını oturmanın sonuçları olarak sıralar.
  - id: q_reading_a2_walking-for-desk-workers_02
    question_en: Why is a short walk recommended directly after lunch?
    question_tr_hint: Öğle yemeğinden hemen sonra neden kısa bir yürüyüş önerilir?
    options:
    - It aids digestion and prevents afternoon drowsiness and fatigue.
    - It allows workers to buy another full meal.
    - It cools down office computers during peak hours.
    - It replaces the need for night sleep completely.
    correct_answer: It aids digestion and prevents afternoon drowsiness and fatigue.
    explanation_en: Paragraph 2 states that a brisk walk after lunch stimulates digestion and prevents afternoon fatigue.
    explanation_tr: 2. paragraf öğle yemeğinden sonraki tempolu yürüyüşün sindirimi hızlandırdığını ve yorgunluğu önlediğini
      belirtir.
  - id: q_reading_a2_walking-for-desk-workers_03
    question_en: How does walking benefit mental performance and creativity?
    question_tr_hint: Yürüyüş zihinsel performansa ve yaratıcılığa nasıl fayda sağlar?
    options:
    - It helps people memorize random telephone directories.
    - It prevents people from having any dreams at night.
    - It eliminates the need for team communication tools.
    - It clears mental fog and stimulates creative problem-solving.
    correct_answer: It clears mental fog and stimulates creative problem-solving.
    explanation_en: Paragraph 3 explains that stepping outside clears fog and sparks creative ideas.
    explanation_tr: 3. paragraf açık havada yürümenin zihinsel sisi temizlediğini ve yaratıcı fikirleri tetiklediğini açıklar.
  - id: q_reading_a2_walking-for-desk-workers_04
    question_en: What realistic initial goal does the author suggest for daily steps?
    question_tr_hint: Yazar günlük adımlar için başlangıçta hangi gerçekçi hedefi önerir?
    options:
    - Fifty thousand steps before morning breakfast.
    - Only walking on alternating weekend days.
    - Exactly five hundred steps per week.
    - Starting with five thousand steps instead of an intimidating ten thousand.
    correct_answer: Starting with five thousand steps instead of an intimidating ten thousand.
    explanation_en: Paragraph 4 advises starting with a manageable goal of five thousand steps daily.
    explanation_tr: 4. paragraf günde beş bin adımlık makul bir hedefle başlanmasını tavsiye eder.
  - id: q_reading_a2_walking-for-desk-workers_05
    question_en: What is the main message of the article?
    question_tr_hint: Makalenin ana iletisi nedir?
    options:
    - Office workers must immediately quit desk jobs to become athletes.
    - Consistent, modest walking breaks provide substantial physical and mental health benefits.
    - Physical exercise only works when conducted in specialized private gyms.
    - Sitting on office chairs is completely safe for twelve hours continuously.
    correct_answer: Consistent, modest walking breaks provide substantial physical and mental health benefits.
    explanation_en: The passage shows that simple walking routines yield major health and energy enhancements.
    explanation_tr: Metin, basit yürüyüş rutinlerinin sağlık ve enerji açısından büyük kazanımlar sağladığını gösterir.
  topic_tags:
  - health-lifestyle
  - wellness
  - exercise
  - routine
  status: APPROVED
  version: 1
- id: reading.a2.train-travel-in-europe
  title: Exploring European Cities by High-Speed Rail
  cefr_level: A2
  category: workplace_communication
  summary_en: Why modern passenger trains offer a comfortable, scenic, and sustainable way to explore diverse European destinations.
  summary_tr: Modern yolcu trenlerinin Avrupa şehirlerini keşfetmek için neden konforlu, manzaralı ve sürdürülebilir bir yol
    sunduğu.
  word_count: 250
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: A Relaxing Alternative to Flying
    content_en: Traveling between major European capitals by airplane is often exhausting. Passengers spend hours queuing
      at security checkpoints, taking long airport shuttles, and waiting at boarding gates. High-speed rail travel provides
      a significantly more pleasant, tranquil, and comfortable alternative for busy travelers. Modern passenger train terminals
      are located in city centers, allowing travelers to arrive twenty minutes before departure and step directly onto comfortable
      passenger cars. Eliminating tedious transfers saves substantial travel time and removes the anxiety of missing strict
      flights.
    content_tr: Büyük Avrupa başkentleri arasında uçakla seyahat etmek genellikle yorucudur. Yolcular güvenlik kontrol noktalarında
      kuyrukta bekleyerek, uzun havaalanı servislerine binerek ve biniş kapılarında bekleyerek saatler harcarlar. Yüksek hızlı
      demiryolu seyahati çok daha keyifli bir alternatif sunar. Modern yolcu tren garları şehir merkezlerinde yer alır, bu
      da yolcuların kalkıştan yirmi dakika önce varıp doğrudan konforlu vagonlara binmelerine olanak tanır.
  - paragraph_index: 2
    title: Working and Relaxing on Board
    content_en: Onboard high-speed trains, passengers enjoy spacious seats, generous legroom, and expansive windows displaying
      picturesque countrysides. Free electrical sockets and wireless internet enable travelers to reply to work emails or
      watch favorite movies comfortably. Moving freely to visit the café carriage for fresh espresso and sandwiches makes
      long journeys feel surprisingly fast, relaxing, and delightful. Traveling through rolling countryside allows passengers
      to appreciate the changing scenery in comfort.
    content_tr: Yüksek hızlı trenlerde yolcular geniş koltukların, bol bacak mesafesinin ve pitoresk kırsal manzaraları sergileyen
      geniş pencerelerin keyfini çıkarırlar. Ücretsiz prizler ve kablosuz internet, yolcuların iş e-postalarını yanıtlamasına
      veya en sevdikleri filmleri rahatça izlemesine olanak tanır. Taze espresso ve sandviçler için kafe vagonunu ziyaret
      etmek üzere serbestçe hareket edebilmek, uzun yolculukların şaşırtıcı derecede hızlı ve keyifli geçmesini sağlar.
  - paragraph_index: 3
    title: Environmental Advantages
    content_en: Another major advantage of train travel is its low environmental footprint. Modern electric trains produce
      up to ninety percent fewer greenhouse gas emissions per passenger compared to commercial aircraft flights. Environmentally
      conscious travelers can journey across multiple international borders knowing that their journey produces minimal environmental
      damage. Choosing green rail options helps protect historic landscapes for future generations to enjoy.
    content_tr: Tren yolculuğunun diğer bir büyük avantajı düşük çevresel ayak izidir. Modern elektrikli trenler, ticari uçak
      uçuşlarına kıyasla yolcu başına yüzde doksana kadar daha az sera gazı emisyonu üretir. Çevreye duyarlı gezginler, yolculuklarının
      minimum çevresel zarara yol açtığını bilerek birden fazla uluslararası sınırı geçebilirler.
  - paragraph_index: 4
    title: Planning Train Journeys
    content_en: To find affordable tickets, book reservations several weeks in advance through unified European ticketing
      websites. Major rail operators offer flexible passes that permit unlimited regional travel across several countries.
      Arriving directly in the vibrant heart of an ancient city makes rail travel unforgettable.
    content_tr: Uygun fiyatlı biletler bulmak için rezervasyonları birleşik Avrupa biletleme sitelerinden birkaç hafta önce
      yapın. Büyük demiryolu işletmecileri, birden fazla ülkede sınırsız bölgesel seyahate izin veren esnek biletler sunar.
      Doğrudan tarihi bir şehrin canlı kalbine varmak, tren seyahatini unutulmaz kılar.
  vocabulary_annotations:
  - word: terminals
    context_definition_en: Railway stations at the end of a line or major hubs.
    context_meaning_tr: garlar, istasyon terminalleri
  - word: picturesque
    context_definition_en: Visually attractive, charming, like a picture.
    context_meaning_tr: manzaralı, kartpostal gibi
  - word: unlimited
    context_definition_en: Not limited or restricted in terms of number or quantity.
    context_meaning_tr: sınırsız
  comprehension_questions:
  - id: q_reading_a2_train-travel-in-europe_01
    question_en: Why is train travel often more convenient than flying between European cities?
    question_tr_hint: Tren seyahati Avrupa şehirleri arasında uçmaktan neden genellikle daha uygundur?
    options:
    - Airplanes are completely banned between European countries.
    - Train stations are situated in central city locations, minimizing travel to remote airports.
    - Train passengers do not have to purchase any travel tickets.
    - Trains travel twice as fast as modern jet airplanes.
    correct_answer: Train stations are situated in central city locations, minimizing travel to remote airports.
    explanation_en: Paragraph 1 explains that rail terminals are located in city centers, eliminating airport commutes.
    explanation_tr: 1. paragraf tren garlarının şehir merkezlerinde olduğunu ve havaalanı transferlerini ortadan kaldırdığını
      belirtir.
  - id: q_reading_a2_train-travel-in-europe_02
    question_en: What onboard amenity helps passengers stay productive while traveling by train?
    question_tr_hint: Trenle seyahat ederken yolcuların üretken kalmasına hangi araç yardımcı olur?
    options:
    - Access to high-speed helicopter launchpads on train roofs.
    - Free private sleeping quarters in every single car.
    - Mandatory silent meditation periods with no conversation.
    - Power sockets and wireless internet connections at spacious seats.
    correct_answer: Power sockets and wireless internet connections at spacious seats.
    explanation_en: Paragraph 2 mentions electrical sockets and wireless internet that allow answering work emails.
    explanation_tr: 2. paragraf e-postaları yanıtlamaya imkan tanıyan priz ve kablosuz internet bağlantısını belirtir.
  - id: q_reading_a2_train-travel-in-europe_03
    question_en: How do electric trains compare to airplanes regarding greenhouse gas emissions?
    question_tr_hint: Elektrikli trenler sera gazı emisyonları açısından uçaklarla nasıl karşılaştırılır?
    options:
    - Their emissions are identical to commercial wide-body jets.
    - They consume more fossil fuel than private maritime yachts.
    - They emit significantly more harmful smog than heavy diesel trucks.
    - They produce up to ninety percent fewer emissions per passenger.
    correct_answer: They produce up to ninety percent fewer emissions per passenger.
    explanation_en: Paragraph 3 states that electric trains produce up to 90% fewer greenhouse emissions per traveler.
    explanation_tr: 3. paragraf elektrikli trenlerin yolcu başına %90'a kadar daha az emisyon yaydığını açıklar.
  - id: q_reading_a2_train-travel-in-europe_04
    question_en: How can travelers secure the best ticket prices for European train routes?
    question_tr_hint: Gezginler Avrupa tren rotalarında en iyi bilet fiyatlarını nasıl elde edebilir?
    options:
    - By buying train tickets exclusively in post office stations.
    - By waiting until ten seconds before the train departs.
    - By negotiating cash prices directly with locomotive drivers.
    - By booking several weeks early through unified rail booking portals.
    correct_answer: By booking several weeks early through unified rail booking portals.
    explanation_en: Paragraph 4 advises booking tickets weeks in advance through unified websites.
    explanation_tr: 4. paragraf biletlerin haftalar öncesinden birleşik web siteleri üzerinden ayırtılmasını önerir.
  - id: q_reading_a2_train-travel-in-europe_05
    question_en: What is the author's overall evaluation of passenger rail travel in Europe?
    question_tr_hint: Yazarın Avrupa'daki yolcu treni seyahatine ilişkin genel değerlendirmesi nedir?
    options:
    - It is a relaxing, picturesque, and environmentally friendly mode of transport.
    - It is only useful for transporting heavy mining raw materials.
    - It causes more air pollution than commercial airliners.
    - It is extremely dangerous and should always be avoided by tourists.
    correct_answer: It is a relaxing, picturesque, and environmentally friendly mode of transport.
    explanation_en: The passage portrays rail journeys as scenic, sustainable, and highly comfortable.
    explanation_tr: Metin, tren yolculuklarını konforlu, manzaralı ve çevre dostu olarak değerlendirir.
  topic_tags:
  - travel
  - transportation
  - europe
  - sustainability
