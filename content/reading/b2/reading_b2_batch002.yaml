    context_definition_en: Blocked or obstructed completely.
    context_meaning_tr: tıkanmış
  - word: endothelium
    context_definition_en: The single layer of cells lining blood vessels and the heart.
    context_meaning_tr: damar iç zarı, endotel
  - word: atherogenesis
    context_definition_en: The formation of fatty plaques in the arteries.
