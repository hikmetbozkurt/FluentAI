- id: reading.b2.on-call-sustainability-metrics
  title: Measuring On-Call Load Before Engineer Burnout Starts
  cefr_level: B2
  category: engineering_culture
  summary_en: Why tracking night-time alert frequency, false positives, and interruption recovery preserves reliability without
    exhausting engineering teams.
  summary_tr: Gece alarmlarının sıklığını, yanlış pozitifleri ve kesinti sonrası toparlanma süresini izlemenin mühendisleri
    tüketmeden sistem güvenilirliğini nasıl koruduğunu anlatır.
  word_count: 261
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: Beyond Simple Uptime Percentages
    content_en: Executive dashboards celebrate ninety-nine-point-nine-five percent service availability as proof of engineering
      excellence. Beneath glowing green service charts, however, silent attrition frequently takes root inside on-call rotations.
      When uptime relies on heroic two-in-the-morning database restarts by exhausted specialists, impressive customer metrics
      mask severe organizational fragility. Measuring operational health accurately demands tracking human sustainability
      alongside machine availability.
    content_tr: Yönetici panoları yüzde doksan dokuz virgül doksan beşlik hizmet sürekliliğini mühendislik mükemmelliğinin
      kanıtı olarak kutlar. Ancak parlayan yeşil grafiklerin altında, nöbet rotasyonları içinde çoğu zaman sessiz bir yıpranma
      kök salar. Çalışma süresi, bitkin uzmanların sabaha karşı saat ikide yaptığı kahramanca veritabanı yeniden başlatmalarına
      dayanıyorsa, etkileyici müşteri metrikleri ciddi kurumsal kırılganlığı gizler. Operasyonel sağlığı doğru ölçmek, makine
      sürekliliğiyle birlikte insan sürdürülebilirliğini de izlemeyi gerektirir.
  - paragraph_index: 2
    title: Distinguishing Actionable Pages From Chronically Noisy Alerts
    content_en: Alert fatigue emerges rapidly when monitoring thresholds trigger urgent phone pages for transient network
      blips that clear themselves within two minutes. If more than thirty percent of pages require no human intervention upon
      waking an engineer, trust in telemetry collapses quickly. Experienced reliability groups audit monthly alert precision
      rigorously, demoting non-urgent warnings into daytime Slack digests. Protecting sleep ensures engineers respond sharply
      during genuine payment or data crises.
    content_tr: İzleme eşikleri iki dakika içinde kendiliğinden düzelen geçici ağ dalgalanmaları için acil telefon çağrısı
      başlattığında alarm yorgunluğu hızla ortaya çıkar. Bir mühendisi uyandıran çağrıların yüzde otuzundan fazlası hiçbir
      insan müdahalesi gerektirmiyorsa telemetriye duyulan güven çabucak çöker. Deneyimli güvenilirlik ekipleri aylık alarm
      kesinliğini titizlikle denetler; acil olmayan uyarıları gündüz Slack özetlerine indirir. Uykuyu korumak mühendislerin
      gerçek ödeme veya veri krizlerinde keskin yanıt vermesini sağlar.
  - paragraph_index: 3
    title: Measuring Uninterrupted Focus and Sleep Interruptions
    content_en: Raw page counts fail to reflect true cognitive strain, because three rapid alerts within twenty minutes disrupt
      life differently than three spaced wakes across a single night. Forward-thinking leads weight off-hours pages significantly
      heavier than daytime interrupts and limit consecutive shifts cleanly. Even better, teams establish automatic escalation
      freezes and quiet handover policies granting compensatory recovery hours after brutal midnight incidents. Quantifying
      cognitive interruptions elevates reliability work from invisible duty to trackable engineering capacity.
    content_tr: Ham çağrı sayıları gerçek bilişsel yükü yansıtmaz; çünkü yirmi dakika içindeki üç hızlı alarm, aynı geceye
      yayılan üç ayrı uyanmadan farklı bir yük yaratır. İleri görüşlü liderler mesai dışı çağrıları gündüz kesintilerinden
      belirgin biçimde daha ağır puanlar ve art arda nöbetleri sınırlar. Daha da iyisi, ekipler zorlu gece yarısı olaylarının
      ardından telafi dinlenme saatleri tanıyan sessiz devir politikaları uygular. Bilişsel kesintileri sayısallaştırmak nöbet
      işini görünmez bir görevden ölçülebilir mühendislik kapasitesine taşır.
  - paragraph_index: 4
    title: Stopping Feature Delivery When Pain Crosses Thresholds
    content_en: Metrics only protect engineers when excessive toil triggers tangible priority shifts rather than sympathetic
      slogans. Many mature product organizations enforce a quarterly toil budget capping repetitive manual incidents per rotation.
      Whenever alert load breaches agreed limits, squads pause roadmap feature launches temporarily to harden flaky jobs and
      automate tedious diagnostics. Linking sustainability signals directly to roadmap pacing turns reliability into a shared
      product value.
    content_tr: Metrikler ancak aşırı angarya boş sempatik sloganlar yerine somut öncelik değişikliklerini tetiklediğinde
      mühendisleri korur. Birçok olgun ürün kuruluşu rotasyon başına tekrarlayan manuel olayları sınırlayan üç aylık bir angarya
      bütçesi uygular. Alarm yükü belirlenen sınırları aştığında ekipler, kararsız işleri sağlamlaştırmak ve yorucu tanıları
      otomatikleştirmek için yol haritası özellik lansmanlarını geçici olarak duraklatır. Sürdürülebilirlik sinyallerini doğrudan
      ürün hızıyla ilişkilendirmek güvenilirliği ortak bir ürün değerine dönüştürür.
  vocabulary_annotations:
  - word: attrition
    context_definition_en: gradual loss of skilled employees due to stress or exhaustion
    context_meaning_tr: yıpranma ve çalışan kaybı
  - word: telemetry
    context_definition_en: automated measurements collected remotely from live software
    context_meaning_tr: telemetri, sistem izleme verisi
  - word: toil
    context_definition_en: repetitive manual operational work lacking lasting engineering value
    context_meaning_tr: tekrarlayan manuel angarya
  - word: fragility
    context_definition_en: vulnerability hidden beneath superficially strong performance metrics
    context_meaning_tr: kırılganlık
  comprehension_questions:
  - id: q_reading_b2_on-call-sustainability-metrics_01
    question_en: What problem can high customer uptime numbers conceal inside engineering teams?
    options:
    - Zero monitoring tools being installed on production servers
    - Complete absence of weekend customer traffic
    - Refusal by executives to track quarterly profit
    - Reliance on exhausting late-night manual fixes by burned-out staff
    correct_answer: Reliance on exhausting late-night manual fixes by burned-out staff
    explanation_en: Paragraph 1 points out high uptime maintained via heroic 2 AM restarts hides severe organizational fragility.
    explanation_tr: 1. paragraf sabaha karşı yapılan manuel müdahalelerle sağlanan yüksek erişilebilirliğin kurumsal kırılganlığı
      gizlediğini söyler.
  - id: q_reading_b2_on-call-sustainability-metrics_02
    question_en: When does alert fatigue rapidly undermine monitoring trust?
    options:
    - When dashboards display green availability badges
    - When databases restart smoothly during lunch
    - When over 30% of wake-up pages self-resolve without action
    - When daytime summaries arrive in Slack channels
    correct_answer: When over 30% of wake-up pages self-resolve without action
    explanation_en: Paragraph 2 notes alert trust collapses when over thirty percent of pages need no human intervention.
    explanation_tr: 2. paragraf çağrıların yüzde otuzundan fazlasının müdahale gerektirmemesi halinde güvenin çöktüğünü anlatır.
  - id: q_reading_b2_on-call-sustainability-metrics_03
    question_en: Why measure weighted off-hours interruptions instead of raw alert totals?
    options:
    - Phone carriers charge more per alert after midnight
    - Raw totals automatically delete recovery days
    - Nighttime sleep disruptions create far steeper cognitive strain
    - Daytime tickets never require engineering tools
    correct_answer: Nighttime sleep disruptions create far steeper cognitive strain
    explanation_en: Paragraph 3 contrasts grouped alerts with spaced nighttime wakes and weights off-hours interrupts heavier.
    explanation_tr: 3. paragraf mesai dışı uyku kesintilerinin çok daha ağır bilişsel yorgunluk yarattığını vurgular.
  - id: q_reading_b2_on-call-sustainability-metrics_04
    question_en: What happens when a mature team's on-call toil breaches its agreed threshold?
    options:
    - Customer support stops answering daytime inquiries
    - Feature launches pause temporarily so reliability work ships first
    - Engineers switch from rotation calendars to solo shifts
    - All alerting rules are muted until next year
    correct_answer: Feature launches pause temporarily so reliability work ships first
    explanation_en: Paragraph 4 describes pausing feature launches to harden flaky jobs and automate diagnostics.
    explanation_tr: 4. paragraf sınır aşıldığında ekip güvenilirliği artırmak için özellik lansmanlarını geçici duraklattığını
      belirtir.
  - id: q_reading_b2_on-call-sustainability-metrics_05
    question_en: How should teams handle non-urgent warnings that still provide useful context?
    options:
    - Convert every minor metric into a weekend task
    - Route them to daytime channel digests instead of waking responders
    - Send urgent SMS alerts to three executives
    - Delete those logs immediately without archiving
    correct_answer: Route them to daytime channel digests instead of waking responders
    explanation_en: Paragraph 2 advises demoting non-urgent warnings into daytime Slack digests.
    explanation_tr: 2. paragraf acil olmayan uyarıların gündüz Slack özetlerine indirilmesini önerir.
  topic_tags:
  - on-call
  - sre
  - burnout-prevention
  related_ids: []
  status: APPROVED
