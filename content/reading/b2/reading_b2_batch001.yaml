- id: reading.b2.strategic-okr-implementation
  title: Implementing Objectives and Key Results in High-Velocity Engineering Squads
  cefr_level: B2
  category: business_strategy
  summary_en: How technology enterprises implement Objectives and Key Results (OKRs) to align engineering output with executive
    business impact, avoiding output-oriented feature factories.
  summary_tr: Teknoloji şirketlerinin mühendislik çıktısını kurumsal iş etkisiyle hizalamak ve 'özellik fabrikası' tuzağından
    kaçınmak için OKR sistemini nasıl uyguladığı.
  word_count: 297
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: The Trap of the Feature Factory
    content_en: 'In many growing software organizations, engineering productivity is mistakenly evaluated by raw output: number
      of tickets completed, story points burned down, or features shipped. This metric creates what industry practitioners
      call a ''Feature Factory''—a team that churns out endless software capabilities that nobody actually uses or that fail
      to move the company''s financial needle. To connect technical effort directly to measurable business outcomes, leading
      technology organizations adopt the Objectives and Key Results (OKR) framework. Clear strategic objectives serve as a
      powerful catalyst for team alignment.'
    content_tr: 'Büyüyen birçok yazılım organizasyonunda mühendislik üretkenliği yanlışlıkla ham çıktıyla değerlendirilir:
      tamamlanan bilet sayısı, tüketilen hikaye puanları veya yayınlanan özellikler. Bu ölçüt sektör çalışanlarının ''Özellik
      Fabrikası'' (Feature Factory) adını verdiği durumu yaratır: hiç kimsenin gerçekten kullanmadığı veya şirketin finansal
      ibresini oynatmakta başarısız olan sonsuz yazılım yetenekleri üreten bir ekip. Teknik çabayı doğrudan ölçülebilir iş
      sonuçlarına bağlamak için önde gelen teknoloji şirketleri Hedefler ve Temel Sonuçlar (OKR) çerçevesini benimser. Net
      stratejik hedefler, ekip uyumu için güçlü bir katalizör görevi görür.'
  - paragraph_index: 2
    title: Anatomy of an Effective OKR
    content_en: The OKR methodology, originally pioneered at Intel and popularized across Silicon Valley by Google, consists
      of two interlocking components. The 'Objective' is a qualitative, ambitious, and inspirational statement defining where
      the team wants to go (e.g., 'Deliver a lightning-fast, ultra-reliable checkout experience'). The 'Key Results' are three
      to five quantitative, rigorously measurable milestones that prove whether the objective was achieved (e.g., 'Reduce
      checkout latency from 3.2 seconds to 800 milliseconds').
    content_tr: 'İlk olarak Intel''de öncülüğü yapılan ve Silikon Vadisi genelinde Google tarafından popülerleştirilen OKR
      metodolojisi, birbirine kenetlenen iki bileşenden oluşur. ''Hedef'' (Objective), ekibin nereye gitmek istediğini tanımlayan
      niteliksel, iddialı ve ilham verici bir ifadedir (örneğin: ''Şimşek hızında ve son derece güvenilir bir ödeme deneyimi
      sunmak''). ''Temel Sonuçlar'' (Key Results) ise hedefe ulaşılıp ulaşılmadığını kanıtlayan üç ila beş adet niceliksel,
      sıkı bir şekilde ölçülebilir kilometre taşıdır (örneğin: ''Ödeme gecikmesini 3,2 saniyeden 800 milisaniyeye düşürmek'').'
  - paragraph_index: 3
    title: Outputs versus Outcomes
    content_en: The most common failure mode in adopting OKRs is writing Key Results as task lists rather than outcome metrics.
      Writing 'Launch the redesigned iOS payment screen' is an output; it merely measures whether work was performed, not
      whether it generated value. In contrast, writing 'Increase checkout completion conversion by four percent' is an outcome.
      If the team launches the screen but conversion declines, the Key Result has objectively failed, forcing the team to
      iterate rapidly.
    content_tr: OKR'ları benimsemedeki en yaygın hata modu, Temel Sonuçları sonuç ölçütleri yerine görev listeleri olarak
      yazmaktır. 'Yeniden tasarlanan iOS ödeme ekranını yayınlamak' bir çıktıdır (output); yalnızca işin yapılıp yapılmadığını
      ölçer, değer üretip üretmediğini değil. Buna karşılık, 'Ödeme tamamlama dönüşüm oranını yüzde dört artırmak' bir sonuçtur
      (outcome). Ekip ekranı yayınlar ancak dönüşüm oranı düşerse, Temel Sonuç nesnel olarak başarısız olmuştur ve bu da ekibi
      hızla yeni denemeler yapmaya zorlar.
  - paragraph_index: 4
    title: Decoupling OKRs from Compensation
    content_en: 'A fundamental rule of OKR governance is strictly decoupling Key Result attainment from employee performance
      bonuses. If annual compensation is tied directly to achieving 100% of an OKR, engineers will sandbag: artificially setting
      modest, conservative targets to guarantee bonuses. OKRs are designed as stretch goals where achieving seventy percent
      represents impressive execution. By removing financial fear from the equation, leadership encourages high-stakes innovation
      and bold technical experimentation.'
    content_tr: 'OKR yönetişiminin temel bir kuralı, Temel Sonuç başarısını çalışan performans primlerinden kesin olarak ayırmaktır.
      Yıllık primler doğrudan bir OKR''ın %100''üne ulaşmaya bağlanırsa mühendisler hedef küçültecektir (sandbagging): primleri
      garanti altına almak için yapay olarak mütevazı ve muhafazakar hedefler belirleyeceklerdir. OKR''lar yüzde yetmişine
      ulaşmanın etkileyici bir başarı sayıldığı esnetme (stretch) hedefleri olarak tasarlanmıştır. Liderlik denklemin içinden
      finansal korkuyu çıkararak yüksek riskli inovasyonu ve cesur teknik deneyleri teşvik eder.'
  vocabulary_annotations:
  - word: catalyst
    vocab_id: vocab.catalyst
    context_definition_en: A person or thing that precipitates an event or accelerates change.
    context_meaning_tr: Bir olayı hızlandıran veya değişimi tetikleyen unsur (katalizör).
  - word: software
    vocab_id: vocab.software
    context_definition_en: The programs and other operating information used by a computer or electronic device.
    context_meaning_tr: yazılım
  comprehension_questions:
  - id: q_r_b2_03_01
    question_en: What defines the 'Feature Factory' trap in software organizations?
    question_tr_hint: Yazılım organizasyonlarında 'Özellik Fabrikası' tuzağını ne tanımlar?
    options:
    - Focusing exclusively on shipping raw output without evaluating whether it generates real business value
    - A manufacturing facility that physically constructs computer keyboards
    - A requirement that all code must be written in the C programming language
    - A legal mandate forcing technology companies to hire factory labor
    correct_answer: Focusing exclusively on shipping raw output without evaluating whether it generates real business value
    explanation_en: Paragraph 1 explains a feature factory churns out features that fail to move the financial needle.
    explanation_tr: 1. paragraf özellik fabrikasının iş değeri yaratmayan özellikleri durmadan üretmek olduğunu açıklar.
  - id: q_r_b2_03_02
    question_en: How do 'Objectives' differ from 'Key Results' in the OKR framework?
    question_tr_hint: OKR çerçevesinde 'Hedefler' (Objectives) 'Temel Sonuçlar'dan (Key Results) nasıl ayrılır?
    options:
    - Objectives are written in binary code; Key Results are written in English
    - Objectives are strictly for executives; Key Results are strictly for junior interns
    - Objectives are qualitative and inspirational; Key Results are quantitative and measurable
    - Objectives change every five minutes; Key Results never change over ten years
    correct_answer: Objectives are qualitative and inspirational; Key Results are quantitative and measurable
    explanation_en: Paragraph 2 states the Objective is qualitative/inspirational, while Key Results are quantitative/measurable.
    explanation_tr: 2. paragraf Hedefin niteliksel/ilham verici, Temel Sonuçların ise niceliksel/ölçülebilir olduğunu belirtir.
  - id: q_r_b2_03_03
    question_en: Why is 'Launch the new payment screen' considered a flawed Key Result?
    question_tr_hint: '''Yeni ödeme ekranını yayınlamak'' neden hatalı bir Temel Sonuç olarak kabul edilir?'
    options:
    - It violates international patent laws regarding digital typography
    - It is a task-based output, not a measurable business outcome metric
    - It takes more than three hours to translate into German
    - The word 'screen' is forbidden in modern agile frameworks
    correct_answer: It is a task-based output, not a measurable business outcome metric
    explanation_en: Paragraph 3 explains launching a screen is an output measuring work performed, not value generated.
    explanation_tr: 3. paragraf ekran yayınlamanın bir çıktı olduğunu, değer üreten bir sonuç olmadığını açıklar.
  - id: q_r_b2_03_04
    question_en: What happens when companies tie employee performance bonuses directly to OKR completion?
    question_tr_hint: Şirketler çalışan primlerini doğrudan OKR başarısına bağladığında ne olur?
    options:
    - The company automatically triples its quarterly sales revenue
    - All software bugs are eliminated from the codebase permanently
    - Employees work seventy hours a week with joyful enthusiasm
    - Engineers set artificially conservative targets (sandbagging) to guarantee bonuses
    correct_answer: Engineers set artificially conservative targets (sandbagging) to guarantee bonuses
    explanation_en: Paragraph 4 explains employees will sandbag and set modest targets to guarantee bonuses.
    explanation_tr: 4. paragraf çalışanların primleri garantilemek için hedefleri yapay biçimde düşüreceğini açıklar.
  - id: q_r_b2_03_05
    question_en: What achievement level in stretch OKRs is typically considered impressive execution?
    question_tr_hint: İddialı esnetme (stretch) OKR'larında hangi başarı seviyesi genellikle etkileyici bir icraat sayılır?
    options:
    - Achieving precisely zero point zero percent
    - Achieving five hundred percent every single sprint
    - Attaining approximately seventy percent of the ambitious target
    - Completing tasks without ever using a computer
    correct_answer: Attaining approximately seventy percent of the ambitious target
    explanation_en: Paragraph 4 mentions that achieving seventy percent represents impressive execution.
    explanation_tr: 4. paragraf hedefin yüzde yetmişine ulaşmanın etkileyici bir başarı olduğunu belirtir.
