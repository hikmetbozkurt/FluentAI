  comprehension_questions:
  - id: q_r_b2_05_01
    question_en: Why do cross-border business negotiations often collapse despite agreed technical specs?
    question_tr_hint: Sınır ötesi iş müzakereleri teknik şartnamelerde anlaşılmasına rağmen neden sıklıkla çöker?
    options:
    - International telecommunications cables are severed during international meetings
    - Executives treat human negotiations as purely transactional, ignoring unspoken cultural assumptions
    - Commercial banking contracts must be handwritten in classical Latin
    - Governments forbid international partnerships across different oceans
    correct_answer: Executives treat human negotiations as purely transactional, ignoring unspoken cultural assumptions
    explanation_en: Paragraph 1 notes that treating negotiations as purely transactional leads to baffling collapses.
    explanation_tr: 1. paragraf görüşmeleri sadece işlemsel görmenin ve kültürel varsayımları yoksaymanın anlaşmaları yıktığını
      belirtir.
  - id: q_r_b2_05_02
    question_en: How does communication function in 'low-context' business cultures?
    question_tr_hint: '''Düşük bağlamlı'' iş kültürlerinde iletişim nasıl işler?'
    options:
    - Meaning is communicated exclusively through secret hand gestures
    - All business must be negotiated through third-party family members
    - Communication is explicit, literal, and precise, with meaning residing in the exact words
    - Employees are strictly forbidden from writing emails or contracts
    correct_answer: Communication is explicit, literal, and precise, with meaning residing in the exact words
    explanation_en: Paragraph 2 defines low-context cultures as explicit, precise, and literal.
    explanation_tr: 2. paragraf düşük bağlamlı kültürleri açık, kesin ve kelimelere dayalı olarak tanımlar.
  - id: q_r_b2_05_03
    question_en: What does the phrase 'That proposal presents interesting challenges' typically imply in high-context settings?
    question_tr_hint: Yüksek bağlamlı ortamlarda 'Bu teklif ilginç zorluklar barındırıyor' ifadesi genellikle ne anlama gelir?
    options:
    - A polite and indirect yet definitive rejection ('No')
    - An immediate agreement to sign the contract without reading it
    - An enthusiastic request to double the financial contract price
    - A demand to hire fifty more junior programmers immediately
    correct_answer: A polite and indirect yet definitive rejection ('No')
    explanation_en: Paragraph 2 explains this polite phrase often signals an emphatic 'No'.
    explanation_tr: 2. paragraf bu kibar cümlenin genellikle kesin bir 'Hayır' anlamına geldiğini açıklar.
  - id: q_r_b2_05_04
    question_en: Why is public confrontation avoided in many Asian commercial partnerships?
    question_tr_hint: Birçok Asya ticari ortaklığında kamusal yüzleşmelerden neden kaçınılır?
    options:
    - International treaty law imposes criminal fines for speaking out loud
    - It triggers automatic software compilation errors across local servers
    - It causes irreversible 'loss of face' that permanently destroys relational harmony
    - Asian conference rooms are acoustically designed to amplify angry voices
    correct_answer: It causes irreversible 'loss of face' that permanently destroys relational harmony
    explanation_en: Paragraph 3 states challenging counterparties publicly causes loss of face and ruins harmony.
    explanation_tr: 3. paragraf açıkça meydan okumanın itibar kaybına yol açıp ilişkisel uyumu yıktığını belirtir.
  - id: q_r_b2_05_05
    question_en: What is a common error committed by fast-paced dealmakers in consensus-driven cultures?
    question_tr_hint: Fikir birliğine dayalı kültürlerde hızlı tempoya alışkın müzakerecilerin yaptığı yaygın hata nedir?
    options:
    - Offering to pay the invoice in local gold currency rather than paper bank notes
    - Interpreting thorough, deliberate stakeholder deliberation as disinterest or obstruction
    - Speaking too politely during initial ceremonial business introductions
    - Refusing to allow any company lawyers to review the contract terms
    correct_answer: Interpreting thorough, deliberate stakeholder deliberation as disinterest or obstruction
    explanation_en: Paragraph 4 explains interpreting deliberate deliberation as disinterest is a fatal error.
    explanation_tr: 4. paragraf istişare sürecini ilgisizlik veya engel çıkarma sanmanın ölümcül bir hata olduğunu açıklar.
