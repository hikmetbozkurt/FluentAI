  - id: q_r_b2_07_02
    question_en: According to Daniel Goleman's model, what does 'self-regulation' entail?
    question_tr_hint: Daniel Goleman'ın modeline göre 'öz düzenleme' (self-regulation) neleri içerir?
    options:
    - The automatic regulation of room temperature by corporate HVAC computers
    - A daily requirement to memorize fifty new dictionary definitions before breakfast
    - The legal right of managers to seize employee personal electronic equipment
    - The conscious discipline to withhold impulsive, emotional reactions during high-pressure crises
    correct_answer: The conscious discipline to withhold impulsive, emotional reactions during high-pressure crises
    explanation_en: Paragraph 2 defines self-regulation as the discipline to withhold impulsive reactions.
    explanation_tr: 2. paragraf öz düzenlemeyi krizler sırasında fevri tepkileri dizginleme disiplini olarak tanımlar.
  - id: q_r_b2_07_03
    question_en: How does executive panic neurologically affect software engineering teams during an outage?
    question_tr_hint: Yönetici paniği bir kesinti sırasında yazılım ekiplerini nörolojik olarak nasıl etkiler?
    options:
    - It causes computer screens to switch off and disconnect from the internet
    - Surging stress hormones impair the prefrontal cortex, crippling creative analytical reasoning
    - It forces developers to physically fall asleep at their desks immediately
    - It permanently erases the company's code repository within minutes
    correct_answer: Surging stress hormones impair the prefrontal cortex, crippling creative analytical reasoning
    explanation_en: Paragraph 3 explains fear impairs the prefrontal cortex responsible for problem-solving.
    explanation_tr: 3. paragraf korkunun problem çözmeden sorumlu prefrontal korteksi felç ettiğini açıklar.
  - id: q_r_b2_07_04
    question_en: How do emotionally intelligent leaders frame difficult performance feedback?
    question_tr_hint: Duygusal açıdan zeki liderler zorlayıcı performans geri bildirimini nasıl çerçeveler?
