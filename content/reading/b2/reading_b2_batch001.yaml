  - word: catalyst
    vocab_id: vocab.catalyst
    context_definition_en: A substance or factor that causes or accelerates a chemical reaction or organizational change.
    context_meaning_tr: Değişimi veya eylemi hızlandıran tetikleyici unsur.
  comprehension_questions:
  - id: q_r_b2_08_01
    question_en: What architectural bottleneck occurred when backend systems transitioned to microservices while frontends
      remained monolithic?
    question_tr_hint: Arka uç sistemleri mikroservislere geçerken ön yüz monolit kaldığında hangi mimari darboğaz oluştu?
    options:
    - Front-end code could no longer run on mobile phone screens or web browsers
    - Computers ran out of physical memory and completely ceased manufacturing electronic parts
    - Dozens of developers committing to a single massive SPA caused release coupling and blocked deployment agility
    - Companies were forced by government regulators to abolish all internet websites
    correct_answer: Dozens of developers committing to a single massive SPA caused release coupling and blocked deployment
      agility
    explanation_en: Paragraph 1 explains having 50 developers commit to a single SPA created release coupling.
    explanation_tr: 1. paragraf 50 geliştiricinin aynı büyük SPA'ya kod göndermesinin dağıtım çevikliğini felç ettiğini belirtir.
  - id: q_r_b2_08_02
    question_en: How does a micro-frontend architecture organize software teams and repositories?
    question_tr_hint: Bir mikro ön yüz mimarisi yazılım ekiplerini ve depolarını nasıl düzenler?
    options:
    - By forcing all developers to work on a single desktop computer simultaneously in one room
    - Vertically by business domain slices with independent repositories, pipelines, and deployment cadences
    - Horizontally by programming languages, banning all use of modern web frameworks
    - By outsourcing all frontend code to freelance students through internet forums
    correct_answer: Vertically by business domain slices with independent repositories, pipelines, and deployment cadences
    explanation_en: Paragraph 2 describes vertical decomposition by business domain with dedicated repos and pipelines.
    explanation_tr: 2. paragraf dikey iş alanı dilimlerine göre bağımsız depo ve dağıtımlarla ayrıştırmayı açıklar.
  - id: q_r_b2_08_03
    question_en: Why do modern enterprise architectures prefer 'run-time' composition over 'build-time' composition?
    question_tr_hint: Modern kurumsal mimariler neden 'çalışma zamanı' birleştirmeyi 'derleme zamanı' birleştirmeye tercih
      eder?
    options:
    - Run-time composition uses no computer electricity or memory whatsoever
    - Build-time composition is legally banned by international browser consortia
    - Run-time composition eliminates the need to write any front-end software code
    - Build-time composition recreates release coupling by requiring the entire parent container to be recompiled
    correct_answer: Build-time composition recreates release coupling by requiring the entire parent container to be recompiled
    explanation_en: Paragraph 3 states build-time composition recreates coupling requiring parent container recompilation.
    explanation_tr: 3. paragraf derleme zamanının ana uygulamanın yeniden derlenmesini gerektirerek bağımlılığı yeniden ürettiğini
      açıklar.
  - id: q_r_b2_08_04
    question_en: What serious client-side performance penalty can poorly governed micro-frontends inflict?
    question_tr_hint: Kötü yönetilen mikro ön yüzler istemci tarafında hangi ciddi performans cezasına yol açabilir?
    options:
    - Permanently destroying the physical liquid crystal display of the user's smartphone
    - Erasing the user's personal banking accounts from the financial system
    - Payload bloat from downloading redundant duplicate framework versions over mobile networks
    - Causing web browsers to automatically translate all text into binary zeros and ones
    correct_answer: Payload bloat from downloading redundant duplicate framework versions over mobile networks
    explanation_en: Paragraph 4 highlights payload bloat when multiple squads ship redundant framework versions.
    explanation_tr: 4. paragraf birden fazla ekibin kütüphaneleri tekrar tekrar indirmesiyle oluşan veri yükü şişkinliğini
      anlatır.
  - id: q_r_b2_08_05
    question_en: When should technology leaders definitely AVOID adopting micro-frontends?
    question_tr_hint: Teknoloji liderleri mikro ön yüzleri benimsemekten kesinlikle ne zaman KAÇINMALIDIR?
    options:
    - When working in early-stage startups or small squads with fewer than twenty developers
    - When developing enterprise e-commerce portals serving fifty million active users
    - When coordinating multiple multinational squads across three continents
    - When maintaining applications that require frequent daily deployment releases
    correct_answer: When working in early-stage startups or small squads with fewer than twenty developers
    explanation_en: Paragraph 5 states for early startups with fewer than 20 devs, operational overhead exceeds benefits.
    explanation_tr: 5. paragraf 20 kişiden az ekibi olan erken girişimlerde operasyonel yükün faydayı aştığını belirtir.
