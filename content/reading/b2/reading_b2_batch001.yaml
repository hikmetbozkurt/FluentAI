- id: reading.b2.design-systems-at-scale
  title: Design Systems as Bridges Between Design and Engineering
  cefr_level: B2
  category: technology
  summary_en: How design tokens, reusable UI component libraries, and cross-discipline governance align product designers
    and front-end engineers across sprawling software suites.
  summary_tr: Tasarım belirteçleri (tokens), yeniden kullanılabilir kullanıcı arayüzü kütüphaneleri ve yönetişimin tasarımcılar
    ile yazılımcıları nasıl birleştirdiği.
  word_count: 300
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: The Visual Inconsistency of Scaling Products
    content_en: When a technology company grows from a single startup product to an expansive portfolio of web, mobile, and
      tablet applications, UI chaos inevitably follows. Different engineering squads independently implement buttons, color
      palettes, and modal dialogs. Over time, the flagship application contains fifteen slightly different shades of blue,
      seven distinct primary button styles, and erratic spacing hierarchies. This fragmentation degrades brand credibility,
      frustrates users, and forces developers to waste thousands of engineering hours reinventing basic visual components.
      Shared design tokens ensure visual cohesion across independent user interfaces.
    content_tr: Bir teknoloji şirketi tek bir girişim ürününden geniş bir web, mobil ve tablet uygulamaları portföyüne doğru
      büyüdüğünde kaçınılmaz olarak kullanıcı arayüzü kaosu ortaya çıkar. Farklı mühendislik ekipleri butonları, renk paletlerini
      ve modal diyalogları birbirinden bağımsız olarak uygular. Zamanla ana uygulama mavinin on beş farklı tonunu, yedi farklı
      birincil buton stilini ve düzensiz boşluk hiyerarşilerini barındırır hale gelir. Bu parçalanma marka güvenilirliğini
      zedeler, kullanıcıları hayal kırıklığına uğratır ve yazılımcıların temel görsel bileşenleri yeniden icat ederek binlerce
      mühendislik saatini boşa harcamasına neden olur. Paylaşılan tasarım belirteçleri bağımsız kullanıcı arayüzleri genelinde
      görsel uyum sağlar.
  - paragraph_index: 2
    title: The Power of Design Tokens
    content_en: 'At the architectural foundation of a modern design system lies the concept of ''Design Tokens''. A design
      token is an agnostic key-value pair that stores design decisions: typography scales, hex colors, corner radii, and elevation
      shadows. Rather than hardcoding ''#0052CC'' into an Android XML layout, a React CSS stylesheet, and an iOS Swift view,
      developers reference a single semantic token such as ''color.brand.primary''. When brand guidelines evolve, designers
      update the token once, and changes propagate automatically across all platforms via automated build scripts.'
    content_tr: 'Modern bir tasarım sisteminin mimari temelinde ''Tasarım Belirteçleri'' (Design Tokens) kavramı yer alır.
      Bir tasarım belirteci tasarım kararlarını saklayan platformdan bağımsız bir anahtar-değer çiftidir: tipografi ölçekleri,
      hex renkleri, köşe yuvarlama değerleri ve gölge yükseklikleri. Yazılımcılar bir Android XML düzenine, bir React CSS
      stiline ve bir iOS Swift görünümüne elle ''#0052CC'' kodlamak yerine ''color.brand.primary'' gibi tek bir anlamsal belirtece
      başvururlar. Marka kuralları değiştiğinde tasarımcılar belirteci bir kez günceller ve değişiklikler otomatik derleme
      betikleri aracılığıyla tüm platformlara kendiliğinden yayılır.'
  - paragraph_index: 3
    title: Component Libraries and Accessibility by Default
    content_en: Above the token layer sits the shared component library. Buttons, dropdowns, navigation rails, and data tables
      are engineered once as robust, accessible building blocks. Crucially, complex accessibility requirements—such as screen
      reader announcements, focus states, dynamic text resizing, and keyboard navigation—are solved centrally. Feature developers
      simply assemble pre-tested, accessible components like building blocks, accelerating delivery while ensuring legal compliance
      with international accessibility standards.
    content_tr: Belirteç katmanının üzerinde paylaşılan bileşen kütüphanesi yer alır. Butonlar, açılır menüler, navigasyon
      çubukları ve veri tabloları sağlam, erişilebilir yapı taşları olarak bir kez tasarlanır. En önemlisi ekran okuyucu duyuruları,
      odaklanma durumları, dinamik metin yeniden boyutlandırma ve klavye navigasyonu gibi karmaşık erişilebilirlik gereksinimleri
      merkezi olarak çözülür. Özellik geliştiricileri önceden test edilmiş, erişilebilir bileşenleri yapı taşları gibi bir
      araya getirerek uluslararası erişilebilirlik standartlarına yasal uyumu sağlarken teslimatı hızlandırırlar.
  - paragraph_index: 4
    title: Governance and the Living System
    content_en: The most sophisticated component library will wither into irrelevance without active governance. A design
      system is not a static code repository; it is an ongoing interdisciplinary contract between design and engineering.
      Cross-functional committees meet bi-weekly to review proposed component contributions, deprecate outdated patterns,
      and audit production applications for design drift. When treated as an evolving product with dedicated maintainers,
      a design system becomes an extraordinary multiplier of organizational velocity.
    content_tr: En gelişmiş bileşen kütüphanesi bile aktif yönetişim olmadan körelip etkisizleşecektir. Bir tasarım sistemi
      statik bir kod deposu değildir; tasarım ve mühendislik arasında devam eden disiplinler arası bir sözleşmedir. Fonksiyonlar
      arası komiteler önerilen bileşen katkılarını incelemek, modası geçmiş kalıpları kullanımdan kaldırmak ve canlı uygulamaları
      tasarım sapması açısından denetlemek için iki haftada bir toplanır. Özel bakımcıları olan gelişen bir ürün olarak ele
      alındığında bir tasarım sistemi, kurumsal hızın olağanüstü bir çarpanı haline gelir.
  vocabulary_annotations:
  - word: cohesion
    vocab_id: vocab.cohesion
    context_definition_en: The state of sticking together or creating a unified, harmonious whole.
    context_meaning_tr: Birbirine kenetlenme veya uyumlu bir bütün oluşturma durumu (bütünlük).
  - word: startup
    vocab_id: vocab.startup
    context_definition_en: A newly established business venture, especially in the technology sector.
    context_meaning_tr: girişim, yeni kurulan şirket (startup)
  comprehension_questions:
  - id: q_r_b2_04_01
    question_en: What visual problem commonly emerges when expanding software products lack a unified design system?
    question_tr_hint: Genişleyen yazılım ürünlerinde birleşik bir tasarım sistemi olmadığında yaygın olarak hangi görsel sorun
      ortaya çıkar?
    options:
    - Inconsistent UI elements, fragmented color palettes, and erratic spacing hierarchies
    - All software buttons permanently disappear from computer screens
    - Computer monitors display black and white images exclusively
    - Users are legally fined by the government for clicking on buttons
    correct_answer: Inconsistent UI elements, fragmented color palettes, and erratic spacing hierarchies
    explanation_en: Paragraph 1 highlights UI chaos with fifteen shades of blue and erratic spacing.
    explanation_tr: 1. paragraf mavinin on beş tonu ve düzensiz boşluklarla oluşan UI kaosunu vurgular.
  - id: q_r_b2_04_02
    question_en: What is a 'Design Token' as explained in the second paragraph?
    question_tr_hint: İkinci paragrafta açıklandığı gibi bir 'Tasarım Belirteci' (Design Token) nedir?
    options:
    - A physical plastic coin given to software engineers on their birthdays
    - A cryptographic digital coin used to purchase office stationery
    - A complex password required to turn on office lighting systems
    - A platform-agnostic key-value pair storing foundational design decisions like color or typography
    correct_answer: A platform-agnostic key-value pair storing foundational design decisions like color or typography
    explanation_en: Paragraph 2 defines a token as an agnostic key-value pair storing design decisions.
    explanation_tr: 2. paragraf belirteci tasarım kararlarını saklayan platformdan bağımsız anahtar-değer çifti olarak tanımlar.
  - id: q_r_b2_04_03
    question_en: How does a centralized component library improve software accessibility?
    question_tr_hint: Merkezi bir bileşen kütüphanesi yazılım erişilebilirliğini nasıl geliştirir?
    options:
    - By eliminating the need for users to look at computer screens
    - Screen reader states, keyboard navigation, and text resizing are solved centrally once
    - By translating all software code into ancient classical Greek
    - By requiring all software users to take an official eye examination
    correct_answer: Screen reader states, keyboard navigation, and text resizing are solved centrally once
    explanation_en: Paragraph 3 explains accessibility requirements are solved centrally in shared components.
    explanation_tr: 3. paragraf ekran okuyucu ve klavye erişilebilirliğinin merkezi olarak bir kez çözüldüğünü belirtir.
  - id: q_r_b2_04_04
    question_en: Why will a design system wither into irrelevance without active governance?
    question_tr_hint: Bir tasarım sistemi aktif yönetişim olmadan neden körelip etkisizleşir?
    options:
    - Without cross-discipline review committees, design drift and outdated patterns proliferate
    - Because computer programming languages expire after twelve calendar months
    - Because designers and engineers are legally forbidden from meeting in person
    - Because all software code is deleted by operating systems every weekend
    correct_answer: Without cross-discipline review committees, design drift and outdated patterns proliferate
    explanation_en: Paragraph 4 explains governance prevents design drift and deprecates outdated patterns.
    explanation_tr: 4. paragraf yönetişimin tasarım sapmasını önlediğini ve eski kalıpları temizlediğini açıklar.
  - id: q_r_b2_04_05
    question_en: What major efficiency benefit do design tokens offer when rebranding?
    question_tr_hint: Tasarım belirteçleri marka yenileme sırasında ne gibi büyük bir verimlilik avantajı sunar?
    options:
    - It eliminates the need for any future software testing
    - It guarantees that mobile phones will never run out of battery power
    - It allows developers to work without receiving financial salaries
    - Updating a token once automatically propagates changes across web, iOS, and Android platforms
    correct_answer: Updating a token once automatically propagates changes across web, iOS, and Android platforms
    explanation_en: Paragraph 2 explains designers update the token once and changes propagate automatically.
    explanation_tr: 2. paragraf belirtecin bir kez güncellenmesiyle değişikliklerin tüm platformlara yayıldığını belirtir.
