- id: reading.b1.effective-code-reviews
  title: Constructive Peer Feedback in Modern Software Teams
  cefr_level: B1
  category: engineering_culture
  summary_en: 'Best practices for conducting peer code reviews: focusing on architecture over stylistic nitpicks, phrasing
    suggestions empathetically, and maintaining fast review turnarounds.'
  summary_tr: 'Meslektaş kod incelemelerinde en iyi uygulamalar: üslup takıntısı yerine mimariye odaklanma, empatik geri bildirim
    verme ve hızlı inceleme döngüleri.'
  word_count: 245
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: The Double Purpose of Code Reviews
    content_en: Peer code reviews are widely recognized as a cornerstone of software quality assurance. When an engineer finishes
      a feature branch, peers inspect the pull request before changes are integrated into the main branch. While the primary
      goal is identifying logic defects and security vulnerabilities, an equally important secondary objective is knowledge
      sharing. Reviewing code exposes team members to novel design patterns and prevents knowledge from becoming concentrated
      in a single individual.
    content_tr: Meslektaş kod incelemeleri, yazılım kalite güvencesinin temel taşı olarak geniş çapta kabul görmektedir. Bir
      mühendis bir özellik dalını bitirdiğinde, değişiklikler ana dala entegre edilmeden önce meslektaşları çekme isteğini
      inceler. Birincil amaç mantık hatalarını ve güvenlik açıklarını tespit etmek olsa da, eşit derecede önemli bir ikincil
      hedef de bilgi paylaşımıdır. Kod incelemesi ekip üyelerini yeni tasarım kalıplarıyla tanıştırır ve bilginin tek bir
      bireyde toplanmasını önler.
  - paragraph_index: 2
    title: Automating Style to Focus on Substance
    content_en: 'A common dysfunction in peer reviews is wasting hours debating trivial formatting preferences, such as indentation
      spacing or variable naming conventions. High-performing engineering teams eliminate this friction by enforcing automated
      formatters and linters in their CI/CD pipelines. When automated tools handle mechanical syntax compliance, human reviewers
      can dedicate their cognitive energy to meaningful architectural concerns: concurrency, memory allocation, and API robustness.'
    content_tr: 'Kod incelemelerinde yaygın bir işlev bozukluğu girinti aralığı veya değişken adlandırma kuralları gibi önemsiz
      biçimlendirme tercihleri üzerinde saatlerce tartışmaktır. Yüksek performanslı mühendislik ekipleri CI/CD hatlarında
      otomatik biçimlendiriciler ve linter araçları uygulayarak bu sürtünmeyi ortadan kaldırır. Otomatik araçlar mekanik sözdizimi
      uyumunu hallettiğinde, insan incelemeciler bilişsel enerjilerini anlamlı mimari konulara ayırabilir: eşzamanlılık, bellek
      tahsisi ve API dayanıklılığı.'
  - paragraph_index: 3
    title: The Art of Empathetic Phrasing
    content_en: Receiving critical feedback on code you worked hard to build can feel personal. Reviewers must frame observations
      constructively. Rather than issuing abrupt commands ('Change this function immediately'), experienced reviewers frame
      comments as collaborative inquiries ('What do you think about breaking this method into two smaller functions to improve
      testability?'). Phrasing feedback around shared product outcomes fosters psychological safety and mutual respect.
    content_tr: İnşa etmek için çok çalıştığınız kod hakkında eleştirel geri bildirim almak kişisel hissettirebilir. İncelemeciler
      gözlemlerini yapıcı şekilde çerçevelemelidir. 'Bu fonksiyonu derhal değiştir' gibi kaba emirler vermek yerine deneyimli
      incelemeciler yorumlarını iş birliğine dayalı sorular olarak ifade eder ('Test edilebilirliği artırmak için bu yöntemi
      iki küçük fonksiyona bölmek hakkında ne düşünüyorsun?'). Geri bildirimi ortak ürün çıktıları etrafında çerçevelemek
      psikolojik güvenliği ve karşılıklı saygıyı geliştirir.
  - paragraph_index: 4
    title: The Cost of Review Latency
    content_en: Finally, the velocity of an engineering team hinges on review turnaround times. When pull requests sit unreviewed
      for days, developers must switch context, leading to cognitive fatigue and merge conflicts. Treating peer reviews as
      a first-class daily priority—aiming to review code within four to six business hours—keeps project momentum fluid and
      predictable.
    content_tr: Son olarak, bir mühendislik ekibinin hızı inceleme geri dönüş sürelerine bağlıdır. Çekme istekleri günlerce
      incelenmeden beklediğinde yazılımcılar bağlam değiştirmek zorunda kalır, bu da bilişsel yorgunluğa ve birleştirme çakışmalarına
      yol açar. Meslektaş incelemelerini birinci sınıf bir günlük öncelik olarak görmek (kodu dört ila altı iş saati içinde
      incelemeyi hedeflemek) proje ivmesini akıcı ve öngörülebilir tutar.
  vocabulary_annotations:
  - word: concurrency
    vocab_id: vocab.concurrency
    context_definition_en: The ability of different parts of a program to be executed out-of-order or simultaneously.
    context_meaning_tr: Bir programın farklı bölümlerinin eşzamanlı veya sırasız yürütülebilme yeteneği.
  - word: velocity
    vocab_id: vocab.velocity
    context_definition_en: The speed and efficiency of a team in completing committed deliverables.
    context_meaning_tr: Bir ekibin taahhüt edilen işleri tamamlama hızı ve verimliliği.
  comprehension_questions:
  - id: q_r_b1_04_01
    question_en: Besides detecting software bugs, what is the major secondary benefit of code reviews?
    question_tr_hint: Yazılım hatalarını tespit etmenin yanı sıra, kod incelemelerinin ana ikincil faydası nedir?
    options:
    - Providing an automated calculation of yearly employee income taxes
    - Testing the physical durability of server room floor tiles
    - Eliminating the need for customers to pay for software licenses
    - Facilitating team knowledge sharing and preventing single points of failure
    correct_answer: Facilitating team knowledge sharing and preventing single points of failure
    explanation_en: Paragraph 1 highlights knowledge sharing and preventing knowledge silos.
    explanation_tr: 1. paragraf bilgi paylaşımını ve bilginin tek kişide toplanmasını önlemeyi vurgular.
  - id: q_r_b1_04_02
    question_en: How do elite engineering squads eliminate trivial debates over formatting?
    question_tr_hint: Seçkin mühendislik ekipleri biçimlendirme üzerine önemsiz tartışmaları nasıl ortadan kaldırır?
    options:
    - By completely banning variable names longer than three characters
    - By automating syntax linting and formatting within their CI/CD pipelines
    - By writing all software code entirely on physical paper notepads
    - By forcing the junior developer to pay for the reviewer's lunch
    correct_answer: By automating syntax linting and formatting within their CI/CD pipelines
    explanation_en: Paragraph 2 explains automated formatters and linters handle mechanical syntax.
    explanation_tr: 2. paragraf otomatik linter ve biçimlendiricilerin sözdizimi uyumunu hallettiğini belirtir.
  - id: q_r_b1_04_03
    question_en: How should reviewers phrase feedback to maintain collaboration and respect?
    question_tr_hint: İncelemeciler iş birliğini ve saygıyı korumak için geri bildirimleri nasıl ifade etmelidir?
    options:
    - As harsh, blunt personal commands demanding immediate obedience
    - In secret encrypted code that the developer cannot read
    - As constructive collaborative inquiries focused on testability and outcomes
    - By posting anonymous complaints on public internet blogs
    correct_answer: As constructive collaborative inquiries focused on testability and outcomes
    explanation_en: Paragraph 3 advises framing comments as collaborative inquiries.
    explanation_tr: 3. paragraf yorumları iş birliğine dayalı yapıcı sorular olarak ifade etmeyi önerir.
  - id: q_r_b1_04_04
    question_en: What negative operational outcome occurs when pull requests sit unreviewed for days?
    question_tr_hint: Çekme istekleri günlerce incelenmeden beklediğinde hangi olumsuz operasyonel sonuç ortaya çıkar?
    options:
    - Engineers suffer context-switching fatigue and face painful merge conflicts
    - Computers permanently erase their internal hard drives
    - The company is forced to relocate its headquarters to another continent
    - All software code converts into machine assembly language
    correct_answer: Engineers suffer context-switching fatigue and face painful merge conflicts
    explanation_en: Paragraph 4 describes context switching, cognitive fatigue, and merge conflicts.
    explanation_tr: 4. paragraf bağlam değiştirme yorgunluğu ve birleştirme çakışmalarını anlatır.
  - id: q_r_b1_04_05
    question_en: What recommended turnaround window does the text suggest for peer reviews?
    question_tr_hint: Metin meslektaş incelemeleri için hangi geri dönüş süresi aralığını önermektedir?
    options:
    - Exactly thirty business days
    - Between two and three minutes at midnight
    - Within four to six business hours
    - Only once every six calendar months
    correct_answer: Within four to six business hours
    explanation_en: Paragraph 4 suggests aiming to review code within four to six business hours.
    explanation_tr: 4. paragraf kodu 4 ila 6 iş saati içinde incelemeyi hedeflemeyi tavsiye eder.
  topic_tags:
