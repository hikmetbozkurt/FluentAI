- id: reading.b1.venture-capital-basics
  title: Understanding Seed Funding and Early-Stage Startup Investment
  cefr_level: B1
  category: finance_and_economics
  summary_en: 'An introduction to early-stage venture capital: pre-seed vs. seed rounds, equity dilution trade-offs, and what
    investors look for in founders and market validation.'
  summary_tr: 'Erken aşama girişim sermayesine giriş: tohum öncesi ve tohum turları, hisse seyrelmesi (dilution) dengesi ve
    yatırımcıların aradığı kriterler.'
  word_count: 238
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: The Lifecycle of Early Startup Financing
    content_en: Building an innovative technology enterprise requires upfront capital long before customer revenue covers
      daily operational expenses. In the earliest stages, founders typically fund their minimum viable product through personal
      savings or angel investors—wealthy individuals who provide initial risk capital. However, once a product shows promising
      traction and early customer engagement, founders look toward venture capital (VC) firms to accelerate expansion.
    content_tr: Yenilikçi bir teknoloji şirketi kurmak, müşteri gelirleri günlük operasyonel harcamaları karşılamadan çok
      önce peşin sermaye gerektirir. En erken aşamalarda kurucular genellikle minimum uygulanabilir ürünlerini kişisel birikimleriyle
      veya melek yatırımcılarla (ilk risk sermayesini sağlayan varlıklı bireyler) finanse ederler. Ancak bir ürün umut verici
      bir çekim gücü (traction) ve erken müşteri bağlılığı gösterdiğinde kurucular büyümeyi hızlandırmak için girişim sermayesi
      (VC) firmalarına yönelirler.
  - paragraph_index: 2
    title: Pre-Seed and Seed Rounds Explained
    content_en: Early funding is structured into defined investment rounds. A 'pre-seed' round generally ranges from fifty
      thousand to five hundred thousand dollars, enabling founders to build a working prototype and conduct user discovery.
      The subsequent 'seed' round, often scaling from one to three million dollars, finances early engineering hires, infrastructure
      scaling, and customer acquisition channels. In exchange for capital, investors receive equity shares in the company.
    content_tr: Erken aşama finansmanı tanımlanmış yatırım turlarına bölünür. 'Tohum öncesi' (pre-seed) turu genellikle elli
      bin ila beş yüz bin dolar arasında değişir ve kurucuların çalışan bir prototip oluşturmasına ve kullanıcı keşfi yapmasına
      olanak tanır. Genellikle bir ila üç milyon dolar arasında değişen müteakip 'tohum' (seed) turu ise ilk mühendis işe
      alımlarını, altyapı ölçeklendirmesini ve müşteri edinme kanallarını finanse eder. Sermaye karşılığında yatırımcılar
      şirketten hisse senedi (equity) alırlar.
  - paragraph_index: 3
    title: The Reality of Equity Dilution
    content_en: Securing venture funding is not free money; it represents a permanent sale of ownership. Each time a startup
      issues new shares to investors, the founders' personal ownership percentage decreases—a mathematical phenomenon known
      as dilution. Astute founders balance the urgency of securing capital with the discipline of preserving enough equity
      to maintain corporate control and stay motivated across future funding rounds.
    content_tr: Girişim sermayesi yatırımı almak bedava para değildir; kalıcı bir mülkiyet satışını temsil eder. Bir girişim
      yatırımcılara her yeni hisse ihraç ettiğinde, kurucuların kişisel mülkiyet yüzdesi azalır (bu matematiksel olgu seyrelme
      / dilution olarak bilinir). Akıllı kurucular, sermaye sağlama aciliyeti ile şirket kontrolünü sürdürmek ve gelecekteki
      yatırım turlarında motive kalmak için yeterli hisseyi koruma disiplinini dengeler.
  - paragraph_index: 4
    title: What Venture Investors Truly Evaluate
    content_en: 'While novice entrepreneurs assume that venture capitalists primarily invest in patentable proprietary code,
      early-stage investors actually prioritize two factors: total addressable market size and founder resilience. Technology
      can be rewritten and business models can pivot, but navigating intense market competition requires founders who demonstrate
      relentless problem-solving, deep sector domain expertise, and commercial adaptability.'
    content_tr: 'Acemi girişimciler girişim sermayedarlarının öncelikle patentlenebilir tescilli koda yatırım yaptığını varsaysa
      da, erken aşama yatırımcıları aslında iki faktöre öncelik verir: toplam pazar büyüklüğü ve kurucu dayanıklılığı. Teknoloji
      yeniden yazılabilir ve iş modelleri pivot edebilir, ancak yoğun pazar rekabetinde yol almak amansız problem çözme, derin
      sektör uzmanlığı ve ticari uyum yeteneği gösteren kurucular gerektirir.'
  vocabulary_annotations:
  - word: customer
    vocab_id: vocab.customer
    context_definition_en: A person or organization that buys goods or services from a store or business.
    context_meaning_tr: müşteri, alıcı
  - word: resilience
    vocab_id: vocab.resilience
    context_definition_en: The capacity to recover quickly from difficulties, setbacks, and tough conditions.
    context_meaning_tr: Zorluklardan ve aksiliklerden hızla toparlanma kapasitesi (dayanıklılık).
  comprehension_questions:
  - id: q_r_b1_05_01
    question_en: How is a startup's minimum viable product typically funded in the earliest stage?
    question_tr_hint: Bir girişimin minimum uygulanabilir ürünü en erken aşamada genellikle nasıl finanse edilir?
    options:
    - Via large commercial bank loans backed by government bonds
    - Through personal founder savings and angel investors
    - Through massive international public stock offerings on Wall Street
    - By selling commercial real estate owned by local universities
    correct_answer: Through personal founder savings and angel investors
    explanation_en: Paragraph 1 states founders use personal savings or angel investors.
    explanation_tr: 1. paragraf kurucuların birikimlerini veya melek yatırımcıları kullandığını belirtir.
  - id: q_r_b1_05_02
    question_en: What is the primary operational objective of a 'seed' funding round?
    question_tr_hint: Bir 'tohum' (seed) yatırım turunun birincil operasyonel hedefi nedir?
    options:
    - Purchasing private luxury jets for the founding executive team
    - Paying off national government foreign debts
    - Constructing physical retail shopping centers in ten cities
    - Financing early engineering hires, infrastructure scaling, and customer acquisition
    correct_answer: Financing early engineering hires, infrastructure scaling, and customer acquisition
    explanation_en: Paragraph 2 explains seed rounds finance engineering hires, infrastructure, and acquisition.
    explanation_tr: 2. paragraf tohum turunun mühendis istihdamını ve altyapı ölçeklemeyi finanse ettiğini açıklar.
  - id: q_r_b1_05_03
    question_en: What does 'equity dilution' mean for startup founders?
    question_tr_hint: Girişim kurucuları için 'hisse seyrelmesi' (dilution) ne anlama gelir?
    options:
    - Their software source code becomes completely public open source
    - Their personal bank accounts are frozen by financial regulators
    - Their percentage of ownership decreases as new shares are issued to investors
    - The company must change its legal name after every meeting
    correct_answer: Their percentage of ownership decreases as new shares are issued to investors
    explanation_en: Paragraph 3 defines dilution as the decrease in founders' ownership percentage.
    explanation_tr: 3. paragraf seyrelmeyi kurucuların mülkiyet yüzdesinin azalması olarak tanımlar.
  - id: q_r_b1_05_04
    question_en: What two criteria do early-stage venture capitalists prioritize most when investing?
    question_tr_hint: Erken aşama girişim yatırımcıları yatırım yaparken en çok hangi iki kritere öncelik verir?
    options:
    - Total addressable market size and founder resilience
    - The physical height and athletic ability of the programmers
    - The geographic distance between the office and the ocean
    - The number of social media followers the company has
    correct_answer: Total addressable market size and founder resilience
    explanation_en: Paragraph 4 emphasizes total addressable market size and founder resilience.
    explanation_tr: 4. paragraf toplam pazar büyüklüğü ve kurucu dayanıklılığını vurgular.
  - id: q_r_b1_05_05
    question_en: What do venture capital investors receive in exchange for providing risk capital?
    question_tr_hint: Girişim sermayesi yatırımcıları risk sermayesi sağlama karşılığında ne alırlar?
    options:
    - A guaranteed monthly interest payment regardless of performance
    - The intellectual copyright to the founder's personal diary
    - A physical key to the city where the company was incorporated
    - Equity shares representing partial ownership of the company
    correct_answer: Equity shares representing partial ownership of the company
    explanation_en: Paragraph 2 states that in exchange for capital, investors receive equity shares.
    explanation_tr: 2. paragraf sermaye karşılığında yatırımcıların şirketten hisse aldığını belirtir.
  topic_tags:
  - venture-capital
  - startups
  - finance
  - b1-reading
  related_ids:
  - vocab.resilience
  - vocab.customer
  status: APPROVED
  version: 1
- id: reading.b1.product-discovery-interviews
  title: Conducting Meaningful Customer Discovery Interviews
  cefr_level: B1
  category: business_strategy
  summary_en: Techniques for asking unbiased, open-ended questions during user discovery interviews to uncover genuine customer
    pain points before writing code.
  summary_tr: 'Kullanıcı keşif görüşmelerinde tarafsız ve açık uçlu sorular sorma teknikleri: kod yazmadan önce gerçek müşteri
    sorunlarını ortaya çıkarma.'
  word_count: 259
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: The Flaw of Hypothetical Customer Questions
    content_en: 'One of the most dangerous traps for technology entrepreneurs is building software based on unvalidated assumptions.
      Product managers frequently interview prospective clients and ask leading questions like: ''If we built an AI tool that
      organizes your inbox, would you pay twenty dollars a month for it?'' Most people naturally want to be polite, so they
      enthusiastically answer ''Yes''. However, when the product launches months later, zero sales materialize because hypothetical
      commitments rarely predict real financial behavior.'
    content_tr: 'Teknoloji girişimcileri için en tehlikeli tuzaklardan biri, doğrulanmamış varsayımlara dayalı yazılım geliştirmektir.
      Ürün yöneticileri sıklıkla potansiyel müşterilerle görüşür ve yönlendirici sorular sorar: ''Gelen kutunuzu düzenleyen
      bir yapay zeka aracı yapsaydık, buna ayda yirmi dolar öder miydiniz?'' Çoğu insan doğal olarak kibar olmak ister, bu
      yüzden hevesle ''Evet'' yanıtını verir. Ancak ürün aylar sonra piyasaya çıktığında sıfır satış gerçekleşir çünkü varsayımsal
      taahhütler nadiren gerçek finansal davranışı tahmin eder.'
  - paragraph_index: 2
    title: Focusing on Past Behavior Rather than Opinions
    content_en: 'To extract authentic customer insight, skilled product interviewers follow a golden rule: ask exclusively
      about past actions, never future intentions. Instead of asking what features users might desire tomorrow, ask: ''Tell
      me about the last time you struggled to organize your inbox. What specific steps did you take to solve it?'' Real past
      behavior reveals actual friction, actual workarounds, and whether the problem is painful enough that people currently
      spend money or effort trying to fix it.'
    content_tr: 'Özgün müşteri içgörüsü elde etmek için yetenekli ürün mülakatçıları altın bir kuralı takip eder: yalnızca
      geçmiş eylemler hakkında soru sorun, asla gelecekteki niyetler hakkında değil. Kullanıcıların yarın hangi özellikleri
      isteyebileceğini sormak yerine şunu sorun: ''Gelen kutunuzu düzenlemekte en son ne zaman zorlandığınızı anlatın. Bunu
      çözmek için hangi somut adımları attınız?'' Gerçek geçmiş davranış gerçek sürtünmeyi, geçici çözümleri ve sorunun insanların
      şu anda düzeltmek için para veya çaba harcayacak kadar acı verici olup olmadığını ortaya koyar.'
  - paragraph_index: 3
    title: Embracing Awkward Silence
    content_en: During customer interviews, inexperienced interviewers feel uncomfortable when a participant pauses to think,
      and they instinctively jump in to fill the silence with product pitches. Masterful interviewers embrace silence. Giving
      the client five to ten seconds of space encourages them to articulate deeper frustrations and unscripted thoughts that
      often reveal the most transformative market insights.
    content_tr: Müşteri görüşmeleri sırasında deneyimsiz mülakatçılar bir katılımcı düşünmek için durakladığında rahatsız
      hisseder ve içgüdüsel olarak sessizliği ürün tanıtımlarıyla doldurmaya çalışırlar. Usta mülakatçılar ise sessizliği
      benimser. Müşteriye beş ila on saniyelik bir alan vermek, onları genellikle en dönüştürücü pazar içgörülerini ortaya
      çıkaran daha derin hayal kırıklıklarını ve plansız düşüncelerini dile getirmeye teşvik eder.
  - paragraph_index: 4
    title: Synthesizing Patterns Across Segments
    content_en: A single customer interview provides interesting anecdotes, but product strategy cannot be pivoted on one
      conversation. Teams must conduct fifteen to twenty interviews across a defined segment before synthesizing findings
      into thematic clusters. When multiple independent companies report the exact same operational bottleneck, engineering
      leadership can build software with high conviction.
    content_tr: Tek bir müşteri görüşmesi ilginç anekdotlar sağlar, ancak ürün stratejisi tek bir konuşma üzerine pivot edilemez.
      Ekipler bulguları tematik kümeler halinde sentezlemeden önce tanımlanmış bir segment genelinde on beş ila yirmi görüşme
      yapmalıdır. Birden fazla bağımsız şirket tam olarak aynı operasyonel darboğazı bildirdiğinde, mühendislik liderliği
      yüksek bir inançla yazılım geliştirebilir.
  vocabulary_annotations:
  - word: anecdote
    vocab_id: vocab.anecdote
    context_definition_en: A short and interesting story about a real incident or person, but not conclusive proof.
    context_meaning_tr: Bir kişi veya olay hakkında kısa, ilginç anlatı (anekdot).
  - word: dangerous
    vocab_id: vocab.dangerous
    context_definition_en: Able or likely to cause harm, injury, or severe problems.
    context_meaning_tr: tehlikeli
  comprehension_questions:
  - id: q_r_b1_06_01
    question_en: Why are hypothetical questions like 'Would you pay for feature X?' considered flawed?
    question_tr_hint: '''X özelliğine para öder miydiniz?'' gibi varsayımsal sorular neden hatalı kabul edilir?'
    options:
    - International patent law prohibits asking questions about software pricing
    - People answer politely in interviews, but hypothetical promises rarely predict actual purchasing
    - Computers cannot record audio interviews that contain conditional grammar
    - Customers will only tell the truth if they are offered cash rewards immediately
    correct_answer: People answer politely in interviews, but hypothetical promises rarely predict actual purchasing
    explanation_en: Paragraph 1 explains people politely say yes, but hypothetical promises rarely predict behavior.
    explanation_tr: 1. paragraf insanların nezaketen evet dediğini ama varsayımsal vaatlerin davranışı yansıtmadığını belirtir.
  - id: q_r_b1_06_02
    question_en: What is the 'golden rule' of effective customer discovery interviews?
    question_tr_hint: Etkili müşteri keşif görüşmelerinin 'altın kuralı' nedir?
    options:
    - Inquiring exclusively about actual past actions rather than speculative future intentions
    - Never allowing the customer to speak for more than ten seconds continuously
    - Demonstrating a finished product prototype before asking any questions
    - Conducting all interviews exclusively through text messaging
    correct_answer: Inquiring exclusively about actual past actions rather than speculative future intentions
    explanation_en: Paragraph 2 states the golden rule is asking about past actions, never future intentions.
    explanation_tr: 2. paragraf altın kuralın gelecek niyetleri değil geçmiş eylemleri sormak olduğunu açıklar.
  - id: q_r_b1_06_03
    question_en: Why should interviewers embrace pauses and silence during interviews?
    question_tr_hint: Mülakatçılar görüşmeler sırasında duraklamaları ve sessizliği neden benimsemelidir?
    options:
    - It reduces the cost of mobile telephone connection charges
    - It allows the interviewer to check their personal social media accounts
    - It indicates that the customer has completely lost interest in the call
    - It gives participants time to articulate deeper, unscripted frustrations and insights
    correct_answer: It gives participants time to articulate deeper, unscripted frustrations and insights
    explanation_en: Paragraph 3 notes giving 5-10 seconds of space encourages deeper thoughts.
    explanation_tr: 3. paragraf müşteriye alan tanımanın daha derin düşünceleri dile getirmesini sağladığını belirtir.
  - id: q_r_b1_06_04
    question_en: Why is a single customer interview insufficient to pivot product strategy?
    question_tr_hint: Ürün stratejisini değiştirmek için tek bir müşteri görüşmesi neden yetersizdir?
    options:
    - Government regulators require corporate interviews to be signed by a notary
    - One interview provides only anecdotes, requiring 15-20 interviews to identify reliable patterns
    - Single interviews are automatically deleted by audio recording software
    - No single human being can accurately describe their daily work tasks
    correct_answer: One interview provides only anecdotes, requiring 15-20 interviews to identify reliable patterns
    explanation_en: Paragraph 4 explains a single interview is anecdotal; 15-20 are needed to find patterns.
    explanation_tr: 4. paragraf tek görüşmenin anekdottan ibaret olduğunu, örüntü bulmak için 15-20 görüşme gerektiğini açıklar.
  - id: q_r_b1_06_05
    question_en: What does discovering existing customer 'workarounds' reveal to a product team?
    question_tr_hint: Müşterinin mevcut 'geçici çözümlerini' keşfetmek bir ürün ekibine neyi gösterir?
    options:
    - That the customer is violating their internal corporate computer policies
    - That the software market is already completely saturated by foreign competitors
    - That the problem is painful enough that users currently expend real effort to address it
    - That the client has no budget available to purchase software solutions
    correct_answer: That the problem is painful enough that users currently expend real effort to address it
    explanation_en: Paragraph 2 notes that workarounds show if the problem is painful enough that people spend effort.
    explanation_tr: 2. paragraf geçici çözümlerin sorunun çaba harcanacak kadar acı verici olduğunu kanıtladığını söyler.
