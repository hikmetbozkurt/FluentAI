    correct_answer: To ask incisive questions and protect their team from unrealistic commitments
    explanation_en: Paragraph 4 explains technical literacy helps ask incisive questions and avoid unrealistic goals.
    explanation_tr: 4. paragraf teknik bilginin keskin sorular sormaya ve ekibi korumaya yardımcı olduğunu belirtir.
