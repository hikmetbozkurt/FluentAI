- id: reading.b1.quarterly-department-budget
  title: How Teams Plan a Quarterly Operating Budget
  cefr_level: B1
  category: finance_and_economics
  summary_en: A clear walkthrough of fixed costs, variable growth expenses, and contingency buffers inside a quarterly department
    budget.
  summary_tr: Üç aylık bir departman bütçesinde sabit giderler, değişken büyüme harcamaları ve ihtiyat paylarının nasıl planlandığını
    anlatan net bir rehber.
  word_count: 274
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: Separating Fixed Commitments From Flexible Spend
    content_en: When managers draft a quarterly budget, the first rule is separating committed expenses from discretionary
      requests. Fixed obligations—such as core cloud hosting, contracted vendor retainers, and full-time payroll—will occur
      regardless of how fast new projects launch. Discretionary items, like external workshops, travel to industry conferences,
      or experimental software trials, can be scaled up or postponed depending on revenue performance. Listing baseline commitments
      first prevents teams from accidentally promising money that is already spoken for.
    content_tr: Yöneticiler üç aylık bir bütçe taslağı hazırlarken ilk kural, taahhüt edilmiş giderleri isteğe bağlı taleplerden
      ayırmaktır. Çekirdek bulut barındırma, sözleşmeli tedarikçi ücretleri ve tam zamanlı maaş bordrosu gibi sabit yükümlülükler
      yeni projeler ne kadar hızlı başlarsa başlasın gerçekleşecektir. Dış eğitim atölyeleri, sektör konferansı seyahatleri
      veya deneysel yazılım denemeleri gibi esnek kalemler ise gelir performansına göre artırılabilir veya ertelenebilir.
      Temel yükümlülükleri önce listelemek ekiplerin halihazırda bağlanmış parayı yanlışlıkla vaat etmesini önler.
  - paragraph_index: 2
    title: Linking Forecast Spend to Operational Volume
    content_en: Unlike static rent bills, several operational costs fluctuate alongside customer activity. Payment processing
      fees, customer support tooling, and data bandwidth grow smoothly as more users adopt the product. Rather than guessing
      a random dollar figure for next quarter, strong budget owners tie these estimates directly to projected unit drivers—such
      as expected active accounts or monthly support tickets. Connecting forecasts to clear volume assumptions makes budget
      discussions constructive when finance partners review the sheet.
    content_tr: Sabit kira faturalarının aksine, çeşitli operasyonel maliyetler müşteri etkinliğiyle birlikte dalgalanır.
      Ödeme işlem ücretleri, müşteri destek araçları ve veri bant genişliği daha fazla kullanıcı ürünü benimsedikçe düzenli
      şekilde artar. Gelecek çeyrek için rastgele bir tutar tahmin etmek yerine güçlü bütçe sahipleri bu tahminleri beklenen
      aktif hesaplar veya aylık destek talepleri gibi öngörülen birim etkenlere bağlar. Tahminleri net hacim varsayımlarına
      dayandırmak finans ortakları tabloyu incelerken bütçe görüşmelerini yapıcı kılar.
  - paragraph_index: 3
    title: Reserving a Realistic Contingency Buffer
    content_en: No quarter unfolds strictly according to the spreadsheet created in week one. Hardware fails unexpectedly,
      regulatory filings require urgent legal review, or currency swings alter foreign supplier invoices. Leaving zero cushion
      forces managers to cut valuable training mid-quarter whenever surprises arise. Keeping a modest contingency reserve
      of five to eight percent provides calm flexibility without encouraging wasteful spending, provided drawdowns require
      clear written justification.
    content_tr: Hiçbir çeyrek, birinci haftada hazırlanan elektronik tabloya birebir uygun şekilde ilerlemez. Donanım beklenmedik
      şekilde arızalanır, yasal bildirimler acil hukuk incelemesi gerektirir veya kur dalgalanmaları yabancı tedarikçi faturalarını
      değiştirir. Sıfır tampon bırakmak, sürprizler çıktığında yöneticileri çeyrek ortasında değerli eğitimleri kesmeye zorlar.
      Yüzde beş ila sekizlik mütevazı bir ihtiyat rezervi tutmak, harcama çekişlerinin net yazılı gerekçe gerektirmesi şartıyla
      savurganlığı teşvik etmeden sakin bir esneklik sağlar.
  - paragraph_index: 4
    title: Running Monthly Variance Check-Ins
    content_en: Once the quarter begins, treating the budget as a forgotten archive file wastes the planning effort. A brief
      thirty-minute variance check after each monthly close reveals where actual spend drifted above or below expectations.
      Sometimes underspending signals a stalled hiring plan or delayed product launch rather than genuine savings. Addressing
      both overruns and delays early keeps department leaders aligned with company cash priorities.
    content_tr: Çeyrek başladığında bütçeyi unutulmuş bir arşiv dosyası gibi görmek tüm planlama emeğini boşa çıkarır. Her
      aylık kapanıştan sonra yapılan otuz dakikalık kısa bir sapma kontrolü, gerçekleşen harcamanın nerede beklentilerin üzerine
      çıktığını veya altında kaldığını gösterir. Bazen düşük harcama gerçek bir tasarruftan ziyade duraksamış bir işe alım
      planına veya gecikmiş bir ürün lansmanına işaret eder. Hem bütçe aşımlarını hem gecikmeleri erken ele almak departman
      liderlerini şirket nakit öncelikleriyle uyumlu tutar.
  vocabulary_annotations:
  - word: discretionary
    context_definition_en: optional spending that can be adjusted or delayed
    context_meaning_tr: isteğe bağlı, esnek
  - word: fluctuate
    context_definition_en: to rise and fall irregularly according to demand
    context_meaning_tr: dalgalanmak
  - word: contingency
    context_definition_en: funds set aside specifically for unexpected events
    context_meaning_tr: beklenmedik durum payı, ihtiyat
  - word: variance
    context_definition_en: the measured gap between planned budget and actual spend
    context_meaning_tr: bütçe sapması
  comprehension_questions:
  - id: q_reading_b1_quarterly-department-budget_01
    question_en: Why should committed fixed costs appear first when building a budget?
    options:
    - To prevent promising funds that are already obligated
    - To increase spending on conference travel
    - To eliminate all full-time payroll items
    - To stop vendors from issuing monthly invoices
    correct_answer: To prevent promising funds that are already obligated
    explanation_en: Paragraph 1 explains listing baseline commitments first stops teams from promising already-committed funds.
    explanation_tr: 1. paragraf temel yükümlülükleri önce listelemenin halihazırda bağlı parayı vaat etmeyi önlediğini anlatır.
  - id: q_reading_b1_quarterly-department-budget_02
    question_en: How do skilled budget owners estimate variable operational costs?
    options:
    - By linking estimates to projected unit metrics like active accounts
    - By multiplying random weekly totals by four
    - By ignoring growth in support ticket volume
    - By copying exact rent figures from five years ago
    correct_answer: By linking estimates to projected unit metrics like active accounts
    explanation_en: Paragraph 2 says estimates should tie directly to unit drivers such as active accounts or tickets.
    explanation_tr: 2. paragraf tahminlerin aktif hesaplar veya destek talepleri gibi birim etkenlere bağlanması gerektiğini
      belirtir.
  - id: q_reading_b1_quarterly-department-budget_03
    question_en: What condition keeps a contingency reserve from inviting careless spending?
    options:
    - Spending any leftover reserve on holiday parties
    - Hiding the reserve from finance teams
    - Requiring written justification whenever funds are drawn
    - Setting the buffer above fifty percent
    correct_answer: Requiring written justification whenever funds are drawn
    explanation_en: Paragraph 3 notes a 5–8% reserve works well when drawdowns require clear written justification.
    explanation_tr: 3. paragraf çekişlerin açık yazılı gerekçe gerektirmesi durumunda yüzde 5-8 rezervin verimli çalıştığını
      belirtir.
  - id: q_reading_b1_quarterly-department-budget_04
    question_en: What can spending noticeably below budget actually indicate?
    options:
    - Delayed hiring or postponed project milestones
    - Automatic currency appreciation
    - Complete elimination of cloud infrastructure
    - Guaranteed permanent cost efficiency
    correct_answer: Delayed hiring or postponed project milestones
    explanation_en: Paragraph 4 points out underspending often reflects stalled hiring or delayed launches rather than true
      savings.
    explanation_tr: 4. paragraf düşük harcamanın gerçek tasarruf yerine duraksayan işe alım veya geciken lansmana işaret edebileceğini
      söyler.
  - id: q_reading_b1_quarterly-department-budget_05
    question_en: How long should monthly variance check-ins typically take?
    options:
    - Only ten seconds via chat
    - Three full business days per team
    - Around thirty minutes after monthly close
    - Once every two fiscal years
    correct_answer: Around thirty minutes after monthly close
    explanation_en: Paragraph 4 explicitly mentions a brief thirty-minute variance check after each monthly close.
    explanation_tr: 4. paragraf her aylık kapanıştan sonra otuz dakikalık kısa bir sapma kontrolünden bahseder.
  topic_tags:
  - budgeting
  - planning
  - corporate-finance
  related_ids: []
  status: APPROVED
  version: 1
- id: reading.b1.blameless-postmortem-habits
  title: Why Blameless Postmortems Build Stronger Systems
  cefr_level: B1
  category: engineering_culture
  summary_en: How focusing incident reviews on system safeguards rather than individual faults encourages honest reporting
    and prevents repeat outages.
  summary_tr: Olay incelemelerini bireysel suçlama yerine sistem güvencelerine odaklamanın dürüst bildirimi nasıl teşvik ettiğini
    ve tekrar eden kesintileri nasıl önlediğini anlatır.
  word_count: 245
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: When Fear Hides Operational Truth
    content_en: Every software organization eventually faces an outage where checkout buttons freeze or mobile log-ins fail
      during busy hours. If leadership immediately demands to know who ran the wrong command, engineers naturally grow defensive
      and share only minimal facts. Critical context about missing alerts, confusing scripts, or rushed deadlines stays buried
      out of self-protection. Without honest details, the exact same mistake remains trapped inside the system waiting for
      another stressed teammate.
    content_tr: Her yazılım kuruluşu eninde sonunda yoğun saatlerde ödeme düğmelerinin donduğu veya mobil oturumların kapandığı
      bir kesintiyle karşılaşır. Yönetim hemen yanlış komutu kimin çalıştırdığını öğrenmek isterse, mühendisler doğal olarak
      savunmaya geçer ve yalnızca en asgari bilgileri paylaşır. Eksik alarmlar, kafa karıştırıcı betikler veya sıkışık teslim
      tarihleri hakkındaki kritik bağlam kendini koruma dürtüsüyle gizli kalır. Dürüst ayrıntılar olmadan aynı hata, başka
      bir stresli ekip arkadaşını bekleyerek sistemin içinde gizlenmeye devam eder.
  - paragraph_index: 2
    title: Assuming Good Intent and Inspecting Safeguards
    content_en: 'A blameless postmortem begins with a straightforward premise: the engineer on call acted rationally with
      the information and tools available at that moment. Rather than asking why one person clicked deploy, the group traces
      why a single manual click could delete production configuration without warning. Shifting curiosity toward missing safety
      checks turns awkward blame sessions into practical engineering investigations.'
    content_tr: 'Suçlamasız bir olay sonrası değerlendirme yalın bir ön kabulle başlar: nöbetteki mühendis o an elindeki bilgi
      ve araçlarla mantıklı şekilde hareket etmiştir. Ekip tek bir kişinin neden dağıtım düğmesine bastığını sormak yerine,
      tek bir manuel tıklamanın uyarı vermeden canlı yapılandırmayı nasıl silebildiğini inceler. Merakı eksik güvenlik kontrollerine
      yönlendirmek gergin suçlama oturumlarını pratik mühendislik araştırmalarına dönüştürür.'
  - paragraph_index: 3
    title: Capturing Timeline Facts While Fresh
    content_en: Strong review documents record an objective timeline before memories fade. Authors gather alert timestamps,
      graph screenshots, customer impact numbers, and the exact recovery actions that restored normal traffic. Distinguishing
      what the team knew at ten past four from what became clear an hour later helps reviewers spot slow diagnostic tools.
      Clear metrics also keep emotional exaggerations out of technical summaries.
    content_tr: Güçlü değerlendirme belgeleri, anılar solmadan nesnel bir zaman çizelgesi kaydeder. Yazarlar alarm zaman damgalarını,
      grafik ekran görüntülerini, müşteri etki sayılarını ve normal trafiği geri getiren kesin kurtarma adımlarını toplar.
      Saat dörtü on geçe bilinenlerle bir saat sonra netleşenleri ayırmak inceleyicilerin yavaş tanı araçlarını fark etmesine
      yardımcı olur. Net metrikler ayrıca teknik özetleri duygusal abartılardan uzak tutar.
  - paragraph_index: 4
    title: Finishing Concrete Follow-Up Tasks
    content_en: Even the fairest analysis accomplishes nothing if action items vanish into an unmonitored backlog. Teams keep
      follow-up lists concise—usually two to four high-value fixes assigned clear owners and completion targets. Adding automated
      pre-flight checks or clearer confirmation prompts closes the gap permanently. When teams celebrate resolved risks publicly,
      reporting early near-misses becomes part of daily pride.
    content_tr: Eylem maddeleri izlenmeyen bir iş listesinde kaybolursa en adil analiz bile hiçbir şey başaramaz. Ekipler
      takip listelerini öz tutar; genellikle net sorumlulara ve bitiş hedeflerine atanmış iki ila dört yüksek değerli düzeltme
      seçer. Otomatik ön kontroller veya daha net onay uyarıları eklemek açığı kalıcı olarak kapatır. Ekipler çözülen riskleri
      açıkça kutladığında, erken ucuz atlatılan durumları bildirmek günlük gururun parçası haline gelir.
  vocabulary_annotations:
  - word: outage
    context_definition_en: a period when a digital service stops working for users
    context_meaning_tr: hizmet kesintisi
  - word: defensive
    context_definition_en: acting protective rather than open when mistakes happen
    context_meaning_tr: savunmacı
  - word: premise
    context_definition_en: a founding assumption guiding how a review is run
    context_meaning_tr: temel varsayım, öncül
  - word: timeline
    context_definition_en: a chronological record of events and timestamps
    context_meaning_tr: zaman çizelgesi
  comprehension_questions:
  - id: q_reading_b1_blameless-postmortem-habits_01
    question_en: What risk arises when managers hunt for someone to blame after an outage?
    options:
    - Code deployments stop forever across teams
    - Engineers hide context and underlying tool flaws persist
    - Customers receive automatic refunds instantly
    - Monitoring graphs load twice as fast
    correct_answer: Engineers hide context and underlying tool flaws persist
    explanation_en: Paragraph 1 explains that fear makes staff defensive, leaving missing alerts or flawed scripts unresolved.
    explanation_tr: 1. paragraf korkunun çalışanları savunmaya ittiğini ve eksik alarmlarla hatalı betiklerin çözümsüz kaldığını
      açıklar.
  - id: q_reading_b1_blameless-postmortem-habits_02
    question_en: What core assumption guides a blameless postmortem?
    options:
    - Every outage happens solely due to laziness
    - Human operators should never touch computers
    - On-call engineers made reasonable choices with what they saw then
    - Production scripts never contain dangerous defaults
    correct_answer: On-call engineers made reasonable choices with what they saw then
    explanation_en: Paragraph 2 defines the premise that engineers acted rationally given the tools and facts available at
      that time.
    explanation_tr: 2. paragraf mühendislerin o anki araç ve bilgilerle rasyonel davrandığı ön kabulünü tanımlar.
  - id: q_reading_b1_blameless-postmortem-habits_03
    question_en: Why distinguish what responders knew early versus an hour later?
    options:
    - To erase server logs before legal review
    - To assign blame evenly across departments
    - To expose slow alerts or unclear diagnostic dashboards
    - To calculate overtime bonuses for chat moderators
    correct_answer: To expose slow alerts or unclear diagnostic dashboards
    explanation_en: Paragraph 3 says comparing earlier vs later knowledge helps spot slow diagnostic tools.
    explanation_tr: 3. paragraf erken ve geç bilinenleri karşılaştırmanın yavaş tanı araçlarını ortaya çıkarmaya yaradığını
      belirtir.
  - id: q_reading_b1_blameless-postmortem-habits_04
    question_en: How many follow-up fixes does Paragraph 4 recommend focusing on?
    options:
    - Zero tasks unless revenue drops sharply
    - Fifty minor formatting changes at once
    - Only non-technical office seating tweaks
    - Two to four high-impact fixes with clear owners
    correct_answer: Two to four high-impact fixes with clear owners
    explanation_en: Paragraph 4 advises concise lists of two to four high-value fixes with explicit owners.
    explanation_tr: 4. paragraf net sorumlulara sahip iki ila dört yüksek değerli düzeltmeden oluşan öz listeleri önerir.
  - id: q_reading_b1_blameless-postmortem-habits_05
    question_en: What cultural shift occurs when fixed risks are celebrated openly?
    options:
    - On-call rotations no longer need dashboards
    - Junior staff stop attending architecture calls
    - Engineers feel safe reporting close calls before real failures
    - Teams cancel all automated pre-flight checks
    correct_answer: Engineers feel safe reporting close calls before real failures
    explanation_en: Paragraph 4 explains celebrating solved risks encourages early reporting of near-misses.
    explanation_tr: 4. paragraf çözülen riskleri kutlamanın erken ucuz atlatılan vakaların bildirilmesini teşvik ettiğini
      belirtir.
  topic_tags:
  - reliability
  - postmortems
  - engineering-culture
  related_ids: []
  status: APPROVED
  version: 1
- id: reading.b1.delegating-first-projects
  title: Learning to Delegate Routine Project Tasks
  cefr_level: B1
  category: leadership_and_management
  summary_en: Why new team leads must shift from doing every familiar task themselves to defining outcomes and trusting teammates.
  summary_tr: Yeni ekip liderlerinin neden her tanıdık işi kendileri yapmayı bırakıp net hedefler tanımlamaya ve ekibe güvenmeye
    geçmesi gerektiğini açıklar.
  word_count: 229
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    title: The Trap of Doing Everything Yourself
    content_en: Newly promoted team leads often earned their roles by solving tough problems faster than anyone else. When
      pressure rises, however, holding onto every familiar report or vendor email becomes a hidden bottleneck. Completing
      tasks personally feels efficient for an afternoon, yet the whole team stalls waiting for one overloaded calendar. Letting
      go of routine ownership creates breathing room for higher-impact planning.
    content_tr: Yeni terfi eden ekip liderleri genellikle zor sorunları herkesten hızlı çözerek bu rolleri kazanmıştır. Ancak
      baskı arttığında her tanıdık raporu veya tedarikçi e-postasını elinde tutmak gizli bir darboğaza dönüşür. İşleri bizzat
      tamamlamak bir öğleden sonra için verimli hissettirir, fakat tüm ekip tek bir aşırı yüklü takvimi beklerken duraklar.
      Rutin sahipliği devretmek yüksek etkili planlama için nefes alanı yaratır.
  - paragraph_index: 2
    title: Handing Over Context Instead of Step-by-Step Orders
    content_en: Good delegation means transferring real understanding, not merely offloading unpleasant chores. Explain why
      the deliverable matters to customers, share helpful past templates, and define clear quality criteria before anyone
      starts. Resist the urge to dictate every tiny font choice or meeting phrasing unless compliance strictly requires it.
      Defining clear boundaries leaves colleagues genuine room to think creatively.
    content_tr: İyi yetki devri yalnızca sevimsiz angaryaları aktarmak değil, gerçek anlayışı devretmek anlamına gelir. Teslimatın
      müşteriler için neden önemli olduğunu açıklayın, yararlı geçmiş şablonları paylaşın ve kimse başlamadan önce net kalite
      ölçütlerini tanımlayın. Uyumluluk kesinlikle gerektirmedikçe her küçük yazı tipi seçimini veya toplantı cümlesini dikte
      etme dürtüsüne direnin. Net sınırlar çizmek meslektaşlara yaratıcı düşünmeleri için gerçek alan bırakır.
  - paragraph_index: 3
    title: Scheduling Calm Midpoint Checkpoints
    content_en: Stepping back does not mean disappearing until the final deadline arrives. Agree upfront on a brief midpoint
      check—for example, reviewing an early outline two days before delivery. This rhythm lets new owners ask questions safely
      without feeling watched hourly by a nervous boss. Spotting wrong assumptions halfway avoids awkward late-night rescues
      and preserves both confidence and quality.
    content_tr: Geri çekilmek, son teslim tarihi gelene kadar ortadan kaybolmak demek değildir. En baştan kısa bir ara kontrol
      noktası üzerinde anlaşın; örneğin teslimattan iki gün önce erken bir taslağı inceleyin. Bu ritim yeni sorumluların gergin
      bir yönetici tarafından saat başı izleniyormuş gibi hissetmeden güvenle soru sormasını sağlar. Yanlış varsayımları yarı
      yolda fark etmek son gece kurtarma telaşını önler ve hem özgüveni hem kaliteyi korur.
  - paragraph_index: 4
    title: Accepting Different Paths to Solid Results
    content_en: Perhaps the hardest shift is accepting that a teammate's solution may look different from yours yet still
      succeed cleanly. Minor stylistic preferences should never trigger complete rewrites that crush a colleague's motivation.
      Giving public credit when delegated projects succeed accelerates skill growth across the entire department and builds
      the next generation of confident leads.
    content_tr: Belki de en zor değişim, bir ekip arkadaşının çözümünün sizinkinden farklı görünse bile başarıyla sonuçlanabileceğini
      kabul etmektir. Küçük üslup tercihleri asla bir meslektaşın motivasyonunu kıran baştan yazımlara yol açmamalıdır. Devredilen
      projeler başarılı olduğunda açıkça takdir sunmak tüm departmanda beceri gelişimini hızlandırır ve gelecek özgüvenli
      lider kuşağını yetiştirir.
  vocabulary_annotations:
  - word: bottleneck
    context_definition_en: a single point that slows down work for an entire group
    context_meaning_tr: darboğaz
  - word: delegation
    context_definition_en: assigning responsibility and authority for a task to someone else
    context_meaning_tr: yetki devri
  - word: deliverable
    context_definition_en: a concrete project output expected by stakeholders or customers
    context_meaning_tr: teslimat çıktısı
  - word: credit
    context_definition_en: public recognition given for someone's successful contribution
    context_meaning_tr: takdir, övgü
  comprehension_questions:
  - id: q_reading_b1_delegating-first-projects_01
    question_en: Why do newly promoted leads often struggle to share routine tasks?
    options:
    - Doing tasks themselves feels faster in the short term
    - Teammates are forbidden from reading emails
    - Company software blocks multiple user logins
    - Projects never involve strict deadlines
    correct_answer: Doing tasks themselves feels faster in the short term
    explanation_en: Paragraph 1 observes that completing familiar work personally feels efficient briefly, even while creating
      a bottleneck.
    explanation_tr: 1. paragraf tanıdık işleri bizzat yapmanın kısa vadede verimli hissettirdiğini ancak darboğaz yarattığını
      açıklar.
  - id: q_reading_b1_delegating-first-projects_02
    question_en: What distinguishes genuine delegation from dumping chores?
    options:
    - Keeping past templates hidden so staff improvise
    - Assigning tasks without explaining deadlines
    - Explaining customer impact and clear success criteria upfront
    - Choosing every font and exact wording yourself
    correct_answer: Explaining customer impact and clear success criteria upfront
    explanation_en: Paragraph 2 emphasizes explaining why the work matters, sharing templates, and defining quality criteria.
    explanation_tr: 2. paragraf işin neden önemli olduğunu açıklamayı, şablonları paylaşmayı ve kalite ölçütlerini tanımlamayı
      vurgular.
  - id: q_reading_b1_delegating-first-projects_03
    question_en: How do agreed midpoint checkpoints support teammate confidence?
    options:
    - They surface questions early without constant micromanagement
    - They cancel final quality checks completely
    - They move deadlines backward automatically
    - They prove employees need hourly supervision
    correct_answer: They surface questions early without constant micromanagement
    explanation_en: Paragraph 3 explains midpoint checks catch misunderstandings early without feeling watched every hour.
    explanation_tr: 3. paragraf ara kontrollerin saatlik denetim hissi vermeden yanlış varsayımları erken yakaladığını anlatır.
  - id: q_reading_b1_delegating-first-projects_04
    question_en: Why should leads avoid rewriting a teammate's work over tiny style differences?
    options:
    - Unnecessary rewrites discourage ownership and motivation
    - Rewriting prevents anyone from receiving credit
    - Style changes break server spreadsheets
    - Customers always prefer disorganized reports
    correct_answer: Unnecessary rewrites discourage ownership and motivation
    explanation_en: Paragraph 4 warns that minor stylistic rewrites crush colleague motivation.
    explanation_tr: 4. paragraf küçük üslup nedenleriyle yapılan baştan yazımların çalışma motivasyonunu kırdığını uyarır.
  - id: q_reading_b1_delegating-first-projects_05
    question_en: What long-term benefit comes from publicly crediting successful teammates?
    options:
    - It transfers payroll authority to customers
    - It builds department skills and prepares future leaders
    - It lowers quarterly cloud hosting expenses
    - It removes the need for onboarding notes
    correct_answer: It builds department skills and prepares future leaders
    explanation_en: Paragraph 4 concludes that public credit accelerates skill growth and develops future leads.
    explanation_tr: 4. paragraf açık takdirin beceri gelişimini hızlandırdığını ve gelecekteki liderleri yetiştirdiğini belirtir.
