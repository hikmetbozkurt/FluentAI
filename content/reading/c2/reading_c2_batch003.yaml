  comprehension_questions:
  - id: q_reading_c2_cryptographic-agility-in-legacy-banks_01
    question_en: Why does 'harvest-now, decrypt-later' interception force banks to act before quantum computers exist?
    options:
    - Mainframe switches erase encryption keys after ninety days automatically
    - Quantum computers already break elliptic-curve TLS connections nightly
    - Quarterly software releases expire sovereign bond obligations fast
    - Attackers archive today's confidential settlement streams for future decryption
    correct_answer: Attackers archive today's confidential settlement streams for future decryption
    explanation_en: Paragraph 1 explains attackers intercept long-retention records today intending to break them once quantum
      tools mature.
    explanation_tr: 1. paragraf saldırganların uzun süre hassas kalacak trafiği gelecekte çözmek üzere bugünden arşivlediğini
      anlatır.
  - id: q_reading_c2_cryptographic-agility-in-legacy-banks_02
    question_en: Why do unplanned algorithm swaps immediately break older bank payment rails?
    options:
    - Compliance auditors forbid using centralized policy brokers
    - Buffer sizes, signature lengths, and certificate pins are hardcoded downstream
    - Branch offices disable internet connections during firmware checks
    - Mainframe binaries convert TLS frames into plain text automatically
    correct_answer: Buffer sizes, signature lengths, and certificate pins are hardcoded downstream
    explanation_en: Paragraph 2 details embedded 24-byte buffers, signature assumptions, and hardcoded TLS pinning breaking
      under rushed swaps.
    explanation_tr: 2. paragraf sabit bellek boyutlarının, imza kabullerinin ve sabitlenmiş sertifikaların ani değişimde kırıldığını
      belirtir.
  - id: q_reading_c2_cryptographic-agility-in-legacy-banks_03
    question_en: How do policy-driven cryptographic brokers keep product teams agile?
    options:
    - Key rotation occurs solely every ten years without software upgrades
    - Broker APIs bypass hardware security module signing completely
    - Every business squad maintains distinct proprietary encryption math
    - Apps ask for protection levels while platform teams swap primitives behind APIs
    correct_answer: Apps ask for protection levels while platform teams swap primitives behind APIs
    explanation_en: Paragraph 3 explains separating business requests ('high-assurance signing') from algorithm selection
      inside central brokers.
    explanation_tr: 3. paragraf iş uygulamalarının soyut koruma düzeyi isterken platform ekibinin algoritmaları perde arkasında
      güncellediğini açıklar.
  - id: q_reading_c2_cryptographic-agility-in-legacy-banks_04
    question_en: What operational side effect must engineers test when introducing post-quantum lattice keys?
    options:
    - Sovereign clearing banks banning hybrid algorithmic coexistence
    - Shrinking packet payloads wasting unused broadband throughput
    - Elimination of TLS handshakes inside mobile treasury apps
    - Much larger keys and signatures risking packet fragmentation and timeouts
    correct_answer: Much larger keys and signatures risking packet fragmentation and timeouts
    explanation_en: Paragraph 4 warns multi-kilobyte lattice signatures exceed older packet limits, risking fragmentation
      and timeouts.
    explanation_tr: 4. paragraf çok kilobaytlı kafes imzalarının eski paket sınırlarını zorlayarak parçalanmaya ve zaman aşımına
      yol açabileceğini uyarır.
  - id: q_reading_c2_cryptographic-agility-in-legacy-banks_05
    question_en: What prevents cryptographic abstraction layers from failing during real future transitions?
    options:
    - Practicing live key rollover and dual-algorithm drills twice a year
    - Hardcoding backup elliptic-curve lengths inside payment terminals
    - Locking rotation checklists inside unread executive binders
    - Disabling fallback routing until quantum hardware debuts publicly
    correct_answer: Practicing live key rollover and dual-algorithm drills twice a year
    explanation_en: Paragraph 5 stresses weaving live certificate rotation and crypto-switch failure drills into semi-annual
      exercises.
    explanation_tr: 5. paragraf canlı sertifika devri ve arıza tatbikatlarının yılda iki kez uygulanmasını vurgular.
