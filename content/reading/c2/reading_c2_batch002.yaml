    context_definition_en: The study of historical writing and the methodology of the history discipline.
    context_meaning_tr: tarih yazımı, tarih metodolojisi
  - word: subaltern
    context_definition_en: Of lower status or rank; marginalized social groups excluded from dominant power hierarchies.
    context_meaning_tr: madun, alt sınıfa ait, ezilen kesim
  - word: negationism
    context_definition_en: The denial of historical crimes, especially genocides, in defiance of empirical evidence.
    context_meaning_tr: tarihsel inkar, tarihsel suçları reddetme
  comprehension_questions:
  - id: q_reading_c2_historiography-collective-memory-reconstruction_01
    question_en: What central thesis did Maurice Halbwachs establish regarding human memory in Paragraph 1?
    question_tr_hint: 1. paragrafta Maurice Halbwachs insan belleği hakkında hangi temel tezi ortaya koymuştur?
    options:
    - Memory is stored exclusively in magnetic iron deposits inside the human bloodstream.
    - Recollection is not isolated biology, but reconstructed through social frameworks to serve present imperatives.
    - Human beings possess photographic memory of every historical event before their birth.
    - Memory is entirely determined by the physical size of human skull bones.
    correct_answer: Recollection is not isolated biology, but reconstructed through social frameworks to serve present imperatives.
    explanation_en: Paragraph 1 explains Halbwachs showed memory is socially structured and reconstructed to serve the present.
    explanation_tr: 1. paragraf Halbwachs'ın belleğin şimdiki zamana hizmet etmek için sosyal çerçevelerle yeniden inşa edildiğini
      gösterdiğini açıklar.
  - id: q_reading_c2_historiography-collective-memory-reconstruction_02
    question_en: What did Pierre Nora define as 'lieux de mémoire' (sites of memory) in Paragraph 2?
    question_tr_hint: 2. paragrafta Pierre Nora 'lieux de mémoire'ı (hafıza mekanları) nasıl tanımlamıştır?
    options:
    - Secret underground military bunkers designed to survive nuclear conflicts.
    - Hospitals specialized in treating patients with physical amnesia.
    - Synthetic physical repositories like monuments and archives engineered to anchor contested identity after lived memory
      faded.
    - Physical amusement parks where tourists dress in medieval costumes.
    correct_answer: Synthetic physical repositories like monuments and archives engineered to anchor contested identity after
      lived memory faded.
    explanation_en: Paragraph 2 explains sites of memory are synthetic repositories engineered to compensate for lost lived
      memory.
    explanation_tr: 2. paragraf hafıza mekanlarının kaybolan yaşanmış belleği telafi etmek için tasarlanmış depolar olduğunu
      açıklar.
  - id: q_reading_c2_historiography-collective-memory-reconstruction_03
    question_en: What did Michel-Rolph Trouillot mean by 'archival silences' in colonial historiography in Paragraph 3?
    question_tr_hint: 3. paragrafta Michel-Rolph Trouillot sömürge tarih yazımındaki 'arşivsel sessizlikler' ile neyi kastetmiştir?
    options:
    - A mandatory rule requiring historical library patrons to remain completely silent.
    - Systematic omissions introduced during source creation, archive assembly, and narrative making to reinforce hegemony.
    - The accidental loss of paper documents during oceanic hurricane storms.
    - A historical period where humans lost the physical ability to produce vocal speech.
    correct_answer: Systematic omissions introduced during source creation, archive assembly, and narrative making to reinforce
      hegemony.
    explanation_en: Paragraph 3 details archival silences are systemic omissions across four stages of narrative production.
    explanation_tr: 3. paragraf arşivsel sessizliklerin anlatı üretiminin dört aşamasında hegemonyayı pekiştiren kasıtlı eksiklikler
      olduğunu açıklar.
  - id: q_reading_c2_historiography-collective-memory-reconstruction_04
    question_en: How does professional historical revisionism differ from political negationism in Paragraph 5?
    question_tr_hint: 5. paragrafta profesyonel tarihsel revizyonizm siyasi inkardan (negasyonizm) nasıl ayrılmaktadır?
    options:
    - Revisionism only involves ancient Roman history, while negationism involves modern science.
    - Revisionism is practiced only by politicians, while negationism is practiced by university professors.
    - Revisionism is forbidden by international copyright law, while negationism is mandatory.
    - Revisionism updates interpretations based on new evidence, while negationism is bad-faith denial erasing state violence.
    correct_answer: Revisionism updates interpretations based on new evidence, while negationism is bad-faith denial erasing
      state violence.
    explanation_en: Paragraph 5 explains revisionism updates knowledge with evidence, whereas negationism is bad-faith denial.
    explanation_tr: 5. paragraf revizyonizmin kanıtla bilgiyi güncellediğini, inkarın ise kötü niyetli bir çarpıtma olduğunu
      açıklar.
  - id: q_reading_c2_historiography-collective-memory-reconstruction_05
    question_en: What restorative function do Truth and Reconciliation Commissions perform in post-conflict states in Paragraph
      7?
    question_tr_hint: 7. paragrafta Hakikat ve Uzlaşma Komisyonları çatışma sonrası devletlerde hangi onarıcı işlevi yerine
      getirir?
    options:
    - They permanently ban the teaching of history in national primary schools.
    - They provide public forums for victim testimony and establish authoritative records preventing denialism.
    - They transfer all national gold reserves to foreign commercial banking institutions.
    - They order the immediate military execution of all opposition political party leaders.
    correct_answer: They provide public forums for victim testimony and establish authoritative records preventing denialism.
    explanation_en: Paragraph 7 details truth commissions provide victim forums and codify records that prevent denialist
      erasure.
    explanation_tr: 7. paragraf hakikat komisyonlarının kurban forumları sağlayıp inkarı önleyen resmi kayıtlar oluşturduğunu
      açıklar.
