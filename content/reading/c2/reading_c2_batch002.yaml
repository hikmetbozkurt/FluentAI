  comprehension_questions:
  - id: q_reading_c2_synthetic-biology-biosecurity-governance_01
    question_en: How does synthetic biology differ fundamentally from classical observational biology in Paragraph 1?
    question_tr_hint: 1. paragrafta sentetik biyoloji klasik gözlemsel biyolojiden temelde nasıl ayrılmaktadır?
    options:
    - It treats genetic code as an editable modular programming language to engineer de novo biological circuits.
    - It relies on manual astronomical observations of constellations to predict genetics.
    - It only uses dead animal fossils to create museum exhibition displays.
    - It completely rejects the chemical existence of DNA and RNA molecules.
    correct_answer: It treats genetic code as an editable modular programming language to engineer de novo biological circuits.
    explanation_en: Paragraph 1 explains synthetic biology treats genetic code as modular software to engineer circuits.
    explanation_tr: 1. paragraf sentetik biyolojinin genetik kodu devreler tasarlayan modüler bir yazılım olarak ele aldığını
      açıklar.
  - id: q_reading_c2_synthetic-biology-biosecurity-governance_02
    question_en: What biological limitation does a CRISPR-based gene drive overcome according to Paragraph 3?
    question_tr_hint: 3. paragrafa göre CRISPR tabanlı bir gen sürücüsü hangi biyolojik sınırlamayı aşar?
    options:
    - It allows animals to survive without breathing any atmospheric oxygen.
    - It shatters Mendelian inheritance by copying itself to homologous chromosomes, ensuring up to 100% transmission.
    - It causes crops to grow completely underground without soil or sunlight.
    - It prevents insects from laying eggs for thousands of years.
    correct_answer: It shatters Mendelian inheritance by copying itself to homologous chromosomes, ensuring up to 100% transmission.
    explanation_en: Paragraph 3 explains gene drives shatter the 50% Mendelian inheritance limit via autonomous homing.
    explanation_tr: 3. paragraf gen sürücülerinin otonom kopyalamayla yüzde ellilik Mendel sınırını aştığını açıklar.
  - id: q_reading_c2_synthetic-biology-biosecurity-governance_03
    question_en: What primary ecological risk is associated with releasing gene drives into wild populations in Paragraph
      4?
    question_tr_hint: 4. paragrafta gen sürücülerinin vahşi popülasyonlara salınmasıyla hangi temel ekolojik risk ilişkilendirilir?
    options:
    - Turning all wild plant leaves into solid sheets of synthetic plastic.
    - Causing the Earth's magnetic north pole to shift into the Pacific Ocean.
    - Instantly freezing all freshwater lakes across the tropical biosphere.
    - Destabilizing wetland trophic food webs and risking irreversible horizontal gene transfer across species.
    correct_answer: Destabilizing wetland trophic food webs and risking irreversible horizontal gene transfer across species.
    explanation_en: Paragraph 4 details risks of trophic food web destabilization and horizontal spillover into non-targets.
    explanation_tr: 4. paragraf besin ağlarının istikrarsızlaşması ve hedef dışı türlere yatay geçiş risklerini açıklar.
  - id: q_reading_c2_synthetic-biology-biosecurity-governance_04
    question_en: Why does the democratization of DNA synthesis threaten biosecurity according to Paragraph 6?
    question_tr_hint: 6. paragrafa göre DNA sentezinin demokratikleşmesi biyogüvenliği neden tehdit etmektedir?
    options:
    - Garage biohackers are legally exempt from paying national income taxes.
    - Collapsing synthesis costs and benchtop printers enable unmonitored creation of pathogens outside review boards.
    - DNA printers emit toxic radiation that interferes with domestic television signals.
    - All commercial courier delivery services have officially banned transporting chemicals.
    correct_answer: Collapsing synthesis costs and benchtop printers enable unmonitored creation of pathogens outside review
      boards.
    explanation_en: Paragraph 6 explains collapsing costs and desktop printers allow custom oligonucleotide synthesis outside
      oversight.
    explanation_tr: 6. paragraf düşen maliyetlerin ve masaüstü yazıcıların denetimsiz patojen sentezine izin verdiğini açıklar.
  - id: q_reading_c2_synthetic-biology-biosecurity-governance_05
    question_en: What structural weakness undermines the 1972 Biological Weapons Convention (BWC) in Paragraph 8?
