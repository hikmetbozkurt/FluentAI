- id: reading.c2.computational-linguistics-semantic-drift
  title: Diachronic Vector Spaces, Distributional Semantics, and Algorithmic Lexicography
  cefr_level: C2
  category: technology
  summary_en: Investigating computational linguistics frameworks for tracking diachronic semantic drift across centuries of
    digitized literature using word embeddings and vector spaces.
  summary_tr: Sözcük gömmeleri ve vektör uzaylarını kullanarak yüzyılların dijitalleştirilmiş literatürü boyunca artzamanlı
    anlamsal kaymayı izleyen hesaplamalı dilbilim çerçevelerinin incelenmesi.
  word_count: 1280
  estimated_reading_minutes: 7
  paragraphs:
  - paragraph_index: 1
    title: The Dynamic Metamorphosis of Human Language
    content_en: 'Human language is not a static museum artifact frozen in immutable grammatical amber; it is a living, turbulent
      evolutionary ecosystem in perpetual thermodynamic flux. Every generation of speakers subtly bends phonology, renegotiates
      pragmatic boundaries, and mutates lexical semantics. Over centuries, words undergo profound semantic transformations:
      their conceptual meanings broaden, narrow, elevate, or degenerate. Historical lexicographers traditionally spent decades
      manually tracing these lexical mutations through laborious archival reading of physical parchment manuscripts, tracking
      the gradual evolution of words like ''awful''—which shifted from denoting majestic spiritual reverence (''awe-inspiring'')
      to communicating banal displeasure (''terrible''). Today, the convergence of massive historical text digitization projects
      and high-dimensional distributional semantics has revolutionized the discipline, empowering computational linguists
      to map lexical evolution across centuries with mathematical precision. The pioneering historical dictionary projects
      of James Murray and the early philological societies required thousands of volunteer readers mailing paper quotation
      slips across the British Empire.'
    content_tr: 'İnsan dili değişmez dilbilgisel kehribar içinde donmuş statik bir müze eseri değildir; sürekli termodinamik
      akış içinde olan canlı, çalkantılı evrimsel bir ekosistemdir. Her konuşmacı nesli fonolojiyi ustaca büker, pragmatik
      sınırları yeniden müzakere eder ve sözcüksel anlambilimi mutasyona uğratır. Yüzyıllar boyunca kelimeler derin anlamsal
      dönüşümler geçirir: kavramsal anlamları genişler, daralır, yükselir veya dejenere olur. Tarihsel sözlükbilimciler geleneksel
      olarak bu sözcüksel mutasyonları fiziksel parşömen el yazmalarını zahmetli arşiv okumalarıyla onlarca yıl harcayarak
      izlediler; ''awful'' gibi kelimelerin görkemli ruhani saygıyı (''huşu uyandıran'') ifade etmekten sıradan hoşnutsuzluğu
      (''korkunç'') iletmeye doğru kademeli evrimini takip ettiler. Günümüzde devasa tarihsel metin dijitalleştirme projeleri
      ile yüksek boyutlu dağıtımsal anlambilimin yakınlaşması disiplinde devrim yaratarak hesaplamalı dilbilimcilerin yüzyıllar
      boyunca sözcüksel evrimi matematiksel hassasiyetle haritalandırmasını sağladı.'
  - paragraph_index: 2
    title: 'Distributional Semantics: The Firthian Axiom in Vector Space'
    content_en: 'The computational foundation for modeling semantic change rests upon the distributional hypothesis, formulated
      famously in 1957 by British linguist John Rupert Firth: ''You shall know a word by the company it keeps.'' Distributional
      semantics posits that the meaning of a linguistic token is inextricably entwined with the statistical distribution of
      lexical contexts in which it occurs. In modern natural language processing, this insight is operationalized by embedding
      words into high-dimensional vector spaces using continuous representations—such as Word2Vec (Skip-gram with negative
      sampling), GloVe, or deep contextualized transformer representations like BERT. By projecting tens of thousands of vocabulary
      words into hundreds of geometric dimensions, semantic relationships are transformed into spatial distances: words with
      similar meanings cluster together, and semantic analogies can be computed via vector arithmetic. In vector spaces, the
      famous parallelogram analogy ''king - man + woman = queen'' demonstrates that distributional algorithms capture complex
      socio-cultural analogies without explicit supervisory training labels.'
    content_tr: 'Anlamsal değişimi modellemenin hesaplamalı temeli 1957 yılında İngiliz dilbilimci John Rupert Firth tarafından
      ünlü bir şekilde formüle edilen dağıtımsal hipoteze dayanır: ''Bir kelimeyi arkadaşlık ettiği çevreden tanırsınız.''
      Dağıtımsal anlambilim dilsel bir belirtecin anlamının içinde geçtiği sözcüksel bağlamların istatistiksel dağılımıyla
      ayrılmaz bir şekilde iç içe olduğunu ileri sürer. Modern doğal dil işlemede bu içgörü kelimelerin Word2Vec (negatif
      örneklemeli Skip-gram), GloVe veya BERT gibi derin bağlamsallaştırılmış dönüştürücü temsilleri gibi sürekli temsiller
      kullanılarak yüksek boyutlu vektör uzaylarına gömülmesiyle operasyonelleştirilir. On binlerce kelime dağarcığını yüzlerce
      geometrik boyuta yansıtarak anlamsal ilişkiler uzamsal mesafelere dönüştürülür: benzer anlamlara sahip kelimeler bir
      arada kümelenir ve anlamsal analojiler vektör aritmetiği aracılığıyla hesaplanabilir.'
  - paragraph_index: 3
    title: 'Diachronic Embeddings: Temporal Alignment and Trajectories'
    content_en: 'To track semantic mutations across historical epochs, computational linguists construct diachronic word embedding
      models. Researchers partition massive multi-century textual corpora—such as the Google Books corpus, historical newspaper
      archives, and parliamentary Hansard records—into discrete temporal bins, such as decades or half-centuries. Independent
      vector spaces are subsequently trained on the text of each chronological epoch. However, a formidable mathematical challenge
      arises: because neural vector spaces are initialized stochastically, two embedding spaces trained on identical data
      will orient their coordinate axes in completely different rotations. To render temporal vector spaces mutually comparable,
      computational linguists deploy Procrustes alignment—an orthogonal linear algebra transformation that rotates and aligns
      historical vector spaces while rigidly preserving all internal pairwise cosine distances. Alternative alignment methods,
      such as incremental temporal training and dynamic word embedding algorithms, eliminate the need for post-hoc Procrustes
      rotations by updating weights sequentially across temporal slices.'
    content_tr: 'Tarihsel dönemler boyunca anlamsal mutasyonları izlemek için hesaplamalı dilbilimciler artzamanlı sözcük
      gömme modelleri inşa ederler. Araştırmacılar Google Books külliyatı, tarihsel gazete arşivleri ve parlamento Hansard
      kayıtları gibi devasa çok asırlık metin külliyatlarını on yıllar veya yarım yüzyıllar gibi ayrı zamansal bölümlere ayırırlar.
      Daha sonra her kronolojik dönemin metni üzerinde bağımsız vektör uzayları eğitilir. Ancak zorlu bir matematiksel zorluk
      ortaya çıkar: sinirsel vektör uzayları stokastik olarak başlatıldığından özdeş veriler üzerinde eğitilen iki gömme uzayı
      koordinat eksenlerini tamamen farklı rotasyonlarda yönlendirecektir. Zamansal vektör uzaylarını karşılıklı olarak karşılaştırılabilir
      kılmak için hesaplamalı dilbilimciler Procrustes hizalamasını—tüm iç ikili kosinüs mesafelerini katı bir şekilde korurken
      tarihsel vektör uzaylarını döndüren ve hizalayan ortogonal bir doğrusal cebir dönüşümünü—konuşlandırırlar.'
  - paragraph_index: 4
    title: 'Quantifying Semantic Trajectories: Displacement and Velocity'
    content_en: 'Once temporal vector spaces are mathematically aligned, computational linguists can track the precise diachronic
      trajectory of any word through high-dimensional semantic space. By measuring the cosine distance between a word''s vector
      coordinate in the 1800s and its coordinate in the 2000s, algorithms calculate its total semantic displacement. Words
      undergoing rapid technological, cultural, or social renegotiation exhibit long, swift trajectories across vector space.
      For example, during the mid-twentieth century, the English word ''gay'' migrated rapidly from a cluster defined by joy,
      frivolity, and lightheartedness toward a specialized cluster denoting sexual orientation. Similarly, the word ''apple''
      drifted decisively from agricultural fruit clusters toward consumer electronics and digital operating systems following
      the corporate rise of Apple Computer in the late twentieth century. Diachronic displacement curves reveal that semantic
      changes frequently follow a classic S-shaped logistic curve: a prolonged period of fringe usage followed by an explosive
      cultural tipping point and eventual plateau.'
    content_tr: Zamansal vektör uzayları matematiksel olarak hizalandıktan sonra hesaplamalı dilbilimciler herhangi bir kelimenin
      yüksek boyutlu anlamsal uzaydaki kesin artzamanlı yörüngesini izleyebilirler. Bir kelimenin 1800'lerdeki vektör koordinatı
      ile 2000'lerdeki koordinatı arasındaki kosinüs mesafesini ölçerek algoritmalar toplam anlamsal yer değiştirmesini hesaplar.
      Hızlı teknolojik, kültürel veya sosyal yeniden müzakerelerden geçen kelimeler vektör uzayında uzun, hızlı yörüngeler
      sergiler. Örneğin yirminci yüzyılın ortalarında İngilizce 'gay' kelimesi neşe, anlamsızlık ve tasasızlıkla tanımlanan
      bir kümeden cinsel yönelimi belirten özel bir kümeye doğru hızla göç etti. Benzer şekilde 'apple' kelimesi yirminci
      yüzyılın sonlarında Apple Computer'ın kurumsal yükselişinin ardından tarımsal meyve kümelerinden tüketici elektroniği
      ve dijital işletim sistemlerine doğru kararlı bir şekilde sürüklendi.
  - paragraph_index: 5
    title: 'Typologies of Semantic Change: Pejoration, Amelioration, Broadening'
    content_en: Computational vector analysis provides empirical confirmation for the classical qualitative taxonomies of
      semantic shift identified by traditional philologists. 'Pejoration' occurs when a neutral or positive word acquires
      negative, derogatory associations over time—demonstrated by words like 'silly', which originally meant blessed or innocent
      in Middle English before drifting toward foolishness. 'Amelioration' reflects the inverse trajectory, where a disparaging
      term ascends into social prestige, as seen in 'knight', which originated as a humble Old English servant before elevating
      into noble chivalry. 'Broadening' expands a word's semantic domain—exemplified by 'quarantine', which originally specified
      an exact period of forty days isolation before generalizing to any biosecurity confinement—while 'narrowing' constrains
      a generic term, such as 'meat', which historically signified any solid food before restricting exclusively to animal
      flesh. Linguistic anthropology confirms that taboo avoidance represents a premier engine of semantic change, as societies
      continuously replace uncomfortable terms regarding death, disease, and bodily functions with evasive euphemisms.
    content_tr: Hesaplamalı vektör analizi geleneksel filologlar tarafından tanımlanan anlamsal kaymanın klasik nitel taksonomileri
      için ampirik doğrulama sağlar. 'Kötüleşme' (pejoration) nötr veya pozitif bir kelimenin zamanla olumsuz, aşağılayıcı
      çağrışımlar kazanmasıyla meydana gelir; Orta İngilizcede aptallığa doğru sürüklenmeden önce başlangıçta kutsanmış veya
      masum anlamına gelen 'silly' gibi kelimelerle gösterilir. 'İyileşme' (amelioration) ise tam tersi bir yörüngeyi yansıtır;
      burada aşağılayıcı bir terim sosyal prestije yükselir; asil şövalyeliğe yükselmeden önce mütevazı bir Eski İngilizce
      hizmetkarı olarak ortaya çıkan 'knight' kelimesinde görüldüğü gibi. 'Genişleme' bir kelimenin anlamsal alanını genişletir—herhangi
      bir biyogüvenlik kısıtlamasına genellemeden önce başlangıçta tam kırk günlük bir tecrit süresini belirten 'quarantine'
      kelimesinde örneklendiği gibi—'daralma' ise münhasıran hayvan etine kısıtlanmadan önce tarihsel olarak herhangi bir
      katı yiyeceği ifade eden 'meat' gibi genel bir terimi sınırlandırır.
  - paragraph_index: 6
    title: 'The Laws of Semantic Change: Hamilton''s Formulations'
    content_en: 'Beyond cataloging idiosyncratic lexical migrations, computational linguistics has discovered universal statistical
      regularities governing how languages evolve. In 2016, Stanford researcher William Hamilton and his colleagues formulated
      two statistical ''Laws of Semantic Change'' through massive cross-linguistic vector modeling across English, French,
      German, and Chinese. The first is the ''Law of Conformity'': frequently used words change their meanings significantly
      more slowly than rare words, exhibiting a robust power-law relationship between usage frequency and semantic stability.
      Highly frequent words are cognitively entrenched across millions of daily conversational interactions, creating immense
      linguistic friction against semantic mutation. The second is the ''Law of Innovation'': polysemous words—words possessing
      multiple related senses—shift their meanings significantly faster, as peripheral senses act as exploratory bridges toward
      novel semantic territories. Computational historical linguistics has extended these statistical laws across diverse
      language families, including Afroasiatic, Indo-European, and Sino-Tibetan, confirming their deep cognitive universality.'
    content_tr: 'Hesaplamalı dilbilim kendine özgü sözcüksel göçleri kataloglamanın ötesinde dillerin nasıl evrimleştiğini
      yöneten evrensel istatistiksel düzenlilikleri keşfetmiştir. 2016 yılında Stanford araştırmacısı William Hamilton ve
      meslektaşları İngilizce, Fransızca, Almanca ve Çince genelinde büyük diller arası vektör modellemesi yoluyla iki istatistiksel
      ''Anlamsal Değişim Yasası'' formüle ettiler. Birincisi ''Uyum Yasası''dır: sık kullanılan kelimeler nadir kelimelere
      göre anlamlarını önemli ölçüde daha yavaş değiştirir; kullanım sıklığı ile anlamsal kararlılık arasında sağlam bir kuvvet
      yasası ilişkisi sergiler. Çok sık kullanılan kelimeler milyonlarca günlük konuşma etkileşiminde bilişsel olarak yerleşmiştir
      ve anlamsal mutasyona karşı muazzam bir dilsel sürtünme yaratır. İkincisi ''Yenilik Yasası''dır: çok anlamlı kelimeler—birden
      fazla ilgili anlama sahip kelimeler—anlamlarını önemli ölçüde daha hızlı değiştirir; çünkü çevresel anlamlar yeni anlamsal
      alanlara doğru keşif köprüleri görevi görür.'
  - paragraph_index: 7
    title: Contextualized Embeddings and Sense Evolution
    content_en: 'While static word embedding architectures like Word2Vec represent each word as a single rigid vector point
      in space, modern contextualized language models like BERT and RoBERTa have transcended this limitation. Static vectors
      suffer from the polysemy bottleneck: assigning a single vector coordinate to a polysemous word forces the algorithm
      to average together completely divergent senses, muddling nuance. Contextualized architectures compute dynamic vector
      representations conditioned on surrounding sentence tokens, generating distinct embeddings for ''bank'' in a financial
      sentence versus an ecological riverbank sentence. By clustering contextualized token vectors across historical time
      slices, computational lexicographers can observe the exact historical moment when a novel word sense branches off from
      an ancestral root, modeling the phylogenetic speciation of linguistic meaning with evolutionary biological fidelity.
      By training diachronic models on specialized sub-corpora—such as medical journals or legislative debates—computational
      linguists can isolate domain-specific semantic specialization from broader vernacular drift.'
    content_tr: 'Word2Vec gibi statik sözcük gömme mimarileri her kelimeyi uzayda tek bir katı vektör noktası olarak temsil
      ederken BERT ve RoBERTa gibi modern bağlamsallaştırılmış dil modelleri bu sınırlamayı aşmıştır. Statik vektörler çok
      anlamlılık darboğazından muzdariptir: çok anlamlı bir kelimeye tek bir vektör koordinatı atamak algoritmayı tamamen
      farklı anlamları bir arada ortalamaya zorlayarak nüansı karıştırır. Bağlamsallaştırılmış mimariler çevreleyen cümle
      belirteçlerine bağlı dinamik vektör temsilleri hesaplayarak finansal bir cümledeki ''bank'' (banka) ile ekolojik nehir
      kıyısı cümlesindeki ''bank'' (kıyı) için farklı gömmeler üretir. Tarihsel zaman dilimleri boyunca bağlamsallaştırılmış
      belirteç vektörlerini kümeleyerek hesaplamalı sözlükbilimciler yeni bir kelime anlamının atasal bir kökten ayrıldığı
      kesin tarihsel anı gözlemleyebilir ve dilsel anlamın filogenetik türleşmesini evrimsel biyolojik sadakatle modelleyebilir.'
  - paragraph_index: 8
    title: Cultural Analytics and Societal Ideology Tracking
    content_en: The implications of diachronic computational linguistics extend far beyond academic philology into the expansive
      domain of cultural analytics and historical sociology. Because language serves as the primary externalized medium of
      human social thought, tracking semantic displacement reveals the shifting ideological assumptions of human civilization.
      Cultural historians use diachronic vector spaces to trace how concepts of gender, race, democracy, and mental illness
      evolved in public discourse across centuries. For instance, analyzing the vector neighborhood of the word 'woman' from
      1850 to 2000 documents a gradual, quantitative migration away from domestic, subservient lexical clusters toward occupational,
      intellectual, and leadership vectors, providing empirical mathematical documentation of the cultural victories achieved
      by feminist social movements. Vector space analysis also documents the historical persistence of pernicious linguistic
      biases, exposing how racial and ethnic slurs systematically gravitated toward criminalized and dehumanized semantic
      neighborhoods.
    content_tr: Artzamanlı hesaplamalı dilbilimin sonuçları akademik filolojinin çok ötesine geçerek kültürel analitik ve
      tarihsel sosyolojinin geniş alanına uzanır. Dil insan sosyal düşüncesinin birincil dışsallaştırılmış ortamı olarak hizmet
      ettiğinden anlamsal yer değiştirmeyi izlemek insan uygarlığının değişen ideolojik varsayımlarını ortaya çıkarır. Kültür
      tarihçileri toplumsal cinsiyet, ırk, demokrasi ve akıl hastalığı kavramlarının yüzyıllar boyunca kamusal söylemde nasıl
      evrimleştiğini izlemek için artzamanlı vektör uzaylarını kullanırlar. Örneğin 1850'den 2000'e kadar 'woman' (kadın)
      kelimesinin vektör komşuluğunu analiz etmek evcil, itaatkar sözcüksel kümelerden mesleki, entelektüel ve liderlik vektörlerine
      doğru kademeli, nicel bir göçü belgeler ve feminist sosyal hareketlerin elde ettiği kültürel zaferlerin ampirik matematiksel
      belgelenmesini sağlar.
  - paragraph_index: 9
    title: 'Conclusion: Language as the Living Tapestry of the Mind'
    content_en: Diachronic computational linguistics illuminates the extraordinary majesty of human language as an open-ended,
      self-organizing cognitive collective. Far from being a rigid set of arbitrary definitions dictated by ivory-tower lexicographers,
      language is an endlessly adaptable communal instrument continuously reshaped by the collective needs, struggles, and
      imaginations of billions of human speakers. By synthesizing high-dimensional linear algebra, evolutionary theory, and
      massive digitized cultural archives, computational linguists are proving that the mathematics of vector spaces can capture
      the delicate, breathing soul of human cultural history, documenting the immortal journey of ideas across the vast expanse
      of time. In this profound sense, computational lexicography transforms massive historical text archives into living
      telescopes through which we can witness the evolving cognitive architecture of human consciousness.
    content_tr: Artzamanlı hesaplamalı dilbilim açık uçlu, kendi kendini organize eden bilişsel bir kolektif olarak insan
      dilinin olağanüstü görkemini aydınlatır. Fildişi kule sözlükbilimcileri tarafından dikte edilen keyfi tanımların katı
      bir seti olmaktan çok uzak olan dil milyarlarca insan konuşmacının kolektif ihtiyaçları, mücadeleleri ve hayal güçleriyle
      sürekli olarak yeniden şekillendirilen sonsuz derecede uyarlanabilir bir toplumsal araçtır. Yüksek boyutlu doğrusal
      cebiri, evrim teorisini ve devasa dijitalleştirilmiş kültürel arşivleri sentezleyerek hesaplamalı dilbilimciler vektör
      uzaylarının matematiğinin insan kültürel tarihinin hassas, nefes alan ruhunu yakalayabileceğini ve fikirlerin geniş
      zaman alanı boyunca ölümsüz yolculuğunu belgeleyebileceğini kanıtlamaktadır.
  vocabulary_annotations:
  - word: diachronic
    context_definition_en: Concerned with the way in which something, especially language, has developed and evolved through
      time.
    context_meaning_tr: artzamanlı, tarihsel gelişim sürecini inceleyen
  - word: pejoration
    context_definition_en: The process by which the meaning of a word becomes more negative or disparaging over time.
    context_meaning_tr: kötüleşme, anlamın olumsuza evrilmesi
  - word: polysemous
    context_definition_en: Having multiple meanings or senses for a single word.
    context_meaning_tr: çok anlamlı, birden çok anlama sahip
  comprehension_questions:
  - id: q_reading_c2_computational-linguistics-semantic-drift_01
    question_en: What foundational premise underlies the distributional hypothesis formulated by J.R. Firth in Paragraph 2?
    question_tr_hint: 2. paragrafta J.R. Firth tarafından formüle edilen dağıtımsal hipotezin altında hangi temel önerme yatar?
    options:
    - All words in human language are mathematically derived from ancient Sanskrit roots.
    - The meaning of a linguistic token is inextricably tied to the statistical contexts in which it occurs.
    - Language can only be understood by dissecting the physical vocal cords of native speakers.
    - Words have fixed, eternal definitions inscribed in physical stone tablets.
    correct_answer: The meaning of a linguistic token is inextricably tied to the statistical contexts in which it occurs.
    explanation_en: Paragraph 2 explains the distributional hypothesis posits meaning is tied to statistical contexts of occurrence.
    explanation_tr: 2. paragraf dağıtımsal hipotezin anlamın kelimenin geçtiği istatistiksel bağlamlara bağlı olduğunu savunduğunu
      açıklar.
  - id: q_reading_c2_computational-linguistics-semantic-drift_02
    question_en: Why must computational linguists apply Procrustes alignment to historical vector spaces in Paragraph 3?
    question_tr_hint: 3. paragrafta hesaplamalı dilbilimciler tarihsel vektör uzaylarına neden Procrustes hizalaması uygulamalıdır?
    options:
    - To translate foreign words into English before running mathematical calculations.
    - To rotate stochastically initialized coordinate axes while strictly preserving internal pairwise cosine distances.
    - To erase all vulgar slang words from historical digitized library books.
    - To compress multi-megabyte computer hard drives into small microchips.
    correct_answer: To rotate stochastically initialized coordinate axes while strictly preserving internal pairwise cosine
      distances.
    explanation_en: Paragraph 3 details Procrustes alignment aligns stochastically oriented vector spaces while preserving
      distances.
    explanation_tr: 3. paragraf Procrustes hizalamasının mesafeleri korurken rastgele yönlenmiş vektör uzaylarını hizaladığını
      açıklar.
  - id: q_reading_c2_computational-linguistics-semantic-drift_03
    question_en: How does the linguistic process of 'amelioration' differ from 'pejoration' as detailed in Paragraph 5?
    question_tr_hint: 5. paragrafta ayrıntıları verilen 'iyileşme' (amelioration) dilsel süreci 'kötüleşmeden' (pejoration)
      nasıl ayrılır?
    options:
    - Amelioration deletes letters from words, while pejoration adds vowels.
    - Amelioration only occurs in written poetry, while pejoration occurs in spoken slang.
    - Amelioration ascends a term into social prestige, whereas pejoration acquires negative, derogatory associations.
    - Amelioration was outlawed by European linguistic academies during the Renaissance.
    correct_answer: Amelioration ascends a term into social prestige, whereas pejoration acquires negative, derogatory associations.
    explanation_en: Paragraph 5 explains amelioration elevates words into prestige, while pejoration degrades words into negativity.
    explanation_tr: 5. paragraf iyileşmenin kelimeleri prestije yükselttiğini, kötüleşmenin ise olumsuza düşürdüğünü açıklar.
  - id: q_reading_c2_computational-linguistics-semantic-drift_04
    question_en: What does William Hamilton's 'Law of Conformity' state regarding semantic evolution in Paragraph 6?
    question_tr_hint: 6. paragrafta William Hamilton'ın 'Uyum Yasası' anlamsal evrim hakkında neyi belirtir?
    options:
    - Frequently used words change their meanings significantly more slowly than rare words due to cognitive entrenchment.
    - Words containing more than ten syllables never change their meanings over time.
    - Citizens conform their vocabulary choices to the speech of government politicians.
    - All languages naturally conform to the grammatical structure of classical Greek.
    correct_answer: Frequently used words change their meanings significantly more slowly than rare words due to cognitive
      entrenchment.
    explanation_en: Paragraph 6 explains frequently used words change much more slowly than rare words due to usage frequency.
    explanation_tr: 6. paragraf sık kullanılan kelimelerin kullanım sıklığı nedeniyle nadir kelimelerden çok daha yavaş değiştiğini
      açıklar.
  - id: q_reading_c2_computational-linguistics-semantic-drift_05
    question_en: How do contextualized models like BERT overcome the 'polysemy bottleneck' of static vectors in Paragraph
      7?
    question_tr_hint: 7. paragrafta BERT gibi bağlamsallaştırılmış modeller statik vektörlerin 'çok anlamlılık darboğazını'
      nasıl aşar?
    options:
    - By consulting printed Oxford English Dictionary definitions before generating answers.
    - By eliminating all homonyms and polysemous words from the computer software vocabulary.
    - By requiring users to manually label every word sense before running neural algorithms.
    - By computing dynamic embeddings conditioned on sentence context rather than averaging all senses into one point.
    correct_answer: By computing dynamic embeddings conditioned on sentence context rather than averaging all senses into
      one point.
    explanation_en: Paragraph 7 details contextual models compute dynamic vectors based on surrounding tokens for distinct
      senses.
    explanation_tr: 7. paragraf bağlamsal modellerin her anlam için çevreleyen belirteçlere dayalı dinamik vektörler hesapladığını
      açıklar.
