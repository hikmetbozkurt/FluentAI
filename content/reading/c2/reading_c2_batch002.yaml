- id: reading.c2.reproducibility-crisis-scientific-rigor
  title: The Reproducibility Crisis, Publication Bias, and Epistemic Reform in Empirical Science
  cefr_level: C2
  category: leadership_and_management
  summary_en: Investigating the structural drivers of the replication crisis in psychology, medicine, and economics, analyzing
    p-hacking, and evaluating pre-registration frameworks.
  summary_tr: Psikoloji, tıp ve iktisatta replikasyon krizinin yapısal itici güçlerinin incelenmesi, p-hacking analizleri
    ve ön kayıt çerçevelerinin değerlendirilmesi.
  word_count: 1257
  estimated_reading_minutes: 6
  paragraphs:
  - paragraph_index: 1
    title: The Awakening of Metascience and the Replication Shock
    content_en: Over the past fifteen years, the institutional edifice of empirical science has been profoundly unsettled
      by what metascience researchers term the 'reproducibility crisis'. Pioneered by iconoclastic epidemiologist John Ioannidis
      in his explosive 2005 treatise 'Why Most Published Research Findings Are False', this reckoning shattered the uncritical
      public assumption that peer-reviewed academic literature represents a pristine repository of verified truth. Subsequent
      large-scale empirical replication efforts sent shockwaves across academia. The landmark Open Science Collaboration project
      in 2015 attempted to replicate one hundred prominent, peer-reviewed psychology studies published in top-tier journals;
      shockingly, fewer than forty percent of the original empirical findings could be successfully reproduced. Similar systemic
      replication failures were subsequently documented in oncology drug discovery, preclinical neuroscience, behavioral economics,
      and clinical medicine. In 2012, biotechnology firm Amgen stunned the medical research community by revealing that its
      scientists could reproduce the landmark findings of only six out of fifty-three prominent pre-clinical oncology studies.
    content_tr: Son on beş yılda ampirik bilimin kurumsal yapısı metabilim araştırmacılarının 'tekrarlanabilirlik krizi' olarak
      adlandırdığı durumla derinden sarsılmıştır. İkonoklast epidemiyolog John Ioannidis'in 2005 tarihli patlayıcı incelemesi
      'Why Most Published Research Findings Are False' ile öncülük edilen bu hesaplaşma, hakemli akademik literatürün doğrulanmış
      hakikatin el değmemiş bir deposunu temsil ettiği yönündeki eleştirel olmayan kamusal varsayımı paramparça etti. Bunu
      takip eden büyük ölçekli ampirik replikasyon çabaları akademi genelinde şok dalgaları yarattı. 2015'teki dönüm noktası
      niteliğindeki Açık Bilim İşbirliği projesi en üst düzey dergilerde yayınlanan yüz önde gelen hakemli psikoloji çalışmasını
      tekrarlamaya çalıştı; şaşırtıcı bir şekilde orijinal ampirik bulguların yüzde kırkından daha azı başarıyla yeniden üretilebildi.
      Benzer sistemik replikasyon başarısızlıkları daha sonra onkoloji ilaç keşfi, klinik öncesi sinirbilim, davranışsal iktisat
      ve klinik tıpta da belgelendi.
  - paragraph_index: 2
    title: 'Pathological Academic Incentives: The Publish-or-Perish Treadmill'
    content_en: 'Metascientific diagnosis reveals that this crisis does not stem predominantly from malicious fraud or outright
      data fabrication; rather, it is the predictable, systemic outcome of deeply perverse institutional incentive structures.
      The modern academic ecosystem operates on a hyper-competitive ''publish-or-perish'' tenure treadmill. Academic hiring
      committees, tenure track reviews, governmental grant allocation panels, and university international ranking systems
      evaluate researchers primarily through quantitative bibliometric proxies: total publication counts, journal impact factors,
      and citation metrics. Because top-tier journals fiercely prioritize counter-intuitive, novel, and statistically dramatic
      breakthroughs while systematically rejecting null results and direct replications, researchers are subjected to overwhelming
      career pressure to extract publishable positive results from every experimental trial. The commercial academic publishing
      industry extracts operating profit margins exceeding thirty-five percent by monetizing publicly funded scientific labor
      while charging exorbitant institutional subscription paywalls.'
    content_tr: 'Metabilimsel tanı bu krizin ağırlıklı olarak kötü niyetli sahtekarlıktan veya doğrudan veri uydurmaktan kaynaklanmadığını;
      daha ziyade son derece çarpık kurumsal teşvik yapılarının öngörülebilir, sistemik bir sonucu olduğunu ortaya koymaktadır.
      Modern akademik ekosistem aşırı rekabetçi bir ''yayınla ya da yok ol'' kadro yürüyüş bandında faaliyet göstermektedir.
      Akademik işe alım komiteleri, kadro incelemeleri, hükümet hibe tahsis panelleri ve üniversite uluslararası sıralama
      sistemleri araştırmacıları öncelikle nicel bibliyometrik vekiller üzerinden değerlendirir: toplam yayın sayısı, dergi
      etki faktörleri ve atıf metrikleri. Üst düzey dergiler sağduyuya aykırı, yeni ve istatistiksel olarak çarpıcı atılımları
      şiddetle öncelerken sıfır sonuçları ve doğrudan replikasyonları sistematik olarak reddettiğinden, araştırmacılar her
      deneysel denemeden yayınlanabilir pozitif sonuçlar çıkarmak için ezici bir kariyer baskısına maruz kalırlar.'
  - paragraph_index: 3
    title: 'Questionable Research Practices: P-Hacking and HARKing'
    content_en: 'This intense pressure has cultivated a pervasive menu of subtle, semi-conscious methodological distortions
      known collectively as Questionable Research Practices (QRPs). Foremost among these is ''p-hacking'' or data dredging:
      the post-hoc manipulation of statistical analyses until the p-value slips just below the arbitrary canonical threshold
      of statistical significance (p < 0.05). Researchers exploit ''researcher degrees of freedom''—selectively dropping outlying
      data points, testing multiple independent variables without correcting for multiple comparisons, retroactively terminating
      data collection when significance is reached, or silently altering operational definitions. Closely allied with p-hacking
      is HARKing—Hypothesizing After the Results are Known. Instead of formulating an a priori hypothesis and testing it against
      empirical evidence, researchers comb through noisy multivariate data, identify serendipitous statistical anomalies,
      and retrospectively frame them as confirmatory proof of a pre-planned theoretical hypothesis. Post-hoc statistical rationalization
      transforms what was essentially an exploratory data-fishing expedition into a tidy, deceptive narrative of pre-ordained
      scientific hypothesis testing.'
    content_tr: 'Bu yoğun baskı topluca Şüpheli Araştırma Uygulamaları (QRP''ler) olarak bilinen ince, yarı bilinçli metodolojik
      çarpıtmaların yaygın bir menüsünü beslemiştir. Bunların başında ''p-hacking'' veya veri tarama gelir: p değeri istatistiksel
      anlamlılığın keyfi kanonik eşiğinin (p < 0.05) hemen altına düşene kadar istatistiksel analizlerin sonradan manipüle
      edilmesi. Araştırmacılar ''araştırmacı serbestlik derecelerinden'' yararlanır—aykırı veri noktalarını seçici olarak
      çıkarmak, çoklu karşılaştırmalar için düzeltme yapmadan birden fazla bağımsız değişkeni test etmek, anlamlılığa ulaşıldığında
      veri toplamayı geriye dönük olarak sonlandırmak veya operasyonel tanımları sessizce değiştirmek gibi. P-hacking ile
      yakından bağlantılı olan bir diğer uygulama da HARKing''dir—Sonuçlar Bilindikten Sonra Hipotez Oluşturma. Araştırmacılar
      önsel bir hipotez formüle edip bunu ampirik kanıtlara karşı test etmek yerine, gürültülü çok değişkenli verileri tarar,
      tesadüfi istatistiksel anomalileri belirler ve bunları geriye dönük olarak önceden planlanmış teorik bir hipotezin doğrulayıcı
      kanıtı olarak çerçeveler.'
  - paragraph_index: 4
    title: The File Drawer Problem and Asymmetric Publication Bias
    content_en: 'Compounding the distortions of individual researchers is the structural distortion of the scientific literature
      known as the ''file drawer problem'' or publication bias. In an idealized scientific enterprise, negative or null findings
      are just as informative as positive confirmations: discovering that a medical drug fails to inhibit a viral receptor
      is critically valuable for redirecting scientific labor away from dead ends. In actual practice, however, researchers
      rarely bother to write up null results, and journal editors routinely reject papers that fail to reject the null hypothesis.
      Consequently, dozens of failed experimental trials languish permanently in researchers'' proverbial file drawers, while
      the single anomalous trial that achieved statistical significance purely by stochastic chance is proudly published,
      giving the scientific community a radically inflated perception of an effect''s reality. When publication bias systematically
      suppresses negative experimental results, subsequent meta-analyses and systematic reviews become fatally poisoned, leading
      clinical practice down costly dead ends.'
    content_tr: 'Bireysel araştırmacıların çarpıtmalarını artıran bir diğer unsur da bilimsel literatürün ''dosya çekmecesi
      problemi'' veya yayın önyargısı olarak bilinen yapısal çarpıtmasıdır. İdealleştirilmiş bir bilimsel girişimde negatif
      veya sıfır bulgular pozitif doğrulamalar kadar bilgilendiricidir: bir tıbbi ilacın viral bir reseptörü inhibe edemediğini
      keşfetmek, bilimsel emeği çıkmaz yollardan uzaklaştırmak için kritik derecede değerlidir. Ancak fiili uygulamada araştırmacılar
      sıfır sonuçları nadiren kaleme alma zahmetine girerler ve dergi editörleri sıfır hipotezini reddedemeyen makaleleri
      rutin olarak reddeder. Sonuç olarak onlarca başarısız deneysel deneme araştırmacıların mecazi dosya çekmecelerinde kalıcı
      olarak çürürken, tamamen stokastik şans eseri istatistiksel anlamlılığa ulaşan tek anormal deneme gururla yayınlanır
      ve bilim camiasına bir etkinin gerçekliğine dair kökten abartılmış bir algı verir.'
  - paragraph_index: 5
    title: Underpowered Studies and the Statistical Winner's Curse
    content_en: 'Underlying these methodological pathologies is the pervasive issue of low statistical power. Due to severe
      budget constraints, time limitations, and logistical hurdles, researchers in fields like cognitive neuroscience and
      clinical psychology frequently conduct studies with tiny sample sizes—often fewer than twenty participants. Statistical
      theorems dictate that low-powered studies suffer from a double vulnerability: not only do they possess a high probability
      of missing genuine biological effects (Type II error), but when an underpowered study does discover a statistically
      significant result, the discovered effect size is virtually guaranteed to be grossly exaggerated. Metascientists term
      this the ''winner''s curse'': the studies that successfully cross the publication threshold are precisely those in which
      random sampling noise aligned favorably with the hypothesis, generating an artificially inflated effect that collapses
      upon large-scale replication. Increasing numbers of quantitative methodologists advocate transitioning from arbitrary
      frequentist p-value thresholds to Bayesian statistical frameworks that quantify posterior probability distributions
      explicitly.'
    content_tr: 'Bu metodolojik patolojilerin altında düşük istatistiksel gücün yaygın sorunu yatmaktadır. Ciddi bütçe kısıtlamaları,
      zaman sınırlamaları ve lojistik engeller nedeniyle bilişsel sinirbilim ve klinik psikoloji gibi alanlardaki araştırmacılar
      sıklıkla küçük örneklem boyutlarıyla—genellikle yirmiden az katılımcıyla—çalışmalar yürütürler. İstatistiksel teoremler
      düşük güçlü çalışmaların çifte bir kırılganlıktan muzdarip olduğunu dikte eder: yalnızca gerçek biyolojik etkileri kaçırma
      olasılığı yüksek olmakla kalmaz (Tip II hata), aynı zamanda düşük güçlü bir çalışma istatistiksel olarak anlamlı bir
      sonuç keşfettiğinde keşfedilen etki boyutunun büyük ölçüde abartılması neredeyse garantidir. Metabilimciler buna ''kazananın
      laneti'' adını verir: yayın eşiğini başarıyla geçen çalışmalar tam olarak rastgele örnekleme gürültüsünün hipotezle
      olumlu yönde hizalandığı ve büyük ölçekli replikasyon üzerine çöken yapay olarak şişirilmiş bir etki ürettiği çalışmalardır.'
  - paragraph_index: 6
    title: 'Institutional Metareforms: Pre-Registration and Registered Reports'
    content_en: 'To arrest this epistemic erosion, a vigorous open science metareform movement has pioneered transformative
      institutional mechanisms. Foremost among these is the protocol of ''study pre-registration''. Under a pre-registration
      framework, researchers deposit their detailed theoretical hypotheses, experimental designs, exclusion criteria, statistical
      power analyses, and exact analytical code in an immutable, timestamped public registry (such as the Open Science Framework)
      before collecting a single data point. Pre-registration draws an unbreachable methodological firewall between exploratory
      research and confirmatory hypothesis testing, permanently eliminating p-hacking and HARKing. Even more radical is the
      ''Registered Report'' publication format: journals peer-review and accept the methodology and experimental design before
      the research is conducted, guaranteeing publication regardless of whether the final results are positive, negative,
      or inconclusive. Empirical analyses confirm that academic journals adopting the Registered Report format observe replication
      rates exceeding sixty percent, nearly doubling the reproducibility of standard published literature.'
    content_tr: 'Bu epistemik aşınmayı durdurmak için güçlü bir açık bilim metareform hareketi dönüştürücü kurumsal mekanizmalara
      öncülük etmiştir. Bunların başında ''çalışma ön kaydı'' protokolü gelir. Bir ön kayıt çerçevesi altında araştırmacılar
      tek bir veri noktası toplamadan önce ayrıntılı teorik hipotezlerini, deneysel tasarımlarını, dışlama kriterlerini, istatistiksel
      güç analizlerini ve tam analitik kodlarını değişmez, zaman damgalı bir kamu kaydına (Açık Bilim Çerçevesi gibi) yatırırlar.
      Ön kayıt keşifsel araştırma ile doğrulayıcı hipotez testi arasına aşılamaz bir metodolojik güvenlik duvarı çekerek p-hacking
      ve HARKing''i kalıcı olarak ortadan kaldırır. Daha da radikal olanı ''Kayıtlı Rapor'' yayın formatıdır: dergiler araştırma
      yapılmadan önce metodolojiyi ve deneysel tasarımı hakem değerlendirmesine tabi tutar ve kabul eder; nihai sonuçların
      pozitif, negatif veya sonuçsuz olmasına bakılmaksızın yayını garanti eder.'
  - paragraph_index: 7
    title: 'Open Science Infrastructure: Data and Code Sharing'
    content_en: Complementing pre-registration is the global push for radical transparency through open data, open materials,
      and computational reproducibility. Historically, published scientific papers were narrative summaries of research, with
      raw datasets and analysis scripts locked away on private university hard drives, frequently lost or destroyed within
      years of publication. The contemporary open science standard mandates that authors upload raw, de-identified datasets,
      instrument scripts, and complete computational pipelines to permanent public repositories. This computational transparency
      allows independent researchers to verify findings directly, inspect analytical code for programming bugs, and conduct
      synthetic meta-analyses, transforming science from an honor system of polite deference into a self-correcting computational
      collective. Open data repositories like Zenodo and Figshare issue persistent digital object identifiers (DOIs) that
      guarantee the permanent preservation and transparent citability of underlying scientific datasets.
    content_tr: Ön kaydı tamamlayan unsur açık veri, açık materyaller ve hesaplamalı tekrarlanabilirlik yoluyla radikal şeffaflığa
      yönelik küresel baskıdır. Tarihsel olarak yayınlanmış bilimsel makaleler ham veri setleri ve analiz komut dosyaları
      özel üniversite sabit disklerinde kilitli, yayınlandıktan birkaç yıl sonra sıklıkla kaybolan veya yok olan araştırmaların
      anlatısal özetleriydi. Çağdaş açık bilim standardı yazarların ham, kimliksizleştirilmiş veri setlerini, araç komut dosyalarını
      ve eksiksiz hesaplamalı işlem hatlarını kalıcı kamu depolarına yüklemelerini zorunlu kılar. Bu hesaplamalı şeffaflık
      bağımsız araştırmacıların bulguları doğrudan doğrulamasına, analitik kodları programlama hataları açısından incelemesine
      ve sentetik meta-analizler yapmasına olanak tanıyarak bilimi kibar bir hürmet onur sisteminden kendi kendini düzelten
      hesaplamalı bir kolektife dönüştürür.
  - paragraph_index: 8
    title: Realigning Career Metrics and Pedagogical Training
    content_en: Ultimately, structural methodology tools cannot succeed without realigning the fundamental macroeconomic incentives
      of the academic profession. Scientific funding agencies, such as the European Research Council and the National Science
      Foundation, are beginning to condition research grants on open science compliance, penalizing researchers who hoard
      data or publish behind closed paywalls. Furthermore, progressive universities are reforming tenure evaluations, replacing
      blunt impact-factor metrics with holistic assessments that reward replication attempts, pedagogical excellence, and
      methodological rigor. Scientific graduate programs are overhauling curricula, replacing outdated cookbook statistics
      lectures with intensive training in Bayesian inference, statistical power mechanics, and algorithmic workflow automation.
      International reform coalitions, including the San Francisco Declaration on Research Assessment (DORA), actively lobby
      university tenure committees to abandon simplistic journal impact factors in favor of holistic research quality metrics.
    content_tr: Nihayetinde yapısal metodoloji araçları akademik mesleğin temel makroekonomik teşviklerini yeniden hizalamadan
      başarılı olamaz. Avrupa Araştırma Konseyi ve Ulusal Bilim Vakfı gibi bilimsel fon sağlayıcı kuruluşlar araştırma hibelerini
      açık bilim uyumuna bağlamaya başlayarak veri biriktiren veya kapalı ödeme duvarları arkasında yayın yapan araştırmacıları
      cezalandırmaktadır. Dahası ilerici üniversiteler kaba etki faktörü metriklerini replikasyon girişimlerini, pedagojik
      mükemmelliği ve metodolojik titizliği ödüllendiren bütünsel değerlendirmelerle değiştirerek kadro değerlendirmelerini
      reforme etmektedir. Bilimsel lisansüstü programlar müfredatları elden geçirmekte; modası geçmiş reçete istatistik derslerini
      Bayesçi çıkarım, istatistiksel güç mekaniği ve algoritmik iş akışı otomasyonu alanlarında yoğun eğitimlerle değiştirmektedir.
  - paragraph_index: 9
    title: 'Conclusion: The Self-Correcting Promise of Empirical Inquiry'
    content_en: 'Far from signifying the fatal demise of the scientific method, the reproducibility crisis demonstrates its
      ultimate, self-correcting glory. Science is unique among human institutions precisely because it possesses the internal
      epistemic capacity to interrogate, diagnose, and reform its own procedural vulnerabilities. The tribulations of the
      past two decades have dismantled naive positivism, forcing empirical science to evolve into a more rigorous, humble,
      and computationally robust discipline. By institutionalizing open data, pre-registration, and structural humility, the
      scientific community is reaffirming the enduring Enlightenment premise: that truth is not the private property of charismatic
      academic authorities, but a hard-won, communal achievement grounded in transparent, reproducible empirical evidence.
      Embracing scientific humility and methodological transparency is not an admission of institutional weakness; it is the
      ultimate affirmation of empirical science''s self-correcting integrity.'
    content_tr: 'Tekrarlanabilirlik krizi bilimsel yöntemin ölümcül çöküşünü ifade etmekten çok uzaktır; onun nihai, kendi
      kendini düzelten görkemini gösterir. Bilim insan kurumları arasında benzersizdir çünkü tam da kendi prosedürel zayıflıklarını
      sorgulama, teşhis etme ve reforme etme yönünde içsel bir epistemik kapasiteye sahiptir. Son yirmi yılın sıkıntıları
      naif pozitivizmi ortadan kaldırarak ampirik bilimi daha titiz, alçakgönüllü ve hesaplamalı olarak sağlam bir disipline
      dönüşmeye zorlamıştır. Bilim camiası açık veriyi, ön kaydı ve yapısal alçakgönüllülüğü kurumsallaştırarak kalıcı Aydınlanma
      önermesini yeniden teyit etmektedir: hakikat karizmatik akademik otoritelerin özel mülkiyeti değil, şeffaf ve tekrarlanabilir
      ampirik kanıtlara dayanan zor kazanılmış, toplumsal bir başarıdır.'
  vocabulary_annotations:
  - word: reproducibility
    context_definition_en: The ability of an experiment or study to be duplicated accurately by other researchers.
    context_meaning_tr: tekrarlanabilirlik, yeniden üretilebilirlik
  - word: perverse
    context_definition_en: Showing a deliberate desire to behave in a way that is unreasonable or contrary to acceptable norms.
    context_meaning_tr: çarpık, amacın tam tersi sonuç doğuran
  - word: stochastic
    context_definition_en: Randomly determined; having a random probability distribution that may be analyzed statistically.
    context_meaning_tr: stokastik, olasılıksal ve rastgele
  comprehension_questions:
  - id: q_reading_c2_reproducibility-crisis-scientific-rigor_01
    question_en: What shocking finding emerged from the 2015 Open Science Collaboration project detailed in Paragraph 1?
    question_tr_hint: 1. paragrafta ayrıntıları verilen 2015 Açık Bilim İşbirliği projesinden hangi şok edici bulgu ortaya
      çıktı?
    options:
    - Psychology was officially outlawed as an academic discipline across European universities.
    - One hundred percent of all published medical studies were found to be completely fraudulent.
    - Fewer than forty percent of one hundred prominent psychology studies could be successfully replicated.
    - Every single original researcher refused to allow their experimental data to be inspected.
    correct_answer: Fewer than forty percent of one hundred prominent psychology studies could be successfully replicated.
    explanation_en: Paragraph 1 explicitly notes that fewer than forty percent of the psychology studies replicated.
    explanation_tr: 1. paragraf yüz psikoloji çalışmasından yüzde kırktan daha azının tekrarlanabildiğini açıkça belirtir.
  - id: q_reading_c2_reproducibility-crisis-scientific-rigor_02
    question_en: How does the academic 'publish-or-perish' incentive structure drive the replication crisis in Paragraph 2?
    question_tr_hint: 2. paragrafta akademik 'yayınla ya da yok ol' teşvik yapısı replikasyon krizini nasıl körüklemektedir?
    options:
    - Researchers are physically barred from writing papers unless they invent fake patient names.
    - Government funding councils only award grants to researchers who have no university degrees.
    - Academic journals charge researchers one million dollars for every paper they submit.
    - Hiring and grants reward dramatic novel positive results, while journals reject null findings and replications.
    correct_answer: Hiring and grants reward dramatic novel positive results, while journals reject null findings and replications.
    explanation_en: Paragraph 2 explains pressure to produce novel positive results drives selective reporting.
    explanation_tr: 2. paragraf yeni pozitif sonuçlar üretme baskısının seçici raporlamayı körüklediğini açıklar.
  - id: q_reading_c2_reproducibility-crisis-scientific-rigor_03
    question_en: What methodology distinguishes HARKing as described by metascientists in Paragraph 3?
    question_tr_hint: 3. paragrafta metabilimciler tarafından tanımlanan HARKing'i hangi metodoloji ayırt eder?
    options:
    - Throwing all physical lab notebooks into a literal furnace after an experiment.
    - Conducting all psychological experiments exclusively on domesticated laboratory animals.
    - Refusing to use computers or electronic calculators for mathematical operations.
    - Formulating hypotheses retrospectively to fit serendipitous statistical anomalies discovered in data.
    correct_answer: Formulating hypotheses retrospectively to fit serendipitous statistical anomalies discovered in data.
    explanation_en: Paragraph 3 explains HARKing involves formulating hypotheses after results are known.
    explanation_tr: 3. paragraf HARKing'in sonuçlar bilindikten sonra geriye dönük hipotez oluşturmayı içerdiğini açıklar.
  - id: q_reading_c2_reproducibility-crisis-scientific-rigor_04
    question_en: Why does the 'winner's curse' occur in underpowered scientific studies according to Paragraph 5?
    question_tr_hint: 5. paragrafa göre düşük güçlü bilimsel çalışmalarda 'kazananın laneti' neden meydana gelir?
    options:
    - Small studies are always physically cursed by ancient mystical curses from history.
    - Studies crossing the significance threshold with small samples are those where random noise inflated the effect.
    - The researchers who win scientific prizes are legally required to retire immediately.
    - Participants in small studies are paid ten times more money than participants in large studies.
    correct_answer: Studies crossing the significance threshold with small samples are those where random noise inflated the
      effect.
    explanation_en: Paragraph 5 details small sample studies that reach significance grossly exaggerate effect sizes due to
      noise.
    explanation_tr: 5. paragraf küçük örneklemli çalışmaların gürültü nedeniyle etki boyutlarını büyük ölçüde abarttığını
      açıklar.
  - id: q_reading_c2_reproducibility-crisis-scientific-rigor_05
    question_en: How do Registered Reports protect against publication bias and p-hacking according to Paragraph 6?
    question_tr_hint: 6. paragrafa göre Kayıtlı Raporlar yayın önyargısına ve p-hacking'e karşı nasıl koruma sağlar?
    options:
    - They force all scientists to publish their academic articles anonymously on social media.
    - They require researchers to swear a legal oath of honesty in front of a government judge.
    - Journals peer-review and accept methodologies before data collection, guaranteeing publication regardless of outcome.
    - They permanently ban the use of any statistical software tools in academic research.
    correct_answer: Journals peer-review and accept methodologies before data collection, guaranteeing publication regardless
      of outcome.
    explanation_en: Paragraph 6 explains Registered Reports accept methods before data collection, ensuring outcome-independent
      publication.
