- id: reading.c2.monetary-policy-neutral-interest-rates
  title: The Natural Rate of Interest, Secular Stagnation, and Structural Monetary Policy Horizons
  cefr_level: C2
  category: finance_and_economics
  summary_en: Examining r-star (the neutral interest rate), Knut Wicksell's monetary theory, demographic headwinds, global
    savings gluts, and central bank policy frontiers.
  summary_tr: R-star (doğal faiz oranı), Knut Wicksell'in para teorisi, demografik engeller, küresel tasarruf fazlası ve merkez
    bankası politika ufuklarının incelenmesi.
  word_count: 1326
  estimated_reading_minutes: 7
  paragraphs:
  - paragraph_index: 1
    title: 'The Elusive Anchor: Knut Wicksell and the Concept of R-Star'
    content_en: 'In the arcane pantheon of macroeconomic theory, few concepts command such immense influence over global financial
      markets while remaining completely unobservable in empirical reality as the natural or neutral rate of interest, denoted
      mathematically as ''r-star'' (r*). Formulated in 1898 by the seminal Swedish economist Knut Wicksell in his classic
      work ''Geldzins und Güterpreise'' (Interest and Prices), r-star represents the real equilibrium interest rate at which
      an economy operates at full employment and stable price inflation, neither expanding beyond its productive capacity
      nor contracting into demand-deficient recession. Central bankers perceive r-star as the critical navigational beacon
      of monetary policy: if the central bank sets its policy rate above r-star, monetary policy exerts a contractionary drag
      on investment; if set below r-star, monetary stance becomes expansionary. Yet because r-star is a theoretical equilibrium
      construct rather than an observable market price, policymakers must infer its shifting trajectory through complex econometric
      estimation models. The Wicksellian framework distinguishes between the money rate of interest determined by the banking
      system and the natural rate determined by real capital supply and demand in the goods market.'
    content_tr: 'Makroekonomik teorinin gizemli panteonunda çok az kavram matematiksel olarak ''r-star'' (r*) olarak gösterilen
      doğal veya nötr faiz oranı kadar küresel finans piyasaları üzerinde muazzam bir etkiye sahipken ampirik gerçeklikte
      tamamen gözlemlenemez kalır. 1898''de ufuk açıcı İsveçli iktisatçı Knut Wicksell tarafından klasik eseri ''Geldzins
      und Güterpreise''da (Faiz ve Fiyatlar) formüle edilen r-star bir ekonominin ne üretken kapasitesinin ötesine geçtiği
      ne de talep yetersizliği olan bir durgunluğa girdiği, tam istihdamda ve istikrarlı fiyat enflasyonunda faaliyet gösterdiği
      reel denge faiz oranını temsil eder. Merkez bankacıları r-star''ı para politikasının kritik seyir feneri olarak algılarlar:
      merkez bankası politika faizini r-star''ın üzerinde belirlerse para politikası yatırım üzerinde daraltıcı bir fren uygular;
      r-star''ın altında belirlenirse parasal duruş genişlemeci hale gelir. Ancak r-star gözlemlenebilir bir piyasa fiyatından
      ziyade teorik bir denge yapısı olduğundan politika yapıcılar onun değişen yörüngesini karmaşık ekonometrik tahmin modelleri
      aracılığıyla çıkarmak zorundadır.'
  - paragraph_index: 2
    title: The Decades-Long Secular Decline of Equilibrium Yields
    content_en: Beginning in the early 1980s and accelerating in the aftermath of the 2008 Global Financial Crisis, sovereign
      bond markets across advanced industrialized economies witnessed a historic, secular downward march in real long-term
      interest rates. In the United States, Europe, and Japan, inflation-adjusted yields on benchmark government securities
      plunged from over five percent to zero, and in several jurisdictions, deep into negative territory. Influential economists,
      most prominently Thomas Laubach, John C. Williams, and former Treasury Secretary Lawrence Summers, demonstrated that
      this collapse was not a cyclical monetary policy artifact, but the structural consequence of a relentless decline in
      underlying r-star. Summers revived Alvin Hansen's 1930s hypothesis of 'secular stagnation', arguing that advanced capitalist
      economies were afflicted by chronic structural demand deficiency, forcing central banks into ultra-accommodative monetary
      stances merely to sustain modest economic growth. Furthermore, quantitative macroeconomic models by the International
      Monetary Fund demonstrate that the decline in real rates was a synchronized global phenomenon spanning every continent
      simultaneously.
    content_tr: 1980'lerin başında başlayan ve 2008 Küresel Finans Krizinin ardından hızlanan gelişmiş sanayileşmiş ekonomilerdeki
      devlet tahvili piyasaları reel uzun vadeli faiz oranlarında tarihi, uzun vadeli bir aşağı yönlü yürüyüşe tanık oldu.
      Amerika Birleşik Devletleri, Avrupa ve Japonya'da gösterge hükümet menkul kıymetlerinin enflasyona göre ayarlanmış getirileri
      yüzde beşin üzerinden sıfıra ve birkaç yargı alanında negatif bölgenin derinliklerine düştü. Başta Thomas Laubach, John
      C. Williams ve eski Hazine Bakanı Lawrence Summers olmak üzere etkili iktisatçılar bu çöküşün döngüsel bir para politikası
      yapıntısı değil altta yatan r-star'daki amansız düşüşün yapısal bir sonucu olduğunu gösterdiler. Summers Alvin Hansen'in
      1930'lardaki 'uzun vadeli durgunluk' hipotezini yeniden canlandırarak gelişmiş kapitalist ekonomilerin kronik yapısal
      talep yetersizliğinden muzdarip olduğunu ve merkez bankalarını yalnızca mütevazı ekonomik büyümeyi sürdürmek için ultra
      genişlemeci parasal duruşlara zorladığını savundu.
  - paragraph_index: 3
    title: 'Structural Drivers: The Demographic Tectonic Shift'
    content_en: The primary structural engine depressing global r-star is the profound demographic transition transforming
      developed and emerging economies. Throughout human history, expanding working-age populations drove robust consumer
      demand and necessitated capital expenditures on physical infrastructure, schools, and residential housing. Over recent
      decades, however, birth rates across OECD economies and East Asia have collapsed far below replacement fertility, precipitating
      rapid population aging. As vast demographic cohorts—most notably the post-war Baby Boomers—enter their peak earnings
      and pre-retirement years, their aggregate propensity to save surges dramatically to accumulate retirement nest eggs.
      Simultaneously, shrinking domestic labor forces diminish the marginal productivity of physical capital, disincentivizing
      corporate business investment. This widening macroeconomic mismatch between surging desired savings and depressed desired
      investment drove the global equilibrium interest rate downward. In Japan and southern Europe, elderly dependency ratios
      have crossed critical thresholds where domestic national pension systems face profound actuarial deficits, depressing
      national savings growth rates.
    content_tr: Küresel r-star'ı baskılayan birincil yapısal motor gelişmiş ve gelişmekte olan ekonomileri dönüştüren derin
      demografik geçiştir. İnsanlık tarihi boyunca genişleyen çalışma çağındaki nüfuslar güçlü tüketici talebini yönlendirmiş
      ve fiziksel altyapı, okullar ve konutlar için sermaye harcamalarını zorunlu kılmıştır. Ancak son on yıllarda OECD ekonomileri
      ve Doğu Asya genelinde doğum oranları ikame doğurganlığının çok altına düşerek hızlı nüfus yaşlanmasını hızlandırmıştır.
      Başta savaş sonrası Baby Boomer kuşağı olmak üzere geniş demografik kohortlar en yüksek kazanç ve emeklilik öncesi yıllarına
      girdikçe emeklilik birikimleri oluşturmak için toplam tasarruf eğilimleri çarpıcı biçimde artmaktadır. Eşzamanlı olarak
      küçülen yerel işgücü fiziksel sermayenin marjinal üretkenliğini azaltarak kurumsal iş yatırımlarını caydırmaktadır.
      Artan arzulanan tasarruflar ile azalan arzulanan yatırımlar arasındaki bu genişleyen makroekonomik uyumsuzluk küresel
      denge faiz oranını aşağıya doğru sürükledi.
  - paragraph_index: 4
    title: The Global Savings Glut and the Capital-Light Economy
    content_en: Reinforcing domestic demographic trends was the international macroeconomic dynamic identified by former Federal
      Reserve Chairman Ben Bernanke as the 'global savings glut'. Following the 1997 Asian Financial Crisis, export-oriented
      emerging market economies—most conspicuously China and petro-states—systematically accumulated massive foreign exchange
      reserves to self-insure against sudden capital flight. These colossal sovereign surpluses were channeled predominantly
      into safe, highly liquid sovereign debt instruments, particularly US Treasury bonds, exerting persistent downward pressure
      on global long-term yields. Simultaneously, the structural composition of the global corporate economy underwent a technological
      transformation from capital-intensive industrial manufacturing to intangible, software-driven enterprises. Dominant
      technology titans require minuscule physical capital investments compared to historical railroad conglomerates or automotive
      manufacturers, drastically reducing the private sector's appetite for capital debt. Concurrently, corporate savings
      in advanced economies have surged, as monopolistic mega-firms accumulate colossal cash reserves that are retained on
      corporate balance sheets rather than reinvested in physical plant and equipment.
    content_tr: Yerel demografik eğilimleri pekiştiren unsur eski Federal Rezerv Başkanı Ben Bernanke tarafından 'küresel
      tasarruf fazlası' olarak tanımlanan uluslararası makroekonomik dinamikti. 1997 Asya Finans Krizinin ardından başta Çin
      ve petrol devletleri olmak üzere ihracata yönelik gelişmekte olan piyasa ekonomileri ani sermaye çıkışlarına karşı kendi
      kendilerini sigortalamak için sistematik olarak devasa döviz rezervleri biriktirdiler. Bu muazzam egemen fazlalar ağırlıklı
      olarak güvenli, yüksek derecede likit devlet borçlanma araçlarına, özellikle de ABD Hazine tahvillerine yönlendirildi
      ve küresel uzun vadeli getiriler üzerinde kalıcı bir aşağı yönlü baskı uyguladı. Eşzamanlı olarak küresel kurumsal ekonominin
      yapısal bileşimi sermaye yoğun endüstriyel üretimden maddi olmayan, yazılım odaklı işletmelere doğru teknolojik bir
      dönüşüm geçirdi. Baskın teknoloji devleri tarihsel demiryolu holdinglerine veya otomotiv üreticilerine kıyasla çok küçük
      fiziksel sermaye yatırımları gerektirmekte ve bu da özel sektörün sermaye borcu iştahını büyük ölçüde azaltmaktadır.
  - paragraph_index: 5
    title: The Effective Lower Bound and Unconventional Toolkits
    content_en: 'A depressed r-star severely restricts the policy ammunition of central banks during economic downturns. Historically,
      central banks lowered short-term policy interest rates by four to five hundred basis points to stimulate aggregate demand
      during standard cyclical recessions. However, when r-star settles near zero, standard policy rates collide with the
      Effective Lower Bound (ELB)—the psychological and institutional boundary near zero percent where depositors withdraw
      physical cash rather than accepting negative deposit rates. Trapped at the ELB, central banks were forced to deploy
      unprecedented unconventional monetary toolkits: Quantitative Easing (QE) asset purchase programs to compress term premiums,
      forward guidance communications to anchor market yield curves, and targeted long-term refinancing operations to subsidize
      commercial banking lending. When interest rates approach the lower bound, the term structure of interest rates becomes
      compressed, squeezing commercial banking net interest margins and impairing traditional credit intermediation channels.'
    content_tr: 'Baskılanmış bir r-star ekonomik gerilemeler sırasında merkez bankalarının politika cephanesini ciddi şekilde
      kısıtlar. Tarihsel olarak merkez bankaları standart döngüsel durgunluklar sırasında toplam talebi canlandırmak için
      kısa vadeli politika faiz oranlarını dört ila beş yüz baz puan düşürürdü. Ancak r-star sıfıra yakın bir seviyeye yerleştiğinde
      standart politika faizleri Etkili Alt Sınır (ELB) ile çarpışır—mevduat sahiplerinin negatif mevduat faizlerini kabul
      etmek yerine fiziksel nakit çektiği yüzde sıfıra yakın psikolojik ve kurumsal sınır. ELB''de kapana kısılan merkez bankaları
      eşi benzeri görülmemiş geleneksel olmayan parasal araç setlerini devreye sokmak zorunda kaldı: vade primlerini sıkıştırmak
      için Parasal Genişleme (QE) varlık alım programları, piyasa getiri eğrilerini sabitlemek için sözlü yönlendirme iletişimleri
      ve ticari bankacılık kredilerini sübvanse etmek için hedeflenen uzun vadeli yeniden finansman operasyonları.'
  - paragraph_index: 6
    title: The Post-Pandemic Inflationary Shock and the R-Star Debate
    content_en: 'The global macroeconomic landscape underwent a seismic disruption in the wake of the 2020 COVID-19 pandemic
      and subsequent geopolitical ruptures. Massive fiscal stimulus packages, broken global maritime supply chains, energy
      commodity shocks, and tight post-lockdown labor markets unleashed the most aggressive global inflationary surge in four
      decades. Central banks responded with the most aggressive, synchronized monetary tightening cycle in modern history,
      driving benchmark interest rates above five percent. This dramatic monetary pivot ignited a fierce analytical controversy
      within macroeconomic circles: had r-star experienced a permanent structural renaissance, or was the high-interest-rate
      environment merely a temporary cyclical aberration destined to revert to the low-rate stagnation paradigm once inflationary
      pressures subsided? The post-2020 inflationary shock forced central banks to reconsider average inflation targeting
      frameworks, underscoring the severe risks of assuming that disinflationary trends were immutable.'
    content_tr: 'Küresel makroekonomik manzara 2020 COVID-19 pandemisi ve ardından gelen jeopolitik kırılmaların ardından
      sismik bir bozulmaya uğradı. Devasa mali teşvik paketleri, bozulan küresel denizcilik tedarik zincirleri, enerji emtia
      şokları ve karantina sonrası sıkı işgücü piyasaları son kırk yılın en agresif küresel enflasyonist dalgasını serbest
      bıraktı. Merkez bankaları gösterge faiz oranlarını yüzde beşin üzerine çıkararak modern tarihin en agresif, senkronize
      parasal sıkılaştırma döngüsüyle yanıt verdi. Bu dramatik parasal eksen makroekonomik çevrelerde şiddetli bir analitik
      tartışmayı ateşledi: r-star kalıcı bir yapısal rönesans mı yaşamıştı yoksa yüksek faiz oranı ortamı enflasyonist baskılar
      azaldığında düşük faizli durgunluk paradigmasına geri dönmeye mahkum geçici bir döngüsel sapma mıydı?'
  - paragraph_index: 7
    title: Structural Forces Reshaping the New Macroeconomic Regime
    content_en: Compelling theoretical arguments suggest that structural economic shifts could permanently elevate r-star
      above its pre-pandemic nadir. Foremost among these is the immense capital expenditure required for global decarbonization
      and the clean energy transition, demanding trillions in public and private capital to construct renewable infrastructure
      and expand transmission grids. Simultaneously, geopolitical fragmentation, deglobalization, and nearshoring policies
      compel corporations to duplicate supply chains, substituting low-cost global logistics for resilient, capital-intensive
      domestic manufacturing. Furthermore, sovereign balance sheets across advanced nations carry astronomical national debt
      burdens, requiring massive bond issuances that elevate sovereign borrowing term premiums. If artificial intelligence
      investments simultaneously generate sustained productivity gains, the marginal product of capital could rise structurally,
      permanently anchoring r-star in positive territory. Infrastructure spending requirements for climate adaptation—such
      as sea wall construction and flood defense systems—represent non-negotiable capital demands that will compete for global
      savings over the coming century.
    content_tr: Zorlayıcı teorik argümanlar yapısal ekonomik değişimlerin r-star'ı pandemi öncesi tabanının kalıcı olarak
      üzerine çıkarabileceğini düşündürmektedir. Bunların başında yenilenebilir altyapı inşa etmek ve iletim şebekelerini
      genişletmek için kamu ve özel sermayede trilyonlarca dolar talep eden küresel karbonsuzlaşma ve temiz enerji geçişi
      için gereken muazzam sermaye harcaması gelmektedir. Eşzamanlı olarak jeopolitik parçalanma, küreselleşmeden uzaklaşma
      ve yakına tedarik politikaları şirketleri tedarik zincirlerini kopyalamaya zorlayarak düşük maliyetli küresel lojistiğin
      yerine dayanıklı, sermaye yoğun yerli üretimi koymaktadır. Dahası gelişmiş ülkelerdeki egemen bilançolar devlet borçlanma
      vade primlerini yükselten devasa tahvil ihraçları gerektiren astronomik ulusal borç yükleri taşımaktadır. Yapay zeka
      yatırımları eşzamanlı olarak sürdürülebilir üretkenlik kazanımları üretirse sermayenin marjinal ürünü yapısal olarak
      yükselebilir ve r-star'ı kalıcı olarak pozitif bölgeye demirleyebilir.
  - paragraph_index: 8
    title: The Countervailing Gravitational Pull of Aging
    content_en: Conversely, prominent macroeconomic skeptics, including Olivier Blanchard and John Williams, caution that
      the deep demographic and structural drivers that depressed r-star for four decades remain overwhelmingly intact. Population
      aging is not reversing; rather, dependency ratios in Europe, China, and Japan are accelerating toward historical records,
      ensuring that global desired savings will remain persistently elevated. Furthermore, wealth inequality continues to
      concentrate capital among ultra-high-net-worth households with an extraordinarily low marginal propensity to consume.
      Unless clean energy investments and artificial intelligence spur a profound, sustained multi-factor productivity explosion
      that permanently outstrips demographic headwinds, the macroeconomic gravitational pull of secular stagnation will likely
      reassert itself, pulling r-star back toward its historical lows. If emerging market economies concurrently experience
      demographic slowdowns, the historical global savings glut will undergo structural contraction, reinforcing upward pressure
      on long-term equilibrium rates.
    content_tr: Buna karşılık Olivier Blanchard ve John Williams dahil olmak üzere önde gelen makroekonomik şüpheciler r-star'ı
      kırk yıl boyunca baskılayan derin demografik ve yapısal itici güçlerin ezici bir şekilde bozulmadan kaldığı konusunda
      uyarmaktadır. Nüfus yaşlanması tersine dönmüyor; aksine Avrupa, Çin ve Japonya'daki bağımlılık oranları tarihi rekorlara
      doğru hızlanmakta ve bu da küresel arzulanan tasarrufların kalıcı olarak yüksek kalmasını sağlamaktadır. Dahası servet
      eşitsizliği sermayeyi son derece düşük marjinal tüketim eğilimine sahip aşırı yüksek net değerli haneler arasında yoğunlaştırmaya
      devam etmektedir. Temiz enerji yatırımları ve yapay zeka demografik engelleri kalıcı olarak geride bırakan derin, sürdürülebilir
      bir çok faktörlü üretkenlik patlamasını teşvik etmedikçe uzun vadeli durgunluğun makroekonomik yerçekimi kuvveti muhtemelen
      kendini yeniden gösterecek ve r-star'ı tarihi en düşük seviyelerine doğru geri çekecektir.
  - paragraph_index: 9
    title: 'Conclusion: Navigating the Fog of Monetary Policy'
    content_en: The enduring mystery of r-star serves as a humbling reminder of the epistemic limits of modern central banking.
      Monetary policymakers cannot simply look up the correct policy rate on a digital display; they must navigate a dense
      fog of structural uncertainty, calibrating financial conditions against an unobservable, shifting theoretical equilibrium.
      Whether r-star settles into a higher structural regime or gravitates back toward secular stagnation will dictate the
      fiscal solvency of sovereign governments, the viability of corporate balance sheets, and the economic prosperity of
      citizens worldwide. In an uncertain twenty-first-century macroeconomic landscape, central bankers must cultivate profound
      analytical humility, recognizing that their most foundational compass is constantly being rewritten by the deep structural
      currents of human demographics, technology, and geopolitics. Ultimately, central banking is as much an art of interpreting
      complex social transformations as it is a science of running econometric Taylor rule equations.
    content_tr: R-star'ın kalıcı gizemi modern merkez bankacılığının epistemik sınırlarının alçakgönüllü bir hatırlatıcısı
      olarak hizmet eder. Parasal politika yapıcılar doğru politika faizini dijital bir ekranda kolayca göremezler; finansal
      koşulları gözlemlenemeyen, değişen teorik bir dengeye göre kalibre ederek yoğun bir yapısal belirsizlik sisinde gezinmek
      zorundadırlar. R-star'ın daha yüksek bir yapısal rejime mi yerleşeceği yoksa uzun vadeli durgunluğa doğru mu geri çekileceği
      egemen hükümetlerin mali ödeme gücünü, kurumsal bilançoların uygulanabilirliğini ve dünya çapındaki vatandaşların ekonomik
      refahını belirleyecektir. Belirsiz bir yirmi birinci yüzyıl makroekonomik manzarasında merkez bankacıları en temel pusulalarının
      insan demografisinin, teknolojisinin ve jeopolitiğinin derin yapısal akıntıları tarafından sürekli olarak yeniden yazıldığını
      kabul ederek derin bir analitik alçakgönüllülük geliştirmelidir.
  vocabulary_annotations:
  - word: arcane
    context_definition_en: Understood by few; mysterious or secret.
    context_meaning_tr: gizemli, sırrına az kişinin vakıf olduğu
  - word: secular
    context_definition_en: Continuing over an indefinitely long period; not cyclical or short-term.
    context_meaning_tr: uzun vadeli, dönemsel olmayan, yapısal
  - word: solvency
    context_definition_en: The possession of assets in excess of liabilities; ability to pay one's debts.
    context_meaning_tr: ödeme gücü, borçları karşılama yeteneği
  comprehension_questions:
  - id: q_reading_c2_monetary-policy-neutral-interest-rates_01
    question_en: What does Knut Wicksell's macroeconomic concept of 'r-star' represent according to Paragraph 1?
    question_tr_hint: 1. paragrafa göre Knut Wicksell'in makroekonomik 'r-star' kavramı neyi temsil eder?
    options:
    - The exact percentage of national tax revenues that must be invested in space research.
    - The mandatory fee charged by commercial retail banks for physical ATM withdrawals.
    - The real equilibrium interest rate where an economy achieves full employment and stable inflation.
    - The mathematical speed at which paper currency burns inside industrial incinerators.
    correct_answer: The real equilibrium interest rate where an economy achieves full employment and stable inflation.
    explanation_en: Paragraph 1 defines r-star as the real equilibrium rate for full employment and stable inflation.
    explanation_tr: 1. paragraf r-star'ı tam istihdam ve istikrarlı enflasyon için gereken reel denge faiz oranı olarak tanımlar.
  - id: q_reading_c2_monetary-policy-neutral-interest-rates_02
    question_en: How did demographic aging across OECD economies depress r-star according to Paragraph 3?
    question_tr_hint: 3. paragrafa göre OECD ekonomilerindeki demografik yaşlanma r-star'ı nasıl baskılamıştır?
    options:
    - Aging workers consume all physical gold reserves, leaving no currency for investments.
    - Retirement savings surged while shrinking labor forces reduced the marginal productivity of capital investment.
    - Elderly citizens refuse to use paper money, forcing central banks to shut down completely.
    - Governments passed laws making it illegal for anyone over sixty to hold a bank account.
    correct_answer: Retirement savings surged while shrinking labor forces reduced the marginal productivity of capital investment.
    explanation_en: Paragraph 3 explains pre-retirement savings surged while shrinking labor diminished capital investment
      demand.
    explanation_tr: 3. paragraf emeklilik öncesi tasarrufların arttığını, azalan işgücünün ise yatırım talebini düşürdüğünü
      açıklar.
  - id: q_reading_c2_monetary-policy-neutral-interest-rates_03
    question_en: What institutional barrier is known as the Effective Lower Bound (ELB) in Paragraph 5?
    question_tr_hint: 5. paragrafta Etkili Alt Sınır (ELB) olarak bilinen kurumsal engel nedir?
    options:
    - A mandatory speed limit enforced on armored cash-transport vehicles.
    - A international treaty forbidding nations from printing banknotes with colored ink.
    - The boundary near zero percent where depositors withdraw physical cash rather than accept negative deposit rates.
    - The legal maximum height of commercial bank headquarters buildings.
    correct_answer: The boundary near zero percent where depositors withdraw physical cash rather than accept negative deposit
      rates.
    explanation_en: Paragraph 5 details the ELB as the zero-bound limit where cash hoarding prevents negative deposit rates.
    explanation_tr: 5. paragraf ELB'yi mevduat sahiplerinin nakde yönelerek negatif faizi engellediği sıfır sınırı olarak
      açıklar.
  - id: q_reading_c2_monetary-policy-neutral-interest-rates_04
    question_en: What contemporary structural factors could permanently elevate r-star according to Paragraph 7?
    question_tr_hint: 7. paragrafa göre hangi çağdaş yapısal faktörler r-star'ı kalıcı olarak yükseltebilir?
    options:
    - A worldwide decree abolishing all commercial private corporations.
    - The discovery of massive gold meteorites across agricultural fields.
    - A global ban on all computer software and digital communication tools.
    - Massive capital investments for decarbonization, supply chain nearshoring, and sovereign debt expansions.
    correct_answer: Massive capital investments for decarbonization, supply chain nearshoring, and sovereign debt expansions.
    explanation_en: Paragraph 7 highlights decarbonization expenditures, supply chain duplication, and debt issuance as upward
      drivers.
    explanation_tr: 7. paragraf karbonsuzlaşma harcamalarını, tedarik zincirlerinin kopyalanmasını ve borç ihraçlarını yükseltici
      unsurlar olarak vurgular.
  - id: q_reading_c2_monetary-policy-neutral-interest-rates_05
    question_en: Why do skeptical economists like Olivier Blanchard believe r-star will remain depressed in Paragraph 8?
    question_tr_hint: 8. paragrafta Olivier Blanchard gibi şüpheci iktisatçılar r-star'ın neden baskılanmış kalacağına inanmaktadır?
    options:
    - Accelerating demographic aging and wealth concentration maintain an elevated global desired savings rate.
    - Citizens will stop using electricity and return to medieval farming practices.
    - Commercial banks will run out of paper to print loan agreements.
    - All central bankers will be replaced by automated artificial intelligence bots.
    correct_answer: Accelerating demographic aging and wealth concentration maintain an elevated global desired savings rate.
    explanation_en: Paragraph 8 explains aging and wealth concentration sustain high desired savings, pulling rates down.
    explanation_tr: 8. paragraf yaşlanma ve servet yoğunlaşmasının yüksek tasarruf arzusunu sürdürerek faizleri düşürdüğünü
