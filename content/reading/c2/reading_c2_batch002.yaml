  comprehension_questions:
  - id: q_reading_c2_post-industrial-automation-labor-dynamics_01
    question_en: What economic concept is known as the 'Luddite fallacy' according to Paragraph 1?
    question_tr_hint: 1. paragrafa göre hangi ekonomik kavram 'Luddite yanılgısı' olarak bilinir?
    options:
    - The theory that agricultural crop yields decrease when farmers use tractors.
    - The belief that wooden machines are technologically superior to metallic steel machines.
    - The false belief that labor-saving machinery permanently reduces aggregate employment across the entire economy.
    - The legal requirement that all factory workers must smash their tools upon retirement.
    correct_answer: The false belief that labor-saving machinery permanently reduces aggregate employment across the entire
      economy.
    explanation_en: Paragraph 1 explains the Luddite fallacy is the belief that automation permanently eliminates overall
      jobs.
    explanation_tr: 1. paragraf Luddite yanılgısını otomasyonun toplam işleri kalıcı olarak yok ettiği inancı olarak açıklar.
  - id: q_reading_c2_post-industrial-automation-labor-dynamics_02
    question_en: How does 'Routine-Biased Technological Change' (RBTC) differ from classical skill-biased models in Paragraph
      2?
    question_tr_hint: 2. paragrafta 'Rutin Yanlı Teknolojik Değişim' (RBTC) klasik beceri yanlı modellerden nasıl ayrılmaktadır?
    options:
    - It shows automation targets codifiable routine tasks heavily concentrated in middle-skill occupations.
    - It proves that machines can never perform any repetitive physical sorting tasks.
    - It claims that only workers with doctoral degrees can operate modern digital computers.
    - It requires all industrial factories to replace computers with manual paper ledgers.
    correct_answer: It shows automation targets codifiable routine tasks heavily concentrated in middle-skill occupations.
    explanation_en: Paragraph 2 details RBTC demonstrates automation replaces codifiable routine tasks in middle-skill jobs.
    explanation_tr: 2. paragraf RBTC'nin otomasyonun orta becerili rutin görevleri hedef aldığını gösterdiğini açıklar.
  - id: q_reading_c2_post-industrial-automation-labor-dynamics_03
    question_en: How has modern generative AI inverted Moravec's paradox according to Paragraph 4?
    question_tr_hint: 4. paragrafa göre modern üretken yapay zeka Moravec paradoksunu nasıl tersine çevirmiştir?
    options:
    - It requires computers to be constructed out of organic human biological brain cells.
    - It prevents automated models from passing any professional licensing examinations.
    - It physically folds laundry ten times faster than any human child.
    - It performs complex cognitive white-collar tasks while dexterous physical robots remain clumsy and expensive.
    correct_answer: It performs complex cognitive white-collar tasks while dexterous physical robots remain clumsy and expensive.
    explanation_en: Paragraph 4 explains generative AI excels at cognitive tasks while physical dexterity remains difficult.
    explanation_tr: 4. paragraf üretken yapay zekanın bilişsel görevlerde başarılı olduğunu, fiziksel becerinin ise zor kaldığını
      açıklar.
  - id: q_reading_c2_post-industrial-automation-labor-dynamics_04
    question_en: What economic phenomenon does Baumol's Cost Disease describe according to Paragraph 5?
    question_tr_hint: 5. paragrafa göre Baumol'un Maliyet Hastalığı hangi ekonomik olguyu tanımlar?
    options:
    - Government tax rates rising automatically whenever national unemployment reaches ten percent.
    - Industrial factory workers contracting rare medical bacterial infections from machinery.
    - Costs inexorably rise in non-automatable relational service sectors relative to automatable manufactured goods.
    - The total monetary cost of printing paper currency exceeding the face value of the banknotes.
    correct_answer: Costs inexorably rise in non-automatable relational service sectors relative to automatable manufactured
      goods.
    explanation_en: Paragraph 5 explains Baumol's disease shows costs rise in non-automatable relational services.
    explanation_tr: 5. paragraf Baumol hastalığının otomatikleştirilemeyen ilişkisel hizmetlerde maliyetlerin arttığını gösterdiğini
      açıklar.
  - id: q_reading_c2_post-industrial-automation-labor-dynamics_05
    question_en: What structural economic reform is Universal Basic Income (UBI) intended to achieve in Paragraph 7?
    question_tr_hint: 7. paragrafta Evrensel Temel Gelir'in (UBI) hangi yapısal ekonomik reformu gerçekleştirmesi amaçlanmaktadır?
    options:
    - Abolish all private property and confiscate all personal residential homes.
    - Permanently close all hospitals, universities, and municipal public libraries.
    - Require all citizens to work sixty hours per week in state-owned agricultural collectives.
    - Establish an unconditional financial floor, granting workers bargaining power to reject exploitative labor.
    correct_answer: Establish an unconditional financial floor, granting workers bargaining power to reject exploitative labor.
    explanation_en: Paragraph 7 explains UBI provides an unconditional floor, decoupling survival from mandatory employment.
    explanation_tr: 7. paragraf UBI'nin hayatta kalmayı zorunlu istihdamdan ayırarak koşulsuz bir taban sağladığını açıklar.
