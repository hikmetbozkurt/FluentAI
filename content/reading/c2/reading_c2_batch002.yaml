- id: reading.c2.urban-resilience-climate-adaptation-hydrology
  title: Sponge Cities, Hydrodynamic Modeling, and Urban Resilience in the Anthropocene
  cefr_level: C2
  category: business_strategy
  summary_en: Analyzing urban hydrological adaptation, nature-based sponge city engineering, stormwater management, and hydrodynamic
    sea level defenses in coastal megacities.
  summary_tr: Kentsel hidrolojik uyum, doğa tabanlı sünger şehir mühendisliği, yağmur suyu yönetimi ve kıyı mega kentlerinde
    hidrodinamik deniz seviyesi savunmalarının analizi.
  word_count: 1260
  estimated_reading_minutes: 6
  paragraphs:
  - paragraph_index: 1
    title: 'The Impervious Siege: Urbanization and Hydrological Disruption'
    content_en: 'For over two centuries, modern urban civil engineering operated under a mechanistic, adversarial philosophy
      regarding natural hydrology: rainwater was conceptualized as a dangerous physical waste product to be repelled, collected,
      and expelled from the built environment with maximal velocity. Municipal engineers paved millions of square kilometers
      of watersheds with impermeable asphalt, sealed natural floodplains behind concrete retaining walls, and channeled urban
      rivers into subterranean culverts. In a stable climatic regime, this grey stormwater infrastructure provided adequate
      drainage for routine seasonal rainfall. However, in the Anthropocene—characterized by rapidly warming atmospheric physics
      that supercharges the Clausius-Clapeyron relation, increasing atmospheric moisture-carrying capacity by approximately
      seven percent per degree Celsius of warming—this concrete paradigm has proven to be a catastrophic engineering failure.
      Historical sanitary engineering focused entirely on rapid conveyancing, operating on the flawed premise that urban drainage
      channels possessed infinite capacity to absorb downstream runoff.'
    content_tr: 'İki asırdan fazla bir süredir modern kentsel inşaat mühendisliği doğal hidrolojiye ilişkin mekanik, düşmanca
      bir felsefe altında faaliyet gösterdi: yağmur suyu inşa edilmiş çevreden azami hızla püskürtülmesi, toplanması ve atılması
      gereken tehlikeli bir fiziksel atık ürün olarak kavramsallaştırıldı. Belediye mühendisleri milyonlarca kilometrekarelik
      su havzasını geçirimsiz asfaltla kapladı, doğal taşkın yataklarını beton istinat duvarlarının arkasına mühürledi ve
      kentsel nehirleri yer altı menfezlerine kanalize etti. İstikrarlı bir iklim rejiminde bu gri yağmur suyu altyapısı rutin
      mevsimsel yağışlar için yeterli drenaj sağladı. Ancak atmosferik nem taşıma kapasitesini ısınmanın her santigrat derecesi
      başına yaklaşık yüzde yedi artıran Clausius-Clapeyron ilişkisini aşırı yükleyen hızla ısınan atmosferik fizikle karakterize
      edilen Antroposen''de bu beton paradigma feci bir mühendislik başarısızlığı olduğunu kanıtlamıştır.'
  - paragraph_index: 2
    title: The Mechanics of Urban Pluvial Catastrophe
    content_en: 'The vulnerability of modern megacities to catastrophic pluvial flooding stems directly from the total destruction
      of natural hydrological buffering capacity. In a pristine forest or wetland ecosystem, up to eighty percent of precipitation
      naturally infiltrates the soil profile, replenishing subterranean groundwater aquifers, while the remainder is absorbed
      by plant biomass or gradually transpired into the atmosphere. Surface runoff represents a minuscule fraction of total
      hydrological volume. In a dense contemporary metropolis covered by ninety percent impervious surfaces, these hydrological
      proportions invert catastrophically: less than ten percent of rainfall infiltrates the ground, while over eighty percent
      instantly converts into violent surface runoff. When extreme convective cloudbursts dump hundreds of millimeters of
      water in hours, subterranean storm sewer pipes are overwhelmed, transforming city boulevards into raging urban rivers.
      Micro-scale hydrological modeling demonstrates that restoring soil permeability across just thirty percent of an urban
      watershed can reduce peak flood discharges by upwards of fifty percent.'
    content_tr: 'Modern mega kentlerin feci yağmur suyu taşkınlarına karşı kırılganlığı doğrudan doğal hidrolojik tamponlama
      kapasitesinin tamamen yok edilmesinden kaynaklanmaktadır. El değmemiş bir orman veya sulak alan ekosisteminde yağışın
      yüzde seksenine kadarı doğal olarak toprak profiline sızar, yeraltı akiferlerini yeniler; geri kalanı ise bitki biyokütlesi
      tarafından emilir veya kademeli olarak atmosfere buharlaşır. Yüzey akışı toplam hidrolojik hacmin çok küçük bir kısmını
      temsil eder. Yüzde doksan geçirimsiz yüzeylerle kaplı yoğun bir çağdaş metropolde bu hidrolojik oranlar feci bir şekilde
      tersine döner: yağışın yüzde onundan daha azı toprağa sızarken yüzde seksenden fazlası anında şiddetli yüzey akışına
      dönüşür. Aşırı konvektif bulut patlamaları saatler içinde yüzlerce milimetre su bıraktığında yer altı yağmur suyu kanalizasyon
      boruları aşırı yüklenir ve şehir bulvarlarını azgın kentsel nehirlere dönüştürür.'
  - paragraph_index: 3
    title: 'The Sponge City Revolution: Working with Water'
    content_en: 'To dismantle this catastrophic hydraulic failure, progressive urban planners and ecological landscape architects
      have pioneered the transformative paradigm of ''Sponge Cities''. Spearheaded by Chinese landscape architect Yu Kongjian
      and adopted globally from Rotterdam to Philadelphia, the sponge city framework replaces adversarial grey infrastructure
      with regenerative, nature-based green-blue infrastructure. Rather than rapidly channeling stormwater off impermeable
      roofs into overloaded concrete drains, a sponge city is engineered to absorb, store, infiltrate, purify, and slowly
      release stormwater within the urban fabric itself. Sponge cities treat rainwater not as an enemy to be expelled, but
      as a precious ecological resource to be harvested, cooled, and integrated into living urban ecosystems. The aesthetic
      dimension of sponge cities is profound: replacing oppressive concrete culverts with naturalized meandering rivers and
      wetland parks significantly enhances public mental well-being and recreational space.'
    content_tr: Bu feci hidrolik arızayı ortadan kaldırmak için ilerici şehir plancıları ve ekolojik peyzaj mimarları dönüştürücü
      'Sünger Şehirler' paradigmasına öncülük etmişlerdir. Çinli peyzaj mimarı Yu Kongjian tarafından öncülük edilen ve Rotterdam'dan
      Philadelphia'ya kadar küresel olarak benimsenen sünger şehir çerçevesi düşmanca gri altyapının yerine yenileyici, doğa
      tabanlı yeşil-mavi altyapıyı koyar. Bir sünger şehir yağmur suyunu geçirimsiz çatılardan aşırı yüklenmiş beton drenajlara
      hızla kanalize etmek yerine yağmur suyunu kentsel dokunun kendi içinde emecek, depolayacak, sızdıracak, arıtacak ve
      yavaşça serbest bırakacak şekilde tasarlanmıştır. Sünger şehirler yağmur suyunu dışarı atılacak bir düşman olarak değil
      toplanacak, soğutulacak ve yaşayan kentsel ekosistemlere entegre edilecek değerli bir ekolojik kaynak olarak ele alır.
  - paragraph_index: 4
    title: Decentralized Green Infrastructure Topologies
    content_en: The structural topology of a sponge city is decentralized and multi-scalar, integrating a mosaic of nature-based
      interventions across the municipal watershed. At the building scale, extensive green roofs planted with drought-resistant
      sedum and permeable substrate retain up to seventy percent of rainfall, cooling building envelopes through evapotranspiration
      and significantly mitigating the urban heat island effect. At the streetscape scale, standard concrete curbs are replaced
      with engineered bioswales, rain gardens, and permeable asphalt pavements that filter heavy metals and petroleum hydrocarbons
      through phytoremediation before water percolates into groundwater tables. At the neighborhood scale, concrete retention
      basins are replaced with terraced public parklands and sunken sports fields designed to flood harmlessly during extreme
      rain events, functioning as temporary retention lakes before draining safely. Phytoremediation mechanisms utilize hyperaccumulating
      aquatic plants like reeds, cattails, and water hyacinths whose root rhizomes metabolize heavy metals and urban pollutants
      naturally.
    content_tr: Bir sünger şehrin yapısal topolojisi belediye su havzası genelinde doğa tabanlı müdahaleler mozaiğini entegre
      eden merkezsiz ve çok ölçeklidir. Bina ölçeğinde kuraklığa dayanıklı sedum ve geçirgen substrat ile dikilmiş geniş yeşil
      çatılar yağışın yüzde yetmişine kadarını tutar, terleme-buharlaşma yoluyla bina kabuklarını soğutur ve kentsel ısı adası
      etkisini önemli ölçüde azaltır. Sokak ölçeğinde standart beton kaldırımlar su yeraltı su seviyelerine sızmadan önce
      ağır metalleri ve petrol hidrokarbonlarını fitoremediasyon yoluyla filtreleyen tasarlanmış biyolojik hendekler, yağmur
      bahçeleri ve geçirgen asfalt kaplamalarla değiştirilir. Mahalle ölçeğinde beton tutma havzaları aşırı yağmur olayları
      sırasında zararsız bir şekilde sular altında kalacak şekilde tasarlanmış teraslı halk parkları ve batık spor alanlarıyla
      değiştirilir; güvenli bir şekilde boşalmadan önce geçici tutma gölleri olarak işlev görür.
  - paragraph_index: 5
    title: Hydrodynamic Modeling and Digital Twins
    content_en: Underpinning modern sponge city engineering is sophisticated hydrodynamic computational modeling and urban
      digital twins. Hydraulic engineers deploy high-resolution LiDAR laser scanning to construct three-dimensional digital
      elevation models (DEMs) of urban topographies down to sub-centimeter accuracy. These physical models are coupled with
      two-dimensional shallow water Saint-Venant hydrodynamic equations and real-time precipitation radar telemetry. Utilizing
      powerful graphics processing units (GPUs), computational platforms simulate urban overland water flow pathways in real
      time, identifying micro-topographical choke points, projecting exact water depths across every street intersection,
      and dynamically actuating automated smart storm gates and retention sluices to optimize watershed retention capacity
      during live cloudburst events. Advanced numerical weather prediction models coupled with distributed stormwater sensor
      arrays enable smart retention networks to drain detention ponds proactively hours before a cloudburst arrives.
    content_tr: Modern sünger şehir mühendisliğinin temelini sofistike hidrodinamik hesaplamalı modelleme ve kentsel dijital
      ikizler oluşturur. Hidrolik mühendisleri kentsel topografilerin santimetre altı hassasiyete kadar üç boyutlu dijital
      yükseklik modellerini (DEM'ler) oluşturmak için yüksek çözünürlüklü LiDAR lazer taramasını kullanırlar. Bu fiziksel
      modeller iki boyutlu sığ su Saint-Venant hidrodinamik denklemleri ve gerçek zamanlı yağış radarı telemetrisi ile birleştirilir.
      Güçlü grafik işlem birimlerini (GPU'lar) kullanan hesaplamalı platformlar kentsel yüzey suyu akış yollarını gerçek zamanlı
      olarak simüle eder; mikro topografik tıkanma noktalarını belirler, her sokak kavşağındaki kesin su derinliklerini tahmin
      eder ve canlı bulut patlaması olayları sırasında su havzası tutma kapasitesini optimize etmek için otomatik akıllı fırtına
      kapılarını ve tutma bentlerini dinamik olarak çalıştırır.
  - paragraph_index: 6
    title: 'Coastal Megacity Vulnerability: Compound Flooding'
    content_en: The hydrological challenges confronting urban civilization reach their apex in coastal megacities—such as
      New York, Tokyo, Mumbai, and Jakarta. Coastal metropolises confront the deadly synergistic hazard known as 'compound
      flooding'. Compound flooding occurs when extreme oceanic storm surges driven by tropical typhoons collide simultaneously
      with torrential inland pluvial precipitation at high astronomical tide. Under compound conditions, swollen rivers cannot
      discharge into the sea because high oceanic tides back up through storm outfalls, submerging coastal districts beneath
      brackish water. Accelerating thermal expansion of the oceans and polar ice sheet disintegration guarantee that global
      mean sea levels will rise significantly over the coming century, transforming once-in-a-century storm surge catastrophes
      into routine high-tide occurrences. In megacities like Tokyo, immense underground hydraulic caverns—such as the Metropolitan
      Area Outer Underground Discharge Channel—stand as awe-inspiring subterranean cathedrals designed to store excess typhoon
      runoff.
    content_tr: Kentsel uygarlığın karşı karşıya olduğu hidrolojik zorluklar New York, Tokyo, Mumbai ve Cakarta gibi kıyı
      mega kentlerinde zirveye ulaşır. Kıyı metropolleri 'bileşik taşkın' olarak bilinen ölümcül sinerjik tehlikeyle karşı
      karşıyadır. Bileşik taşkın tropikal tayfunların yönlendirdiği aşırı okyanus fırtına dalgalanmalarının yüksek astronomik
      gelgitte şiddetli iç yağmur suyu yağışıyla aynı anda çarpışması durumunda meydana gelir. Bileşik koşullar altında kabaran
      nehirler denize dökülemez; çünkü yüksek okyanus gelgitleri fırtına çıkışlarından geri teper ve kıyı bölgelerini acı
      su altında bırakır. Okyanusların hızlanan termal genleşmesi ve kutup buz tabakasının parçalanması küresel ortalama deniz
      seviyelerinin önümüzdeki yüzyılda önemli ölçüde yükseleceğini garanti etmekte ve yüzyılda bir görülen fırtına dalgalanması
      felaketlerini rutin yüksek gelgit olaylarına dönüştürmektedir.
  - paragraph_index: 7
    title: 'Dynamic Sea Defenses: The Thames and Oosterscheldekering'
    content_en: 'Defending coastal populations against compound surges requires monumental hydrodynamic barriers capable of
      managing oceanic energy while preserving maritime ecology. The historical paradigm of permanent static sea dikes—which
      sever coastal cities from marine habitats and require ever-higher concrete walls—has been superseded by dynamic surge
      barriers. The Thames Barrier in London utilizes massive rotating steel hollow gates that rest on the riverbed during
      normal tidal flows, allowing free maritime navigation, and rotate upward into rigid defensive walls when storm surges
      threaten the capital. Even more monumental is the Dutch Oosterscheldekering storm surge barrier: a nine-kilometer dam
      equipped with sixty-two massive sliding steel gates that remain open to sustain vital saltwater tidal ecology, closing
      only during acute North Sea hurricane surges. The Dutch ''Room for the River'' national engineering program represents
      a paradigm shift, deliberately lowering dikes and restoring natural floodplains to give water space to expand safely
      during peak flows.'
    content_tr: 'Kıyı popülasyonlarını bileşik dalgalanmalara karşı savunmak deniz ekolojisini korurken okyanus enerjisini
      yönetebilen anıtsal hidrodinamik bariyerler gerektirir. Kıyı kentlerini deniz habitatlarından ayıran ve sürekli daha
      yüksek beton duvarlar gerektiren kalıcı statik deniz setlerinin tarihsel paradigmasının yerini dinamik dalgalanma bariyerleri
      almıştır. Londra''daki Thames Bariyeri normal gelgit akışları sırasında nehir yatağında duran, serbest deniz seyrüseferine
      izin veren ve fırtına dalgalanmaları başkenti tehdit ettiğinde yukarı doğru dönerek katı savunma duvarlarına dönüşen
      devasa dönen çelik içi boş kapılar kullanır. Daha da anıtsal olanı Hollanda Oosterscheldekering fırtına dalgalanması
      bariyeridir: hayati tuzlu su gelgit ekolojisini sürdürmek için açık kalan ve yalnızca akut Kuzey Denizi kasırga dalgalanmaları
      sırasında kapanan altmış iki devasa kayar çelik kapıyla donatılmış dokuz kilometrelik bir baraj.'
  - paragraph_index: 8
    title: Managed Retreat and the Ethics of Climate Realism
    content_en: 'Despite the extraordinary achievements of hydrodynamic engineering, climate scientists and ecological economists
      warn that physical barriers cannot indefinitely protect low-lying, subsiding urban geographies against irreversible
      multi-meter sea level rise. In cities like Jakarta, where hyper-extraction of groundwater has caused the land to subside
      by up to twenty-five centimeters annually, the Indonesian government took the historic geopolitical step of abandoning
      the coastal metropolis, constructing a new capital city, Nusantara, in the highlands of Borneo. For coastal communities
      worldwide, urban resilience must ultimately embrace the painful, taboo strategy of ''managed retreat'': systematically
      decommissioning vulnerable coastal infrastructure, compensating homeowners to relocate inland, and restoring coastal
      salt marshes and mangrove forests to function as protective natural storm buffers. Managed retreat policies in vulnerable
      low-lying coastal zones must be conducted with rigorous social equity, ensuring that lower-income residents receive
      adequate economic compensation and relocation assistance.'
    content_tr: 'Hidrodinamik mühendisliğinin olağanüstü başarılarına rağmen iklim bilimcileri ve ekolojik iktisatçılar fiziksel
      bariyerlerin alçak, çöken kentsel coğrafyaları geri döndürülemez çok metrelik deniz seviyesi yükselmesine karşı süresiz
      olarak koruyamayacağı konusunda uyarmaktadır. Yeraltı suyunun aşırı çekilmesinin arazinin yılda yirmi beş santimetreye
      kadar çökmesine neden olduğu Cakarta gibi şehirlerde Endonezya hükümeti kıyı metropolünü terk ederek Borneo dağlarında
      yeni bir başkent olan Nusantara''yı inşa etme yönünde tarihi bir jeopolitik adım attı. Dünya çapındaki kıyı toplulukları
      için kentsel dayanıklılık nihayetinde ''yönetilen geri çekilme'' gibi acı verici, tabu stratejiyi benimsemelidir: savunmasız
      kıyı altyapısını sistematik olarak devre dışı bırakmak, ev sahiplerini iç kısımlara taşınmaları için tazmin etmek ve
      koruyucu doğal fırtına tamponları olarak işlev görmesi için kıyı tuz bataklıklarını ve mangrov ormanlarını restore etmek.'
  - paragraph_index: 9
    title: 'Conclusion: Re-Weaving the Urban Ecological Fabric'
    content_en: The hydrological transformation of modern cities represents the ultimate test of human civilization's capacity
      for ecological co-existence. The nineteenth-century dream of total technological dominion over nature—paving over rivers,
      conquering marshes, and walling off the seas—has collapsed under the inescapable biophysical laws of a changing planetary
      climate. Sponge cities and hydrodynamic resilience demonstrate that true engineering brilliance consists not in dominating
      natural water cycles through brute concrete force, but in working humbly, creatively, and harmoniously alongside them.
      By welcoming water back into our cities as an honored ecological partner, humanity can build enduring urban sanctuaries
      that are not only resilient against climatic storms, but verdant, humane, and profoundly beautiful. The sustainable
      cities of the future will not be fortresses waged in permanent warfare against water, but flexible, porous, and regenerative
      living ecosystems that celebrate the life-giving majesty of the hydrological cycle.
    content_tr: Modern şehirlerin hidrolojik dönüşümü insan uygarlığının ekolojik bir arada yaşama kapasitesinin nihai testini
      temsil eder. Doğa üzerinde tam teknolojik hakimiyet yönündeki on dokuzuncu yüzyıl rüyası—nehirleri asfaltlamak, bataklıkları
      fethetmek ve denizleri duvarlarla çevirmek—değişen bir gezegensel iklimin kaçınılmaz biyofiziksel yasaları altında çökmüştür.
      Sünger şehirler ve hidrodinamik dayanıklılık gerçek mühendislik dehasının doğal su döngülerine kaba beton kuvvetiyle
      hükmetmekte değil onlarla mütevazı, yaratıcı ve uyumlu bir şekilde birlikte çalışmakta yattığını göstermektedir. Suyu
      onurlu bir ekolojik ortak olarak şehirlerimize geri kabul ederek insanlık yalnızca iklimsel fırtınalara karşı dayanıklı
      değil aynı zamanda yemyeşil, insani ve derinden güzel olan kalıcı kentsel sığınaklar inşa edebilir.
  vocabulary_annotations:
  - word: impervious
    context_definition_en: Not allowing fluid to pass through; impermeable surfaces in urban design.
    context_meaning_tr: geçirimsiz, su geçirmeyen yüzeyler
  - word: pluvial
    context_definition_en: Relating to or characterized by rainfall, especially surface flooding caused by rain.
    context_meaning_tr: yağmur kaynaklı, yağış suyu taşkını
  - word: phytoremediation
    context_definition_en: The use of living green plants for the removal, degradation, or containment of contaminants.
    context_meaning_tr: fitoremediasyon, bitkilerle toprak ve su arıtımı
  comprehension_questions:
  - id: q_reading_c2_urban-resilience-climate-adaptation-hydrology_01
    question_en: Why has traditional 'grey' concrete stormwater infrastructure failed in the Anthropocene according to Paragraph
      1?
    question_tr_hint: 1. paragrafa göre geleneksel 'gri' beton yağmur suyu altyapısı Antroposen'de neden başarısız olmuştur?
    options:
    - All subterranean concrete pipes have physically transformed into soft liquid rubber.
    - Governments have completely stopped cleaning leaves from roadside drainage grates.
    - Rainwater has become fifty times heavier than it was during the nineteenth century.
    - Climatic warming increases atmospheric moisture capacity by seven percent per degree, overwhelming rigid drains.
    correct_answer: Climatic warming increases atmospheric moisture capacity by seven percent per degree, overwhelming rigid
      drains.
    explanation_en: Paragraph 1 explains Clausius-Clapeyron dynamics supercharge moisture by ~7% per degree, overwhelming
      grey drains.
    explanation_tr: 1. paragraf Clausius-Clapeyron dinamiklerinin nemi derece başına ~%7 artırarak gri drenajları aştığını
      açıklar.
  - id: q_reading_c2_urban-resilience-climate-adaptation-hydrology_02
    question_en: How do hydrological proportions invert in a dense metropolis compared to natural forests in Paragraph 2?
    question_tr_hint: 2. paragrafta doğal ormanlara kıyasla yoğun bir metropolde hidrolojik oranlar nasıl tersine döner?
    options:
    - Cities absorb one hundred percent of rain into drinking water reservoirs immediately.
    - All urban precipitation turns instantly into solid blocks of ice upon landing.
    - Rainwater completely evaporates before touching the surface of the asphalt streets.
    - Infiltration drops below ten percent, while surface runoff surges to over eighty percent across impervious asphalt.
    correct_answer: Infiltration drops below ten percent, while surface runoff surges to over eighty percent across impervious
      asphalt.
    explanation_en: Paragraph 2 details infiltration falls under 10% and runoff surges over 80% due to impervious surfaces.
    explanation_tr: 2. paragraf geçirimsiz yüzeyler nedeniyle sızmanın %10 altına düştüğünü, akışın ise %80'i aştığını açıklar.
  - id: q_reading_c2_urban-resilience-climate-adaptation-hydrology_03
    question_en: What core philosophy distinguishes the 'Sponge City' model pioneered by Yu Kongjian in Paragraph 3?
    question_tr_hint: 3. paragrafta Yu Kongjian öncülüğündeki 'Sünger Şehir' modelini hangi temel felsefe ayırt eder?
    options:
    - Paving every city park and garden with thick waterproof synthetic rubber sheeting.
    - Mandating that every citizen carry a physical handheld sponge during heavy rainstorms.
    - Treating stormwater as a precious ecological resource to be absorbed, stored, and filtered within urban ecosystems.
    - Pumping all municipal rainwater directly into deep underground volcanic lava tubes.
    correct_answer: Treating stormwater as a precious ecological resource to be absorbed, stored, and filtered within urban
      ecosystems.
    explanation_en: Paragraph 3 explains sponge cities engineer green-blue infrastructure to absorb, store, and purify water
      as a resource.
    explanation_tr: 3. paragraf sünger şehirlerin suyu bir kaynak olarak emmek, depolamak ve arıtmak için yeşil-mavi altyapı
      kurduğunu açıklar.
  - id: q_reading_c2_urban-resilience-climate-adaptation-hydrology_04
    question_en: What dangerous phenomenon is termed 'compound flooding' in coastal megacities according to Paragraph 6?
    question_tr_hint: 6. paragrafa göre kıyı mega kentlerinde hangi tehlikeli olgu 'bileşik taşkın' olarak adlandırılır?
    options:
    - Chemical factory waste mixing with treated tap water inside municipal delivery pipelines.
    - Rainwater and saltwater evaporating simultaneously into dense atmospheric fog clouds.
    - Typhoon storm surges colliding with torrential inland rainfall at high astronomical tide, blocking river drainage.
    - Two commercial cargo ships accidentally crashing into a coastal concrete breakwater.
    correct_answer: Typhoon storm surges colliding with torrential inland rainfall at high astronomical tide, blocking river
      drainage.
    explanation_en: Paragraph 6 defines compound flooding as oceanic storm surges colliding with torrential inland rainfall
      at high tide.
    explanation_tr: 6. paragraf bileşik taşkını fırtına dalgası ile iç kesim yağışının yüksek gelgitte çarpışması olarak tanımlar.
  - id: q_reading_c2_urban-resilience-climate-adaptation-hydrology_05
    question_en: What radical geopolitical decision did the Indonesian government make regarding Jakarta in Paragraph 8?
    question_tr_hint: 8. paragrafta Endonezya hükümeti Cakarta ile ilgili hangi radikal jeopolitik kararı aldı?
    options:
    - Ordered the physical demolition of every residential building located near sea level.
    - Surrounded the entire city with a continuous sixty-meter-high concrete fortress wall.
    - Abandoned the sinking coastal metropolis to construct a new capital city, Nusantara, in the Borneo highlands.
    - Banned all human beings from drinking freshwater inside the municipal city limits.
    correct_answer: Abandoned the sinking coastal metropolis to construct a new capital city, Nusantara, in the Borneo highlands.
    explanation_en: Paragraph 8 explains Indonesia is constructing a new capital, Nusantara, in Borneo to retreat from sinking
      Jakarta.
    explanation_tr: 8. paragraf Endonezya'nın batan Cakarta'dan kaçmak için Borneo'da Nusantara adında yeni bir başkent kurduğunu
      açıklar.
