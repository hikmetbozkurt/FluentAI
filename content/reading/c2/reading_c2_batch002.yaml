- id: reading.c2.corporate-governance-stakeholder-capitalism
  title: Shareholder Primacy, Stakeholder Capitalism, and the Dialectic of Corporate Purpose
  cefr_level: C2
  category: business_strategy
  summary_en: Examining Milton Friedman's shareholder value doctrine, the Business Roundtable pivot, ESG metrics, greenwashing
    controversies, and fiduciary duty reform.
  summary_tr: Milton Friedman'ın hissedar değeri doktrini, Business Roundtable eksen kayması, ESG metrikleri, yeşil aklama
    tartışmaları ve vekalet görevi reformunun incelenmesi.
  word_count: 1335
  estimated_reading_minutes: 7
  paragraphs:
  - paragraph_index: 1
    title: 'The Orthodoxy: Milton Friedman and Shareholder Primacy'
    content_en: 'In September 1970, Nobel laureate economist Milton Friedman published an incendiary essay in The New York
      Times Magazine titled ''The Social Responsibility of Business is to Increase its Profits'', establishing an intellectual
      doctrine that would define corporate governance for over half a century. Friedman posited an uncompromising normative
      thesis: corporate executives are employees of the firm''s legal equity shareholders, and their exclusive fiduciary responsibility
      is to maximize financial returns within the basic rules of society. Friedman vehemently argued that corporate leaders
      who deployed shareholder capital to pursue social objectives—such as environmental remediation, community philanthropy,
      or below-market pricing—were essentially imposing an illegitimate private tax and usurping the democratic functions
      of elected governments. This shareholder primacy model, subsequently codified by Michael Jensen and William Meckling
      through agency theory and executive stock option compensation, became the unassailable orthodoxy of Anglo-American corporate
      law. The Friedmanite doctrine drew powerful intellectual sustenance from Adam Smith''s famous invisible hand metaphor,
      arguing that decentralized market competition naturally converts private self-interest into public wealth.'
    content_tr: 'Eylül 1970''te Nobel ödüllü iktisatçı Milton Friedman The New York Times Magazine''de ''İş Dünyasının Sosyal
      Sorumluluğu Karlarını Artırmaktır'' başlıklı kışkırtıcı bir makale yayınlayarak yarım yüzyıldan fazla bir süre boyunca
      kurumsal yönetişimi tanımlayacak entelektüel bir doktrin kurdu. Friedman tavizsiz bir normatif tez ortaya koydu: kurumsal
      yöneticiler şirketin yasal hisse senedi sahiplerinin çalışanlarıdır ve münhasır vekalet sorumlulukları toplumun temel
      kuralları dahilinde finansal getirileri en üst düzeye çıkarmaktır. Friedman hissedar sermayesini çevresel iyileştirme,
      topluluk hayırseverliği veya piyasa altı fiyatlandırma gibi sosyal hedefleri takip etmek için kullanan kurumsal liderlerin
      esasen gayrimeşru bir özel vergi koyduğunu ve seçilmiş hükümetlerin demokratik işlevlerini gasp ettiğini şiddetle savundu.
      Daha sonra Michael Jensen ve William Meckling tarafından vekillik teorisi ve yönetici hisse senedi opsiyonu tazminatı
      yoluyla kodlanan bu hissedar önceliği modeli Anglo-Amerikan şirketler hukukunun sarsılmaz ortodoksisi haline geldi.'
  - paragraph_index: 2
    title: 'The Costs of Financialization: Short-Termism and Externalities'
    content_en: 'Over the ensuing four decades, the relentless institutionalization of shareholder primacy transformed the
      operational behavior of global corporations. Guided by executive compensation packages indexed almost exclusively to
      short-term share price performance, corporate management embraced quarterly capitalism. Long-term research and development
      budgets, capital intensive equipment upgrades, and employee pension commitments were ruthlessly pruned to fund debt-fueled
      share buybacks and aggressive dividend distributions designed to engineer artificial earnings-per-share spikes. Simultaneously,
      shareholder primacy incentivized corporations to externalize environmental and social costs with impunity: dumping toxic
      effluents into unpriced public waterways, exploiting precarious subcontracted labor across deregulated global supply
      chains, and lobbying aggressively against public interest environmental regulations to protect short-term corporate
      margins. Financial economists celebrated this regime as the era of ''maximizing shareholder value'', yet it led to systemic
      corporate under-investment in human capital, employee training, and community relations.'
    content_tr: 'Bunu takip eden kırk yıl boyunca hissedar önceliğinin amansız kurumsallaşması küresel şirketlerin operasyonel
      davranışlarını dönüştürdü. Neredeyse münhasıran kısa vadeli hisse senedi fiyatı performansına endeksli yönetici tazminat
      paketleriyle yönlendirilen kurumsal yönetim üç aylık kapitalizmi benimsedi. Uzun vadeli araştırma ve geliştirme bütçeleri,
      sermaye yoğun ekipman yükseltmeleri ve çalışan emeklilik taahhütleri yapay hisse başına kazanç artışları tasarlamak
      için tasarlanmış borçla finanse edilen hisse geri alımlarını ve agresif temettü dağıtımlarını finanse etmek için acımasızca
      budandı. Eşzamanlı olarak hissedar önceliği şirketlerin çevresel ve sosyal maliyetleri cezasız bir şekilde dışsallaştırmasını
      teşvik etti: toksik atıkları fiyatlandırılmamış kamusal su yollarına dökmek, kuralsızlaştırılmış küresel tedarik zincirleri
      genelinde güvencesiz taşeron emeğini sömürmek ve kısa vadeli kurumsal marjları korumak için kamu yararına çevresel düzenlemelere
      karşı agresif bir şekilde lobi yapmak.'
  - paragraph_index: 3
    title: 'The Stakeholder Revolt: The 2019 Business Roundtable Pivot'
    content_en: 'Mounting societal crises—skyrocketing wealth inequality, ecological degradation, systemic climate risk, and
      growing populist hostility toward corporate power—precipitated an extraordinary institutional rebellion from within
      the corporate establishment itself. In August 2019, the Business Roundtable—the premier association of chief executive
      officers of America''s leading corporations, chaired by JPMorgan Chase CEO Jamie Dimon—issued a historic, unanimous
      ''Statement on the Purpose of a Corporation''. The landmark declaration explicitly repudiated the half-century doctrine
      of shareholder primacy. Instead, the 181 signatory corporate leaders pledged a fundamental commitment to all corporate
      stakeholders: delivering value to customers, investing in employees through fair compensation and comprehensive training,
      dealing fairly and ethically with suppliers, supporting local communities, and protecting the environment for future
      generations. The dramatic 2019 pivot was also driven by corporate recruitment realities: elite university graduates
      increasingly refused to work for corporations with abysmal environmental records or unethical practices.'
    content_tr: 'Tırmanan toplumsal krizler—fırlayan servet eşitsizliği, ekolojik bozulma, sistemik iklim riski ve kurumsal
      güce yönelik artan popülist düşmanlık—bizzat kurumsal düzenin içinden olağanüstü bir kurumsal isyana yol açtı. Ağustos
      2019''da JPMorgan Chase CEO''su Jamie Dimon başkanlığındaki Amerika''nın önde gelen şirketlerinin icra kurulu başkanlarının
      önde gelen derneği olan Business Roundtable ''Bir Şirketin Amacına İlişkin Açıklama'' başlıklı tarihi, oybirliğiyle
      alınmış bir bildiri yayınladı. Dönüm noktası niteliğindeki bildiri yarım asırlık hissedar önceliği doktrinini açıkça
      reddetti. Bunun yerine 181 imzacı kurumsal lider tüm kurumsal paydaşlara temel bir taahhütte bulundu: müşterilere değer
      sunmak, adil tazminat ve kapsamlı eğitim yoluyla çalışanlara yatırım yapmak, tedarikçilerle adil ve etik bir şekilde
      ilgilenmek, yerel toplulukları desteklemek ve gelecek nesiller için çevreyi korumak.'
  - paragraph_index: 4
    title: 'Theoretical Foundations: Freeman''s Stakeholder Theory'
    content_en: 'This ideological transformation represents the mainstream corporate codification of ''stakeholder theory'',
      pioneered in 1984 by business philosopher R. Edward Freeman. Freeman argued that a corporation is not merely a private
      nexus of financial contracts belonging exclusively to legal shareholders; rather, it is a complex social institution
      embedded within a web of reciprocal moral relationships. A firm cannot create durable economic value in isolation: it
      depends intimately upon the public infrastructure funded by taxpayers, the specialized skills and physical health of
      employees, the reliability of supply chain vendors, and the social license to operate granted by host communities. Freeman
      demonstrated that treating non-shareholder constituents as disposable instruments ultimately destroys the firm''s long-term
      enterprise value, arguing that sustainable profitability is an emergent property of nurturing a flourishing, harmonious
      stakeholder ecosystem. In Freeman''s formulation, managing for stakeholders involves generating continuous synergies
      where the interests of employees, suppliers, and communities are aligned rather than treated as a zero-sum trade-off.'
    content_tr: 'Bu ideolojik dönüşüm 1984 yılında işletme felsefecisi R. Edward Freeman tarafından öncülük edilen ''paydaş
      teorisinin'' ana akım kurumsal kodlamasını temsil eder. Freeman bir şirketin yalnızca yasal hissedarlara ait özel bir
      finansal sözleşmeler bağı olmadığını; daha ziyade karşılıklı ahlaki ilişkiler ağı içine yerleştirilmiş karmaşık bir
      sosyal kurum olduğunu savundu. Bir firma tek başına kalıcı ekonomik değer yaratamaz: vergi mükellefleri tarafından finanse
      edilen kamu altyapısına, çalışanların özel becerilerine ve fiziksel sağlığına, tedarik zinciri satıcılarının güvenilirliğine
      ve ev sahibi topluluklar tarafından verilen faaliyet gösterme sosyal lisansına yakından bağlıdır. Freeman hissedar olmayan
      bileşenlere tek kullanımlık araçlar gibi davranmanın nihayetinde firmanın uzun vadeli işletme değerini yok ettiğini
      göstererek sürdürülebilir karlılığın gelişen, uyumlu bir paydaş ekosistemini beslemenin ortaya çıkan bir özelliği olduğunu
      savundu.'
  - paragraph_index: 5
    title: The Institutionalization of ESG Metrics
    content_en: To translate abstract stakeholder ideals into concrete corporate performance benchmarks, the global financial
      asset management industry championed the framework of Environmental, Social, and Governance (ESG) investing. Spearheaded
      by global institutional investors like BlackRock, Vanguard, and European sovereign pension funds managing tens of trillions
      of dollars in assets under management, ESG frameworks mandate that companies disclose quantitative metrics across non-financial
      risk vectors. Environmental metrics track carbon intensity, water usage, and biodiversity impacts; social metrics evaluate
      workforce diversity, human rights audits in supply chains, and labor safety protocols; governance metrics assess executive
      board independence, shareholder voting rights, and anti-corruption compliance. Asset allocators argue that robust ESG
      performance is directly correlated with superior operational resilience, cost-of-capital reductions, and lower systemic
      default risk. Third-party ESG rating agencies deploy specialized natural language processing algorithms to comb through
      corporate public filings, news media, and satellite imagery to calculate real-time sustainability scores.
    content_tr: Soyut paydaş ideallerini somut kurumsal performans kıyaslamalarına dönüştürmek için küresel finansal varlık
      yönetimi endüstrisi Çevresel, Sosyal ve Yönetişim (ESG) yatırımı çerçevesini savundu. BlackRock, Vanguard gibi küresel
      kurumsal yatırımcılar ve yönetim altındaki on trilyonlarca dolarlık varlığı yöneten Avrupa egemen emeklilik fonları
      tarafından yönetilen ESG çerçeveleri şirketlerin finansal olmayan risk vektörleri genelinde nicel metrikleri açıklamasını
      zorunlu kılar. Çevresel metrikler karbon yoğunluğunu, su kullanımını ve biyoçeşitlilik etkilerini izler; sosyal metrikler
      işgücü çeşitliliğini, tedarik zincirlerindeki insan hakları denetimlerini ve iş güvenliği protokollerini değerlendirir;
      yönetişim metrikleri icra kurulu bağımsızlığını, hissedar oy haklarını ve yolsuzlukla mücadele uyumunu değerlendirir.
      Varlık tahsisçileri güçlü ESG performansının doğrudan üstün operasyonel dayanıklılık, sermaye maliyeti düşüşleri ve
      daha düşük sistemik temerrüt riski ile ilişkili olduğunu savunmaktadır.
  - paragraph_index: 6
    title: 'The Cynical Reality: Greenwashing and Purpose Washing'
    content_en: 'Despite the lofty rhetoric of stakeholder capitalism, critical investigative audits reveal a pervasive chasm
      between corporate declarations and actual operational conduct. Sociological researchers term this phenomenon ''purpose
      washing'' or ''greenwashing''. In an exhaustive empirical study examining corporations whose CEOs signed the 2019 Business
      Roundtable statement, Harvard Law professors Lucian Bebchuk and Roberto Tallarita discovered that signatory companies
      failed to enact meaningful governance reforms: not a single company amended its corporate bylaws to elevate stakeholder
      rights over shareholder interests, and signatory firms were just as likely to execute mass employee layoffs during the
      pandemic and lobby against climate legislation as non-signatory peers. For many corporations, ESG statements functioned
      merely as public relations shields designed to preempt binding government regulation while preserving business-as-usual
      shareholder wealth extraction. Critical investigative journalists documented numerous instances where multinational
      energy conglomerates advertised multi-million-dollar clean energy initiatives while devoting less than three percent
      of capital expenditures to renewables.'
    content_tr: 'Paydaş kapitalizminin yüce söylemine rağmen eleştirel araştırmacı denetimler kurumsal beyanlar ile fiili
      operasyonel davranış arasında yaygın bir uçurum olduğunu ortaya koymaktadır. Sosyolojik araştırmacılar bu olguyu ''amaç
      aklama'' veya ''yeşil aklama'' olarak adlandırmaktadır. CEO''ları 2019 Business Roundtable bildirisini imzalayan şirketleri
      inceleyen kapsamlı bir ampirik çalışmada Harvard Hukuk profesörleri Lucian Bebchuk ve Roberto Tallarita imzacı şirketlerin
      anlamlı yönetişim reformları gerçekleştiremediğini keşfettiler: tek bir şirket bile paydaş haklarını hissedar çıkarlarının
      üzerine çıkarmak için şirket ana sözleşmesini değiştirmedi ve imzacı firmalar pandemi sırasında kitlesel çalışan işten
      çıkarmaları yürütme ve iklim mevzuatına karşı lobi yapma konusunda imzacı olmayan akranları kadar olasıydı. Birçok şirket
      için ESG beyanları bağlayıcı hükümet düzenlemelerini önlemek ve her zamanki gibi hissedar serveti çıkarımını korumak
      için tasarlanmış halkla ilişkiler kalkanları olarak işlev gördü.'
  - paragraph_index: 7
    title: The Political Backlash and Anti-ESG Weaponization
    content_en: Simultaneously, the institutionalization of ESG criteria ignited a ferocious political and ideological backlash
      across major Western economies. Conservative political leaders, particularly in fossil-fuel-producing American states,
      weaponized the term 'woke capitalism', accusing large asset managers of forming an ideological cartel to starve conventional
      energy producers of capital and bypass democratic legislative processes. State legislatures passed punitive statutes
      prohibiting state public pension funds from investing with financial institutions that boycott fossil fuel or firearm
      manufacturers, while right-leaning legal scholars challenged ESG mandates as breaches of institutional fiduciaries'
      legal duties to maximize raw monetary returns. This bitter politicization has forced institutional asset managers into
      tactical retreat, prompting them to rebrand ESG initiatives under the politically neutral terminology of 'material financial
      risk management'. Several conservative state treasurers retaliated by divesting billions of dollars in state municipal
      pension assets from Wall Street asset management firms that promoted ESG investment criteria.
    content_tr: Eşzamanlı olarak ESG kriterlerinin kurumsallaşması büyük Batı ekonomilerinde şiddetli bir siyasi ve ideolojik
      tepkiyi ateşledi. Özellikle fosil yakıt üreten Amerikan eyaletlerindeki muhafazakar siyasi liderler 'uyanık kapitalizm'
      terimini silah haline getirerek büyük varlık yöneticilerini geleneksel enerji üreticilerini sermayeden mahrum bırakmak
      ve demokratik yasama süreçlerini atlamak için ideolojik bir kartel oluşturmakla suçladılar. Eyalet yasama meclisleri
      eyalet kamu emeklilik fonlarının fosil yakıt veya ateşli silah üreticilerini boykot eden finansal kuruluşlara yatırım
      yapmasını yasaklayan cezai yasalar çıkarırken sağ eğilimli hukukçular ESG zorunluluklarını kurumsal vekillerin ham parasal
      getirileri en üst düzeye çıkarma yönündeki yasal görevlerinin ihlali olarak nitelendirdi. Bu acı siyasallaşma kurumsal
      varlık yöneticilerini taktiksel bir geri çekilmeye zorlayarak onları ESG girişimlerini 'maddi finansal risk yönetimi'
      gibi politik olarak tarafsız bir terminoloji altında yeniden markalamaya sevk etti.
  - paragraph_index: 8
    title: 'Legal Structural Reform: Benefit Corporations and Fiduciary Redefinition'
    content_en: Corporate governance scholars argue that genuine stakeholder capitalism cannot exist through voluntary corporate
      pledges or market-driven ESG ratings; it requires foundational statutory reform of corporate law itself. Under traditional
      corporate statutory frameworks in jurisdictions like Delaware, corporate boards face legal liability in derivative shareholder
      lawsuits if they deliberately sacrifice shareholder profits to benefit social constituents. To dismantle this legal
      barrier, legal reformers have created alternative statutory corporate entities known as Public Benefit Corporations
      (B-Corps). In a Benefit Corporation, the corporate charter legally obligates directors to balance shareholder pecuniary
      interests with specific public benefits and non-financial stakeholder well-being. Furthermore, the European Union's
      Corporate Sustainability Due Diligence Directive (CSDDD) legally mandates that large corporations audit their global
      supply chains for environmental harm and human rights abuses, enforcing statutory liability for corporate negligence.
      Legislative pioneers in European capitals have also mandated employee representation on corporate supervisory boards,
      institutionalizing worker voice in strategic corporate capital allocation decisions.
    content_tr: Kurumsal yönetişim akademisyenleri gerçek paydaş kapitalizminin gönüllü kurumsal taahhütler veya piyasa odaklı
      ESG derecelendirmeleri yoluyla var olamayacağını; şirketler hukukunun bizzat temel yasal reformunu gerektirdiğini savunmaktadır.
      Delaware gibi yargı alanlarındaki geleneksel kurumsal yasal çerçeveler altında kurumsal yönetim kurulları sosyal bileşenlere
      fayda sağlamak için hissedar karlarını kasıtlı olarak feda ederlerse türev hissedar davalarında yasal sorumlulukla karşı
      karşıya kalırlar. Bu yasal engeli ortadan kaldırmak için yasal reformcular Kamu Yararı Şirketleri (B-Corp'lar) olarak
      bilinen alternatif yasal kurumsal kuruluşlar oluşturdular. Bir Yarar Şirketinde şirket ana sözleşmesi yöneticileri hissedarların
      parasal çıkarlarını belirli kamu yararları ve finansal olmayan paydaş refahı ile dengelemekle yasal olarak yükümlü kılar.
      Dahası Avrupa Birliği'nin Kurumsal Sürdürülebilirlik Durum Tespiti Direktifi (CSDDD) büyük şirketlerin küresel tedarik
      zincirlerini çevresel zararlar ve insan hakları ihlalleri açısından denetlemelerini yasal olarak zorunlu kılarak kurumsal
      ihmal için yasal sorumluluk uygulamaktadır.
  - paragraph_index: 9
    title: 'Conclusion: Re-Imagining the Moral Soul of the Enterprise'
    content_en: The struggle between shareholder primacy and stakeholder capitalism is not merely an arcane technical debate
      over corporate proxy voting mechanisms or accounting standards; it reflects a foundational contest over the moral architecture
      of human civilization. The corporation is the most formidable wealth-generating and resource-transforming institution
      ever conceived by humanity. If it remains shackled to the myopic idol of short-term quarterly profit extraction, it
      will accelerate planetary ecological tipping points and fracture democratic cohesion. Conversely, if corporate law and
      financial institutions successfully re-anchor the enterprise in its foundational democratic purpose—harnessing innovation,
      capital, and collective labor to advance human flourishing and ecological harmony—the modern corporation can fulfill
      its highest potential as an indispensable engine of a just, sustainable, and enduring society. Reclaiming the social
      purpose of business is ultimately an effort to ensure that the formidable engine of free enterprise serves the enduring
      flourishment of all humanity.
    content_tr: Hissedar önceliği ile paydaş kapitalizmi arasındaki mücadele yalnızca kurumsal vekaleten oy kullanma mekanizmaları
      veya muhasebe standartları üzerine gizemli teknik bir tartışma değildir; insan uygarlığının ahlaki mimarisi üzerine
      temel bir mücadeleyi yansıtır. Şirket insanlık tarafından tasarlanmış en zorlu zenginlik üreten ve kaynak dönüştüren
      kurumdur. Kısa vadeli üç aylık kar çıkarımının miyop putuna zincirlenmiş kalırsa gezegensel ekolojik kırılma noktalarını
      hızlandıracak ve demokratik uyumu parçalayacaktır. Aksine şirketler hukuku ve finansal kurumlar şirketi temel demokratik
      amacına—insani gelişmeyi ve ekolojik uyumu ilerletmek için inovasyonu, sermayeyi ve kolektif emeği kullanmaya—başarıyla
      yeniden bağlarsa modern şirket adil, sürdürülebilir ve kalıcı bir toplumun vazgeçilmez bir motoru olarak en yüksek potansiyelini
      gerçekleştirebilir.
  vocabulary_annotations:
  - word: fiduciary
    context_definition_en: Involving trust, especially with regard to the relationship between a trustee and a beneficiary.
    context_meaning_tr: vekalet niteliğinde, güvene dayalı yasal sorumluluk
  - word: orthodoxy
    context_definition_en: Authorized or generally accepted theory, doctrine, or practice.
    context_meaning_tr: ortodoksi, genel kabul görmüş yerleşik öğreti
  - word: greenwashing
    context_definition_en: Misleading information disseminated by an organization to present an environmentally responsible
      image.
    context_meaning_tr: yeşil aklama, çevreci görünerek aldatma
  comprehension_questions:
  - id: q_reading_c2_corporate-governance-stakeholder-capitalism_01
    question_en: What core thesis did Milton Friedman advance in his 1970 essay according to Paragraph 1?
    question_tr_hint: 1. paragrafa göre Milton Friedman 1970 tarihli makalesinde hangi temel tezi ileri sürmüştür?
    options:
    - Corporate executives have a sole fiduciary responsibility to maximize profits for legal equity shareholders.
    - Corporate CEOs should be appointed directly by the United Nations General Assembly.
    - Corporations must donate one hundred percent of their annual profits to global charities.
    - Companies should legally abolish all prices and distribute products free of charge.
    correct_answer: Corporate executives have a sole fiduciary responsibility to maximize profits for legal equity shareholders.
    explanation_en: Paragraph 1 explains Friedman argued executives are agents of shareholders whose sole duty is profit maximization.
    explanation_tr: 1. paragraf Friedman'ın yöneticilerin tek görevinin hissedar karlarını maksimize etmek olduğunu savunduğunu
      açıklar.
  - id: q_reading_c2_corporate-governance-stakeholder-capitalism_02
    question_en: How did shareholder primacy drive corporate short-termism and environmental externalization in Paragraph
      2?
    question_tr_hint: 2. paragrafta hissedar önceliği kurumsal kısa vadeciliği ve çevresel dışsallaştırmayı nasıl körüklemiştir?
    options:
    - It forced corporate managers to work eighty hours per week inside physical manufacturing factories.
    - Compensation indexed to quarterly share prices incentivized buybacks and slashing R&D while dumping pollution without
      cost.
    - It prevented corporations from purchasing commercial fire insurance policies.
    - It banned companies from using digital electronic computers for accounting operations.
    correct_answer: Compensation indexed to quarterly share prices incentivized buybacks and slashing R&D while dumping pollution
      without cost.
    explanation_en: Paragraph 2 details how quarterly stock compensation drove share buybacks, R&D cuts, and unpriced pollution.
    explanation_tr: 2. paragraf üç aylık hisse primi tazminatının hisse geri alımlarını, Ar-Ge kesintilerini ve kirliliği
