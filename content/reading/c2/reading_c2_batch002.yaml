- id: reading.c2.neurotechnology-cognitive-liberty-ethics
  title: Neurotechnology, Brain-Computer Interfaces, and the Jurisprudence of Cognitive Liberty
  cefr_level: C2
  category: technology
  summary_en: Examining the bioethical and legal dilemmas posed by advanced neural decoding, neural data commodification,
    and the emerging human right to mental privacy.
  summary_tr: Gelişmiş sinirsel kod çözme, sinirsel verilerin metalaştırılması ve ortaya çıkan zihinsel mahremiyet insan hakkının
    yarattığı biyoetik ve yasal ikilemlerin incelenmesi.
  word_count: 1242
  estimated_reading_minutes: 6
  paragraphs:
  - paragraph_index: 1
    title: The Technological Transgression of the Final Frontier
    content_en: Throughout human history, the interior landscape of the human skull has served as an inviolable biological
      sanctuary. While authoritarian regimes throughout the centuries have successfully coerced overt behavioral compliance,
      tortured physical bodies, and censored spoken or written expression, the private subjective stream of human consciousness—one's
      unspoken thoughts, fleeting desires, silent doubts, and raw emotional reactions—remained fundamentally inaccessible
      to external surveillance. However, explosive convergences between advanced neuroimaging, implantable microelectrode
      arrays, and deep generative neural networks are systematically breaching this ultimate biological threshold. Neurotechnologies
      are advancing from crude therapeutic medical prosthetics to sophisticated consumer devices capable of decoding, archiving,
      and manipulating the neural correlates of human cognition in real time. Totalitarian regimes throughout the twentieth
      century deployed terrifying instruments of psychological coercion, yet they could only dream of possessing direct technological
      access to the interior human psyche.
    content_tr: İnsan tarihi boyunca insan kafatasının iç manzarası dokunulmaz bir biyolojik sığınak görevi görmüştür. Yüzyıllar
      boyunca otoriter rejimler açık davranışsal uyumu başarıyla zorlamış, fiziksel bedenlere işkence etmiş ve sözlü ya da
      yazılı ifadeyi sansürlemiş olsa da insan bilincinin özel öznel akışı—kişinin söylenmemiş düşünceleri, anlık arzuları,
      sessiz şüpheleri ve ham duygusal tepkileri—dış gözetim için temelde erişilemez kaldı. Ancak gelişmiş nörogörüntüleme,
      implante edilebilir mikroelektrot dizileri ve derin üretken sinir ağları arasındaki patlayıcı yakınlaşmalar bu nihai
      biyolojik eşiği sistematik olarak ihlal etmektedir. Nöroteknolojiler kaba terapötik tıbbi protezlerden insan bilişinin
      sinirsel korelasyonlarını gerçek zamanlı olarak çözebilen, arşivleyebilen ve manipüle edebilen sofistike tüketici cihazlarına
      doğru ilerlemektedir.
  - paragraph_index: 2
    title: 'The Decisive Leap: Neural Decoding and Generative AI'
    content_en: The transition from noisy electrical signal recording to semantic neural decoding has been accelerated by
      modern generative machine learning. Historically, non-invasive electroencephalography (EEG) and functional magnetic
      resonance imaging (fMRI) produced fuzzy, low-resolution hemodynamic and electrical data that defied granular semantic
      interpretation. Today, computational neuroscientists pair continuous neuroimaging streams with large multimodal language
      models. Researchers at the University of Texas demonstrated that non-invasive fMRI decoders could reconstruct continuous
      natural language narratives—reflecting what a subject was silently hearing, imagining, or viewing—with astonishing semantic
      fidelity. In parallel, invasive brain-computer interfaces (BCIs), such as intracortical microelectrode arrays implanted
      in motor and speech cortexes, decode phonemic motor intentions directly into fluent synthesized speech for paralyzed
      patients at conversational velocities exceeding sixty words per minute. State-of-the-art intracortical microelectrodes,
      such as the silicon Utah array, record single-neuron action potentials across hundreds of channels simultaneously with
      sub-millisecond temporal precision.
    content_tr: Gürültülü elektriksel sinyal kaydından anlamsal sinirsel kod çözmeye geçiş modern üretken makine öğrenimi
      ile hızlandırılmıştır. Tarihsel olarak invaziv olmayan elektroensefalografi (EEG) ve fonksiyonel manyetik rezonans görüntüleme
      (fMRI), ayrıntılı anlamsal yoruma direnen bulanık, düşük çözünürlüklü hemodinamik ve elektriksel veriler üretiyordu.
      Günümüzde hesaplamalı sinirbilimciler sürekli nörogörüntüleme akışlarını büyük çok modlu dil modelleriyle eşleştirmektedir.
      Teksas Üniversitesi'ndeki araştırmacılar invaziv olmayan fMRI kod çözücülerin bir deneğin sessizce duyduğu, hayal ettiği
      veya izlediği şeyleri yansıtan sürekli doğal dil anlatılarını şaşırtıcı bir anlamsal sadakatle yeniden oluşturabildiğini
      göstermiştir. Buna paralel olarak motor ve konuşma kortekslerine implante edilen intrakortikal mikroelektrot dizileri
      gibi invaziv beyin-bilgisayar arayüzleri (BCI'lar), felçli hastalar için fonemik motor niyetlerini doğrudan dakikada
      altmış kelimeyi aşan konuşma hızlarında akıcı sentezlenmiş konuşmaya dönüştürmektedir.
  - paragraph_index: 3
    title: 'The Commercialization Frontier: Consumer Neurotechnology'
    content_en: 'While medical BCIs remain strictly regulated under rigorous biomedical clinical trial protocols, consumer
      neurotechnology is rapidly proliferating through unregulated commercial markets. Consumer technology conglomerates and
      specialized hardware startups are developing neural-sensing wristbands, biometric earbuds, and virtual reality head-mounted
      displays equipped with non-invasive neural sensors. Marketed under the attractive banners of cognitive enhancement,
      immersive spatial computing, real-time stress management, and hands-free device control, these devices continuously
      record rich neuro-electrical telemetry. However, unlike traditional biometric data like heart rates or step counts,
      neural data constitutes the raw biological source code of the self: reflecting subconscious attentional focus, hidden
      sexual orientations, latent neurological diseases, emotional vulnerabilities, and political proclivities. Commercial
      market analysts project that the global consumer neurotechnology sector will expand into a multi-billion-dollar industry
      within the coming decade, driven by immersive computing applications.'
    content_tr: 'Tıbbi BCI''lar titiz biyomedikal klinik araştırma protokolleri altında sıkı bir şekilde düzenlenmeye devam
      ederken tüketici nöroteknolojisi düzenlenmemiş ticari pazarlar aracılığıyla hızla yayılmaktadır. Tüketici teknolojisi
      holdingleri ve özel donanım girişimleri invaziv olmayan sinirsel sensörlerle donatılmış sinir algılayıcı bileklikler,
      biyometrik kulaklıklar ve sanal gerçeklik başlıkları geliştirmektedir. Bilişsel geliştirme, sürükleyici uzamsal bilgi
      işlem, gerçek zamanlı stres yönetimi ve eller serbest cihaz kontrolü gibi çekici afişler altında pazarlanan bu cihazlar
      zengin nöro-elektriksel telemetriyi sürekli olarak kaydeder. Ancak kalp atış hızı veya adım sayısı gibi geleneksel biyometrik
      verilerin aksine sinirsel veriler benliğin ham biyolojik kaynak kodunu oluşturur: bilinçaltı dikkat odağını, gizli cinsel
      yönelimleri, örtük nörolojik hastalıkları, duygusal kırılganlıkları ve siyasi eğilimleri yansıtır.'
  - paragraph_index: 4
    title: Surveillance Capitalism and the Commodification of Neurodata
    content_en: The commercial monetization of neural telemetry introduces a terrifying escalation of surveillance capitalism
      into human neurology. If digital platforms currently extract fortunes by harvesting outward behavioral exhaust—clicks,
      search queries, and browsing histories—neurodata unlocks the unmediated subconscious drivers that precede behavior.
      Advertisers could utilize real-time neural biofeedback to determine the millisecond a consumer experiences subconscious
      attraction or disgust, deploying micro-targeted marketing tailored to their neurochemical vulnerabilities. In employment
      settings, corporations could mandate neural monitoring headbands to track workers' cognitive fatigue, vigilance, or
      internal loyalty, punishing employees whose brains wander from productive focus. Without robust legal protections, the
      intimate sanctuary of the mind becomes commodified as the ultimate extractive resource of corporate capitalism. In democratic
      political environments, neuro-targeted psychological micro-profiling could enable political campaigns to detect subconscious
      emotional vulnerabilities and deploy manipulative propaganda with unprecedented precision.
    content_tr: Sinirsel telemetrinin ticari olarak paraya dönüştürülmesi gözetim kapitalizminin insan nörolojisine korkutucu
      bir şekilde tırmanmasını beraberinde getirir. Dijital platformlar şu anda dışsal davranışsal kalıntıları—tıklamaları,
      arama sorgularını ve tarama geçmişlerini—toplayarak servetler elde ediyorsa sinirsel veriler davranıştan önce gelen
      aracısız bilinçaltı itici güçlerin kilidini açar. Reklamverenler bir tüketicinin bilinçaltı çekim veya iğrenme yaşadığı
      milisaniyeyi belirlemek için gerçek zamanlı sinirsel biyolojik geri bildirimi kullanabilir ve onların nörokimyasal zayıflıklarına
      göre uyarlanmış mikro hedefli pazarlamayı devreye sokabilir. İstihdam ortamlarında şirketler çalışanların bilişsel yorgunluğunu,
      tetikte olma durumunu veya içsel sadakatini izlemek için sinirsel izleme kafa bantlarını zorunlu kılabilir ve beyinleri
      üretken odaktan uzaklaşan çalışanları cezalandırabilir. Sağlam yasal korumalar olmadan zihnin mahrem sığınağı kurumsal
      kapitalizmin nihai sömürü kaynağı olarak metalaştırılır.
  - paragraph_index: 5
    title: State Surveillance, Coercion, and Self-Incrimination
    content_en: 'Even more alarming are the implications of neurotechnology for state power, criminal justice, and civil liberties.
      Authoritarian regimes could deploy neural decoding technologies as definitive instruments of ideological interrogation,
      detecting subversive thoughts or political disloyalty without physical coercion. In democratic criminal justice systems,
      prosecutors and intelligence agencies will inevitably seek judicial warrants to compel criminal suspects to undergo
      brain-based memory detection tests—such as the P300 ''brain fingerprinting'' wave—to determine whether an individual
      recognizes a crime scene photograph. This involuntary cognitive extraction poses an existential challenge to foundational
      constitutional jurisprudence: specifically, the Fifth Amendment right against self-incrimination, which historically
      shielded speech but left physical bodily evidence unprotected. Does reading a citizen''s thoughts constitute a physical
      blood draw, or a coerced confession? Foundational legal precedents like the US Supreme Court''s Schmerber v. California
      established that the Fifth Amendment protects testimonial communications rather than physical bodily evidence, creating
      dangerous ambiguity for neural decoding.'
    content_tr: 'Nöroteknolojinin devlet gücü, ceza adaleti ve sivil özgürlükler üzerindeki sonuçları daha da endişe vericidir.
      Otoriter rejimler sinirsel kod çözme teknolojilerini ideolojik sorgulamanın kesin araçları olarak konuşlandırabilir;
      yıkıcı düşünceleri veya siyasi sadakatsizliği fiziksel zorlama olmadan tespit edebilir. Demokratik ceza adaleti sistemlerinde
      savcılar ve istihbarat teşkilatları kaçınılmaz olarak bir bireyin bir suç mahalli fotoğrafını tanıyıp tanımadığını belirlemek
      için suç şüphelilerini beyin tabanlı bellek tespit testlerine—P300 ''beyin parmak izi'' dalgası gibi—tabi tutmak üzere
      adli arama kararları arayacaklardır. Bu istemsiz bilişsel çıkarma temel anayasal içtihada varoluşsal bir meydan okuma
      oluşturur: özellikle tarihsel olarak konuşmayı koruyan ancak fiziksel bedensel kanıtları korumasız bırakan kendi aleyhine
      tanıklık etmeme yönündeki Beşinci Değişiklik hakkı. Bir vatandaşın düşüncelerini okumak fiziksel bir kan almayı mı yoksa
      zorla alınan bir itirafı mı teşkil eder?'
  - paragraph_index: 6
    title: The Jurisprudence of Cognitive Liberty and Neuro-Rights
    content_en: 'To establish an impermeable constitutional bulwark against technological mental intrusion, legal philosopher
      Nita Farahany and neuroethicist Marcello Ienca have championed the recognition of a new category of fundamental human
      rights: ''neuro-rights''. Central to this doctrine is the overarching principle of ''cognitive liberty''—the fundamental
      human right to self-determination over one''s own mental realm. Cognitive liberty encompasses three distinct legal components:
      mental privacy, which guarantees that brain data cannot be monitored or extracted without explicit affirmative consent;
      mental integrity, which prohibits the external manipulation or alteration of neural states without consent; and psychological
      continuity, which protects individuals from technologies that distort personal identity and agency. Without explicit
      legal constitutional codification, existing privacy laws grounded in informational property remain dangerously inadequate
      to protect the sanctity of the human mind. Renowned human rights scholars argue that the right to mental privacy must
      be classified as a non-derogable human right under the International Covenant on Civil and Political Rights, immune
      to emergency suspension.'
    content_tr: 'Teknolojik zihinsel müdahaleye karşı geçirimsiz bir anayasal siper oluşturmak için hukuk felsefecisi Nita
      Farahany ve nöroetikçi Marcello Ienca yeni bir temel insan hakları kategorisinin tanınmasını savunmuşlardır: ''nöro-haklar''.
      Bu doktrinin merkezinde ''bilişsel özgürlük'' genel ilkesi yer alır—kişinin kendi zihinsel alanı üzerinde kendi kaderini
      tayin etme temel insan hakkı. Bilişsel özgürlük üç farklı yasal bileşeni kapsar: beyin verilerinin açık olumlu rıza
      olmadan izlenemeyeceğini veya çıkarılamayacağını garanti eden zihinsel mahremiyet; sinirsel durumların rıza olmadan
      harici olarak manipüle edilmesini veya değiştirilmesini yasaklayan zihinsel bütünlük; ve bireyleri kişisel kimliği ve
      failliği bozan teknolojilerden koruyan psikolojik süreklilik. Açık bir yasal anayasal kodlama olmaksızın enformasyonel
      mülkiyete dayanan mevcut gizlilik yasaları insan zihninin kutsallığını korumak için tehlikeli derecede yetersiz kalır.'
  - paragraph_index: 7
    title: 'Pioneering Legislation: The Chilean Neuro-Rights Amendment'
    content_en: The frontier of legal codification achieved historic breakthrough in 2021 when the Republic of Chile became
      the first nation in human history to enact a constitutional amendment explicitly protecting neuro-rights. The landmark
      Chilean constitutional reform amended Article 19 to establish that scientific and technological development must protect
      the physical and mental integrity of individuals, treating human brain data with the identical legal gravity as human
      donor organs. Chile's pioneering statute explicitly bans any technology that modifies or diminishes individual self-determination
      without free, prior, and informed consent. Furthermore, international bodies, including the United Nations Human Rights
      Council and UNESCO, have initiated formal treaties to draft global declarations on neurotechnologies and human rights,
      signaling an emerging global legal consensus. Following Chile's constitutional triumph, legislative assemblies across
      Latin America and Europe, including the Spanish Senate, have introduced parallel statutory bills codifying neuro-rights
      into national legal systems.
    content_tr: Yasal kodlamanın öncüsü 2021 yılında Şili Cumhuriyeti'nin insanlık tarihinde nöro-hakları açıkça koruyan bir
      anayasa değişikliğini yasalaştıran ilk ülke olmasıyla tarihi bir atılım gerçekleştirdi. Dönüm noktası niteliğindeki
      Şili anayasa reformu Madde 19'u bilimsel ve teknolojik gelişmenin bireylerin fiziksel ve zihinsel bütünlüğünü koruması
      gerektiğini belirtecek ve insan beyin verilerine insan donör organlarıyla aynı yasal ciddiyeti atfedecek şekilde değiştirdi.
      Şili'nin öncü yasası özgür, önceden ve bilgilendirilmiş rıza olmaksızın bireysel özyönetimi değiştiren veya azaltan
      herhangi bir teknolojiyi açıkça yasaklar. Dahası Birleşmiş Milletler İnsan Hakları Konseyi ve UNESCO dahil olmak üzere
      uluslararası kuruluşlar nöroteknolojiler ve insan hakları konusunda küresel bildirgeler hazırlamak için resmi anlaşmalar
      başlatarak gelişen bir küresel yasal fikir birliğine işaret etmiştir.
  - paragraph_index: 8
    title: Cognitive Enhancement and Neuro-Inequality
    content_en: Beyond defensive protections against surveillance, neurotechnology introduces profound distributive justice
      dilemmas regarding cognitive enhancement. If safe, direct neural interfaces eventually allow users to accelerate memory
      consolidation, download complex linguistic skills directly into synaptic networks, or interface seamlessly with cloud
      artificial intelligence, profound socio-economic stratifications will emerge. If enhanced cognitive capabilities are
      distributed purely through unconstrained market mechanisms, wealthy elites will purchase biological intellectual supremacy
      for their offspring, creating a permanent, biological cognitive caste system. Bioethicists warn that cognitive enhancement
      technologies must not become an engine of biological inequality, demanding equitable access protocols and democratic
      governance over cognitive neuro-enhancement frameworks. Direct high-bandwidth brain-to-brain communication protocols
      could ultimately give rise to networked collective consciousnesses, challenging centuries-old individualist conceptions
      of human selfhood and legal responsibility.
    content_tr: Gözetime karşı savunmacı korumaların ötesinde nöroteknoloji bilişsel geliştirme konusunda derin dağıtıcı adalet
      ikilemlerini beraberinde getirir. Güvenli, doğrudan sinirsel arayüzler nihayetinde kullanıcıların bellek pekiştirmeyi
      hızlandırmasına, karmaşık dilsel becerileri doğrudan sinaptik ağlara indirmesine veya bulut yapay zekasıyla sorunsuz
      bir şekilde arayüz oluşturmasına izin verirse derin sosyoekonomik tabakalaşmalar ortaya çıkacaktır. Gelişmiş bilişsel
      yetenekler tamamen kısıtlanmamış pazar mekanizmaları aracılığıyla dağıtılırsa varlıklı seçkinler çocukları için biyolojik
      entelektüel üstünlük satın alacak ve kalıcı, biyolojik bir bilişsel kast sistemi yaratacaktır. Biyoetikçiler bilişsel
      geliştirme teknolojilerinin biyolojik eşitsizliğin bir motoru haline gelmemesi gerektiği konusunda uyararak adil erişim
      protokolleri ve bilişsel nöro-geliştirme çerçeveleri üzerinde demokratik yönetişim talep etmektedir.
  - paragraph_index: 9
    title: 'Conclusion: The Inviolable Sanctuary of the Mind'
    content_en: The neurotechnological revolution confronts humanity with its most intimate and consequential philosophical
      crossroads. The extraordinary potential of brain-computer interfaces to restore mobility to the paralyzed, illuminate
      the mysteries of dementia, and liberate the human mind from biological constraints is undeniably sublime. Yet if this
      technological power is deployed to commodify mental privacy, automate ideological conformity, and exploit neural vulnerability,
      it will extinguish the essential flame of human autonomy. Securing cognitive liberty is not merely a specialized regulatory
      challenge; it is the ultimate moral duty to preserve the sovereign, uncoerced human spirit as the inviolable foundation
      of all liberty, dignity, and democratic civilization. Safeguarding the uncoerced human mind ensures that the sacred
      internal sanctuary of imagination, doubt, and philosophical wonder remains free from corporate exploitation and state
      surveillance forever.
    content_tr: Nöroteknolojik devrim insanlığı en mahrem ve sonuç doğurucu felsefi dönüm noktasıyla karşı karşıya getirmektedir.
      Beyin-bilgisayar arayüzlerinin felçlilere hareket kabiliyetini geri kazandırma, demansın gizemlerini aydınlatma ve insan
      zihnini biyolojik kısıtlamalardan kurtarma yönündeki olağanüstü potansiyeli inkar edilemez şekilde yücedir. Yine de
      bu teknolojik güç zihinsel mahremiyeti metalaştırmak, ideolojik uyumu otomatikleştirmek ve sinirsel kırılganlığı sömürmek
      için kullanılırsa insani özerkliğin temel alevini söndürecektir. Bilişsel özgürlüğü güvence altına almak yalnızca özel
      bir düzenleyici zorluk değildir; tüm özgürlüğün, onurun ve demokratik uygarlığın dokunulmaz temeli olarak egemen, zorlanmamış
      insan ruhunu korumaya yönelik nihai ahlaki görevdir.
  vocabulary_annotations:
  - word: inviolable
    context_definition_en: Never to be broken, infringed, or dishonored; secure from violation.
    context_meaning_tr: dokunulmaz, ihlal edilemez
  - word: subversive
    context_definition_en: Seeking or intended to subvert an established system or institution.
    context_meaning_tr: yıkıcı, düzeni bozmaya çalışan
  - word: codification
    context_definition_en: The process of collecting and restating the law of a jurisdiction in legal code.
    context_meaning_tr: yasalaştırma, kanun haline getirme
  comprehension_questions:
  - id: q_reading_c2_neurotechnology-cognitive-liberty-ethics_01
    question_en: What technological breakthrough enabled continuous natural language decoding from brain scans in Paragraph
      2?
    question_tr_hint: 2. paragrafta beyin taramalarından sürekli doğal dil kodunun çözülmesini hangi teknolojik atılım sağladı?
    options:
    - Connecting human skulls directly to analog telephone switchboards.
    - Replacing all human brain tissue with solid copper electrical circuits.
    - Requiring subjects to speak loudly into physical microphones during scanning.
    - Pairing continuous neuroimaging streams with large multimodal generative language models.
    correct_answer: Pairing continuous neuroimaging streams with large multimodal generative language models.
    explanation_en: Paragraph 2 explains pairing continuous neuroimaging with large multimodal language models achieved semantic
      decoding.
    explanation_tr: 2. paragraf sürekli nörogörüntülemeyi büyük dil modelleriyle eşleştirmenin anlamsal kod çözmeyi sağladığını
      açıklar.
  - id: q_reading_c2_neurotechnology-cognitive-liberty-ethics_02
    question_en: Why does neural data represent a far more dangerous commercial asset than heart rate data in Paragraph 3?
    question_tr_hint: 3. paragrafta sinirsel veriler neden kalp atış hızı verilerinden çok daha tehlikeli bir ticari varlığı
      temsil eder?
    options:
    - Neural data instantly wipes out all credit card numbers stored on servers.
    - It constitutes the biological source code of the self, revealing subconscious desires, orientations, and vulnerabilities.
    - Neural data can only be stored inside expensive cryogenic nuclear reactors.
    - Heart rate monitors consume twice as much electrical battery power as brain sensors.
    correct_answer: It constitutes the biological source code of the self, revealing subconscious desires, orientations, and
      vulnerabilities.
    explanation_en: Paragraph 3 explains neurodata reflects subconscious attention, sexual orientations, and vulnerabilities.
    explanation_tr: 3. paragraf sinirsel verilerin bilinçaltı dikkati, yönelimleri ve kırılganlıkları yansıttığını açıklar.
  - id: q_reading_c2_neurotechnology-cognitive-liberty-ethics_03
    question_en: What constitutional dilemma does involuntary brain-wave testing create in criminal justice in Paragraph 5?
    question_tr_hint: 5. paragrafta istemsiz beyin dalgası testi ceza adaletinde hangi anayasal ikilemi yaratmaktadır?
    options:
    - Whether extracting thoughts violates the Fifth Amendment protection against self-incrimination like coerced testimony.
    - Whether brain scanners should be manufactured out of wood rather than plastic.
    - Whether criminal defense lawyers are permitted to look at computer screens in court.
    - Whether juries are legally allowed to sleep during judicial closing arguments.
    correct_answer: Whether extracting thoughts violates the Fifth Amendment protection against self-incrimination like coerced
      testimony.
    explanation_en: Paragraph 5 details the tension between physical bodily evidence and Fifth Amendment protections against
      self-incrimination.
    explanation_tr: 5. paragraf fiziksel kanıt ile kendi aleyhine tanıklık etmeme koruması arasındaki gerilimi açıklar.
  - id: q_reading_c2_neurotechnology-cognitive-liberty-ethics_04
    question_en: What are the three core legal components of 'cognitive liberty' defined in Paragraph 6?
    question_tr_hint: 6. paragrafta tanımlanan 'bilişsel özgürlüğün' üç temel yasal bileşeni nelerdir?
    options:
    - The right to own property, travel across borders, and obtain commercial loans.
    - Free internet access, cheap laptop hardware, and unlimited cloud storage.
    - Mental privacy, mental integrity against alteration, and psychological continuity of identity.
    - Mandatory daily meditation, physical exercise, and nutritional vitamin pills.
    correct_answer: Mental privacy, mental integrity against alteration, and psychological continuity of identity.
    explanation_en: Paragraph 6 specifies cognitive liberty encompasses mental privacy, mental integrity, and psychological
      continuity.
    explanation_tr: 6. paragraf bilişsel özgürlüğün zihinsel mahremiyet, zihinsel bütünlük ve psikolojik sürekliliği kapsadığını
      belirtir.
