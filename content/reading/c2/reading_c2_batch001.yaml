  - word: affinity
    vocab_id: vocab.affinity
    context_definition_en: A natural liking, innate psychological connection, or biological predisposition.
    context_meaning_tr: Doğal bir sempati, doğuştan gelen psikolojik bağ veya biyolojik yatkınlık.
  - word: resilience
    vocab_id: vocab.resilience
    context_definition_en: The capacity of a city or biological system to recover quickly from acute climate or supply shocks.
    context_meaning_tr: Bir kentin veya biyolojik sistemin iklim veya tedarik şoklarından hızla toparlanma kapasitesi.
  comprehension_questions:
  - id: q_c2_urban_01
    question_en: What characterized the 'linear metabolism' of twentieth-century industrial cities?
    question_tr_hint: Yirminci yüzyıl sanayi kentlerinin 'doğrusal metabolizmasını' ne karakterize ediyordu?
    options:
    - Constructing underground agricultural farms beneath all municipal railway stations
    - Requiring all urban citizens to relocate to offshore floating platforms every decade
    - Generating zero municipal waste by recycling one hundred percent of commercial plastics
    - Extracting natural capital, converting it into commodities, and dumping unassimilated waste into biosystems
    correct_answer: Extracting natural capital, converting it into commodities, and dumping unassimilated waste into biosystems
    explanation_en: The text defines twentieth-century linear metabolism as an extractive take-make-waste pipeline that treated
      cities as consumption parasites.
    explanation_tr: Metin yirminci yüzyıl doğrusal metabolizmasını kentleri tüketim parazitleri olarak ele alan kaynak tüketici
      bir boru hattı olarak tanımlar.
  - id: q_c2_urban_02
    question_en: What is the foundational premise of the biophilia hypothesis proposed by Edward O. Wilson?
    question_tr_hint: Edward O. Wilson tarafından ileri sürülen biyofili hipotezinin temel önermesi nedir?
    options:
    - Human beings can photosynthesize sunlight if exposed to green light for four hours
    - Human evolutionary biology possesses an innate, indelible affinity for living natural ecosystems
    - Urban knowledge workers prefer sterile concrete walls over natural daylighting
    - Plants grow four times faster when listening to classical symphony orchestras
    correct_answer: Human evolutionary biology possesses an innate, indelible affinity for living natural ecosystems
    explanation_en: Wilson's biophilia hypothesis states that humans have an evolutionary, biological predisposition and psychological
      need to connect with nature.
    explanation_tr: Wilson'ın biyofili hipotezi insanların doğayla bağ kurmaya yönelik evrimsel ve biyolojik bir yatkınlığa
      ve psikolojik ihtiyaca sahip olduğunu ifade eder.
  - id: q_c2_urban_03
    question_en: How does circular urban metabolism achieve industrial symbiosis?
    question_tr_hint: Döngüsel kentsel metabolizma endüstriyel simbiyozu nasıl başarır?
    options:
    - By channeling one sector's waste streams as primary manufacturing feedstock for another sector
    - By banning all industrial manufacturing inside national borders and importing all commodities
    - By requiring all commercial factories to shut down operations during the winter months
    - By dumping all industrial chemical waste into ocean trenches via pressurized pipelines
    correct_answer: By channeling one sector's waste streams as primary manufacturing feedstock for another sector
    explanation_en: Industrial symbiosis loops resources so that waste heat, biological waste, and graywater become inputs
      for heating, agriculture, and cooling.
    explanation_tr: Endüstriyel simbiyoz atık ısı, biyolojik atık ve gri suyun ısınma, tarım ve soğutma için girdi haline
      gelmesini sağlayacak şekilde kaynak döngüsü kurar.
  - id: q_c2_urban_04
    question_en: What operational resilience advantage do decentralized smart microgrids provide during severe weather?
    question_tr_hint: Merkezi olmayan akıllı mikro şebekeler şiddetli hava koşullarında hangi operasyonel dayanıklılık avantajını
      sunar?
    options:
    - They automatically convert excess electricity into liquid gold stored in underground vaults
    - They shut down all municipal hospitals to conserve battery power for street lighting
    - They send high-voltage shocks through transit rails to disperse floodwaters instantly
    - They island themselves smoothly from the main grid, keeping critical infrastructure powered
    correct_answer: They island themselves smoothly from the main grid, keeping critical infrastructure powered
    explanation_en: Decentralized microgrids can decouple ('island') from the wider compromised network to maintain uninterrupted
      power to vital services.
    explanation_tr: Merkezi olmayan mikro şebekeler hayati hizmetlere kesintisiz güç sağlamak için ana şebekeden sorunsuz
      bir şekilde ayrılabilir (adalanabilir).
  - id: q_c2_urban_05
    question_en: Why does the author argue that ecological urbanism is fundamentally a question of spatial justice?
    question_tr_hint: Yazar ekolojik şehirciliğin temelde neden bir mekansal adalet meselesi olduğunu savunmaktadır?
    options:
    - Because modern architects are legally obligated to work without receiving financial compensation
    - Environmental amenities have historically been hoarded by wealthy enclaves while poor districts endured toxic heat sinks
    - Because judicial courts must be constructed exclusively from recycled shipping containers
    - Because city mayors are required to live in public housing units during their term in office
    correct_answer: Environmental amenities have historically been hoarded by wealthy enclaves while poor districts endured
      toxic heat sinks
    explanation_en: The text emphasizes that green infrastructure must be democratized, especially in disinvested districts
      historically burdened by pollution and heat.
    explanation_tr: Metin yeşil altyapının özellikle tarihsel olarak kirlilik ve ısıyla boğuşan yatırım yapılmamış bölgelerde
      demokratikleştirilmesi gerektiğini vurgular.
