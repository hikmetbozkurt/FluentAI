  comprehension_questions:
  - id: q_c2_epist_01
    question_en: According to Karl Popper, what is the quintessential condition that elevates a hypothesis to genuine scientific
      status?
    question_tr_hint: Karl Popper'a göre bir hipotezi hakiki bilimsel statüye yükselten temel şart nedir?
    options:
    - It must expose itself to potential empirical refutation through testable, falsifiable predictions
    - It must be corroborated by thousands of confirming historical observations without exception
    - It must achieve unanimous philosophical consensus across leading academic faculties
    - It must be expressible exclusively through deterministic differential equations
    correct_answer: It must expose itself to potential empirical refutation through testable, falsifiable predictions
    explanation_en: Popper rejected verificationism, arguing that scientific validity requires systematic falsifiability rather
      than cumulative confirmation.
    explanation_tr: Popper doğrulamacılığı reddetmiş, bilimsel geçerliliğin kümülatif doğrulama yerine sistematik yanlışlanabilirlik
      gerektirdiğini savunmuştur.
  - id: q_c2_epist_02
    question_en: How does Thomas Kuhn describe the treatment of anomalous findings during periods of 'normal science'?
    question_tr_hint: Thomas Kuhn 'olağan bilim' dönemlerinde anomali niteliğindeki bulguların nasıl ele alındığını açıklar?
    options:
    - They prompt the immediate abandonment and dismantling of the overarching paradigm
    - They are instantly published as revolutionary breakthroughs in peer-reviewed journals
    - They are routinely set aside or integrated via ad hoc modifications rather than viewed as immediate refutations
    - They are classified as intentional scientific misconduct and purged from databases
    correct_answer: They are routinely set aside or integrated via ad hoc modifications rather than viewed as immediate refutations
    explanation_en: Kuhn argued that in normal science, anomalies are tolerated or accommodated through ad hoc tweaks until
      a critical crisis point is reached.
    explanation_tr: Kuhn, olağan bilimde anomalilerin kriz noktasına varana kadar geçici eklemelerle absorbe edildiğini belirtir.
  - id: q_c2_epist_03
    question_en: What structural advantage does Bayesian epistemology offer over rigid binary verificationism?
    question_tr_hint: Bayesçi epistemoloji katı ikili doğrulamacılığa kıyasla hangi yapısal avantajı sunar?
    options:
    - It guarantees absolute mathematical certainty for all computational algorithms
    - It treats belief as a continuum of probabilistic credences updated systematically through likelihood ratios
    - It eliminates the necessity for empirical data collection in laboratory settings
    - It proves that theoretical models never require revision once implemented
    correct_answer: It treats belief as a continuum of probabilistic credences updated systematically through likelihood ratios
    explanation_en: Bayesianism represents epistemic certainty as a continuous probability distribution updated dynamically
      via Bayes' theorem.
    explanation_tr: Bayesçilik inancı Bayes teoremi ile dinamik olarak güncellenen sürekli bir olasılık dağılımı olarak ele
      alır.
  - id: q_c2_epist_04
    question_en: Why does David Hume's problem of induction create critical vulnerabilities in modern deep learning models?
    question_tr_hint: David Hume'un tümevarım problemi modern derin öğrenme modellerinde neden kritik zafiyetler yaratır?
    options:
    - Neural networks cannot process data sets containing more than one gigabyte of memory
    - Computer hardware operates under non-uniform physical principles during summer months
    - Training data is forbidden by legal statutes from representing real-world telemetry
    - Complex neural networks extrapolate past correlations without explicit causal models, leaving them fragile to distributional
      shifts
    correct_answer: Complex neural networks extrapolate past correlations without explicit causal models, leaving them fragile
      to distributional shifts
    explanation_en: Without causal deduction models, statistical curve-fitting engines are vulnerable when unobserved conditions
      diverge from training data.
    explanation_tr: Nedensel modeller olmaksızın istatistiksel eğri uydurma motorları, yeni koşullar eğitim verisinden saptığında
      kırılganlaşır.
  - id: q_c2_epist_05
    question_en: What synthesis does the author advocate to safeguard scientific inquiry in the algorithmic era?
    question_tr_hint: Yazar algoritmik çağda bilimsel araştırmayı korumak için hangi sentezi savunmaktadır?
    options:
    - Total reliance on unverified black-box neural networks to formulate government policies
    - A return to scholastic theological debates to arbitrate engineering decisions
    - A discipline combining adversarial stress-testing, awareness of paradigm biases, and Bayesian tracking of uncertainty
    - The complete abolition of peer review in favor of algorithmic automated scoring
    correct_answer: A discipline combining adversarial stress-testing, awareness of paradigm biases, and Bayesian tracking
      of uncertainty
    explanation_en: The conclusion urges merging Popperian falsification tests, Kuhnian sociological reflexivity, and Bayesian
      uncertainty estimation.
    explanation_tr: Sonuç bölümü Popper'ın yanlışlama testleri, Kuhn'un önyargı farkındalığı ve Bayesçi belirsizlik takibinin
      birleştirilmesini öğütler.
