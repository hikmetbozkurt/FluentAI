  - word: pragmatic
    vocab_id: vocab.pragmatic
    context_definition_en: Dealing with problems sensibly and realistically rather than through bureaucratic dogma.
    context_meaning_tr: Sorunları bürokratik dogmalar yerine makul ve gerçekçi yollarla ele alan, pragmatik.
  comprehension_questions:
  - id: q_c2_decay_01
    question_en: How does the author apply the physical law of entropy to corporate dynamics?
    question_tr_hint: Yazar fiziksel entropi yasasını kurumsal dinamiklere nasıl uyarlamaktadır?
    options:
    - Organizations naturally deteriorate into coordination overhead and political self-preservation unless disciplined energy
      is injected
    - Organizations naturally generate excessive physical heat during summer accounting periods
    - Companies will inevitably go bankrupt exactly seven years after their public stock offering
    - Corporate hardware consumes more electrical energy than industrial manufacturing plants
    correct_answer: Organizations naturally deteriorate into coordination overhead and political self-preservation unless
      disciplined energy is injected
    explanation_en: The text explains that like physical systems, expanding enterprises spontaneously evolve toward bureaucratic
      disorder without active counter-measures.
    explanation_tr: Metin fiziksel sistemler gibi genişleyen şirketlerin de aktif önlemler alınmadıkça kendiliğinden bürokratik
      düzensizliğe evrildiğini açıklar.
  - id: q_c2_decay_02
    question_en: According to Conway's Law as described in the passage, why do software architectures become rigid in large
      enterprises?
    question_tr_hint: Metinde açıklandığı üzere Conway Yasasına göre büyük şirketlerde yazılım mimarileri neden kaskatı hale
      gelir?
    options:
    - Cloud computing providers charge prohibitive penalty fees for changing microservice endpoints
    - Programming languages lack the syntactic capability to express decentralized data structures
    - Security encryption algorithms strictly forbid modifying database schemas after initial launch
    - Systems inevitably reflect the siloed, defensive, and fragmented communication structures of the organization
    correct_answer: Systems inevitably reflect the siloed, defensive, and fragmented communication structures of the organization
    explanation_en: Conway's Law indicates that technical design mirrors organizational communication pathways, causing sociopolitical
      boundaries to solidify into code.
    explanation_tr: Conway Yasası teknik tasarımın organizasyonun iletişim yollarını yansıttığını, bu nedenle sosyopolitik
      sınırların koda dönüştüğünü gösterir.
  - id: q_c2_decay_03
    question_en: How does Goodhart's Law manifest in decaying corporate environments?
    question_tr_hint: Goodhart Yasası çürüyen kurumsal ortamlarda kendini nasıl gösterir?
    options:
    - Financial auditors refuse to inspect companies that have more than fifty employees
    - Surrogate metrics are gamed for personal evaluation while substantive customer value and quality wither
    - Automated monitoring systems fail because network hardware is deliberately damaged by staff
    - Government regulators intervene to fix product prices across the entire technology sector
    correct_answer: Surrogate metrics are gamed for personal evaluation while substantive customer value and quality wither
    explanation_en: Goodhart's Law states that target metrics cease to be effective because employees optimize for the surrogate
      number rather than real quality.
    explanation_tr: Goodhart Yasası ölçütlerin hedef haline geldiğinde çalışanların gerçek kalite yerine sayısal hedefleri
      manipüle etmesi nedeniyle bozulduğunu belirtir.
  - id: q_c2_decay_04
    question_en: What human capital dynamic occurs when bureaucratic rent-seeking takes over an enterprise?
    question_tr_hint: Bürokratik rant kollama bir şirketi ele geçirdiğinde hangi beşeri sermaye dinamiği ortaya çıkar?
    options:
    - High-agency innovators leave due to endless consensus hurdles, replaced by political apparatchiks who protect their
      own roles
    - The human resources department cuts employee salaries by fifty percent across the board
    - Junior software engineers are automatically promoted to board of director seats
    - Companies cease all hiring and transition entirely to automated robotics
    correct_answer: High-agency innovators leave due to endless consensus hurdles, replaced by political apparatchiks who
      protect their own roles
    explanation_en: Frustrated by risk-aversion, top innovators depart, while politically savvy bureaucrats entrench themselves
      by fabricating gatekeeping roles.
    explanation_tr: Riskten kaçınmadan usanan yetenekli üreticiler ayrılırken, siyaseten mahir bürokratlar kendilerini vazgeçilmez
      kılan onay mekanizmaları kurarlar.
  - id: q_c2_decay_05
    question_en: What structural remedy does the author propose to reverse institutional sclerosis?
    question_tr_hint: Yazar kurumsal kireçlenmeyi tersine çevirmek için hangi yapısal çözümü önermektedir?
    options:
    - Mandating daily six-hour all-hands coordination meetings for all software developers
    - Appointing twenty additional layers of senior vice presidents to oversee compliance checklists
    - Outsourcing all corporate governance decisions to anonymous social media polls
    - Executing radical decentralization into accountable profit-and-loss units and flattening management strata
    correct_answer: Executing radical decentralization into accountable profit-and-loss units and flattening management strata
    explanation_en: The conclusion advocates radical decentralization into autonomous P&L units, flattening hierarchy, and
      ending ritualistic review panels.
    explanation_tr: Sonuç bölümü hiyerarşiyi düzleştirmeyi, özerk kar-zarar birimlerine bölünmeyi ve ritüel kurulları kaldırmayı
      savunur.
