  comprehension_questions:
  - id: q_c2_macro_01
    question_en: What defines the Keynesian liquidity trap encountered when benchmark rates hit the zero lower bound?
    question_tr_hint: Gösterge faiz oranları sıfır alt sınırına ulaştığında karşılaşılan Keynesyen likidite tuzağını ne tanımlar?
    options:
    - Commercial banks run completely out of paper banknotes to distribute to physical retail customers
    - The national stock exchange is forced to suspend trading indefinitely due to regulatory decree
    - Government tax rates automatically reset to zero for all multinational technology corporations
    - Nominal rates cannot be lowered further, yet private balance sheet deleveraging continues to suppress activity
    correct_answer: Nominal rates cannot be lowered further, yet private balance sheet deleveraging continues to suppress
      activity
    explanation_en: A liquidity trap occurs when nominal policy rates cannot drop lower, but private deleveraging suppresses
      demand despite low borrowing costs.
    explanation_tr: Likidite tuzağı faizler daha fazla indirilemediğinde ve borç azaltımı nedeniyle talep düşük borçlanma
      maliyetlerine rağmen baskılandığında oluşur.
  - id: q_c2_macro_02
    question_en: What was the actual empirical consequence of Quantitative Easing compared to its theoretical promise?
    question_tr_hint: Parasal Genişlemenin teorik vaadine kıyasla fiili ampirik sonucu ne olmuştur?
    options:
    - It caused all consumer prices to drop by ninety percent within six months across OECD nations
    - It completely eliminated national debts across all participating G7 central bank balance sheets
    - It disproportionately inflated secondary asset values for wealthy elites rather than stimulating real capital expenditure
    - It forced corporate executives to resign and hand equity ownership to factory workers
    correct_answer: It disproportionately inflated secondary asset values for wealthy elites rather than stimulating real
      capital expenditure
    explanation_en: The text highlights that ultra-cheap liquidity primarily boosted asset prices rather than driving productive
      capital investments and real wages.
    explanation_tr: Metin aşırı ucuz likiditenin üretken yatırımları ve reel ücretleri artırmak yerine öncelikle varlık fiyatlarını
      şişirdiğini vurgular.
  - id: q_c2_macro_03
    question_en: How does prolonged monetary suppression foster the emergence of 'zombie' corporations?
    question_tr_hint: Uzun süreli parasal baskılama 'zombi' şirketlerin ortaya çıkışını nasıl besler?
    options:
    - Artificially low credit permits unprofitable firms to refinance endlessly, blocking creative destruction
    - Central banks directly seize control of private factories and convert them into automated server farms
    - Corporate bankruptcy courts are legally shuttered by emergency presidential decrees
    - Unprofitable companies are legally forced to merge with foreign sovereign wealth funds
    correct_answer: Artificially low credit permits unprofitable firms to refinance endlessly, blocking creative destruction
    explanation_en: Ultra-cheap debt allows unviable businesses to survive on life support, distorting capital allocation
      and depressing overall productivity.
    explanation_tr: Aşırı ucuz borç verimsiz işletmelerin hayatta kalmasına izin verir, sermaye tahsisini bozar ve genel verimliliği
      düşürür.
  - id: q_c2_macro_04
    question_en: What occurs during a regime of 'fiscal dominance'?
    question_tr_hint: '''Mali baskınlık'' rejiminde ne meydana gelir?'
    options:
    - National parliaments vote to eliminate national central banks and adopt digital barter systems
    - Government ministers are replaced by professional commercial investment bankers
    - Tax collection agencies are permanently dissolved to stimulate consumer spending
    - Central banks lose independence because raising rates to fight inflation would trigger sovereign debt crises
    correct_answer: Central banks lose independence because raising rates to fight inflation would trigger sovereign debt
      crises
    explanation_en: Under fiscal dominance, monetary authorities cannot hike rates aggressively because doing so would jeopardize
      the fiscal solvency of indebted states.
    explanation_tr: Mali baskınlık altında para otoriteleri faizleri agresif biçimde artıramaz çünkü bu durum borçlu devletlerin
      ödeme gücünü tehlikeye atar.
  - id: q_c2_macro_05
    question_en: What does the author argue is necessary to restore authentic macroeconomic equilibrium?
    question_tr_hint: Yazar gerçek makroekonomik dengeyi yeniden tesis etmek için neyin gerekli olduğunu savunmaktadır?
    options:
    - Printing unlimited fiat currency to permanently eliminate all corporate taxation
    - Returning to positive real capital costs that price risk, coupled with supply-side structural reforms
    - Mandating that central banks purchase one hundred percent of all global equities
    - Permanently fixing interest rates at negative ten percent for the next century
    correct_answer: Returning to positive real capital costs that price risk, coupled with supply-side structural reforms
    explanation_en: The author insists that genuine equilibrium requires positive real interest rates to discipline capital,
      alongside structural reforms rather than monetary magic.
    explanation_tr: Yazar gerçek dengenin sermayeyi disipline edecek pozitif faiz oranları ve parasal oyunlar yerine yapısal
      reformlar gerektirdiğini ileri sürer.
