  comprehension_questions:
  - id: q_c2_algo_01
    question_en: What core constitutional principle is compromised when sovereign discretion is delegated to machine algorithms?
    question_tr_hint: Egemen takdir yetkisi makine algoritmalarına devredildiğinde hangi temel anayasal ilke zedelenir?
    options:
    - The requirement that all legal decisions be rendered exclusively in classical Latin
    - The adjudicator's legal duty to provide reasoned, intelligible justifications accessible to judicial appeal
    - The mandate that every legal trial must take at least twelve months to conclude
    - The constitutional prohibition against using computers inside government offices
    correct_answer: The adjudicator's legal duty to provide reasoned, intelligible justifications accessible to judicial appeal
    explanation_en: The text emphasizes that constitutional legitimacy rests on an adjudicator's duty to provide reasoned,
      transparent justifications, which opaque algorithms cannot supply.
    explanation_tr: Metin anayasal meşruiyetin şeffaf olmayan algoritmaların sunamadığı gerekçelendirilmiş ve şeffaf izahat
      sunma görevine dayandığını vurgular.
  - id: q_c2_algo_02
    question_en: Why is the claim that predictive machine learning eliminates bias described as a 'technocratic fallacy'?
    question_tr_hint: Tahmin edici makine öğreniminin önyargıları yok ettiği iddiası neden 'teknokratik bir yanılgı' olarak
      nitelendirilmektedir?
    options:
    - Computer servers generate random errors whenever processing large numerical databases
    - Programmers intentionally write biased equations into every commercial code repository
    - Algorithms optimize for pattern replication from historical data, thus codifying and amplifying pre-existing structural
      disparities
    - Artificial intelligence models refuse to evaluate demographic data under any circumstances
    correct_answer: Algorithms optimize for pattern replication from historical data, thus codifying and amplifying pre-existing
      structural disparities
    explanation_en: Because models train on historical records containing systemic inequities, they reproduce and institutionalize
      historical discrimination rather than eradicating it.
    explanation_tr: Modeller sistemik eşitsizlikler içeren tarihsel verilerle eğitildiğinden, ayrımcılığı yok etmek yerine
      yeniden üretip kurumsallaştırırlar.
  - id: q_c2_algo_03
    question_en: What constitutes the 'black-box dilemma' in deep learning adjudication?
    question_tr_hint: Derin öğrenme yargılamasındaki 'kara kutu ikilemi' neyi ifade eder?
    options:
    - Classifications emerge from billions of non-linear parameters that are incomprehensible to human post-hoc understanding
    - Computer chassis are painted black to prevent government inspectors from seeing internal circuitry
    - Courtroom microphones malfunction when connected to modern digital networks
    - Software engineers encrypt all data using illegal passwords that cannot be cracked
    correct_answer: Classifications emerge from billions of non-linear parameters that are incomprehensible to human post-hoc
      understanding
    explanation_en: The black-box problem refers to the mathematical opacity of deep networks whose inner latent representations
      cannot be interpreted by human minds.
    explanation_tr: Kara kutu problemi derin ağların iç gizil temsillerinin insan zihni tarafından anlaşılamamasından kaynaklanan
      matematiksel kapalılığı ifade eder.
  - id: q_c2_algo_04
    question_en: How do reflexive feedback loops degrade automated scoring systems over time?
    question_tr_hint: Düşünümsel geri besleme döngüleri otomatik puanlama sistemlerini zaman içinde nasıl bozar?
    options:
    - Users stop using mobile phones altogether when automated scoring is deployed
    - Telecommunication cables deteriorate rapidly due to excess algorithmic calculations
    - Human agents dynamically alter telemetry to manipulate scoring matrices, triggering severe model drift
    - Computer memory chips permanently lose their data storage capacity
    correct_answer: Human agents dynamically alter telemetry to manipulate scoring matrices, triggering severe model drift
    explanation_en: When individuals realize how they are scored, they game the metrics, distorting the underlying telemetry
      and invalidating the model's assumptions.
    explanation_tr: Bireyler nasıl puanlandıklarını anladıklarında ölçütleri manipüle ederler, bu da altta yatan telemetriyi
      çarpıtarak modelin varsayımlarını bozar.
  - id: q_c2_algo_05
    question_en: What policy constraints does the author propose under a 'jurisprudence of algorithmic proportionality'?
    question_tr_hint: Yazar 'algoritmik ölçülülük hukuku' kapsamında hangi politika kısıtlamalarını önermektedir?
    options:
    - Banning all personal computers and smart devices from legal educational institutions
    - Keeping punitive criminal sentencing under human custody and enforcing mechanistic interpretability for administrative
      tools
    - Replacing human trial juries with fully autonomous neural network decision clusters
    - Allowing private software corporations to unilaterally enact criminal statutes
    correct_answer: Keeping punitive criminal sentencing under human custody and enforcing mechanistic interpretability for
      administrative tools
    explanation_en: The text argues that criminal sentencing must remain strictly human, and administrative tools must remain
      subordinate, audited advisory inputs.
    explanation_tr: Metin cezai hükümlerin kesinlikle insanda kalması ve idari araçların denetlenen ikincil danışma girdileri
      olarak kalması gerektiğini savunur.
