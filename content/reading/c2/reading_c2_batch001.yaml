- id: reading.c2.the-mechanics-of-speculative-bubbles
  title: 'Anatomy of Euphoria: The Minsky Cycle and the Mechanics of Speculative Manias'
  cefr_level: C2
  category: finance_and_economics
  summary_en: A comprehensive macroeconomic and historical autopsy of asset bubbles, examining Hyman Minsky's Financial Instability
    Hypothesis, Ponzi finance regimes, and leverage unraveling.
  summary_tr: Hyman Minsky'nin Finansal İstikrarsızlık Hipotezi, Ponzi finansman rejimleri ve kaldıraç çözülmesini inceleyen
    varlık balonlarının kapsamlı makroekonomik ve tarihsel otopsisi.
  word_count: 1047
  estimated_reading_minutes: 6
  paragraphs:
  - paragraph_index: 1
    title: The Endogenous Fragility of Financial Capitalism
    content_en: 'Mainstream neoclassical economics long operated under the Panglossian premise of the Efficient Market Hypothesis
      (EMH), positing that financial asset prices at all times rationally reflect all publicly available information through
      frictionless arbitrage. Under this theoretical framework, speculative asset bubbles are dismissed as impossible anomalies
      or relegated to unpredictable exogenous shocks. However, heterodox economist Hyman Minsky formulated a radically different
      and empirically validated thesis: the Financial Instability Hypothesis. Minsky postulated that financial capitalism
      is inherently, endogenously unstable. Prolonged periods of economic prosperity and tranquil macroeconomic stability
      do not reinforce market equilibrium; rather, they systematically breed complacency, erode risk aversion, and encourage
      speculative debt accumulation. In Minsky''s celebrated aphorism, ''stability is destabilizing.'' The very absence of
      systemic volatility plants the catastrophic seeds of the next speculative mania. Prudent counter-cyclical capital buffers
      reinforce institutional resilience during market downturns.'
    content_tr: 'Ana akım neoklasik iktisat uzun süre Etkin Piyasa Hipotezi''nin (EMH) aşırı iyimser önermesi altında çalıştı;
      finansal varlık fiyatlarının sürtünmesiz arbitraj yoluyla her zaman kamuya açık tüm bilgileri rasyonel olarak yansıttığını
      öne sürdü. Bu teorik çerçeve altında spekülatif varlık balonları imkansız anomaliler olarak reddedildi veya öngörülemeyen
      dışsal şoklara havale edildi. Ancak heterodoks iktisatçı Hyman Minsky radikal olarak farklı ve ampirik olarak doğrulanmış
      bir tez formüle etti: Finansal İstikrarsızlık Hipotezi. Minsky, finansal kapitalizmin doğası gereği, içsel olarak istikrarsız
      olduğunu öne sürdü. Uzun süreli ekonomik refah ve sakin makroekonomik istikrar dönemleri piyasa dengesini pekiştirmez;
      aksine, rehaveti sistematik olarak körükler, riskten kaçınmayı aşındırır ve spekülatif borç birikimini teşvik eder.
      Minsky''nin ünlü vecizesinde belirttiği gibi, ''istikrar istikrarsızlaştırıcıdır.'' Sistemik oynaklığın yokluğu bile,
      bir sonraki spekülatif çılgınlığın felaket tohumlarını eker. İhtiyatlı döngü karşıtı sermaye tamponları, piyasa gerilemeleri
      sırasında kurumsal dayanıklılığı pekiştirir.'
  - paragraph_index: 2
    title: Displacement and the Genesis of Speculative Narrative
    content_en: 'The mechanical lifecycle of a speculative bubble invariably initiates with what economic historian Charles
      Kindleberger identified as a displacement: an exogenous macroeconomic event or paradigm-shifting technological breakthrough
      that fundamentally alters economic prospects. Historical precedents include the expansion of seventeenth-century Dutch
      maritime trade routes, nineteenth-century British railroad expansion, the commercialization of the internet in the late
      1990s, and recent breakthroughs in decentralized ledger technology and generative artificial intelligence. The displacement
      introduces a compelling, plausible narrative of unprecedented future earnings. Smart money institutional capital enters
      early, capturing massive outsized returns. As early adopters flaunt dramatic profits, the narrative undergoes social
      contagion, amplified by financial media and institutional investment houses peddling the intoxicating gospel that ''this
      time is different'' and that classical valuation frameworks based on discounted cash flows are hopelessly archaic.'
    content_tr: 'Spekülatif bir balonun mekanik yaşam döngüsü, iktisat tarihçisi Charles Kindleberger''in ''yer değiştirme''
      (displacement) olarak tanımladığı şeyle başlar: ekonomik beklentileri temelden değiştiren dışsal bir makroekonomik olay
      veya paradigma değiştiren teknolojik bir atılım. Tarihsel emsaller arasında on yedinci yüzyıl Hollanda deniz ticaret
      yollarının genişlemesi, on dokuzuncu yüzyıl İngiliz demiryolu genişlemesi, 1990''ların sonlarında internetin ticarileştirilmesi
      ve merkeziyetsiz defter teknolojisi ile üretken yapay zekadaki son atılımlar yer alır. Yer değiştirme, benzeri görülmemiş
      gelecekteki kazançlara dair ikna edici, makul bir anlatı sunar. Akıllı kurumsal sermaye erken girerek devasa boyutlarda
      getiriler elde eder. İlk benimseyenler çarpıcı karlar sergiledikçe, anlatı sosyal bir bulaşıcılığa uğrar; ''bu sefer
      farklı'' olduğu ve indirgenmiş nakit akışlarına dayalı klasik değerleme çerçevelerinin umutsuzca arkaik kaldığı yönündeki
      sarhoş edici vaazları yayan finans medyası ve kurumsal yatırım kuruluşları tarafından büyütülür.'
  - paragraph_index: 3
    title: Credit Expansion and the Progression to Ponzi Finance
    content_en: 'A speculative narrative alone cannot generate a systemic bubble without fuel: elastic credit creation and
      monetary expansion. As asset prices climb, commercial banks and shadow financial intermediaries aggressively expand
      lending, accepting the appreciating assets as collateral. Minsky categorized corporate and speculative borrowing into
      three progressive stages: hedge finance, speculative finance, and Ponzi finance. In hedge finance, operating cash flows
      are sufficient to service both loan principal and interest payments. In speculative finance, cash flows cover only the
      ongoing interest payments, requiring the borrower to continually roll over the principal. In the climactic, terminal
      phase—Ponzi finance—the borrower''s operating income is insufficient to cover even the interest. The borrower relies
      entirely on the unending capital appreciation of the underlying asset to borrow further or sell equity to service mounting
      debt.'
    content_tr: 'Spekülatif bir anlatı tek başına yakıt olmadan sistemik bir balon üretemez: esnek kredi yaratımı ve parasal
      genişleme. Varlık fiyatları tırmandıkça, ticari bankalar ve gölge finansal aracılar, değer kazanan varlıkları teminat
      olarak kabul ederek agresif bir şekilde borç vermeyi genişletirler. Minsky, kurumsal ve spekülatif borçlanmayı üç ilerlemeli
      aşamaya ayırdı: koruma (hedge) finansmanı, spekülatif finansman ve Ponzi finansmanı. Koruma finansmanında, operasyonel
      nakit akışları hem kredi anaparasını hem de faiz ödemelerini karşılamaya yeterlidir. Spekülatif finansmanda, nakit akışları
      yalnızca devam eden faiz ödemelerini karşılar ve borçlunun anaparayı sürekli olarak yenilemesini (roll over) gerektirir.
      Zirveye ulaşan nihai aşamada —Ponzi finansmanı— borçlunun işletme geliri faizi bile karşılamaya yetersizdir. Borçlu,
      artan borcu ödemek için daha fazla borçlanmak veya hisse satmak adına tamamen dayanak varlığın bitmek bilmeyen sermaye
      değer artışına güvenir.'
  - paragraph_index: 4
    title: Euphoria, Rational Inattention, and the Minsky Moment
    content_en: During the euphoria phase, market psychology uncouples entirely from balance sheet fundamentals. Retail investors,
      gripped by the fear of missing out (FOMO), liquidate stable retirement savings to purchase speculative assets at astronomical
      price-to-earnings multiples. Institutional asset managers who recognize the glaring absurdity of the valuations nonetheless
      participate; as former Citigroup CEO Chuck Prince candidly admitted, 'as long as the music is playing, you've got to
      get up and dance.' Professional managers face severe career risk if they underperform benchmark indexes during a vertical
      rally. However, Ponzi finance carries mathematical mortality. The moment marginal buyers are exhausted or monetary authorities
      modestly hike interest rates, the precarious structure encounters what is universally recognized as the 'Minsky Moment'—the
      sudden, violent realization that asset values cannot sustain the debt.
    content_tr: 'Öfori aşamasında, piyasa psikolojisi bilanço temellerinden tamamen kopar. Fırsatı kaçırma korkusuna (FOMO)
      kapılan bireysel yatırımcılar, astronomik fiyat-kazanç çarpanlarıyla spekülatif varlıkları satın almak için istikrarlı
      emeklilik birikimlerini nakde çevirirler. Değerlemelerin göze batan saçmalığının farkında olan kurumsal varlık yöneticileri
      bile bu çılgınlığa katılır; eski Citigroup CEO''su Chuck Prince''in açık yüreklilikle itiraf ettiği gibi, ''müzik çaldığı
      sürece kalkıp dans etmek zorundasınız.'' Profesyonel yöneticiler, dikey bir ralli sırasında karşılaştırma ölçütü endekslerinin
      gerisinde kalırlarsa ciddi bir kariyer riskiyle karşı karşıya kalırlar. Ancak Ponzi finansmanı matematiksel bir ölüm
      taşır. Marjinal alıcıların tükendiği veya parasal otoritelerin faiz oranlarını mütevazı bir şekilde artırdığı anda,
      bu kırılgan yapı evrensel olarak ''Minsky Anı'' olarak kabul edilen şeyle karşılaşır: varlık değerlerinin borcu sürdüremeyeceğinin
      ani ve şiddetli bir şekilde anlaşılması.'
  - paragraph_index: 5
    title: Revulsion, Liquidity Cascades, and the Macroeconomic Aftermath
    content_en: 'The unraveling of a speculative bubble is profoundly asymmetric: whereas prices climbed gradually over multi-year
      bull runs, the collapse occurs in a matter of weeks through violent liquidity cascades. Over-leveraged speculators receive
      margin calls from brokers, forcing them to dump assets at market fire-sale prices to raise cash. As liquidity evaporates
      and bid-ask spreads widen into abysses, panic sets in, transitioning from euphoria to revulsion. Falling asset prices
      impair bank balance sheets, causing credit markets to freeze entirely. As credit contracts, the real economy plunges
      into debt deflation, characterized by widespread corporate bankruptcies, surging unemployment, and prolonged economic
      depression. Understanding the immutable mechanics of speculative bubbles is therefore not merely an academic luxury;
      it is the fundamental prerequisite for macroprudential regulation and systemic survival.'
    content_tr: 'Spekülatif bir balonun çözülmesi son derece asimetriktir: fiyatlar çok yıllı boğa koşuları boyunca kademeli
      olarak yükselirken, çöküş şiddetli likidite şelaleleri aracılığıyla birkaç hafta içinde gerçekleşir. Aşırı kaldıraçlı
      spekülatörler aracı kurumlardan teminat tamamlama (margin call) çağrıları alır ve nakit yaratmak için varlıkları yok
      pahasına piyasaya boşaltmak zorunda kalırlar. Likidite buharlaştıkça ve alış-satış makasları uçurumlara dönüştükçe panik
      başlar; öforiden nefret ve tiksintiye (revulsion) geçilir. Düşen varlık fiyatları banka bilançolarını bozar ve kredi
      piyasalarının tamamen donmasına neden olur. Kredi daraldıkça reel ekonomi, yaygın kurumsal iflaslar, artan işsizlik
      ve uzun süreli ekonomik durgunlukla karakterize edilen borç deflasyonuna sürüklenir. Bu nedenle, spekülatif balonların
      değişmez mekaniğini anlamak yalnızca akademik bir lüks değildir; makroihtiyati düzenleme ve sistemik hayatta kalma için
      temel bir ön koşuldur.'
  - paragraph_index: 6
    title: Macroprudential Governance and the Central Banking Dilemma
    content_en: 'The persistent recurrence of speculative manias poses a profound operational dilemma for modern central bankers
      and financial regulators. During the inflation of a bubble, political pressure against regulatory intervention is intense.
      Venture capitalists, real estate tycoons, and elected politicians fiercely denounce any attempts to tighten monetary
      policy, claiming that regulators are suffocating economic innovation and technological disruption. Former Federal Reserve
      Chairman Alan Greenspan famously championed the ''doctrine of benign neglect,'' arguing that central banks cannot identify
      speculative bubbles in real time and should merely wait to clean up the wreckage through interest rate cuts after the
      bubble bursts. However, the catastrophic aftermath of the 2008 crash proved that retrospective cleanup is a ruinous
      strategy. Modern regulatory orthodoxy advocates for countercyclical macroprudential tools: dynamically raising bank
      capital reserve buffers and enforcing strict loan-to-value limits during economic booms to deflate asset bubbles before
      they imperil systemic solvency.'
    content_tr: 'Spekülatif çılgınlıkların kalıcı olarak tekrarlanması, modern merkez bankacıları ve finansal düzenleyiciler
      için derin bir operasyonel ikilem oluşturur. Bir balonun şişmesi sırasında, düzenleyici müdahaleye karşı siyasi baskı
      son derece yoğundur. Girişim sermayedarları, gayrimenkul kodamanları ve seçilmiş politikacılar; düzenleyicilerin ekonomik
      inovasyonu ve teknolojik atılımı boğduğunu iddia ederek para politikasını sıkılaştırmaya yönelik her türlü girişimi
      şiddetle kınarlar. Eski Federal Rezerv Başkanı Alan Greenspan, merkez bankalarının spekülatif balonları gerçek zamanlı
      olarak tanımlayamayacağını ve balon patladıktan sonra faiz indirimleri yoluyla enkazı temizlemeyi beklemeleri gerektiğini
      savunarak ünlü ''iyi huylu ihmal doktrinini'' (doctrine of benign neglect) savundu. Ancak 2008 krizinin felaket niteliğindeki
      sonuçları, geriye dönük temizliğin yıkıcı bir strateji olduğunu kanıtladı. Modern düzenleyici ortodoksluk, döngü karşıtı
      makroihtiyati araçları savunmaktadır: varlık balonlarını sistemik ödeme gücünü tehlikeye atmadan önce söndürmek için
      ekonomik patlamalar sırasında banka sermaye rezerv tamponlarını dinamik olarak artırmak ve katı kredi-değer limitleri
      uygulamak.'
  - paragraph_index: 7
    title: The Moral Hazard of Systemic Bailouts and Future Vulnerability
    content_en: When speculative manias inevitably crash, governments confront the terrifying prospect of total financial
      meltdown. To avert systemic depression, sovereign states execute massive multi-trillion-dollar liquidity bailouts, guaranteeing
      interbank deposits and purchasing impaired corporate debt. While these emergency interventions stabilize immediate panic,
      they introduce catastrophic moral hazard into the financial architecture. By privatizing astronomical profits during
      the speculative bubble while socializing catastrophic losses during the bust, governments implicitly signal to financial
      institutions that high-risk speculative behavior carries state-backed insurance. Financial titans are incentivized to
      become 'too big to fail,' maximizing systemic leverage in the certainty that public treasuries will rescue them when
      the bubble pops. Breaking this destructive cycle requires structural market separation, unyielding executive clawbacks,
      and the unshakeable institutional discipline to allow reckless speculative capital to absorb its own losses.
    content_tr: Spekülatif çılgınlıklar kaçınılmaz olarak çöktüğünde, hükümetler tam bir finansal erime gibi korkunç bir olasılıkla
      karşı karşıya kalırlar. Sistemik bir bunalımı önlemek için egemen devletler, bankalararası mevduatları garanti ederek
      ve batık kurumsal borçları satın alarak devasa çok trilyon dolarlık likidite kurtarma operasyonları yürütürler. Bu acil
      durum müdahaleleri anlık paniği yatıştırsa da, finansal mimariye felaket boyutunda bir ahlaki tehlike (moral hazard)
      sokarlar. Spekülatif balon sırasında astronomik karları özelleştirirken, çöküş sırasında felaket boyutundaki kayıpları
      sosyalleştirerek hükümetler; finansal kurumlara yüksek riskli spekülatif davranışların devlet destekli sigorta taşıdığını
      örtük olarak bildirir. Finans devleri, balon patladığında kamu hazinelerinin onları kurtaracağı kesinliğiyle sistemik
      kaldıracı maksimize ederek 'batamayacak kadar büyük' (too big to fail) olmaya teşvik edilir. Bu yıkıcı döngüyü kırmak;
      yapısal pazar ayrımını, tavizsiz yönetici tazminat geri alımlarını (clawbacks) ve pervasız spekülatif sermayenin kendi
      kayıplarını üstlenmesine izin verecek sarsılmaz kurumsal disiplini gerektirir.
  - paragraph_index: 8
    title: The Timeless Pathology of Euphoria and the Imperative of Vigilance
    content_en: 'To conclude, the mechanics of speculative asset manias demonstrate that financial bubbles are not freak aberrations
      of capitalism, but the natural, endogenous consequence of human psychology operating under elastic monetary credit.
      From Dutch tulip bulbs and the South Sea Company to the 1929 Wall Street crash, the 2000 Dot-Com mania, and modern speculative
      cryptocurrency frenzies, the trajectory remains immutable: displacement, credit expansion, euphoric narrative contagion,
      Ponzi finance, the inevitable Minsky Moment, and catastrophic liquidity liquidation. Neither advanced computational
      financial modeling nor sophisticated algorithmic derivatives have succeeded in eradicating this recurrent cycle of euphoria
      and revulsion. For central bankers, corporate treasurers, and individual investors alike, surviving the turbulent tides
      of financial history demands deep institutional humility, rigorous counter-cyclical discipline, and the unflinching
      courage to remember that market reality always, inevitably, reasserts its gravity.'
    content_tr: 'Sonuç olarak, spekülatif varlık çılgınlıklarının mekaniği, finansal balonların kapitalizmin tuhaf sapmaları
      değil, esnek parasal kredi altında faaliyet gösteren insan psikolojisinin doğal ve içsel bir sonucu olduğunu göstermektedir.
      Hollanda lale soğanlarından ve Güney Denizi Şirketinden 1929 Wall Street çöküşüne, 2000 Dot-Com çılgınlığına ve modern
      spekülatif kripto para furyalarına kadar yörünge değişmez kalır: yer değiştirme, kredi genişlemesi, coşkulu anlatı bulaşması,
      Ponzi finansmanı, kaçınılmaz Minsky Anı ve felaket düzeyinde likidite tasfiyesi. Ne gelişmiş hesaplamalı finansal modelleme
      ne de sofistike algoritmik türevler, bu tekrarlayan öfori ve nefret döngüsünü ortadan kaldırmayı başaramamıştır. Merkez
      bankacıları, kurumsal hazineciler ve bireysel yatırımcılar için finans tarihinin çalkantılı gelgitlerinde hayatta kalmak;
      derin bir kurumsal tevazu, titiz bir döngü karşıtı disiplin ve piyasa gerçekliğinin her zaman, kaçınılmaz olarak kendi
      yerçekimini yeniden dayatacağını hatırlama yönündeki sarsılmaz cesareti gerektirir.'
  vocabulary_annotations:
  - word: speculative
    vocab_id: vocab.speculative
    context_definition_en: Involving high financial risk with the hope of lucrative short-term capital gains.
    context_meaning_tr: Kazançlı kısa vadeli sermaye kazancı umuduyla yüksek finansal risk içeren, spekülatif.
  - word: leverage
    vocab_id: vocab.leverage
    context_definition_en: The use of borrowed capital or debt to amplify the potential return of an investment.
    context_meaning_tr: Bir yatırımın potansiyel getirisini artırmak için borç sermaye veya kaldıraç kullanımı.
  - word: liquidity
    vocab_id: vocab.liquidity
    context_definition_en: The degree to which an asset can be quickly bought or sold in the market without affecting its
      price.
    context_meaning_tr: Bir varlığın fiyatını etkilemeksizin piyasada hızla alınıp satılabilme derecesi, likidite.
  - word: resilience
    vocab_id: vocab.resilience
    context_definition_en: The structural capability of financial institutions to withstand systemic liquidity panics.
    context_meaning_tr: Finansal kurumların sistemik likidite paniklerine dayanabilme yapısal kapasitesi.
  comprehension_questions:
  - id: q_c2_minsky_01
    question_en: What is the foundational premise of Hyman Minsky's Financial Instability Hypothesis?
    question_tr_hint: Hyman Minsky'nin Finansal İstikrarsızlık Hipotezinin temel önermesi nedir?
    options:
    - Financial crises are exclusively caused by physical shortages of paper currency
    - Stock markets only experience declines during leap years according to astronomical cycles
    - Financial instability is generated endogenously by the complacency of prolonged economic stability
    - Government central banks are physically incapable of affecting commercial loan rates
    correct_answer: Financial instability is generated endogenously by the complacency of prolonged economic stability
    explanation_en: Minsky's core insight is that stability is destabilizing; long periods of prosperity breed complacency,
      risk-taking, and endogenous crises.
    explanation_tr: Minsky'nin temel tespiti istikrarın istikrarsızlaştırıcı olduğudur; uzun refah dönemleri rehaveti, risk
      almayı ve içsel krizleri besler.
  - id: q_c2_minsky_02
    question_en: How does Minsky characterize the terminal stage of borrowing known as 'Ponzi finance'?
    question_tr_hint: Minsky borçlanmanın 'Ponzi finansmanı' olarak bilinen son aşamasını nasıl nitelendirir?
    options:
    - Cash flows cover neither principal nor interest, relying entirely on continuous asset price inflation
    - Borrowers pay off all debt using gold bars stored in international bank vaults
    - Companies are prohibited by law from borrowing money from commercial lenders
    - All debts are forgiven automatically by the government every seven years
    correct_answer: Cash flows cover neither principal nor interest, relying entirely on continuous asset price inflation
    explanation_en: In Ponzi finance, incoming cash flows cannot service even interest; borrowers stay afloat solely on the
      hope that asset appreciation will let them refinance.
    explanation_tr: Ponzi finansmanında nakit akışları faizi bile karşılamaz; borçlular yalnızca varlık fiyat artışının yeniden
      borçlanmaya izin vereceği umuduyla ayakta kalır.
  - id: q_c2_minsky_03
    question_en: What sociological rationalization is repeatedly deployed during speculative asset manias?
    question_tr_hint: Spekülatif varlık çılgınlıkları sırasında tekrarlanan sosyolojik rasyonelleştirme nedir?
    options:
    - The belief that extraterrestrial civilisations will purchase all corporate shares
    - The claim that the national currency will be replaced by ancient bronze coins
    - The legal decree that nobody is allowed to sell any investment assets for a decade
    - The assertion that 'this time is different' due to a revolutionary paradigm that voids traditional valuation
    correct_answer: The assertion that 'this time is different' due to a revolutionary paradigm that voids traditional valuation
    explanation_en: Promoters invariably claim 'this time is different,' insisting technological breakthroughs make traditional
      metrics obsolete.
    explanation_tr: Teşvikçiler değişmez bir şekilde 'bu sefer durum farklı' diyerek teknolojik atılımların geleneksel ölçütleri
      hükümsüz kıldığını iddia ederler.
  - id: q_c2_minsky_04
    question_en: What triggers the catastrophic death spiral known as the 'Minsky Moment'?
    question_tr_hint: '''Minsky Anı'' olarak bilinen felaket boyutundaki ölüm sarmalını ne tetikler?'
    options:
    - Central banks destroy all physical banking records in industrial incinerators
    - Borrowers are forced into fire sales to meet margin calls, causing market liquidity to vaporize instantly
    - The international internet backbone suffers a global permanent disconnection
    - Commercial airlines cease all international travel for twelve consecutive months
    correct_answer: Borrowers are forced into fire sales to meet margin calls, causing market liquidity to vaporize instantly
    explanation_en: When credit tightens, over-leveraged borrowers must sell assets simultaneously, collapsing prices and
      destroying liquidity.
    explanation_tr: Kredi daraldığında aşırı kaldıraçlı borçlular varlıklarını aynı anda satmak zorunda kalır, bu da fiyatları
      çökerterek likiditeyi yok eder.
  - id: q_c2_minsky_05
    question_en: What political dilemma complicates regulatory attempts to defuse speculative asset bubbles proactively?
    question_tr_hint: Spekülatif varlık balonlarını proaktif olarak söndürmeye yönelik düzenleyici girişimleri hangi siyasi
      ikilem zorlaştırır?
    options:
    - Lobbies and politicians fiercely protest that regulators are suffocating economic innovation and growth
    - Central bankers are legally forbidden from consulting economic data during elections
    - The constitution requires unanimous popular referendum approval before changing any loan rate
    - Regulatory agencies lose all computer power whenever stock market indexes hit record highs
    correct_answer: Lobbies and politicians fiercely protest that regulators are suffocating economic innovation and growth
    explanation_en: Efforts to cool overheating markets trigger intense backlash from participants who accuse regulators of
      killing innovation and prosperity.
    explanation_tr: Aşırı ısınan piyasaları soğutma çabaları, düzenleyicileri inovasyonu ve refahı öldürmekle suçlayan lobilerin
      yoğun tepkisini çeker.
