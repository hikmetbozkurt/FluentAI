- id: reading.c2.architectural-modularity-and-technical-debt
  title: Architectural Modularity, High Cohesion, and the Thermodynamics of Technical Debt
  cefr_level: C2
  category: engineering_culture
  summary_en: An advanced software engineering treatise on Parnas modularity, loose coupling, boundary enforcement, and the
    strategic management of compounding architectural entropy.
  summary_tr: Parnas modülerliği, gevşek bağlılık, sınır denetimi ve katlanan mimari entropinin stratejik yönetimini inceleyen
    ileri düzey yazılım mühendisliği analizi.
  word_count: 1047
  estimated_reading_minutes: 6
  paragraphs:
  - paragraph_index: 1
    title: The Thermodynamics of Software Evolution
    content_en: 'In 1974, software engineering pioneer Manny Lehman articulated his foundational Laws of Software Evolution,
      proposing that large-scale software systems behave analogously to thermodynamic physical systems. Lehman''s Second Law—the
      Law of Increasing Entropy—posited that as an evolving software application undergoes continuous maintenance, feature
      augmentation, and bug remediation, its internal structural complexity monotonically increases unless deliberate architectural
      work is proactively expended to reduce it. Every hasty patch committed under commercial deadline pressure, every leaky
      abstraction bridging incompatible database models, and every circular dependency introduced between domain modules adds
      micro-frictional debt. Over multi-year time horizons, unchecked architectural entropy degrades developer cognitive comprehension,
      precipitating what industry practitioners term technical sclerosis: an agonizing condition where even trivial user interface
      modifications require weeks of forensic debugging and risk catastrophic production side effects. Static analysis metrics
      substantiate whether modular boundaries are genuinely preserved. Boy-scout refactoring represents a pragmatic approach
      to ongoing technical debt reduction.'
    content_tr: '1974 yılında yazılım mühendisliği öncüsü Manny Lehman, büyük ölçekli yazılım sistemlerinin termodinamik fiziksel
      sistemlere benzer şekilde davrandığını öne sürerek Yazılım Evrimi Yasaları''nı formüle etti. Lehman''ın İkinci Yasası
      —Artan Entropi Yasası— gelişen bir yazılım uygulaması sürekli bakım, özellik artırımı ve hata giderme sürecinden geçtikçe,
      onu azaltmak için bilinçli mimari çalışma proaktif olarak harcanmadığı sürece iç yapısal karmaşıklığının monotonik olarak
      arttığını ileri sürdü. Ticari teslim tarihi baskısı altında yapılan her acele yama, uyumsuz veritabanı modellerini birleştiren
      her sızıntılı soyutlama ve alan modülleri arasında eklenen her dairesel bağımlılık, mikro-sürtünmeli borç ekler. Çok
      yıllı zaman ufuklarında, kontrol edilmeyen mimari entropi geliştiricinin bilişsel kavrayışını bozar; sektör uygulayıcılarının
      ''teknik skleroz'' (kireçlenme) olarak adlandırdığı acı verici bir durumu tetikler: önemsiz bir kullanıcı arayüzü değişikliğinin
      bile haftalarca adli hata ayıklama gerektirdiği ve felaket boyutunda üretim yan etkileri riski taşıdığı bir durum. Statik
      analiz metrikleri, modüler sınırların gerçekten korunup korunmadığını kanıtlar. İzci kuralı refactoring, devam eden
      teknik borç azaltımına yönelik pragmatik bir yaklaşımı temsil eder.'
  - paragraph_index: 2
    title: High Cohesion, Loose Coupling, and Information Hiding
    content_en: The ultimate theoretical antidote to runaway software entropy is rigorous architectural modularity, formally
      established through David Parnas's seminal doctrine of Information Hiding and Larry Constantine's dual metrics of Cohesion
      and Coupling. High cohesion mandates that elements grouped within a module must logically belong together, cooperating
      toward a singular, well-defined domain responsibility. Loose coupling dictates that separate modules must know as little
      about each other's internal execution mechanics as mathematically possible. Parnas demonstrated that true modular decomposition
      is not achieved by segmenting code into arbitrary procedural subroutines or file directories; rather, a true module
      encapsulates a volatile design secret—such as a specific database persistence protocol, hardware interface, or third-party
      payment vendor API—behind an immutable, abstract interface contract.
    content_tr: Dizginsiz yazılım entropisinin nihai teorik panzehiri; David Parnas'ın çığır açan 'Bilgi Gizleme' (Information
      Hiding) doktrini ve Larry Constantine'in ikili Bağıntı (Cohesion) ve Bağımlılık (Coupling) metrikleri aracılığıyla resmi
      olarak kurulan titiz mimari modülerliktir. Yüksek bağıntı, bir modül içinde gruplanan öğelerin mantıksal olarak birbirine
      ait olmasını ve tek, iyi tanımlanmış bir alan sorumluluğuna doğru işbirliği yapmasını zorunlu kılar. Gevşek bağımlılık
      ise ayrı modüllerin birbirlerinin dahili yürütme mekanizmaları hakkında matematiksel olarak mümkün olduğunca az şey
      bilmesi gerektiğini şart koşar. Parnas, gerçek modüler ayrıştırmanın kodu rastgele prosedürel alt programlara veya dosya
      dizinlerine bölerek elde edilemeyeceğini gösterdi; aksine gerçek bir modül, değişmez ve soyut bir arayüz sözleşmesinin
      arkasında belirli bir veritabanı kalıcılık protokolü, donanım arayüzü veya üçüncü taraf ödeme sağlayıcı API'si gibi
      değişken bir tasarım sırrını kapsüller (encapsulate).
  - paragraph_index: 3
    title: The Ward Cunningham Debt Metaphor and Compounding Friction
    content_en: 'In 1992, Ward Cunningham coined the ''technical debt'' metaphor to explain to business stakeholders why rushing
      unrefined code into production carries profound balance sheet implications. Cunningham astutely observed that shipping
      sub-optimal code is economically identical to taking on financial debt: it accelerates short-term delivery velocity,
      but obligates the organization to pay continuous interest in the form of heightened cognitive load, fragile test suites,
      and protracted development cycles. If the principal is never repaid through disciplined refactoring, the compounding
      interest payments eventually consume one hundred percent of engineering capacity, bringing innovation to a dead standstill.
      Modern engineering leaders must distinguish between prudent, tactical debt taken intentionally to capture fleeting market
      opportunities, and reckless, involuntary debt spawned by architectural ignorance and sloppy craftsmanship.'
    content_tr: '1992 yılında Ward Cunningham, iş paydaşlarına ham kodları üretime aceleyle sürmenin neden derin bilanço etkileri
      taşıdığını açıklamak için ''teknik borç'' metaforunu ortaya attı. Cunningham, optimal altı kod göndermenin ekonomik
      olarak finansal borç almakla özdeş olduğunu zekice gözlemledi: kısa vadeli teslimat hızını artırır, ancak organizasyonu
      artan bilişsel yük, kırılgan test paketleri ve uzayan geliştirme döngüleri şeklinde sürekli faiz ödemeye mecbur bırakır.
      Anapara disiplinli yeniden yapılandırma (refactoring) yoluyla asla geri ödenmezse, bileşik faiz ödemeleri sonunda mühendislik
      kapasitesinin yüzde yüzünü tüketerek inovasyonu tamamen durma noktasına getirir. Modern mühendislik liderleri; uçucu
      pazar fırsatlarını yakalamak için kasıtlı olarak alınan ihtiyatlı, taktiksel borç ile mimari cehalet ve özensiz işçiliğin
      doğurduğu pervasız, istemsiz borç arasında ayrım yapmalıdır.'
  - paragraph_index: 4
    title: Hexagonal Architecture, Ports and Adapters, and Domain Purity
    content_en: 'To structurally insulate core enterprise business logic from the turbulent churn of external technology frameworks,
      Alistair Cockburn formulated Hexagonal Architecture, widely recognized as Ports and Adapters, subsequently refined into
      Clean Architecture by Robert C. Martin. The core architectural mandate is the Dependency Inversion Principle: high-level
      business policies must never depend on low-level implementation mechanisms. In a pristine hexagonal codebase, the domain
      core contains pure business entities and invariant workflows, entirely untainted by Android UI framework classes, SQL
      annotations, or JSON serialization decorators. Outward communication is governed through abstract ''Ports'' (interfaces),
      while concrete ''Adapters'' (Room database repositories, Retrofit HTTP clients, Jetpack Compose screens) live exclusively
      on the pluggable architectural perimeter. This strict boundary isolation allows engineers to swap databases or modernize
      UI frameworks without touching a single line of mission-critical domain logic.'
    content_tr: 'Temel kurumsal iş mantığını harici teknoloji çatılarının çalkantılı değişiminden yapısal olarak izole etmek
      için Alistair Cockburn, Bağlantı Noktaları ve Bağdaştırıcılar (Ports and Adapters) olarak geniş çapta tanınan ve daha
      sonra Robert C. Martin tarafından Temiz Mimari''ye (Clean Architecture) dönüştürülen Altıgen Mimari''yi (Hexagonal Architecture)
      formüle etti. Temel mimari zorunluluk, Bağımlılıkların Tersine Çevrilmesi İlkesi''dir (Dependency Inversion Principle):
      üst düzey iş politikaları asla alt düzey uygulama mekanizmalarına bağımlı olmamalıdır. Bozulmamış bir altıgen kod tabanında
      alan çekirdeği; Android UI çatı sınıfları, SQL ek açıklamaları veya JSON serileştirme dekoratörleri tarafından hiçbir
      şekilde lekelenmemiş saf iş varlıklarını ve değişmez iş akışlarını içerir. Dışa doğru iletişim soyut ''Bağlantı Noktaları''
      (arayüzler) aracılığıyla yönetilirken, somut ''Bağdaştırıcılar'' (Room veritabanı depoları, Retrofit HTTP istemcileri,
      Jetpack Compose ekranları) yalnızca takılabilir mimari çevrede yer alır. Bu katı sınır izolasyonu, mühendislerin görev
      açısından kritik alan mantığının tek bir satırına bile dokunmadan veritabanlarını değiştirmesine veya kullanıcı arayüzü
      çatılarını modernize etmesine olanak tanır.'
  - paragraph_index: 5
    title: Sociotechnical Conway Alignment and Sustainable Engineering Governance
    content_en: 'Software architecture cannot be separated from human organizational dynamics, codified canonically in Conway''s
      Law: ''Organizations which design systems are constrained to produce designs which are copies of the communication structures
      of these organizations.'' If an enterprise creates fragmented, siloed development squads, its codebase will inevitably
      fracture into brittle, tightly coupled modules reflecting that dysfunctional topology. Elite engineering cultures counter
      this organizational trap by practicing the ''Inverse Conway Maneuver'': intentionally restructuring autonomous cross-functional
      squads around target architectural domain boundaries. By institutionalizing architectural fitness functions in CI pipelines,
      reserving deliberate capacity for continuous debt remediation, and honoring modular boundary hygiene, technology enterprises
      build antifragile software engines capable of compounding value across decades.'
    content_tr: 'Yazılım mimarisi, Conway Yasası''nda kanonik olarak kodlanan insani örgütsel dinamiklerden ayrılamaz: ''Sistem
      tasarlayan organizasyonlar, bu organizasyonların iletişim yapılarının kopyaları olan tasarımlar üretmeye mahkumdur.''
      Bir işletme parçalanmış, silolanmış geliştirme ekipleri oluşturursa, kod tabanı kaçınılmaz olarak bu işlevsiz topolojiyi
      yansıtan kırılgan, sıkı bağımlı modüllere ayrılacaktır. Seçkin mühendislik kültürleri, ''Ters Conway Manevrası''nı uygulayarak
      bu örgütsel tuzağa karşı koyar: otonom işlevler arası ekipleri hedef mimari alan sınırları etrafında bilinçli olarak
      yeniden yapılandırmak. CI boru hatlarında mimari uygunluk fonksiyonlarını (fitness functions) kurumsallaştırarak, sürekli
      borç düzeltme için bilinçli kapasite ayırarak ve modüler sınır hijyenine saygı göstererek teknoloji işletmeleri, on
      yıllar boyunca değer üretebilen anti-kırılgan yazılım motorları inşa eder.'
  - paragraph_index: 6
    title: Automated Architectural Fitness Functions in CI/CD
    content_en: 'In large-scale enterprise codebases undergoing rapid feature development by hundreds of distributed engineers,
      architectural principles cannot rely on good intentions or manual documentation alone. Over time, well-meaning developers
      inadvertently introduce forbidden dependencies—such as importing a database repository directly into a domain entity
      or bypassing presentation layer interfaces. To enforce boundary hygiene continuously, progressive engineering organizations
      institutionalize ''architectural fitness functions'' within their continuous integration pipelines. Using automated
      code analysis frameworks like ArchUnit, engineers write executable unit tests that assert structural invariants: verifying
      that domain layers contain zero dependencies on external libraries, ensuring circular module dependencies trigger immediate
      build failures, and guaranteeing package encapsulation rules. By embedding architectural governance directly into automated
      build gates, organizations protect modular integrity programmatically.'
    content_tr: 'Yüzlerce dağıtık mühendis tarafından hızlı özellik geliştirme sürecinden geçen büyük ölçekli kurumsal kod
      tabanlarında mimari ilkeler, yalnızca iyi niyetlere veya manuel belgelere dayanamaz. Zamanla, iyi niyetli geliştiriciler
      farkında olmadan yasaklanmış bağımlılıklar getirirler; örneğin bir veritabanı deposunu doğrudan bir alan varlığına aktarmak
      veya sunum katmanı arayüzlerini atlamak gibi. Sınır hijyenini sürekli olarak uygulamak için ilerici mühendislik organizasyonları,
      sürekli entegrasyon boru hatları içinde ''mimari uygunluk fonksiyonlarını'' (architectural fitness functions) kurumsallaştırır.
      ArchUnit gibi otomatik kod analiz çatılarını kullanan mühendisler, yapısal değişmezleri doğrulayan çalıştırılabilir
      birim testler yazarlar: alan katmanlarının harici kütüphanelere sıfır bağımlılık içerdiğini doğrulamak, dairesel modül
      bağımlılıklarının derleme hatalarını anında tetiklemesini sağlamak ve paket kapsülleme kurallarını garanti etmek. Mimari
      yönetişimi doğrudan otomatik derleme kapılarına gömerek kurumlar, modüler bütünlüğü programatik olarak korurlar.'
  - paragraph_index: 7
    title: Technical Debt Economics and Continuous Refactoring Culture
    content_en: 'Ultimately, managing architectural modularity is an economic discipline governed by disciplined capital allocation.
      In modern corporate finance, neglecting maintenance on physical manufacturing assets leads to asset impairment write-downs;
      similarly, neglecting technical debt in software assets leads to systemic engineering bankruptcy. Elite technology enterprises
      combat this entropy by institutionalizing non-negotiable engineering capacity—typically twenty percent of every sprint
      cycle—dedicated exclusively to structural refactoring, dependency upgrades, and technical debt retirement. Rather than
      attempting massive, high-risk multi-year system rewrites that frequently end in catastrophic project abandonment, mature
      engineering teams practice the ''Boy Scout Rule'': leaving the codebase cleaner than they found it with every commit.
      By respecting modularity as a living, evolving ecosystem, technology companies preserve agility and ensure software
      longevity across generational technological shifts.'
    content_tr: 'Nihayetinde mimari modülerliği yönetmek, disiplinli sermaye tahsisi tarafından yönetilen ekonomik bir disiplindir.
      Modern kurumsal finansta, fiziksel üretim varlıklarının bakımını ihmal etmek varlık değer düşüklüğü zararlarına yol
      açar; benzer şekilde, yazılım varlıklarındaki teknik borcu ihmal etmek sistemik mühendislik iflasına yol açar. Seçkin
      teknoloji işletmeleri, her sprint döngüsünün pazarlık konusu edilemez bir mühendislik kapasitesini —tipik olarak yüzde
      yirmisini— yalnızca yapısal yeniden yapılandırmaya, bağımlılık yükseltmelerine ve teknik borç tasfiyesine ayırarak bu
      entropiyle mücadele eder. Çoğunlukla felaket boyutunda proje terkleriyle sonuçlanan devasa, yüksek riskli çok yıllı
      sistem yeniden yazımlarına kalkışmak yerine olgun mühendislik ekipleri ''İzci Kuralı''nı (Boy Scout Rule) uygular: her
      commit ile kod tabanını bulduklarından daha temiz bırakmak. Modülerliğe yaşayan, gelişen bir ekosistem olarak saygı
      göstererek teknoloji şirketleri çevikliği korur ve nesiller boyu teknolojik değişimler boyunca yazılımın uzun ömürlülüğünü
      sağlar.'
  - paragraph_index: 8
    title: 'Thermodynamic Mastery: Building Software to Outlive Decades'
    content_en: In the final architectural synthesis, conquering software entropy and mastering technical debt is the ultimate
      measure of elite technology craftsmanship. Software codebases do not deteriorate because silicon chips wear out; they
      degrade because human organizational complexity, deadline shortcuts, and leaky modular abstractions relentlessly corrode
      structural coherence over time. By faithfully institutionalizing David Parnas's information hiding doctrines, enforcing
      high cohesion and loose coupling through Hexagonal domain purity, automating architectural fitness functions within
      CI/CD pipelines, and dedicating deliberate sprint capacity to continuous refactoring, engineering organizations defy
      Lehman's Law of Increasing Entropy. Pristine architectural modularity transforms enterprise software from a depreciating,
      fragile liability into a vibrant, antifragile asset capable of compounding commercial value across generations of technological
      innovation. In conclusion, treating architectural modularity as a primary asset rather than a secondary cosmetic concern
      is the ultimate differentiator of enduring technology firms. Codebases that enforce high cohesion, loose coupling, and
      hexagonal domain purity adapt effortlessly to shifting market demands, new cloud platforms, and evolving business paradigms.
      By investing continuously in technical debt remediation, elite software organizations build resilient systems that compound
      commercial value across decades of continuous innovation.
    content_tr: Nihai mimari sentezde, yazılım entropisini fethetmek ve teknik borçta ustalaşmak, seçkin teknoloji işçiliğinin
      nihai ölçüsüdür. Yazılım kod tabanları silikon çipler yıprandığı için bozulmaz; insani örgütsel karmaşıklık, teslim
      tarihi kestirmeleri ve sızıntılı modüler soyutlamalar zamanla yapısal tutarlılığı amansızca aşındırdığı için bozulurlar.
      David Parnas'ın bilgi gizleme doktrinlerini sadakatle kurumsallaştırarak, Altıgen alan saflığı yoluyla yüksek bağıntı
      ve gevşek bağımlılığı uygulayarak, CI/CD boru hatlarında mimari uygunluk fonksiyonlarını otomatikleştirerek ve bilinçli
      sprint kapasitesini sürekli yeniden yapılandırmaya adayarak mühendislik organizasyonları; Lehman'ın Artan Entropi Yasası'na
      meydan okurlar. Bozulmamış mimari modülerlik, kurumsal yazılımı değer kaybeden kırılgan bir yükümlülükten, nesiller
      boyu süren teknolojik yenilikler boyunca ticari değer üretebilen canlı, anti-kırılgan bir varlığa dönüştürür. Sonuç
      olarak, mimari modülerliği ikincil bir kozmetik endişe yerine birincil bir varlık olarak ele almak, kalıcı teknoloji
      firmalarının nihai ayırt edici özelliğidir. Yüksek bağıntı, gevşek bağımlılık ve altıgen alan saflığını uygulayan kod
      tabanları; değişen pazar taleplerine, yeni bulut platformlarına ve gelişen iş paradigmalarına zahmetsizce uyum sağlar.
      Teknik borç düzeltmeye sürekli yatırım yaparak seçkin yazılım organizasyonları, onlarca yıllık sürekli inovasyon boyunca
      ticari değer üreten dayanıklı sistemler inşa ederler.
  vocabulary_annotations:
  - word: cohesion
    vocab_id: vocab.cohesion
    context_definition_en: The degree to which elements within a software module belong together and execute a single focused
      purpose.
    context_meaning_tr: Bir yazılım modülü içindeki öğelerin birbirine ait olma ve odaklanmış tek bir amacı yürütme derecesi,
      uyum.
  - word: entropy
    vocab_id: vocab.entropy
    context_definition_en: The inexorable drift toward architectural disorder and complexity within expanding codebases.
    context_meaning_tr: Genişleyen kod tabanlarında mimari düzensizlik ve karmaşıklığa doğru kaçınılmaz kayma, entropi.
  - word: substantiate
    vocab_id: vocab.substantiate
    context_definition_en: To validate and demonstrate architectural quality through empirical telemetry and automated tests.
    context_meaning_tr: Mimari kaliteyi ampirik telemetri ve otomatik testlerle kanıtlamak ve somutlaştırmak.
  - word: pragmatic
    vocab_id: vocab.pragmatic
    context_definition_en: Balancing pure theoretical design patterns against realistic commercial deadlines.
    context_meaning_tr: Saf teorik tasarım kalıplarını gerçekçi ticari teslim tarihleriyle dengeleyen, pragmatik.
  comprehension_questions:
  - id: q_c2_mod_01
    question_en: What revolutionary principle did David Parnas introduce regarding software modular decomposition in 1972?
    question_tr_hint: David Parnas 1972 yılında yazılım modüler ayrıştırması konusunda hangi devrimci ilkeyi ortaya koydu?
    options:
    - Software modules must never exceed exactly fifty lines of physical assembly code
    - Modules must be organized around information hiding, encapsulating volatile design decisions behind abstract interfaces
    - All computer programs must be written as a single continuous monolithic script
    - Developers must recompile the entire operating system every time a function is called
    correct_answer: Modules must be organized around information hiding, encapsulating volatile design decisions behind abstract
      interfaces
    explanation_en: Parnas showed that modules should conceal volatile design choices behind clean interfaces, preventing
      changes from rippling across systems.
    explanation_tr: Parnas modüllerin değişken tasarım tercihlerini temiz arayüzlerin arkasına gizlemesi ve böylece değişikliklerin
      sistem genelinde dalgalanmasını önlemesi gerektiğini göstermiştir.
  - id: q_c2_mod_02
    question_en: What defines the architectural ideal of loose coupling and high cohesion?
    question_tr_hint: Gevşek bağlılık ve yüksek uyumun mimari idealini ne tanımlar?
    options:
    - All application servers are physically connected using loose copper wiring cables
    - Every software developer is required to write code in five different programming languages simultaneously
    - Software services share a single universal database table without any access restrictions
    - Modules focus intensely on a single domain while interacting with others strictly via minimal, stable contracts
    correct_answer: Modules focus intensely on a single domain while interacting with others strictly via minimal, stable
      contracts
    explanation_en: Loose coupling minimizes inter-module dependency, while high cohesion ensures elements within a module
      serve a unified, focused purpose.
    explanation_tr: Gevşek bağlılık modüller arası bağımlılığı en aza indirirken, yüksek uyum modül içindeki öğelerin odaklanmış
      tek bir amaca hizmet etmesini sağlar.
  - id: q_c2_mod_03
    question_en: According to Ward Cunningham's technical debt metaphor, what happens when architectural shortcuts are never
      refactored?
    question_tr_hint: Ward Cunningham'ın teknik borç metaforuna göre mimari kestirmeler asla iyileştirilmediğinde ne olur?
    options:
    - Commercial banks seize the corporation's physical office computers to cover unpaid loans
    - Software programs automatically erase their own databases to free up storage space
    - Compounding interest accumulates, forcing developers to navigate fragile hacks and driving velocity toward a halt
    - Computer monitors experience physical screen fractures due to corrupted memory data
    correct_answer: Compounding interest accumulates, forcing developers to navigate fragile hacks and driving velocity toward
      a halt
    explanation_en: Just like financial debt, unaddressed technical shortcuts accumulate compounding interest in the form
      of friction, slowing progress to a crawl.
    explanation_tr: Tıpkı finansal borç gibi giderilmeyen teknik kestirmeler de sürtünme şeklinde faiz biriktirerek ilerlemeyi
      durma noktasına getirir.
  - id: q_c2_mod_04
    question_en: How do automated 'architectural fitness functions' preserve structural boundaries in growing engineering
      teams?
    question_tr_hint: Otomatik 'mimari uygunluk fonksiyonları' büyüyen mühendislik ekiplerinde yapısal sınırları nasıl korur?
    options:
    - They run static code analysis in CI pipelines to enforce architectural invariants and fail builds that violate rules
    - They monitor developer heart rates and lock keyboard access when stress is detected
    - They automatically delete any pull request that contains fewer than one thousand lines of code
    - They translate all software documentation into ancient Greek to prevent unauthorized reading
    correct_answer: They run static code analysis in CI pipelines to enforce architectural invariants and fail builds that
      violate rules
    explanation_en: Fitness functions act as automated gates in CI pipelines, verifying rules like layering and coupling automatically
      on every build.
    explanation_tr: Uygunluk fonksiyonları CI boru hatlarında otomatik kapılar gibi çalışarak katmanlaşma ve bağlılık kurallarını
      her derlemede otomatik doğrular.
  - id: q_c2_mod_05
    question_en: What cultural practice does the author argue is necessary to sustain software architecture longevity?
    question_tr_hint: Yazar yazılım mimarisinin uzun ömürlü olmasını sürdürmek için hangi kültürel uygulamanın gerekli olduğunu
      savunmaktadır?
    options:
    - Rewriting the entire company codebase from scratch in a new language every twelve months
    - Prohibiting developers from testing software code before deploying directly to production users
    - Eliminating all code reviews and allowing any employee to merge pull requests without approval
    - Allocating non-negotiable engineering capacity to continuous refactoring, boundary sharpening, and debt reduction
    correct_answer: Allocating non-negotiable engineering capacity to continuous refactoring, boundary sharpening, and debt
      reduction
    explanation_en: Sustainable engineering demands dedicating 20-30% of engineering bandwidth to continuous maintenance,
      debt reduction, and refactoring.
    explanation_tr: Sürdürülebilir mühendislik geliştirme kapasitesinin %20-30'unun sürekli bakıma, borç azaltımına ve kod
      iyileştirmeye ayrılmasını gerektirir.
