  title: What was the first animal that ever lived on Earth?
  cefr_level: B2
  category: technology
  summary_en: 'Nobody knows for sure what the first animal was, but likely it was small, soft and ocean-dwelling
    – like this comb jelly, but simpler. (Source: The Conversation, CC BY-ND)'
