    The Conversation, CC BY-ND).'
  word_count: 215
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    content_en: Nobody knows for sure what the first animal was, but likely it was small, soft and ocean-dwelling
      – like this comb jelly, but simpler. Rob Atherton/iStock via Getty Images Plus
    content_tr: Bu paragraf 'What was the first animal that ever lived on Earth?' makalesinin 1. bölümünü sunar
      (The Conversation, CC BY-ND).
  - paragraph_index: 2
    content_en: Curious Kids is a series for children of all ages. If you have a question you’d like an expert to
      answer, send it to CuriousKidsUS@theconversation.com.
    content_tr: Bu paragraf 'What was the first animal that ever lived on Earth?' makalesinin 2. bölümünü sunar
      (The Conversation, CC BY-ND).
  - paragraph_index: 3
    content_en: What was the first animal on Earth? – Keira, age 10, Eugene, Oregon, and Julian, age 7, South Bend,
      Indiana
    content_tr: Bu paragraf 'What was the first animal that ever lived on Earth?' makalesinin 3. bölümünü sunar
      (The Conversation, CC BY-ND).
  - paragraph_index: 4
    content_en: Imagine climbing into a time machine and setting the dial for when the very first animal was alive.
      You would need to travel really, really far back in time.
    content_tr: Bu paragraf 'What was the first animal that ever lived on Earth?' makalesinin 4. bölümünü sunar
      (The Conversation, CC BY-ND).
  - paragraph_index: 5
    content_en: You would blow past the dinosaurs, which showed up about 230 million years ago. Keep going and you’d
      pass coil-shelled ammonites that swam in the oceans starting 450 million years ago, and then trilobites, armored
      animals that scuttled across the seafloor more than 520 million years ago. Further still, around 558 million
      years ago, you would meet Dickinsonia, a tiny, flat, ribbed oval only a few millimeters thick that looks more
      like a squashed pancake than any animal you know.
    content_tr: Bu paragraf 'What was the first animal that ever lived on Earth?' makalesinin 5. bölümünü sunar
      (The Conversation, CC BY-ND).
  - paragraph_index: 6
    content_en: We are biologists who study single-celled life called protists. How complex life such as human beings
      showed up in the first place is one of the major questions in our field.
    content_tr: Bu paragraf 'What was the first animal that ever lived on Earth?' makalesinin 6. bölümünü sunar
      (The Conversation, CC BY-ND).
