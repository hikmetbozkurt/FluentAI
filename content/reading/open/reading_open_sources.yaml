- id: reading.b2.open-conv-nvidia-isn-t-the-first-company-to-dump-a-misbeha
  title: Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the interest of corporate
    boards to act
  cefr_level: B2
  category: technology
  summary_en: 'Nvidia''s board is now coming under more scrutiny for its own oversight after it ousted its CEO,
    Jensen Huang. (Source: The Conversation, CC BY-ND)'
  summary_tr: '''Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the interest of
    corporate boards to act'' başlıklı akademik/güncel makale (Kaynak: The Conversation, CC BY-ND).'
  word_count: 258
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    content_en: Nvidia's board is now coming under more scrutiny for its own oversight after it ousted its CEO,
      Jensen Huang. Joel Saget/AFP via Getty Images
    content_tr: Bu paragraf 'Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the
      interest of corporate boards to act' makalesinin 1. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 2
    content_en: 'The story may sound familiar: The CEO of one of the largest and most powerful tech companies resigns
      over sexual misconduct allegations. The move causes the company’s stock to drop by more than 10%, wiping out
      billions in value. It also raises scrutiny of the company’s board of directors and whether it made the right
      decisions ahead of the crisis.'
    content_tr: Bu paragraf 'Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the
      interest of corporate boards to act' makalesinin 2. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 3
    content_en: This could easily describe the turmoil facing Nvidia after the ouster of its CEO, Jensen Huang.
      But it actually transpired over 15 years ago at Hewlett Packard, under CEO Mark Hurd.
    content_tr: Bu paragraf 'Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the
      interest of corporate boards to act' makalesinin 3. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 4
    content_en: Jensen Huang is just the latest in a long line of CEOs who lost their jobs over personal misconduct.
      And as with HP, scrutiny is shifting from his behavior to his board – and the decisions that led to his exit.
    content_tr: Bu paragraf 'Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the
      interest of corporate boards to act' makalesinin 4. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 5
    content_en: Prominent industry leaders are questioning the board’s decision to oust him. They include Peter
      Steinberger of OpenAI, Anduril Industries co-founder Palmer Luckey, Elon Musk, Replit CEO Amjad Masad, Epic
      Games CEO Tim Sweeney and Y Combinator CEO Garry Tan. Meanwhile, an internal petition allegedly signed by
      more than 1,600 Nvidia employees has also called for Jensen Huang’s reinstatement.
    content_tr: Bu paragraf 'Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the
      interest of corporate boards to act' makalesinin 5. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 6
    content_en: As a scholar of management who has researched corporate misconduct, I believe the board made the
      right call. After collecting instances of CEO personal misconduct dating back to 1995, I have repeatedly found
      that doing nothing, as a board, is worse than doing something.
    content_tr: Bu paragraf 'Nvidia isn’t the first company to dump a misbehaving CEO – history shows it’s in the
      interest of corporate boards to act' makalesinin 6. bölümünü sunar (The Conversation, CC BY-ND).
