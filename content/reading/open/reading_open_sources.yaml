- id: reading.b1.open-conv-a-fungus-that-can-survive-in-chernobyl-could-hel
  title: A fungus that can survive in Chernobyl could help create materials that trap and break down nerve agents
    and pesticides
  cefr_level: B1
  category: technology
  summary_en: 'Scientists are researching fungi to develop specialized protective equipment for workers exposed
    to pesticides. (Source: The Conversation, CC BY-ND)'
  summary_tr: '''A fungus that can survive in Chernobyl could help create materials that trap and break down nerve
    agents and pesticides'' başlıklı akademik/güncel makale (Kaynak: The Conversation, CC BY-ND).'
  word_count: 294
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    content_en: Scientists are researching fungi to develop specialized protective equipment for workers exposed
      to pesticides. Vithun Khamsong/Moment via Getty Images
    content_tr: Bu paragraf 'A fungus that can survive in Chernobyl could help create materials that trap and break
      down nerve agents and pesticides' makalesinin 1. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 2
    content_en: Deep inside the Chernobyl exclusion zone, where radiation levels have remained unsafe for people
      for the past 40 years, black molds climb the walls of the damaged former nuclear plant in Ukraine. They’re
      entirely undeterred by the radiation – in fact, some fungi even grow toward it.
    content_tr: Bu paragraf 'A fungus that can survive in Chernobyl could help create materials that trap and break
      down nerve agents and pesticides' makalesinin 2. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 3
    content_en: The same type of species, Cladosporium sphaerospermum, has grown on the International Space Station,
      about 250 miles (400 kilometers) above the surface of the Earth, in an experiment to test its resistance to
      radiation. Scientists found that it appeared to block a small amount of incoming radiation, and part of why
      comes down to a pigment called melanin.
    content_tr: Bu paragraf 'A fungus that can survive in Chernobyl could help create materials that trap and break
      down nerve agents and pesticides' makalesinin 3. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 4
    content_en: I used to think of melanin the way most people do – as a pigment that gives skin, hair and eyes
      their color. That changed early in my Ph.D. research when I read a 2019 study from the materials science lab
      I was joining that described how to make a fungal form of melanin in the lab. I was surprised by where this
      pigment shows up in nature, including in fungi growing at Chernobyl.
    content_tr: Bu paragraf 'A fungus that can survive in Chernobyl could help create materials that trap and break
      down nerve agents and pesticides' makalesinin 4. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 5
    content_en: Melanin comprises a family of pigments. The melanin in human skin, called eumelanin, is built from
      nitrogen-containing building blocks. The melanin in many fungi, called allomelanin, is built from a different,
      nitrogen-free building block. That difference in structure gives it some unusual properties.
    content_tr: Bu paragraf 'A fungus that can survive in Chernobyl could help create materials that trap and break
      down nerve agents and pesticides' makalesinin 5. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 6
    content_en: Scientists think allomelanin is a large part of why these fungi can live in such places. Over the
      course of my doctoral research, I learned that melanin does much more than add color. It holds onto metals,
      absorbs ultraviolet light, converts light into heat and helps produce the colors of some bird feathers.
    content_tr: Bu paragraf 'A fungus that can survive in Chernobyl could help create materials that trap and break
      down nerve agents and pesticides' makalesinin 6. bölümünü sunar (The Conversation, CC BY-ND).
