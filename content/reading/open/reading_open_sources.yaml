- id: reading.b2.open-conv-whether-it-s-sister-or-your-own-sister-the-burde
  title: Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents puts on women is no
    joke
  cefr_level: B2
  category: business_strategy
  summary_en: 'A ''Saturday Night Live'' parody commercial delivered a sobering message to America about a widespread
    problem. (Source: The Conversation, CC BY-ND)'
  summary_tr: '''Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents puts on women
    is no joke'' başlıklı akademik/güncel makale (Kaynak: The Conversation, CC BY-ND).'
  word_count: 180
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    content_en: A 'Saturday Night Live' parody commercial delivered a sobering message to America about a widespread
      problem. Alican Lazutti/iStock via Getty Images Plus
    content_tr: Bu paragraf 'Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents
      puts on women is no joke' makalesinin 1. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 2
    content_en: “Sister,” the “Saturday Night Live” sketch about daughters who take care of their aging parents,
      hit home for a lot of people.
    content_tr: Bu paragraf 'Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents
      puts on women is no joke' makalesinin 2. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 3
    content_en: The make-believe ad features several men who say they love their father but don’t want to interrupt
      their own lives to help him or deal with his chronic health conditions. So they’ve turned to a handy service,
      which costs nothing, by texting “Dad fell” to their sister.
    content_tr: Bu paragraf 'Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents
      puts on women is no joke' makalesinin 3. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 4
    content_en: “Years of internalized sexism warps Sister’s brain into thinking caretaking is her responsibility,
      and somehow not yours,” a man in a doctor-evoking white coat explains.
    content_tr: Bu paragraf 'Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents
      puts on women is no joke' makalesinin 4. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 5
    content_en: One reason “Sister,” which stars Jane Wickline as an exhausted caregiver and John Mulaney as her
      smug brother, packed such a big punch is that more of us find ourselves in her shoes.
    content_tr: Bu paragraf 'Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents
      puts on women is no joke' makalesinin 5. bölümünü sunar (The Conversation, CC BY-ND).
  - paragraph_index: 6
    content_en: My sister was one of 43.5 million Americans providing care to a loved one at the time. That number
      has since risen to 63 million – about 1 in 4 adults.
    content_tr: Bu paragraf 'Whether it’s ‘Sister’ or your own sister, the burden that caring for aging parents
      puts on women is no joke' makalesinin 6. bölümünü sunar (The Conversation, CC BY-ND).
