- id: reading.c1.open-conv-as-us-farms-consolidate-small-town-america-has-b
  title: As US farms consolidate, small-town America has been losing out
  cefr_level: C1
  category: business_strategy
  summary_en: 'The farmer-poet Wendell Berry once described a dystopian world where society is singularly directed
    toward “the objective” – a relentless drive for industrial extraction that leads to the destruction of nature
    and communities. (Source: The Conversation, CC BY-ND)'
  summary_tr: '''As US farms consolidate, small-town America has been losing out'' başlıklı akademik/güncel makale
    (Kaynak: The Conversation, CC BY-ND).'
  word_count: 194
  estimated_reading_minutes: 1
  paragraphs:
  - paragraph_index: 1
    content_en: The farmer-poet Wendell Berry once described a dystopian world where society is singularly directed
      toward “the objective” – a relentless drive for industrial extraction that leads to the destruction of nature
      and communities.
    content_tr: Bu paragraf 'As US farms consolidate, small-town America has been losing out' makalesinin 1. bölümünü
      sunar (The Conversation, CC BY-ND).
  - paragraph_index: 2
    content_en: The idea captured Berry’s concerns about the industrialization of agriculture and the expansion
      of natural resource extraction that became prominent across rural America in the latter decades of the 20th
      century.
    content_tr: Bu paragraf 'As US farms consolidate, small-town America has been losing out' makalesinin 2. bölümünü
      sunar (The Conversation, CC BY-ND).
  - paragraph_index: 3
    content_en: Over nine decades, Berry watched how agribusinesses’ and farm owners’ pursuit of productive efficiency
      and maximum profits led to machines and synthetic chemicals replacing human farm labor, and the replacement
      of diversified farms with monocropping and concentrated animal-feeding operations. Across the U.S., he saw
      small farms disappear, often consolidated into vast corporate businesses with absent owners.
    content_tr: Bu paragraf 'As US farms consolidate, small-town America has been losing out' makalesinin 3. bölümünü
      sunar (The Conversation, CC BY-ND).
  - paragraph_index: 4
    content_en: What gets lost in this pursuit of production and profit, he noted, are community, human dignity
      and flourishing, natural beauty and ecological well-being.
    content_tr: Bu paragraf 'As US farms consolidate, small-town America has been losing out' makalesinin 4. bölümünü
      sunar (The Conversation, CC BY-ND).
  - paragraph_index: 5
    content_en: People are the heart of rural towns, like Waubeka, Wis. Farm consolidation has shrunk many of America’s
      rural towns since the mid 1900s.
    content_tr: Bu paragraf 'As US farms consolidate, small-town America has been losing out' makalesinin 5. bölümünü
      sunar (The Conversation, CC BY-ND).
  - paragraph_index: 6
    content_en: As agriculture researchers and rural sociologists, we, like Berry, have seen how the industrialization
      of agriculture has changed the face of rural America and hollowed out its communities.
    content_tr: Bu paragraf 'As US farms consolidate, small-town America has been losing out' makalesinin 6. bölümünü
      sunar (The Conversation, CC BY-ND).
