    explanation_tr: 3. paragraf köprü kuran sermayenin farklı grupları birbirine bağlayıp empati geliştirdiğini belirtir.
  - id: q_reading_c1_third-places-civic-infrastructure_03
    question_en: Why does Paragraph 4 argue modern corporate coffee chains fail as authentic third places?
    question_tr_hint: 4. paragraf modern kurumsal kahve zincirlerinin neden otantik üçüncü mekanlar olarak başarısız olduğunu
      savunmaktadır?
    options:
    - They refuse to sell any hot beverages or coffee beans to adult customers.
    - They prioritize rapid drive-through turnover and commercial transactions while discouraging lingering.
    - They force customers to participate in mandatory public political rallies.
    - They are legally restricted to operating only during midnight hours.
    correct_answer: They prioritize rapid drive-through turnover and commercial transactions while discouraging lingering.
    explanation_en: Paragraph 4 explains that corporate chains prioritize drive-throughs and discourage extended lingering.
    explanation_tr: 4. paragraf kurumsal zincirlerin arabaya servise öncelik verip uzun oturmayı engellediğini açıklar.
