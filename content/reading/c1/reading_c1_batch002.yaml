  comprehension_questions:
  - id: q_reading_c1_third-places-civic-infrastructure_01
    question_en: According to Ray Oldenburg's framework in Paragraph 1, what is the core societal role of 'third places'?
    question_tr_hint: 1. paragrafta Ray Oldenburg'un çerçevesine göre 'üçüncü mekanların' temel toplumsal rolü nedir?
    options:
    - To mandate strict economic production quotas for corporate factory workers.
    - To permanently replace private residential housing with dormitory facilities.
    - To serve as high-security government military research command centers.
    - To host informal, regular gatherings beyond domestic obligations and formal professional employment.
    correct_answer: To host informal, regular gatherings beyond domestic obligations and formal professional employment.
    explanation_en: Paragraph 1 explains that third places are informal gathering spots beyond domestic duty and employment.
    explanation_tr: 1. paragraf üçüncü mekanların evsel görevlerin ve işin ötesinde gayri resmi toplanma alanları olduğunu
      açıklar.
  - id: q_reading_c1_third-places-civic-infrastructure_02
    question_en: What sociological function does bridging social capital perform according to Paragraph 3?
    question_tr_hint: 3. paragrafa göre köprü kuran sosyal sermaye hangi sosyolojik işlevi yerine getirir?
    options:
    - It eliminates the financial need for bridges and physical highway infrastructure.
    - It requires citizens to cut off all communication with members of other cultures.
    - It enforces strict ideological uniformity among homogeneous religious enclaves.
    - It connects disparate demographic groups across socio-economic divides, cultivating cross-demographic empathy.
    correct_answer: It connects disparate demographic groups across socio-economic divides, cultivating cross-demographic
