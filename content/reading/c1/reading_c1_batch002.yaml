  comprehension_questions:
  - id: q_reading_c1_quantum-cryptographic-resilience_01
    question_en: Why does Peter Shor's 1994 algorithm pose an existential threat to modern cryptography in Paragraph 2?
    question_tr_hint: 2. paragrafta Peter Shor'un 1994 tarihli algoritması neden modern kriptografiye varoluşsal bir tehdit
      oluşturmaktadır?
    options:
    - It proves that all mathematical prime numbers are identical to zero.
    - It solves integer factorization and discrete logarithms in polynomial time using quantum superposition.
    - It prevents software developers from writing computer code in English.
    - It physically overheats classical supercomputers until their semiconductor circuits melt.
    correct_answer: It solves integer factorization and discrete logarithms in polynomial time using quantum superposition.
    explanation_en: Paragraph 2 explains Shor's algorithm solves factorization and logarithms in polynomial time.
    explanation_tr: 2. paragraf Shor'un algoritmasının çarpanlara ayırma ve logaritmaları polinom zamanda çözdüğünü açıklar.
  - id: q_reading_c1_quantum-cryptographic-resilience_02
    question_en: What is the primary danger of the 'Harvest Now, Decrypt Later' espionage strategy in Paragraph 3?
    question_tr_hint: 3. paragrafta 'Şimdi Topla, Sonra Deşifre Et' casusluk stratejisinin temel tehlikesi nedir?
    options:
    - Adversaries stockpile encrypted data today to decrypt it retrospectively once quantum computers emerge.
    - Hostile hackers force computers to consume twice as much electrical battery power.
    - Adversaries immediately erase all electronic bank accounts across the globe.
    - Cyber syndicates destroy the physical fiber-optic cables beneath the ocean.
    correct_answer: Adversaries stockpile encrypted data today to decrypt it retrospectively once quantum computers emerge.
    explanation_en: Paragraph 3 warns adversaries store ciphertext to decrypt it retrospectively with quantum hardware.
    explanation_tr: 3. paragraf düşmanların verileri depolayıp gelecekte kuantum donanımıyla geriye dönük çözeceğini belirtir.
  - id: q_reading_c1_quantum-cryptographic-resilience_03
    question_en: On what mathematical foundation does lattice-based cryptography rely according to Paragraph 4?
    question_tr_hint: 4. paragrafa göre kafes tabanlı kriptografi hangi matematiksel temele dayanmaktadır?
    options:
    - Simple arithmetic subtraction of small two-digit integer numbers.
    - Calculating the gravitational pull of planets across the solar system.
    - Memorizing ancient Greek geometric architectural blueprints.
    - The geometric difficulty of finding specific coordinates in high-dimensional lattices.
    correct_answer: The geometric difficulty of finding specific coordinates in high-dimensional lattices.
    explanation_en: Paragraph 4 details that lattice cryptography relies on hard geometric problems in high dimensions.
    explanation_tr: 4. paragraf kafes kriptografisinin yüksek boyutlardaki zor geometrik problemlere dayandığını açıklar.
  - id: q_reading_c1_quantum-cryptographic-resilience_04
    question_en: What engineering drawback is associated with lattice-based post-quantum algorithms in Paragraph 5?
    question_tr_hint: 5. paragrafta kafes tabanlı kuantum sonrası algoritmalarla hangi mühendislik dezavantajı ilişkilendirilmektedir?
    options:
    - They require users to manually type out thousands of random numbers by hand.
    - They can only operate on computers that are submerged in liquid nitrogen.
    - Significantly larger key and certificate sizes that introduce transmission latency and memory overhead.
    - They permanently delete the computer operating system after three uses.
    correct_answer: Significantly larger key and certificate sizes that introduce transmission latency and memory overhead.
    explanation_en: Paragraph 5 points out enlarged key sizes span kilobytes, creating latency and RAM constraints.
    explanation_tr: 5. paragraf büyüyen anahtar boyutlarının gecikme ve bellek kısıtları yarattığını belirtir.
  - id: q_reading_c1_quantum-cryptographic-resilience_05
    question_en: What physical principle allows Quantum Key Distribution (QKD) to detect eavesdroppers in Paragraph 7?
    question_tr_hint: 7. paragrafta hangi fiziksel ilke Kuantum Anahtar Dağıtımı'nın (QKD) gizli dinleyicileri tespit etmesini
      sağlar?
    options:
    - Thermal cameras automatically photograph the face of any nearby intruder.
    - Measuring polarized photon streams inevitably perturbs their quantum state, revealing intrusion.
    - Eavesdroppers are struck by sudden acoustic alarm sirens emitted by cables.
    - Fiber-optic cables instantly self-destruct if someone touches their casing.
    correct_answer: Measuring polarized photon streams inevitably perturbs their quantum state, revealing intrusion.
    explanation_en: Paragraph 7 explains that measuring photons perturbs their quantum state due to quantum principles.
    explanation_tr: 7. paragraf fotonları ölçmenin kuantum durumlarını kaçınılmaz olarak bozduğunu açıklar.
