    options:
    - By introducing interactive features like chat shout-outs that fabricate pseudo-reciprocity.
    - By shutting down all digital smartphone networks during nighttime hours.
    - By completely eliminating all human faces from digital video streams.
    - By requiring users to pay thousands of dollars before watching any video.
    correct_answer: By introducing interactive features like chat shout-outs that fabricate pseudo-reciprocity.
    explanation_en: Paragraph 2 notes that interactive features like chats and shout-outs fabricate an illusion of pseudo-reciprocity.
    explanation_tr: 2. paragraf sohbet ve selam gibi etkileşimli özelliklerin sahte bir karşılıklılık ürettiğini açıklar.
  - id: q_reading_c1_parasocial-relationships-digital-age_03
    question_en: Why do commercial creators share intimate mental health struggles according to Paragraph 3?
    question_tr_hint: 3. paragrafa göre ticari içerik üreticileri neden samimi ruh sağlığı mücadelelerini paylaşırlar?
    options:
    - To intentionally bankrupt their corporate business sponsors.
    - Because they are legally mandated by medical boards to disclose personal diagnoses.
    - To elicit protective empathy that is strategically monetized through merchandise and subscriptions.
    - To persuade their entire audience to immediately delete all social media accounts.
    correct_answer: To elicit protective empathy that is strategically monetized through merchandise and subscriptions.
    explanation_en: Paragraph 3 explains that manufactured affect elicits empathy that is monetized through merchandise and
