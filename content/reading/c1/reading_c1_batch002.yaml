  comprehension_questions:
  - id: q_reading_c1_cognitive-fragmentation-knowledge-work_01
    question_en: What did Sophie Leroy's foundational research reveal about 'attention residue' in Paragraph 2?
    question_tr_hint: 2. paragrafta Sophie Leroy'un temel araştırması 'artık dikkat' hakkında neyi ortaya koymuştur?
    options:
    - Attention residue only occurs in individuals who never use digital computers.
    - Switching tasks increases human IQ scores by twenty points immediately.
    - The human brain permanently stops processing blood glucose after an interruption.
    - Part of a person's cognitive bandwidth remains tethered to a previous task after an interruption, impairing performance.
    correct_answer: Part of a person's cognitive bandwidth remains tethered to a previous task after an interruption, impairing
      performance.
    explanation_en: Paragraph 2 explains attention residue leaves cognitive bandwidth tethered to the prior task.
    explanation_tr: 2. paragraf artık dikkatin bant genişliğini önceki göreve bağlı bırakıp performansı düşürdüğünü açıklar.
  - id: q_reading_c1_cognitive-fragmentation-knowledge-work_02
    question_en: How do enterprise communication tools trigger compulsive checking behaviors in Paragraph 3?
    question_tr_hint: 3. paragrafta kurumsal iletişim araçları zorlantılı kontrol etme davranışlarını nasıl tetikler?
    options:
    - By using notification badges and icons that trigger evolutionary dopamine spikes related to novelty and threat detection.
    - By requiring workers to scan their physical fingerprints every sixty seconds.
    - By sending automated electric shocks through the computer keyboard.
    - By emitting ultrasonic sound waves that physically hypnotize computer users.
    correct_answer: By using notification badges and icons that trigger evolutionary dopamine spikes related to novelty and
      threat detection.
    explanation_en: Paragraph 3 describes how badges and pings hijack ancient dopamine circuitry for novelty and threats.
    explanation_tr: 3. paragraf rozet ve bildirimlerin yenilik arayışına ait dopamin devrelerini gasp ettiğini açıklar.
  - id: q_reading_c1_cognitive-fragmentation-knowledge-work_03
    question_en: What is the key difference between 'deep work' and 'shallow work' defined by Cal Newport in Paragraph 4?
    question_tr_hint: 4. paragrafta Cal Newport tarafından tanımlanan 'derin çalışma' ile 'yüzeysel çalışma' arasındaki temel
      fark nedir?
    options:
    - Deep work requires distraction-free concentration creating unique value, whereas shallow work is non-demanding and logistical.
    - Deep work only involves manual physical labor, while shallow work involves mathematics.
    - Deep work is performed underwater in submarines, while shallow work is done on land.
    - Deep work can only be conducted by workers who have no university education.
    correct_answer: Deep work requires distraction-free concentration creating unique value, whereas shallow work is non-demanding
      and logistical.
    explanation_en: Paragraph 4 explains deep work pushes cognitive limits to create value, unlike logistical shallow work.
    explanation_tr: 4. paragraf derin çalışmanın değer üretmek için bilişsel sınırları zorladığını, yüzeysel çalışmanın ise
      lojistik olduğunu belirtir.
  - id: q_reading_c1_cognitive-fragmentation-knowledge-work_04
    question_en: Why has the open-plan office proven counterproductive for knowledge workers according to Paragraph 7?
    question_tr_hint: 7. paragrafa göre açık planlı ofis bilgi çalışanları için neden verimsiz olduğunu kanıtlamıştır?
    options:
