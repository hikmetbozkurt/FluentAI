    - Architects build open offices without installing any doors or windows.
    - Ambient speech in acoustically porous spaces hijacks the phonological loop in human working memory.
    - Open offices cause temperatures inside the building to rise above boiling point.
    correct_answer: Ambient speech in acoustically porous spaces hijacks the phonological loop in human working memory.
    explanation_en: Paragraph 7 notes ambient speech in porous spaces hijacks the working memory's phonological loop.
    explanation_tr: 7. paragraf ortam konuşmasının çalışan bellekteki fonolojik döngüyü gasp ettiğini belirtir.
  - id: q_reading_c1_cognitive-fragmentation-knowledge-work_05
    question_en: What strategic asset does the author identify as the ultimate competitive advantage in Paragraph 8?
    question_tr_hint: 8. paragrafta yazar nihai rekabet avantajı olarak hangi stratejik varlığı tanımlamaktadır?
