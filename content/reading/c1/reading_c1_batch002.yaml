    explanation_tr: 3. paragraf üretilmiş duygunun empati toplayarak ürün satışı ve aboneliklerle paraya dönüştürüldüğünü
      açıklar.
  - id: q_reading_c1_parasocial-relationships-digital-age_04
    question_en: What psychological trap do young adults encounter when substituting parasocial bonds for real friendships?
    question_tr_hint: Genç yetişkinler gerçek arkadaşlıklar yerine parasosyal bağları koyduklarında hangi psikolojik tuzağa
      düşerler?
    options:
    - They permanently lose the physical ability to hear spoken human voices.
    - They immediately develop super-human photographic memory capabilities.
    - They avoid the messiness and vulnerability of real relationships, causing social skills to atrophy.
    - They become internationally certified psychotherapists within three days.
    correct_answer: They avoid the messiness and vulnerability of real relationships, causing social skills to atrophy.
    explanation_en: Paragraph 4 explains that avoiding real-world relationship vulnerability leads to atrophied social skills
      and isolation.
    explanation_tr: 4. paragraf gerçek ilişki kırılganlığından kaçınmanın sosyal yetkinlikleri köreltip izolasyona yol açtığını
