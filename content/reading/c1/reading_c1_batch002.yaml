  - id: q_reading_c1_linguistic-relativity-cognitive-framing_04
    question_en: Why do Spanish speakers remember fewer details about who accidentally caused an event in Paragraph 6?
    question_tr_hint: 6. paragrafta İspanyolca konuşanlar bir olaya kazara kimin neden olduğuna dair neden daha az ayrıntı
      hatırlar?
    options:
    - Because Spanish witnesses are legally forbidden from testifying in courtrooms.
    - Because Spanish uses non-agentive reflexive phrasing that directs attention to the outcome rather than the actor.
    - Because Spanish speakers have fundamentally weaker long-term memory systems.
    - Because the Spanish language has no grammatical words for household objects.
    correct_answer: Because Spanish uses non-agentive reflexive phrasing that directs attention to the outcome rather than
      the actor.
    explanation_en: Paragraph 6 explains that non-agentive reflexive constructions focus memory encoding on outcome and context.
    explanation_tr: 6. paragraf fail içermeyen dönüşlü yapıların bellek kodlamasını fail yerine sonuca odakladığını açıklar.
  - id: q_reading_c1_linguistic-relativity-cognitive-framing_05
    question_en: What is the 'foreign language effect' identified by behavioral economists in Paragraph 7?
    question_tr_hint: 7. paragrafta davranışsal iktisatçılar tarafından tanımlanan 'yabancı dil etkisi' nedir?
