    correct_answer: As a one-sided psychological illusion of intimacy experienced by audiences toward broadcasters.
    explanation_en: Paragraph 1 explains that Horton and Wohl defined parasocial interaction as an illusion of intimacy with
      broadcasters.
    explanation_tr: 1. paragraf Horton ve Wohl'un parasosyal etkileşimi yayıncılara yönelik tek taraflı samimiyet yanılsaması
      olarak tanımladığını açıklar.
  - id: q_reading_c1_parasocial-relationships-digital-age_02
    question_en: How do modern social media platforms mutate traditional parasocial attachments in Paragraph 2?
