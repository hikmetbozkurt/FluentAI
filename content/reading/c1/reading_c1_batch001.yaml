- id: reading.c1.venture-capital-game-theory
  title: Cap Tables, Liquidation Preferences, and Information Asymmetry in Venture Capital
  cefr_level: C1
  category: finance_and_economics
  summary_en: An advanced financial dissection of venture capital term sheets, analyzing how participating preferred stock,
    liquidation waterfalls, and anti-dilution ratchets alter economic incentives during startup exits.
  summary_tr: 'Girişim sermayesi terim şartnamelerinin (term sheets) ileri düzey analizi: katılma paylı imtiyazlı hisseler,
    tasfiye öncelikleri ve çıkış anında teşvik yapılarının değişimi.'
  word_count: 336
  estimated_reading_minutes: 2
  paragraphs:
  - paragraph_index: 1
    title: The Seduction of Headline Valuations
    content_en: 'In entrepreneurial mythos, startup fundraising success is celebrated through a single intoxicating headline
      metric: pre-money valuation. Tech media sensationalizes nine-figure valuation milestones, treating post-money figures
      as definitive scorecards of founder genius. However, seasoned venture attorneys and private equity financiers recognize
      that headline valuation is often a mathematical mirage. In sophisticated venture negotiations, valuation is routinely
      conceded by investors in exchange for draconian structural covenants that completely reshape the economic waterfall
      during a liquidity event.'
    content_tr: 'Girişimcilik mitolojisinde girişim fonlama başarısı tek bir sarhoş edici başlık metriğiyle kutlanır: yatırım
      öncesi değerleme (pre-money valuation). Teknoloji medyası dokuz haneli değerleme kilometre taşlarını sansasyonelleştirerek
      yatırım sonrası rakamları kurucu dehasının nihai karnesi olarak ele alır. Ancak deneyimli girişim avukatları ve özel
      sermaye finansçıları başlık değerlemesinin genellikle matematiksel bir serap olduğunu bilirler. Sofistike girişim müzakerelerinde
      değerleme, bir likidite olayında ekonomik şelaleyi tamamen yeniden şekillendiren acımasız yapısal şartlar karşılığında
      yatırımcılar tarafından kolayca kabul edilir.'
  - paragraph_index: 2
    title: The Mechanics of Liquidation Preferences
    content_en: At the core of preferred venture securities sits the liquidation preference. Unlike common shareholders—the
      status occupied by founders and early employees—venture capital investors purchase Preferred Stock. A standard 1X liquidation
      preference guarantees that upon any merger, acquisition, or liquidation, preferred investors must recoup one hundred
      percent of their initial capital before common shareholders receive a single cent. Furthermore, if investors negotiate
      'Participating Preferred' stock, they not only recoup their original capital first, but subsequently participate pro-rata
      in the remaining proceeds alongside common equity, severely cannibalizing founder returns in modest exits.
    content_tr: İmtiyazlı girişim menkul kıymetlerinin merkezinde tasfiye önceliği (liquidation preference) yer alır. Kurucuların
      ve ilk çalışanların sahip olduğu adi hisse sahiplerinin aksine girişim sermayesi yatırımcıları İmtiyazlı Hisse Senedi
      (Preferred Stock) satın alırlar. Standart bir 1X tasfiye önceliği herhangi bir birleşme, devralma veya tasfiye anında,
      adi hisse sahipleri tek bir kuruş almadan önce imtiyazlı yatırımcıların ilk sermayelerinin yüzde yüzünü geri almasını
      garanti eder. Dahası yatırımcılar 'Katılma Paylı İmtiyazlı' (Participating Preferred) hisse müzakere ederlerse yalnızca
      ilk sermayelerini geri almakla kalmaz ardından adi hisselerle birlikte kalan gelirden orantılı (pro-rata) pay alarak
      mütevazı çıkışlarda kurucu getirilerini ciddi şekilde tüketirler.
  - paragraph_index: 3
    title: Down-Rounds and Anti-Dilution Ratchets
    content_en: The asymmetric structural power of preferred equity becomes devastating during economic contractions that
      precipitate a 'Down-Round'—raising capital at a valuation lower than the preceding financing milestone. Venture term
      sheets incorporate anti-dilution mechanisms to insulate investors against valuation degradation. While a 'Broad-Based
      Weighted Average' ratchet provides balanced, proportionate protection, a predatory 'Full Ratchet' retroactively reprices
      the investor's historical shares to the new, depressed valuation. In a full ratchet scenario, massive tranches of new
      equity are minted and awarded to preferred holders, precipitating catastrophic dilution that can strip founders of corporate
      voting control overnight.
    content_tr: İmtiyazlı hissenin asimetrik yapısal gücü, bir önceki finansman kilometre taşından daha düşük bir değerlemeyle
      sermaye toplanan 'Düşük Tur' (Down-Round) dönemlerinde yıkıcı hale gelir. Girişim terim şartnameleri yatırımcıları değerleme
      düşüşüne karşı korumak için sulanma önleyici (anti-dilution) mekanizmalar içerir. 'Geniş Tabanlı Ağırlıklı Ortalama'
      formülü dengeli ve orantılı bir koruma sağlarken yırtıcı bir 'Tam Düzeltme' (Full Ratchet) yatırımcının geçmiş hisselerini
      yeni, düşük değerlemeye göre geriye dönük olarak yeniden fiyatlandırır. Tam düzeltme senaryosunda imtiyazlı hissedarlara
      devasa yeni hisseler basılıp tahsis edilir ve kurucuları bir gecede kurumsal oy kontrolünden mahrum bırakabilecek yıkıcı
      bir seyrelmeye yol açar.
  - paragraph_index: 4
    title: Information Asymmetry at the Negotiating Table
    content_en: This structural divergence exemplifies profound institutional information asymmetry. First-time founders negotiate
      a term sheet perhaps once or twice in their lives; the venture capitalists across the table execute dozens of financings
      annually, advised by specialized legal syndicates. Navigating this asymmetry requires founders to prioritize governance
      and economic terms—board seat allocations, protective veto provisions, and clean liquidation waterfalls—over vanity
      headline valuations. True equity value lies not in paper multiples, but in retaining unencumbered ownership rights when
      the exit event finally materializes.
    content_tr: Bu yapısal ayrışma derin bir kurumsal bilgi asimetrisini örneklendirir. İlk kez girişim kuranlar hayatlarında
      belki bir veya iki kez bir terim şartnamesi müzakere ederler; masanın karşısındaki girişim sermayedarları ise uzmanlaşmış
      hukuk sendikaları tarafından tavsiye edilerek yılda onlarca finansman yürütürler. Bu asimetride yol almak kurucuların
      içi boş başlık değerlemeleri yerine yönetişim ve ekonomik şartlara (yönetim kurulu koltuk dağılımları, koruyucu veto
      hükümleri ve temiz tasfiye şelaleleri) öncelik vermesini gerektirir. Gerçek hisse değeri kağıt üzerindeki çarpanlarda
      değil çıkış olayı nihayet gerçekleştiğinde engelsiz mülkiyet haklarını korumakta yatar.
  vocabulary_annotations:
  - word: entrepreneurial
    vocab_id: vocab.entrepreneurial
    context_definition_en: Characterized by commercial initiative, willingness to take calculated business risks, and enterprise.
    context_meaning_tr: Girişimci; girişimcilik ruhuna sahip.
  - word: startup
    vocab_id: vocab.startup
    context_definition_en: A newly established business venture, especially in the technology sector.
    context_meaning_tr: girişim, yeni kurulan şirket (startup)
  comprehension_questions:
  - id: q_r_c1_05_01
    question_en: Why do seasoned venture financiers consider 'headline valuation' a potential mathematical mirage?
    question_tr_hint: Deneyimli girişim finansçıları 'başlık değerlemesi'ni neden potansiyel bir matematiksel serap olarak
      görür?
    options:
    - Valuation numbers are legally required to be divided by ten under commercial tax codes
    - High valuations force companies to pay one hundred percent interest rates to banks daily
    - Investors easily concede high valuations in exchange for draconian liquidation covenants that control real returns
    - Pre-money valuations cannot be written in digital spreadsheet files
    correct_answer: Investors easily concede high valuations in exchange for draconian liquidation covenants that control
      real returns
    explanation_en: Paragraph 1 notes valuation is conceded in exchange for covenants that reshape the economic waterfall.
    explanation_tr: 1. paragraf yatırımcıların yüksek değerlemeyi getiriyi kontrol eden acımasız şartlar karşılığında kabul
      ettiğini belirtir.
  - id: q_r_c1_05_02
    question_en: How does a '1X Liquidation Preference' protect venture capital investors during an exit?
    question_tr_hint: '''1X Tasfiye Önceliği'' bir çıkış sırasında girişim sermayesi yatırımcılarını nasıl korur?'
    options:
    - Investors must recoup 100% of their initial capital before common equity holders receive anything
    - Investors receive the physical keys to all real estate owned by the company's founders
    - The company is forced to buy back all shares at triple the original purchase price
    - Common stockholders are given priority over institutional investors during bankruptcies
    correct_answer: Investors must recoup 100% of their initial capital before common equity holders receive anything
    explanation_en: Paragraph 2 states preferred investors recoup 100% of their capital before common shareholders get a cent.
    explanation_tr: 2. paragraf imtiyazlı yatırımcıların adi hisse sahipleri bir kuruş almadan önce anaparalarını kurtardığını
      açıklar.
  - id: q_r_c1_05_03
    question_en: What extra economic advantage does 'Participating Preferred' stock confer onto investors?
    question_tr_hint: '''Katılma Paylı İmtiyazlı'' (Participating Preferred) hisse yatırımcılara hangi ekstra ekonomik avantajı
      sağlar?'
    options:
    - Exemption from all federal and international securities fraud regulations
    - A guaranteed seat in the national legislative senate of the country
    - The automatic power to fire all company employees without cause
    - Recouping original capital first and then participating pro-rata in remaining common proceeds
    correct_answer: Recouping original capital first and then participating pro-rata in remaining common proceeds
    explanation_en: Paragraph 2 explains they recoup capital and participate pro-rata in remaining proceeds.
    explanation_tr: 2. paragraf anaparayı aldıktan sonra kalan gelirden de orantılı pay aldıklarını açıklar.
  - id: q_r_c1_05_04
    question_en: What happens to founders under a predatory 'Full Ratchet' anti-dilution covenant during a down-round?
    question_tr_hint: Düşük turda yırtıcı bir 'Tam Düzeltme' (Full Ratchet) hükmü altında kuruculara ne olur?
    options:
    - The founders are legally arrested by local commercial enforcement authorities
    - Historical shares are retroactively repriced to the lower valuation, triggering catastrophic dilution and loss of control
    - The company is immediately transformed into a non-profit municipal charity
    - The software code is placed in a physical museum display permanently
    correct_answer: Historical shares are retroactively repriced to the lower valuation, triggering catastrophic dilution
      and loss of control
    explanation_en: Paragraph 3 describes full ratchet repricing shares retroactively, causing catastrophic dilution.
    explanation_tr: 3. paragraf hisselerin geriye dönük ucuzlatılarak kurucuların kontrolünü yok eden yıkıcı bir sulanma yarattığını
      açıklar.
  - id: q_r_c1_05_05
    question_en: What institutional reality creates profound information asymmetry at the venture negotiation table?
    question_tr_hint: Girişim müzakere masasında derin bilgi asimetrisini yaratan kurumsal gerçeklik nedir?
    options:
    - Founders negotiate term sheets once or twice in life, while VCs execute dozens of deals annually with legal syndicates
    - Venture capitalists are forbidden from disclosing their actual names during meetings
    - Founders are not permitted to hire attorneys under standard international trade law
    - Term sheet documents can only be drafted in rare archaic European dialects
    correct_answer: Founders negotiate term sheets once or twice in life, while VCs execute dozens of deals annually with
      legal syndicates
    explanation_en: Paragraph 4 highlights that founders negotiate rarely while VCs execute dozens of deals annually.
    explanation_tr: 4. paragraf kurucuların hayatlarında nadiren, yatırımcıların ise yılda onlarca kez bu anlaşmaları yaptığını
      vurgular.
