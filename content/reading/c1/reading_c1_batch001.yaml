  comprehension_questions:
  - id: q_r_c1_07_01
    question_en: What structural vulnerability doomed the traditional 'castle-and-moat' cybersecurity architecture?
    question_tr_hint: Geleneksel 'kale ve hendek' siber güvenlik mimarisini hangi yapısal kırılganlık çökertti?
    options:
    - Physical hardware firewalls consumed more electricity than national power grids could supply
    - Granting implicit ambient trust allowed attackers who breached the perimeter to move laterally with ease
    - Computer monitors refused to display colors inside buildings protected by stone walls
    - Ethernet cables were legally declared hazardous industrial waste under international law
    correct_answer: Granting implicit ambient trust allowed attackers who breached the perimeter to move laterally with ease
    explanation_en: Paragraph 1 notes implicit trust allowed frictionless lateral movement across the soft underbelly.
    explanation_tr: 1. paragraf çevreyi aşan saldırganların içeride sürtünmesizce yanal hareket edebildiğini açıklar.
  - id: q_r_c1_07_02
    question_en: What three immutable axioms govern Zero-Trust Architecture (ZTA)?
    question_tr_hint: Sıfır Güven Mimarisi'ni (ZTA) hangi üç değişmez aksiyom yönetir?
    options:
    - Trust all internal workers, disable firewalls, and share passwords openly
    - Restart servers daily, ban all mobile devices, and encrypt only text files
    - Require paper identification, conduct voice calls, and abolish all digital software
    - Assume breach, verify explicitly, and enforce least-privilege access
    correct_answer: Assume breach, verify explicitly, and enforce least-privilege access
    explanation_en: 'Paragraph 2 states the three axioms: assume breach, verify explicitly, enforce least-privilege.'
    explanation_tr: 2. paragraf üç aksiyomu ihlali varsay, açıkça doğrula ve en az ayrıcalığı uygula olarak sıralar.
  - id: q_r_c1_07_03
    question_en: How do Software-Defined Perimeters (SDP) protect internal database clusters?
    question_tr_hint: Yazılım Tanımlı Çevreler (SDP) dahili veritabanı kümelerini nasıl korur?
    options:
    - By physically hiding server hard drives inside underground concrete bunkers
    - By turning off database server electricity whenever unauthorized people enter the room
    - By rendering services completely dark and invisible until an ephemeral mTLS cryptographic handshake validates the caller
    - By broadcasting database IP addresses publicly on corporate social media channels
    correct_answer: By rendering services completely dark and invisible until an ephemeral mTLS cryptographic handshake validates
      the caller
    explanation_en: Paragraph 3 explains SDP renders services dark until an ephemeral mTLS handshake validates short-lived
      certificates.
    explanation_tr: 3. paragraf mTLS doğrulaması yapılana kadar servislerin tarayıcılara tamamen karanlık/görünmez kaldığını
      açıklar.
  - id: q_r_c1_07_04
    question_en: What does 'continuous attestation' evaluate during an active operational session?
    question_tr_hint: Aktif bir operasyonel oturum sırasında 'sürekli kanıtlama' (continuous attestation) neyi değerlendirir?
    options:
    - Dynamic device posture, geographic velocity anomalies, and real-time behavioral deviation
    - The personal political opinions and social media posts of the user's family
    - The physical weight of the user's computer monitor and desktop keyboard
    - Whether the employee has memorized the national anthem of their home country
    correct_answer: Dynamic device posture, geographic velocity anomalies, and real-time behavioral deviation
    explanation_en: Paragraph 4 lists device posture, geographic velocity anomalies, and behavioral deviation.
    explanation_tr: 4. paragraf cihaz durumu, coğrafi hız anormallikleri ve davranışsal sapmaları listeler.
  - id: q_r_c1_07_05
    question_en: How does a mature Zero-Trust ecosystem paradoxically increase developer agility?
    question_tr_hint: Olgun bir Sıfır Güven ekosistemi paradoksal olarak geliştirici çevikliğini nasıl artırır?
    options:
    - By eliminating all computer source code reviews from the engineering pipeline
    - By allowing developers to bypass all software testing and deploy directly to production
    - By providing free luxury company cars to all software programming personnel
    - By replacing fragile manual VPNs and brittle static IP firewalls with declarative automated identity federation
    correct_answer: By replacing fragile manual VPNs and brittle static IP firewalls with declarative automated identity federation
    explanation_en: Paragraph 5 explains declarative identity federation and eliminating VPNs accelerates agility.
    explanation_tr: 5. paragraf kırılgan VPN ve statik IP duvarları yerine bildirimsel kimlik federasyonunun çevikliği artırdığını
      belirtir.
