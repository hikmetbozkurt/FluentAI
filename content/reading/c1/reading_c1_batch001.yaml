  comprehension_questions:
  - id: q_r_c1_10_01
    question_en: What does Cal Newport's concept of the 'Hyperactive Hive Mind' describe?
    question_tr_hint: Cal Newport'un 'Hiperaktif Kovan Zihni' kavramı neyi tanımlar?
    options:
    - An unprincipled reliance on continuous, ad-hoc digital messaging channels as the primary workflow
    - A biological virus that specifically infects corporate software programmers
    - An automated artificial intelligence system that controls office air conditioning
    - A legal mandate forcing all technology employees to wear identical uniforms
    correct_answer: An unprincipled reliance on continuous, ad-hoc digital messaging channels as the primary workflow
    explanation_en: Paragraph 1 defines the Hyperactive Hive Mind as an unprincipled reliance on continuous ad-hoc communication.
    explanation_tr: 1. paragraf kovan zihnini sürekli ve plansız dijital iletişim kanallarına ilkesiz bağımlılık olarak tanımlar.
  - id: q_r_c1_10_02
    question_en: How does 'Attention Residue' neurologically impair technical performance?
    question_tr_hint: '''Dikkat Kalıntısı'' (Attention Residue) teknik performansı nörolojik olarak nasıl bozar?'
    options:
    - It permanently erases the engineer's memories of how to type code
    - It causes physical electronic short-circuits inside computer keyboards
    - It forces the brain to forget all spoken languages except classical Latin
    - Working memory remains stuck on the interrupted message, severely degrading cognitive bandwidth
    correct_answer: Working memory remains stuck on the interrupted message, severely degrading cognitive bandwidth
    explanation_en: Paragraph 2 explains attention residue leaves working memory in a degraded state after task switching.
    explanation_tr: 2. paragraf dikkat kalıntısının çalışan belleği ve bilişsel kapasiteyi ciddi şekilde zayıflattığını belirtir.
  - id: q_r_c1_10_03
    question_en: What defines 'Deep Work' as distinguished from 'Shallow Work'?
    question_tr_hint: '''Derin Çalışma''yı ''Sığ Çalışma''dan ayıran temel tanım nedir?'
    options:
    - Working twenty-four hours continuously without taking any physical breaks
    - Distraction-free concentration pushing cognitive limits to generate rare, novel value
    - Answering two hundred logistical emails within five minutes every morning
    - Attending recurring status meetings while simultaneously browsing social media
    correct_answer: Distraction-free concentration pushing cognitive limits to generate rare, novel value
    explanation_en: Paragraph 3 defines deep work as distraction-free concentration generating novel value.
    explanation_tr: 3. paragraf derin çalışmayı bilişsel sınırları zorlayan dikkatsiz ve yeni değer üreten odaklanma olarak
      tanımlar.
  - id: q_r_c1_10_04
    question_en: Why is individual willpower insufficient to solve workplace attentional fragmentation?
    question_tr_hint: İş yerindeki dikkat parçalanmasını çözmek için bireysel irade gücü neden yetersizdir?
    options:
    - The dysfunction is structural, requiring institutional interventions like meeting-free days and async protocols
    - Human beings are biologically incapable of working more than ten minutes per day
    - Government laws mandate that employees must check their smartphones continuously
    - Computer software code cannot be saved unless the engineer receives chat messages
    correct_answer: The dysfunction is structural, requiring institutional interventions like meeting-free days and async
      protocols
    explanation_en: Paragraph 4 explains overcoming this requires structural intervention rather than individual willpower.
    explanation_tr: 4. paragraf bunun bireysel irade yerine kurumsal yapısal müdahaleler gerektirdiğini açıklar.
  - id: q_r_c1_10_05
    question_en: How do high-performing engineering cultures evaluate technical velocity?
    question_tr_hint: Yüksek performanslı mühendislik kültürleri teknik hızı nasıl değerlendirir?
    options:
    - By counting how many chat messages an engineer sends per business hour
    - By the speed at which an employee types words on their physical keyboard
    - By measuring how loudly developers speak during morning standup meetings
    - By the caliber and durability of delivered architectural deliverables rather than instant chat replies
    correct_answer: By the caliber and durability of delivered architectural deliverables rather than instant chat replies
    explanation_en: Paragraph 4 concludes cultures evaluate teams by the caliber and durability of deliverables.
    explanation_tr: 4. paragraf ekiplerin anlık mesaj hızına göre değil çıktıların kalibresine göre değerlendirildiğini belirtir.
