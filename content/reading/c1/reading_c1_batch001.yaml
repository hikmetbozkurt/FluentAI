  - word: paradigm
    vocab_id: vocab.paradigm
    context_definition_en: A typical example or pattern of something; a distinct set of concepts, thought patterns, or standards.
    context_meaning_tr: değerler dizisi, paradigma, düşünsel model
  comprehension_questions:
  - id: q_r_c1_09_01
    question_en: What guiding dogma characterized commercial supply chains during the hyper-globalized era?
    question_tr_hint: Aşırı küreselleşme döneminde ticari tedarik zincirlerini hangi yol gösterici dogma karakterize etti?
    options:
    - Just-In-Time (JIT) logistics eliminating physical inventory buffers in favor of continuous transit
    - Storing twenty years of raw materials in secret underground mountain vaults
    - Refusing to export manufactured goods to any foreign continent
    - Transporting all commercial freight exclusively via supersonic military aircraft
    correct_answer: Just-In-Time (JIT) logistics eliminating physical inventory buffers in favor of continuous transit
    explanation_en: Paragraph 1 notes JIT delivery eradicated physical inventories in favor of continuous maritime transit.
    explanation_tr: 1. paragraf JIT dogmasının fiziksel envanterleri deniz taşımacılığı lehine sıfırladığını açıklar.
  - id: q_r_c1_09_02
    question_en: How did the automotive industry illustrate the fatal vulnerability of hyper-lean logistics?
    question_tr_hint: Otomotiv sektörü aşırı yalın lojistiğin ölümcül zaafını nasıl gösterdi?
    options:
    - Automobile tires completely dissolved when exposed to rain water
    - Automotive companies forgot how to operate internal combustion engines
    - Entire global vehicle assembly lines halted due to localized shortages of cheap microcontrollers
    - All global automotive patents were seized by international shipping consortia
    correct_answer: Entire global vehicle assembly lines halted due to localized shortages of cheap microcontrollers
    explanation_en: Paragraph 2 describes automotive lines halting for lack of two-dollar microcontrollers.
    explanation_tr: 2. paragraf iki dolarlık mikrodenetleyiciler yüzünden tüm otomotiv hatlarının durduğunu belirtir.
  - id: q_r_c1_09_03
    question_en: What paradigm shift is replacing 'Just-In-Time' supply chain optimization?
    question_tr_hint: '''Tam Zamanında'' tedarik zinciri optimizasyonunun yerini hangi paradigma değişimi almaktadır?'
    options:
    - A total return to ancient pre-industrial manual craftsmanship
    - A transition toward 'Just-In-Case' resilience utilizing strategic inventory buffers and dual-sourcing
    - The complete abolition of all digital logistics tracking software
    - Banning all cross-border commercial maritime container ships
    correct_answer: A transition toward 'Just-In-Case' resilience utilizing strategic inventory buffers and dual-sourcing
    explanation_en: Paragraph 3 highlights the transition from Just-In-Time to Just-In-Case resilience.
    explanation_tr: 3. paragraf JIT yerine tampon stoklu 'Just-In-Case' dayanıklılığının geldiğini açıklar.
  - id: q_r_c1_09_04
    question_en: What distinguishes 'friendshoring' from traditional domestic reshoring?
    question_tr_hint: '''Friendshoring'' kavramını geleneksel yerel üretime dönüşten (reshoring) ayıran nedir?'
    options:
    - Forcing employees to work exclusively with personal childhood friends
    - Banning all trade between countries that do not share a common language
    - Signing corporate partnerships exclusively on social media websites
    - Relocating critical production to allied foreign nations with aligned geopolitical and legal regimes
    correct_answer: Relocating critical production to allied foreign nations with aligned geopolitical and legal regimes
    explanation_en: Paragraph 4 defines nearshoring/friendshoring as relocating to allied geopolitical partners.
    explanation_tr: 4. paragraf üretimi benzer yasal rejimlere sahip müttefik ülkelere taşımak olarak tanımlar.
  - id: q_r_c1_09_05
    question_en: What structural macroeconomic cost accompanies the transition toward antifragile supply chains?
    question_tr_hint: Kırılgan olmayan tedarik zincirlerine geçiş hangi yapısal makroekonomik maliyeti beraberinde getirir?
    options:
    - The complete collapse of all international financial banking institutions
    - An immediate worldwide deflationary depression worse than 1929
    - Permanently elevated baseline inflation due to duplicated facilities and higher capital expenditures
    - The permanent disappearance of all semiconductor microprocessors
    correct_answer: Permanently elevated baseline inflation due to duplicated facilities and higher capital expenditures
    explanation_en: Paragraph 5 explains duplicating plants and safety stocks permanently elevates baseline inflation.
    explanation_tr: 5. paragraf fabrikaları kopyalamanın ve tampon stok tutmanın yapısal enflasyonu artırdığını belirtir.
