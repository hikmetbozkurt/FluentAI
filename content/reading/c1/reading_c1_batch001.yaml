  comprehension_questions:
  - id: q_r_c1_04_01
    question_en: How does 'Sociotechnical Debt' differ from traditional Technical Debt?
    question_tr_hint: '''Sosyoteknik Borç'' geleneksel Teknik Borçtan nasıl farklılaşır?'
    options:
    - It can only be resolved by filing for commercial corporate bankruptcy
    - It applies exclusively to hardware electronic components manufactured before 1990
    - It resides in obsolete managerial hierarchies and communication silos rather than source code
    - It is legally audited by international maritime shipping inspectors
    correct_answer: It resides in obsolete managerial hierarchies and communication silos rather than source code
    explanation_en: Paragraph 1 contrasts technical code debt with sociotechnical debt in hierarchies and communication.
    explanation_tr: 1. paragraf kod borcu ile hiyerarşiler ve iletişim silolarındaki sosyoteknik borcu ayırt eder.
  - id: q_r_c1_04_02
    question_en: What is the foundational thesis of Conway's Law articulated in 1967?
    question_tr_hint: 1967'de ortaya konan Conway Yasası'nın temel tezi nedir?
    options:
    - System architectures inevitably duplicate the communication structures of the organizations that design them
    - Computer microprocessors double in speed every eighteen calendar months automatically
    - Software code becomes obsolete within six months of initial commercial deployment
    - Engineering managers must possess formal degrees in electrical hardware design
    correct_answer: System architectures inevitably duplicate the communication structures of the organizations that design
      them
    explanation_en: Paragraph 2 quotes Conway's thesis that systems copy organizational communication structures.
    explanation_tr: 2. paragraf sistem mimarilerinin onu tasarlayan kurumun iletişim yapısını kopyaladığını açıklar.
  - id: q_r_c1_04_03
    question_en: What is the strategic objective of the 'Inverse Conway Maneuver'?
    question_tr_hint: '''Ters Conway Manevrası''nın stratejik hedefi nedir?'
    options:
    - Outsourcing all corporate executive leadership to foreign consulting firms
    - Forcing software engineers to learn classical spoken Latin for internal communications
    - Reorganizing cross-functional teams around business capabilities to induce modular software architecture
    - Eliminating all written documentation from software engineering repositories
    correct_answer: Reorganizing cross-functional teams around business capabilities to induce modular software architecture
    explanation_en: Paragraph 2 explains it reorganizes squads around business capabilities to induce modular architecture.
    explanation_tr: 2. paragraf modüler mimariyi tetiklemek için ekipleri iş yetenekleri etrafında yeniden düzenlemeyi açıklar.
  - id: q_r_c1_04_04
    question_en: What destructive dynamic characterizes 'local optimization' across corporate silos?
    question_tr_hint: Kurumsal silolar arasındaki 'yerel optimizasyon'u hangi yıkıcı dinamik karakterize eder?
    options:
    - Employees refusing to accept company health insurance benefits
    - Individual departments optimize internal metrics while causing global organizational paralysis
    - Computers consuming excessive electrical energy during overnight hours
    - Databases failing to record customer invoice numbers accurately
    correct_answer: Individual departments optimize internal metrics while causing global organizational paralysis
    explanation_en: Paragraph 3 defines local optimization as silos acting rationally on internal metrics while causing global
      paralysis.
    explanation_tr: 3. paragraf siloların kendi metriklerini optimize ederken genel şirket felcine yol açtığını açıklar.
  - id: q_r_c1_04_05
    question_en: How do high-performing organizations remediate sociotechnical friction?
    question_tr_hint: Yüksek performanslı şirketler sosyoteknik sürtünmeyi nasıl iyileştirir?
    options:
    - By adding ten more hierarchical management layers to approve every pull request
    - By banning all cross-departmental communication between engineers and product managers
    - By conducting mandatory five-hour meetings every single morning
    - By dissolving functional silos in favor of autonomous stream-aligned teams with end-to-end ownership
    correct_answer: By dissolving functional silos in favor of autonomous stream-aligned teams with end-to-end ownership
    explanation_en: Paragraph 4 highlights dissolving functional divisions in favor of autonomous stream-aligned teams.
    explanation_tr: 4. paragraf fonksiyonel bölümleri kaldırıp uçtan uca sahipliğe sahip akış odaklı ekipler kurmayı önerir.
