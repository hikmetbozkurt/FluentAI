  comprehension_questions:
  - id: q_r_c1_01_01
    question_en: What fundamental limitation was established by the Fischer-Lynch-Paterson (FLP) impossibility result?
    question_tr_hint: Fischer-Lynch-Paterson (FLP) imkansızlık sonucu hangi temel sınırlamayı ortaya koymuştur?
    options:
    - No deterministic protocol can guarantee both safety and liveness in asynchronous networks with even a single crash failure
    - Distributed networks cannot process more than one thousand database queries per calendar year
    - Software algorithms written in the English language cannot execute on semiconductor computer chips
    - Computer operating systems must restart their hardware every twenty-four hours to maintain security
    correct_answer: No deterministic protocol can guarantee both safety and liveness in asynchronous networks with even a
      single crash failure
    explanation_en: Paragraph 1 explains the FLP proof showed deterministic consensus cannot guarantee safety and liveness
      with crash failures.
    explanation_tr: 1. paragraf FLP teoreminin tek bir çökmede bile güvenlik ve canlılığın asenkron ağda garanti edilemeyeceğini
      kanıtladığını belirtir.
  - id: q_r_c1_01_02
    question_en: How does State Machine Replication (SMR) simplify the distributed coordination challenge?
    question_tr_hint: Durum Makinesi Çoğaltması (SMR) dağıtık koordinasyon zorluğunu nasıl basitleştirir?
    options:
    - By eliminating the need to store data on physical silicon hard drives or magnetic tapes
    - By requiring all software developers to manually approve every single query using physical paper tokens
    - By disconnecting databases from external power grids whenever traffic increases
    - 'By reducing coordination to a single problem: achieving consistent sequential ordering of the write log'
    correct_answer: 'By reducing coordination to a single problem: achieving consistent sequential ordering of the write log'
    explanation_en: Paragraph 2 states the coordination challenge collapses into ordering the write log across identical state
      machines.
    explanation_tr: 2. paragraf koordinasyonun durum makinelerinde yazma günlüğünü sıralamaya indirgendiğini açıklar.
  - id: q_r_c1_01_03
    question_en: Why did the software industry broadly embrace the Raft consensus algorithm over Multi-Paxos?
    question_tr_hint: Yazılım sektörü neden Multi-Paxos yerine Raft mutabakat algoritmasını geniş çapta benimsedi?
    options:
    - Multi-Paxos was legally patented by the United Nations, making commercial use completely illegal
    - Raft was explicitly engineered around understandability, decomposing consensus into modular sub-problems
    - Raft uses no electrical power and requires zero lines of computer source code to implement
    - Multi-Paxos was mathematically proven to cause hardware fires in modern datacenters
    correct_answer: Raft was explicitly engineered around understandability, decomposing consensus into modular sub-problems
    explanation_en: Paragraph 3 contrasts Paxos's opacity with Raft's intentional design around understandability.
    explanation_tr: 3. paragraf Paxos'un anlaşılamazlığına karşı Raft'ın modüler ve anlaşılır tasarımını vurgular.
  - id: q_r_c1_01_04
    question_en: What fundamental operational assumption differentiates crash-fault tolerant models from Byzantine models?
    question_tr_hint: Çökme toleranslı modelleri Bizans modellerinden hangi temel operasyonel varsayım ayırır?
    options:
    - Crash models only run on mobile phones, while Byzantine models only run on naval warships
    - Byzantine models operate without digital computers using manual human ballot counters
    - Crash-fault models assume nodes fail benignly, whereas Byzantine models tolerate actively malicious, deceptive nodes
    - Crash models are restricted to non-profit academic institutions under international law
    correct_answer: Crash-fault models assume nodes fail benignly, whereas Byzantine models tolerate actively malicious, deceptive
      nodes
    explanation_en: Paragraph 4 explains crash models assume non-malicious failure, whereas Byzantine models tolerate lying
      and collusion.
    explanation_tr: 4. paragraf çökme modellerinin iyi niyetli arızayı, Bizans modellerinin ise kötü niyetli aldatmacayı tolere
      ettiğini belirtir.
  - id: q_r_c1_01_05
    question_en: Why is an overlapping majority quorum (N/2 + 1) mathematically essential in distributed consensus?
    question_tr_hint: Dağıtık mutabakatta örtüşen bir çoğunluk nisabı (N/2 + 1) matematiksel olarak neden şarttır?
    options:
    - Any two majorities in cluster N necessarily share at least one node, preventing split-brain state mutations
    - It allows the database to shut down completely whenever the weather forecast predicts rain
    - It eliminates all software latency, making database queries resolve in zero nanoseconds
    - It guarantees that the company will never experience employee turnover in engineering
    correct_answer: Any two majorities in cluster N necessarily share at least one node, preventing split-brain state mutations
    explanation_en: Paragraph 2 notes that any two majorities in cluster size N overlap by at least one participant.
    explanation_tr: 2. paragraf N boyutundaki iki çoğunluğun en az bir düğümle örtüşmesinin bölünmeyi (split-brain) engellediğini
      açıklar.
