  comprehension_questions:
  - id: q_r_c1_06_01
    question_en: What immediate conflict of interest arises among stakeholders during an enterprise crisis?
    question_tr_hint: Bir kurumsal kriz sırasında paydaşlar arasında hangi acil çıkar çatışması ortaya çıkar?
    options:
    - All stakeholders immediately agree to forgive the company's financial debts
    - Company employees unanimously decide to emigrate to a tropical island nation
    - Computer monitors refuse to display any text until legal contracts are signed
    - Customers demand transparency, journalists seek soundbites, while defense lawyers urge total silence
    correct_answer: Customers demand transparency, journalists seek soundbites, while defense lawyers urge total silence
    explanation_en: Paragraph 1 contrasts customer demands, journalist clamor, and legal urges for silence.
    explanation_tr: 1. paragraf müşterilerin şeffaflık, basının manşet, avukatların ise tam sessizlik istediğini belirtir.
  - id: q_r_c1_06_02
    question_en: What critical flaw undermines the traditional legal posture of 'strategic reticence'?
    question_tr_hint: '''Stratejik ketumluk'' geleneksel hukuki duruşunu hangi kritik kusur zayıflatır?'
    options:
    - It violates international patent laws regarding software database storage
    - Corporate opacity destroys institutional trust, leading the market to assume malicious culpability
    - Strategic reticence automatically increases corporate server electricity costs by 500%
    - It forces the chief executive to resign under criminal international maritime treaties
    correct_answer: Corporate opacity destroys institutional trust, leading the market to assume malicious culpability
    explanation_en: Paragraph 2 explains opacity is interpreted as malicious culpability, causing irreversible damage.
    explanation_tr: 2. paragraf opaklığın kötü niyetli suçluluk olarak yorumlandığını ve güveni yok ettiğini açıklar.
  - id: q_r_c1_06_03
    question_en: What core technical practices define 'strategic radical candor' during an incident?
    question_tr_hint: Bir vaka sırasında 'stratejik radikal dürüstlüğü' hangi temel teknik uygulamalar tanımlar?
    options:
    - Denying that the incident ever occurred and threatening legal lawsuits against journalists
    - Deleting all customer databases to erase evidence of the system failure
    - Publishing live forensic timelines, packet traces, and honest technical admissions of vulnerability
    - Replacing the corporate executive board with artificial intelligence chatbots
    correct_answer: Publishing live forensic timelines, packet traces, and honest technical admissions of vulnerability
    explanation_en: Paragraph 3 highlights transparent live blogs with packet traces, timelines, and honest admissions.
    explanation_tr: 3. paragraf adli izleri, zaman çizelgelerini ve dürüst teknik kabulleri paylaşmayı vurgular.
  - id: q_r_c1_06_04
    question_en: How do skilled crisis counselors balance transparency with legal liability containment?
    question_tr_hint: Yetenekli kriz danışmanları şeffaflık ile yasal sorumluluk sınırlamasını nasıl dengeler?
    options:
    - By transparently stating factual technical occurrences without asserting legal admissions of negligence
    - By communicating exclusively in classical Japanese poetry to confuse courtroom judges
    - By paying financial bribes to national television broadcasting executives
    - By altering server timestamps retroactively to disguise when the breach occurred
    correct_answer: By transparently stating factual technical occurrences without asserting legal admissions of negligence
    explanation_en: Paragraph 4 explains the distinction between stating factual technical truths and conceding legal fault.
    explanation_tr: 4. paragraf somut teknik olguları dürüstçe açıklayıp hukuki kusur ikrarından kaçınma ayrımını belirtir.
  - id: q_r_c1_06_05
    question_en: How can technology organizations emerge from catastrophic failures with stronger customer trust?
    question_tr_hint: Teknoloji şirketleri feci başarısızlıkların ardından müşteri güvenini nasıl daha da güçlendirerek çıkabilirler?
    options:
    - By doubling customer subscription pricing to recoup financial losses from the outage
    - By refusing to acknowledge customer complaints on public social media channels
    - By publishing deep architectural post-mortems and open-sourcing remediation tooling for the industry
    - By transferring corporate assets to foreign offshore banking entities
    correct_answer: By publishing deep architectural post-mortems and open-sourcing remediation tooling for the industry
    explanation_en: Paragraph 5 notes publishing post-mortems and open-sourcing remediation tools strengthens trust beyond
      baselines.
    explanation_tr: 5. paragraf mimari vaka analizleri ve açık kaynak iyileştirme araçları sunmanın güveni artırdığını açıklar.
