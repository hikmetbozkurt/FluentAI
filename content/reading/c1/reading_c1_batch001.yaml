  comprehension_questions:
  - id: q_r_c1_08_01
    question_en: What core assumption of classical economics did behavioral economists Kahneman and Tversky dismantle?
    question_tr_hint: Davranışsal iktisatçılar Kahneman ve Tversky klasik ekonominin hangi temel varsayımını çürütmüştür?
    options:
    - The belief that commercial companies should earn financial profits from customers
    - The assumption that humans are perfectly rational optimizers with infinite cognitive bandwidth
    - The idea that paper currencies would be replaced by digital electronic credit cards
    - The theory that mathematical arithmetic could be taught to domestic household pets
    correct_answer: The assumption that humans are perfectly rational optimizers with infinite cognitive bandwidth
    explanation_en: Paragraph 1 explains behavioral economics dismantled the 'Homo Economicus' model of perfect rationality.
    explanation_tr: 1. paragraf sınırsız rasyonelliğe ve bilişsel kapasiteye sahip 'Homo Economicus' modelinin yıkıldığını
      açıklar.
  - id: q_r_c1_08_02
    question_en: How does the 'Paradox of Choice' affect consumers in digital interfaces?
    question_tr_hint: '''Seçenek Paradoksu'' dijital arayüzlerde tüketicileri nasıl etkiler?'
    options:
    - Confronting too many options triggers analysis paralysis and anticipatory regret, causing drop-offs
    - It forces the user's internet browser to restart every twenty-four hours
    - It automatically charges users double prices for selecting popular items
    - It translates all pricing information into classical Latin dialects
    correct_answer: Confronting too many options triggers analysis paralysis and anticipatory regret, causing drop-offs
    explanation_en: Paragraph 2 explains too many options create cognitive fatigue and analysis paralysis.
    explanation_tr: 2. paragraf aşırı seçeneğin bilişsel yorgunluk ve karar felci yaratarak terk etmeye yol açtığını belirtir.
  - id: q_r_c1_08_03
    question_en: Why is the 'default setting' considered the most powerful lever in choice architecture?
    question_tr_hint: '''Varsayılan ayar'' (default setting) seçim mimarisinde neden en güçlü kaldıraç kabul edilir?'
    options:
    - Government laws strictly fine any citizen who changes their computer settings
    - Changing a default setting permanently destroys the computer's motherboard
    - Software applications refuse to save data unless the user clicks on every button
    - Cognitive inertia and status-quo bias cause the overwhelming majority of users to accept defaults
    correct_answer: Cognitive inertia and status-quo bias cause the overwhelming majority of users to accept defaults
    explanation_en: Paragraph 3 highlights that status-quo bias and inertia cause users to adhere to pre-selected defaults.
    explanation_tr: 3. paragraf bilişsel atalet ve mevcut durum önyargısının kullanıcıları varsayılana bağlı kıldığını açıklar.
  - id: q_r_c1_08_04
    question_en: What ethical dividing line separates a benevolent 'Nudge' from a predatory 'Dark Pattern'?
    question_tr_hint: Hayırsever bir 'Dürtme'yi (Nudge) yırtıcı bir 'Karanlık Örüntü'den (Dark Pattern) hangi etik sınır ayırır?
    options:
    - Nudges are exclusively written in Python, while dark patterns are written in Java
    - Nudges align with the user's self-professed interests, whereas dark patterns weaponize bias against users
    - Nudges are only allowed in public schools, while dark patterns are used in banks
    - Nudges require a physical hardware device, while dark patterns are purely digital
    correct_answer: Nudges align with the user's self-professed interests, whereas dark patterns weaponize bias against users
    explanation_en: Paragraph 4 defines nudges as aligning with user interests vs. dark patterns weaponizing bias.
    explanation_tr: 4. paragraf dürtmenin kullanıcının çıkarına hizmet ettiğini, karanlık örüntünün ise zaafları sömürdüğünü
      belirtir.
  - id: q_r_c1_08_05
    question_en: What long-term commercial consequence do companies suffer when they rely on predatory dark patterns?
    question_tr_hint: Şirketler yırtıcı karanlık örüntülere güvendiklerinde uzun vadede hangi ticari zarara uğrarlar?
    options:
    - Immediate physical confiscation of all company office buildings by local police
    - A mandatory permanent ban on selling goods in international shipping ports
    - Severe degradation of customer lifetime value and catastrophic erosion of brand equity
    - The automatic deduction of corporate bank balances by cloud providers
    correct_answer: Severe degradation of customer lifetime value and catastrophic erosion of brand equity
    explanation_en: Paragraph 5 notes dark patterns inflict catastrophic damage on customer lifetime value and brand equity.
    explanation_tr: 5. paragraf karanlık örüntülerin müşteri yaşam boyu değerine ve marka değerine büyük zarar verdiğini belirtir.
