- id: grammar.c2.negative-polarity-items-subtleties
  title: 'Negative Polarity Licensing: ''Let Alone'', ''Much Less'', ''Remotely'',
    ''At All'''
  cefr_level: C2
  category: inversion_and_emphasis
  summary_en: Deploy negative polarity items ('let alone', 'much less', 'anything
    remotely', 'in the least') accurately inside negative, interrogative, or implicit
    scale-downward environments.
  summary_tr: '''Let alone'' (şöyle dursun / bir yana), ''much less'' ve ''remotely
    / in the least'' gibi olumsuzluk kutbu ifadelerini yalnızca olumsuz, soru veya
    kısıtlayıcı bağlamlarda doğru sırayla kullanın.'
  explanation_en:
  - title: Downward-Entailing Triggers for Scalar Emphasis
    content: 'Expressions like ''let alone'' and ''much less'' require an explicit
      negative or semi-negative premise (''seldom'', ''hardly'', ''reluctant to'',
      ''without'') ranking an easier baseline first before ruling out an extreme second
      target: ''It fails to clear staging, let alone production.'''
    patterns:
    - Negative Premise (unlikely/hardly/fail to X), + let alone / much less + Greater
      Y
    - not / hardly / without + anything remotely + Adjective
  explanation_tr: Türkçede 'Şunu bile yapamıyor, kaldı ki bunu yapsın' yapısı 'let
    alone' ile kurulur; ancak ilk cümlecik olumluysa '*He agrees to sign, let alone
    review' anlamsız olur. Ayrıca ikinci unsur daima birinciden daha zor veya kapsamlı
    olmalıdır.
  rules:
  - name: Direction of Effort in 'Let Alone'
    pattern: Cannot achieve Easy Baseline X, let alone Demanding Target Y
    use_cases:
    - Articulating sharp analytical boundaries and feasibility limits
    time_markers:
    - scarcely
    - never
    - without
  contrasts:
  - structure_a: The parser cannot handle basic hyphens, let alone nested Turkish
      suffixes.
    structure_b: The draft lacked anything remotely approaching consensus.
    difference_explanation_en: '''Let alone'' links scaled alternatives under negation;
      ''anything remotely'' intensifies an absent standard.'
    difference_explanation_tr: '''Let alone'' olumsuzda kademeli karşılaştırma kurar;
      ''anything remotely'' yokluğu vurgular.'
  turkish_traps:
  - trap_type: word_order_svo_vs_sov
    trap_title: '''Let Alone'' Öncesinde Olumlu Yüklem Kurmak veya Ölçeği Ters Çevirmek'
    explanation_tr: Daha zor olanı başa, kolayı sona koymak ('*cannot run a marathon,
      let alone walk') veya pozitif cümlede 'let alone' kullanmak C2 düzeyinde mantık
      kırılması yaratır.
    incorrect_example: The pipeline can verify full APK hashes, let alone single strings.
    correct_example: The pipeline struggles to reconcile basic strings, let alone
      full SQLite hashes.
  examples:
  - en: Without audit timestamps, external counsel cannot verify local edits, let
      alone certify compliance.
    tr: Denetim zaman damgaları olmadan dış hukuk danışmanları yerel değişiklikleri
      doğrulayamaz, uyumluluğu onaylamak bir yana.
    rule_highlight: cannot verify local edits, let alone certify compliance
    context: legal risk brief
  - en: Regional directors expressed nothing remotely resembling enthusiasm for mandatory
      overtime.
    tr: Bölge direktörleri zorunlu fazla mesai için uzaktan yakından heyecana benzeyen
      hiçbir tutum sergilemedi.
    rule_highlight: nothing remotely resembling
    context: executive summary
  topic_tags:
  - negation
  - rhetoric
  - writing
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.hedged-attribution-evidentials
  title: 'Evidential & Source-Distancing Frames: ''By All Accounts'', ''Ostensibly'',
    ''Purport To'''
  cefr_level: C2
  category: modals_and_semi_modals
  summary_en: Calibrate epistemic responsibility in intelligence briefs using evidential
    frames ('by all accounts', 'to all appearances', 'ostensibly', 'purportedly')
    that separate verified facts from reported claims.
  summary_tr: Strateji ve denetim metinlerinde doğrulanmış olgu ile karşı tarafın
    iddiasını ya da dış gözlemi ayırmak için 'ostensibly', 'purportedly', 'by all
    accounts' gibi kanıt çerçevelerini kullanın.
  explanation_en:
  - title: Precision Calibration of Evidential Weight
    content: Calling something 'ostensibly simple' signals surface simplicity masking
      likely hidden complexity. 'Purport to' distances the speaker from an unverified
      vendor claim. 'By all accounts' aggregates multiple consistent witnesses while
      signaling you rely on secondary testimony.
    patterns:
    - ostensibly + Adj/Purpose (= on the surface, though perhaps masking another motive)
    - purport + to + Verb | By all accounts, + Clause
  explanation_tr: 'Türkçede ''-miş gibi / görünüşte / söylenene göre'' ekleri tek
    kipte toplanırken İngilizcede kaynak güvenirlik tonunu kesin kelimeler taşır:
    ''ostensibly'' yüzeydeki görünüşten şüphe uyandırır, ''presumably'' makul tahmin
    yürütür.'
  rules:
  - name: Matching Source Stance to Evidence
    pattern: Verified report = by all accounts | Suspect facade = ostensibly | Unproven
      claim = purportedly
    use_cases:
    - Drafting vendor due-diligence memos without asserting unverified rumors as fact
    time_markers:
    - historically
    - pending inspection
  contrasts:
  - structure_a: The surcharge was ostensibly introduced to cover courier insurance.
    structure_b: By all accounts, the Q3 transition ran far smoother than expected.
    difference_explanation_en: '''Ostensibly'' implies a possible hidden motive; ''by
      all accounts'' endorses broad consensus.'
    difference_explanation_tr: '''Ostensibly'' görünürdeki bahaneye kuşku katar; ''by
      all accounts'' ise ortak gözlemi aktarır.'
  turkish_traps:
  - trap_type: aspect_confusion
    trap_title: Tarafsız 'Apparently' Yerine Şüphe İma Eden 'Ostensibly / Purportedly'
      Seçmek
    explanation_tr: Övdüğünüz kendi ekibiniz için 'purportedly delivered cleanly'
      yazmak sanki doğruluğundan kuşku duyuyormuşsunuz gibi alaycı tını verir.
    incorrect_example: Our internal QA team purportedly verified every Turkish trap
      note accurately.
    correct_example: By all accounts, our editorial QA team verified every Turkish
      trap note thoroughly.
  examples:
  - en: The script purported to deduplicate vocabulary automatically, yet skipped
      plural variants.
    tr: Betik kelimeleri otomatik tekilleştirdiğini iddia ediyordu ancak çoğul biçimleri
      atlıyordu.
    rule_highlight: purported to deduplicate
    context: audit analysis
  - en: Ostensibly a minor UI refresh, the update silently changed how notification
      opt-ins stored defaults.
    tr: Görünüşte ufak bir arayüz yenilemesi olan güncelleme bildirim izinlerinin
      varsayılanlarını sessizce değiştirdi.
    rule_highlight: Ostensibly a minor UI refresh
    context: privacy assessment
  topic_tags:
  - hedging
  - diplomacy
  - analysis
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.focus-particles-even-only-placement
  title: 'Focus Particle Precision: Positioning ''Only'', ''Merely'', ''Solely'',
    and ''Even'''
  cefr_level: C2
  category: cleft_sentences
  summary_en: Prevent costly contractual ambiguities by placing focusing adverbs ('only',
    'solely', 'even', 'primarily') directly before the exact constituent they restrict.
  summary_tr: '''Only'', ''solely'', ''merely'' ve ''even'' odak zarflarını fiil önüne
    rastgele atmak yerine tam olarak kısıtladıkları kelime öbeğinin hemen önüne yerleştirerek
    sözleşme belirsizliğini önleyin.'
  explanation_en:
  - title: Why Clause Position Shifts Truth Conditions
    content: 'Speech tolerates ''We only guarantee uptime locally'' by stressing ''locally''
      vocally. Formal writing lacks voice stress: write ''We guarantee uptime solely
      for offline storage'' vs. ''Only our platform guarantees local uptime'' vs.
      ''We can merely verify offline tables.'''
    patterns:
    - solely / exclusively + Prepositional Phrase (for / during / within...)
    - Only + [Restricted NP] + Verb (subject restriction without inversion? Compare
      vs. 'Only after X + Aux + Subj')
  explanation_tr: Türkçede 'sadece / bile' odaklayacağı kelimenin hemen önüne veya
    arkasına vurguyla oturur. İngilizce resmi sözleşmelerde 'We only billed active
    seats' ile 'We billed only active seats' farklı yorum davalarına yol açabilir.
  rules:
  - name: Adjacent Attachment of Focus Adverbs
    pattern: Restrictive Particle (only / solely / purely) + Immediately Preceded
      Target Constituent
    use_cases:
    - Writing airtight SLA scope clauses and technical specifications
    time_markers:
    - solely
    - exclusively
    - merely
  contrasts:
  - structure_a: Audit logs capture only failed sign-in attempts.
    structure_b: Only audit logs capture failed sign-in attempts.
    difference_explanation_en: A limits WHICH events get logged; B limits WHICH artifact
      holds them.
    difference_explanation_tr: A hangi olayların kaydedildiğini, B ise bu kaydı hangi
      dosyanın tuttuğunu sınırlar.
  turkish_traps:
  - trap_type: word_order_svo_vs_sov
    trap_title: '''Only'' Zarfını Fiilin Önüne Atıp Kısıtlanan Öbeği Belirsiz Bırakmak'
    explanation_tr: '''Sadece 50 kullanıcıyı kapsar'' anlamında ''*It only covers
      50 users for local storage'' yazmak hem sayıyı hem depolamayı muğlaklaştırır;
      daraltılan öğenin başına getirin.'
    incorrect_example: The warranty only remains valid if buyers keep invoices for
      six months.
    correct_example: The warranty remains valid only if buyers retain original invoices
      for six months.
  examples:
  - en: Runtime AI triggers solely during live speaking sessions, leaving reading
      flows completely offline.
    tr: Çalışma zamanı yapay zekası yalnızca canlı konuşma oturumlarında devreye girer
      ve okuma akışlarını tamamen çevrimdışı bırakır.
    rule_highlight: triggers solely during
    context: architecture spec
  - en: Adding one unvalidated symbol could break not merely imports, but even packaged
      Room reads.
    tr: Doğrulanmamış tek bir sembol eklemek yalnızca aktarımları değil, paketlenen
      Room okumalarını bile bozabilir.
    rule_highlight: not merely ... but even
    context: validation rule
  topic_tags:
  - precision
  - legal
  - writing
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.resumptive-modifiers-appositive-dash
  title: 'Resumptive & Summative Modifiers: Synthesizing Long Clauses with Em-Dash
    Appositives'
  cefr_level: C2
  category: relative_and_participle_clauses
  summary_en: Replace sprawling 'which'-clauses after long premises with a crisp resumptive
    noun or em-dash summative modifier ('—a safeguard that...', '—a dynamic largely
    ignored').
  summary_tr: Uzun ön cümlelerin sonunda belirsiz bir 'which' bırakmak yerine, tüm
    durumu tek isimle özetleyen açımlamalı bir apozitif ('—a step that...', '—an oversight
    that...') kurun.
  explanation_en:
  - title: Fixing Vague Broad-Reference 'Which' Clauses
    content: Ending a complex paragraph with '...which raised compliance concerns'
      leaves readers guessing which phrase 'which' refers to. C2 writers bridge smoothly
      using a summarizing noun (a step, a safeguard, a trend, a concession) repeated
      as an appositive or attached to 'which/that'.
    patterns:
    - '[Complex Proposition]—a [Summarizing Noun] that + Verb...'
    - '[Parallel NPs]—practices that collectively + Verb...'
  explanation_tr: Türkçede '...ki bu durum...' oldukça akıcıdır. İngilizcede uzun
    cümle sonuna çıplak ', which...' eklemek göndermeyi bulandırır; araya özetleyici
    bir isim ('—a shift that') koymak metne editoryal ustalık katar.
  rules:
  - name: Summative Noun Encapsulation
    pattern: 'Clause, a [category noun: discipline/trend/bottleneck] that + Predicate'
    use_cases:
    - Crafting high-impact executive conclusions and academic syntheses
    time_markers:
    - ultimately
    - consequently
  contrasts:
  - structure_a: The build hashes source files cleanly, which satisfies auditors.
    structure_b: The build hashes source files cleanly—a discipline that satisfies
      external auditors.
    difference_explanation_en: B avoids pronoun ambiguity by labeling the prior entire
      action explicitly as 'a discipline'.
    difference_explanation_tr: B 'which' zamirini açıkta bırakmayıp önceki süreci
      'a discipline' diye adlandırarak netleştirir.
  turkish_traps:
  - trap_type: word_order_svo_vs_sov
    trap_title: Uzun Cümle Sonunda Belirsiz 'Which' Bırakıp Özneyi Kaybetmek
    explanation_tr: Bir paragrafın sonuna tek başına ', which helped sales' eklemek
      son kelimeye mi yoksa tüm cümleye mi bağlandığını belirsiz kılar.
    incorrect_example: Regional reps shortened SLA redlines and pre-filled tax data,
      which won fast sign-off.
    correct_example: Regional reps shortened SLA redlines and pre-filled tax data—streamlining
      steps that won fast sign-off.
  examples:
  - en: Every batch passes pre-build schema gates—a discipline that eliminates broken
      seeds offline.
    tr: Her paket derleme öncesi şema kapılarından geçer; bu da çevrimdışı bozuk verileri
      baştan ortadan kaldıran bir disiplindir.
    rule_highlight: —a discipline that eliminates
    context: engineering charter
  - en: Both parties agreed on thirty-day cure windows, a concession without which
      talks would have stalled.
    tr: İki taraf da otuz günlük düzeltme sürelerinde anlaştı; bu olmasa görüşmelerin
      kilitleneceği bir tavizdi.
    rule_highlight: a concession without which
    context: negotiation recap
  topic_tags:
  - writing
  - cohesion
  - executive
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.archaic-legal-compound-adverbs
  title: 'Contractual Compound Adverbs (''Thereby'', ''Thereof'', ''Wherein'', ''Hereto''):
    Decode & Reformulate'
  cefr_level: C2
  category: prepositions_and_particles
  summary_en: Decode legal pronominal compounds ('thereby = by that means', 'thereof
    = of that', 'wherein = in which') accurately and know when plain-English equivalents
    outperform stiffness.
  summary_tr: Sözleşme metinlerindeki 'thereby' (bunun vasıtasıyla), 'thereof' (bunun),
    'wherein' (içinde/kapsamında) ve 'hereto' gibi birleşik zarfları doğru çözün ve
    gerektiğinde sade iş diline aktarın.
  explanation_en:
  - title: Internal Anatomy of Formal Pronominal Compounds
    content: '''Here-'' = ''this document''; ''There-'' = ''that prior item''; ''Where-''
      = ''which''. So ''thereby'' = ''by doing that'', ''thereafter'' = ''after that
      time'', ''hereunder'' = ''under this agreement''. Keep ''thereby + V-ing'' active
      in executive summaries (''thereby cutting lag''), while simplifying clunky ''thereto/heretofore''
      in normal emails.'
    patterns:
    - Clause, thereby + V-ing (still crisp and idiomatic in executive prose)
    - thereof (= of it) / hereunder (= under this contract) — passive reading mastery
  explanation_tr: Türkçe şirket avukatları ve üst düzey yöneticiler yabancı sözleşmelerde
    'the parties hereto' (bu sözleşmenin tarafları) veya 'portion thereof' (bunun
    kısmı) kalıplarıyla sık karşılaşır; ancak bunları gündelik e-postalara taşımak
    kaba ve aşırı yapay kaçar.
  rules:
  - name: '''Thereby + -ing'' for Causal Efficiency'
    pattern: Action Clause + , + thereby + Participle (-ing) + Outcome
    use_cases:
    - Reading MSAs accurately and summarizing operational benefits concisely
    time_markers:
    - thereafter
    - thereby
    - hereunder
  contrasts:
  - structure_a: The validator hashes outputs cleanly, thereby guaranteeing deterministic
      builds.
    structure_b: Please attach the updated price schedule hereto and return it post-haste.
    difference_explanation_en: A ('thereby guaranteeing') sounds sharp in modern tech
      writing; B ('hereto / post-haste') sounds stiff outside legal deeds.
    difference_explanation_tr: A modern teknik yazıda doğal ve keskindir; B ise sıradan
      e-postada aşırı resmi/ağdalı durur.
  turkish_traps:
  - trap_type: preposition_trap
    trap_title: '''Thereby'' Yerine ''Therefore'' Kullanıp Fiili ''-ing'' Bırakmak'
    explanation_tr: '''Böylece maliyetleri düşürdü'' anlamında ''*cuts lag, therefore
      saving time'' veya ''*thereby saves'' hatalarına dikkat edin: ''therefore''
      sonuç bağlacıdır (tam yüklem ister), ''thereby'' ise ''bu yolla'' araç zarfıdır
      (-ing alır).'
    incorrect_example: Local storage avoids live calls, therefore reducing monthly
      inference expenses.
    correct_example: Local storage avoids live calls, thereby reducing monthly inference
      expenses.
  examples:
  - en: Indexing topic relations upfront simplifies adaptive sorting, thereby saving
      battery offline.
    tr: Konu ilişkilerini baştan dizinlemek uyarlanabilir sıralamayı basitleştirir
      ve bu yolla çevrimdışı pilden tasarruf sağlar.
    rule_highlight: thereby saving
    context: architecture design doc
  - en: All exhibits attached hereto form an enforceable component of the master services
      agreement.
    tr: İşbu sözleşmeye eklenen tüm ekler ana hizmet sözleşmesinin bağlayıcı bir parçasını
      oluşturur.
    rule_highlight: attached hereto
    context: legal agreement
  topic_tags:
  - legal
  - register
  - writing
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.pragmatic-concession-mind-you-then-again
  title: 'Conversational Concession & Calibration: ''Granted'', ''Admittedly'', ''Mind
    You'', ''Then Again'''
  cefr_level: C2
  category: discourse_markers_and_cohesion
  summary_en: Modulate spoken and interactive debates naturally with nuanced pragmatic
    concessives ('admittedly', 'granted', 'mind you', 'having said that', 'then again')
    instead of overusing 'but'.
  summary_tr: Sözlü tartışmalarda ve yönetici görüşmelerinde her itirazı basitçe 'but'
    ile kesmek yerine 'granted / admittedly' (kabul ediyorum ki), 'mind you / having
    said that' ve 'then again' ile ince ayar yapın.
  explanation_en:
  - title: Three-Move Pragmatic Balancing in Real Time
    content: 'Master conversationalists signal open-mindedness in three crisp beats:
      acknowledge a limitation (''Granted, initial packaging adds 15 seconds''), pivot
      tactfully (''mind you / that said''), and counter-weigh (''even offline, cold
      launch drops below one second'').'
    patterns:
    - Granted / Admittedly, [Concession]. Mind you / Even so, [Counterbalance].
    - '[Point A]. Then again, [Alternative perspective softening certainty].'
  explanation_tr: Türkçede 'gerçi', 'bununla birlikte', 'diğer yandan bakınca' geçişleri
    sohbet akışını yumuşatır. C2 seviyesinde konuşan biri sürekli 'but / however'
    demek yerine bağlama göre 'mind you' (yine de şunu unutma ki) veya 'then again'
    (ama öte yandan) seçer.
  rules:
  - name: Concession Before Counter-Point
    pattern: Granted/Admittedly + True Caveat + ; + that said / still / yet + Main
      Takeaway
    use_cases:
    - Handling skeptical executive questions cleanly in live Q&A sessions
    time_markers:
    - granted
    - that said
    - then again
  contrasts:
  - structure_a: Admittedly, initial batch generation takes ten seconds.
    structure_b: Wait—then again, maybe enterprise legal teams prefer manual CSV exports.
    difference_explanation_en: '''Admittedly'' concedes a clear shortcoming openly;
      ''then again'' weighs an unexpected opposite angle.'
    difference_explanation_tr: '''Admittedly'' bilinen bir kısıtı açıkça kabul eder;
      ''then again'' ise diğer ihtimali masaya koyar.'
  turkish_traps:
  - trap_type: conditional_overgeneralization
    trap_title: Sözlü Kalıp 'Mind You'yu 'Sizi Dikkat Ediyorum / Önemsiyorum' Sanmak
    explanation_tr: '''Mind you'' kelimesi kelimesine ''seni umursamak'' değildir;
      cümle başında/sonunda ''ama şunu da eklemek gerekir ki (gerçi)'' anlamlı bir
      konuşma belirtecidir.'
    incorrect_example: We accept the budget; mind you your hard work on the deck.
    correct_example: The tier looks affordable—mind you, onboarding support fees sit
      on a separate schedule.
  examples:
  - en: Granted, maintaining 150 grammar lessons takes discipline; still, learner
      retention proves the value.
    tr: Kabul etmek gerekir ki 150 dilbilgisi dersini sürdürmek disiplin istiyor;
      yine de öğrenci tutma oranları değerini kanıtlıyor.
    rule_highlight: Granted, ... still,
    context: panel discussion
  - en: The margin looked thin at first—then again, support automation cut recurring
      labor significantly.
    tr: Başta kâr marjı dar görünüyordu; ama öte yandan destek otomasyonu düzenli
      iş gücünü ciddi biçimde azalttı.
    rule_highlight: then again
    context: leadership dialogue
  topic_tags:
  - speaking
  - diplomacy
  - discourse_markers
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.future-past-unfulfilled-perfect
  title: 'Unfulfilled Past Expectations: ''Was to Have Signed'', ''Would Have Expected'''
  cefr_level: C2
  category: tenses_and_aspect
  summary_en: Distinguish open-outcome planned events ('was to launch' — may have
    happened) from explicitly aborted historical intentions ('was to have launched'
    — definitely never happened).
  summary_tr: Gerçekleşip gerçekleşmediği bağlama açık olan 'was to + V1' kalıbıyla,
    kesinlikle iptal edildiği/gerçekleşmediği vurgulanan 'was to have + V3' arasındaki
    farkı kullanın.
  explanation_en:
  - title: Foreclosed History in Official Post-Mortems
    content: Both 'was to begin' and 'was to have begun' talk about past schedules.
      Crucially, 'The audit was to begin Tuesday' can continue cleanly with '...and
      finished on time', whereas 'The audit was to have begun Tuesday' immediately
      alerts readers that the Tuesday start fell through.
    patterns:
    - was/were + to + V1 (neutral past destiny or arrangement)
    - was/were + to have + V3 (aborted arrangement that never materialized)
  explanation_tr: Türkçede 'Salı başlaması planlanıyordu' cümlesi başlasa da başlamasa
    da benzer kurulur; ancak İngilizcede 'was to have started' dinleyiciye ilk kelimeden
    itibaren o planın iptal olduğu sinyalini verir.
  rules:
  - name: Perfect Infinitive After Past 'Be To'
    pattern: Subject + was/were + to have + V3 (+ before disruption X)
    use_cases:
    - Summarizing canceled M&A closings, postponed launches, and disrupted timelines
    time_markers:
    - originally
    - last spring
  contrasts:
  - structure_a: Phase 8 was to shape our long-term offline architecture, and so it
      did.
    structure_b: The courier was to have arrived Tuesday, yet customs strikes halted
      transit.
    difference_explanation_en: '''Was to shape'' reports fulfilled outcome; ''was
      to have arrived'' marks an unfulfilled plan.'
    difference_explanation_tr: '''Was to'' gerçekleşen tarihi sonucu; ''was to have
      V3'' ise boşa çıkan planı vurgular.'
  turkish_traps:
  - trap_type: aspect_confusion
    trap_title: Gerçekleşmiş Başarıyı Anlatırken Yanlışlıkla 'Was To Have V3' Kurmak
    explanation_tr: Başarıyla tamamlanan bir lansmanı '*The rollout was to have happened
      on time and succeeded' diye anlatmak mantık çelişkisi yaratır.
    incorrect_example: The database build was to have passed cleanly on Monday, which
      delighted clients.
    correct_example: The server migration was to have closed Friday, yet hardware
      delays pushed it to Monday.
  examples:
  - en: The joint summit was to have convened in Ankara until severe winter storms
      grounded flights.
    tr: Ortak zirve sert kış fırtınaları uçuşları durdurana kadar Ankara'da toplanacaktı
      (toplanamadı).
    rule_highlight: was to have convened
    context: executive briefing
  - en: That early prototype, modest at launch, was to become the backbone of the
      offline suite.
    tr: Başlangıçta mütevazı olan o erken prototip, ileride çevrimdışı paketin omurgası
      haline gelecekti.
    rule_highlight: was to become
    context: retrospective narrative
  topic_tags:
  - tenses
  - writing
  - reporting
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.tough-movement-evaluative-adjectives
  title: 'Tough-Movement & Evaluative Infinitives: ''Easy to Audit'' Without Trailing
    ''It'''
  cefr_level: C2
  category: verb_patterns_and_infinitives
  summary_en: Promote an infinitive's object to sentence subject cleanly ('This SLA
    is hard to defend' — omitting trailing 'it'), and avoid impossible subjects with
    'possible/impossible/probable'.
  summary_tr: '''This bug is hard to trace'' gibi yapılarda nesne zaten özne konumuna
    taşındığı için sona fazladan ''it'' koymayın; ayrıca ''possible/probable'' sıfatlarını
    kişisel özneye bağlamayın.'
  explanation_en:
  - title: Syntactic Constraints on Evaluative Adjectives
    content: Evaluative adjectives like 'easy, hard, tricky, impossible' undergo tough-movement
      ('This rule is tricky to enforce' — note zero 'it' after 'enforce'!). However,
      keep 'for' + agent clean rather than '*for fixing', and remember '*The timeline
      is probable to slip' is invalid—use 'It is likely that...' or 'is likely to
      slip'.
    patterns:
    - Object-Turned-Subject + be + easy/hard/tough + to + Transitive Verb (NO trailing
      'it'!)
    - It is impossible + to V1 (OK) vs. Subject is impossible + to V1 (rare/restricted
      -> avoid for inanimate probability)
  explanation_tr: Türkçede 'Bu hatayı yakalamak zor' derken zamir tekrarı yapılabilir;
    İngilizcede ise '*This error is hard to catch it' hatası çok sıktır. Ayrıca '*He
    is impossible to come' yerine 'It is impossible for him to come' gerekir.
  rules:
  - name: Zero Pronoun Trace in Tough-Movement
    pattern: Asset X + is + easy/difficult/complex + to + Verb (+ Preposition) [NO
      object pronoun!]
    use_cases:
    - Evaluating usability, legal enforceability, and technical maintainability smoothly
    time_markers:
    - under load
    - in practice
  contrasts:
  - structure_a: Legacy tax scripts are notoriously hard to debug.
    structure_b: This proposal is likely to pass steering committee.
    difference_explanation_en: '''Hard'' promotes the object (''debug [X]'') leaving
      no trailing ''it''; ''likely'' accepts normal subject raising.'
    difference_explanation_tr: '''Hard'' yapısında nesne özneye taşındığı için sonda
      ''it'' kalmaz; ''likely'' ise normal özneyi alır.'
  turkish_traps:
  - trap_type: voice_and_causative_transfer
    trap_title: '''Hard To Audit It'' Fazla Zamiri ve ''*For To Fix'' Hatası'
    explanation_tr: '''Anlaması zor'' kalıbını ''*difficult to understand it'' ya
      da ''*difficult for understanding'' şeklinde kurmak C2 editörlük standartlarında
      hemen elenir.'
    incorrect_example: That multi-column invoice is quite tricky to reconcile it offline.
    correct_example: That multi-column invoice is quite tricky to reconcile offline.
  examples:
  - en: Cleanly partitioned YAML files are remarkably straightforward to validate
      automatically.
    tr: Temiz biçimde bölümlenmiş YAML dosyalarını otomatik doğrulamak son derece
      kolaydır.
    rule_highlight: straightforward to validate
    context: engineering docs
  - en: Negotiators warned that fixed multi-year caps would be tough to renegotiate
      mid-contract.
    tr: Müzakereciler sabit çok yıllık üst sınırların sözleşme ortasında yeniden müzakere
      edilmesinin zor olacağı uyarısında bulundu.
    rule_highlight: tough to renegotiate
    context: commercial strategy
  topic_tags:
  - syntax
  - infinitives
  - writing
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.causal-precision-owing-due-for-fear
  title: 'Causal & Precautionary Precision: ''Owing to'', ''Due to'', ''For Fear That'',
    ''On Account of'''
  cefr_level: C2
  category: discourse_markers_and_cohesion
  summary_en: Separate strictly conservative noun-modifying 'due to' (after 'be' or
    noun) from adverbial 'owing to / because of', alongside formal precautionary 'for
    fear that / lest'.
  summary_tr: Geleneksel resmi yazıda isim veya 'be' fiili niteleyen 'due to' ile
    yüklem zarfı olarak çalışan 'owing to / on account of' ve önlem bağlacı 'for fear
    that'ı hatasız ayırın.
  explanation_en:
  - title: Formal Prescriptive Clarity vs. Everyday Interchangeability
    content: 'While conversational English mixes ''due to'' freely, legal and formal
      copyeditors still check the clean distinction: ''The delay was due to customs
      checks'' (predicate noun complement after ''be''), versus ''Owing to customs
      checks, the delay persisted'' (adverbial cause). Add ''for fear that / for fear
      of -ing'' for cautious motivation.'
    patterns:
    - be + due to + Noun Phrase | Noun + due to + Noun Phrase
    - Owing to + Noun Phrase, + Full Main Clause
    - for fear that + Subject + (might/should) + Verb | for fear of + V-ing
  explanation_tr: Türkçede '...yüzünden / ...nedeniyle' tek yapıda karşılanır. Üst
    düzey İngilizce belgelerde 'due to'nun 'because of' yerine cümle başında kullanılmasına
    karşı resmi stil kılavuzları 'owing to'yu veya 'caused by'ı daha sağlam görür.
  rules:
  - name: Conservative Predicate Test for 'Due To'
    pattern: Can replace with 'caused by' -> due to | Can replace with 'because of'
      modifying verb -> owing to
    use_cases:
    - Drafting incident root-cause notices and formal legal explanations cleanly
    time_markers:
    - owing to
    - for fear of
  contrasts:
  - structure_a: Our confidence loss was strictly due to unverified telemetry.
    structure_b: Owing to unverified telemetry, we suspended public scoring.
    difference_explanation_en: A follows linking verb 'was'; B modifies the main action
      verb 'suspended' cleanly.
    difference_explanation_tr: A 'was' bağ fiilinin yüklemidir; B ise 'suspended'
      eyleminin gerekçesini anlatır.
  turkish_traps:
  - trap_type: preposition_trap
    trap_title: '''Due To + Tam Cümle'' Kullanmak veya ''Because Of'' İle Fiili Yan
      Cümle Başlatmak'
    explanation_tr: '''*Due to we ran out of storage'' hatalıdır; ''due to / owing
      to / on account of'' mutlaka isim öbeği ister, tam cümle değil (tam cümle için
      ''inasmuch as'' veya ''due to the fact that'' kullanılır).'
    incorrect_example: Owing to compliance requested revisions, launch shifted two
      days.
    correct_example: Owing to compliance revision requests, launch shifted two days.
  examples:
  - en: Owing to strict determinism checks, identical inputs always yield byte-identical
      SQLite files.
    tr: Sıkı determinizm kontrolleri sayesinde özdeş girdiler her zaman bayt düzeyinde
      aynı SQLite dosyalarını üretir.
    rule_highlight: Owing to strict determinism checks
    context: technical standard
  - en: Teams froze optional features early for fear that regression fixes might miss
      store deadlines.
    tr: Ekipler gerileme düzeltmelerinin mağaza teslim tarihini kaçırma ihtimaline
      karşın isteğe bağlı özellikleri erkenden dondurdu.
    rule_highlight: for fear that ... might miss
    context: release management
  topic_tags:
  - discourse_markers
  - legal
  - writing
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.uncountable-shiftable-nouns-c2
  title: 'Abstract Countability Shifts: ''Work/Works'', ''Damage/Damages'', ''Scope/Scopes'''
  cefr_level: C2
  category: noun_phrases_and_articles
  summary_en: Master lexical meaning shifts when normally uncountable nouns appear
    in plural legal or technical registers ('damages' = compensation vs. 'damage'
    = harm; 'works' = creative opus/plant).
  summary_tr: Normalde sayılamayan isimlerin çoğul kullanıldığında bambaşka teknik/hukuki
    anlamlara geçtiği yapıları ('damage' hasar / 'damages' tazminat; 'advice' vs 'pieces
    of counsel') ayırt edin.
  explanation_en:
  - title: Plural Inflection Changes Semantic Category
    content: Uncountable 'damage, research, feedback, equipment, compliance' never
      take '-s' for mere quantity ('*three researches'). Yet when C2 legal or engineering
      texts intentionally pluralize 'damages' (financial restitution), 'grounds' (legal
      basis), or 'works' (engineering infrastructure), the word shifts to a specialized
      legal/technical sense.
    patterns:
    - damage (harm, uncountable) vs. damages (monetary court compensation, always
      plural)
    - work (labor, uncountable) vs. works (public infrastructure / collected authored
      titles)
  explanation_tr: Türkçede 'hasarlar / araştırmalar / ekipmanlar' çoğulu normaldir;
    bu yüzden '*many informations / *heavy damages to the server' hataları yaygındır.
    'Damages' yalnızca mahkeme tazminatında çoğul kullanılır.
  rules:
  - name: Zero Plural for Mass Abstract Concepts vs. Legal Plurals
    pattern: feedback/research/advice (singular verb) | damages/grounds/proceeds (specialized
      plural)
    use_cases:
    - Distinguishing physical harm from contractual indemnification in legal reviews
    time_markers:
    - under clause 8
    - across studies
  contrasts:
  - structure_a: The hardware outage caused severe reputational damage.
    structure_b: The vendor agreed to pay liquidated damages for missed uptime.
    difference_explanation_en: A names physical/brand harm ('damage', uncountable);
      B names financial restitution ('damages').
    difference_explanation_tr: A zarar/hasarı (sayılamaz 'damage'), B ise maddi tazminat
      cezasını ('damages') ifade eder.
  turkish_traps:
  - trap_type: preposition_trap
    trap_title: Fiziksel veya Veri Zararı İçin 'Damages' Çoğulu Yazmak
    explanation_tr: '''Büyük hasarlar verdik'' çevirisiyle ''*caused heavy damages
      to the table'' yazmak anlamı komik biçimde ''tazminat ödettik''e yaklaştırır;
      doğrusu ''extensive damage''dır.'
    incorrect_example: Skipping migration checks caused multiple damages to local
      user tables.
    correct_example: Skipping migration checks caused extensive damage to local user
      tables.
  examples:
  - en: Recent pedagogical research suggests spaced recall outweighs passive rereading
      twice over.
    tr: Güncel pedagojik araştırmalar aralıklı hatırlamanın pasif tekrar okumanın
      iki katı etkili olduğunu gösteriyor.
    rule_highlight: research suggests
    context: academic summary
  - en: The supplier disputed statutory damages on the grounds that force majeure
      clauses applied.
    tr: Tedarikçi mücbir sebep maddelerinin geçerli olduğu gerekçesiyle yasal tazminat
      tutarına itiraz etti.
    rule_highlight: disputed statutory damages on the grounds that
    context: arbitration brief
  topic_tags:
  - nouns
  - legal
  - academic
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.subjunctive-condition-assuming-provided-save
  title: 'Contractual Stipulations & Exception Conditionals: ''Provided That'', ''Save
    That'', ''Barring'''
  cefr_level: C2
  category: conditionals_and_hypotheticals
  summary_en: Introduce strict prerequisite carve-outs and legal provisos cleanly
    with 'provided (that)', 'on condition that', 'barring + NP', and 'save that /
    except insofar as'.
  summary_tr: Hukuki ve stratejik belgelerde katı ön şart veya istisna şerhi düşerken
    'provided (that)' (...şartıyla), 'barring' (...hariç/olmadıkça) ve 'save that'
    kalıplarını şimdiki kip şart kuralıyla kurun.
  explanation_en:
  - title: No 'Will' Inside Conditional Proviso Clauses
    content: 'Just like ''if'', formal conditional linkers (''provided that'', ''on
      condition that'', ''assuming arguments hold'') forbid future ''will'' inside
      the condition clause: write ''Provided telemetry clears cleanly on Friday, rollout
      proceeds Monday.'' Use ''barring + Noun'' as a sleek negative precondition (''Barring
      customs delays...'').'
    patterns:
    - Provided (that) / On condition that + Present Simple, + Main Future/Modal
    - Barring + Unforeseen Event Noun, + Projected Outcome
    - Main Clause, + save that + Limited Legal Exception Clause
  explanation_tr: Türkçede 'Gümrük aksamazsa / aksaklık olmazsa' ile 'Tek bir istisna
    dışında...' yapıları sözleşme dilinde 'barring' ve 'save that' ile çok zarif kısalır;
    ancak ön koşul cümlesine 'will' sokmamaya özen gösterin.
  rules:
  - name: Present Tense Provisos Under 'Provided / Assuming'
    pattern: Provided that + Present Simple (condition) + , + Future / Modal (result)
    use_cases:
    - Drafting go/no-go launch criteria and commercial indemnity exclusions
    time_markers:
    - pending
    - barring delays
    - save that
  contrasts:
  - structure_a: Provided build integrity passes Friday, migration runs Monday.
    structure_b: Barring unexpected carrier downtime, sync completes in ten minutes.
    difference_explanation_en: '''Provided'' states a required positive gate; ''barring''
      carves out a blocking negative exception.'
    difference_explanation_tr: '''Provided'' sağlanması şart olan olumlu eşiği; ''barring''
      ise bozabilecek olumsuz istisnayı dışlar.'
  turkish_traps:
  - trap_type: conditional_overgeneralization
    trap_title: '''Provided That'' İçi Yan Cümlede ''Will'' Kullanmak'
    explanation_tr: '''Onaylanacağı şartıyla'' ifadesini ''*provided that it will
      pass'' şeklinde kurmak temel şart cümlesi kuralını bozar; doğrusu ''provided
      that it passes''tır.'
    incorrect_example: The license renews cleanly provided that finance will remit
      wire payment Monday.
    correct_example: The license renews cleanly provided that finance remits wire
      payment Monday.
  examples:
  - en: The two content builds are identical, save that release signatures follow
      regional keychains.
    tr: Sürüm imzalarının bölgesel anahtarlıklara uyması dışında iki içerik derlemesi
      birebir aynıdır.
    rule_highlight: save that
    context: release documentation
  - en: Barring unforeseen payment gateway maintenance, quarterly invoices settle
      automatically.
    tr: Öngörülmeyen ödeme ağ geçidi bakımı yaşanmadığı sürece üç aylık faturalar
      otomatik tahsil edilir.
    rule_highlight: Barring unforeseen
    context: operations SLA
  topic_tags:
  - conditionals
  - legal
  - governance
  related_ids: []
  status: APPROVED
  version: 1
- id: grammar.c2.double-comparative-qualification
  title: 'Analytical Degree Nuance: ''All the More'', ''Far From'', ''None the Worse
    / Wiser'''
  cefr_level: C2
  category: cleft_sentences
  summary_en: 'Sharpen rhetorical weight and comparative qualification using fixed
    degree idioms: ''all the more + adj (for/because)'', ''far from + V-ing/adj'',
    and ''none the + comparative''.'
  summary_tr: Analitik karşılaştırmalara ustalık katmak için 'all the more impressive
    for...' (buna rağmen/bu yüzden bir kat daha etkileyici), 'far from + -ing' (hiç
    de ... değil aksine) ve 'none the wiser' kalıplarını kurun.
  explanation_en:
  - title: Expressing Amplified Value Despite—or Because of—Constraints
    content: '''All the more'' adds extra significance precisely because of a cited
      condition (''Offline speed is all the more critical given subway blackouts'').
      Note ''far from + gerund/adjective'' sits smoothly at the front to refute expectations
      cleanly without negative ''not''.'
    patterns:
    - is + all the more + Adj / Adv + for + Noun / because...
    - Far from + V-ing / Adjective, + Subject + Opposite Verb...
    - no(ne) the + Comparative (wiser / worse / less urgent)
  explanation_tr: Türkçede 'Sorunu çözmek şöyle dursun, daha da karmaşıklaştırdı'
    kalıbı 'Far from solving the issue, it complicated...' ile birebir ve kusursuz
    biçimde verilir. Başındaki fiil daima '-ing' alır!
  rules:
  - name: Fronted 'Far From' Requires Gerund or Adjective
    pattern: Far from + V-ing / Adj + , + Subject + Main Clause (requires explicit
      subject match)
    use_cases:
    - Correcting flawed executive narratives cleanly in high-stakes meetings
    time_markers:
    - all the more so
    - far from
  contrasts:
  - structure_a: Far from slowing QA down, deterministic seeds cut triage in half.
    structure_b: Deterministic speed makes local caching all the more compelling for
      frequent flyers.
    difference_explanation_en: '''Far from'' flips an anticipated critique; ''all
      the more'' heightens relevance given context.'
    difference_explanation_tr: '''Far from'' beklenen olumsuzluğu tamamen tersine
      çevirir; ''all the more'' ise bir neden yüzünden değeri katlar.'
  turkish_traps:
  - trap_type: aspect_confusion
    trap_title: '''Far From'' Sonrasında Yalın Fiil veya Çekimli Cümle Kurmak'
    explanation_tr: '''Maliyeti düşürmek bir yana'' ifadesinde ''far from'' bir edat
      öbeğidir; arkasına ''*far from to reduce'' veya ''*far from it reduces'' değil
      ''far from reducing'' gelmelidir.'
    incorrect_example: Far from solve legacy churn, rushed discounts widened Q3 losses.
    correct_example: Far from solving legacy churn, rushed discounts widened Q3 losses.
  examples:
  - en: Far from diluting rigor, pairing concise definitions with Turkish traps accelerates
      recall.
    tr: Titizliği azaltmak şöyle dursun, özlü tanımları Türkçe tuzaklarla eşleştirmek
      hatırlamayı hızlandırır.
    rule_highlight: Far from diluting rigor
    context: curriculum manifesto
  - en: Maintaining deterministic packaging is all the more vital once curriculum
      entries cross five thousand.
    tr: Müfredat kayıtları beş bini aştığında deterministik paketlemeyi korumak bir
      kat daha hayati hale gelir.
    rule_highlight: is all the more vital
    context: architecture note
  topic_tags:
  - comparison
  - rhetoric
  - writing
  related_ids: []
  status: APPROVED
  version: 1
